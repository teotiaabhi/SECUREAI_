- rule_id: PT-GO-004
  title: ioutil.ReadFile / os.ReadFile with User-Controlled Input
  description: 'Detects usage of Go''s ioutil.ReadFile (deprecated) or os.ReadFile (Go 1.16+) where the file path originates
    from user-controlled input. These functions read an entire file into memory and are commonly used for configuration loading,
    template rendering, and data processing. When the path is derived from HTTP parameters, router variables, or form data
    without validation, attackers can read arbitrary files. The simplicity of these one-liner file reads makes them especially
    common in quick handlers vulnerable to traversal.

    '
  language: go
  category: path_traversal
  severity: High
  confidence: 0.91
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  tags:
  - path-traversal
  - file-read
  - ioutil
  - os-readfile
  - golang
  - server-side
  - cwe-22
  - owasp-a01
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: (?:ioutil|os)\.ReadFile\s*\(\s*(?:r\s*\.\s*(?:URL\.Query\s*\(\s*\)\s*\.\s*Get|FormValue|PathValue)\s*\()
    description: ReadFile with HTTP request parameter
  - type: regex
    pattern: (?:ioutil|os)\.ReadFile\s*\(\s*(?:filePath|fileName|userPath|inputPath|docPath|targetFile)\s*\)
    description: ReadFile with common user-controlled variable names
  - type: regex
    pattern: (?:ioutil|os)\.ReadFile\s*\(\s*(?:filepath\.Join\s*\(\s*[^)]*(?:r\.|req\.|param|input|user))
    description: ReadFile with filepath.Join containing user input
  - type: regex
    pattern: (?:ioutil|os)\.ReadFile\s*\(\s*(?:fmt\.Sprintf\s*\(\s*"[^"]*"\s*,\s*[^)]*(?:r\.|param|input|user))
    description: ReadFile with fmt.Sprintf interpolating user data
  - type: regex
    pattern: (?:ioutil|os)\.ReadFile\s*\(\s*(?:mux\.Vars\s*\(\s*r\s*\)\s*\[\s*|chi\.URLParam\s*\(|c\.Param\s*\(|c\.Query\s*\(|ctx\.Param\s*\(|ctx\.Query\s*\()
    description: ReadFile with router framework parameter extraction
  - type: regex
    pattern: (?:ioutil|os)\.ReadFile\s*\(\s*(?:\w+\s*\+\s*(?:r\.|req\.|param|fileName|userInput))
    description: ReadFile with string concatenation of user data
  - type: regex
    pattern: ioutil\.ReadAll\s*\(\s*(?:os\.Open\s*\(\s*[^)]*(?:filePath|fileName|userPath|r\.))
    description: ioutil.ReadAll wrapping os.Open with user-controlled path
  - type: regex
    pattern: (?:ioutil|os)\.ReadFile\s*\(\s*(?:path)\s*\)[\s\S]{0,30}(?:json\.Unmarshal|yaml\.Unmarshal|template\.Parse|w\.Write)
    description: ReadFile with generic path variable followed by common processing
  anti_patterns:
  - filepath\.Clean\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(
  - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(
  - if\s+strings\.Contains\s*\(\s*\w+\s*,\s*"\.\."\s*\)
  - if\s+!strings\.HasPrefix\s*\(
  - filepath\.Base\s*\(
  - securejoin\.SecureJoin\s*\(
  - (?:ioutil|os)\.ReadFile\s*\(\s*"[^"]*"\s*\)
  - if\s+filepath\.IsAbs\s*\(
  - allowedFiles\[\w+\]
  - validatePath\s*\(
  - sanitizePath\s*\(
  - filepath\.EvalSymlinks\s*\(
  - filepath\.Rel\s*\([^)]+\)[\s\S]{0,100}HasPrefix\s*\(\s*\w+\s*,\s*"\.\."
  - io\.LimitReader\s*\(
  - whitelist\s*\[\s*\w+\s*\]
  bypass_variants:
  - description: URL-encoded traversal
    pattern: (?:%2e%2e%2f|%2e%2e\/|\.\.%2f)
  - description: Double URL encoding
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - description: Null byte injection
    pattern: (?:%00|\\x00)
  - description: Backslash on Windows Go
    pattern: (?:\.\.\\\\|\.\.%5c)
  - description: Absolute path injection
    pattern: (?:^\/|^[A-Za-z]:\\\\)
  evasion_indicators:
  - URL-encoded traversal in HTTP parameters
  - Double encoding to bypass decode
  - Null byte injection
  - Backslash on Windows
  - Absolute path injection
  encoding_variants:
  - type: url_encoding
    pattern: (?:%2e%2e%2f|%2e%2e%5c|\.\.%2f|\.\.%5c)
  - type: double_encoding
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - type: null_byte
    pattern: (?:%00|\\x00)
  - type: unicode_encoding
    pattern: (?:%c0%ae%c0%ae%c0%af)
  multi_function_chain_patterns:
  - r.URL.Query().Get('file') -> os.ReadFile()
  - mux.Vars(r)['name'] -> filepath.Join -> os.ReadFile()
  - c.Query('config') -> os.ReadFile() -> json.Unmarshal
  - r.FormValue('template') -> ioutil.ReadFile() -> template.Parse
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: ReadFile reads entire file contents into memory, enabling immediate exfiltration of credentials and
      keys
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: r.URL.Query().Get('file')
    sink: os.ReadFile(filePath)
    through: direct parameter or filepath.Join
  - source: mux.Vars(r)['config']
    sink: ioutil.ReadFile(configPath)
    through: router variable to variable assignment
  - source: c.Query('template')
    sink: os.ReadFile(filepath.Join(tplDir, name))
    through: Gin query parameter
  impact: 'ReadFile reads the entire file into memory and returns it as a byte

    slice, making it trivial for an attacker to exfiltrate complete file

    contents in a single request. High-value targets include: Go application

    configuration files, .env and environment files, TLS private keys and

    certificates, database credential files, SSH private keys, /proc/self/environ

    for environment variable exposure, and application source code. The

    memory-efficient read makes even large files like database dumps

    exfiltrable.

    '
  remediation: "1. Validate path before reading:\n\n   base, _ := filepath.Abs(dataDir)\n   target, _ := filepath.Abs(filepath.Join(base,\
    \ userInput))\n   if !strings.HasPrefix(target, base+string(os.PathSeparator)) {\n       http.Error(w, \"Forbidden\",\
    \ http.StatusForbidden)\n       return\n   }\n   data, err := os.ReadFile(target)\n\n2. Use filepath.Base() for filename-only\
    \ reads:\n\n   safeName := filepath.Base(userInput)\n   data, err := os.ReadFile(filepath.Join(dataDir, safeName))\n\n\
    3. Use securejoin for safe path construction.\n4. Implement file allowlists or ID-based lookups.\n5. Set file size limits\
    \ with io.LimitReader on os.Open.\n"
  references:
  - https://pkg.go.dev/os#ReadFile
  - https://cwe.mitre.org/data/definitions/22.html
  - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  context_awareness:
    surrounding_context_patterns:
    - func\s+\w+\s*\(\s*w\s+http\.ResponseWriter
    - func\s+\w+\s*\(\s*c\s+\*gin\.Context
    - func\s+\w+\s*\(\s*ctx\s+echo\.Context
    - http\.HandleFunc\s*\(
    taint_source_indicators:
    - r\.URL\.Query\(\)\.Get\s*\(
    - r\.FormValue\s*\(
    - mux\.Vars\s*\(
    - c\.Param\s*\(
    - c\.Query\s*\(
    - chi\.URLParam\s*\(
    taint_sink_indicators:
    - os\.ReadFile\s*\(
    - ioutil\.ReadFile\s*\(
    sanitization_patterns:
    - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}HasPrefix
    - filepath\.Base\s*\(
    - securejoin\.SecureJoin\s*\(
    - strings\.Contains\s*\(\s*\w+\s*,\s*"\.\."
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_coverage)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Go API handler at GET /api/config?name=app.json reads configuration

      files using data, _ := os.ReadFile(filepath.Join(configDir,

      r.URL.Query().Get("name"))). The attacker sends GET

      /api/config?name=../../../etc/shadow. The os.ReadFile call resolves

      the traversal and reads the shadow password file. The entire file

      contents are returned in the HTTP response, exposing hashed passwords

      for all system accounts.

      '
    example_payload: ../../../etc/shadow
    attacker_objective: Read complete file contents including sensitive system and application configuration files
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PT-GO-001
    - PT-GO-002
    - PT-JS-001
- rule_id: PT-GO-005
  title: archive/zip Extraction Path Traversal (ZIP Slip)
  description: 'Detects ZIP Slip vulnerabilities when extracting ZIP or TAR archives using Go''s archive/zip or archive/tar
    packages without validating that extracted file paths remain within the target directory. Go''s archive packages do not
    prevent path traversal by default. An attacker can craft malicious archives with entries containing ../../ paths that
    write files to arbitrary filesystem locations during extraction, leading to remote code execution via binary or script
    overwrite.

    '
  language: go
  category: path_traversal
  severity: High
  confidence: 0.91
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  tags:
  - path-traversal
  - zip-slip
  - archive-extraction
  - archive-zip
  - archive-tar
  - golang
  - rce-potential
  - cwe-22
  - owasp-a01
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: zip\.OpenReader\s*\(\s*(?:filePath|uploadPath|archivePath|userInput|zipPath|file)\b
    description: zip.OpenReader with user-controlled path
  - type: regex
    pattern: zip\.NewReader\s*\(\s*(?:r\.|req\.|file|reader|body|upload)\b
    description: zip.NewReader with user-provided reader
  - type: regex
    pattern: (?:f|entry|file)\s*\.\s*Name\b[\s\S]{0,300}(?:os\.(?:Create|OpenFile|MkdirAll)\s*\(\s*(?:filepath\.Join|path\.Join|fmt\.Sprintf|target|dest))
    description: ZIP entry Name used in file creation without validation
  - type: regex
    pattern: filepath\.Join\s*\(\s*(?:destDir|outputDir|extractDir|targetDir)\s*,\s*(?:f|entry|file|header)\s*\.\s*Name\s*\)
    description: filepath.Join with destination directory and entry name
  - type: regex
    pattern: tar\.NewReader\s*\(\s*(?:r\.|req\.|file|reader|body|upload)\b
    description: tar.NewReader with user-provided reader
  - type: regex
    pattern: (?:header|hdr)\s*\.\s*Name\b[\s\S]{0,300}(?:os\.(?:Create|OpenFile|MkdirAll)\s*\(\s*(?:filepath\.Join|path\.Join|target|dest))
    description: TAR header Name used in file creation without validation
  - type: regex
    pattern: for\s+_\s*,\s*(?:f|file)\s+:=\s+range\s+\w+\.File\s*\{[\s\S]{0,500}(?:os\.Create|os\.OpenFile|io\.Copy)
    description: Range over zip.File slice with file operations in loop
  - type: regex
    pattern: for\s*\{[\s\S]{0,100}(?:tar|zip)[\s\S]{0,200}(?:header|entry|f)\.\s*Name[\s\S]{0,200}(?:os\.Create|os\.OpenFile|io\.Copy)
    description: Extraction loop reading archive entries and writing files
  anti_patterns:
  - if\s+strings\.Contains\s*\(\s*(?:f|entry|file|header)\s*\.\s*Name\s*,\s*"\.\."\s*\)
  - if\s+!strings\.HasPrefix\s*\(\s*\w+\s*,\s*(?:destDir|targetDir|outputDir)
  - filepath\.Clean\s*\(\s*(?:f|entry|file)\s*\.\s*Name\s*\)[\s\S]{0,100}strings\.HasPrefix
  - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix
  - securejoin\.SecureJoin\s*\(
  - filepath\.Rel\s*\([^)]+\)[\s\S]{0,100}HasPrefix\s*\(\s*\w+\s*,\s*"\.\."
  - if\s+filepath\.IsAbs\s*\(\s*(?:f|entry|file|header)\s*\.\s*Name\s*\)
  - filepath\.EvalSymlinks\s*\(
  - return\s+fmt\.Errorf\s*\(\s*"[^"]*(?:traversal|malicious|invalid path)[^"]*"
  - log\.(?:Fatal|Warn|Error)\s*\(\s*"[^"]*(?:traversal|zip slip)[^"]*"
  - if\s+strings\.HasPrefix\s*\(\s*\w+\s*,\s*string\s*\(\s*os\.PathSeparator\s*\)\s*\)
  - sanitizeEntryName\s*\(
  - validateArchiveEntry\s*\(
  - filepath\.Base\s*\(\s*(?:f|entry|file|header)\s*\.\s*Name\s*\)
  - if\s+header\.Typeflag\s*==\s*tar\.TypeSymlink
  bypass_variants:
  - description: Archive entry with URL-encoded traversal path
    pattern: (?:%2e%2e%2f|%2e%2e\/|\.\.%2f)
  - description: Archive entry with double encoding
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - description: Archive entry with null byte
    pattern: (?:%00|\\x00)
  - description: Archive entry with absolute path
    pattern: (?:^\/|^[A-Za-z]:\\\\)
  - description: Archive entry with backslash separators for Windows
    pattern: (?:\.\.\\\\|\.\.%5c)
  evasion_indicators:
  - Archive entries with relative traversal paths
  - Archive entries with absolute paths
  - Mixed path separators in entry names
  - Symbolic link entries pointing outside directory
  - Nested archives containing traversal entries
  encoding_variants:
  - type: url_encoding
    pattern: (?:%2e%2e%2f|%2e%2e%5c|\.\.%2f|\.\.%5c)
  - type: double_encoding
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - type: null_byte
    pattern: (?:%00|\\x00)
  - type: unicode_encoding
    pattern: (?:%c0%ae%c0%ae%c0%af)
  multi_function_chain_patterns:
  - uploaded file -> zip.NewReader -> f.Name -> os.Create(filepath.Join(dest, name))
  - file path -> zip.OpenReader -> range r.File -> io.Copy
  - uploaded archive -> tar.NewReader -> header.Name -> os.Create
  - request body -> zip.NewReader -> entry.Name -> os.OpenFile
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: ZIP Slip writes arbitrary files enabling RCE through binary overwrite, cron injection, or Go source
      modification
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-uploaded ZIP/TAR file
    sink: os.Create(filepath.Join(destDir, f.Name))
    through: archive entry Name field
  - source: archive entry header.Name
    sink: os.OpenFile(target, os.O_WRONLY|os.O_CREATE)
    through: extraction loop
  - source: uploaded archive
    sink: io.Copy(outFile, rc)
    through: zip.File.Open() to file write
  impact: 'ZIP Slip in Go enables writing arbitrary files during archive extraction.

    Go binaries often run as system services with elevated privileges.

    Exploitation scenarios include: overwriting the Go binary itself for

    persistent RCE, writing to system cron directories for scheduled

    execution, replacing systemd service units, modifying /etc/passwd or

    authorized_keys for persistent access, and deploying reverse shells.

    Container environments are also vulnerable if the extraction directory

    shares a mount with sensitive paths.

    '
  remediation: "1. Validate every entry path before extraction:\n\n   func safeExtract(destDir string, f *zip.File) error\
    \ {\n       target := filepath.Join(destDir, f.Name)\n       realDest, _ := filepath.Abs(destDir)\n       realTarget,\
    \ _ := filepath.Abs(target)\n       if !strings.HasPrefix(realTarget, realDest+string(os.PathSeparator)) {\n         \
    \  return fmt.Errorf(\"zip slip detected: %s\", f.Name)\n       }\n       // Safe to extract\n       return nil\n   }\n\
    \n2. Use github.com/cyphar/filepath-securejoin:\n\n   safePath, err := securejoin.SecureJoin(destDir, f.Name)\n\n3. Reject\
    \ entries with absolute paths or '..' components.\n4. Check for and skip symbolic links in archives.\n5. Extract to a\
    \ temporary directory and validate before moving.\n"
  references:
  - https://snyk.io/research/zip-slip-vulnerability
  - https://pkg.go.dev/archive/zip
  - https://cwe.mitre.org/data/definitions/22.html
  context_awareness:
    surrounding_context_patterns:
    - import\s+"archive/zip"
    - import\s+"archive/tar"
    - func\s+\w+\s*\(\s*w\s+http\.ResponseWriter
    - func\s+\w+(?:Extract|Unzip|Decompress)\s*\(
    taint_source_indicators:
    - r\.Body
    - r\.FormFile\s*\(
    - f\.Name
    - header\.Name
    - entry\.Name
    taint_sink_indicators:
    - os\.Create\s*\(
    - os\.OpenFile\s*\(
    - os\.MkdirAll\s*\(
    - io\.Copy\s*\(
    sanitization_patterns:
    - strings\.HasPrefix\s*\(\s*\w+\s*,\s*(?:destDir|outputDir)
    - strings\.Contains\s*\(\s*\w+\s*,\s*"\.\."
    - filepath\.Base\s*\(\s*(?:f|entry|file|header)\.Name
    - securejoin\.SecureJoin\s*\(
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_coverage)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'An attacker creates a ZIP archive with an entry named

      ../../../usr/local/bin/myservice (the Go binary name). The malicious

      entry contains a backdoored version of the service. When a file

      processing handler extracts the ZIP using range r.File with

      os.Create(filepath.Join(destDir, f.Name)), the binary is overwritten.

      The next service restart or systemd reload executes the attacker''s

      backdoored binary with service credentials.

      '
    example_payload: ../../../usr/local/bin/myservice
    attacker_objective: Write arbitrary files outside the extraction directory to achieve remote code execution
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PT-GO-001
    - PT-JS-005
    - PT-PY-005
    - PT-JAVA-005
    - PT-PHP-003
- rule_id: PT-GO-006
  title: net/http.FileServer Directory Escape
  description: 'Detects path traversal vulnerabilities in Go''s http.FileServer and http.Dir configuration. While http.FileServer
    with http.Dir provides basic path cleaning, certain configurations can be exploited: using a custom http.FileSystem implementation
    without proper validation, combining http.StripPrefix with incorrect prefix patterns, or passing user-controlled values
    to http.Dir. Additionally, http.FileServer exposes directory listings by default, which aids attackers in reconnaissance.
    Symlink traversal within the served directory can also escape the intended scope.

    '
  language: go
  category: path_traversal
  severity: Medium
  confidence: 0.82
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  tags:
  - path-traversal
  - file-server
  - http-dir
  - directory-listing
  - golang
  - static-files
  - cwe-22
  - owasp-a01
  detection_layer: 3
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: http\.FileServer\s*\(\s*http\.Dir\s*\(\s*(?:r\s*\.\s*(?:URL\.Query|FormValue)|filePath|userPath|userInput|param)\b
    description: http.FileServer with http.Dir using user-controlled root
  - type: regex
    pattern: http\.Dir\s*\(\s*(?:r\s*\.\s*(?:URL\.Query|FormValue)|os\.Getenv|config|settings)\s*[\(\[]
    description: http.Dir with dynamic/user-influenced root directory
  - type: regex
    pattern: http\.StripPrefix\s*\(\s*""\s*,
    description: http.StripPrefix with empty prefix (no stripping)
  - type: regex
    pattern: http\.FileServer\s*\(\s*(?:customFS|myFS|userFS|dynamicFS)\s*\)
    description: http.FileServer with custom FileSystem that may lack validation
  - type: regex
    pattern: func\s*\(\s*\w+\s+\w+\s*\)\s*Open\s*\(\s*name\s+string\s*\)\s*\(\s*http\.File[\s\S]{0,500}(?:os\.Open|filepath\.Join)(?![\s\S]{0,100}HasPrefix)
    description: Custom FileSystem Open method without path validation
  - type: regex
    pattern: http\.FileServer\s*\(\s*http\.Dir\s*\(\s*(?:filepath\.Join\s*\(\s*[^)]*(?:r\.|req\.|param|input|user))
    description: http.FileServer with http.Dir root from filepath.Join with user input
  - type: regex
    pattern: http\.Handle\s*\(\s*"/"\s*,\s*http\.FileServer\s*\(\s*http\.Dir\s*\(\s*"\.\/"
    description: http.FileServer serving project root (exposes source code)
  - type: regex
    pattern: http\.FileServer\s*\(\s*http\.FS\s*\(\s*(?:os\.DirFS\s*\(\s*(?:userDir|param|input|r\.))
    description: http.FileServer with os.DirFS using user-controlled directory
  anti_patterns:
  - http\.FileServer\s*\(\s*http\.Dir\s*\(\s*"[^"]*"\s*\)\s*\)
  - http\.StripPrefix\s*\(\s*"[^"]+"\s*,\s*http\.FileServer
  - noDirectoryListing\s*\(
  - if\s+strings\.Contains\s*\(\s*r\.URL\.Path\s*,\s*"\.\."\s*\)
  - func\s*\(\s*\w+\s+\w+\s*\)\s*Open\s*\([^)]*\)[\s\S]{0,300}strings\.HasPrefix
  - neuteredFileSystem
  - noDirListing
  - type\s+\w+\s+struct\s*\{\s*http\.FileSystem\s*\}
  - http\.Dir\s*\(\s*filepath\.Clean\s*\(
  - if\s+info\.IsDir\s*\(\s*\)\s*\{[\s\S]{0,100}http\.NotFound
  - http\.FileServer\s*\(\s*http\.FS\s*\(\s*embed\.
  - securejoin\.SecureJoin\s*\(
  - if\s+!strings\.HasPrefix\s*\(\s*name
  - r\.URL\.Path\s*=\s*path\.Clean\s*\(\s*r\.URL\.Path\s*\)
  - //go:embed
  bypass_variants:
  - description: URL-encoded traversal in HTTP path
    pattern: (?:%2e%2e%2f|%2e%2e\/|\.\.%2f)
  - description: Double encoding to bypass http.CleanPath
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - description: Null byte in URL path
    pattern: (?:%00|\\x00)
  - description: Backslash traversal on Windows
    pattern: (?:\.\.\\\\|\.\.%5c)
  - description: Symlink traversal within served directory
    pattern: (?:symlink|ln\s+-s)
  evasion_indicators:
  - URL encoding in HTTP request path
  - Double encoding to bypass CleanPath
  - Symlink creation within served directory
  - Backslash on Windows Go deployments
  - Directory listing to discover file structure
  encoding_variants:
  - type: url_encoding
    pattern: (?:%2e%2e%2f|%2e%2e%5c|\.\.%2f|\.\.%5c)
  - type: double_encoding
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - type: null_byte
    pattern: (?:%00|\\x00)
  - type: unicode_encoding
    pattern: (?:%c0%ae%c0%ae%c0%af)
  multi_function_chain_patterns:
  - user-controlled http.Dir root -> http.FileServer
  - custom FileSystem.Open -> os.Open without validation
  - dynamic StripPrefix -> http.FileServer
  - config.rootDir -> http.Dir -> http.FileServer
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Directory escape through FileServer exposes server filesystem and enables reconnaissance for further
      attacks
  business_logic_indicator:
    financial_impact: false
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-controlled directory path
    sink: http.Dir(userPath)
    through: configuration or request parameter
  - source: HTTP request URL path
    sink: custom FileSystem.Open(name)
    through: http.FileServer routing
  - source: symlink within served directory
    sink: http.Dir Open()
    through: filesystem symlink resolution
  impact: 'Directory escape through http.FileServer enables access to files outside

    the intended static file directory. Combined with default directory

    listing, attackers can enumerate the server filesystem structure, identify

    sensitive files, and download them. Custom FileSystem implementations

    without proper validation are particularly dangerous as they bypass

    http.Dir''s built-in cleaning. Symlink traversal within the served

    directory can access any file on the filesystem even when http.Dir is

    properly configured. This aids in reconnaissance and targeted

    file exfiltration.

    '
  remediation: "1. Hardcode the http.Dir root to a static path:\n\n   fs := http.FileServer(http.Dir(\"/app/public\"))\n \
    \  http.Handle(\"/static/\", http.StripPrefix(\"/static/\", fs))\n\n2. Disable directory listing with a custom FileSystem:\n\
    \n   type neuteredFileSystem struct {\n       fs http.FileSystem\n   }\n   func (nfs neuteredFileSystem) Open(path string)\
    \ (http.File, error) {\n       f, err := nfs.fs.Open(path)\n       if err != nil { return nil, err }\n       s, _ := f.Stat()\n\
    \       if s.IsDir() {\n           index := filepath.Join(path, \"index.html\")\n           if _, err := nfs.fs.Open(index);\
    \ err != nil {\n               closeErr := f.Close()\n               if closeErr != nil { return nil, closeErr }\n   \
    \            return nil, os.ErrNotExist\n           }\n       }\n       return f, nil\n   }\n\n3. Use embed.FS for embedded\
    \ static files (Go 1.16+).\n4. Never derive http.Dir root from user input.\n5. Remove or restrict symlinks within served\
    \ directories.\n"
  references:
  - https://pkg.go.dev/net/http#FileServer
  - https://pkg.go.dev/net/http#Dir
  - https://cwe.mitre.org/data/definitions/22.html
  context_awareness:
    surrounding_context_patterns:
    - func\s+main\s*\(
    - http\.ListenAndServe\s*\(
    - http\.Handle\s*\(
    - mux\.\w+\s*\(
    taint_source_indicators:
    - r\.URL\.Path
    - r\.URL\.Query\(\)
    - os\.Getenv\s*\(
    - config\.[\w.]+
    taint_sink_indicators:
    - http\.Dir\s*\(
    - http\.FileServer\s*\(
    - http\.StripPrefix\s*\(
    - os\.DirFS\s*\(
    sanitization_patterns:
    - http\.StripPrefix\s*\(\s*"[^"]+"\s*,\s*http\.FileServer
    - path\.Clean\s*\(
    - \.IsDir\s*\(\s*\)[\s\S]{0,100}NotFound
    - embed\.FS
  severity_scoring:
    severity_weight: 7
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_coverage)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Go application uses http.FileServer(http.Dir(configuredRoot)) where

      configuredRoot comes from an environment variable set to the application

      root. An attacker sends GET /../../etc/passwd. While http.Dir''s built-in

      cleaning blocks simple traversal, a symlink placed inside the served

      directory (e.g., by an earlier upload vulnerability) at

      /app/public/link -> /etc/ allows GET /static/link/passwd to bypass

      the directory restriction. Additionally, the default directory listing

      reveals all files and subdirectories, aiding reconnaissance.

      '
    example_payload: ../../etc/passwd
    attacker_objective: Escape the served directory to access arbitrary files and enumerate the filesystem through directory
      listing
