rules:
- rule_id: PT-GO-001
  title: os.Open with User-Controlled File Path
  description: 'Detects usage of Go''s os.Open, os.OpenFile, os.Create, and os.ReadFile where the file path argument originates
    from user-controlled input such as HTTP request parameters, URL path segments, form values, or JSON body fields. An attacker
    can inject path traversal sequences like ../../etc/passwd to read or write arbitrary files on the server filesystem. Go
    does not perform any automatic path validation in its os package functions, making explicit validation essential.

    '
  language: go
  category: path_traversal
  severity: Critical
  confidence: 0.92
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  tags:
  - path-traversal
  - file-read
  - file-write
  - os-open
  - golang
  - server-side
  - cwe-22
  - owasp-a01
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: os\.Open\s*\(\s*(?:r\s*\.\s*(?:URL\.Query\s*\(\s*\)\s*\.\s*Get|FormValue|PathValue)\s*\(|req\s*\.\s*(?:URL\.Query|FormValue))
    description: os.Open with HTTP request parameter
  - type: regex
    pattern: os\.OpenFile\s*\(\s*(?:r\s*\.\s*(?:URL\.Query\s*\(\s*\)\s*\.\s*Get|FormValue|PathValue)\s*\(|filePath|fileName|userPath)\b
    description: os.OpenFile with user-controlled path
  - type: regex
    pattern: os\.(?:Open|Create|ReadFile)\s*\(\s*(?:filePath|fileName|userPath|inputPath|docPath|targetFile)\s*[,\)]
    description: os file operations with common user-controlled variable names
  - type: regex
    pattern: os\.(?:Open|Create|ReadFile)\s*\(\s*(?:filepath\.Join\s*\(\s*[^)]*(?:r\.|req\.|param|input|user))
    description: os file operations with filepath.Join containing user input
  - type: regex
    pattern: os\.(?:Open|Create|ReadFile)\s*\(\s*(?:fmt\.Sprintf\s*\(\s*"[^"]*"\s*,\s*[^)]*(?:r\.|req\.|param|fileName|userInput))
    description: os file operations with fmt.Sprintf interpolating user data
  - type: regex
    pattern: os\.(?:Open|Create|ReadFile)\s*\(\s*(?:\w+\s*\+\s*(?:r\.|req\.|param|fileName|userInput))
    description: os file operations with string concatenation of user data
  - type: regex
    pattern: os\.(?:Open|Create|ReadFile)\s*\(\s*(?:vars|mux\.Vars|chi\.URLParam|c\.Param|c\.Query|ctx\.Param|ctx\.Query)\s*[\(\[]
    description: os file operations with router parameter extraction (gorilla/mux, chi, gin, echo)
  - type: regex
    pattern: os\.(?:Open|Create)\s*\(\s*(?:path|file)\s*\)[\s\S]{0,50}(?:defer|io\.Copy|bufio|ioutil\.ReadAll)
    description: os.Open with common path variable followed by read/copy operations
  anti_patterns:
  - filepath\.Clean\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(
  - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(
  - if\s+strings\.Contains\s*\(\s*\w+\s*,\s*"\.\."\s*\)
  - if\s+!strings\.HasPrefix\s*\(\s*\w+\s*,\s*(?:baseDir|allowedDir|rootDir)
  - filepath\.Base\s*\(\s*(?:r\.|req\.|param|fileName|userInput)\b
  - if\s+filepath\.IsAbs\s*\(
  - securejoin\.\w+\s*\(
  - filepath\.EvalSymlinks\s*\(
  - os\.Open\s*\(\s*"[^"]*"\s*\)
  - allowedPaths\[\s*\w+\s*\]
  - whitelist\[\s*\w+\s*\]
  - path\.Clean\s*\([^)]+\)[\s\S]{0,50}HasPrefix
  - sanitize(?:Path|FileName|Input)\s*\(
  - if\s+\w+\s*==\s*""
  - filepath\.Rel\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(\s*\w+\s*,\s*"\.\."
  bypass_variants:
  - description: URL-encoded dot-dot-slash traversal
    pattern: (?:%2e%2e%2f|%2e%2e\/|\.\.%2f|%2e%2e%5c)
  - description: Double URL-encoded traversal
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - description: Null byte injection (handled differently in Go)
    pattern: (?:%00|\\x00)
  - description: Backslash traversal on Windows Go
    pattern: (?:\.\.\\\\|\.\.%5c|\.\.%5C)
  - description: Unicode encoded traversal
    pattern: (?:%c0%ae%c0%ae%c0%af|%e0%80%ae)
  evasion_indicators:
  - URL-encoded traversal in HTTP parameters
  - Double encoding to bypass net/http URL decode
  - Backslash on Windows Go deployments
  - Unicode normalization differences
  - Path length with redundant slashes
  encoding_variants:
  - type: url_encoding
    pattern: (?:%2e%2e%2f|%2e%2e%5c|\.\.%2f|\.\.%5c)
  - type: double_encoding
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - type: null_byte
    pattern: (?:%00|\\x00)
  - type: unicode_encoding
    pattern: (?:%c0%ae|%e0%80%ae)
  multi_function_chain_patterns:
  - r.URL.Query().Get('file') -> os.Open()
  - r.FormValue('path') -> filepath.Join() -> os.Open()
  - mux.Vars(r)['name'] -> os.ReadFile()
  - c.Query('doc') -> fmt.Sprintf -> os.Open()
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Arbitrary file read/write through os.Open exposes credentials, keys, and configuration enabling full
      server compromise
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: r.URL.Query().Get('file')
    sink: os.Open(filePath)
    through: direct parameter pass or filepath.Join
  - source: r.FormValue('path')
    sink: os.ReadFile(path)
    through: form value extraction
  - source: mux.Vars(r)['filename']
    sink: os.Open(filepath.Join(dir, filename))
    through: router parameter extraction
  impact: 'Successful exploitation reads arbitrary files from the Go server''s

    filesystem including /etc/passwd, /etc/shadow, application configuration

    files, environment variables, private keys, TLS certificates, database

    credentials, and source code. Write operations via os.Create or os.OpenFile

    with O_WRONLY can overwrite configuration, inject code into template files,

    or corrupt critical data. Go binaries often run with elevated privileges,

    amplifying the impact.

    '
  remediation: "1. Clean and validate the resolved path:\n\n   cleanPath := filepath.Clean(userInput)\n   absPath, err :=\
    \ filepath.Abs(filepath.Join(baseDir, cleanPath))\n   if err != nil || !strings.HasPrefix(absPath, filepath.Clean(baseDir)+string(os.PathSeparator))\
    \ {\n       http.Error(w, \"Forbidden\", http.StatusForbidden)\n       return\n   }\n   f, err := os.Open(absPath)\n\n\
    2. Use filepath.Base() for filename-only access:\n\n   safeName := filepath.Base(userInput)\n   f, err := os.Open(filepath.Join(uploadsDir,\
    \ safeName))\n\n3. Use github.com/cyphar/filepath-securejoin for safe joins.\n4. Reject inputs containing '..' or path\
    \ separators.\n5. Use file ID mappings instead of raw path input.\n"
  references:
  - https://cwe.mitre.org/data/definitions/22.html
  - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  - https://pkg.go.dev/os#Open
  - https://pkg.go.dev/path/filepath
  context_awareness:
    surrounding_context_patterns:
    - func\s+\w+\s*\(\s*w\s+http\.ResponseWriter\s*,\s*r\s+\*http\.Request\s*\)
    - func\s+\w+\s*\(\s*c\s+\*gin\.Context\s*\)
    - func\s+\w+\s*\(\s*ctx\s+echo\.Context\s*\)
    - http\.HandleFunc\s*\(
    taint_source_indicators:
    - r\.URL\.Query\(\)\.Get\s*\(
    - r\.FormValue\s*\(
    - r\.PathValue\s*\(
    - mux\.Vars\s*\(\s*r\s*\)
    - chi\.URLParam\s*\(
    - c\.Param\s*\(
    - c\.Query\s*\(
    taint_sink_indicators:
    - os\.Open\s*\(
    - os\.OpenFile\s*\(
    - os\.Create\s*\(
    - os\.ReadFile\s*\(
    - ioutil\.ReadFile\s*\(
    sanitization_patterns:
    - filepath\.Clean\s*\([^)]+\)[\s\S]{0,100}HasPrefix
    - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}HasPrefix
    - filepath\.Base\s*\(
    - securejoin\.\w+\s*\(
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_coverage)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Go HTTP handler serves files via GET /api/files?name=document.pdf.

      The handler calls os.Open(filepath.Join(uploadDir, r.URL.Query().Get("name"))).

      The attacker sends GET /api/files?name=../../../../etc/passwd. The

      filepath.Join normalizes but does not restrict traversal, and os.Open

      reads /etc/passwd. Successive requests target /etc/shadow, .env,

      and TLS private keys.

      '
    example_payload: ../../../../etc/passwd
    attacker_objective: Read sensitive server files including credentials, keys, and configuration
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PT-GO-002
    - PT-GO-005
    - PT-JS-001
    - PT-PY-001
- rule_id: PT-GO-002
  title: filepath.Join with Unsanitized User Input
  description: 'Detects usage of Go''s filepath.Join or path.Join where path segments originate from unsanitized user input.
    While filepath.Join calls filepath.Clean internally to normalize separators and remove redundant elements, it does NOT
    prevent traversal. filepath.Join("/base", "../../etc/passwd") correctly resolves to /etc/passwd if the process has access.
    Unlike Python''s os.path.join, Go''s filepath.Join does not have the absolute path override behavior, but traversal sequences
    still escape the base directory.

    '
  language: go
  category: path_traversal
  severity: High
  confidence: 0.9
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  tags:
  - path-traversal
  - filepath-join
  - golang
  - server-side
  - cwe-22
  - owasp-a01
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: filepath\.Join\s*\(\s*[^)]*(?:r\s*\.\s*(?:URL\.Query\s*\(\s*\)\s*\.\s*Get|FormValue|PathValue)\s*\()
    description: filepath.Join with HTTP request parameter
  - type: regex
    pattern: filepath\.Join\s*\(\s*(?:\w+\s*,\s*){0,10}(?:filePath|fileName|userPath|userInput|inputPath|docPath)\s*[,\)]
    description: filepath.Join with common user-controlled variable names
  - type: regex
    pattern: filepath\.Join\s*\(\s*(?:baseDir|uploadDir|rootDir|staticDir|dataDir)\s*,\s*(?:r\s*\.\s*(?:URL\.Query|FormValue)|mux\.Vars|chi\.URLParam|c\.(?:Param|Query)|ctx\.(?:Param|Query))
    description: filepath.Join with base directory and router parameter
  - type: regex
    pattern: filepath\.Join\s*\(\s*[^)]*(?:vars|params|query|form)\s*\[\s*"[^"]*"\s*\]
    description: filepath.Join with map access for parameters
  - type: regex
    pattern: path\.Join\s*\(\s*[^)]*(?:r\s*\.\s*(?:URL\.Query|FormValue)|filePath|fileName|userPath|userInput)\b
    description: path.Join (URL path package) with user-controlled input
  - type: regex
    pattern: filepath\.Join\s*\(\s*[^)]*(?:c\.Param\s*\(|c\.Query\s*\(|ctx\.Param\s*\(|ctx\.Query\s*\()
    description: filepath.Join with Gin/Echo framework parameters
  - type: regex
    pattern: filepath\.Join\s*\(\s*[^)]*(?:req\.(?:URL|Form|PostForm|Header))
    description: filepath.Join with raw request URL, form, or header data
  - type: regex
    pattern: filepath\.Join\s*\(\s*\w+\s*,\s*\w+\s*\)[\s\S]{0,50}(?:os\.(?:Open|Create|ReadFile|Stat)|ioutil\.ReadFile)
    description: filepath.Join result immediately used in file operations
  anti_patterns:
  - filepath\.Clean\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(
  - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(
  - if\s+strings\.Contains\s*\(\s*\w+\s*,\s*"\.\."\s*\)
  - if\s+!strings\.HasPrefix\s*\(
  - filepath\.Base\s*\(
  - securejoin\.SecureJoin\s*\(
  - filepath\.EvalSymlinks\s*\(
  - filepath\.Join\s*\(\s*"[^"]*"\s*,\s*"[^"]*"\s*\)
  - if\s+filepath\.IsAbs\s*\(
  - allowedPaths\[\w+\]
  - path\.Clean\s*\([^)]+\)[\s\S]{0,50}HasPrefix
  - strings\.ReplaceAll\s*\(\s*\w+\s*,\s*"\.\."\s*,
  - if\s+\w+\s*==\s*filepath\.Base\s*\(\s*\w+\s*\)
  - filepath\.Rel\s*\([^)]+\)[\s\S]{0,100}HasPrefix\s*\(\s*\w+\s*,\s*"\.\."
  - validatePath\s*\(
  bypass_variants:
  - description: URL-encoded traversal in path segments
    pattern: (?:%2e%2e%2f|%2e%2e\/|\.\.%2f)
  - description: Double encoding to bypass net/http decode
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - description: Null byte injection
    pattern: (?:%00|\\x00)
  - description: Backslash on Windows Go runtime
    pattern: (?:\.\.\\\\|\.\.%5c)
  - description: Path with redundant current-directory dots
    pattern: (?:\.\/)+\.\.\/+
  evasion_indicators:
  - URL encoding in HTTP parameters
  - Double encoding to bypass single decode
  - Backslash on Windows
  - Redundant ./ segments before traversal
  - Encoded path separators
  encoding_variants:
  - type: url_encoding
    pattern: (?:%2e%2e%2f|%2e%2e%5c|\.\.%2f|\.\.%5c)
  - type: double_encoding
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - type: null_byte
    pattern: (?:%00|\\x00)
  - type: unicode_encoding
    pattern: (?:%c0%ae%c0%ae%c0%af)
  multi_function_chain_patterns:
  - r.URL.Query().Get('file') -> filepath.Join -> os.Open
  - mux.Vars(r)['name'] -> filepath.Join -> os.ReadFile
  - c.Param('path') -> filepath.Join -> http.ServeFile
  - r.FormValue('dir') -> filepath.Join -> os.ReadDir
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Traversal through filepath.Join escapes intended base directories to access any file readable by the
      Go process
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: r.URL.Query().Get('file')
    sink: filepath.Join(baseDir, userInput)
    through: direct parameter pass
  - source: mux.Vars(r)['name']
    sink: filepath.Join(uploadsDir, name)
    through: router variable extraction
  - source: c.Param('path')
    sink: filepath.Join(staticDir, path)
    through: Gin parameter binding
  impact: 'An attacker escapes the intended directory by injecting traversal

    sequences through filepath.Join. Since Go''s filepath.Join normalizes

    but does not constrain traversal, the resolved path can access any

    file on the filesystem. This enables reading application configuration,

    database credentials, TLS keys, and source code. Write operations can

    modify binary executables, configuration, or deploy backdoors.

    '
  remediation: "1. Validate the resolved path stays within the base directory:\n\n   base, _ := filepath.Abs(baseDir)\n  \
    \ target, _ := filepath.Abs(filepath.Join(base, userInput))\n   if !strings.HasPrefix(target, base+string(os.PathSeparator))\
    \ {\n       http.Error(w, \"Forbidden\", http.StatusForbidden)\n       return\n   }\n\n2. Use filepath.Base() for filename-only\
    \ operations:\n\n   safeName := filepath.Base(userInput)\n   fullPath := filepath.Join(uploadsDir, safeName)\n\n3. Use\
    \ github.com/cyphar/filepath-securejoin:\n\n   safePath, err := securejoin.SecureJoin(baseDir, userInput)\n\n4. Reject\
    \ inputs containing '..' or path separators.\n5. Use file ID mappings instead of raw paths.\n"
  references:
  - https://pkg.go.dev/path/filepath#Join
  - https://cwe.mitre.org/data/definitions/22.html
  - https://github.com/cyphar/filepath-securejoin
  context_awareness:
    surrounding_context_patterns:
    - func\s+\w+\s*\(\s*w\s+http\.ResponseWriter
    - func\s+\w+\s*\(\s*c\s+\*gin\.Context
    - func\s+\w+\s*\(\s*ctx\s+echo\.Context
    - http\.HandleFunc\s*\(
    taint_source_indicators:
    - r\.URL\.Query\(\)\.Get\s*\(
    - r\.FormValue\s*\(
    - mux\.Vars\s*\(
    - c\.Param\s*\(
    - c\.Query\s*\(
    - chi\.URLParam\s*\(
    taint_sink_indicators:
    - filepath\.Join\s*\(
    - path\.Join\s*\(
    sanitization_patterns:
    - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}HasPrefix
    - filepath\.Base\s*\(
    - securejoin\.SecureJoin\s*\(
    - strings\.Contains\s*\(\s*\w+\s*,\s*"\.\."
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_coverage)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Go API handler at /download/{filename} uses filepath.Join(docsDir,

      vars["filename"]) to resolve file paths. The attacker sends a request

      to /download/..%2f..%2f..%2fetc%2fpasswd. Go''s net/http decodes the

      URL, filepath.Join resolves to /etc/passwd, and os.Open reads the file.

      The response exposes the system user listing.

      '
    example_payload: ..%2f..%2f..%2fetc%2fpasswd
    attacker_objective: Escape the intended base directory to access arbitrary files through filepath.Join
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PT-GO-001
    - PT-GO-003
    - PT-JS-002
    - PT-PY-002
- rule_id: PT-GO-003
  title: http.ServeFile Path Traversal
  description: 'Detects path traversal vulnerabilities in Go''s http.ServeFile function where the file path is constructed
    using user-controlled input. While http.ServeFile includes basic protection by cleaning the URL path with path.Clean,
    it does NOT protect against traversal when the file path argument itself is derived from user input through other means,
    such as query parameters, router variables, or custom path parsing. This pattern is frequently found in custom file serving
    handlers in Go web applications.

    '
  language: go
  category: path_traversal
  severity: High
  confidence: 0.89
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  tags:
  - path-traversal
  - http-serve-file
  - golang
  - static-files
  - cwe-22
  - owasp-a01
  detection_layer: 3
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: http\.ServeFile\s*\(\s*w\s*,\s*r\s*,\s*(?:filepath\.Join\s*\(\s*[^)]*(?:r\.|req\.|param|input|user))
    description: http.ServeFile with filepath.Join containing user input
  - type: regex
    pattern: http\.ServeFile\s*\(\s*w\s*,\s*r\s*,\s*(?:r\s*\.\s*(?:URL\.Query\s*\(\s*\)\s*\.\s*Get|FormValue|PathValue)\s*\()
    description: http.ServeFile with direct request parameter
  - type: regex
    pattern: http\.ServeFile\s*\(\s*w\s*,\s*r\s*,\s*(?:filePath|fileName|userPath|docPath|file)\s*\)
    description: http.ServeFile with common user-controlled variable
  - type: regex
    pattern: http\.ServeFile\s*\(\s*w\s*,\s*r\s*,\s*(?:fmt\.Sprintf\s*\(\s*"[^"]*"\s*,\s*[^)]*(?:r\.|param|input|user))
    description: http.ServeFile with fmt.Sprintf interpolating user data
  - type: regex
    pattern: http\.ServeFile\s*\(\s*w\s*,\s*r\s*,\s*(?:[^)]*\+\s*(?:r\.|req\.|param|fileName|userInput))
    description: http.ServeFile with string concatenation of user data
  - type: regex
    pattern: http\.ServeFile\s*\(\s*w\s*,\s*r\s*,\s*(?:mux\.Vars\s*\(\s*r\s*\)\s*\[\s*|chi\.URLParam\s*\(|c\.Param\s*\(|ctx\.Param\s*\()
    description: http.ServeFile with router framework parameter extraction
  - type: regex
    pattern: http\.ServeContent\s*\(\s*w\s*,\s*r\s*,\s*[^,]+,\s*[^,]+,\s*(?:os\.Open\s*\(\s*[^)]*(?:filePath|fileName|userPath|r\.))
    description: http.ServeContent with os.Open using user-controlled path
  - type: regex
    pattern: http\.ServeFile\s*\(\s*\w+\s*,\s*\w+\s*,\s*(?:path)\s*\)[\s\S]{0,5}$
    description: http.ServeFile with generic path variable at end of handler
  anti_patterns:
  - filepath\.Clean\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(
  - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}strings\.HasPrefix\s*\(
  - if\s+strings\.Contains\s*\(\s*\w+\s*,\s*"\.\."\s*\)
  - if\s+!strings\.HasPrefix\s*\(
  - filepath\.Base\s*\(
  - securejoin\.SecureJoin\s*\(
  - http\.ServeFile\s*\(\s*w\s*,\s*r\s*,\s*"[^"]*"\s*\)
  - http\.StripPrefix\s*\(\s*"[^"]*"\s*,\s*http\.FileServer
  - if\s+filepath\.IsAbs\s*\(
  - validatePath\s*\(
  - sanitizePath\s*\(
  - allowedFiles\[\w+\]
  - filepath\.EvalSymlinks\s*\(
  - strings\.ReplaceAll\s*\(\s*\w+\s*,\s*"\.\."\s*,
  - filepath\.Rel\s*\([^)]+\)[\s\S]{0,100}HasPrefix\s*\(\s*\w+\s*,\s*"\.\."
  bypass_variants:
  - description: URL-encoded traversal in request parameter
    pattern: (?:%2e%2e%2f|%2e%2e\/|\.\.%2f)
  - description: Double encoding to bypass net/http URL decode
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - description: Null byte in file path
    pattern: (?:%00|\\x00)
  - description: Backslash on Windows Go
    pattern: (?:\.\.\\\\|\.\.%5c)
  - description: Path with encoded query components
    pattern: (?:\?.*(?:%2e%2e|\.\.)[%\/\\\\])
  evasion_indicators:
  - URL encoding in file path parameters
  - Double encoding to bypass HTTP decoding
  - Backslash on Windows
  - Encoded path in query string
  - Path length manipulation
  encoding_variants:
  - type: url_encoding
    pattern: (?:%2e%2e%2f|%2e%2e%5c|\.\.%2f|\.\.%5c)
  - type: double_encoding
    pattern: (?:%252e%252e%252f|%252e%252e%255c)
  - type: null_byte
    pattern: (?:%00|\\x00)
  - type: unicode_encoding
    pattern: (?:%c0%ae%c0%ae%c0%af)
  multi_function_chain_patterns:
  - r.URL.Query().Get('file') -> filepath.Join -> http.ServeFile
  - mux.Vars(r)['name'] -> filepath.Join -> http.ServeFile
  - r.FormValue('doc') -> http.ServeFile
  - chi.URLParam(r, 'path') -> http.ServeFile
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: http.ServeFile with user-controlled paths serves any file readable by the Go process
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: r.URL.Query().Get('file')
    sink: http.ServeFile(w, r, filepath.Join(dir, file))
    through: query parameter to filepath.Join
  - source: mux.Vars(r)['name']
    sink: http.ServeFile(w, r, path)
    through: router variable extraction
  - source: r.FormValue('document')
    sink: http.ServeFile(w, r, filePath)
    through: form value assignment
  impact: 'An attacker can download arbitrary files from the server through

    http.ServeFile by injecting traversal sequences into the path parameter.

    Sensitive targets include application configuration, database connection

    strings, TLS private keys, credentials files, and Go source code. On

    Linux deployments, /proc/self/environ reveals environment variables

    containing secrets. The http.ServeFile function properly handles MIME

    types and range requests, making it efficient for attackers to exfiltrate

    large files.

    '
  remediation: "1. Validate paths before passing to http.ServeFile:\n\n   safePath, err := filepath.Abs(filepath.Join(docRoot,\
    \ userInput))\n   if err != nil || !strings.HasPrefix(safePath, filepath.Clean(docRoot)+string(os.PathSeparator)) {\n\
    \       http.Error(w, \"Forbidden\", http.StatusForbidden)\n       return\n   }\n   http.ServeFile(w, r, safePath)\n\n\
    2. Use http.FileServer with http.Dir for directory-constrained serving:\n\n   http.Handle(\"/static/\", http.StripPrefix(\"\
    /static/\", http.FileServer(http.Dir(\"./public\"))))\n\n3. Use filepath.Base() for single-file serving.\n4. Implement\
    \ file ID mappings instead of path parameters.\n5. Use securejoin for safe path construction.\n"
  references:
  - https://pkg.go.dev/net/http#ServeFile
  - https://cwe.mitre.org/data/definitions/22.html
  - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  context_awareness:
    surrounding_context_patterns:
    - func\s+\w+\s*\(\s*w\s+http\.ResponseWriter
    - http\.HandleFunc\s*\(
    - r\.HandleFunc\s*\(
    - mux\.HandleFunc\s*\(
    taint_source_indicators:
    - r\.URL\.Query\(\)\.Get\s*\(
    - r\.FormValue\s*\(
    - mux\.Vars\s*\(
    - chi\.URLParam\s*\(
    - c\.Param\s*\(
    taint_sink_indicators:
    - http\.ServeFile\s*\(
    - http\.ServeContent\s*\(
    sanitization_patterns:
    - filepath\.Abs\s*\([^)]+\)[\s\S]{0,100}HasPrefix
    - filepath\.Base\s*\(
    - strings\.Contains\s*\(\s*\w+\s*,\s*"\.\."
    - securejoin\.SecureJoin\s*\(
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_coverage)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Go handler at /serve?file=intro.pdf calls http.ServeFile(w, r,

      filepath.Join(docsDir, r.URL.Query().Get("file"))). The attacker sends

      GET /serve?file=../../../etc/passwd. filepath.Join resolves to /etc/passwd,

      and http.ServeFile sends the file with proper Content-Type and

      Content-Length headers. The response contains the UNIX password file.

      '
    example_payload: ../../../etc/passwd
    attacker_objective: Download arbitrary files from the server through http.ServeFile
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
