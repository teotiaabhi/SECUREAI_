  # --------------------------------------------------------------------------
  # PT-JAVA-006: File.getCanonicalPath Bypass Attempts
  # --------------------------------------------------------------------------
  - rule_id: "PT-JAVA-006"
    title: "File.getCanonicalPath Bypass Attempts"
    description: >
      Detects patterns where File.getCanonicalPath() or Path.toRealPath() are
      used for path traversal validation but implemented incorrectly, creating
      a false sense of security. Common bypasses include: checking canonical
      path without proper prefix comparison, TOCTOU (time-of-check/time-of-use)
      race conditions where the filesystem changes between validation and access,
      symlink resolution differences between getCanonicalPath and actual file
      access, and incomplete startsWith checks that match directory name
      prefixes (e.g., /uploads-backup matching /uploads).
    language: java
    category: path_traversal
    severity: High
    confidence: 0.85
    cwe: CWE-22
    owasp: "A01:2021-Broken-Access-Control"
    tags:
      - path-traversal
      - bypass
      - canonical-path
      - toctou
      - java
      - server-side
      - cwe-22
      - cwe-367
      - owasp-a01
    detection_layer: 4
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: '\.getCanonicalPath\s*\(\s*\)\s*\.\s*startsWith\s*\(\s*(?:baseDir|rootDir|uploadDir)\s*\)(?!\s*\+\s*File\.separator)'
        description: "getCanonicalPath startsWith without appending File.separator (prefix match vulnerability)"
      - type: regex
        pattern: '\.getCanonicalPath\s*\(\s*\)\s*\.\s*startsWith\s*\(\s*"[^"]*[^/\\\\]"\s*\)'
        description: "getCanonicalPath startsWith with base path not ending in separator"
      - type: regex
        pattern: 'getCanonicalPath\s*\(\s*\)[\s\S]{5,50}(?:new\s+File(?:Input|Output)Stream|Files\.(?:read|write|copy|move))\s*\(\s*(?!.*getCanonicalFile)'
        description: "Canonical path check followed by file operation on original (non-canonical) File object"
      - type: regex
        pattern: '\.getAbsolutePath\s*\(\s*\)\s*\.\s*startsWith\s*\(\s*(?:baseDir|rootDir|uploadDir)\s*\)'
        description: "Using getAbsolutePath instead of getCanonicalPath (does not resolve symlinks)"
      - type: regex
        pattern: 'if\s*\(\s*!?\s*\w+\s*\.\s*contains\s*\(\s*"\.\."\s*\)\s*\)[\s\S]{0,200}(?:new\s+File(?:Input|Output)Stream|Files\.(?:read|write))'
        description: "Simple string contains check for .. without canonical resolution"
      - type: regex
        pattern: '\.normalize\s*\(\s*\)(?!\s*\.\s*(?:toAbsolutePath|startsWith))\s*[;\s][\s\S]{0,100}(?:Files\.|new\s+File)'
        description: "Path.normalize() without subsequent startsWith validation"
      - type: regex
        pattern: '(?:filePath|fileName|userPath)\s*=\s*(?:filePath|fileName|userPath)\s*\.\s*replace\s*\(\s*"\.\."\s*,\s*""\s*\)\s*;[\s\S]{0,200}(?:new\s+File|Paths\.get|Files\.)'
        description: "Blacklist replacement of .. without recursive/canonical check"
      - type: regex
        pattern: 'if\s*\(\s*\w+\s*\.\s*indexOf\s*\(\s*"\.\."\s*\)\s*(?:==\s*-1|<\s*0)\s*\)[\s\S]{0,200}(?:new\s+File|Paths\.get|Files\.)'
        description: "indexOf check for .. without handling encoded variants"
    anti_patterns:
      - '\.getCanonicalPath\s*\(\s*\)\s*\.\s*startsWith\s*\(\s*\w+\s*\+\s*File\.separator\s*\)'
      - '\.getCanonicalFile\s*\(\s*\)\s*[\s\S]{0,50}(?:new\s+File(?:Input|Output)Stream\s*\(\s*\w+\s*\.\s*getCanonicalFile)'
      - '\.toRealPath\s*\(\s*\)\s*\.\s*startsWith\s*\('
      - 'Paths\s*\.\s*get\s*\([^)]+\)\s*\.\s*normalize\s*\(\s*\)\s*\.\s*toAbsolutePath\s*\(\s*\)\s*\.\s*startsWith'
      - '\.getCanonicalPath\s*\(\s*\)\s*\.\s*startsWith\s*\(\s*\w+\s*\.\s*getCanonicalPath\s*\(\s*\)\s*\+\s*File\.separator'
      - 'synchronized\s*\([^)]+\)\s*\{[\s\S]{0,500}getCanonicalPath'
      - 'Files\.setAttribute\s*\([^)]*LinkOption\.NOFOLLOW_LINKS'
      - 'AccessController\.doPrivileged'
      - 'if\s*\(\s*Files\.isSymbolicLink\s*\('
      - 'SecurityManager'
      - 'String\s+canonicalBase\s*=\s*\w+\s*\.\s*getCanonicalPath\s*\(\s*\)\s*\+\s*File\.separator'
      - 'Files\.readSymbolicLink\s*\('
      - 'LinkOption\.NOFOLLOW_LINKS'
      - 'new\s+File\s*\([^)]+\)\s*\.\s*getCanonicalFile\s*\(\s*\)\s*\.(?:getPath|toString)\s*\(\s*\)\s*\.\s*startsWith\s*\(\s*\w+\s*\.\s*getCanonicalFile'
      - 'AtomicFileOperation|FileChannel.*lock'
    bypass_variants:
      - description: "Symlink creation after canonical path check (TOCTOU)"
        pattern: '(?:ln\s+-s|Files\.createSymbolicLink|symlink)'
      - description: "Directory prefix collision without separator suffix"
        pattern: '(?:\/uploads-backup|\/uploads-old|\/uploadstemp)'
      - description: "Double dot replacement bypass with triple dots"
        pattern: '(?:\.\.\.\/|\.%2e\/|%2e\.\/)'
      - description: "Null byte after canonical check"
        pattern: '(?:%00|\\x00|\\u0000)'
      - description: "Race condition between check and file access"
        pattern: '(?:Thread\.sleep|TimeUnit\.MILLISECONDS\.sleep|wait\s*\()'
    evasion_indicators:
      - "TOCTOU race condition between canonical check and file access"
      - "Symlink manipulation after validation"
      - "Directory name prefix collision"
      - "Non-recursive blacklist replacement of .."
      - "Using getAbsolutePath instead of getCanonicalPath"
    encoding_variants:
      - type: "url_encoding"
        pattern: '(?:%2e%2e%2f|%2e%2e%5c|\.\.%2f|\.\.%5c)'
      - type: "double_encoding"
        pattern: '(?:%252e%252e%252f|%252e%252e%255c)'
      - type: "null_byte"
        pattern: '(?:%00|\\x00|\\u0000)'
      - type: "unicode_encoding"
        pattern: '(?:%c0%ae|%e0%80%ae)'
    multi_function_chain_patterns:
      - "user input -> new File() -> getCanonicalPath() check -> FileInputStream(original file)"
      - "user input -> File.getAbsolutePath() -> startsWith check -> FileInputStream()"
      - "user input -> replace('..', '') -> Paths.get() -> Files.read()"
      - "user input -> indexOf('..') check -> new File() -> FileInputStream()"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Bypassing canonical path validation enables full path traversal despite apparent security controls"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user input"
        sink: "new FileInputStream(file) after flawed canonical check"
        through: "incorrect startsWith without separator"
      - source: "user input"
        sink: "Files.readAllBytes() after replace('..', '')"
        through: "non-recursive blacklist"
      - source: "user input"
        sink: "FileInputStream(original) after getCanonicalPath check"
        through: "TOCTOU between validation and access"
    impact: |
      Bypassing canonical path validation nullifies the intended security
      control while giving developers false confidence. This enables the same
      impacts as unprotected file access: reading sensitive configuration,
      credentials, and keys; writing to arbitrary locations for code execution;
      and filesystem manipulation. The TOCTOU variant is particularly dangerous
      in multi-threaded Java applications where race conditions between
      validation and file access can be exploited reliably.
    remediation: |
      1. Use canonical path with proper separator suffix comparison:

         File baseDir = new File("/app/uploads").getCanonicalFile();
         String basePath = baseDir.getPath() + File.separator;
         File target = new File(baseDir, userInput).getCanonicalFile();
         if (!target.getPath().startsWith(basePath) && !target.equals(baseDir)) {
             throw new SecurityException("Path traversal detected");
         }
         // Use target (canonical file) for operations, NOT the original

      2. Operate on the canonical file object, not the original:

         FileInputStream fis = new FileInputStream(target); // Use canonical

      3. Check for symlinks with Files.isSymbolicLink().
      4. Use NIO Path with toRealPath() for symlink resolution.
      5. Avoid blacklist replacement of '..'; use canonical validation.
      6. Implement synchronized blocks for TOCTOU-sensitive operations.
    references:
      - "https://cwe.mitre.org/data/definitions/22.html"
      - "https://cwe.mitre.org/data/definitions/367.html"
      - "https://docs.oracle.com/javase/8/docs/api/java/io/File.html#getCanonicalPath--"
    context_awareness:
      surrounding_context_patterns:
        - 'protected\s+void\s+do(?:Get|Post)\s*\('
        - '@(?:Get|Post|Put|Delete)Mapping'
        - 'public\s+\w+\s+\w+\s*\(\s*HttpServletRequest'
      taint_source_indicators:
        - 'request\.getParameter\s*\('
        - '@RequestParam'
        - '@PathVariable'
      taint_sink_indicators:
        - '\.getCanonicalPath\s*\('
        - '\.getAbsolutePath\s*\('
        - '\.indexOf\s*\(\s*"\.\."\s*\)'
        - '\.replace\s*\(\s*"\.\."\s*,'
      sanitization_patterns:
        - '\.getCanonicalPath\s*\(\s*\)\s*\.startsWith\s*\(\s*\w+\s*\+\s*File\.separator'
        - '\.toRealPath\s*\(\s*\)\s*\.startsWith'
        - 'Files\.isSymbolicLink'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_coverage)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A file serving endpoint validates paths using:
        if (file.getCanonicalPath().startsWith(uploadsDir)) { serve(file); }
        The uploadsDir is "/app/uploads" without trailing separator. The attacker
        creates a request for a file in "/app/uploads-backup/secret.conf". The
        canonical path "/app/uploads-backup/secret.conf" starts with
        "/app/uploads", passing the validation. The attacker accesses files in
        an unintended directory sharing a common prefix.
      example_payload: "../uploads-backup/secret.conf"
      attacker_objective: "Bypass canonical path validation through prefix collision, TOCTOU races, or incomplete sanitization"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "medium"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "PT-JAVA-001"
        - "PT-JAVA-002"
        - "PT-JAVA-003"
