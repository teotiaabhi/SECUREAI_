- rule_id: SEC-007
  title: Hardcoded Password in Source Code
  description: 'Detects hardcoded passwords assigned to variables or passed as function arguments.  Covers common variable
    names across Python, JavaScript/ TypeScript, Java, Go, C#, Ruby, and PHP.

    '
  language: all
  category: secrets
  severity: High
  confidence: 0.85
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - hardcoded-password
