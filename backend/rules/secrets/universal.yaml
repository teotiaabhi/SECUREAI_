  - type: regex
    description: Microsoft / Azure AD client secret
    pattern: (?:AZURE_CLIENT_SECRET|MICROSOFT_CLIENT_SECRET|azure_client_secret)\s*[:=]\s*['"][a-zA-Z0-9_\-~.]{34,}['"]
  - type: regex
    description: Okta API token
