    '
  remediation: "General\n- Store JWT secrets in environment variables or a secrets manager.\n- Use asymmetric keys (RS256\
    \ / ES256) instead of symmetric secrets\n  (HS256) so only the server holds the private signing key.\n- Rotate secrets\
    \ periodically.\n- Implement token revocation mechanisms (deny-lists, short expiry).\n\nAWS\n- Store JWT secrets in AWS\
    \ Secrets Manager with rotation.\n- Use Amazon Cognito or ALB-integrated OIDC for token management.\n\nGCP\n- Store secrets\
