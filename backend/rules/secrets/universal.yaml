  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: 9.0
  exploit_scenario:
    attack_example: 'An attacker finds a Google OAuth GOCSPX client secret in a frontend JavaScript bundle.  They stand up
      a phishing page that mimics the legitimate application''s OAuth flow, exchange stolen authorization codes for access
      tokens, and read victim Gmail and Drive data.

      '
    example_payload: "curl -X POST https://oauth2.googleapis.com/token \\\n  -d \"code=STOLEN_AUTH_CODE\" \\\n  -d \"client_id=LEGIT_CLIENT_ID\"\
      \ \\\n  -d \"client_secret=GOCSPX-LEAKED_SECRET\" \\\n  -d \"redirect_uri=https://attacker.com/callback\" \\\n  -d \"\
      grant_type=authorization_code\"\n"
    attacker_objective: 'Steal OAuth tokens to access user data on third-party platforms, or impersonate the application to
      harvest credentials at scale.

      '
  confidence_factors:
    pattern_strength: 0.91
    context_match: 0.87
    proximity_to_user_input: 0.35
    sanitization_absence: 0.9
  impact: 'Leaked OAuth client secrets enable token theft, impersonation, and

    unauthorized access to user data through the OAuth provider.

    '
  remediation: "General\n- Store OAuth secrets in environment variables.\n- Use server-side OAuth flows only (authorization\
    \ code flow with PKCE).\n- Rotate compromised secrets immediately.\n- Monitor OAuth provider security dashboards.\n\n\
    AWS\n- Use AWS Secrets Manager with cross-account access for shared\n  OAuth secrets between micro-services.\n- Use Amazon\
    \ Cognito as a managed OAuth/OIDC provider.\n\nGCP\n- Store OAuth secrets in GCP Secret Manager.\n- Use Google Identity\
    \ Platform for managed auth.\n- Restrict OAuth client IDs to specific redirect URIs.\n\nAzure\n- Store secrets in Azure\
    \ Key Vault.\n- Use Azure AD App Registrations with managed certificate\n  credentials instead of client secrets where\
    \ possible.\n- Enable client secret expiry policies.\n\nHashiCorp Vault\n- Store OAuth secrets in the KV v2 secrets engine.\n\
    - Automate secret rotation using Vault's API and webhooks.\n\nCI/CD\n- Inject OAuth secrets via CI/CD secret stores.\n\
    - Never expose client secrets in frontend builds; use a backend\n  proxy or BFF (Backend-For-Frontend) pattern.\n"
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://developers.google.com/identity/protocols/oauth2
  - https://docs.github.com/en/developers/apps/building-oauth-apps/authorizing-oauth-apps
