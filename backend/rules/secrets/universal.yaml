    pattern: (?:authenticate|login|connect|create_user)\s*\([^)]*password\s*[:=]\s*['"][^'"]{8,}['"]
  - type: regex
    description: Admin or root password assignment
    pattern: (?:admin_password|root_password|ADMIN_PASSWORD|ROOT_PASSWORD|master_password)\s*[:=]\s*['"][^'"]{8,}['"]
  - type: regex
    description: Password in dictionary / map literal
    pattern: '[''"](?:password|passwd|pwd)[''"]:\s*[''"][^''"]{8,}[''"]'
  - type: regex
    description: LDAP bind password
    pattern: (?:bind_password|BIND_PASSWORD|ldap_password|LDAP_PASSWORD)\s*[:=]\s*['"][^'"]{8,}['"]
  - type: regex
