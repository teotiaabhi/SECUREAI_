    - form.password
    - input[type=password]
    - getpass(
    - prompt(
    taint_sink_indicators:
    - db.authenticate
    - ldap.bind
    - ssh.connect
    - smtp.login
    - requests.post(url, auth=(
    sanitization_patterns:
    - bcrypt.hash
    - argon2.hash
    - password prompt
