- rule_id: SEC-008
  title: NPM Token in Source Code
  description: 'Detects NPM authentication tokens, including legacy tokens, automation tokens, granular access tokens, and
    .npmrc credentials committed to source code or configuration files. Exposed NPM tokens allow attackers to publish malicious
    packages under the victim''s account, hijack existing packages, or access private registry packages.

    '
  language: all
  category: secrets
  severity: High
  confidence: 0.94
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - npm
  - registry-token
  - supply-chain
  - package-manager
  - hardcoded-secret
  patterns:
  - type: regex
    description: NPM legacy auth token
    pattern: //registry\.npmjs\.org/:_authToken\s*=\s*[a-f0-9\-]{36}
  - type: regex
    description: NPM granular access token (npm_)
    pattern: npm_[a-zA-Z0-9]{36}
  - type: regex
    description: NPM automation token in environment variable
    pattern: (?:NPM_TOKEN|NPM_AUTH_TOKEN|npm_token)\s*[:=]\s*['"][a-zA-Z0-9_\-]{36,}['"]
  - type: regex
    description: .npmrc with inline auth credentials
    pattern: _auth\s*=\s*[A-Za-z0-9+/=]{20,}
  - type: regex
    description: NPM registry URL with embedded token
    pattern: //[^/]+/:_authToken\s*=\s*\S{20,}
  - type: regex
    description: NPM config set authtoken command
    pattern: npm\s+config\s+set\s+.*authToken\s+[a-zA-Z0-9_\-]{20,}
  - type: regex
    description: Yarn NPM auth token
    pattern: npmAuthToken\s*:\s*['"]?[a-zA-Z0-9_\-]{20,}
  anti_patterns:
  - process.env
  - os.environ
  - ENV[
  - ${NPM_TOKEN}
  - $NPM_TOKEN
  - ${{ secrets.
  - placeholder
  - example
  - CHANGE_ME
  - REPLACE_ME
  - YOUR_TOKEN
  - test
  - spec/
  - fixture
  - mock
  - __test__
  - vault.
  - secretsmanager
  context_awareness:
    surrounding_context_patterns:
    - .npmrc
    - package.json
    - npm publish
    - npm install
    - registry.npmjs.org
    - npm config
    - .yarnrc.yml
    taint_source_indicators:
    - .npmrc file
    - npm config
    - CI/CD environment
    - build script
    taint_sink_indicators:
    - npm publish
    - npm install
    - npm whoami
    - registry access
    - package upload
    sanitization_patterns:
    - ${NPM_TOKEN}
    - process.env.NPM_TOKEN
    - secrets manager
    - CI/CD secret variable
    - vault read
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * supply_chain_impact_factor
    exploitability_score: 9.5
  exploit_scenario:
    attack_example: 'An attacker discovers an NPM automation token in a .npmrc file committed to a public repository. They
      use the token to publish a malicious version of a popular package owned by the victim, adding a postinstall script that
      exfiltrates environment variables from every developer and CI/CD system that installs the compromised package.

      '
    example_payload: '# Authenticate with stolen token

      echo "//registry.npmjs.org/:_authToken=STOLEN_TOKEN" > ~/.npmrc

      npm whoami

      # Publish backdoored version

      npm publish --access public

      '
    attacker_objective: 'Hijack NPM packages for supply chain attacks, publish malicious code under trusted package names,
      or access private registry packages.

      '
  confidence_factors:
    pattern_strength: 0.93
    context_match: 0.9
    proximity_to_user_input: 0.2
    sanitization_absence: 0.94
  impact: 'Exposed NPM tokens enable supply chain attacks by allowing attackers to

    publish malicious package versions, access private packages, or modify

    existing packages. This can affect thousands of downstream consumers.

    '
  remediation: 'General

    - Use NPM_TOKEN environment variable in .npmrc: //registry.npmjs.org/:_authToken=${NPM_TOKEN}

    - Add .npmrc to .gitignore

    - Use scoped tokens with read-only access where possible

    - Enable NPM 2FA for publishing


    CI/CD

    - Use CI/CD secret variables for NPM_TOKEN

    - Use OIDC provenance with npm publish --provenance

    - Use GitHub Actions npm publish action with GITHUB_TOKEN

    - Never echo or log NPM tokens in CI/CD pipelines


    Rotation

    - Revoke compromised tokens immediately: npm token revoke <token>

    - Use short-lived automation tokens

    - Audit token usage: npm token list

    '
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://docs.npmjs.com/about-access-tokens
  - https://docs.npmjs.com/using-private-packages-in-a-ci-cd-workflow
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-002
    - SEC-006
  detection_layer: 1
- rule_id: SEC-009
  title: Slack Webhook URL Exposure
  description: 'Detects Slack incoming webhook URLs and bot tokens committed to source code. Slack webhooks contain embedded
    authentication and allow anyone with the URL to post messages to Slack channels, enabling phishing, social engineering,
    and information leakage. Bot tokens provide broader API access including reading messages and user data.

    '
  language: all
  category: secrets
  severity: High
  confidence: 0.96
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - slack
  - webhook
  - bot-token
  - messaging
  - hardcoded-secret
  patterns:
  - type: regex
    description: Slack incoming webhook URL
    pattern: https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[a-zA-Z0-9]{24}
  - type: regex
    description: Slack Bot token
    pattern: xoxb-[0-9]{10,}-[0-9]{10,}-[a-zA-Z0-9]{24}
  - type: regex
    description: Slack User token
