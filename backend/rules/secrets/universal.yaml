rules:
- rule_id: SEC-001
  title: Hardcoded AWS Access Key
  description: 'Detects hardcoded AWS access key IDs and secret access keys in source code. Covers standard IAM long-term
    keys (AKIA), temporary STS keys (ASIA), and common variable-assignment patterns across languages.

    '
  language: all
  category: secrets
  severity: Critical
  confidence: 0.97
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - aws
  - access-key
  - hardcoded-secret
  - cloud
  - iam
  patterns:
  - type: regex
    pattern: (?:AKIA|ASIA)[0-9A-Z]{16}
  - type: regex
    pattern: (?:aws_secret_access_key|AWS_SECRET_ACCESS_KEY|aws_secret_key)\s*[:=]\s*['"][A-Za-z0-9/+=]{40}['"]
  - type: regex
    pattern: (?:aws_access_key_id|AWS_ACCESS_KEY_ID|aws_access_key)\s*[:=]\s*['"](?:AKIA|ASIA)[0-9A-Z]{16}['"]
  - type: regex
    description: AWS session token leaked inline
    pattern: (?:aws_session_token|AWS_SESSION_TOKEN)\s*[:=]\s*['"][A-Za-z0-9/+=]{100,}['"]
  - type: regex
    description: AWS credentials in JSON or YAML config blobs
    pattern: '"(?:AccessKeyId|SecretAccessKey)"\s*:\s*"[A-Za-z0-9/+=]{16,40}"'
  - type: regex
    description: AWS MWS auth token (Marketplace Web Service)
    pattern: amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
  - type: regex
    description: Boto3 / SDK inline credentials in Python
    pattern: aws_secret_access_key\s*=\s*['"][A-Za-z0-9/+=]{40}['"]
  anti_patterns:
  - AKIAIOSFODNN7EXAMPLE
  - wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  - placeholder
  - example
  - <your_
  - EXAMPLE_KEY
  - REPLACE_ME
  - process.env
  - os.environ
  - os.Getenv
  - System.getenv
  - ENV[
  - env(
  - getenv(
  - test
  - spec/
  - fixture
  - mock
  - __test__
  - __mocks__
  - testdata
  - fake
  - config.
  - settings.
  - vault.
  - ssm.
  - secretsmanager
  - aws-vault
  - chamber
  - credstash
  - parameter_store
  - SecretsManager
  context_awareness:
    surrounding_context_patterns:
    - import boto3
    - require('aws-sdk')
    - AWS.config.update
    - new AWS.S3(
    - new AWS.DynamoDB(
    - aws_iam_
    - terraform {
    taint_source_indicators:
    - user input
    - request.body
    - request.query
    - request.headers
    - argv
    taint_sink_indicators:
    - S3.putObject
    - DynamoDB.putItem
    - Lambda.invoke
    - SES.sendEmail
    - SNS.publish
    sanitization_patterns:
    - Secrets Manager lookup
    - SSM Parameter Store
    - aws-vault exec
    - AssumeRole
    - instance profile
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: 9.8
  exploit_scenario:
    attack_example: 'An attacker discovers AKIA keys committed to a public GitHub repository. Using the AWS CLI they enumerate
      S3 buckets, download customer PII from a data-lake bucket, then pivot to RDS via the same IAM principal.

      '
    example_payload: 'aws configure set aws_access_key_id AKIAEXAMPLEKEY1234

      aws configure set aws_secret_access_key ExAmPlEsEcReTkEy0123456789abcdefghij

      aws s3 ls

      aws s3 cp s3://target-bucket/customers.csv .

      '
    attacker_objective: 'Gain full programmatic access to the AWS account to exfiltrate data, spin up crypto-mining instances,
      or pivot deeper into the cloud estate.

      '
  confidence_factors:
    pattern_strength: 0.96
    context_match: 0.9
    proximity_to_user_input: 0.3
    sanitization_absence: 0.95
  impact: 'Exposed AWS credentials allow full access to the associated AWS account,

    including S3 data, EC2 instances, RDS databases, and IAM management.

    '
  remediation: "General\n- Use environment variables or AWS Secrets Manager.\n- Use IAM roles for EC2/ECS/Lambda instead of\
    \ access keys.\n- Rotate compromised credentials immediately via the IAM console.\n- Enable AWS CloudTrail to audit key\
    \ usage.\n- Use aws-vault or similar tools for local development.\n\nAWS-specific\n- Use IAM Roles Anywhere for on-premises\
    \ workloads.\n- Enforce SCP policies that deny long-term key creation.\n- Run \"aws iam create-access-key\" rotation scripts\
    \ on a schedule.\n\nGCP equivalent\n- Use Workload Identity Federation to eliminate service-account keys.\n- Store any\
    \ required keys in GCP Secret Manager.\n\nAzure equivalent\n- Use Managed Identities for Azure resources.\n- Store secrets\
    \ in Azure Key Vault with access policies.\n\nHashiCorp Vault\n- Enable the AWS secrets engine for dynamic, short-lived\
    \ credentials.\n- Configure leases and automatic revocation.\n\nCI/CD\n- Inject credentials via GitHub Actions secrets,\
    \ GitLab CI variables, or\n  CircleCI contexts -- never embed in pipeline YAML.\n- Use OIDC federation for cloud access\
    \ from CI runners.\n"
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-002
    - SEC-003
    - SEC-006
  detection_layer: 1
- rule_id: SEC-002
  title: Hardcoded API Key or Token
  description: 'Detects hardcoded API keys, bearer tokens, and authentication tokens in source code and configuration files.  Includes
    provider-specific patterns for Stripe, Slack, Twilio, SendGrid, Mailgun, Datadog, and generic key-assignment idioms.

    '
  language: all
  category: secrets
  severity: High
  confidence: 0.88
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - api-key
  - bearer-token
  - hardcoded-secret
  - stripe
  - slack
  - twilio
  - sendgrid
  patterns:
  - type: regex
    pattern: (?:api_key|apikey|api_token|apiToken|API_KEY|API_TOKEN)\s*[:=]\s*['"][a-zA-Z0-9_\-]{20,}['"]
  - type: regex
    pattern: (?:bearer|token|auth_token|access_token|secret_token)\s*[:=]\s*['"][a-zA-Z0-9_\-\.]{20,}['"]
  - type: regex
    pattern: (?:Authorization|authorization)\s*[:=]\s*['"]Bearer\s+[a-zA-Z0-9_\-\.]{20,}['"]
  - type: regex
    pattern: (?:x-api-key|X-API-KEY|X-Api-Key)\s*[:=]\s*['"][a-zA-Z0-9_\-]{20,}['"]
  - type: regex
    description: Stripe secret or restricted key
    pattern: (?:sk_live_|rk_live_)[a-zA-Z0-9]{24,}
  - type: regex
    description: Slack Bot / User / Webhook token
    pattern: xox[bpas]-[0-9a-zA-Z\-]{10,}
  - type: regex
    description: Slack webhook URL with embedded token
    pattern: https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[a-zA-Z0-9]{24}
  - type: regex
    description: Twilio API key or Auth Token
    pattern: (?:TWILIO_AUTH_TOKEN|twilio_auth_token|TWILIO_API_KEY)\s*[:=]\s*['"][a-f0-9]{32}['"]
  - type: regex
    description: SendGrid API key
    pattern: SG\.[a-zA-Z0-9_\-]{22}\.[a-zA-Z0-9_\-]{43}
  - type: regex
    description: Mailgun private API key
    pattern: key-[a-f0-9]{32}
  - type: regex
    description: Datadog API or Application key
    pattern: (?:DD_API_KEY|DD_APP_KEY|datadog_api_key)\s*[:=]\s*['"][a-f0-9]{32,40}['"]
  - type: regex
    description: Google API key
    pattern: AIza[0-9A-Za-z_\-]{35}
  anti_patterns:
  - placeholder
  - example
  - YOUR_
  - <your
  - CHANGE_ME
  - TODO
  - INSERT_
  - REPLACE_ME
  - xxx
  - dummy
  - process.env
  - os.environ
  - os.Getenv
  - System.getenv
  - ENV[
  - env(
  - getenv(
  - config.
  - settings.
  - configuration[
  - test
  - spec/
  - fixture
  - mock
  - __test__
  - __mocks__
  - testdata
  - fake
  - stub
  - vault.
  - secretsmanager
  - keyvault
  - SecretClient
  - get_secret
  context_awareness:
    surrounding_context_patterns:
    - fetch(
    - axios.
    - requests.
    - http.request
    - HttpClient
    - headers
    - curl
    taint_source_indicators:
    - request.body
    - request.params
    - request.query
    - event.body
    taint_sink_indicators:
    - fetch(
    - axios.post
    - requests.post
    - HttpClient.send
    - curl_exec
    sanitization_patterns:
    - secrets manager lookup
    - vault read
    - parameter store
    - key rotation call
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * context_match
    exploitability_score: 8.5
  exploit_scenario:
    attack_example: 'An attacker finds a Stripe live secret key in a public repository. They use the Stripe API to list customer
      payment methods, issue refunds to attacker-controlled accounts, or exfiltrate cardholder metadata.

      '
    example_payload: "curl https://api.stripe.com/v1/customers \\\n  -u sk_live_LEAKED_KEY_HERE:\n"
    attacker_objective: 'Abuse third-party service APIs for data exfiltration, financial fraud, or denial-of-service by exhausting
      rate-limited quotas.

      '
  confidence_factors:
    pattern_strength: 0.85
    context_match: 0.8
    proximity_to_user_input: 0.25
    sanitization_absence: 0.9
  impact: 'Hardcoded API keys grant unauthorized access to third-party services,

    potentially exposing sensitive data or incurring unauthorized charges.

    '
  remediation: "General\n- Store API keys in environment variables.\n- Use a secrets management service.\n- Implement key\
    \ rotation policies.\n- Use .gitignore to exclude .env files from version control.\n\nAWS\n- Use AWS Secrets Manager or\
    \ SSM Parameter Store for API keys.\n- Rotate secrets automatically with Lambda rotation functions.\n\nGCP\n- Store keys\
    \ in GCP Secret Manager with automatic replication.\n- Use API key restrictions (HTTP referrer, IP, API scope).\n\nAzure\n\
    - Use Azure Key Vault with RBAC-based access policies.\n- Enable soft-delete and purge-protection for key recovery.\n\n\
    HashiCorp Vault\n- Store API keys in the KV v2 secrets engine.\n- Use dynamic secrets where provider APIs support it.\n\
    - Enforce short TTLs and automatic lease renewal.\n\nCI/CD\n- Map secrets to environment variables in GitHub Actions,\
    \ GitLab CI,\n  or Jenkins credential stores.\n- Never echo secret values in build logs; mask them explicitly.\n"
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://stripe.com/docs/keys
  - https://api.slack.com/authentication/token-types
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - SEC-001
    - SEC-006
    - SEC-007
  detection_layer: 1
- rule_id: SEC-003
  title: Hardcoded Database Connection String with Credentials
  description: 'Detects database connection strings containing embedded usernames and passwords in source code.  Covers PostgreSQL,
    MySQL, MongoDB, Redis, MSSQL, Oracle, CockroachDB, Cassandra / CQL, and JDBC URIs.

    '
  language: all
  category: secrets
  severity: Critical
  confidence: 0.93
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - database
  - connection-string
  - hardcoded-credentials
  - postgres
  - mysql
  - mongodb
  - redis
  patterns:
  - type: regex
    pattern: (?:postgres|postgresql|mysql|mongodb|mongodb\+srv|redis|amqp|mssql)://[^:]+:[^@]+@[^/\s]+/\w+
  - type: regex
    pattern: Data\s+Source\s*=[^;]+;\s*(?:User\s+Id|uid)\s*=[^;]+;\s*(?:Password|pwd)\s*=[^;]+
  - type: regex
    pattern: jdbc:[a-z]+://[^?]+\?user=[^&]+&password=[^&\s]+
  - type: regex
    pattern: (?:DATABASE_URL|DB_URL|MONGO_URI|REDIS_URL)\s*[:=]\s*['"](?:postgres|mysql|mongodb|redis)://[^:]+:[^@]+@
  - type: regex
    description: Oracle thin-client JDBC with inline credentials
    pattern: jdbc:oracle:thin:[^/]+/[^@]+@
  - type: regex
    description: CockroachDB connection string
    pattern: cockroachdb://[^:]+:[^@]+@[^/\s]+:\d+/\w+
  - type: regex
    description: Cassandra / CQL connection with password
    pattern: (?:cassandra_password|CASSANDRA_PASSWORD|cql_password)\s*[:=]\s*['"][^'"]{8,}['"]
  - type: regex
    description: Django DATABASES dict with PASSWORD
    pattern: '[''"]\s*PASSWORD\s*[''"]s*:\s*[''"][^''"]{8,}[''"]'
  - type: regex
    description: SQLAlchemy create_engine with inline creds
    pattern: create_engine\s*\(\s*['"](?:postgres|mysql|mssql|oracle)[^'"]*://[^:]+:[^@]+@
  - type: regex
    description: Elasticsearch connection with embedded credentials
    pattern: (?:https?://)[^:]+:[^@]+@[^/\s]*(?::9200|:9243|\.es\.)
  anti_patterns:
  - localhost
  - 127.0.0.1
  - example.com
  - password
  - <password>
  - changeme
  - CHANGE_ME
  - process.env
  - os.environ
  - os.Getenv
  - System.getenv
  - ENV[
  - env(
  - getenv(
  - test
  - spec/
  - fixture
  - mock
  - __test__
  - __mocks__
  - testdata
  - docker-compose
  - devcontainer
  - config.
  - settings.
  - appsettings.
  - secretsmanager
  - keyvault
  - vault.
  - chamber
  - parameter_store
  context_awareness:
    surrounding_context_patterns:
    - import psycopg2
    - import pymongo
    - import mysql.connector
    - require('pg')
    - require('mongoose')
    - SqlConnection
    - DriverManager.getConnection
    - create_engine
    taint_source_indicators:
    - user input
    - request.body
    - command line argument
    - argv
    - stdin
    taint_sink_indicators:
    - cursor.execute
    - db.query
    - collection.find
    - execute_query
    - raw SQL
    sanitization_patterns:
    - IAM database authentication
    - SSL certificate auth
    - secrets manager
    - vault read database/
    - PGPASSFILE
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (exploitability_score / 10)
    exploitability_score: 9.5
  exploit_scenario:
    attack_example: 'An attacker discovers a MongoDB connection URI with credentials in a leaked Docker build log.  They connect
      using mongosh, dump the entire users collection, and exfiltrate personal data including emails and hashed passwords.

      '
    example_payload: 'mongosh "mongodb://admin:S3cr3tP@ss@prod-db.example.com:27017/maindb"

      db.users.find().toArray()

      '
    attacker_objective: 'Gain direct read/write access to production databases to steal data, plant backdoors, or destroy
      records.

      '
  confidence_factors:
    pattern_strength: 0.92
    context_match: 0.88
    proximity_to_user_input: 0.2
    sanitization_absence: 0.93
  impact: 'Exposed database credentials allow direct database access, enabling data

    theft, modification, and deletion.

    '
  remediation: "General\n- Store connection strings in environment variables.\n- Use IAM-based database authentication where\
    \ possible.\n- Use connection poolers with secrets rotation.\n- Never commit .env files to version control.\n\nAWS\n-\
    \ Use RDS IAM Authentication to eliminate passwords entirely.\n- Store connection strings in AWS Secrets Manager with\
    \ automatic\n  rotation via a Lambda function.\n- Use RDS Proxy for connection pooling and IAM auth.\n\nGCP\n- Use Cloud\
    \ SQL IAM database authentication.\n- Store credentials in GCP Secret Manager.\n- Connect via the Cloud SQL Auth proxy.\n\
    \nAzure\n- Use Azure AD authentication for Azure SQL / Cosmos DB.\n- Store connection strings in Azure Key Vault.\n- Use\
    \ Managed Identity to access Key Vault at runtime.\n\nHashiCorp Vault\n- Enable the database secrets engine for dynamic,\
    \ short-lived\n  database credentials with automatic revocation.\n- Configure roles with strict time-to-live (TTL).\n\n\
    CI/CD\n- Inject database URLs via CI/CD secret variables.\n- Use ephemeral databases for integration tests so production\n\
    \  credentials are never needed in pipelines.\n"
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html
  - https://www.mongodb.com/docs/manual/tutorial/configure-scram-client-authentication/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-001
    - SEC-007
  detection_layer: 1
- rule_id: SEC-004
  title: Hardcoded Private Key or Certificate
  description: 'Detects embedded private keys, certificates, or PEM-encoded secrets in source code.  Covers RSA, DSA, EC,
    Ed25519, OpenSSH, PGP, PKCS#8, and encrypted PEM blocks.

    '
  language: all
  category: secrets
  severity: Critical
  confidence: 0.98
  cwe: CWE-321
  owasp: A02:2021-Cryptographic-Failures
  tags:
  - private-key
  - certificate
  - pem
  - tls
  - ssh
  - pgp
  - pkcs8
  patterns:
  - type: regex
    pattern: '-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'
  - type: regex
    pattern: '-----BEGIN\s+(?:DSA|EC|OPENSSH)\s+PRIVATE\s+KEY-----'
  - type: regex
    pattern: '-----BEGIN\s+PGP\s+PRIVATE\s+KEY\s+BLOCK-----'
  - type: regex
    pattern: '-----BEGIN\s+CERTIFICATE-----'
  - type: regex
    description: PKCS#8 encoded private key
    pattern: '-----BEGIN\s+ENCRYPTED\s+PRIVATE\s+KEY-----'
  - type: regex
    description: Ed25519 private key header
    pattern: '-----BEGIN\s+PRIVATE\s+KEY-----'
  - type: regex
    description: SSH private key inline (base64 blob after header)
    pattern: '-----BEGIN\s+OPENSSH\s+PRIVATE\s+KEY-----\s*[A-Za-z0-9+/=\s]{40,}'
  - type: regex
    description: PuTTY PPK private key format
    pattern: PuTTY-User-Key-File-[23]:\s*ssh-
  - type: regex
    description: Hex-encoded private key (Ethereum / blockchain wallets)
    pattern: (?:private_key|PRIVATE_KEY|privateKey)\s*[:=]\s*['"](?:0x)?[a-fA-F0-9]{64}['"]
  anti_patterns:
  - test
  - example
  - fixture
  - mock
  - sample
  - __test__
  - __mocks__
  - testdata
  - fake
  - dummy
  - spec/
  - process.env
  - os.environ
  - os.Getenv
  - System.getenv
  - ENV[
  - vault.
  - keyvault
  - secretsmanager
  - KMS
  - kms_key
  - file_reference
  - load_pem
  - read_file(
  context_awareness:
    surrounding_context_patterns:
    - ssl_context
    - tls.createSecureContext
    - crypto.createPrivateKey
    - load_pem_private_key
    - SSLContext
    - x509
    - openssl
    taint_source_indicators:
    - user-uploaded certificate
    - request.files
    - multipart upload
    taint_sink_indicators:
    - tls.connect
    - https.createServer
    - ssl.wrap_socket
    - jwt.sign
    - crypto.sign
    sanitization_patterns:
    - load from file path
    - KMS decrypt
    - Vault transit engine
    - HSM reference
    - PKCS#11 handle
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * exploitability_score / 10
    exploitability_score: 9.0
  exploit_scenario:
    attack_example: 'An attacker extracts an RSA private key from a leaked Docker image layer.  They use it to perform a man-in-the-middle
      attack on HTTPS traffic destined for the application''s domain, intercepting user credentials and session tokens.

      '
    example_payload: 'openssl s_server -key leaked_key.pem -cert forged_cert.pem -accept 443

      # In a separate terminal, redirect victim traffic to this server

      '
    attacker_objective: 'Impersonate the server, decrypt TLS traffic, forge code-signing signatures, or authenticate as the
      key owner.

      '
  confidence_factors:
    pattern_strength: 0.98
    context_match: 0.92
    proximity_to_user_input: 0.1
    sanitization_absence: 0.97
  impact: 'Exposed private keys enable impersonation, man-in-the-middle attacks,

    data decryption, and unauthorized access to encrypted resources.

    '
  remediation: "General\n- Store private keys in secure key management systems (KMS, HSM).\n- Use file-based references instead\
    \ of inline keys.\n- Implement automated key rotation.\n- Use certificate managers (Let's Encrypt, ACM).\n\nAWS\n- Use\
    \ AWS Certificate Manager (ACM) for TLS certificates.\n- Store private keys in AWS KMS or CloudHSM.\n- Use ACM Private\
    \ CA for internal PKI.\n\nGCP\n- Use Google Cloud Certificate Manager.\n- Store keys in Cloud KMS with IAM-controlled\
    \ access.\n- Use Certificate Authority Service for internal CAs.\n\nAzure\n- Use Azure Key Vault for certificate and key\
    \ storage.\n- Enable Azure App Service managed certificates.\n- Use Azure Dedicated HSM for highest assurance workloads.\n\
    \nHashiCorp Vault\n- Use the PKI secrets engine to issue short-lived certificates.\n- Store static keys in the Transit\
    \ engine for encrypt/decrypt\n  operations without exposing raw key material.\n\nCI/CD\n- Use CI/CD platform certificate\
    \ and key storage (e.g., GitHub\n  Actions secrets, GitLab CI file-type variables).\n- Inject keys at runtime; never bake\
    \ them into container images.\n"
  references:
  - https://cwe.mitre.org/data/definitions/321.html
  - https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html
  - https://developer.hashicorp.com/vault/docs/secrets/pki
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-005
    - SEC-006
  detection_layer: 1
- rule_id: SEC-005
  title: Hardcoded JWT Secret
  description: 'Detects hardcoded JWT signing secrets in source code, including symmetric HMAC keys (HS256/384/512) and inline
    passphrases used with jose, jsonwebtoken, PyJWT, and similar libraries.

    '
  language: all
  category: secrets
  severity: Critical
  confidence: 0.91
  cwe: CWE-798
  owasp: A02:2021-Cryptographic-Failures
  tags:
  - jwt
  - signing-secret
  - authentication
  - hmac
  - token-forgery
  patterns:
  - type: regex
    pattern: (?:jwt_secret|JWT_SECRET|jwtSecret|jwt_key|JWT_KEY|secret_key|SECRET_KEY)\s*[:=]\s*['"][a-zA-Z0-9_\-!@#$%^&*()]{8,}['"]
  - type: regex
