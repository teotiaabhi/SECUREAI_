- rule_id: SEC-010
  title: SendGrid API Key Exposure
  description: 'Detects SendGrid API keys committed to source code. SendGrid API keys follow a distinctive SG. prefix format
    and provide access to email sending, template management, contact lists, and analytics. Exposed keys enable mass phishing
    campaigns, spam sending, and exfiltration of email contact databases from the victim''s account.

    '
  language: all
  category: secrets
  severity: High
  confidence: 0.97
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - sendgrid
  - email
  - api-key
  - hardcoded-secret
  - phishing-vector
  patterns:
  - type: regex
    description: SendGrid API key (standard format)
    pattern: SG\.[a-zA-Z0-9_\-]{22}\.[a-zA-Z0-9_\-]{43}
  - type: regex
    description: SendGrid key in variable assignment
    pattern: (?:SENDGRID_API_KEY|SENDGRID_KEY|sendgrid_api_key)\s*[:=]\s*['"]SG\.[^'"\s]+
  - type: regex
    description: SendGrid authorization header
    pattern: (?:Authorization|authorization)\s*[:=]\s*['"]Bearer\s+SG\.[a-zA-Z0-9_\-]{22}\.[a-zA-Z0-9_\-]{43}['"]
  - type: regex
    description: SendGrid transport configuration
    pattern: (?:api_key|apiKey|api_key_id)\s*[:=]\s*['"]SG\.[^'"\s]+
  - type: regex
    description: SendGrid SMTP password (uses API key)
    pattern: (?:smtp_password|SMTP_PASSWORD|smtpPassword)\s*[:=]\s*['"]SG\.[^'"\s]+
  anti_patterns:
  - process.env
  - os.environ
  - ENV[
  - ${SENDGRID
  - $SENDGRID
  - ${{ secrets.
  - placeholder
  - example
  - CHANGE_ME
  - REPLACE_ME
  - YOUR_API_KEY
  - test
  - fixture
  - mock
  - __test__
  - vault.
  - secretsmanager
  context_awareness:
    surrounding_context_patterns:
    - '@sendgrid/mail'
    - sendgrid
    - sgMail
    - send_email
    - smtp.sendgrid.net
    - mail/send
    taint_source_indicators:
    - API key configuration
    - environment variable
    - .env file
    - config file
    taint_sink_indicators:
    - sgMail.send
    - sendgrid.send
    - mail/send API
    - smtp.sendgrid.net
    sanitization_patterns:
    - process.env.SENDGRID_API_KEY
    - secrets manager
    - vault read
    - parameter store
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * email_abuse_impact_factor
    exploitability_score: 9.0
  exploit_scenario:
    attack_example: 'An attacker finds a SendGrid API key in a public repository. They use it to send thousands of phishing
      emails impersonating the victim''s domain, abuse their sender reputation, and access marketing contact lists containing
      customer email addresses.

      '
    example_payload: "curl --request POST \\\n  --url https://api.sendgrid.com/v3/mail/send \\\n  --header \"Authorization:\
      \ Bearer SG.LEAKED_KEY\" \\\n  --header \"Content-Type: application/json\" \\\n  --data '{\"personalizations\":[{\"\
      to\":[{\"email\":\"victim@example.com\"}]}],\"from\":{\"email\":\"ceo@company.com\"},\"subject\":\"Urgent Wire Transfer\"\
      ,\"content\":[{\"type\":\"text/html\",\"value\":\"<p>Please initiate...</p>\"}]}'\n"
    attacker_objective: 'Send phishing emails from a trusted domain, exfiltrate contact lists, abuse sender reputation, or
      disrupt email service.

      '
  confidence_factors:
    pattern_strength: 0.97
    context_match: 0.88
    proximity_to_user_input: 0.15
    sanitization_absence: 0.95
  impact: 'Exposed SendGrid API keys enable mass email sending for phishing

    or spam, access to contact lists and templates, and potential domain

    reputation damage leading to email deliverability issues.

    '
  remediation: 'General

    - Store SendGrid API keys in environment variables or secrets manager

    - Use API keys with minimal permissions (Mail Send only)

    - Enable IP access management in SendGrid settings

    - Rotate compromised keys immediately in SendGrid dashboard


    Best Practices

    - Use SendGrid subuser accounts for different applications

    - Enable 2FA on SendGrid account

    - Monitor email sending activity for anomalies

    - Use domain authentication (SPF, DKIM, DMARC) to limit abuse impact

    '
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://docs.sendgrid.com/for-developers/sending-email/api-keys
  - https://docs.sendgrid.com/ui/account-and-settings/api-keys
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-002
    - SEC-011
  detection_layer: 1
- rule_id: SEC-011
  title: Twilio Credentials Exposure
  description: 'Detects Twilio Account SIDs, Auth Tokens, and API keys committed to source code. Twilio credentials provide
    access to SMS sending, voice calling, phone number management, and communication logs. Exposed credentials enable toll
    fraud, SMS phishing (smishing), and access to call recordings containing sensitive conversations.

    '
  language: all
  category: secrets
  severity: High
  confidence: 0.93
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - twilio
  - sms
  - voice
  - api-credentials
  - hardcoded-secret
  - toll-fraud
  patterns:
  - type: regex
    description: Twilio Account SID
    pattern: AC[a-f0-9]{32}
  - type: regex
    description: Twilio Auth Token in variable
    pattern: (?:TWILIO_AUTH_TOKEN|twilio_auth_token|twilioAuthToken)\s*[:=]\s*['"][a-f0-9]{32}['"]
  - type: regex
    description: Twilio API Key SID
    pattern: SK[a-f0-9]{32}
  - type: regex
    description: Twilio API Secret in variable
    pattern: (?:TWILIO_API_SECRET|twilio_api_secret|twilioApiSecret)\s*[:=]\s*['"][a-zA-Z0-9]{32}['"]
  - type: regex
    description: Twilio connection string with SID and token
    pattern: twilio\.com.*AC[a-f0-9]{32}.*[a-f0-9]{32}
  - type: regex
    description: Twilio client initialization with inline credentials
    pattern: (?:Twilio|Client)\s*\(\s*['"]AC[a-f0-9]{32}['"]
  - type: regex
    description: Twilio phone number with auth
    pattern: (?:TWILIO_PHONE|twilio_phone|from_number)\s*[:=]\s*['"]?\+?[0-9]{10,}
  anti_patterns:
  - process.env
  - os.environ
  - ENV[
  - ${TWILIO
  - $TWILIO
  - ${{ secrets.
  - placeholder
  - example
  - CHANGE_ME
  - REPLACE_ME
  - YOUR_
  - test
  - fixture
  - mock
  - __test__
  - vault.
  - secretsmanager
  - ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  context_awareness:
    surrounding_context_patterns:
    - twilio
    - require('twilio')
    - from twilio.rest import
    - TwilioRestClient
    - messages.create
    - calls.create
    - sms
    taint_source_indicators:
    - configuration file
    - environment variable
    - .env file
    - config module
    taint_sink_indicators:
    - messages.create
    - calls.create
    - api.twilio.com
    - lookups.twilio.com
    - client.messages
    sanitization_patterns:
    - process.env.TWILIO_AUTH_TOKEN
    - secrets manager
    - vault read
    - parameter store
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * toll_fraud_impact_factor
    exploitability_score: 9.0
  exploit_scenario:
    attack_example: 'An attacker discovers Twilio credentials in a public repository. They use the Account SID and Auth Token
      to send thousands of SMS phishing messages impersonating banks, purchase premium rate phone numbers for toll fraud,
      and access call recordings containing customer support conversations with PII.

      '
    example_payload: "from twilio.rest import Client\nclient = Client(\"ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\", \"LEAKED_AUTH_TOKEN\"\
      )\n# Send phishing SMS\nclient.messages.create(body=\"Your account has been locked. Verify: https://evil.com\", from_=\"\
      +15551234567\", to=\"+15559876543\")\n# List call recordings\nfor recording in client.recordings.list():\n    print(recording.uri)\n"
    attacker_objective: 'Commit toll fraud via premium-rate calls, send smishing messages at the victim''s expense, access
      call recordings and SMS logs, or pivot using phone-based 2FA bypass.

      '
  confidence_factors:
    pattern_strength: 0.92
    context_match: 0.88
    proximity_to_user_input: 0.2
    sanitization_absence: 0.93
  impact: 'Exposed Twilio credentials enable toll fraud (potentially costing

    thousands per hour), SMS phishing campaigns, access to call recordings

    and SMS logs containing PII, and potential 2FA bypass through phone

    number hijacking.

    '
  remediation: 'General

    - Store Twilio credentials in environment variables or secrets manager

    - Use API Key/Secret pairs instead of Account SID/Auth Token

    - Enable IP access restrictions in Twilio console

    - Set usage triggers and spending limits


    Best Practices

    - Use Twilio subaccounts for different applications

    - Enable Fraud Guard and Geo Permissions

    - Monitor usage for anomalies via Twilio debugger

    - Rotate Auth Tokens regularly in Twilio console

    '
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://www.twilio.com/docs/usage/secure-credentials
  - https://www.twilio.com/docs/usage/api/keys
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-002
    - SEC-010
  detection_layer: 1
- rule_id: SEC-012
  title: Firebase Service Account Key
  description: 'Detects Firebase and Google Cloud service account private keys, Firebase Admin SDK credentials, and Firebase
    configuration objects with sensitive server-side API keys committed to source code. Firebase service accounts provide
    administrative access to Firebase projects including Firestore, Realtime Database, Cloud Storage, Authentication, and
    Cloud Functions.

    '
  language: all
  category: secrets
  severity: High
  confidence: 0.92
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - firebase
  - google-cloud
  - service-account
  - admin-sdk
  - hardcoded-secret
  - cloud
  patterns:
  - type: regex
    description: Firebase service account private key ID
    pattern: '"private_key_id"\s*:\s*"[a-f0-9]{40}"'
  - type: regex
    description: Firebase private key PEM header
    pattern: '"private_key"\s*:\s*"-----BEGIN (?:RSA )?PRIVATE KEY-----'
  - type: regex
    description: Firebase project configuration
    pattern: '"type"\s*:\s*"service_account"[^}]*"project_id"\s*:\s*"[a-z0-9\-]+"'
  - type: regex
    description: Firebase Admin SDK initialization with inline credentials
    pattern: admin\.initializeApp\s*\(\s*\{[^}]*credential\s*[:=]
  - type: regex
    description: Firebase server API key
    pattern: (?:FIREBASE_API_KEY|firebase_api_key|firebaseApiKey)\s*[:=]\s*['"]AIza[0-9A-Za-z_\-]{35}['"]
  - type: regex
    description: Firebase Admin credential from JSON
    pattern: admin\.credential\.cert\s*\(\s*\{[^}]*private_key
  - type: regex
    description: Firebase database URL with secret
    pattern: firebaseio\.com.*[?&]auth=[a-zA-Z0-9_\-]{20,}
  anti_patterns:
  - process.env
  - os.environ
  - ENV[
  - ${FIREBASE
  - $FIREBASE
  - ${{ secrets.
  - placeholder
  - example
  - CHANGE_ME
  - your-project-id
  - test
  - fixture
  - mock
  - __test__
  - vault.
  - secretsmanager
  - GOOGLE_APPLICATION_CREDENTIALS
  - applicationDefault()
  context_awareness:
    surrounding_context_patterns:
    - firebase-admin
    - firebase
    - initializeApp
    - firestore
    - admin.auth()
    - admin.storage()
    - firebase-functions
    taint_source_indicators:
    - service account JSON file
    - configuration file
    - .env file
    - JSON import
    taint_sink_indicators:
    - admin.initializeApp
    - admin.credential.cert
    - firebase.initializeApp
    - ServiceAccountCredentials
    sanitization_patterns:
    - GOOGLE_APPLICATION_CREDENTIALS env var
    - admin.credential.applicationDefault()
    - secrets manager
    - vault read
    - workload identity
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: 9.5
  exploit_scenario:
    attack_example: 'An attacker discovers a Firebase service account JSON key in a public repository. They use the Admin
      SDK to bypass all security rules, read the entire Firestore database including user PII, modify Authentication records
      to take over user accounts, and access Cloud Storage buckets containing uploaded files.

      '
    example_payload: "import firebase_admin\nfrom firebase_admin import credentials, firestore\ncred = credentials.Certificate(\"\
      leaked-service-account.json\")\nfirebase_admin.initialize_app(cred)\ndb = firestore.client()\n# Read all users\nfor\
      \ doc in db.collection('users').stream():\n    print(doc.to_dict())\n"
    attacker_objective: 'Gain administrative access to Firebase project resources to exfiltrate data, modify authentication,
      or abuse cloud services.

      '
  confidence_factors:
    pattern_strength: 0.91
    context_match: 0.9
    proximity_to_user_input: 0.15
    sanitization_absence: 0.92
  impact: 'Firebase service account keys provide full administrative access to

    Firebase projects, bypassing all client-side security rules. This

    enables data exfiltration from Firestore/RTDB, user account takeover

    via Authentication admin, and access to all Cloud Storage files.

    '
  remediation: 'General

    - Use GOOGLE_APPLICATION_CREDENTIALS env var to point to key file

    - Use admin.credential.applicationDefault() in code

    - Never commit service account JSON files to version control

    - Add *-service-account*.json to .gitignore


    Cloud-Native

    - Use Workload Identity (GKE) or metadata server (GCE/Cloud Run)

    - Use Firebase App Check for client-side security

    - Rotate service account keys regularly in GCP console


    CI/CD

    - Store service account JSON as CI/CD secret variable

    - Use OIDC federation for GitHub Actions to GCP access

    - Use Workload Identity Federation to eliminate key files entirely

    '
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://firebase.google.com/docs/admin/setup
  - https://cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-001
    - SEC-013
    - SEC-004
  detection_layer: 1
- rule_id: SEC-013
  title: GCP Service Account JSON Key
  description: 'Detects Google Cloud Platform service account credential files and inline JSON key material in source code.
    GCP service account keys provide programmatic access to Google Cloud APIs and resources. Unlike Firebase-specific rules,
    this covers general GCP service account patterns for Compute Engine, BigQuery, Cloud Storage, Kubernetes Engine, and other
    GCP services.

    '
  language: all
  category: secrets
  severity: Critical
  confidence: 0.94
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - gcp
  - google-cloud
  - service-account
  - iam
  - hardcoded-secret
  - cloud
  patterns:
  - type: regex
    description: GCP service account type identifier
    pattern: '"type"\s*:\s*"service_account"'
  - type: regex
    description: GCP service account email
    pattern: '"client_email"\s*:\s*"[a-z0-9\-]+@[a-z0-9\-]+\.iam\.gserviceaccount\.com"'
  - type: regex
    description: GCP private key in JSON
    pattern: '"private_key"\s*:\s*"-----BEGIN (?:RSA )?PRIVATE KEY-----\\n'
  - type: regex
    description: GCP OAuth2 client secret
    pattern: '"client_secret"\s*:\s*"[a-zA-Z0-9_\-]{24}"[^}]*"redirect_uris"'
  - type: regex
    description: GCP API key
    pattern: AIza[0-9A-Za-z_\-]{35}
  - type: regex
    description: GCP credentials variable assignment
    pattern: (?:GOOGLE_APPLICATION_CREDENTIALS|GCP_CREDENTIALS|GCLOUD_KEY)\s*[:=]\s*['"]?(?:\{|/[^\s]+\.json)
  - type: regex
    description: GCP service account key ID
    pattern: '"private_key_id"\s*:\s*"[a-f0-9]{40}"[^}]*"client_email"\s*:\s*"[^"]*gserviceaccount\.com"'
  anti_patterns:
  - os.environ
  - process.env
  - ENV[
  - ${GCP
  - $GOOGLE
  - ${{ secrets.
  - placeholder
  - example
  - CHANGE_ME
  - your-project
  - test
  - fixture
  - mock
  - __test__
  - vault.
  - secretsmanager
  - applicationDefault()
  - workload-identity
  context_awareness:
    surrounding_context_patterns:
    - google.cloud
    - from google.oauth2 import
    - require('@google-cloud')
    - google.auth
    - ServiceAccountCredentials
    - bigquery
    - storage.Client
    taint_source_indicators:
    - JSON key file
    - service account export
    - .env file
    - configuration blob
    taint_sink_indicators:
    - ServiceAccountCredentials.from_json_keyfile
    - google.auth.default
    - storage.Client
    - bigquery.Client
    - compute_v1
    sanitization_patterns:
    - applicationDefault()
    - Workload Identity
    - metadata server
    - secrets manager
    - vault read
    - GOOGLE_APPLICATION_CREDENTIALS env
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * cloud_access_scope_factor
    exploitability_score: 9.5
  exploit_scenario:
    attack_example: 'An attacker discovers a GCP service account JSON key in a leaked CI/CD artifact. The service account
      has BigQuery Data Viewer and Storage Object Viewer roles. They authenticate with the key, query BigQuery datasets containing
      customer analytics data, and download files from Cloud Storage buckets.

      '
    example_payload: 'gcloud auth activate-service-account --key-file=leaked-key.json

      gcloud config set project victim-project-id

      bq query --use_legacy_sql=false ''SELECT * FROM `dataset.users` LIMIT 1000''

      gsutil cp -r gs://victim-bucket/ ./exfiltrated/

      '
    attacker_objective: 'Gain programmatic access to GCP resources to exfiltrate data from BigQuery, Cloud Storage, or Firestore,
      spin up compute instances for cryptomining, or escalate privileges via IAM.

      '
  confidence_factors:
    pattern_strength: 0.93
    context_match: 0.9
    proximity_to_user_input: 0.1
    sanitization_absence: 0.94
  impact: 'GCP service account keys provide full programmatic access to Google

    Cloud resources based on the service account''s IAM roles. This can

    include access to databases, storage, compute, and administrative

    functions depending on granted permissions.

    '
  remediation: 'General

    - Use Workload Identity Federation to eliminate service account keys

    - Use GOOGLE_APPLICATION_CREDENTIALS env var for necessary keys

    - Never commit JSON key files to version control

    - Add *-credentials.json and *-service-account*.json to .gitignore


    GCP-Specific

    - Use Workload Identity for GKE workloads

    - Use attached service accounts for Compute Engine/Cloud Run

    - Disable service account key creation via Organization Policy

    - Enable Service Account Key audit logging

    - Set key expiry and rotation policies


    CI/CD

    - Use OIDC Workload Identity Federation for GitHub Actions/GitLab CI

    - Use GCP Secret Manager for necessary credentials

    - Never expose keys in build logs or artifacts

    '
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
  - https://cloud.google.com/iam/docs/workload-identity-federation
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-001
    - SEC-012
    - SEC-004
  detection_layer: 1
- rule_id: SEC-014
  title: Azure Storage Connection String
  description: 'Detects Azure Storage account connection strings, Shared Access Signature (SAS) tokens, and Azure service
    credentials committed to source code. Azure Storage connection strings contain the account key providing full read/write/delete
    access to all blobs, queues, tables, and file shares in the storage account.

    '
  language: all
  category: secrets
  severity: High
  confidence: 0.95
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - azure
  - storage
  - connection-string
  - sas-token
  - hardcoded-secret
  - cloud
  patterns:
  - type: regex
    description: Azure Storage connection string
    pattern: DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{88};
  - type: regex
    description: Azure Storage account key in variable
    pattern: (?:AZURE_STORAGE_KEY|AZURE_STORAGE_ACCOUNT_KEY|azure_storage_key)\s*[:=]\s*['"][A-Za-z0-9+/=]{88}['"]
  - type: regex
    description: Azure SAS token
    pattern: '[?&](?:sv|sig)=[0-9]{4}-[0-9]{2}-[0-9]{2}[^&\s]*&(?:ss|srt|sp|se|sig)=[^&\s]+'
  - type: regex
    description: Azure connection string in variable
    pattern: (?:AZURE_STORAGE_CONNECTION_STRING|AzureWebJobsStorage|StorageConnectionString)\s*[:=]\s*['"]DefaultEndpointsProtocol=[^'"\s]+
  - type: regex
    description: Azure Cosmos DB connection string
    pattern: AccountEndpoint=https://[^;]+;AccountKey=[A-Za-z0-9+/=]{88};
  - type: regex
    description: Azure SQL connection string with password
    pattern: Server=(?:tcp:)?[^;]+;.*Password=[^;]{8,};
  - type: regex
    description: Azure Service Bus connection string
    pattern: Endpoint=sb://[^;]+;SharedAccessKeyName=[^;]+;SharedAccessKey=[A-Za-z0-9+/=]{44}
  anti_patterns:
  - process.env
  - os.environ
  - ENV[
  - ${AZURE
  - $AZURE
  - ${{ secrets.
  - placeholder
  - example
  - CHANGE_ME
  - UseDevelopmentStorage=true
  - Azurite
  - devstoreaccount1
  - test
  - fixture
  - mock
  - __test__
  - vault.
  - keyvault
  - SecretClient
  context_awareness:
    surrounding_context_patterns:
    - azure-storage-blob
    - '@azure/storage-blob'
    - azure.storage
    - BlobServiceClient
    - CloudStorageAccount
    - TableClient
    - QueueServiceClient
    taint_source_indicators:
    - connection string
    - configuration file
    - appsettings.json
    - .env file
    - web.config
    taint_sink_indicators:
    - BlobServiceClient.from_connection_string
    - CloudStorageAccount.parse
    - TableServiceClient
    - CosmosClient
    - ServiceBusClient
    sanitization_patterns:
    - Azure Key Vault
    - DefaultAzureCredential
    - ManagedIdentityCredential
    - SecretClient
    - process.env.AZURE_STORAGE
    - keyvault reference
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: 9.5
  exploit_scenario:
    attack_example: 'An attacker discovers an Azure Storage connection string in a .NET application''s appsettings.json committed
      to a repository. They use Azure Storage Explorer to connect with the account key, browse all blob containers including
      backup files and user uploads, download a database backup containing customer records, and plant a malicious file in
      the web app''s static assets container.

      '
    example_payload: '# Using Azure CLI with connection string

      az storage blob list --connection-string "DefaultEndpointsProtocol=https;AccountName=victim;AccountKey=LEAKED_KEY;EndpointSuffix=core.windows.net"
      --container-name backups

      az storage blob download --connection-string "..." --container-name backups --name db-backup.sql --file ./stolen-backup.sql

      # Upload malicious content

      az storage blob upload --connection-string "..." --container-name "$web" --file malicious.js --name scripts/analytics.js

      '
    attacker_objective: 'Access Azure Storage blobs, queues, tables, and file shares to exfiltrate data, modify application
      assets, or delete critical backups for ransomware attacks.

      '
  confidence_factors:
    pattern_strength: 0.95
    context_match: 0.9
    proximity_to_user_input: 0.1
    sanitization_absence: 0.95
  impact: 'Azure Storage account keys provide full access to all data in the

    storage account including blobs, queues, tables, and file shares.

    SAS tokens may provide time-limited access but can still expose

    significant amounts of data depending on scope.

    '
  remediation: 'General

    - Use Azure Managed Identity (DefaultAzureCredential) instead of keys

    - Store connection strings in Azure Key Vault

    - Use SAS tokens with minimal scope and short expiry for shared access

    - Rotate storage account keys regularly


    Azure-Specific

    - Enable storage account key rotation via Azure Policy

    - Use Azure AD authentication for storage access

    - Apply Azure Storage firewall rules

    - Enable storage analytics and monitoring

    - Disable shared key access when using Azure AD auth


    CI/CD

    - Use service principal with OIDC for CI/CD access

    - Store connection strings in Azure DevOps variable groups (secret)

    - Use Key Vault references in Azure App Service configuration

    '
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://docs.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
  - https://docs.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SEC-001
    - SEC-003
    - SEC-006
  detection_layer: 1
- rule_id: SEC-015
  title: Generic High-Entropy Secret Detection
  description: 'Detects generic high-entropy strings assigned to secret-like variable names that may represent API keys, tokens,
    passwords, or other credentials not covered by provider-specific rules. This catch-all rule targets variable assignments
    where the variable name suggests a secret and the value has characteristics of a randomly generated credential (sufficient
    length, mixed character set, no dictionary words).

    '
  language: all
  category: secrets
  severity: Medium
  confidence: 0.72
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - generic-secret
  - high-entropy
  - catch-all
  - hardcoded-credential
  - entropy-detection
  patterns:
  - type: regex
    description: Generic secret in variable assignment (snake_case)
    pattern: (?:_secret|_token|_key|_password|_credential|_api_key)\s*[:=]\s*['"][a-zA-Z0-9_\-/+=\.]{20,}['"]
  - type: regex
    description: Generic secret in variable assignment (camelCase)
    pattern: (?:Secret|Token|ApiKey|Password|Credential|AuthKey)\s*[:=]\s*['"][a-zA-Z0-9_\-/+=\.]{20,}['"]
  - type: regex
    description: Generic secret in UPPER_CASE variable
    pattern: (?:SECRET|TOKEN|API_KEY|AUTH_TOKEN|PRIVATE_KEY|ENCRYPTION_KEY|SIGNING_KEY)\s*[:=]\s*['"][a-zA-Z0-9_\-/+=\.]{20,}['"]
  - type: regex
    description: Base64-encoded secret in assignment
    pattern: (?:secret|token|key|password|credential)\s*[:=]\s*['"][A-Za-z0-9+/]{40,}={0,2}['"]
  - type: regex
    description: Hex-encoded secret (32+ chars)
    pattern: (?:secret|token|key|hash|salt)\s*[:=]\s*['"][a-f0-9]{32,}['"]
  - type: regex
    description: Generic auth header with hardcoded token
    pattern: (?:Authorization|X-Auth-Token|X-API-Key)\s*[:=]\s*['"](?:Bearer |Token |Basic )?[a-zA-Z0-9_\-/+=\.]{20,}['"]
  - type: regex
    description: Encryption or signing key assignment
    pattern: (?:ENCRYPTION_KEY|SIGNING_KEY|CIPHER_KEY|HASH_SECRET|APP_SECRET)\s*[:=]\s*['"][^'"\s]{16,}['"]
  anti_patterns:
  - process.env
  - os.environ
  - os.Getenv
  - System.getenv
  - ENV[
  - env(
  - getenv(
  - config.
  - settings.
  - placeholder
  - example
  - CHANGE_ME
  - REPLACE_ME
  - YOUR_
  - <your
  - xxx
  - dummy
  - test
  - spec/
  - fixture
  - mock
  - __test__
  - __mocks__
  - testdata
  - fake
  - stub
  - vault.
  - secretsmanager
  - keyvault
  - get_secret
  - bcrypt
  - hashpw
  - argon2
  - password_hash
  - schema
  - validate
  - 'type:'
  - interface
  - struct
  context_awareness:
    surrounding_context_patterns:
    - import
    - require(
    - from
    - module.exports
    - export
    - class
    - function
    - 'def '
    taint_source_indicators:
    - configuration module
    - constants file
    - .env file
    - hardcoded literal
    taint_sink_indicators:
    - fetch(
    - axios(
    - requests.
    - http.request
    - crypto.
    - jwt.sign
    - authenticate
    - connect(
    sanitization_patterns:
    - environment variable lookup
    - secrets manager
    - vault read
    - parameter store
    - config file reference
    - key rotation
  severity_scoring:
    severity_weight: 5
    risk_score_formula_hint: severity_weight * confidence * context_match * entropy_score
    exploitability_score: 6.0
  exploit_scenario:
    attack_example: 'An attacker discovers a high-entropy string assigned to an ENCRYPTION_KEY variable in an application''s
      configuration module. The key is used to encrypt session tokens. They use the key to decrypt intercepted session cookies,
      forge admin sessions, and gain elevated access to the application.

      '
    example_payload: '# Discovered in source: ENCRYPTION_KEY = "a3f5b8c9d2e1f4g7h0i3j6k9l2m5n8o1p4q7r0s3t6u9v2w5x8y1z4"

      # Use to decrypt session cookie

      from cryptography.fernet import Fernet

      f = Fernet(b"a3f5b8c9d2e1f4g7...")

      decrypted = f.decrypt(intercepted_cookie)

      # Forge admin session

      forged = f.encrypt(b''{"user_id": 1, "role": "admin"}'')

      '
    attacker_objective: 'Leverage discovered cryptographic keys or generic secrets to decrypt data, forge tokens, bypass authentication,
      or gain unauthorized access to protected resources.

      '
  confidence_factors:
    pattern_strength: 0.7
    context_match: 0.65
    proximity_to_user_input: 0.3
    sanitization_absence: 0.75
  impact: 'Generic hardcoded secrets may provide access to various services,

    cryptographic operations, or authentication mechanisms depending on

    their purpose. The impact ranges from data decryption and session

    forgery to full service access.

    '
  remediation: 'General

    - Store all secrets in environment variables or a secrets manager

    - Use .env files locally (excluded from version control)

    - Implement automated secret scanning in CI/CD pipelines

    - Use tools like detect-secrets, gitleaks, or trufflehog


    Detection Tools

    - detect-secrets: baseline scanning with entropy analysis

    - gitleaks: git history scanning for secret patterns

    - trufflehog: deep entropy and pattern analysis

    - GitHub secret scanning: native integration for known patterns


    Prevention

    - Use pre-commit hooks to block secrets from being committed

    - Implement secret rotation policies for all credentials

    - Use short-lived tokens and dynamic secrets where possible

    - Regular codebase audits for hardcoded credentials

    '
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  - https://github.com/Yelp/detect-secrets
