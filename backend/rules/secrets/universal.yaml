  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: 8.0
  exploit_scenario:
    attack_example: 'An attacker discovers a hardcoded LDAP bind password in a configuration class committed to a private
      repository that was later made public.  They use the password to bind to the corporate LDAP directory and enumerate
      all employee accounts, then attempt credential-stuffing attacks against the VPN and email.

      '
    example_payload: "ldapsearch -H ldap://corp.example.com \\\n  -D \"cn=svc_app,ou=ServiceAccounts,dc=example,dc=com\" \\\
      \n  -w \"LeakedP@ssw0rd!\" \\\n  -b \"dc=example,dc=com\" \"(objectClass=person)\"\n"
    attacker_objective: 'Gain authenticated access to internal systems, databases, or third-party services using the leaked
      password.

      '
  confidence_factors:
    pattern_strength: 0.82
    context_match: 0.78
    proximity_to_user_input: 0.45
    sanitization_absence: 0.88
  impact: 'Hardcoded passwords enable unauthorized access to systems, databases,

    and third-party services.

    '
  remediation: "General\n- Use environment variables or secrets management.\n- Implement password rotation policies.\n- Use\
    \ service accounts with managed credentials.\n- Never store passwords in source code, even temporarily.\n\nAWS\n- Use\
    \ AWS Secrets Manager with automatic rotation.\n- Use IAM Roles for service-to-service authentication.\n- Use AWS SSO\
    \ for human access; eliminate shared passwords.\n\nGCP\n- Store passwords in GCP Secret Manager.\n- Use Workload Identity\
    \ for GKE-based services.\n- Use IAM service accounts instead of passwords where\n  the target system supports it.\n\n\
    Azure\n- Store passwords in Azure Key Vault.\n- Use Managed Identities to eliminate passwords for Azure\n  resources entirely.\n\
    - Enable Azure AD Passwordless authentication for humans.\n\nHashiCorp Vault\n- Use the KV v2 secrets engine with versioning.\n\
    - Enable automatic password rotation via custom plugins or\n  the database secrets engine.\n- Use response wrapping to\
    \ deliver secrets securely to\n  applications at startup.\n\nCI/CD\n- Map passwords to masked environment variables in\
    \ CI/CD\n  platforms (GitHub Actions secrets, GitLab CI variables).\n- Use OIDC federation to avoid passwords in CI/CD\
    \ entirely.\n- Audit CI/CD logs for accidental secret exposure.\n"
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  - https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2
