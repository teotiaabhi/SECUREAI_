  exploit_scenario:
    attack_example: 'An attacker discovers a Slack incoming webhook URL in a public repository. They use it to post convincing
      phishing messages to the engineering channel, impersonating a CI/CD bot, directing employees to enter credentials on
      a fake SSO page.

      '
    example_payload: "curl -X POST -H 'Content-type: application/json' \\\n  --data '{\"text\":\"URGENT: Security update required.\
      \ Please re-authenticate at https://attacker-sso.com/login\",\"username\":\"Security Bot\",\"icon_emoji\":\":lock:\"\
      }' \\\n  https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX\n"
    attacker_objective: 'Post phishing messages to internal Slack channels, exfiltrate sensitive information shared in channels,
