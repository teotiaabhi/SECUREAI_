  - login
  patterns:
  - type: regex
    pattern: (?:password|passwd|pwd|pass|secret|credentials)\s*[:=]\s*['"][^'"]{8,}['"]
  - type: regex
    pattern: (?:PASSWORD|PASSWD|PWD|PASS|SECRET)\s*[:=]\s*['"][^'"]{8,}['"]
  - type: regex
    pattern: password\s*:\s*['"][^'"]{8,}['"]
  - type: regex
