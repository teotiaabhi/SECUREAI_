      risk_score_formula_hint: "severity_weight * confidence * (1 + unrestricted_reflection_risk)"
      exploitability_score: "Critical"
    exploit_scenario:
      attack_example: |
        A Java application uses reflection for plugin loading:

        @PostMapping("/api/plugin")
        public String loadPlugin(@RequestParam String className,
                                 @RequestParam String method) {
            Class<?> cls = Class.forName(className);
            Object instance = cls.getDeclaredConstructor().newInstance();
            Method m = cls.getMethod(method);
            Object result = m.invoke(instance);
            return result.toString();
        }

        Attacker sends:
        POST /api/plugin?className=java.lang.Runtime&method=exec
        with appropriate arguments to execute arbitrary commands.
      example_payload: "className=java.lang.ProcessBuilder&method=start"
