# ============================================================================
# Cryptographic Vulnerability Detection Rules - C#
# Ruleset Version: 3.0.0
# Last Updated: 2026-02-28
# Category: Cryptographic Failures (CWE-310, CWE-326, CWE-327, CWE-328)
# Language: C#
# ============================================================================

rules:
  # --------------------------------------------------------------------------
  # CRYPTO-CS-001: DES / 3DES Usage
  # --------------------------------------------------------------------------
  - rule_id: "CRYPTO-CS-001"
    title: "Use of DES or Triple DES (3DES) Encryption"
    description: >
      Detects usage of DES or Triple DES (3DES) algorithms in C# code via
      DESCryptoServiceProvider, TripleDESCryptoServiceProvider, or their factory
      methods. DES uses a 56-bit key that is trivially brute-forced with modern
      hardware in hours. 3DES is deprecated by NIST as of 2023 and is vulnerable
      to the Sweet32 birthday attack on its 64-bit block cipher after processing
      approximately 32 GB of data under the same key. Both RC2CryptoServiceProvider
      and related weak symmetric ciphers are also flagged. Applications must
      migrate to AES-256-GCM or AES-256-CBC with HMAC authentication.
    language: csharp
    category: crypto
    severity: High
    confidence: 0.94
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-cipher
      - des
      - 3des
      - triple-des
      - rc2
      - deprecated-algorithm
      - symmetric-encryption
      - nist-deprecated
      - dotnet
      - csharp
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+DESCryptoServiceProvider\s*\(\s*\)'
        description: "DESCryptoServiceProvider instantiation"
      - type: regex
        pattern: 'new\s+TripleDESCryptoServiceProvider\s*\(\s*\)'
        description: "TripleDESCryptoServiceProvider instantiation"
      - type: regex
        pattern: 'DES\.Create\s*\(\s*\)'
        description: "DES.Create() factory method call"
      - type: regex
        pattern: 'TripleDES\.Create\s*\(\s*\)'
        description: "TripleDES.Create() factory method call"
      - type: regex
        pattern: 'new\s+RC2CryptoServiceProvider\s*\(\s*\)'
        description: "RC2CryptoServiceProvider instantiation"
      - type: regex
        pattern: 'RC2\.Create\s*\(\s*\)'
        description: "RC2.Create() factory method call"
      - type: regex
        pattern: 'SymmetricAlgorithm\.Create\s*\(\s*"(?:DES|3DES|TripleDES|RC2)"\s*\)'
        description: "SymmetricAlgorithm.Create with weak algorithm name"
      - type: regex
        pattern: 'CryptoConfig\.CreateFromName\s*\(\s*"(?:DES|TripleDES|RC2)"\s*\)'
        description: "CryptoConfig factory with weak algorithm name"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#pragma\s+warning\s+disable'
      - '\[Obsolete\]'
      - 'legacy'
      - 'migration'
      - 'backward.*compat'
      - 'decrypt.*only'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
    bypass_variants:
      - description: "Algorithm selected from configuration string"
        pattern: 'SymmetricAlgorithm\.Create\s*\(\s*(?:config|algorithmName|cipherName)\s*\)'
      - description: "DES wrapped in utility class"
        pattern: 'class\s+\w*[Cc]rypt\w*[\s\S]{0,500}DESCryptoServiceProvider'
      - description: "Algorithm registered via dependency injection"
        pattern: 'services\.AddSingleton.*DESCryptoServiceProvider'
      - description: "Dynamically loading DES via reflection"
        pattern: 'Type\.GetType\s*\(\s*"System\.Security\.Cryptography\.DES'
    evasion_indicators:
      - "Cipher algorithm loaded from appsettings.json or web.config"
      - "Algorithm wrapped in service class with innocuous name"
      - "Algorithm registered via dependency injection container"
      - "Reflection-based instantiation of crypto providers"
      - "Algorithm name constructed via string concatenation"
    encoding_variants:
      - type: "fully_qualified"
        pattern: 'System\.Security\.Cryptography\.DESCryptoServiceProvider'
      - type: "using_alias"
        pattern: 'using\s+\w+\s*=\s*System\.Security\.Cryptography\.DES'
      - type: "factory_method"
        pattern: 'CryptoConfig\.CreateFromName\s*\(\s*"(?:DES|TripleDES|RC2)"'
    multi_function_chain_patterns:
      - "DESCryptoServiceProvider -> CreateEncryptor -> CryptoStream -> Write"
      - "TripleDES.Create -> Mode = ECB -> CreateEncryptor -> TransformFinalBlock"
      - "RC2CryptoServiceProvider -> CreateEncryptor -> TransformFinalBlock"
      - "CryptoConfig.CreateFromName -> CreateEncryptor -> TransformBlock"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "DES/RC2 keys are brute-forceable; TripleDES vulnerable to Sweet32 birthday attacks; encrypted data fully recoverable"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_supplied_plaintext"
        sink: "DESCryptoServiceProvider.CreateEncryptor"
        through: "byte array conversion via Encoding.GetBytes"
      - source: "database_record"
        sink: "DES.Create().CreateEncryptor"
        through: "stream wrapper and CryptoStream"
      - source: "sensitive_field"
        sink: "RC2_encryption"
        through: "RC2CryptoServiceProvider.CreateEncryptor"
    impact: |
      DES can be brute-forced in hours with commodity hardware or cloud resources.
      3DES is vulnerable to the Sweet32 birthday attack after processing ~32 GB
      under the same key. RC2 has variable key length with known weaknesses.
      Encrypted data protected by these algorithms should be considered recoverable
      by determined attackers. Non-compliance with PCI-DSS, NIST SP 800-131A,
      and FIPS 140-3.
    remediation: |
      Replace DES/3DES/RC2 with AES-256-GCM (authenticated encryption) or
      AES-256-CBC with HMAC-SHA256:

      ```csharp
      // VULNERABLE: DES encryption
      using var des = new DESCryptoServiceProvider();

      // SECURE: AesGcm (.NET Core 3.0+ / .NET 5+)
      byte[] key = RandomNumberGenerator.GetBytes(32);
      byte[] nonce = RandomNumberGenerator.GetBytes(12);
      byte[] tag = new byte[16];
      byte[] ciphertext = new byte[plaintext.Length];
      using var aesGcm = new AesGcm(key, 16);
      aesGcm.Encrypt(nonce, plaintext, ciphertext, tag);

      // SECURE: Aes with CBC + HMAC (for older .NET)
      using var aes = Aes.Create();
      aes.KeySize = 256;
      aes.Mode = CipherMode.CBC;
      aes.Padding = PaddingMode.PKCS7;
      aes.GenerateIV();
      aes.GenerateKey();
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://sweet32.info/"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
      - "https://nvd.nist.gov/vuln/detail/CVE-2016-2183"
    context_awareness:
      surrounding_context_patterns:
        - 'DESCrypto'
        - 'TripleDES'
        - 'RC2'
        - 'CipherMode'
        - 'CreateEncryptor'
        - 'CryptoStream'
        - 'SymmetricAlgorithm'
      taint_source_indicators:
        - 'Request\.'
        - 'HttpContext'
        - 'Controller'
        - 'IFormFile'
      taint_sink_indicators:
        - 'CreateEncryptor'
        - 'CryptoStream'
        - 'TransformFinalBlock'
        - 'SqlCommand'
      sanitization_patterns:
        - 'Aes\.Create'
        - 'AesGcm'
        - 'AesCcm'
        - 'ChaCha20Poly1305'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + cipher_weakness_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits DES encryption in a legacy ASP.NET application:
        1. Application encrypts session tokens with DESCryptoServiceProvider
        2. Attacker captures encrypted session cookies from network traffic
        3. Using FPGA-based DES cracker, attacker brute-forces the 56-bit key
        4. All current and historical session tokens decrypted within hours
        5. Attacker forges session tokens to impersonate any user including admins
      example_payload: "new DESCryptoServiceProvider() { Mode = CipherMode.ECB }"
      attacker_objective: "Brute-force DES keys or exploit Sweet32 to recover encrypted data in .NET applications"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2026-02-28"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-CS-003"
        - "CRYPTO-CS-004"
        - "CRYPTO-CS-005"

  # --------------------------------------------------------------------------
  # CRYPTO-CS-002: MD5 / SHA1 for Security Purposes
  # --------------------------------------------------------------------------
  - rule_id: "CRYPTO-CS-002"
    title: "Use of MD5 or SHA1 for Security-Critical Hashing"
    description: >
      Detects usage of cryptographically broken hash algorithms MD5 and SHA1 through
      .NET's System.Security.Cryptography namespace. MD5CryptoServiceProvider,
      SHA1CryptoServiceProvider, SHA1Managed, MD5.Create(), and
      HashAlgorithm.Create("MD5"/"SHA1") are all vulnerable. MD5 is fully broken
      for collision resistance, and SHA1 has demonstrated practical collision attacks
      (SHAttered). Neither algorithm is safe for password hashing, digital signatures,
      certificate validation, or integrity verification in security contexts.
    language: csharp
    category: crypto
    severity: High
    confidence: 0.93
    cwe: CWE-328
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-hash
      - md5
      - sha1
      - password-hashing
      - collision-resistance
      - dotnet
      - csharp
      - HashAlgorithm
    detection_layer: 1
    attack_surface_type: "authentication"
    patterns:
      - type: regex
        pattern: 'MD5\.Create\s*\(\s*\)'
        description: "MD5.Create() factory method call"
      - type: regex
        pattern: 'SHA1\.Create\s*\(\s*\)'
        description: "SHA1.Create() factory method call"
      - type: regex
        pattern: 'new\s+MD5CryptoServiceProvider\s*\(\s*\)'
        description: "MD5CryptoServiceProvider instantiation"
      - type: regex
        pattern: 'new\s+SHA1(?:CryptoServiceProvider|Managed)\s*\(\s*\)'
        description: "SHA1CryptoServiceProvider or SHA1Managed instantiation"
      - type: regex
        pattern: 'HashAlgorithm\.Create\s*\(\s*"(?:MD5|SHA1)"\s*\)'
        description: "HashAlgorithm.Create with weak algorithm name"
      - type: regex
        pattern: 'new\s+HMACMD5\s*\('
        description: "HMAC with MD5 hash algorithm"
      - type: regex
        pattern: 'new\s+HMACSHA1\s*\('
        description: "HMAC with SHA1 hash algorithm"
      - type: regex
        pattern: 'FormsAuthentication\.HashPasswordForStoringInConfigFile\s*\([^,]+,\s*"(?:MD5|SHA1)"'
        description: "Legacy ASP.NET Forms Authentication with weak hash"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#pragma\s+warning\s+disable'
      - 'checksum'
      - 'etag'
      - 'cacheKey'
      - 'fingerprint.*dedup'
      - '\[Obsolete\]'
      - 'legacy'
      - 'mock'
      - 'fixture'
      - 'example'
    bypass_variants:
      - description: "Hash algorithm name from configuration string"
        pattern: 'HashAlgorithm\.Create\s*\(\s*(?:config|algorithmName|hashName)\s*\)'
      - description: "Algorithm selected via CryptoConfig"
        pattern: 'CryptoConfig\.CreateFromName\s*\(\s*"(?:MD5|SHA1)"'
      - description: "Hash algorithm stored in variable from appsettings"
        pattern: 'Configuration\[\s*"[^"]*[Hh]ash[^"]*"\s*\][\s\S]{0,100}(?:MD5|SHA1)'
    evasion_indicators:
      - "Hash algorithm loaded from configuration at runtime"
      - "Algorithm selected via CryptoConfig factory"
      - "Wrapper class hiding hash algorithm selection"
      - "Algorithm name from dependency injection container"
    encoding_variants:
      - type: "using_alias"
        pattern: 'using\s+\w+\s*=\s*System\.Security\.Cryptography\.(?:MD5|SHA1)'
      - type: "fully_qualified"
        pattern: 'System\.Security\.Cryptography\.MD5\.Create'
      - type: "generic_create"
        pattern: 'HashAlgorithm\.Create\s*\(\s*(?:algorithmName|hashType)\s*\)'
    multi_function_chain_patterns:
      - "MD5.Create() -> ComputeHash -> BitConverter.ToString for password storage"
      - "SHA1.Create() -> ComputeHash -> comparison for signature verification"
      - "HMACSHA1 -> ComputeHash -> token generation"
      - "FormsAuthentication.HashPasswordForStoringInConfigFile -> database storage"
    privilege_context_flags:
      requires_auth_context: true
      admin_only_risk: false
      escalation_vector: "MD5/SHA1 collisions enable signature forgery and password cracking via rainbow tables"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_password_input"
        sink: "MD5.Create().ComputeHash"
        through: "Encoding.UTF8.GetBytes conversion"
      - source: "authentication_token"
        sink: "SHA1.Create().ComputeHash"
        through: "string to byte array conversion"
      - source: "request_body"
        sink: "token_validation"
        through: "HMACSHA1.ComputeHash()"
    impact: |
      Using MD5/SHA1 in .NET applications creates severe vulnerabilities:
      - MD5 collisions generated in seconds on commodity hardware
      - SHA1 chosen-prefix collisions demonstrated (SHAttered, Shambles)
      - Password hashes crackable at billions of attempts per second via hashcat
      - ASP.NET Forms Authentication with MD5/SHA1 enables account takeover
      - Digital signatures and HMAC-based tokens become forgeable
      - Non-compliance with NIST SP 800-131A, PCI-DSS, FIPS 140-3
    remediation: |
      Replace with SHA-256+ or proper password hashing:

      ```csharp
      // VULNERABLE: MD5 for hashing
      using var md5 = MD5.Create();
      byte[] hash = md5.ComputeHash(Encoding.UTF8.GetBytes(data));

      // SECURE: SHA-256 for integrity
      using var sha256 = SHA256.Create();
      byte[] hash = sha256.ComputeHash(Encoding.UTF8.GetBytes(data));

      // SECURE: BCrypt for password hashing
      string hash = BCrypt.Net.BCrypt.HashPassword(password, workFactor: 12);
      bool valid = BCrypt.Net.BCrypt.Verify(password, hash);

      // SECURE: HMAC-SHA256
      using var hmac = new HMACSHA256(key);
      byte[] mac = hmac.ComputeHash(data);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/328.html"
      - "https://shattered.io/"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns:
        - 'HashAlgorithm'
        - 'ComputeHash'
        - 'password'
        - 'token'
        - 'signature'
        - 'verify'
        - 'HMAC'
      taint_source_indicators:
        - 'Request\.'
        - 'HttpContext'
        - 'Controller'
        - 'Console\.ReadLine'
        - 'IFormFile'
      taint_sink_indicators:
        - 'ComputeHash'
        - 'SqlCommand'
        - 'Response\.Cookies'
        - 'Session\['
        - 'SaveChanges'
      sanitization_patterns:
        - 'SHA256'
        - 'SHA384'
        - 'SHA512'
        - 'BCrypt'
        - 'PasswordHasher'
        - 'Rfc2898DeriveBytes'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + business_impact_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker cracks MD5 password hashes in an ASP.NET application:
        1. Attacker exploits SQL injection to extract user table with MD5 hashes
        2. Using hashcat in MD5 mode, attacker cracks hashes at 25 billion/sec
        3. 90% of passwords recovered within hours using wordlists and rules
        4. Attacker gains admin access via recovered administrator credentials
        5. From admin panel, attacker uploads a web shell for persistent access
      example_payload: "MD5.Create().ComputeHash(Encoding.UTF8.GetBytes(password))"
      attacker_objective: "Crack weak MD5/SHA1 password hashes for account takeover"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2026-02-28"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-CS-001"
        - "CRYPTO-CS-004"
        - "CRYPTO-CS-008"

  # --------------------------------------------------------------------------
  # CRYPTO-CS-003: ECB Mode Usage
  # --------------------------------------------------------------------------
  - rule_id: "CRYPTO-CS-003"
    title: "Use of ECB (Electronic Codebook) Block Cipher Mode"
    description: >
      Detects explicit use of ECB mode for block cipher operations in C# via
      CipherMode.ECB assignment or related patterns. ECB mode encrypts identical
      plaintext blocks to identical ciphertext blocks, leaking data patterns. This
      is famously demonstrated by the ECB Penguin problem where encrypted images
      retain visible structure. ECB also enables block-swapping attacks where an
      adversary can rearrange ciphertext blocks to manipulate decrypted output.
      ECB should never be used for encrypting data longer than a single block.
    language: csharp
    category: crypto
    severity: High
    confidence: 0.90
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - ecb-mode
      - block-cipher
      - pattern-leak
      - symmetric-encryption
      - cipher-mode
      - dotnet
      - csharp
    detection_layer: 2
    attack_surface_type: "data-at-rest"
    patterns:
      - type: regex
        pattern: '\.Mode\s*=\s*CipherMode\.ECB'
        description: "Cipher mode set to ECB"
      - type: regex
        pattern: '\.IV\s*=\s*new\s+byte\s*\[\s*(?:8|16)\s*\]'
        description: "IV set to zero-filled byte array (functionally ECB-like)"
      - type: regex
        pattern: '\.IV\s*=\s*new\s+byte\s*\[\s*\]\s*\{[^}]+\}'
        description: "IV set to hardcoded byte array literal"
      - type: regex
        pattern: '\.IV\s*=\s*Encoding\.(?:UTF8|ASCII|Unicode)\.GetBytes\s*\(\s*"[^"]{8,}"\s*\)'
        description: "IV set from hardcoded string"
      - type: regex
        pattern: 'CreateEncryptor\s*\(\s*\w+\s*,\s*new\s+byte\s*\[\s*(?:8|16)\s*\]\s*\)'
        description: "CreateEncryptor with zero IV byte array"
      - type: regex
        pattern: 'private\s+(?:static\s+)?(?:readonly\s+)?byte\s*\[\s*\]\s+\w*[iI][vV]\w*\s*='
        description: "Static or readonly IV field (IV reuse)"
      - type: regex
        pattern: 'aes\.IV\s*=\s*(?:key|aes\.Key)\b'
        description: "IV set equal to the key (catastrophic reuse)"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - 'GenerateIV'
      - 'RandomNumberGenerator'
      - 'RNGCryptoServiceProvider'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'key.*wrap'
      - 'single.*block'
    bypass_variants:
      - description: "IV derived deterministically from hash"
        pattern: '\.IV\s*=\s*(?:MD5|SHA\d+)\.Create\(\)\.ComputeHash'
      - description: "Static IV stored in configuration"
        pattern: '\.IV\s*=\s*Convert\.FromBase64String\s*\(\s*Configuration'
      - description: "IV reused from previous encryption"
        pattern: '(?:savedIV|storedIV|lastIV|previousIV)[\s\S]{0,100}\.IV\s*='
      - description: "Setting Mode property via reflection"
        pattern: 'SetValue\s*\([^)]*CipherMode'
    evasion_indicators:
      - "Cipher mode set from variable or config value"
      - "Enum cast from integer to CipherMode"
      - "IV derived from deterministic hash"
      - "IV loaded from static configuration"
      - "IV reused across encryption operations"
    encoding_variants:
      - type: "base64_iv"
        pattern: '\.IV\s*=\s*Convert\.FromBase64String\s*\(\s*"[^"]+"'
      - type: "hex_iv"
        pattern: '\.IV\s*=\s*Convert\.FromHexString\s*\(\s*"[^"]+"'
      - type: "constant_iv"
        pattern: 'const\s+string\s+\w*IV\w*\s*=\s*"[^"]{16,}"'
    multi_function_chain_patterns:
      - "aes.Mode = ECB -> CreateEncryptor -> CryptoStream"
      - "aes.IV = new byte[16] -> CreateEncryptor -> TransformFinalBlock"
      - "Static IV field -> multiple CreateEncryptor calls"
      - "RijndaelManaged -> Mode=ECB -> TransformFinalBlock"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "ECB leaks plaintext patterns; static IVs enable chosen-plaintext attacks; IV=Key catastrophically links parameters"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_data_or_file_content"
        sink: "SymmetricAlgorithm.CreateEncryptor with ECB"
        through: "byte array transformation"
      - source: "database_records"
        sink: "CryptoStream with ECB-mode encryptor"
        through: "serialization pipeline"
      - source: "zero_byte_array"
        sink: "IV_property"
        through: "new byte[16]"
    impact: |
      ECB mode and improper IVs break encryption security in .NET:
      - ECB mode produces identical ciphertext for identical plaintext blocks
      - Static/zero IVs enable chosen-plaintext attacks in CBC mode
      - IV = Key catastrophically ties confidentiality to a single secret
      - Pattern leakage enables content analysis without key recovery
      - Block swapping attacks can manipulate decrypted output
      - Non-compliance with NIST SP 800-38A, SP 800-38D
    remediation: |
      Use AesGcm or CBC with random IVs:

      ```csharp
      // VULNERABLE: ECB mode
      using var aes = Aes.Create();
      aes.Mode = CipherMode.ECB;

      // SECURE: AesGcm (authenticated encryption, .NET Core 3.0+)
      byte[] key = RandomNumberGenerator.GetBytes(32);
      byte[] nonce = RandomNumberGenerator.GetBytes(12);
      byte[] tag = new byte[16];
      byte[] ciphertext = new byte[plaintext.Length];
      using var aesGcm = new AesGcm(key, 16);
      aesGcm.Encrypt(nonce, plaintext, ciphertext, tag);

      // SECURE: CBC with random IV
      using var aes = Aes.Create();
      aes.KeySize = 256;
      aes.Mode = CipherMode.CBC;
      aes.GenerateIV(); // Random IV for each encryption
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://blog.filippo.io/the-ecb-penguin/"
      - "https://csrc.nist.gov/publications/detail/sp/800-38a/final"
      - "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.symmetricalgorithm.iv"
    context_awareness:
      surrounding_context_patterns:
        - 'CipherMode'
        - 'ECB'
        - 'IV'
        - 'CreateEncryptor'
        - 'Aes'
        - 'SymmetricAlgorithm'
      taint_source_indicators:
        - 'new\s+byte\[\]'
        - 'Encoding\.\w+\.GetBytes'
        - 'CipherMode\.ECB'
        - 'static.*IV'
      taint_sink_indicators:
        - 'CreateEncryptor'
        - 'TransformFinalBlock'
        - 'CryptoStream'
      sanitization_patterns:
        - 'GenerateIV'
        - 'RandomNumberGenerator\.GetBytes'
        - 'AesGcm'
        - 'RNGCryptoServiceProvider'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + cipher_mode_risk_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits ECB mode encryption in an ASP.NET Core application:
        1. Application encrypts user role claims with AES-ECB before storing in cookies
        2. Attacker observes that the "admin" role produces a specific ciphertext block
        3. Attacker replaces their role ciphertext block with the observed admin block
        4. Application decrypts the cookie and grants admin privileges
        5. Frequency analysis reveals user behavior patterns in encrypted logs
      example_payload: "aes.Mode = CipherMode.ECB; aes.CreateEncryptor()"
      attacker_objective: "Exploit ECB patterns or IV reuse to analyze, manipulate, or forge encrypted data"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
