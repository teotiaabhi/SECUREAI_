  - rule_id: "CRYPTO-JS-007"
    title: "Insecure TLS Configuration in Node.js"
    description: >
      Detects insecure TLS/SSL configurations in Node.js applications including disabled
      certificate verification, use of deprecated protocol versions (SSLv2, SSLv3, TLS 1.0,
      TLS 1.1), permissive cipher suites, and certificate pinning bypasses. These
      misconfigurations enable man-in-the-middle (MITM) attacks where an attacker can
      intercept, modify, or inject data into encrypted connections. Node.js defaults to
      secure TLS settings, but developers often weaken them during development and fail
      to restore them for production.
    language: javascript
    category: crypto
    severity: High
    confidence: 0.91
    cwe: CWE-295
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - tls
      - ssl
      - certificate-validation
      - mitm
      - transport-security
      - node-security
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'rejectUnauthorized\s*[=:]\s*false'
        description: "TLS certificate verification disabled"
      - type: regex
        pattern: "NODE_TLS_REJECT_UNAUTHORIZED\\s*[='\"]*\\s*['\"]?0['\"]?"
        description: "Global TLS rejection disabled via environment variable"
      - type: regex
        pattern: 'process\.env\.NODE_TLS_REJECT_UNAUTHORIZED\s*=\s*[''"]0[''"]'
        description: "Programmatic setting of NODE_TLS_REJECT_UNAUTHORIZED to 0"
      - type: regex
        pattern: 'secureProtocol\s*[=:]\s*[''"](?:SSLv2_method|SSLv3_method|TLSv1_method|SSLv23_method)[''"]'
        description: "Deprecated SSL/TLS protocol method specified"
      - type: regex
        pattern: 'minVersion\s*[=:]\s*[''"]TLSv1(?:\.1)?[''"]'
        description: "TLS minimum version set to deprecated TLS 1.0 or 1.1"
      - type: regex
        pattern: 'checkServerIdentity\s*[=:]\s*(?:\(\s*\)\s*=>|function\s*\([^)]*\)\s*\{)\s*(?:return\s*(?:true|undefined|void\s*0)|(?:\}|;))'
        description: "Server identity check callback returning truthy unconditionally"
      - type: regex
        pattern: 'agent\s*[=:]\s*new\s+https?\.Agent\s*\(\s*\{[^}]*rejectUnauthorized\s*:\s*false'
        description: "HTTPS agent created with certificate validation disabled"
      - type: regex
        pattern: 'strictSSL\s*[=:]\s*false'
        description: "strict SSL disabled in request library options"
    anti_patterns:
      - 'test\.(js|ts|jsx|tsx)$'
      - 'spec\.(js|ts|jsx|tsx)$'
      - '__tests__/'
      - '\/\/ nosec'
      - 'development.?only'
      - 'localhost'
      - 'self.?signed.?cert'
      - 'internal.?network'
      - 'mock'
      - 'fixture'
      - 'example'
      - '\/\/ TODO.*remove'
      - '\/\/ TEMPORARY'
      - 'debug.?mode'
      - 'if\s*\(\s*process\.env\.NODE_ENV\s*===\s*[''"]development[''"]'
    bypass_variants:
      - description: "Certificate check disabled via intermediary configuration object"
        pattern: 'options\s*\.\s*rejectUnauthorized\s*=\s*false'
      - description: "TLS verification disabled through spread operator from config"
        pattern: '\.\.\.(?:config|options|tlsOpts)[\s\S]{0,100}rejectUnauthorized'
      - description: "Custom agent factory hiding insecure settings"
        pattern: 'create(?:Agent|Https?Client)\s*\([^)]*\)[\s\S]{0,200}rejectUnauthorized\s*:\s*false'
    evasion_indicators:
      - "TLS settings loaded from external configuration"
      - "rejectUnauthorized set conditionally based on environment"
      - "Certificate bypass configured through middleware"
      - "Global agent overridden in initialization code"
    encoding_variants:
      - type: "env_var_override"
        pattern: 'process\.env\[\s*[''"]NODE_TLS_REJECT_UNAUTHORIZED[''"]'
      - type: "dynamic_property"
        pattern: 'options\[\s*[''"]rejectUnauthorized[''"]'
      - type: "config_file_reference"
        pattern: 'require\s*\(\s*[''"].*config[''"].*\)[\s\S]{0,100}(?:tls|ssl|reject)'
    multi_function_chain_patterns:
      - "https.Agent with rejectUnauthorized:false -> axios/request defaults"
      - "tls.connect with disabled checks -> database connection"
      - "process.env override -> global https agent -> all outbound requests"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Disabled TLS verification allows MITM attackers to intercept authentication credentials, API keys, and sensitive data in transit"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "config_setting"
        sink: "https_request"
        through: "agent_options"
      - source: "environment_variable"
        sink: "global_tls_context"
        through: "process.env"
      - source: "tls_connect_options"
        sink: "database_connection"
        through: "rejectUnauthorized_false"
    impact: |
      Insecure TLS/SSL configurations expose applications to critical attacks:
      - Man-in-the-middle attackers can intercept and modify all encrypted traffic
      - Authentication credentials, API keys, and tokens can be captured in transit
      - Deprecated protocols (SSLv3, TLS 1.0/1.1) are vulnerable to POODLE, BEAST, and CRIME
      - Disabled certificate verification allows attackers to present fraudulent certificates
      - PCI-DSS explicitly prohibits SSL and early TLS; HIPAA requires strong encryption in transit
      - Supply chain attacks via DNS hijacking become trivial without cert verification
    remediation: |
      Enforce secure TLS configuration across the application:

      ```javascript
      // VULNERABLE: Disabled certificate verification
      process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';

      // SECURE: Always verify certificates (this is the default)
      const https = require('https');
      const agent = new https.Agent({
        rejectUnauthorized: true,  // default, but be explicit
        minVersion: 'TLSv1.3',    // require TLS 1.3 where possible
        // Or minimum TLS 1.2
        // minVersion: 'TLSv1.2',
      });

      // SECURE: Use certificate pinning for critical connections
      const tls = require('tls');
      const options = {
        host: 'api.example.com',
        port: 443,
        checkServerIdentity: (host, cert) => {
          const err = tls.checkServerIdentity(host, cert);
          if (err) return err;
          // Pin the certificate fingerprint
          const expectedFingerprint = 'AB:CD:EF:...';
          if (cert.fingerprint256 !== expectedFingerprint) {
            return new Error('Certificate fingerprint mismatch');
          }
        },
      };

      // SECURE: Configure axios with proper TLS settings
      const axios = require('axios');
      const instance = axios.create({
        httpsAgent: new https.Agent({
          rejectUnauthorized: true,
          minVersion: 'TLSv1.2',
          ca: fs.readFileSync('/path/to/ca-bundle.crt'),
        }),
      });
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://nodejs.org/api/tls.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
      - "https://wiki.mozilla.org/Security/Server_Side_TLS"
    context_awareness:
      surrounding_context_patterns:
        - 'https'
        - 'tls'
        - 'ssl'
        - 'certificate'
        - 'request'
        - 'axios'
        - 'fetch'
        - 'connect'
      taint_source_indicators:
        - 'config\.'
        - 'process\.env'
        - 'options\.'
        - 'settings\.'
      taint_sink_indicators:
        - 'https\.request'
        - 'tls\.connect'
        - 'axios\.'
        - 'fetch\('
        - 'require\([''"]request[''"]'
      sanitization_patterns:
        - 'rejectUnauthorized\s*:\s*true'
        - 'minVersion\s*:\s*[''"]TLSv1\.[23][''"]'
        - 'ca\s*:'
        - 'cert\s*:'
        - 'checkServerIdentity'
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + network_exposure_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker performs MITM on a Node.js microservice with disabled TLS verification:
        1. Attacker positions themselves on the network (e.g., compromised router, ARP spoofing)
        2. Attacker intercepts outbound HTTPS requests from the Node.js application
        3. Because rejectUnauthorized is false, the app accepts the attacker's fraudulent certificate
        4. Attacker decrypts, reads, and modifies API calls between microservices
        5. Attacker captures OAuth tokens, database credentials, and user data in transit
        6. Attacker injects malicious responses to trigger further exploitation (RCE, SQLi)
      example_payload: "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';"
      attacker_objective: "Intercept encrypted communications by exploiting disabled certificate verification to perform man-in-the-middle attacks"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JS-002"
        - "CRYPTO-JS-003"

  - rule_id: "CRYPTO-JS-008"
    title: "WebCrypto API Misuse"
    description: >
      Detects insecure usage patterns of the Web Cryptography API (SubtleCrypto) in browser
      and server-side JavaScript. Common misuses include using non-extractable key flags
      improperly, selecting weak algorithms, performing encryption without authentication
      (AES-CBC instead of AES-GCM), improper key derivation parameters, and exporting keys
      in insecure formats. The WebCrypto API is designed to be secure by default, but
      incorrect parameter choices can undermine its security guarantees.
    language: javascript
    category: crypto
    severity: High
    confidence: 0.85
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - webcrypto
      - subtle-crypto
      - browser-crypto
      - aes-cbc
      - key-derivation
      - key-export
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'crypto\.subtle\.encrypt\s*\(\s*\{[^}]*name\s*:\s*[''"]AES-CBC[''"]'
        description: "WebCrypto AES-CBC encryption (unauthenticated)"
      - type: regex
        pattern: 'crypto\.subtle\.generateKey\s*\(\s*\{[^}]*name\s*:\s*[''"]AES-CBC[''"]'
        description: "WebCrypto generating AES-CBC key instead of AES-GCM"
      - type: regex
        pattern: 'crypto\.subtle\.importKey\s*\(\s*[''"]raw[''"]'
        description: "WebCrypto raw key import (may indicate hardcoded key material)"
      - type: regex
        pattern: 'crypto\.subtle\.exportKey\s*\(\s*[''"](?:raw|pkcs8|spki)[''"][\s\S]{0,100}(?:localStorage|sessionStorage|document\.cookie|postMessage)'
        description: "WebCrypto key exported and stored insecurely"
      - type: regex
        pattern: 'crypto\.subtle\.deriveKey\s*\(\s*\{[^}]*name\s*:\s*[''"]PBKDF2[''"][\s\S]{0,200}iterations\s*:\s*(?:[1-9]\d{0,3}|[1-9]\d{4})\b'
        description: "PBKDF2 with insufficient iterations (less than 100,000)"
      - type: regex
        pattern: 'crypto\.subtle\.(?:encrypt|decrypt|sign|verify)\s*\(\s*[''"]'
        description: "Algorithm passed as string instead of AlgorithmIdentifier object"
      - type: regex
        pattern: 'extractable\s*:\s*true[\s\S]{0,200}(?:sign|decrypt|unwrapKey)'
        description: "Signing or decryption key marked as extractable"
      - type: regex
        pattern: 'crypto\.subtle\.encrypt\s*\(\s*\{[^}]*name\s*:\s*[''"]RSA-OAEP[''"][\s\S]{0,100}hash\s*:\s*[''"]SHA-1[''"]'
        description: "RSA-OAEP with SHA-1 hash (weak)"
    anti_patterns:
      - 'test\.(js|ts|jsx|tsx)$'
      - 'spec\.(js|ts|jsx|tsx)$'
      - '__tests__/'
      - '\/\/ nosec'
      - 'polyfill'
      - 'shim'
      - 'fallback'
      - 'AES-GCM'
      - 'iterations\s*:\s*(?:[1-9]\d{5,})'
      - 'extractable\s*:\s*false'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'demo'
      - 'documentation'
    bypass_variants:
      - description: "Algorithm parameters constructed dynamically to evade detection"
        pattern: 'crypto\.subtle\.encrypt\s*\(\s*(?:algo|params|config)\s*[,)]'
      - description: "WebCrypto accessed through aliased variable"
        pattern: '(?:const|let|var)\s+\w+\s*=\s*(?:window\.)?crypto\.subtle[\s\S]{0,100}\w+\.encrypt'
      - description: "Algorithm object built from merged config objects"
        pattern: 'Object\.assign\s*\(\s*\{\s*\}\s*,[\s\S]{0,100}(?:AES|RSA|HMAC)'
    evasion_indicators:
      - "Algorithm parameters stored in separate configuration object"
      - "WebCrypto API accessed through wrapper library"
      - "Key usage flags computed dynamically"
      - "Algorithm selection based on feature detection"
    encoding_variants:
      - type: "bracket_notation_access"
        pattern: 'crypto\s*\[\s*[''"]subtle[''"]'
      - type: "polyfill_access"
        pattern: '(?:msrCrypto|polycrypt|webcrypto)\.subtle'
      - type: "destructured_import"
        pattern: 'const\s*\{\s*subtle\s*\}\s*=\s*(?:globalThis|window|self)\.crypto'
    multi_function_chain_patterns:
      - "deriveKey with low PBKDF2 iterations -> encrypt with derived key"
      - "importKey('raw', hardcoded) -> encrypt -> exportKey"
      - "generateKey(extractable:true) -> exportKey('raw') -> localStorage.setItem"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "WebCrypto misuse can expose encryption keys via extractable flag, allow ciphertext manipulation via unauthenticated encryption, or enable brute-force via low PBKDF2 iterations"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_password"
        sink: "deriveKey_with_low_iterations"
        through: "PBKDF2_import"
      - source: "raw_key_material"
        sink: "localStorage_or_cookie"
        through: "exportKey('raw')"
      - source: "plaintext_data"
        sink: "aes_cbc_encryption"
        through: "subtle.encrypt('AES-CBC')"
    impact: |
      WebCrypto API misuse creates subtle but severe security vulnerabilities:
      - AES-CBC without authentication allows ciphertext manipulation (padding oracle attacks)
      - Low PBKDF2 iteration counts enable password brute-forcing
      - Extractable keys can be stolen by XSS attacks
      - Raw key export to insecure storage (localStorage) exposes keys to any script on the page
      - RSA-OAEP with SHA-1 weakens the encryption scheme
      - Incorrect key usage flags may allow keys to be used for unintended operations
    remediation: |
      Follow WebCrypto API best practices:

      ```javascript
      // VULNERABLE: AES-CBC without authentication
      const encrypted = await crypto.subtle.encrypt(
        { name: 'AES-CBC', iv },
        key,
        data
      );

      // SECURE: Use AES-GCM for authenticated encryption
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv, tagLength: 128 },
        key,
        data
      );

      // SECURE: PBKDF2 with sufficient iterations
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(password),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: crypto.getRandomValues(new Uint8Array(16)),
          iterations: 600000,  // OWASP recommended minimum
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,         // non-extractable
        ['encrypt', 'decrypt']
      );

      // SECURE: Non-extractable keys for signing
      const keyPair = await crypto.subtle.generateKey(
        { name: 'ECDSA', namedCurve: 'P-384' },
        false,         // non-extractable
        ['sign', 'verify']
      );
      ```
    references:
      - "https://developer.mozilla.org/en-US/docs/Web/API/Web_Crypto_API"
      - "https://www.w3.org/TR/WebCryptoAPI/"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
      - "https://soatok.blog/2022/12/29/what-we-do-in-the-shadows-of-webcrypto/"
    context_awareness:
      surrounding_context_patterns:
        - 'crypto\.subtle'
        - 'SubtleCrypto'
        - 'encrypt'
        - 'decrypt'
        - 'deriveKey'
        - 'importKey'
        - 'generateKey'
      taint_source_indicators:
        - 'password'
        - 'user_input'
        - 'TextEncoder'
        - 'Uint8Array'
      taint_sink_indicators:
        - 'localStorage'
        - 'sessionStorage'
        - 'document\.cookie'
        - 'postMessage'
        - 'indexedDB'
      sanitization_patterns:
        - 'AES-GCM'
        - 'iterations\s*:\s*[1-9]\d{5,}'
        - 'extractable\s*:\s*false'
        - 'SHA-256'
        - 'SHA-384'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + browser_exposure_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits WebCrypto misuse in a browser-based password manager:
        1. Application uses AES-CBC to encrypt stored passwords with a key derived via PBKDF2
        2. PBKDF2 iteration count is only 1000, and the key is marked as extractable
        3. Attacker injects XSS payload via stored cross-site scripting vulnerability
        4. XSS script calls crypto.subtle.exportKey('raw', key) to extract the encryption key
        5. Attacker decrypts all stored passwords using the extracted key
        6. Alternatively, attacker exploits AES-CBC padding oracle to decrypt without the key
      example_payload: "crypto.subtle.deriveKey({name:'PBKDF2',iterations:1000,hash:'SHA-1'},keyMat,{name:'AES-CBC',length:128},true,['encrypt','decrypt'])"
      attacker_objective: "Extract encryption keys or exploit unauthenticated encryption to access protected data in browser-based applications"
    confidence_factors:
      pattern_strength: "medium"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JS-002"
        - "CRYPTO-JS-005"
        - "CRYPTO-JS-006"
