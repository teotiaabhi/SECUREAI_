rules:
  - rule_id: "CRYPTO-JS-001"
    title: "Weak Hash Algorithm Usage (MD5/SHA1)"
    description: >
      Detects usage of cryptographically broken hash algorithms MD5 and SHA1 in JavaScript
      applications. MD5 is vulnerable to collision attacks (demonstrated by Wang et al. in 2004)
      and SHA1 was practically broken by the SHAttered attack in 2017. These algorithms must not
      be used for digital signatures, certificate validation, password hashing, or integrity
      verification of security-sensitive data. NIST deprecated SHA1 for digital signatures in
      2011 and MD5 should never be used in any security context.
    language: javascript
    category: crypto
    severity: High
    confidence: 0.92
    cwe: CWE-328
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-hash
      - md5
      - sha1
      - integrity
      - deprecated-algorithm
      - collision-attack
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'crypto\.createHash\s*\(\s*[''"]md5[''"]'
        description: "Node.js crypto module creating MD5 hash"
      - type: regex
        pattern: 'crypto\.createHash\s*\(\s*[''"]sha1?[''"]'
        description: "Node.js crypto module creating SHA1 hash"
      - type: regex
        pattern: 'CryptoJS\.MD5\s*\('
        description: "CryptoJS library MD5 hash function call"
      - type: regex
        pattern: 'CryptoJS\.SHA1\s*\('
        description: "CryptoJS library SHA1 hash function call"
      - type: regex
        pattern: 'md5\s*\(\s*[^)]+\)'
        description: "Direct md5 function call from md5 npm package"
      - type: regex
        pattern: 'require\s*\(\s*[''"]md5[''"]'
        description: "Import of md5 npm package"
      - type: regex
        pattern: 'import\s+.*\bmd5\b.*\s+from\s+[''"]md5[''"]'
        description: "ES module import of md5 package"
      - type: regex
        pattern: 'createHmac\s*\(\s*[''"](?:md5|sha1)[''"]'
        description: "HMAC creation with weak underlying hash algorithm"
    anti_patterns:
      - 'test\.(js|ts|jsx|tsx)$'
      - 'spec\.(js|ts|jsx|tsx)$'
      - '__tests__/'
      - '\.test\.'
      - '\/\/ nosec'
      - '\/\/ crypto-ignore'
      - 'checksum comparison for non-security'
      - 'etag generation'
      - 'cache[_-]?key'
      - 'fingerprint for deduplication'
      - '\/\/ legacy compatibility'
      - '\.mock\.'
      - 'fixture'
      - 'example'
      - 'documentation'
    bypass_variants:
      - description: "Dynamic algorithm selection to evade static detection"
        pattern: 'crypto\.createHash\s*\(\s*(?:algo|hashType|method|hashAlg)\s*\)'
      - description: "String concatenation to build algorithm name"
        pattern: 'crypto\.createHash\s*\(\s*[''"]m[''"\s]*\+\s*[''"]d5[''"]'
      - description: "Variable indirection for hash algorithm"
        pattern: 'const\s+\w+\s*=\s*[''"]md5[''"][\s\S]{0,100}createHash\s*\(\s*\w+\s*\)'
    evasion_indicators:
      - "Algorithm name stored in variable or config"
      - "Hash algorithm selected at runtime from user input"
      - "Wrapper function obscuring direct crypto API call"
      - "Third-party library wrapping native crypto"
    encoding_variants:
      - type: "hex_encoded"
        pattern: '\\x6d\\x64\\x35'
      - type: "unicode_escaped"
        pattern: '\\u006d\\u0064\\u0035'
      - type: "base64_obfuscated"
        pattern: 'Buffer\.from\s*\(\s*[''"]bWQ1[''"]'
    multi_function_chain_patterns:
      - "createHash -> update -> digest chain with weak algorithm"
      - "pbkdf2 with md5 as underlying hash"
      - "HMAC with sha1 feeding into token generation"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Collision attacks on MD5/SHA1 can lead to signature forgery, allowing attackers to impersonate trusted entities or tamper with integrity-protected data"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_input"
        sink: "hash_digest_comparison"
        through: "createHash().update().digest()"
      - source: "password_field"
        sink: "database_storage"
        through: "md5(password)"
      - source: "file_content"
        sink: "integrity_verification"
        through: "createHash('sha1').update(data)"
    impact: |
      MD5 and SHA1 are cryptographically broken hash algorithms. MD5 collisions can be
      generated in seconds on consumer hardware. SHA1 collisions have been demonstrated
      (SHAttered attack). Using these algorithms for security purposes such as password
      hashing, digital signatures, certificate validation, or data integrity verification
      can lead to:
      - Forgery of digitally signed documents or tokens
      - Password cracking via rainbow tables or brute force
      - Bypass of integrity checks through crafted collisions
      - Non-compliance with PCI-DSS, HIPAA, FIPS 140-2, and SOC2 standards
    remediation: |
      Replace weak hash algorithms with cryptographically strong alternatives:

      ```javascript
      // VULNERABLE: Using MD5
      const hash = crypto.createHash('md5').update(data).digest('hex');

      // SECURE: Use SHA-256 or SHA-3 for integrity checks
      const hash = crypto.createHash('sha256').update(data).digest('hex');

      // SECURE: Use bcrypt/scrypt/argon2 for password hashing
      const bcrypt = require('bcrypt');
      const saltRounds = 12;
      const hashedPassword = await bcrypt.hash(password, saltRounds);

      // SECURE: Use SHA-512 for HMAC operations
      const hmac = crypto.createHmac('sha512', secret).update(data).digest('hex');
      ```
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2004-2761"
      - "https://shattered.io/"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns:
        - 'password'
        - 'token'
        - 'signature'
        - 'certificate'
        - 'authentication'
        - 'session'
        - 'verify'
      taint_source_indicators:
        - 'req\.body'
        - 'req\.params'
        - 'req\.query'
        - 'process\.env'
        - 'fs\.readFile'
      taint_sink_indicators:
        - '\.digest\('
        - '\.compare\('
        - '\.equals\('
        - 'database\.save'
        - 'db\.insert'
      sanitization_patterns:
        - 'bcrypt\.hash'
        - 'scrypt'
        - 'argon2\.hash'
        - 'crypto\.createHash\s*\(\s*[''"]sha256[''"]'
        - 'crypto\.createHash\s*\(\s*[''"]sha512[''"]'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + business_impact_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker targeting a Node.js application that uses MD5 to hash API tokens:
        1. Attacker captures a valid API token hash from a leaked database
        2. Using hashcat with MD5 mode, the attacker brute-forces the token in minutes
        3. With the recovered token, attacker authenticates as the victim user
        4. For SHA1-signed JWTs, attacker generates a collision to forge a valid signature
           with elevated privileges in the claims payload
      example_payload: "crypto.createHash('md5').update('admin_token_value').digest('hex')"
      attacker_objective: "Forge authentication tokens or bypass integrity checks by exploiting weak hash collisions"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JS-002"
        - "CRYPTO-JS-003"
        - "CRYPTO-JS-005"

  - rule_id: "CRYPTO-JS-002"
    title: "Weak Cipher Algorithm Usage (DES/RC4)"
    description: >
      Detects usage of weak or broken symmetric cipher algorithms including DES, 3DES (Triple DES),
      RC4 (ARC4/ARCFOUR), and Blowfish in JavaScript applications. DES uses a 56-bit key that can be
      brute-forced in hours. RC4 has well-documented biases in its keystream (Royal Holloway attack,
      Bar-mitzvah attack). NIST formally withdrew DES in 2005 and deprecated 3DES in 2018 with a
      sunset date of 2023.
    language: javascript
    category: crypto
    severity: High
    confidence: 0.93
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-cipher
      - des
      - rc4
      - symmetric-encryption
      - deprecated-algorithm
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'crypto\.createCipher(?:iv)?\s*\(\s*[''"](?:des|des-ede|des-ede3|des3|rc4|arcfour|arc4)[''"]'
        description: "Node.js crypto createCipher with weak algorithm"
      - type: regex
        pattern: 'crypto\.createDecipher(?:iv)?\s*\(\s*[''"](?:des|des-ede|des-ede3|des3|rc4|arcfour|arc4)[''"]'
        description: "Node.js crypto createDecipher with weak algorithm"
      - type: regex
        pattern: 'CryptoJS\.DES\.encrypt\s*\('
        description: "CryptoJS DES encryption"
      - type: regex
        pattern: 'CryptoJS\.TripleDES\.encrypt\s*\('
        description: "CryptoJS Triple DES encryption"
      - type: regex
        pattern: 'CryptoJS\.RC4\.encrypt\s*\('
        description: "CryptoJS RC4 encryption"
      - type: regex
        pattern: 'CryptoJS\.Rabbit\.encrypt\s*\('
        description: "CryptoJS Rabbit stream cipher (non-standard)"
      - type: regex
        pattern: 'createCipher\s*\(\s*[''"](?:bf|blowfish|cast)[''"]'
        description: "Blowfish or CAST cipher usage via Node.js crypto"
      - type: regex
        pattern: 'algorithm\s*[=:]\s*[''"](?:des|rc4|3des|tripledes)[''"]'
        description: "Weak algorithm specified in configuration object"
    anti_patterns:
      - 'test\.(js|ts|jsx|tsx)$'
      - 'spec\.(js|ts|jsx|tsx)$'
      - '__tests__/'
      - '\/\/ nosec'
      - '\/\/ crypto-ignore'
      - '\/\/ legacy-required'
      - 'migration\s+script'
      - 'backward.?compat'
      - 'decrypt.?only'
      - 'read.?only.?legacy'
      - '\.mock\.'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'deprecated.?wrapper'
    bypass_variants:
      - description: "Algorithm name built via string template literal"
        pattern: 'createCipher(?:iv)?\s*\(\s*`(?:des|rc4)[^`]*`'
      - description: "Algorithm stored in external config or environment variable"
        pattern: 'createCipher(?:iv)?\s*\(\s*(?:config|process\.env)\.'
      - description: "Algorithm name mapped through lookup object"
        pattern: 'algorithms?\s*\[\s*[''"](?:legacy|default|fast)[''"]'
    evasion_indicators:
      - "Cipher algorithm selected from configuration file"
      - "Algorithm name passed as function parameter"
      - "Dynamic import of cipher module based on runtime conditions"
      - "Wrapper class abstracting cipher selection"
    encoding_variants:
      - type: "hex_encoded_des"
        pattern: '\\x64\\x65\\x73'
      - type: "unicode_escaped"
        pattern: '\\u0064\\u0065\\u0073'
      - type: "base64_obfuscated"
        pattern: 'Buffer\.from\s*\(\s*[''"]ZGVz[''"]'
    multi_function_chain_patterns:
      - "createCipher -> update -> final pipeline with DES"
      - "CryptoJS.DES.encrypt chained with key derivation"
      - "Config reads algorithm then passes to cipher factory"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Weak ciphers can be broken to decrypt sensitive data including credentials, session tokens, and PII, enabling account takeover or data theft"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_data"
        sink: "encrypted_storage"
        through: "createCipher('des').update(data)"
      - source: "api_payload"
        sink: "encrypted_transmission"
        through: "CryptoJS.RC4.encrypt(data, key)"
      - source: "sensitive_config"
        sink: "encrypted_file"
        through: "createCipheriv('des-ede3', key, iv)"
    impact: |
      Using weak cipher algorithms exposes encrypted data to practical attacks:
      - DES 56-bit keys can be brute-forced in under 24 hours using FPGA clusters
      - 3DES is vulnerable to Sweet32 birthday attacks on 64-bit block ciphers
      - RC4 keystream biases enable plaintext recovery (demonstrated in TLS attacks)
      - All major compliance frameworks (PCI-DSS, HIPAA, NIST) prohibit these algorithms
      - Data encrypted with these ciphers should be considered potentially compromised
    remediation: |
      Replace weak ciphers with AES-256-GCM (authenticated encryption):

      ```javascript
      // VULNERABLE: Using DES
      const cipher = crypto.createCipher('des', password);

      // SECURE: Use AES-256-GCM with proper IV
      const key = crypto.scryptSync(password, salt, 32);
      const iv = crypto.randomBytes(16);
      const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);

      let encrypted = cipher.update(plaintext, 'utf8', 'hex');
      encrypted += cipher.final('hex');
      const authTag = cipher.getAuthTag();

      // Store iv + authTag + encrypted together
      ```
    references:
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
      - "https://sweet32.info/"
      - "https://www.rc4nomore.com/"
      - "https://nvd.nist.gov/vuln/detail/CVE-2016-2183"
    context_awareness:
      surrounding_context_patterns:
        - 'encrypt'
        - 'decrypt'
        - 'cipher'
        - 'secret'
        - 'password'
        - 'sensitive'
        - 'private'
      taint_source_indicators:
        - 'req\.body'
        - 'user\.data'
        - 'database\.query'
        - 'fs\.readFile'
      taint_sink_indicators:
        - '\.update\('
        - '\.final\('
        - 'res\.send'
        - 'db\.save'
        - 'socket\.write'
      sanitization_patterns:
        - 'aes-256-gcm'
        - 'aes-256-cbc'
        - 'chacha20-poly1305'
        - 'createCipheriv'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + data_sensitivity_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker intercepts encrypted API traffic using DES encryption:
        1. Attacker captures encrypted payloads from network traffic
        2. Using a DES brute-force tool (e.g., des-crack), attacker exhausts the 56-bit keyspace
        3. Attacker recovers plaintext containing user credentials and API keys
        4. For RC4-encrypted sessions, attacker uses statistical biases to recover session cookies
        5. Attacker replays recovered credentials to gain unauthorized access
      example_payload: "crypto.createCipher('des', 'weak-password').update(sensitiveData)"
      attacker_objective: "Decrypt sensitive data by brute-forcing weak cipher keys or exploiting known cryptographic weaknesses"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JS-001"
        - "CRYPTO-JS-003"
        - "CRYPTO-JS-005"
        - "CRYPTO-JS-006"

  - rule_id: "CRYPTO-JS-003"
    title: "Hardcoded Encryption Key"
    description: >
      Detects hardcoded cryptographic keys, passwords, and secrets embedded directly in JavaScript
      source code. Hardcoded keys are extractable through static analysis, source code leaks,
      decompilation, or version control history. This is a critical vulnerability because key
      rotation becomes impossible without code changes, and the same key is shared across all
      deployments. OWASP classifies hardcoded credentials as a Top 10 risk.
    language: javascript
    category: crypto
    severity: Critical
    confidence: 0.88
    cwe: CWE-798
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - hardcoded-key
      - secret-management
      - credential-exposure
      - key-management
    detection_layer: 2
    attack_surface_type: "internal"
    patterns:
      - type: regex
        pattern: '(?:encryption[_-]?key|secret[_-]?key|crypto[_-]?key|aes[_-]?key)\s*[=:]\s*[''"][A-Za-z0-9+/=]{16,}[''"]'
        description: "Named encryption key variable with hardcoded string value"
      - type: regex
        pattern: 'createCipheriv\s*\(\s*[^,]+,\s*[''"][A-Fa-f0-9]{32,}[''"]'
        description: "Hardcoded hex key passed directly to createCipheriv"
      - type: regex
        pattern: 'createCipheriv\s*\(\s*[^,]+,\s*Buffer\.from\s*\(\s*[''"][^''"]{16,}[''"]'
        description: "Hardcoded key wrapped in Buffer.from for createCipheriv"
      - type: regex
        pattern: 'new\s+(?:Uint8Array|Buffer)\s*\(\s*\[\s*(?:0x[0-9a-fA-F]{1,2}\s*,\s*){7,}'
        description: "Key as hardcoded byte array"
      - type: regex
        pattern: 'CryptoJS\.enc\.(?:Hex|Utf8|Base64)\.parse\s*\(\s*[''"][^''"]{16,}[''"]'
        description: "CryptoJS key parsing from hardcoded string"
      - type: regex
        pattern: 'SecretKeySpec\s*\(\s*[''"][^''"]{8,}[''"]'
        description: "Hardcoded key in SecretKeySpec-like construction"
      - type: regex
        pattern: '(?:ENCRYPTION|CIPHER|AES|CRYPTO)[_-]?(?:KEY|SECRET|PASSWORD)\s*=\s*[''"][^''"]{8,}[''"]'
        description: "Constant with crypto-related name assigned string literal"
      - type: regex
        pattern: '\.(?:encrypt|decrypt)\s*\(\s*[^,]+,\s*[''"][A-Za-z0-9+/=]{8,}[''"]'
        description: "Hardcoded key passed as second argument to encrypt/decrypt"
    anti_patterns:
      - 'test\.(js|ts|jsx|tsx)$'
      - 'spec\.(js|ts|jsx|tsx)$'
      - '__tests__/'
      - '\.env\.example'
      - '\.env\.template'
      - 'process\.env\.'
      - 'vault\.get'
      - 'keyVault'
      - 'aws-sdk.*KMS'
      - 'secretsManager'
      - '\/\/ nosec'
      - 'placeholder'
      - 'CHANGEME'
      - 'TODO.*replace'
      - 'example\.?key'
    bypass_variants:
      - description: "Key split across multiple string concatenations"
        pattern: '(?:key|secret)\s*=\s*[''"][^''"]+[''"][\s]*\+[\s]*[''"][^''"]+[''"]'
      - description: "Key built using String.fromCharCode to avoid literal detection"
        pattern: 'String\.fromCharCode\s*\(\s*(?:\d+\s*,\s*){7,}'
      - description: "Key encoded as base64 and decoded at runtime"
        pattern: '(?:atob|Buffer\.from)\s*\(\s*[''"][A-Za-z0-9+/=]{16,}[''"]'
    evasion_indicators:
      - "Key value split across multiple variables or files"
      - "Key assembled at runtime from multiple sources"
      - "Key stored in obfuscated form and decoded before use"
      - "Key embedded in binary data or resource files"
    encoding_variants:
      - type: "base64_encoded_key"
        pattern: 'atob\s*\(\s*[''"][A-Za-z0-9+/=]{20,}[''"]'
      - type: "hex_encoded_key"
        pattern: '(?:key|secret)\s*=\s*[''"][0-9a-fA-F]{32,}[''"]'
      - type: "unicode_escape_key"
        pattern: '(?:key|secret)\s*=\s*[''"](?:\\u[0-9a-fA-F]{4}){8,}[''"]'
    multi_function_chain_patterns:
      - "Hardcoded key -> Buffer.from -> createCipheriv"
      - "Constant key definition -> HMAC generation -> token signing"
      - "Hardcoded passphrase -> scrypt/pbkdf2 -> cipher key derivation"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Hardcoded keys extracted from source code or compiled artifacts grant attackers the ability to decrypt all data encrypted with that key across all environments"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "hardcoded_string_literal"
        sink: "createCipheriv_key_parameter"
        through: "variable_assignment"
      - source: "constant_definition"
        sink: "HMAC_secret"
        through: "module_export"
      - source: "config_object_literal"
        sink: "jwt_sign_secret"
        through: "options_object"
    impact: |
      Hardcoded encryption keys create catastrophic security vulnerabilities:
      - Keys are exposed to anyone with source code access (developers, contractors, attackers)
      - Keys persist in version control history even after removal
      - Key rotation requires code changes and redeployment across all environments
      - A single key compromise decrypts all data encrypted since key creation
      - Violates PCI-DSS Requirement 3.5, NIST SP 800-57, and SOC2 CC6.1
      - Extracted keys enable silent decryption of all historical encrypted data
    remediation: |
      Use a secrets management system and environment-based key injection:

      ```javascript
      // VULNERABLE: Hardcoded key
      const key = 'my-secret-encryption-key-12345';
      const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);

      // SECURE: Load key from environment variable
      const key = Buffer.from(process.env.ENCRYPTION_KEY, 'hex');
      if (!key || key.length !== 32) throw new Error('Invalid encryption key');
      const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);

      // SECURE: Use AWS KMS or similar key management service
      const { KMSClient, DecryptCommand } = require('@aws-sdk/client-kms');
      const kms = new KMSClient({ region: 'us-east-1' });
      const decrypted = await kms.send(new DecryptCommand({
        CiphertextBlob: encryptedKey
      }));
      const key = decrypted.Plaintext;

      // SECURE: Use HashiCorp Vault
      const vault = require('node-vault')({ endpoint: process.env.VAULT_ADDR });
      const { data } = await vault.read('secret/data/encryption');
      const key = Buffer.from(data.data.key, 'hex');
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final"
    context_awareness:
      surrounding_context_patterns:
        - 'encrypt'
        - 'decrypt'
        - 'cipher'
        - 'createCipher'
        - 'createHmac'
        - 'sign'
        - 'jwt'
      taint_source_indicators:
        - 'const\s+.*key'
        - 'let\s+.*secret'
        - 'var\s+.*password'
        - 'module\.exports'
      taint_sink_indicators:
        - 'createCipheriv'
        - 'createDecipheriv'
        - 'createHmac'
        - 'jwt\.sign'
        - 'pbkdf2'
      sanitization_patterns:
        - 'process\.env'
        - 'vault\.read'
        - 'kms\.decrypt'
        - 'secretsManager\.getSecretValue'
        - 'keyVault\.getSecret'
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + exposure_surface_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker discovers hardcoded encryption keys in a Node.js REST API:
        1. Attacker gains read access to source code via exposed .git directory or GitHub repo leak
        2. Attacker searches for crypto-related variable names and finds AES key in config.js
        3. Attacker uses the extracted key to decrypt sensitive database fields
        4. Attacker decrypts PII, financial data, and API credentials stored in the database
        5. Using decrypted API keys, attacker pivots to internal microservices
      example_payload: "const ENCRYPTION_KEY = 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6';"
      attacker_objective: "Extract hardcoded encryption keys to decrypt all protected data and gain access to downstream systems"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
