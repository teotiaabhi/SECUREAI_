  - rule_id: "CRYPTO-JS-004"
    title: "Math.random() Used for Security-Sensitive Operations"
    description: >
      Detects usage of Math.random() for generating security-sensitive values such as tokens,
      passwords, session identifiers, nonces, or cryptographic keys. Math.random() is a
      pseudorandom number generator (PRNG) that is not cryptographically secure. Its output
      is predictable given sufficient observations, and implementations across JavaScript
      engines (V8, SpiderMonkey, JavaScriptCore) use algorithms like xorshift128+ that can
      be reverse-engineered to predict future outputs from past values.
    language: javascript
    category: crypto
    severity: High
    confidence: 0.90
    cwe: CWE-338
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-random
      - prng
      - token-generation
      - session-management
      - predictable
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'Math\.random\s*\(\s*\)[\s\S]{0,80}(?:token|secret|key|password|nonce|salt|session|csrf|otp|pin)'
        description: "Math.random near security-sensitive variable names"
      - type: regex
        pattern: '(?:token|secret|key|password|nonce|salt|session|csrf|otp|pin)[\s\S]{0,80}Math\.random\s*\(\s*\)'
        description: "Security-sensitive variable assigned using Math.random"
      - type: regex
        pattern: 'Math\.random\s*\(\s*\)\.toString\s*\(\s*(?:16|36)\s*\)'
        description: "Math.random converted to hex/base36 string for ID generation"
      - type: regex
        pattern: 'Math\.random\s*\(\s*\)[\s\S]{0,40}\.(?:substring|slice|substr)\s*\('
        description: "Math.random output truncated for token-like usage"
      - type: regex
        pattern: 'Math\.floor\s*\(\s*Math\.random\s*\(\s*\)\s*\*\s*(?:0x|16|256|65536|0xFFFF)'
        description: "Math.random scaled to byte-like range for crypto operations"
      - type: regex
        pattern: 'function\s+generate(?:Token|Key|Id|Secret|Password|Nonce|Salt)\s*\([^)]*\)\s*\{[\s\S]{0,200}Math\.random'
        description: "Security generator function using Math.random internally"
      - type: regex
        pattern: 'uuid[\s\S]{0,50}Math\.random'
        description: "UUID generation using Math.random instead of crypto"
      - type: regex
        pattern: 'Math\.random\s*\(\s*\)[\s\S]{0,50}charAt'
        description: "Math.random used for character selection in token generation"
    anti_patterns:
      - 'test\.(js|ts|jsx|tsx)$'
      - 'spec\.(js|ts|jsx|tsx)$'
      - '__tests__/'
      - '\/\/ nosec'
      - 'game'
      - 'animation'
      - 'shuffle'
      - 'sample'
      - 'jitter'
      - 'delay'
      - 'color'
      - 'position'
      - 'mock'
      - 'demo'
      - 'placeholder'
    bypass_variants:
      - description: "Aliasing Math.random to a different variable name"
        pattern: '(?:const|let|var)\s+\w+\s*=\s*Math\.random[\s;]'
      - description: "Using Math.random through a wrapper utility function"
        pattern: '(?:const|let|var)\s+(?:rand|rng|prng)\s*=\s*\(\s*\)\s*=>\s*Math\.random\s*\(\s*\)'
      - description: "Seeded PRNG libraries using Math.random as entropy source"
        pattern: 'seed(?:random|rng)\s*\(\s*Math\.random\s*\(\s*\)\s*\)'
    evasion_indicators:
      - "Math.random aliased to differently named function"
      - "PRNG wrapper class obscuring Math.random usage"
      - "Indirect call through eval or Function constructor"
      - "Third-party library internally using Math.random"
    encoding_variants:
      - type: "bracket_notation"
        pattern: 'Math\s*\[\s*[''"]random[''"]'
      - type: "destructured"
        pattern: 'const\s*\{\s*random\s*\}\s*=\s*Math'
      - type: "reflected_call"
        pattern: 'Reflect\.apply\s*\(\s*Math\.random'
    multi_function_chain_patterns:
      - "Math.random -> toString(36) -> substring -> token assignment"
      - "Array.fill -> map(Math.random) -> join -> key generation"
      - "Loop accumulating Math.random values into byte array"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Predictable tokens generated with Math.random can be guessed by attackers, enabling session hijacking, CSRF bypass, or password reset token prediction"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "Math.random()"
        sink: "session_token_assignment"
        through: "toString(36).substring()"
      - source: "Math.random()"
        sink: "password_reset_token"
        through: "hex_conversion"
      - source: "Math.random()"
        sink: "csrf_token_header"
        through: "token_generation_function"
    impact: |
      Using Math.random() for security-sensitive operations enables prediction attacks:
      - V8's xorshift128+ PRNG state can be recovered from ~5 observed outputs
      - Attackers can predict future tokens, passwords, session IDs after observing a few values
      - Password reset tokens become guessable, enabling account takeover
      - CSRF tokens become predictable, bypassing CSRF protection
      - Session identifiers can be predicted for session fixation/hijacking attacks
      - OTP/PIN values can be predicted in real-time
    remediation: |
      Use crypto.randomBytes() or crypto.randomUUID() for secure random values:

      ```javascript
      // VULNERABLE: Math.random for token generation
      const token = Math.random().toString(36).substring(2);

      // SECURE: Use crypto.randomBytes for tokens
      const crypto = require('crypto');
      const token = crypto.randomBytes(32).toString('hex');

      // SECURE: Use crypto.randomUUID for UUIDs (Node.js 14.17+)
      const uuid = crypto.randomUUID();

      // SECURE: Use crypto.randomInt for random integers
      const otp = crypto.randomInt(100000, 999999);

      // SECURE: Browser-side WebCrypto API
      const array = new Uint8Array(32);
      crypto.getRandomValues(array);
      const token = Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/338.html"
      - "https://blog.securityevaluators.com/hacking-the-javascript-lottery-80cc437e3b7f"
      - "https://v8.dev/blog/math-random"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Crypto/getRandomValues"
    context_awareness:
      surrounding_context_patterns:
        - 'token'
        - 'secret'
        - 'session'
        - 'password'
        - 'nonce'
        - 'csrf'
        - 'otp'
      taint_source_indicators:
        - 'Math\.random'
        - 'Math\[.random.\]'
      taint_sink_indicators:
        - 'cookie'
        - 'header'
        - 'token'
        - 'session'
        - 'res\.set'
        - 'localStorage'
      sanitization_patterns:
        - 'crypto\.randomBytes'
        - 'crypto\.randomUUID'
        - 'crypto\.getRandomValues'
        - 'crypto\.randomInt'
        - 'uuid\.v4'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + token_criticality_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits predictable password reset tokens:
        1. Attacker requests multiple password reset tokens for their own account
        2. Using observed tokens, attacker recovers the xorshift128+ PRNG internal state
        3. Attacker predicts the next token that will be generated
        4. Attacker triggers a password reset for the victim's account
        5. Attacker submits the predicted token and sets a new password for the victim
        6. Attacker gains full access to the victim's account
      example_payload: "const resetToken = Math.random().toString(36).substr(2, 12);"
      attacker_objective: "Predict security tokens generated with Math.random to hijack user sessions or bypass authentication"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: false
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JS-003"
        - "CRYPTO-JS-005"

  - rule_id: "CRYPTO-JS-005"
    title: "Insufficient Cryptographic Key Length"
    description: >
      Detects usage of cryptographic keys that do not meet minimum length requirements for
      their respective algorithms. RSA keys below 2048 bits are vulnerable to factoring attacks
      (NIST recommends 2048+ through 2030, 3072+ beyond). AES keys below 256 bits offer
      reduced security margins. Elliptic curve keys below 256 bits (equivalent to RSA 3072)
      are considered weak. Short keys may comply with legacy standards but fail modern
      security requirements and regulatory mandates.
    language: javascript
    category: crypto
    severity: High
    confidence: 0.87
    cwe: CWE-326
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - key-length
      - rsa
      - aes
      - insufficient-key-size
      - weak-key
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'generateKeyPair(?:Sync)?\s*\(\s*[''"]rsa[''"][^)]*modulusLength\s*:\s*(?:512|768|1024)\b'
        description: "RSA key generation with insufficient modulus length"
      - type: regex
        pattern: 'modulusLength\s*:\s*(?:512|768|1024)\b'
        description: "RSA modulus length below 2048 bits in key options"
      - type: regex
        pattern: 'createCipheriv\s*\(\s*[''"]aes-128-'
        description: "AES-128 cipher usage (prefer AES-256)"
      - type: regex
        pattern: 'crypto\.generateKey(?:Sync)?\s*\(\s*[''"]aes[''"][\s\S]{0,50}length\s*:\s*128\b'
        description: "AES key generation with 128-bit length"
      - type: regex
        pattern: 'randomBytes\s*\(\s*(?:8|12|16)\s*\)[\s\S]{0,80}(?:key|secret|encrypt)'
        description: "Potentially short key generated via randomBytes near encryption context"
      - type: regex
        pattern: 'namedCurve\s*:\s*[''"](?:P-192|P-224|secp192r1|secp224r1|prime192v1)[''"]'
        description: "Weak elliptic curve with insufficient key length"
      - type: regex
        pattern: 'keySize\s*:\s*(?:64|128)\b[\s\S]{0,50}(?:CryptoJS|encrypt|cipher)'
        description: "CryptoJS with insufficient key size configuration"
      - type: regex
        pattern: 'dsa[\s\S]{0,80}(?:1024|modulusLength\s*:\s*1024)'
        description: "DSA key generation with 1024-bit modulus"
    anti_patterns:
      - 'test\.(js|ts|jsx|tsx)$'
      - 'spec\.(js|ts|jsx|tsx)$'
      - '__tests__/'
      - '\/\/ nosec'
      - '\/\/ legacy-required'
      - 'aes-128.*non-sensitive'
      - 'cache[_-]?encrypt'
      - 'performance[_-]?test'
      - 'benchmark'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'temporary encryption'
      - 'log encryption'
    bypass_variants:
      - description: "Key length stored in variable or config to avoid literal detection"
        pattern: '(?:keyLength|keySize|modulusLength)\s*[=:]\s*(?:parseInt|Number)\s*\('
      - description: "Key length passed from environment or configuration file"
        pattern: 'modulusLength\s*:\s*(?:config|options|params)\.'
      - description: "Key derived from short password without proper stretching"
        pattern: 'scryptSync\s*\([^,]+,\s*[^,]+,\s*(?:16|24)\s*\)'
    evasion_indicators:
      - "Key length parameterized through configuration"
      - "Key generation wrapped in utility function hiding length"
      - "Key length determined at runtime from external input"
      - "Multiple key candidates generated then selected"
    encoding_variants:
      - type: "variable_key_length"
        pattern: 'modulusLength\s*:\s*\w+[\s\S]{0,80}(?:512|768|1024)'
      - type: "computed_length"
        pattern: 'modulusLength\s*:\s*\d+\s*\*\s*\d+'
      - type: "config_reference"
        pattern: 'modulusLength\s*:\s*(?:settings|cfg)\[\s*[''"]rsaBits[''"]'
    multi_function_chain_patterns:
      - "generateKeyPair with short modulus -> sign -> verify"
      - "createCipheriv('aes-128-cbc') -> update -> final"
      - "generateKey with insufficient length -> exportKey -> encrypt"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Short RSA keys can be factored using GNFS, enabling attackers to forge digital signatures and decrypt intercepted communications"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "key_generation_function"
        sink: "encryption_operation"
        through: "short_key_parameter"
      - source: "generateKeyPair"
        sink: "digital_signature"
        through: "weak_rsa_key"
      - source: "config_key_length"
        sink: "createCipheriv"
        through: "aes_key_derivation"
    impact: |
      Insufficient key lengths compromise the security of cryptographic operations:
      - RSA-1024 can be factored by well-resourced attackers (estimated cost: ~$1M)
      - RSA-512 and RSA-768 have been publicly factored
      - AES-128 provides adequate security today but lacks safety margin for future threats
      - Short ECC keys (P-192, P-224) offer insufficient security margins
      - Non-compliance with NIST SP 800-131A, PCI-DSS, and FIPS 140-2 requirements
      - Regulatory penalties for processing sensitive data with insufficient key lengths
    remediation: |
      Use recommended minimum key lengths for all algorithms:

      ```javascript
      // VULNERABLE: RSA with 1024-bit key
      const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
        modulusLength: 1024,
      });

      // SECURE: RSA with 4096-bit key
      const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
        modulusLength: 4096,
        publicExponent: 65537,
        publicKeyEncoding: { type: 'spki', format: 'pem' },
        privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
      });

      // SECURE: AES-256 instead of AES-128
      const key = crypto.randomBytes(32); // 256 bits
      const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);

      // SECURE: P-256 or P-384 elliptic curve
      const { publicKey, privateKey } = crypto.generateKeyPairSync('ec', {
        namedCurve: 'P-384'
      });
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/326.html"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
      - "https://www.keylength.com/en/4/"
      - "https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final"
    context_awareness:
      surrounding_context_patterns:
        - 'generateKeyPair'
        - 'modulusLength'
        - 'keySize'
        - 'keygen'
        - 'encrypt'
        - 'sign'
      taint_source_indicators:
        - 'config\.'
        - 'options\.'
        - 'settings\.'
        - 'params\.'
      taint_sink_indicators:
        - 'createCipheriv'
        - 'sign'
        - 'encrypt'
        - 'generateKeyPair'
      sanitization_patterns:
        - 'modulusLength\s*:\s*(?:2048|3072|4096)'
        - 'aes-256'
        - 'P-256'
        - 'P-384'
        - 'P-521'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + algorithm_strength_deficit)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker targets an application using 1024-bit RSA for JWT signing:
        1. Attacker collects public key from JWKS endpoint or TLS certificate
        2. Using distributed computing resources, attacker factors the 1024-bit RSA modulus
        3. Attacker recovers the private key from the factored primes
        4. Attacker forges JWTs with arbitrary claims (admin role, elevated permissions)
        5. Attacker uses forged tokens to access admin API endpoints
      example_payload: "crypto.generateKeyPairSync('rsa', { modulusLength: 1024 })"
      attacker_objective: "Factor weak RSA keys to forge signatures or decrypt protected communications"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JS-001"
        - "CRYPTO-JS-002"
        - "CRYPTO-JS-006"

  - rule_id: "CRYPTO-JS-006"
    title: "Missing IV/Nonce in AES Encryption"
    description: >
      Detects AES encryption operations that use a missing, static, hardcoded, or zero-filled
      initialization vector (IV) or nonce. IVs must be unique and unpredictable for CBC mode
      and unique (but not necessarily random) for CTR/GCM modes. Reusing an IV with the same
      key in GCM mode catastrophically breaks confidentiality and authenticity. The deprecated
      crypto.createCipher() API derives the IV from the password, making it deterministic and
      vulnerable to dictionary attacks.
    language: javascript
    category: crypto
    severity: High
    confidence: 0.89
    cwe: CWE-329
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - iv-reuse
      - nonce
      - aes
      - initialization-vector
      - cbc-mode
      - gcm-mode
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'crypto\.createCipher\s*\(\s*[''"]aes'
        description: "Deprecated createCipher API (deterministic IV derivation)"
      - type: regex
        pattern: 'iv\s*[=:]\s*Buffer\.alloc\s*\(\s*16\s*\)'
        description: "Zero-filled IV buffer (Buffer.alloc zero-fills by default)"
      - type: regex
        pattern: 'iv\s*[=:]\s*[''"](?:0{16,32}|00000000000000000000000000000000)[''"]'
        description: "Hardcoded zero-byte IV string"
      - type: regex
        pattern: 'iv\s*[=:]\s*Buffer\.from\s*\(\s*[''"][^''"]{16,}[''"]'
        description: "Static IV from hardcoded string via Buffer.from"
      - type: regex
        pattern: 'iv\s*[=:]\s*new\s+Uint8Array\s*\(\s*\[\s*0\s*(?:,\s*0\s*){7,}'
        description: "Zero-filled Uint8Array used as IV"
      - type: regex
        pattern: 'createCipheriv\s*\(\s*[^,]+,\s*[^,]+,\s*(?:null|undefined|''''|"")\s*\)'
        description: "Null or empty IV passed to createCipheriv"
      - type: regex
        pattern: 'CryptoJS\.AES\.encrypt\s*\(\s*[^,]+,\s*[^,]+,\s*\{\s*iv\s*:\s*CryptoJS\.enc\.\w+\.parse\s*\(\s*[''"][0]{16,}[''"]'
        description: "CryptoJS AES with zero IV"
      - type: regex
        pattern: 'const\s+iv\s*=\s*[''"][A-Za-z0-9+/=]{16,}[''"]'
        description: "Static IV stored as constant string"
    anti_patterns:
      - 'test\.(js|ts|jsx|tsx)$'
      - 'spec\.(js|ts|jsx|tsx)$'
      - '__tests__/'
      - '\/\/ nosec'
      - 'crypto\.randomBytes\s*\(\s*(?:12|16)\s*\)'
      - 'randomFillSync'
      - 'getRandomValues'
      - 'unique.*iv'
      - 'generate.*iv'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'iv\s*=\s*crypto\.randomBytes'
      - 'nonce\s*=\s*crypto\.randomBytes'
    bypass_variants:
      - description: "IV derived deterministically from message content"
        pattern: 'iv\s*=\s*crypto\.createHash\s*\([^)]+\)\.update\s*\([^)]+\)\.digest\s*\(\s*\)'
      - description: "IV reused from previous encryption stored in object property"
        pattern: 'this\.\w*[iI][vV]\w*\s*=\s*[^;]+[\s\S]{0,200}createCipheriv'
      - description: "Counter-based nonce without randomization"
        pattern: '(?:nonce|iv)\s*=\s*(?:counter|sequence|index)\b'
    evasion_indicators:
      - "IV assigned from function return value that returns static data"
      - "IV stored as class property and reused across encryptions"
      - "IV derived from predictable values like timestamps or counters"
      - "IV parameter omitted, relying on library defaults"
    encoding_variants:
      - type: "hex_zero_iv"
        pattern: 'iv\s*[=:]\s*[''"]00000000000000000000000000000000[''"]'
      - type: "base64_static_iv"
        pattern: 'iv\s*[=:]\s*Buffer\.from\s*\(\s*[''"]AAAAAAAAAAAAAAAAAAAAAA==[''"]'
      - type: "numeric_array_iv"
        pattern: 'iv\s*[=:]\s*\[\s*(?:0\s*,\s*){15}0\s*\]'
    multi_function_chain_patterns:
      - "Static IV assignment -> createCipheriv -> encrypt loop reusing IV"
      - "Hardcoded IV constant -> multiple cipher operations"
      - "createCipher (deprecated) -> update -> final without explicit IV"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "IV reuse with GCM mode leaks the authentication key, allowing attackers to forge ciphertexts and bypass integrity verification"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "static_iv_constant"
        sink: "createCipheriv_iv_parameter"
        through: "variable_assignment"
      - source: "zero_buffer"
        sink: "aes_encryption"
        through: "Buffer.alloc(16)"
      - source: "hardcoded_nonce"
        sink: "gcm_encryption"
        through: "constant_propagation"
    impact: |
      Missing or reused IVs fundamentally break encryption security:
      - CBC mode with predictable IV enables chosen-plaintext attacks (BEAST-style)
      - GCM mode with nonce reuse leaks the GHASH key, breaking both confidentiality and authenticity
      - CTR mode with repeated nonce produces identical keystreams, enabling XOR-based plaintext recovery
      - Static IVs allow detection of identical plaintexts (violates IND-CPA security)
      - The deprecated createCipher API derives IV from password, making it dictionary-attackable
      - Potentially catastrophic in multi-tenant systems where IV reuse crosses tenant boundaries
    remediation: |
      Always generate a fresh random IV for each encryption operation:

      ```javascript
      // VULNERABLE: Static/zero IV
      const iv = Buffer.alloc(16); // all zeros
      const cipher = crypto.createCipheriv('aes-256-cbc', key, iv);

      // VULNERABLE: Deprecated createCipher (deterministic IV)
      const cipher = crypto.createCipher('aes-256-cbc', password);

      // SECURE: Random IV for each encryption (CBC mode)
      const iv = crypto.randomBytes(16);
      const cipher = crypto.createCipheriv('aes-256-cbc', key, iv);
      // Prepend IV to ciphertext for decryption
      const encrypted = Buffer.concat([iv, cipher.update(data), cipher.final()]);

      // SECURE: Random nonce for GCM mode (12 bytes recommended)
      const nonce = crypto.randomBytes(12);
      const cipher = crypto.createCipheriv('aes-256-gcm', key, nonce);
      const encrypted = cipher.update(data, 'utf8', 'hex') + cipher.final('hex');
      const authTag = cipher.getAuthTag();
      // Store: nonce + authTag + ciphertext
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/329.html"
      - "https://csrc.nist.gov/publications/detail/sp/800-38d/final"
      - "https://csrc.nist.gov/publications/detail/sp/800-38a/final"
      - "https://eprint.iacr.org/2016/475.pdf"
    context_awareness:
      surrounding_context_patterns:
        - 'createCipheriv'
        - 'createCipher'
        - 'encrypt'
        - 'AES'
        - 'iv'
        - 'nonce'
        - 'initialization'
      taint_source_indicators:
        - 'Buffer\.alloc\s*\(\s*16'
        - 'new\s+Uint8Array\s*\(\s*16'
        - 'const\s+iv'
        - 'static\s+iv'
      taint_sink_indicators:
        - 'createCipheriv'
        - 'CryptoJS\.AES\.encrypt'
        - '\.update\('
        - '\.final\('
      sanitization_patterns:
        - 'crypto\.randomBytes\s*\(\s*(?:12|16)\s*\)'
        - 'crypto\.randomFillSync'
        - 'webcrypto\.getRandomValues'
        - 'generateIV'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + cipher_mode_risk_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits IV reuse in an AES-GCM encrypted messaging system:
        1. Attacker observes encrypted messages from the same user (same key, reused nonce)
        2. By XORing two ciphertexts encrypted with the same key and nonce, attacker recovers
           the XOR of the two plaintexts
        3. Using known-plaintext (e.g., message headers), attacker recovers the keystream
        4. Attacker also recovers the GHASH authentication key via polynomial analysis
        5. Attacker forges authenticated ciphertexts with arbitrary content
        6. Forged messages are accepted as authentic by the decryption routine
      example_payload: "const iv = Buffer.alloc(16); crypto.createCipheriv('aes-256-gcm', key, iv);"
      attacker_objective: "Exploit IV/nonce reuse to recover plaintext data and forge authenticated ciphertexts"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
