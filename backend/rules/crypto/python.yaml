    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + data_volume_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker analyzes ECB-encrypted database fields in a healthcare application:
        1. Attacker gains read access to encrypted patient records in the database
        2. Because ECB mode is used, identical diagnoses produce identical ciphertext blocks
        3. Attacker performs frequency analysis to identify common medical conditions
        4. By correlating with known patient data (chosen-plaintext), attacker builds a codebook
        5. Attacker decrypts diagnosis fields for all patients using the codebook
        6. Attacker performs block substitution to modify patient records
      example_payload: "cipher = AES.new(key, AES.MODE_ECB); encrypted = cipher.encrypt(pad(diagnosis, 16))"
      attacker_objective: "Exploit ECB pattern leakage to deduce encrypted data contents and manipulate ciphertext blocks"
