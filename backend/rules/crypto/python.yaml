  - rule_id: "CRYPTO-PY-007"
    title: "Insecure SSL/TLS Context Configuration"
    description: >
      Detects insecure SSL/TLS configurations in Python applications including disabled
      certificate verification, use of deprecated protocol versions, permissive hostname
      checking, and weak cipher suites. Python's ssl module defaults are generally secure,
      but developers frequently weaken security by disabling verification during development
      or when dealing with self-signed certificates, and these insecure settings often make
      it to production. The requests library's verify=False is particularly common and dangerous.
    language: python
    category: crypto
    severity: High
    confidence: 0.92
    cwe: CWE-295
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - ssl
      - tls
      - certificate-validation
      - mitm
      - transport-security
      - python
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'verify\s*=\s*False'
        description: "requests library SSL verification disabled"
      - type: regex
        pattern: 'ssl\._create_unverified_context\s*\('
        description: "Creating unverified SSL context"
      - type: regex
        pattern: 'ssl\.create_default_context\s*\(\s*\)[\s\S]{0,100}check_hostname\s*=\s*False'
        description: "SSL context with hostname checking disabled"
      - type: regex
        pattern: 'ssl\.create_default_context\s*\(\s*\)[\s\S]{0,100}verify_mode\s*=\s*ssl\.CERT_NONE'
        description: "SSL context with certificate verification disabled"
      - type: regex
        pattern: 'ssl\.PROTOCOL_(?:SSLv2|SSLv3|SSLv23|TLSv1)\b'
        description: "Deprecated SSL/TLS protocol constant"
      - type: regex
        pattern: 'CERT_NONE'
        description: "Certificate verification mode set to CERT_NONE"
      - type: regex
        pattern: 'urllib3\.disable_warnings\s*\(\s*(?:urllib3\.exceptions\.)?InsecureRequestWarning'
        description: "Suppressing InsecureRequestWarning (hiding the problem)"
      - type: regex
        pattern: 'ssl\.SSLContext\s*\(\s*ssl\.PROTOCOL_TLS\s*\)[\s\S]{0,100}verify_mode\s*=\s*ssl\.CERT_NONE'
        description: "TLS context created then verification disabled"
    anti_patterns:
      - 'test_.*\.py$'
      - '_test\.py$'
      - 'tests/.*\.py$'
      - '#\s*nosec'
      - '#\s*noqa'
      - 'development.*only'
      - 'localhost'
      - 'self[_-]signed'
      - '#\s*TODO.*remove'
      - '#\s*TEMPORARY'
      - 'mock'
      - 'fixture'
      - 'if.*DEBUG'
      - 'if.*\.env.*dev'
      - 'internal.*network'
    bypass_variants:
      - description: "SSL verification disabled through session object configuration"
        pattern: 'session\.verify\s*=\s*False'
      - description: "SSL context configured through environment variable"
        pattern: 'PYTHONHTTPSVERIFY\s*=\s*[''"]?0[''"]?'
      - description: "Monkey-patching ssl module to bypass verification"
        pattern: 'ssl\._create_default_https_context\s*=\s*ssl\._create_unverified_context'
    evasion_indicators:
      - "SSL settings loaded from configuration file"
      - "Verification disabled conditionally based on environment"
      - "Global monkey-patching of ssl module"
      - "Custom adapter or transport hiding insecure settings"
    encoding_variants:
      - type: "session_config"
        pattern: '\.session\s*\(\s*\)[\s\S]{0,100}verify\s*=\s*False'
      - type: "env_override"
        pattern: 'os\.environ\[\s*[''"]CURL_CA_BUNDLE[''"]'
      - type: "adapter_config"
        pattern: 'HTTPAdapter[\s\S]{0,200}verify\s*=\s*False'
    multi_function_chain_patterns:
      - "ssl._create_unverified_context -> urlopen for API calls"
      - "requests.Session(verify=False) -> multiple API requests"
      - "ssl.SSLContext(CERT_NONE) -> database connection"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Disabled SSL verification enables MITM attacks to intercept credentials, API keys, and sensitive data transmitted over HTTPS"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "config_setting"
        sink: "requests_call"
        through: "verify_false"
      - source: "ssl_context"
        sink: "database_connection"
        through: "CERT_NONE"
      - source: "environment_variable"
        sink: "global_ssl_context"
        through: "monkey_patch"
    impact: |
      Insecure SSL/TLS configuration in Python applications enables severe attacks:
      - MITM attackers can intercept all HTTPS traffic silently
      - Authentication credentials and API keys exposed in transit
      - Deprecated protocols vulnerable to POODLE, BEAST, CRIME, DROWN attacks
      - CERT_NONE allows connections to attacker-controlled servers with fake certificates
      - Suppressing InsecureRequestWarning hides but does not fix the vulnerability
      - Violates PCI-DSS 4.0 requirements for TLS 1.2+, HIPAA, GDPR encryption requirements
    remediation: |
      Enforce secure SSL/TLS configuration:

      ```python
      # VULNERABLE: Disabled SSL verification
      import requests
      response = requests.get('https://api.example.com', verify=False)

      # SECURE: Always verify SSL certificates (default behavior)
      response = requests.get('https://api.example.com')

      # SECURE: Use custom CA bundle if needed
      response = requests.get('https://api.example.com',
                              verify='/path/to/ca-bundle.crt')

      # SECURE: Create proper SSL context
      import ssl
      context = ssl.create_default_context()
      context.minimum_version = ssl.TLSVersion.TLSv1_2
      # context.minimum_version = ssl.TLSVersion.TLSv1_3  # preferred

      # SECURE: Use certifi for up-to-date CA certificates
      import certifi
      response = requests.get('https://api.example.com',
                              verify=certifi.where())

      # NEVER do this in production:
      # ssl._create_default_https_context = ssl._create_unverified_context
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://docs.python.org/3/library/ssl.html"
      - "https://requests.readthedocs.io/en/latest/user/advanced/#ssl-cert-verification"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns:
        - 'requests'
        - 'urllib'
        - 'ssl'
        - 'https'
        - 'certificate'
        - 'verify'
        - 'connect'
      taint_source_indicators:
        - 'config\.'
        - 'settings\.'
        - 'os\.environ'
        - 'DEBUG'
      taint_sink_indicators:
        - 'requests\.get'
        - 'requests\.post'
        - 'urlopen'
        - 'connect'
        - 'Session\('
      sanitization_patterns:
        - 'verify\s*=\s*True'
        - 'verify\s*=\s*certifi'
        - 'ssl\.create_default_context\s*\('
        - 'CERT_REQUIRED'
        - 'check_hostname\s*=\s*True'
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + network_exposure_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits disabled SSL verification in a Python microservice:
        1. Python service uses requests.get(url, verify=False) for inter-service communication
        2. Attacker gains network position via ARP spoofing on the container network
        3. Attacker presents a self-signed certificate for the target API endpoint
        4. The Python service accepts the fake certificate without verification
        5. Attacker captures OAuth tokens, API keys, and database credentials in transit
        6. Using captured credentials, attacker accesses internal databases and services
      example_payload: "requests.post('https://payment-api.internal/charge', json=payment_data, verify=False)"
      attacker_objective: "Intercept HTTPS communications by exploiting disabled certificate verification for credential theft and data exfiltration"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PY-002"
        - "CRYPTO-PY-003"

  - rule_id: "CRYPTO-PY-008"
    title: "Fernet Key Management Issues"
    description: >
      Detects insecure key management practices when using Python's cryptography library Fernet
      symmetric encryption. Fernet is a high-level recipe using AES-128-CBC with HMAC-SHA256
      for authenticated encryption, but its security depends entirely on proper key management.
      Common issues include hardcoded keys, keys derived from weak passwords without proper KDF,
      keys stored in plaintext files, keys logged or printed, and keys transmitted insecurely.
      Fernet keys are URL-safe base64-encoded 32-byte values that are easily recognizable.
    language: python
    category: crypto
    severity: High
    confidence: 0.87
    cwe: CWE-321
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - fernet
      - key-management
      - hardcoded-key
      - key-derivation
      - python
      - authenticated-encryption
    detection_layer: 2
    attack_surface_type: "internal"
    patterns:
      - type: regex
        pattern: 'Fernet\s*\(\s*b?[''"][A-Za-z0-9_-]{43}=[''"]'
        description: "Hardcoded Fernet key (base64url-encoded 32 bytes)"
      - type: regex
        pattern: 'Fernet\.generate_key\s*\(\s*\)[\s\S]{0,50}(?:print|logging|logger|log\.|stdout)'
        description: "Fernet key printed or logged after generation"
      - type: regex
        pattern: 'FERNET_KEY\s*=\s*b?[''"][A-Za-z0-9_-]{43}=[''"]'
        description: "Fernet key assigned as module-level constant"
      - type: regex
        pattern: 'Fernet\s*\(\s*(?:password|passwd|user_password|secret)\s*\.encode\s*\('
        description: "Raw password used directly as Fernet key without KDF"
      - type: regex
        pattern: 'open\s*\(\s*[^)]+\)\s*\.(?:read|readline)\s*\(\s*\)[\s\S]{0,80}Fernet\s*\('
        description: "Fernet key read from plaintext file"
      - type: regex
        pattern: 'base64\.urlsafe_b64encode\s*\(\s*(?:password|passwd|secret)'
        description: "Password base64-encoded to create Fernet-like key without stretching"
      - type: regex
        pattern: 'MultiFernet\s*\(\s*\[\s*Fernet\s*\(\s*b?[''"][^''"]{43}=[''"]'
        description: "Hardcoded key in MultiFernet rotation setup"
      - type: regex
        pattern: 'Fernet\s*\(\s*base64\.urlsafe_b64encode\s*\(\s*(?:hashlib\.(?:md5|sha1)|(?:password|secret)\.encode)'
        description: "Weak key derivation for Fernet (hash or raw encode)"
    anti_patterns:
      - 'test_.*\.py$'
      - '_test\.py$'
      - 'tests/.*\.py$'
      - '#\s*nosec'
      - '#\s*noqa'
      - 'os\.environ'
      - 'os\.getenv'
      - 'vault'
      - 'kms'
      - 'secretsmanager'
      - 'CHANGEME'
      - 'placeholder'
      - 'TODO.*replace'
      - 'mock'
      - 'fixture'
    bypass_variants:
      - description: "Fernet key stored in separate config file and imported"
        pattern: 'from\s+(?:config|settings|keys)\s+import\s+(?:FERNET_KEY|ENCRYPTION_KEY|SECRET_KEY)'
      - description: "Key derived from weak password hash then base64 encoded"
        pattern: 'base64\.urlsafe_b64encode\s*\(\s*hashlib\.\w+\s*\([^)]+\)\.digest\s*\(\s*\)\s*\)'
      - description: "Key read from environment but with hardcoded fallback"
        pattern: 'os\.(?:environ\.get|getenv)\s*\(\s*[''"]FERNET_KEY[''"][\s]*,\s*b?[''"][A-Za-z0-9_-]{43}=[''"]'
    evasion_indicators:
      - "Key imported from separate module that contains hardcoded value"
      - "Key derived from predictable input without proper stretching"
      - "Key stored in version-controlled configuration file"
      - "Key with hardcoded fallback value in getenv"
    encoding_variants:
      - type: "raw_bytes_key"
        pattern: 'Fernet\s*\(\s*b[''"][^''"]{43}=[''"]'
      - type: "string_key"
        pattern: 'Fernet\s*\(\s*[''"][^''"]{43}=[''"]\.encode\s*\(\s*\)'
      - type: "variable_key"
        pattern: '(?:fernet_key|encryption_key)\s*=\s*[''"][A-Za-z0-9_-]{43}=[''"]'
    multi_function_chain_patterns:
      - "generate_key -> print/log -> Fernet -> encrypt"
      - "Hardcoded key -> Fernet -> encrypt -> database store"
      - "Weak password -> base64 encode -> Fernet -> encrypt at rest"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Mismanaged Fernet keys enable decryption of all Fernet-encrypted data and forgery of Fernet tokens"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "hardcoded_key_string"
        sink: "Fernet_constructor"
        through: "variable_assignment"
      - source: "weak_password"
        sink: "Fernet_key"
        through: "base64_encode_without_kdf"
      - source: "plaintext_file"
        sink: "Fernet_constructor"
        through: "file_read"
    impact: |
      Fernet key management failures compromise all encrypted data:
      - Hardcoded keys expose encryption capability to anyone with source code access
      - Keys logged/printed may appear in log aggregation systems accessible to many users
      - Keys derived from weak passwords without proper KDF are brute-forceable
      - Keys stored in plaintext files risk exposure through file access vulnerabilities
      - Fernet uses AES-128-CBC + HMAC-SHA256; a compromised key breaks both confidentiality and authenticity
      - MultiFernet key rotation is meaningless if all keys are hardcoded
    remediation: |
      Implement proper Fernet key management:

      ```python
      # VULNERABLE: Hardcoded Fernet key
      from cryptography.fernet import Fernet
      key = b'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
      f = Fernet(key)

      # SECURE: Generate and store key securely
      key = Fernet.generate_key()
      # Store in environment variable, KMS, or vault

      # SECURE: Load key from environment
      import os
      key = os.environ['FERNET_KEY'].encode()
      f = Fernet(key)

      # SECURE: Derive key from password with proper KDF
      import base64
      from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
      from cryptography.hazmat.primitives import hashes
      kdf = PBKDF2HMAC(
          algorithm=hashes.SHA256(),
          length=32,
          salt=salt,  # stored securely, unique per user
          iterations=600000,
      )
      key = base64.urlsafe_b64encode(kdf.derive(password.encode()))
      f = Fernet(key)

      # SECURE: Use AWS KMS to protect Fernet key
      import boto3
      kms = boto3.client('kms')
      response = kms.decrypt(CiphertextBlob=encrypted_fernet_key)
      key = response['Plaintext']
      f = Fernet(key)
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/321.html"
      - "https://cryptography.io/en/latest/fernet/"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns:
        - 'Fernet'
        - 'MultiFernet'
        - 'encrypt'
        - 'decrypt'
        - 'token'
        - 'generate_key'
      taint_source_indicators:
        - 'hardcoded_string'
        - 'file\.read'
        - 'password'
        - 'config\.'
      taint_sink_indicators:
        - 'Fernet\('
        - 'MultiFernet'
        - '\.encrypt\('
        - '\.decrypt\('
      sanitization_patterns:
        - 'os\.environ'
        - 'os\.getenv'
        - 'vault'
        - 'kms'
        - 'PBKDF2HMAC'
        - 'Scrypt'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + key_exposure_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits hardcoded Fernet key in a Django REST API:
        1. Attacker discovers the application's Git repository (exposed .git or public repo)
        2. Searching for Fernet-related code reveals hardcoded key in settings.py
        3. Attacker identifies Fernet-encrypted fields in the API responses
        4. Using the extracted key, attacker decrypts all encrypted user data (SSN, credit cards)
        5. Attacker also forges Fernet tokens to inject malicious encrypted payloads
        6. Forged tokens pass HMAC verification because attacker has the authentic key
      example_payload: "Fernet(b'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=').encrypt(b'sensitive')"
      attacker_objective: "Extract Fernet keys to decrypt all protected data and forge authenticated encryption tokens"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PY-003"
        - "CRYPTO-PY-004"
        - "CRYPTO-PY-006"
