        - "CRYPTO-PY-005"

  - rule_id: "CRYPTO-PY-005"
    title: "Insufficient Cryptographic Key Length in Python"
    description: >
      Detects usage of cryptographic keys that do not meet minimum length requirements for
      their respective algorithms in Python applications. RSA keys below 2048 bits can be
      factored by well-resourced attackers. AES keys below 256 bits provide reduced security
      margins. DSA keys below 2048 bits are considered weak. Elliptic curve keys on curves
      smaller than P-256 offer insufficient security. NIST SP 800-131A Rev.2 and PCI-DSS 4.0
      mandate minimum key lengths for all cryptographic operations.
    language: python
    category: crypto
    severity: High
    confidence: 0.87
    cwe: CWE-326
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - key-length
      - rsa
      - aes
      - insufficient-key-size
      - python
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'RSA\.generate\s*\(\s*(?:512|768|1024)\b'
        description: "PyCryptodome RSA key generation with insufficient bits"
      - type: regex
        pattern: 'rsa\.generate_private_key\s*\([^)]*key_size\s*=\s*(?:512|768|1024)\b'
        description: "cryptography library RSA key with insufficient key_size"
      - type: regex
        pattern: 'generate_private_key\s*\(\s*(?:public_exponent\s*=\s*\d+\s*,\s*)?key_size\s*=\s*(?:512|768|1024)\b'
        description: "RSA generate_private_key with small key_size parameter"
      - type: regex
        pattern: 'dsa\.generate_private_key\s*\(\s*key_size\s*=\s*1024\b'
        description: "DSA key generation with 1024-bit modulus"
      - type: regex
        pattern: 'AES\.new\s*\(\s*[^,]{0,40},[\s\S]{0,30}\)[\s\S]{0,50}len\s*\(\s*key\s*\)\s*==\s*16\b'
        description: "AES with 128-bit (16-byte) key verification"
      - type: regex
        pattern: 'get_random_bytes\s*\(\s*16\s*\)[\s\S]{0,80}(?:key|encrypt|cipher|AES)'
        description: "16-byte (128-bit) random key generation for AES"
      - type: regex
        pattern: 'ec\.(?:SECP192R1|SECP224R1)\s*\(\s*\)'
        description: "Weak elliptic curve (P-192 or P-224)"
      - type: regex
        pattern: 'key_size\s*=\s*(?:512|768|1024)\b[\s\S]{0,50}(?:RSA|DSA|rsa|dsa)'
        description: "Small key_size parameter near RSA/DSA operations"
    anti_patterns:
      - 'test_.*\.py$'
      - '_test\.py$'
      - 'tests/.*\.py$'
      - '#\s*nosec'
      - '#\s*noqa'
      - '#\s*legacy'
      - 'benchmark'
      - 'performance_test'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'non.?sensitive'
      - 'cache.*encrypt'
      - 'temporary'
    bypass_variants:
      - description: "Key size stored in variable from configuration"
        pattern: 'key_size\s*=\s*(?:config|settings|options)\.'
      - description: "Key size passed as function argument"
        pattern: 'def\s+\w+\s*\([^)]*key_size[^)]*\)[\s\S]{0,200}generate_private_key'
      - description: "Key size computed from other parameters"
        pattern: 'key_size\s*=\s*\w+\s*\*\s*\d+'
    evasion_indicators:
      - "Key size loaded from configuration file"
      - "Key size determined at runtime from parameters"
      - "Key generation wrapped in factory function"
      - "Key size constants defined in separate module"
    encoding_variants:
      - type: "variable_key_size"
        pattern: 'RSA\.generate\s*\(\s*bits\s*\)[\s\S]{0,100}bits\s*=\s*(?:512|1024)'
      - type: "config_reference"
        pattern: 'key_size\s*=\s*int\s*\(\s*(?:os\.environ|config)\.'
      - type: "computed_size"
        pattern: 'key_(?:size|length|bits)\s*=\s*2\s*\*\*\s*10\b'
    multi_function_chain_patterns:
      - "RSA.generate(1024) -> exportKey -> sign operation"
      - "generate_private_key(key_size=1024) -> certificate signing"
      - "get_random_bytes(16) -> AES.new -> encrypt pipeline"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Short RSA keys can be factored to recover private keys, enabling signature forgery and decryption of intercepted communications"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "key_generation"
        sink: "encryption_operation"
        through: "short_key_parameter"
      - source: "RSA.generate(1024)"
        sink: "jwt_signing"
        through: "private_key_export"
      - source: "get_random_bytes(16)"
        sink: "AES.new"
        through: "key_variable"
    impact: |
      Insufficient key lengths in Python crypto operations create exploitable weaknesses:
      - RSA-512 publicly factored; RSA-768 factored by academic researchers
      - RSA-1024 factorable by nation-state actors (estimated cost declining rapidly)
      - AES-128 lacks safety margin against future quantum computing threats
      - DSA-1024 deprecated by NIST since 2013
      - Weak EC curves (P-192, P-224) fall below minimum security level requirements
      - Non-compliance with PCI-DSS 4.0, FIPS 140-3, NIST SP 800-131A Rev.2
    remediation: |
      Use recommended minimum key lengths:

      ```python
      # VULNERABLE: RSA with 1024-bit key
      from Crypto.PublicKey import RSA
      key = RSA.generate(1024)

      # SECURE: RSA with 4096-bit key
      key = RSA.generate(4096)

      # SECURE: Using cryptography library with proper key size
      from cryptography.hazmat.primitives.asymmetric import rsa
      private_key = rsa.generate_private_key(
          public_exponent=65537,
          key_size=4096
      )

      # SECURE: AES-256 (32-byte key)
      from Crypto.Cipher import AES
      from Crypto.Random import get_random_bytes
      key = get_random_bytes(32)  # 256 bits
      cipher = AES.new(key, AES.MODE_GCM)

      # SECURE: P-384 elliptic curve
      from cryptography.hazmat.primitives.asymmetric import ec
      private_key = ec.generate_private_key(ec.SECP384R1())
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/326.html"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
      - "https://www.keylength.com/en/4/"
      - "https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final"
    context_awareness:
      surrounding_context_patterns:
        - 'generate'
        - 'RSA'
        - 'DSA'
        - 'key_size'
        - 'AES'
        - 'encrypt'
        - 'sign'
      taint_source_indicators:
        - 'config\.'
        - 'settings\.'
        - 'options\.'
        - 'params\.'
      taint_sink_indicators:
        - 'AES\.new'
        - 'sign'
        - 'encrypt'
        - 'exportKey'
        - 'private_bytes'
      sanitization_patterns:
        - 'key_size\s*=\s*(?:2048|3072|4096)'
        - 'RSA\.generate\s*\(\s*(?:2048|3072|4096)'
        - 'get_random_bytes\s*\(\s*32\s*\)'
        - 'SECP384R1'
        - 'SECP521R1'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + algorithm_strength_deficit)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker targets a Python service using 1024-bit RSA for API token signing:
        1. Attacker obtains the public key from the API's JWKS endpoint
        2. Using cloud GPU instances for number field sieve factoring
        3. Attacker factors the 1024-bit RSA modulus and recovers the private key
        4. Attacker forges API tokens with elevated permissions
        5. Attacker accesses admin-only endpoints and exfiltrates sensitive data
      example_payload: "key = RSA.generate(1024)"
      attacker_objective: "Factor weak RSA keys to forge digital signatures and decrypt protected communications"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
