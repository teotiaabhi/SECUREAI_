  - rule_id: "CRYPTO-PY-006"
    title: "ECB Mode Usage in Symmetric Encryption"
    description: >
      Detects usage of Electronic Codebook (ECB) mode for symmetric encryption in Python
      applications. ECB mode encrypts each block independently with the same key, producing
      identical ciphertext blocks for identical plaintext blocks. This leaks patterns in the
      plaintext and is famously demonstrated by the ECB penguin image. ECB mode provides no
      semantic security (IND-CPA) and must never be used for encrypting data longer than one
      block. PyCryptodome and the cryptography library both support ECB, making it easy to
      misuse when developers select it for simplicity.
    language: python
    category: crypto
    severity: High
    confidence: 0.94
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - ecb-mode
      - block-cipher
      - pattern-leakage
      - aes
      - des
      - semantic-security
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'AES\.new\s*\([^,]+,\s*AES\.MODE_ECB'
        description: "AES cipher instantiated with ECB mode via PyCryptodome"
      - type: regex
        pattern: 'DES\.new\s*\([^,]+,\s*DES\.MODE_ECB'
        description: "DES cipher instantiated with ECB mode"
      - type: regex
        pattern: 'DES3\.new\s*\([^,]+,\s*DES3\.MODE_ECB'
        description: "Triple DES cipher instantiated with ECB mode"
      - type: regex
        pattern: 'algorithms\.AES\s*\([^)]*\)\s*,\s*modes\.ECB\s*\(\s*\)'
        description: "cryptography library AES with ECB mode"
      - type: regex
        pattern: 'Cipher\s*\(\s*algorithms\.(?:AES|TripleDES|Camellia)\s*\([^)]*\)\s*,\s*modes\.ECB'
        description: "cryptography library Cipher with ECB mode"
      - type: regex
        pattern: 'MODE_ECB'
        description: "Any reference to ECB mode constant"
      - type: regex
        pattern: 'mode\s*=\s*[''"](?:ecb|ECB)[''"]'
        description: "ECB mode specified as string parameter"
      - type: regex
        pattern: 'Blowfish\.new\s*\([^,]+,\s*Blowfish\.MODE_ECB'
        description: "Blowfish cipher with ECB mode"
    anti_patterns:
      - 'test_.*\.py$'
      - '_test\.py$'
      - 'tests/.*\.py$'
      - '#\s*nosec'
      - '#\s*noqa'
      - '#\s*key.?wrap'
      - 'ECB.*single.*block'
      - 'AES.*key.*wrapping'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - '#\s*legacy'
      - 'unwrap.*key'
      - 'RFC\s*3394'
    bypass_variants:
      - description: "Mode constant stored in variable"
        pattern: 'mode\s*=\s*(?:AES|DES)\.MODE_ECB[\s\S]{0,100}\.new\s*\([^,]+,\s*mode'
      - description: "Mode selected from dictionary or config"
        pattern: 'modes?\s*\[\s*[''"](?:ecb|ECB|0)[''"]'
      - description: "Mode parameter from function argument"
        pattern: 'def\s+\w+\s*\([^)]*mode[^)]*\)[\s\S]{0,200}AES\.new\s*\([^,]+,\s*mode'
    evasion_indicators:
      - "Mode stored in variable to avoid literal detection"
      - "Mode selected from configuration dictionary"
      - "Mode passed as function parameter"
      - "Cipher factory function hiding mode selection"
    encoding_variants:
      - type: "numeric_mode"
        pattern: 'AES\.new\s*\([^,]+,\s*1\s*[,)]'
      - type: "variable_mode"
        pattern: 'cipher_mode\s*=\s*(?:1|AES\.MODE_ECB)'
      - type: "config_mode"
        pattern: 'config\[\s*[''"]cipher_mode[''"]'
    multi_function_chain_patterns:
      - "AES.new(key, AES.MODE_ECB) -> encrypt -> base64 encode"
      - "ECB cipher -> pad -> encrypt loop over data blocks"
      - "DES.new(key, DES.MODE_ECB) -> encrypt -> store in database"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "ECB mode leaks plaintext patterns enabling data analysis, block manipulation, and chosen-plaintext attacks"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "plaintext_data"
        sink: "encrypted_storage"
        through: "AES.new(key, MODE_ECB).encrypt()"
      - source: "sensitive_field"
        sink: "database_column"
        through: "ECB_encryption"
      - source: "user_data"
        sink: "file_storage"
        through: "DES.new(key, MODE_ECB).encrypt()"
    impact: |
      ECB mode creates severe security vulnerabilities in encryption:
      - Identical plaintext blocks produce identical ciphertext blocks (pattern leakage)
      - The "ECB penguin" demonstration visually shows how patterns survive encryption
      - Attackers can detect repeated data, identify patterns, and perform block manipulation
      - ECB provides no IND-CPA security (the minimum standard for modern encryption)
      - Block rearrangement attacks allow modifying encrypted data without decrypting
      - Violates PCI-DSS, HIPAA, NIST SP 800-38A recommendations against ECB for multi-block data
    remediation: |
      Replace ECB mode with authenticated encryption (GCM, CCM, or SIV):

      ```python
      # VULNERABLE: ECB mode
      from Crypto.Cipher import AES
      cipher = AES.new(key, AES.MODE_ECB)
      ciphertext = cipher.encrypt(pad(data, AES.block_size))

      # SECURE: GCM mode (authenticated encryption)
      from Crypto.Cipher import AES
      from Crypto.Random import get_random_bytes
      nonce = get_random_bytes(12)
      cipher = AES.new(key, AES.MODE_GCM, nonce=nonce)
      ciphertext, tag = cipher.encrypt_and_digest(data)

      # SECURE: Using cryptography library with GCM
      from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
      import os
      iv = os.urandom(12)
      cipher = Cipher(algorithms.AES(key), modes.GCM(iv))
      encryptor = cipher.encryptor()
      ct = encryptor.update(data) + encryptor.finalize()
      tag = encryptor.tag
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://blog.filippo.io/the-ecb-penguin/"
      - "https://csrc.nist.gov/publications/detail/sp/800-38a/final"
      - "https://csrc.nist.gov/publications/detail/sp/800-38d/final"
    context_awareness:
