rules:
  - rule_id: "CRYPTO-PY-001"
    title: "Weak Hash Algorithm via hashlib (MD5/SHA1)"
    description: >
      Detects usage of cryptographically broken hash algorithms MD5 and SHA1 through Python's
      hashlib module or direct imports. MD5 is vulnerable to collision attacks demonstrated by
      Wang et al. (2004), and SHA1 was practically broken by Google's SHAttered attack (2017).
      Python's hashlib makes these algorithms easily accessible, but they must not be used for
      password hashing, digital signatures, certificate validation, or integrity verification
      of security-sensitive data. NIST SP 800-131A Rev.2 disallows SHA-1 for digital signatures.
    language: python
    category: crypto
    severity: High
    confidence: 0.92
    cwe: CWE-328
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-hash
      - md5
      - sha1
      - hashlib
      - python
      - integrity
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'hashlib\.md5\s*\('
        description: "hashlib.md5() constructor call"
      - type: regex
        pattern: 'hashlib\.sha1\s*\('
        description: "hashlib.sha1() constructor call"
      - type: regex
        pattern: 'hashlib\.new\s*\(\s*[''"](?:md5|sha1?)[''"]'
        description: "hashlib.new() with weak algorithm name"
      - type: regex
        pattern: 'from\s+hashlib\s+import\s+(?:.*\b)?(?:md5|sha1)\b'
        description: "Direct import of md5 or sha1 from hashlib"
      - type: regex
        pattern: 'import\s+md5\b'
        description: "Import of deprecated md5 module (Python 2 style)"
      - type: regex
        pattern: 'hmac\.new\s*\([^,]+,\s*[^,]*,\s*hashlib\.(?:md5|sha1)'
        description: "HMAC using weak hash as digestmod"
      - type: regex
        pattern: 'hmac\.new\s*\([^,]+,\s*[^,]*,\s*[''"](?:md5|sha1)[''"]'
        description: "HMAC with weak hash algorithm string"
      - type: regex
        pattern: 'hashlib\.(?:md5|sha1)\s*\(\s*(?:password|passwd|secret|token|key)'
        description: "Weak hash applied directly to security-sensitive variable"
    anti_patterns:
      - 'test_.*\.py$'
      - '_test\.py$'
      - 'tests/.*\.py$'
      - 'conftest\.py$'
      - '#\s*nosec'
      - '#\s*noqa'
      - 'checksum'
      - 'etag'
      - 'cache_key'
      - 'fingerprint.*dedup'
      - '#\s*legacy'
      - 'mock'
      - 'fixture'
      - 'usedforsecurity\s*=\s*False'
      - 'file.*integrity.*non.?security'
    bypass_variants:
      - description: "Algorithm name stored in variable and passed dynamically"
        pattern: '(?:algo|hash_name|method)\s*=\s*[''"](?:md5|sha1)[''"][\s\S]{0,100}hashlib\.new\s*\(\s*(?:algo|hash_name|method)'
      - description: "getattr used to dynamically access hash function"
        pattern: 'getattr\s*\(\s*hashlib\s*,\s*(?:algo|hash_name|method)\s*\)'
      - description: "Hash algorithm passed as function parameter"
        pattern: 'def\s+\w+\s*\([^)]*hash_algo[^)]*\)[\s\S]{0,200}hashlib\.new\s*\(\s*hash_algo'
    evasion_indicators:
      - "Algorithm name loaded from configuration file"
      - "Hash function selected at runtime via getattr"
      - "Wrapper function hiding direct hashlib usage"
      - "Third-party library wrapping hashlib internally"
    encoding_variants:
      - type: "bytes_literal"
        pattern: 'hashlib\.new\s*\(\s*b[''"](?:md5|sha1)[''"]'
      - type: "format_string"
        pattern: 'hashlib\.new\s*\(\s*f[''"]'
      - type: "variable_concat"
        pattern: 'hashlib\.new\s*\(\s*[''"]m[''"][\s]*\+[\s]*[''"]d5[''"]'
    multi_function_chain_patterns:
      - "hashlib.md5(data).hexdigest() for password storage"
      - "hmac.new with md5 digestmod for API token generation"
      - "hashlib.sha1 feeding into signature verification"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Collision attacks on MD5/SHA1 enable signature forgery, password cracking via rainbow tables, and integrity check bypasses"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_input"
        sink: "hash_comparison"
        through: "hashlib.md5(input).hexdigest()"
      - source: "password_field"
        sink: "database_column"
        through: "hashlib.sha1(password).hexdigest()"
      - source: "request_body"
        sink: "token_generation"
        through: "hmac.new(key, data, hashlib.md5)"
    impact: |
      Using MD5 or SHA1 for security-sensitive operations in Python applications leads to:
      - Password hashes crackable via rainbow tables or GPU-accelerated brute force
      - MD5 collision generation in seconds enabling document/certificate forgery
      - SHA1 chosen-prefix collisions demonstrated (SHAttered, Shambles attacks)
      - Non-compliance with NIST SP 800-131A, PCI-DSS 4.0, FIPS 140-3, and HIPAA
      - Integrity verification bypass through crafted collisions
      - HMAC with MD5 digestmod weakens authentication token security
    remediation: |
      Replace weak hashes with secure alternatives:

      ```python
      # VULNERABLE: MD5 for password hashing
      password_hash = hashlib.md5(password.encode()).hexdigest()

      # SECURE: Use bcrypt for password hashing
      import bcrypt
      password_hash = bcrypt.hashpw(password.encode(), bcrypt.gensalt(rounds=12))

      # SECURE: Use argon2 for password hashing (recommended)
      from argon2 import PasswordHasher
      ph = PasswordHasher(time_cost=3, memory_cost=65536, parallelism=4)
      password_hash = ph.hash(password)

      # SECURE: Use SHA-256 for integrity verification
      integrity_hash = hashlib.sha256(data).hexdigest()

      # SECURE: Use SHA-256 HMAC for message authentication
      import hmac
      mac = hmac.new(key, data, hashlib.sha256).hexdigest()

      # Python 3.9+: hashlib.md5(usedforsecurity=False) for non-security uses
      checksum = hashlib.md5(data, usedforsecurity=False).hexdigest()
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/328.html"
      - "https://docs.python.org/3/library/hashlib.html"
      - "https://shattered.io/"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
    context_awareness:
      surrounding_context_patterns:
        - 'password'
        - 'token'
        - 'signature'
        - 'verify'
        - 'authenticate'
        - 'session'
        - 'secret'
      taint_source_indicators:
        - 'request\.'
        - 'flask\.request'
        - 'django\.http'
        - 'sys\.argv'
        - 'input\('
      taint_sink_indicators:
        - '\.hexdigest\('
        - '\.digest\('
        - 'cursor\.execute'
        - 'session\['
        - 'response\.set_cookie'
      sanitization_patterns:
        - 'bcrypt'
        - 'argon2'
        - 'scrypt'
        - 'hashlib\.sha256'
        - 'hashlib\.sha512'
        - 'hashlib\.sha3'
        - 'hashlib\.blake2'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + business_impact_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits MD5 password hashing in a Django application:
        1. Attacker obtains a database dump through SQL injection or cloud misconfiguration
        2. Password hashes are stored as MD5 hexdigests without salting
        3. Attacker uses hashcat with rockyou.txt wordlist to crack MD5 hashes at 25 billion/sec
        4. Over 80% of passwords are recovered within minutes
        5. Attacker uses recovered passwords for credential stuffing across other services
        6. Accounts with admin privileges are compromised first due to targeted cracking
      example_payload: "hashlib.md5(password.encode('utf-8')).hexdigest()"
      attacker_objective: "Crack weak MD5/SHA1 password hashes to recover plaintext credentials for account takeover"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PY-002"
        - "CRYPTO-PY-003"
        - "CRYPTO-PY-006"

  - rule_id: "CRYPTO-PY-002"
    title: "Weak Cipher Algorithm via PyCryptodome (DES/RC4/Blowfish)"
    description: >
      Detects usage of weak or deprecated symmetric cipher algorithms through PyCryptodome
      (Crypto/Cryptodome) or the legacy PyCrypto library. DES with its 56-bit key is trivially
      brute-forceable. Triple DES (3DES) is vulnerable to Sweet32 birthday attacks on its
      64-bit blocks. RC4 has known keystream biases. Blowfish's 64-bit block size limits its
      secure usage. These algorithms are prohibited by modern security standards and must be
      replaced with AES-256 or ChaCha20-Poly1305.
    language: python
    category: crypto
    severity: High
    confidence: 0.93
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-cipher
      - des
      - rc4
      - blowfish
      - pycryptodome
      - symmetric-encryption
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'from\s+Crypto(?:dome)?\.Cipher\s+import\s+(?:.*\b)?(?:DES|DES3|ARC4|Blowfish)\b'
        description: "Import of weak cipher from PyCryptodome"
      - type: regex
        pattern: '(?:Crypto|Cryptodome)\.Cipher\.(?:DES|DES3|ARC4|Blowfish)\.new\s*\('
        description: "Instantiation of weak cipher via PyCryptodome"
      - type: regex
        pattern: 'DES\.new\s*\('
        description: "DES cipher instantiation after import"
      - type: regex
        pattern: 'DES3\.new\s*\('
        description: "Triple DES cipher instantiation after import"
      - type: regex
        pattern: 'ARC4\.new\s*\('
        description: "RC4 (ARC4) cipher instantiation after import"
      - type: regex
        pattern: 'Blowfish\.new\s*\('
        description: "Blowfish cipher instantiation after import"
      - type: regex
        pattern: 'from\s+Crypto\.Cipher\s+import\s+XOR'
        description: "XOR cipher import (completely insecure)"
      - type: regex
        pattern: 'algorithms\s*=\s*[^]]*[''"](?:DES|3DES|RC4|Blowfish)[''"]'
        description: "Weak algorithm specified in configuration list"
    anti_patterns:
      - 'test_.*\.py$'
      - '_test\.py$'
      - 'tests/.*\.py$'
      - '#\s*nosec'
      - '#\s*noqa'
      - '#\s*legacy.*required'
      - 'migration'
      - 'backward.*compat'
      - 'decrypt_only'
      - 'read_only_legacy'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'deprecated_wrapper'
    bypass_variants:
      - description: "Dynamic import of cipher module using importlib"
        pattern: 'importlib\.import_module\s*\(\s*[''"]Crypto\.Cipher\.(?:DES|ARC4|Blowfish)[''"]'
      - description: "Cipher class accessed via getattr on Cipher module"
        pattern: 'getattr\s*\(\s*(?:Crypto|Cryptodome)\.Cipher\s*,\s*[''"](?:DES|ARC4)[''"]'
      - description: "Cipher selected from dictionary mapping"
        pattern: 'cipher_map\s*\[\s*[''"](?:des|rc4|blowfish)[''"]'
    evasion_indicators:
      - "Cipher module imported dynamically via importlib"
      - "Algorithm selection via dictionary lookup"
      - "Factory pattern returning cipher instances"
      - "Cipher class accessed through reflection"
    encoding_variants:
      - type: "variable_import"
        pattern: 'cipher_mod\s*=\s*[''"](?:DES|ARC4|Blowfish)[''"][\s\S]{0,100}import_module'
      - type: "bytes_algorithm"
        pattern: 'b[''"](?:DES|RC4|Blowfish)[''"]'
      - type: "lowercase_reference"
        pattern: 'cipher_name\s*=\s*[''"](?:des|rc4|blowfish)[''"]'
    multi_function_chain_patterns:
      - "DES.new(key, DES.MODE_ECB) -> encrypt chain"
      - "ARC4.new(key) -> encrypt(plaintext) pipeline"
      - "Key derivation -> DES3.new -> encrypt -> base64 encode"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Weak ciphers enable brute-force key recovery and ciphertext decryption, exposing sensitive data including credentials and PII"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_data"
        sink: "encrypted_storage"
        through: "DES.new(key).encrypt(data)"
      - source: "api_request"
        sink: "encrypted_response"
        through: "ARC4.new(key).encrypt(payload)"
      - source: "database_field"
        sink: "encrypted_column"
        through: "DES3.new(key).encrypt(value)"
    impact: |
      Using weak cipher algorithms in Python applications creates severe security risks:
      - DES 56-bit key exhaustion achievable in hours with modern hardware
      - 3DES vulnerable to Sweet32 attack after 2^32 blocks (32GB of data)
      - RC4 statistical biases enable plaintext recovery in TLS and WPA protocols
      - Blowfish 64-bit block size enables birthday attacks
      - XOR cipher provides zero security (simple frequency analysis breaks it)
      - Regulatory violations: PCI-DSS, HIPAA, GDPR, SOC2 all mandate strong encryption
    remediation: |
      Replace weak ciphers with AES-256-GCM or ChaCha20-Poly1305:

      ```python
      # VULNERABLE: Using DES
      from Crypto.Cipher import DES
      cipher = DES.new(key_8bytes, DES.MODE_ECB)
      encrypted = cipher.encrypt(pad(data, 8))

      # SECURE: Use AES-256-GCM (authenticated encryption)
      from Crypto.Cipher import AES
      from Crypto.Random import get_random_bytes

      key = get_random_bytes(32)  # 256-bit key
      nonce = get_random_bytes(12)
      cipher = AES.new(key, AES.MODE_GCM, nonce=nonce)
      ciphertext, tag = cipher.encrypt_and_digest(data)
      # Store: nonce + tag + ciphertext

      # SECURE: Use ChaCha20-Poly1305
      from Crypto.Cipher import ChaCha20_Poly1305
      key = get_random_bytes(32)
      cipher = ChaCha20_Poly1305.new(key=key)
      ciphertext, tag = cipher.encrypt_and_digest(data)
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://pycryptodome.readthedocs.io/en/latest/"
      - "https://sweet32.info/"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
    context_awareness:
      surrounding_context_patterns:
        - 'encrypt'
        - 'decrypt'
        - 'cipher'
        - 'Crypto'
        - 'Cryptodome'
        - 'secret'
        - 'sensitive'
      taint_source_indicators:
        - 'request\.'
        - 'form\.'
        - 'json\.'
        - 'input\('
        - 'os\.environ'
      taint_sink_indicators:
        - '\.encrypt\('
        - '\.decrypt\('
        - 'cursor\.execute'
        - 'json\.dump'
        - 'open\(.*, .w'
      sanitization_patterns:
        - 'AES\.new.*MODE_GCM'
        - 'AES\.new.*MODE_CCM'
        - 'ChaCha20_Poly1305'
        - 'AES\.new.*MODE_SIV'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + data_sensitivity_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits DES encryption in a Python microservice:
        1. Attacker captures encrypted API payloads via network interception
        2. Attacker identifies DES encryption from 8-byte block patterns in ciphertext
        3. Using FPGA-based DES cracker, attacker brute-forces the 56-bit key in hours
        4. Attacker decrypts historical and future traffic with recovered key
        5. Extracted data includes user credentials, payment information, and API secrets
      example_payload: "DES.new(b'8byteky', DES.MODE_ECB).encrypt(pad(sensitive_data, 8))"
      attacker_objective: "Brute-force weak cipher keys to decrypt sensitive application data"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PY-001"
        - "CRYPTO-PY-003"
        - "CRYPTO-PY-005"
        - "CRYPTO-PY-006"

  - rule_id: "CRYPTO-PY-003"
    title: "Hardcoded Cryptographic Keys in Python Code"
    description: >
      Detects hardcoded cryptographic keys, secrets, and passwords embedded directly in Python
      source code. Hardcoded keys are a critical vulnerability because they are extractable
      through source code review, version control history, compiled bytecode (.pyc files),
      and decompilation. Key rotation requires code changes and redeployment. This pattern
      is especially dangerous in Python due to the ease of decompiling .pyc files and the
      common practice of publishing packages to PyPI.
    language: python
    category: crypto
    severity: Critical
    confidence: 0.88
    cwe: CWE-798
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - hardcoded-key
      - secret-management
      - credential-exposure
      - key-management
      - python
    detection_layer: 2
    attack_surface_type: "internal"
    patterns:
      - type: regex
        pattern: '(?:encryption_key|secret_key|crypto_key|aes_key|private_key)\s*=\s*[''"][A-Za-z0-9+/=]{16,}[''"]'
        description: "Named encryption key variable with hardcoded string value"
      - type: regex
        pattern: 'AES\.new\s*\(\s*b?[''"][^''"]{16,}[''"]'
        description: "Hardcoded key passed directly to AES.new()"
      - type: regex
        pattern: '(?:SECRET_KEY|ENCRYPTION_KEY|AES_KEY|CIPHER_KEY)\s*=\s*b?[''"][^''"]{16,}[''"]'
        description: "Constant with crypto-related name assigned hardcoded value"
      - type: regex
        pattern: 'key\s*=\s*b[''"]\\x[0-9a-fA-F]{2}(?:\\x[0-9a-fA-F]{2}){7,}[''"]'
        description: "Key as hardcoded bytes literal with hex escapes"
      - type: regex
        pattern: 'Fernet\s*\(\s*b?[''"][A-Za-z0-9_-]{43}=[''"]'
        description: "Hardcoded Fernet key (base64url-encoded 32 bytes)"
      - type: regex
        pattern: '(?:HMAC|hmac\.new)\s*\(\s*b?[''"][^''"]{16,}[''"]'
        description: "Hardcoded HMAC secret key"
      - type: regex
        pattern: 'jwt\.encode\s*\([^,]+,\s*[''"][^''"]{8,}[''"]'
        description: "Hardcoded JWT signing secret"
      - type: regex
        pattern: 'key\s*=\s*bytes\.fromhex\s*\(\s*[''"][0-9a-fA-F]{32,}[''"]'
        description: "Key from hardcoded hex string via bytes.fromhex()"
    anti_patterns:
      - 'test_.*\.py$'
      - '_test\.py$'
      - 'tests/.*\.py$'
      - 'conftest\.py$'
      - '#\s*nosec'
      - '#\s*noqa'
      - 'os\.environ'
      - 'os\.getenv'
      - 'vault_client'
      - 'boto3.*kms'
      - 'secretsmanager'
      - 'CHANGEME'
      - 'placeholder'
      - 'TODO.*replace'
      - 'example_key'
    bypass_variants:
      - description: "Key split across multiple string concatenations"
        pattern: '(?:key|secret)\s*=\s*[''"][^''"]+[''"][\s]*\+[\s]*[''"][^''"]+[''"]'
      - description: "Key built from list of integers"
        pattern: '(?:key|secret)\s*=\s*bytes\s*\(\s*\[\s*(?:\d+\s*,\s*){7,}'
      - description: "Key decoded from base64 literal"
        pattern: 'base64\.(?:b64decode|urlsafe_b64decode)\s*\(\s*b?[''"][A-Za-z0-9+/=_-]{16,}[''"]'
    evasion_indicators:
      - "Key split across multiple variables and concatenated"
      - "Key stored as list of integers converted to bytes"
      - "Key base64-encoded in source and decoded at runtime"
      - "Key embedded in docstring or comment and extracted programmatically"
    encoding_variants:
      - type: "base64_encoded_key"
        pattern: 'base64\.b64decode\s*\(\s*b?[''"][A-Za-z0-9+/=]{20,}[''"]'
      - type: "hex_encoded_key"
        pattern: '(?:key|secret)\s*=\s*[''"][0-9a-fA-F]{32,}[''"]'
      - type: "bytes_array_key"
        pattern: '(?:key|secret)\s*=\s*bytearray\s*\(\s*\[\s*(?:0x[0-9a-fA-F]+\s*,\s*){7,}'
    multi_function_chain_patterns:
      - "Hardcoded key -> AES.new() -> encrypt -> base64 encode"
      - "Constant key -> Fernet() -> encrypt_at_rest -> database store"
      - "Literal secret -> hmac.new -> token generation -> cookie set"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Hardcoded keys extracted from source or .pyc files allow decryption of all data encrypted with that key across all deployments"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "string_literal"
        sink: "AES.new_key_parameter"
        through: "variable_assignment"
      - source: "constant_definition"
        sink: "Fernet_constructor"
        through: "module_level_constant"
      - source: "hardcoded_bytes"
        sink: "jwt_encode_secret"
        through: "import_from_config_module"
    impact: |
      Hardcoded cryptographic keys in Python code create catastrophic security risks:
      - Python .pyc bytecode is trivially decompilable, exposing embedded keys
      - Keys in version control (git) persist forever in commit history
      - Shared keys across environments mean dev/staging breaches compromise production
      - Key rotation requires code changes, testing, and deployment across all instances
      - Published Python packages on PyPI expose keys to the entire ecosystem
      - Violates PCI-DSS Requirement 3.5, NIST SP 800-57, SOC2 CC6.1
    remediation: |
      Use secrets management and environment-based key injection:

      ```python
      # VULNERABLE: Hardcoded key
      SECRET_KEY = 'my-secret-encryption-key-12345678'
      cipher = AES.new(SECRET_KEY.encode(), AES.MODE_GCM)

      # SECURE: Load from environment variable
      import os
      SECRET_KEY = os.environ['ENCRYPTION_KEY']
      key = bytes.fromhex(SECRET_KEY)
      cipher = AES.new(key, AES.MODE_GCM, nonce=nonce)

      # SECURE: Use AWS KMS
      import boto3
      kms = boto3.client('kms')
      response = kms.decrypt(CiphertextBlob=encrypted_key)
      key = response['Plaintext']

      # SECURE: Use HashiCorp Vault
      import hvac
      client = hvac.Client(url=os.environ['VAULT_ADDR'])
      secret = client.secrets.kv.v2.read_secret_version(path='encryption')
      key = bytes.fromhex(secret['data']['data']['key'])

      # SECURE: Generate keys securely
      from Crypto.Random import get_random_bytes
      key = get_random_bytes(32)
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns:
        - 'encrypt'
        - 'decrypt'
        - 'cipher'
        - 'AES'
        - 'Fernet'
        - 'hmac'
        - 'jwt'
      taint_source_indicators:
        - 'const.*='
        - 'KEY.*='
        - 'SECRET.*='
        - 'module_level_assignment'
      taint_sink_indicators:
        - 'AES\.new'
        - 'Fernet\('
        - 'hmac\.new'
        - 'jwt\.encode'
        - 'pbkdf2_hmac'
      sanitization_patterns:
        - 'os\.environ'
        - 'os\.getenv'
        - 'vault'
        - 'kms'
