  - rule_id: "CRYPTO-PY-004"
    title: "Python random Module Used for Security-Sensitive Operations"
    description: >
      Detects usage of Python's random module (which uses the Mersenne Twister PRNG) for
      generating security-sensitive values such as tokens, passwords, session identifiers,
      CSRF tokens, or cryptographic keys. The Mersenne Twister is not cryptographically
      secure; its internal state can be fully recovered from 624 consecutive 32-bit outputs.
      Python 3.6+ provides the secrets module specifically designed for cryptographic
      randomness, and os.urandom() has always been available for secure random bytes.
    language: python
    category: crypto
    severity: High
    confidence: 0.91
    cwe: CWE-338
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-random
      - mersenne-twister
      - prng
      - token-generation
      - python
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'random\.(?:random|randint|randrange|choice|choices|sample|uniform)\s*\([^)]*\)[\s\S]{0,80}(?:token|secret|key|password|nonce|salt|session|csrf|otp|pin)'
        description: "random module function near security-sensitive variable names"
      - type: regex
        pattern: '(?:token|secret|key|password|nonce|salt|session|csrf|otp|pin)[\s\S]{0,80}random\.(?:random|randint|randrange|choice|choices|sample)\s*\('
        description: "Security-sensitive variable assigned using random module"
      - type: regex
        pattern: 'random\.getrandbits\s*\(\s*\d+\s*\)[\s\S]{0,80}(?:token|key|secret|nonce)'
        description: "random.getrandbits used for security-sensitive value"
      - type: regex
        pattern: 'def\s+generate_(?:token|key|secret|password|otp|nonce|salt)\s*\([^)]*\)[\s\S]{0,300}random\.'
        description: "Security generator function using random module internally"
      - type: regex
        pattern: '[''"]\.join\s*\(\s*random\.(?:choice|choices|sample)\s*\('
        description: "String built from random.choice for token/password generation"
      - type: regex
        pattern: 'random\.SystemRandom\s*\(\s*\)[\s\S]{0,80}(?:token|key|secret)'
        description: "SystemRandom usage (secure but should use secrets module)"
      - type: regex
        pattern: 'import\s+random[\s\S]{0,500}(?:token|key|password|secret|csrf|session)[\s\S]{0,100}random\.'
        description: "random module imported and used in security context"
      - type: regex
        pattern: 'random\.seed\s*\(\s*(?:\d+|[''"][^''"]+[''"])\s*\)[\s\S]{0,200}(?:encrypt|key|token)'
        description: "random module seeded with static value for crypto operations"
    anti_patterns:
      - 'test_.*\.py$'
      - '_test\.py$'
      - 'tests/.*\.py$'
      - '#\s*nosec'
      - '#\s*noqa'
      - 'shuffle.*display'
      - 'sample.*visualization'
      - 'random.*color'
      - 'random.*delay'
      - 'random.*jitter'
      - 'mock'
      - 'fixture'
      - 'simulation'
      - 'game'
      - 'numpy\.random'
    bypass_variants:
      - description: "random module aliased on import"
        pattern: 'import\s+random\s+as\s+\w+[\s\S]{0,100}\w+\.(?:choice|randint)\s*\('
      - description: "random function bound to local variable"
        pattern: '(?:randint|choice|randrange)\s*=\s*random\.(?:randint|choice|randrange)'
      - description: "Random class instantiated and used"
        pattern: 'rng\s*=\s*random\.Random\s*\(\s*\)[\s\S]{0,100}rng\.(?:randint|choice|random)\s*\('
    evasion_indicators:
      - "random module aliased to disguise usage"
      - "random function assigned to local variable"
      - "Custom Random subclass wrapping Mersenne Twister"
      - "Third-party library internally using random module"
    encoding_variants:
      - type: "from_import"
        pattern: 'from\s+random\s+import\s+(?:choice|randint|randrange|random)'
      - type: "getattr_access"
        pattern: 'getattr\s*\(\s*random\s*,\s*[''"](?:choice|randint|random)[''"]'
      - type: "class_method"
        pattern: 'self\._rng\.(?:choice|randint|random)\s*\('
    multi_function_chain_patterns:
      - "random.choice(charset) in loop -> join -> token string"
      - "random.randint -> hex conversion -> session ID"
      - "random.seed(time) -> random.random() -> key derivation"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Predictable Mersenne Twister outputs enable token prediction, session hijacking, and CSRF bypass"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "random.choice()"
        sink: "session_token"
        through: "join_loop"
      - source: "random.randint()"
        sink: "otp_value"
        through: "string_format"
      - source: "random.getrandbits()"
        sink: "csrf_token"
        through: "hex_conversion"
    impact: |
      Using Python's random module for security-sensitive operations is exploitable:
      - Mersenne Twister state recoverable from 624 consecutive 32-bit outputs
      - After state recovery, all future outputs are perfectly predictable
      - Password reset tokens become guessable, enabling account takeover
      - CSRF tokens become predictable, bypassing CSRF protection mechanisms
      - Session identifiers can be predicted for session hijacking
      - OTP/PIN values can be predicted after observing sufficient outputs
      - random.seed() with predictable values (time, PID) further reduces entropy
    remediation: |
      Use Python's secrets module or os.urandom() for security-sensitive randomness:

      ```python
      # VULNERABLE: Using random module for tokens
      import random
      import string
      token = ''.join(random.choices(string.ascii_letters + string.digits, k=32))

      # SECURE: Use secrets module (Python 3.6+)
      import secrets
      token = secrets.token_hex(32)        # 64-char hex string
      token = secrets.token_urlsafe(32)    # URL-safe base64 string
      token = secrets.token_bytes(32)      # 32 random bytes

      # SECURE: Cryptographically random integer
      otp = secrets.randbelow(900000) + 100000  # 6-digit OTP

      # SECURE: Cryptographically random choice
      password = ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(16))

      # SECURE: Use os.urandom for raw bytes
      import os
      key = os.urandom(32)
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/338.html"
      - "https://docs.python.org/3/library/secrets.html"
      - "https://docs.python.org/3/library/random.html#random.SystemRandom"
      - "https://jazzy.id.au/2010/09/22/cracking_random_number_generators_part_3.html"
    context_awareness:
      surrounding_context_patterns:
        - 'token'
        - 'secret'
        - 'session'
        - 'password'
        - 'nonce'
        - 'csrf'
        - 'otp'
        - 'pin'
      taint_source_indicators:
        - 'random\.choice'
        - 'random\.randint'
        - 'random\.random'
        - 'random\.getrandbits'
      taint_sink_indicators:
        - 'session\['
        - 'cookie'
        - 'token'
        - 'response\.set_cookie'
        - 'header'
      sanitization_patterns:
        - 'secrets\.'
        - 'os\.urandom'
        - 'SystemRandom'
        - 'get_random_bytes'
        - 'Crypto\.Random'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + token_criticality_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits predictable password reset tokens in a Django application:
        1. Attacker observes Python random module used for token generation
        2. Attacker requests 624+ password reset tokens for their own account
        3. Using Mersenne Twister untwisting tools, attacker recovers full PRNG state
        4. Attacker predicts the next tokens that will be generated
        5. Attacker triggers password reset for target admin account
        6. Attacker submits the predicted reset token and gains admin access
      example_payload: "token = ''.join(random.choices(string.hexdigits, k=32))"
      attacker_objective: "Predict security tokens by recovering the Mersenne Twister PRNG state from observed outputs"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
