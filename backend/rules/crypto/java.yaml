  - rule_id: "CRYPTO-JAVA-007"
    title: "SSLContext with Permissive TrustManager"
    description: >
      Detects implementations of custom TrustManager that accept all certificates without
      validation, effectively disabling the PKI trust model for TLS connections. This pattern
      involves creating an X509TrustManager with empty checkClientTrusted/checkServerTrusted
      methods and returning empty arrays from getAcceptedIssuers(). This is the most common
      way to disable TLS certificate validation in Java and is frequently found in production
      code due to developers working around self-signed certificates during development.
    language: java
    category: crypto
    severity: High
    confidence: 0.93
    cwe: CWE-295
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - tls
      - ssl
      - trust-manager
      - certificate-validation
      - mitm
      - java
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'new\s+X509TrustManager\s*\(\s*\)\s*\{[\s\S]*?checkServerTrusted[\s\S]*?\{\s*\}'
        description: "X509TrustManager with empty checkServerTrusted method"
      - type: regex
        pattern: 'TrustManager\s*\[\s*\]\s*\w+\s*=\s*new\s+TrustManager\s*\[\s*\]\s*\{[\s\S]*?X509TrustManager'
        description: "TrustManager array with custom X509TrustManager implementation"
      - type: regex
        pattern: 'SSLContext\.getInstance\s*\(\s*"(?:SSL|TLS|TLSv1|TLSv1\.1)"\s*\)'
        description: "SSLContext with deprecated protocol version"
      - type: regex
        pattern: 'getAcceptedIssuers\s*\(\s*\)\s*\{[\s\S]{0,50}return\s+(?:null|new\s+X509Certificate\s*\[\s*0?\s*\])'
        description: "getAcceptedIssuers returning empty/null (trust all issuers)"
      - type: regex
        pattern: 'HostnameVerifier[\s\S]{0,50}return\s+true'
        description: "HostnameVerifier that always returns true"
      - type: regex
        pattern: 'HttpsURLConnection\.setDefaultHostnameVerifier\s*\(\s*(?:new\s+HostnameVerifier|[^)]*return\s+true)'
        description: "Default hostname verifier overridden to accept all hosts"
      - type: regex
        pattern: 'SSLSocketFactory\.getDefault\(\)[\s\S]{0,100}ALLOW_ALL|allTrust|trustAll'
        description: "SSL socket factory with trust-all configuration"
      - type: regex
        pattern: 'TrustAllStrategy|NoopHostnameVerifier|InsecureTrustManagerFactory'
        description: "Apache/Netty/Spring trust-all utility classes"
    anti_patterns:
      - 'Test\.java$'
      - 'Tests\.java$'
      - 'test/'
      - 'src/test/'
      - '@Test'
      - '//\s*NOSONAR'
      - '//\s*nosec'
      - 'development.*only'
      - 'localhost'
      - 'self.*signed'
      - '@Deprecated'
      - '//\s*TODO.*remove'
      - '//\s*TEMPORARY'
      - 'mock'
      - 'if.*isDevMode'
    bypass_variants:
      - description: "Trust manager loaded via factory or dependency injection"
        pattern: '(?:TrustManagerFactory|getBean)\s*\([^)]*\)[\s\S]{0,100}SSLContext\.init'
      - description: "Trust-all configured via OkHttp or Apache HTTP client"
        pattern: '\.sslSocketFactory\s*\(\s*sslContext\.getSocketFactory\s*\(\s*\)\s*,\s*trustManager'
      - description: "Spring RestTemplate with disabled SSL verification"
        pattern: 'RestTemplate[\s\S]{0,200}(?:NoopHostnameVerifier|TrustAllStrategy|disableSslVerification)'
    evasion_indicators:
      - "TrustManager implementation in separate utility class"
      - "SSL configuration loaded via Spring profile"
      - "TrustManager injected via dependency injection"
      - "Library-specific trust bypass (OkHttp, Apache, Netty)"
    encoding_variants:
      - type: "lambda_verifier"
        pattern: 'setHostnameVerifier\s*\(\s*\(\s*\w+\s*,\s*\w+\s*\)\s*->\s*true\s*\)'
      - type: "anonymous_class"
        pattern: 'new\s+HostnameVerifier\s*\(\s*\)\s*\{[\s\S]*?return\s+true'
      - type: "method_reference"
        pattern: 'setHostnameVerifier\s*\(\s*\w+::alwaysTrue\s*\)'
    multi_function_chain_patterns:
      - "new TrustManager[]{custom} -> SSLContext.init -> HttpsURLConnection"
      - "SSLContext.getInstance('TLS') -> init(null, trustAll, null) -> socket factory"
      - "Trust-all manager -> SSLSocketFactory -> OkHttpClient.Builder"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Permissive TrustManagers enable MITM attacks on all HTTPS connections, exposing authentication credentials and sensitive data"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "custom_trust_manager"
        sink: "SSLContext_init"
        through: "TrustManager_array"
      - source: "hostname_verifier"
        sink: "HTTPS_connection"
        through: "setDefaultHostnameVerifier"
      - source: "ssl_context"
        sink: "http_client"
        through: "socket_factory"
    impact: |
      Permissive TrustManagers fundamentally break TLS security:
      - All certificate chain validation is bypassed (self-signed, expired, wrong CN)
      - MITM attackers can present any certificate and intercept all traffic
      - Authentication credentials, session tokens, and API keys exposed
      - Payment data and PII transmitted without actual encryption protection
      - SSL/TLS becomes security theater (appears secure but provides no protection)
      - Violates PCI-DSS 4.0, HIPAA, GDPR encryption-in-transit requirements
    remediation: |
      Use proper certificate validation:

      ```java
      // VULNERABLE: Trust all certificates
      TrustManager[] trustAll = new TrustManager[]{
          new X509TrustManager() {
              public void checkServerTrusted(X509Certificate[] c, String s) {}
              public void checkClientTrusted(X509Certificate[] c, String s) {}
              public X509Certificate[] getAcceptedIssuers() { return null; }
          }
      };
      SSLContext ctx = SSLContext.getInstance("TLS");
      ctx.init(null, trustAll, null);

      // SECURE: Use default TrustManager with system trust store
      SSLContext ctx = SSLContext.getInstance("TLSv1.3");
      ctx.init(null, null, new SecureRandom()); // uses default trust manager

      // SECURE: Use custom trust store with pinned certificates
      KeyStore trustStore = KeyStore.getInstance("PKCS12");
      trustStore.load(new FileInputStream("truststore.p12"), password);
      TrustManagerFactory tmf = TrustManagerFactory.getInstance("PKIX");
      tmf.init(trustStore);
      SSLContext ctx = SSLContext.getInstance("TLSv1.3");
      ctx.init(null, tmf.getTrustManagers(), new SecureRandom());

      // SECURE: Certificate pinning with OkHttp
      CertificatePinner pinner = new CertificatePinner.Builder()
          .add("api.example.com", "sha256/AAAAAAA...")
          .build();
      OkHttpClient client = new OkHttpClient.Builder()
          .certificatePinner(pinner)
          .build();
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://docs.oracle.com/en/java/javase/17/security/java-secure-socket-extension-jsse-reference-guide.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
      - "https://owasp.org/www-community/controls/Certificate_and_Public_Key_Pinning"
    context_awareness:
      surrounding_context_patterns:
        - 'SSLContext'
        - 'TrustManager'
        - 'X509TrustManager'
        - 'HostnameVerifier'
        - 'HttpsURLConnection'
        - 'SSLSocketFactory'
      taint_source_indicators:
        - 'new\s+TrustManager'
        - 'TrustAllStrategy'
        - 'NoopHostnameVerifier'
        - 'InsecureTrustManagerFactory'
      taint_sink_indicators:
        - 'SSLContext\.init'
        - 'setDefaultSSLSocketFactory'
        - 'setDefaultHostnameVerifier'
        - 'HttpsURLConnection'
        - 'OkHttpClient'
      sanitization_patterns:
        - 'TrustManagerFactory\.getInstance\s*\(\s*"PKIX"'
        - 'CertificatePinner'
        - 'TLSv1\.3'
        - 'checkServerTrusted.*throw'
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + network_exposure_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits a trust-all TrustManager in a Spring Boot microservice:
        1. Microservice uses custom TrustManager to connect to internal APIs over HTTPS
        2. Attacker compromises a network device or performs ARP spoofing
        3. Attacker intercepts HTTPS connections with a self-signed certificate
        4. TrustManager accepts the attacker's certificate without validation
        5. Attacker captures OAuth2 tokens exchanged between microservices
        6. Using stolen tokens, attacker accesses APIs as the compromised service
        7. Lateral movement through the microservice mesh using service-to-service trust
      example_payload: "SSLContext.getInstance(\"TLS\").init(null, trustAllCerts, null)"
      attacker_objective: "Intercept TLS-encrypted communications by exploiting permissive certificate validation"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JAVA-002"
        - "CRYPTO-JAVA-003"

  - rule_id: "CRYPTO-JAVA-008"
    title: "Bouncy Castle Misconfiguration"
    description: >
      Detects insecure configurations and misuse of the Bouncy Castle cryptography library
      in Java applications. Bouncy Castle provides a wide range of cryptographic algorithms
      and is widely used in enterprise Java for advanced crypto operations. Common misconfigurations
      include using weak algorithms through the BC provider, improper parameter initialization,
      using deprecated or experimental features, and insecure key agreement or signature schemes.
      The flexibility of Bouncy Castle makes it particularly prone to misconfiguration.
    language: java
    category: crypto
    severity: High
    confidence: 0.86
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - bouncy-castle
      - misconfiguration
      - key-agreement
      - signature
      - java
      - provider
    detection_layer: 3
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+(?:MD5|SHA1|RIPEMD)Digest\s*\('
        description: "Bouncy Castle weak digest instantiation"
      - type: regex
        pattern: 'new\s+(?:DESEngine|DESedeEngine|RC4Engine|BlowfishEngine)\s*\('
        description: "Bouncy Castle weak cipher engine instantiation"
      - type: regex
        pattern: 'new\s+(?:PKCS1Encoding|ISO9796d1Encoding)\s*\('
        description: "Bouncy Castle insecure RSA encoding"
      - type: regex
        pattern: 'new\s+ECBBlockCipher\s*\('
        description: "Bouncy Castle ECB mode block cipher"
      - type: regex
        pattern: 'Security\.addProvider\s*\(\s*new\s+BouncyCastleProvider\s*\(\s*\)\s*\)[\s\S]{0,200}(?:MD5|SHA1|DES|RC4|ECB)'
        description: "BC provider registered then weak algorithm used"
      - type: regex
        pattern: 'new\s+RSAEngine\s*\(\s*\)[\s\S]{0,100}(?!OAEP)(?:init|processBlock)'
        description: "RSAEngine without OAEP wrapping"
      - type: regex
        pattern: 'new\s+(?:CBCBlockCipher|SICBlockCipher)\s*\([^)]*\)[\s\S]{0,100}init\s*\(\s*true\s*,\s*new\s+KeyParameter'
        description: "BC block cipher init without IV parameter"
      - type: regex
        pattern: 'new\s+DSASigner\s*\(\s*\)[\s\S]{0,100}(?:SHA1|MD5|RIPEMD)'
        description: "DSA signer with weak hash algorithm"
    anti_patterns:
      - 'Test\.java$'
      - 'Tests\.java$'
      - 'test/'
      - 'src/test/'
      - '@Test'
      - '//\s*NOSONAR'
      - '//\s*nosec'
      - 'legacy'
      - '@Deprecated'
      - 'migration'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'backward.*compat'
    bypass_variants:
      - description: "BC engine instantiated via factory pattern"
        pattern: 'BlockCipherFactory\.create\s*\(\s*"(?:DES|RC4|Blowfish)"'
      - description: "BC algorithm selected from configuration string"
        pattern: '(?:engineName|cipherName)\s*=\s*"(?:DES|RC4|Blowfish)"[\s\S]{0,200}Engine'
      - description: "BC provider used implicitly via JCE"
        pattern: 'Cipher\.getInstance\s*\(\s*"[^"]+"\s*,\s*"BC"\s*\)[\s\S]{0,50}(?:DES|RC4|ECB)'
    evasion_indicators:
      - "Bouncy Castle engine selected from configuration"
      - "Algorithm name passed through factory method"
      - "BC provider registered globally then used via JCE standard API"
      - "Custom provider wrapping BC with modified defaults"
    encoding_variants:
      - type: "provider_string"
        pattern: 'Cipher\.getInstance\s*\([^,]+,\s*"BC"\s*\)'
      - type: "provider_object"
        pattern: 'Cipher\.getInstance\s*\([^,]+,\s*new\s+BouncyCastleProvider'
      - type: "reflection"
        pattern: 'Class\.forName\s*\(\s*"org\.bouncycastle'
    multi_function_chain_patterns:
      - "DESEngine -> CBCBlockCipher -> PaddedBufferedBlockCipher -> encrypt"
      - "RSAEngine (no OAEP) -> init -> processBlock"
      - "MD5Digest -> HMac -> init -> doFinal"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Bouncy Castle misconfiguration can expose weak algorithms, improper padding, and insecure key operations leading to data compromise"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "plaintext_data"
        sink: "bc_cipher_processBlock"
        through: "DESEngine_init"
      - source: "message_data"
        sink: "bc_digest_doFinal"
        through: "MD5Digest_update"
      - source: "rsa_plaintext"
        sink: "RSAEngine_processBlock"
        through: "no_OAEP_encoding"
    impact: |
      Bouncy Castle misconfiguration creates various cryptographic vulnerabilities:
      - Weak digests (MD5, SHA1, RIPEMD) enable collision attacks
      - ECBBlockCipher leaks plaintext patterns
      - DESEngine/RC4Engine provide insufficient encryption strength
      - PKCS1Encoding is vulnerable to Bleichenbacher oracle attacks
      - RSAEngine without OAEP wrapping enables textbook RSA attacks
      - CBCBlockCipher without proper IV reuses previous ciphertext block
      - DSA with weak hash enables signature forgery
    remediation: |
      Use secure Bouncy Castle configurations:

      ```java
      // VULNERABLE: BC with DES and ECB
      BlockCipher engine = new DESEngine();
      BufferedBlockCipher cipher = new PaddedBufferedBlockCipher(
          new ECBBlockCipher(engine));

      // SECURE: BC with AES-GCM
      AEADBlockCipher cipher = new GCMBlockCipher(new AESEngine());
      AEADParameters params = new AEADParameters(
          new KeyParameter(key), 128, nonce, associatedData);
      cipher.init(true, params);

      // SECURE: BC RSA-OAEP
      AsymmetricBlockCipher cipher = new OAEPEncoding(
          new RSAEngine(),
          new SHA256Digest(),
          new SHA256Digest(),
          null
      );

      // SECURE: BC signatures with SHA-256
      DSADigestSigner signer = new DSADigestSigner(
          new ECDSASigner(), new SHA256Digest());

      // SECURE: BC SHA-256 digest
      Digest digest = new SHA256Digest();
      digest.update(data, 0, data.length);
      byte[] hash = new byte[digest.getDigestSize()];
      digest.doFinal(hash, 0);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://www.bouncycastle.org/documentation.html"
      - "https://www.bouncycastle.org/wiki/display/JA1/Provider+Installation"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
    context_awareness:
      surrounding_context_patterns:
        - 'BouncyCastle'
        - 'org\.bouncycastle'
        - 'Engine'
        - 'Digest'
        - 'BlockCipher'
        - 'Signer'
        - 'Encoding'
      taint_source_indicators:
        - 'plaintext'
        - 'data'
        - 'message'
        - 'input'
      taint_sink_indicators:
        - 'processBlock'
        - 'doFinal'
        - 'update'
        - 'init'
      sanitization_patterns:
        - 'AESEngine'
        - 'GCMBlockCipher'
        - 'OAEPEncoding'
        - 'SHA256Digest'
        - 'SHA384Digest'
        - 'SHA512Digest'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + algorithm_weakness_severity)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits Bouncy Castle RSA without OAEP in a Java payment system:
        1. Payment system uses RSAEngine directly without OAEPEncoding
        2. Attacker captures RSA-encrypted payment data from network traffic
        3. Using chosen-ciphertext attacks against textbook RSA, attacker recovers plaintext
        4. Attacker extracts credit card numbers from decrypted payment payloads
        5. Alternatively, attacker exploits ECBBlockCipher to identify repeated transaction data
        6. Pattern analysis reveals purchase amounts and card number blocks
      example_payload: "new RSAEngine(); engine.init(true, pubKeyParams); engine.processBlock(data, 0, data.length)"
      attacker_objective: "Exploit Bouncy Castle misconfiguration to decrypt protected data or forge cryptographic operations"
    confidence_factors:
      pattern_strength: "medium"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JAVA-001"
        - "CRYPTO-JAVA-002"
        - "CRYPTO-JAVA-005"
        - "CRYPTO-JAVA-006"
