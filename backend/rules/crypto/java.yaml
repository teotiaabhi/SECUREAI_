rules:
  - rule_id: "CRYPTO-JAVA-001"
    title: "Weak Hash Algorithm via MessageDigest (MD5/SHA1)"
    description: >
      Detects usage of cryptographically broken hash algorithms MD5 and SHA-1 through Java's
      MessageDigest API, Apache Commons DigestUtils, or Guava Hashing utilities. MD5 collisions
      can be generated in seconds on commodity hardware. SHA-1 was practically broken by the
      SHAttered attack (2017) and chosen-prefix collisions were demonstrated by Shambles (2020).
      Java applications commonly use these via MessageDigest.getInstance("MD5") or third-party
      libraries. NIST SP 800-131A Rev.2 disallows these algorithms for digital signatures.
    language: java
    category: crypto
    severity: High
    confidence: 0.93
    cwe: CWE-328
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-hash
      - md5
      - sha1
      - messagedigest
      - java
      - integrity
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'MessageDigest\.getInstance\s*\(\s*"(?:MD5|SHA-?1)"\s*\)'
        description: "MessageDigest.getInstance with weak algorithm string"
      - type: regex
        pattern: 'DigestUtils\.(?:md5|sha1|md5Hex|sha1Hex|md5Digest|sha1Digest)\s*\('
        description: "Apache Commons DigestUtils weak hash methods"
      - type: regex
        pattern: 'Hashing\.(?:md5|sha1)\s*\(\s*\)'
        description: "Guava Hashing utility with weak algorithm"
      - type: regex
        pattern: 'Mac\.getInstance\s*\(\s*"Hmac(?:MD5|SHA1)"\s*\)'
        description: "HMAC with weak underlying hash algorithm"
      - type: regex
        pattern: 'new\s+(?:MD5|SHA1)Digest\s*\('
        description: "Bouncy Castle MD5/SHA1 digest instantiation"
      - type: regex
        pattern: 'DigestAlgorithm\.(?:MD5|SHA1|SHA_1)\b'
        description: "Enum-based weak digest algorithm selection"
      - type: regex
        pattern: 'MessageDigest\.getInstance\s*\(\s*(?:algorithm|algo|hashName)\s*\)'
        description: "Dynamic algorithm selection via variable (requires context)"
      - type: regex
        pattern: 'import\s+java\.security\.MessageDigest[\s\S]{0,500}(?:MD5|SHA-?1)'
        description: "MessageDigest import followed by weak algorithm usage"
    anti_patterns:
      - 'Test\.java$'
      - 'Tests\.java$'
      - 'test/'
      - 'src/test/'
      - '@Test'
      - '//\s*NOSONAR'
      - '//\s*nosec'
      - 'checksum'
      - 'etag'
      - 'cacheKey'
      - 'fingerprint.*dedup'
      - '@Deprecated'
      - 'legacy'
      - '@SuppressWarnings'
      - 'migration'
    bypass_variants:
      - description: "Algorithm name from system property or config"
        pattern: 'MessageDigest\.getInstance\s*\(\s*(?:System\.getProperty|config\.get|props\.get)\s*\('
      - description: "Algorithm name stored in constant and referenced"
        pattern: '(?:static\s+)?final\s+String\s+\w+\s*=\s*"(?:MD5|SHA-?1)"[\s\S]{0,200}getInstance\s*\(\s*\w+\s*\)'
      - description: "Reflection-based MessageDigest instantiation"
        pattern: 'Class\.forName\s*\([^)]*MessageDigest[^)]*\)'
    evasion_indicators:
      - "Algorithm name loaded from properties file"
      - "Algorithm selected from enum or constant pool"
      - "Wrapper class abstracting MessageDigest API"
      - "Algorithm passed through dependency injection"
    encoding_variants:
      - type: "lowercase_algorithm"
        pattern: 'MessageDigest\.getInstance\s*\(\s*"(?:md5|sha-?1)"'
      - type: "mixed_case"
        pattern: 'MessageDigest\.getInstance\s*\(\s*"(?:Md5|Sha1)"'
      - type: "provider_specified"
        pattern: 'MessageDigest\.getInstance\s*\(\s*"(?:MD5|SHA-?1)"\s*,\s*"'
    multi_function_chain_patterns:
      - "MessageDigest.getInstance('MD5') -> update -> digest chain"
      - "DigestUtils.md5Hex -> token comparison"
      - "Mac.getInstance('HmacMD5') -> init -> doFinal"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "MD5/SHA1 collision attacks enable signature forgery, certificate manipulation, and integrity check bypasses in Java applications"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_input"
        sink: "hash_comparison"
        through: "MessageDigest.getInstance('MD5').digest()"
      - source: "password_parameter"
        sink: "database_storage"
        through: "DigestUtils.md5Hex(password)"
      - source: "request_body"
        sink: "token_validation"
        through: "Mac.getInstance('HmacSHA1')"
    impact: |
      Using MD5 or SHA-1 in Java applications creates severe security vulnerabilities:
      - MD5 collision generation is trivial (seconds on commodity hardware)
      - SHA-1 chosen-prefix collisions demonstrated by Shambles attack (2020)
      - Password hashes stored with MD5 are crackable at billions of attempts per second
      - Digital signatures using these algorithms are forgeable
      - Java Certificate validation with SHA-1 is deprecated since JDK 9
      - Non-compliance with NIST SP 800-131A, PCI-DSS 4.0, FIPS 140-3
    remediation: |
      Replace weak hashes with SHA-256+ or use proper password hashing:

      ```java
      // VULNERABLE: MD5 for hashing
      MessageDigest md = MessageDigest.getInstance("MD5");
      byte[] hash = md.digest(data.getBytes());

      // SECURE: SHA-256 for integrity checks
      MessageDigest md = MessageDigest.getInstance("SHA-256");
      byte[] hash = md.digest(data.getBytes(StandardCharsets.UTF_8));

      // SECURE: BCrypt for password hashing
      import org.mindrot.jbcrypt.BCrypt;
      String hashed = BCrypt.hashpw(password, BCrypt.gensalt(12));
      boolean valid = BCrypt.checkpw(password, hashed);

      // SECURE: HMAC-SHA256 for message authentication
      Mac mac = Mac.getInstance("HmacSHA256");
      mac.init(new SecretKeySpec(key, "HmacSHA256"));
      byte[] hmac = mac.doFinal(data.getBytes());
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/328.html"
      - "https://shattered.io/"
      - "https://sha-mbles.github.io/"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
    context_awareness:
      surrounding_context_patterns:
        - 'MessageDigest'
        - 'password'
        - 'token'
        - 'signature'
        - 'verify'
        - 'authenticate'
        - 'DigestUtils'
      taint_source_indicators:
        - 'request\.getParameter'
        - 'HttpServletRequest'
        - '@RequestBody'
        - 'Scanner'
        - 'BufferedReader'
      taint_sink_indicators:
        - '\.digest\('
        - '\.doFinal\('
        - 'PreparedStatement'
        - 'session\.setAttribute'
        - 'response\.addCookie'
      sanitization_patterns:
        - 'SHA-256'
        - 'SHA-384'
        - 'SHA-512'
        - 'SHA3-'
        - 'BCrypt'
        - 'Argon2'
        - 'PBKDF2'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + business_impact_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker targets a Spring Boot application using MD5 for password storage:
        1. Attacker exploits SQL injection to extract user table with MD5 password hashes
        2. Using hashcat in MD5 mode (mode 0), attacker cracks hashes at 25 billion/sec
        3. Over 90% of passwords recovered within hours using wordlists and rules
        4. Attacker uses recovered admin credentials to access the admin panel
        5. From admin panel, attacker pivots to internal systems via SSRF
      example_payload: "MessageDigest.getInstance(\"MD5\").digest(password.getBytes())"
      attacker_objective: "Crack weak MD5/SHA1 password hashes or forge digital signatures to bypass authentication"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JAVA-002"
        - "CRYPTO-JAVA-003"
        - "CRYPTO-JAVA-005"

  - rule_id: "CRYPTO-JAVA-002"
    title: "Weak Cipher Algorithm (DES/RC4/ECB Mode)"
    description: >
      Detects usage of weak or broken cipher algorithms and insecure cipher modes in Java
      applications. This includes DES (56-bit key), DESede/3DES (vulnerable to Sweet32),
      RC4/ARCFOUR (biased keystream), Blowfish (64-bit block), and any cipher in ECB mode.
      Java's Cipher.getInstance() transformation string format "Algorithm/Mode/Padding"
      makes these detectable. The default transformation for some algorithms in certain JCE
      providers may default to ECB mode, making explicit mode specification critical.
    language: java
    category: crypto
    severity: High
    confidence: 0.94
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-cipher
      - des
      - rc4
      - ecb
      - symmetric-encryption
      - java
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'Cipher\.getInstance\s*\(\s*"(?:DES|DESede)(?:/[^"]*)?"\s*\)'
        description: "Cipher.getInstance with DES or Triple DES"
      - type: regex
        pattern: 'Cipher\.getInstance\s*\(\s*"(?:RC4|ARCFOUR|ARC4)"\s*\)'
        description: "Cipher.getInstance with RC4/ARCFOUR"
      - type: regex
        pattern: 'Cipher\.getInstance\s*\(\s*"(?:AES|DES|DESede|Blowfish|Camellia)/ECB/'
        description: "Any cipher algorithm in ECB mode"
      - type: regex
        pattern: 'Cipher\.getInstance\s*\(\s*"AES"\s*\)'
        description: "AES without explicit mode (defaults to ECB in many providers)"
      - type: regex
        pattern: 'Cipher\.getInstance\s*\(\s*"Blowfish(?:/[^"]*)?"\s*\)'
        description: "Blowfish cipher (64-bit block size)"
      - type: regex
        pattern: 'Cipher\.getInstance\s*\(\s*"(?:RC2|IDEA|SEED)(?:/[^"]*)?"\s*\)'
        description: "Other deprecated cipher algorithms"
      - type: regex
        pattern: 'KeyGenerator\.getInstance\s*\(\s*"(?:DES|DESede|RC4|Blowfish|RC2)"\s*\)'
        description: "Key generation for weak cipher algorithm"
      - type: regex
        pattern: 'SecretKeyFactory\.getInstance\s*\(\s*"DES"\s*\)'
        description: "SecretKeyFactory for DES key generation"
    anti_patterns:
      - 'Test\.java$'
      - 'Tests\.java$'
      - 'test/'
      - 'src/test/'
      - '@Test'
      - '//\s*NOSONAR'
      - '//\s*nosec'
      - 'legacy'
      - 'migration'
      - 'backward.*compat'
      - 'decrypt.*only'
      - 'read.*only.*legacy'
      - '@Deprecated'
      - '@SuppressWarnings'
      - 'mock'
    bypass_variants:
      - description: "Transformation string built from constants or variables"
        pattern: 'Cipher\.getInstance\s*\(\s*(?:ALGORITHM|CIPHER_SUITE|transformation)\s*\)'
      - description: "Transformation string concatenated from parts"
        pattern: 'Cipher\.getInstance\s*\(\s*\w+\s*\+\s*"/"\s*\+\s*\w+'
      - description: "Cipher algorithm from properties or Spring @Value"
        pattern: '@Value\s*\(\s*"[^"]*cipher[^"]*"\s*\)\s+(?:private\s+)?String\s+\w+'
    evasion_indicators:
      - "Cipher transformation loaded from properties file"
      - "Algorithm name injected via Spring configuration"
      - "Factory pattern hiding cipher selection"
      - "Transformation string built dynamically"
    encoding_variants:
      - type: "variable_transformation"
        pattern: 'static\s+final\s+String\s+\w+\s*=\s*"(?:DES|RC4|AES/ECB)'
      - type: "properties_config"
        pattern: 'cipher\.algorithm\s*=\s*(?:DES|RC4|AES/ECB)'
      - type: "spring_value"
        pattern: '@Value.*cipher.*\)[\s\S]{0,50}String\s+\w+Algorithm'
    multi_function_chain_patterns:
      - "Cipher.getInstance('DES') -> init -> doFinal encryption chain"
      - "KeyGenerator.getInstance('DES') -> generateKey -> Cipher.init"
      - "Cipher.getInstance('AES') [ECB default] -> update -> doFinal"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Weak ciphers allow brute-force key recovery and ciphertext decryption; ECB mode leaks plaintext patterns"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_data"
        sink: "cipher_doFinal"
        through: "Cipher.getInstance('DES').init()"
      - source: "sensitive_field"
        sink: "database_column"
        through: "DES_encryption"
      - source: "api_payload"
        sink: "encrypted_response"
        through: "AES_ECB_encryption"
    impact: |
      Weak cipher algorithms and ECB mode create exploitable encryption:
      - DES 56-bit key brute-forceable in hours on FPGA clusters
      - 3DES/DESede vulnerable to Sweet32 birthday attack after ~32GB of data
      - RC4/ARCFOUR keystream biases enable plaintext recovery
      - ECB mode leaks plaintext patterns (identical blocks produce identical output)
      - AES without explicit mode defaults to ECB in SunJCE provider
      - Blowfish 64-bit blocks enable birthday attacks similar to Sweet32
      - Non-compliance with PCI-DSS 4.0, NIST SP 800-131A, FIPS 140-3
    remediation: |
      Replace with AES-256/GCM or ChaCha20-Poly1305:

      ```java
      // VULNERABLE: DES cipher
      Cipher cipher = Cipher.getInstance("DES");

      // VULNERABLE: AES defaulting to ECB
      Cipher cipher = Cipher.getInstance("AES");

      // SECURE: AES-256/GCM (authenticated encryption)
      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
      SecureRandom random = new SecureRandom();
      byte[] iv = new byte[12]; // 96-bit IV for GCM
      random.nextBytes(iv);
      GCMParameterSpec spec = new GCMParameterSpec(128, iv); // 128-bit auth tag
      cipher.init(Cipher.ENCRYPT_MODE, secretKey, spec);
      byte[] ciphertext = cipher.doFinal(plaintext);

      // SECURE: ChaCha20-Poly1305 (Java 11+)
      Cipher cipher = Cipher.getInstance("ChaCha20-Poly1305");
      byte[] nonce = new byte[12];
      random.nextBytes(nonce);
      cipher.init(Cipher.ENCRYPT_MODE, secretKey,
                  new IvParameterSpec(nonce));
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://sweet32.info/"
      - "https://docs.oracle.com/en/java/javase/17/security/java-cryptography-architecture-jca-reference-guide.html"
      - "https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final"
    context_awareness:
      surrounding_context_patterns:
        - 'Cipher'
        - 'encrypt'
        - 'decrypt'
        - 'KeyGenerator'
        - 'SecretKey'
        - 'doFinal'
        - 'init'
      taint_source_indicators:
        - 'request\.getParameter'
        - '@RequestBody'
        - 'InputStream'
        - 'BufferedReader'
      taint_sink_indicators:
        - '\.doFinal\('
        - '\.update\('
        - 'OutputStream'
        - 'PreparedStatement'
        - 'response\.getWriter'
      sanitization_patterns:
        - 'AES/GCM/NoPadding'
        - 'AES/CCM/NoPadding'
        - 'ChaCha20-Poly1305'
        - 'AES/CTR'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + cipher_weakness_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits DES encryption in a Java enterprise application:
        1. Attacker identifies DES-encrypted data in intercepted API responses
        2. Block size analysis confirms 64-bit (8-byte) DES blocks
        3. Attacker uses FPGA-based DES cracker to exhaustively search the 56-bit keyspace
        4. Key recovered in approximately 12 hours
        5. Attacker decrypts all historical and current encrypted communications
        6. Extracted data includes PII, financial records, and internal API credentials
      example_payload: "Cipher.getInstance(\"DES/ECB/PKCS5Padding\")"
      attacker_objective: "Brute-force weak cipher keys or exploit ECB mode patterns to access encrypted data"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-JAVA-001"
        - "CRYPTO-JAVA-003"
        - "CRYPTO-JAVA-005"
        - "CRYPTO-JAVA-006"

  - rule_id: "CRYPTO-JAVA-003"
    title: "Hardcoded SecretKeySpec or Encryption Key"
    description: >
      Detects hardcoded cryptographic keys in Java source code, particularly through
      SecretKeySpec constructor with literal byte arrays or strings, hardcoded key constants,
      and direct key material in initialization code. This is pervasive in Java enterprise
      applications where developers embed keys in configuration classes, utility classes,
      or Spring @Value defaults. Hardcoded keys in compiled .class files are trivially
      extractable through Java decompilation tools (JD-GUI, CFR, Procyon).
    language: java
    category: crypto
    severity: Critical
    confidence: 0.89
    cwe: CWE-798
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - hardcoded-key
      - secret-management
      - SecretKeySpec
      - credential-exposure
      - java
    detection_layer: 2
    attack_surface_type: "internal"
    patterns:
      - type: regex
        pattern: 'new\s+SecretKeySpec\s*\(\s*"[^"]{8,}"\.getBytes\s*\('
        description: "SecretKeySpec from hardcoded string.getBytes()"
      - type: regex
        pattern: 'new\s+SecretKeySpec\s*\(\s*new\s+byte\s*\[\s*\]\s*\{[^}]+\}'
        description: "SecretKeySpec from hardcoded byte array literal"
      - type: regex
        pattern: '(?:ENCRYPTION_KEY|SECRET_KEY|AES_KEY|CIPHER_KEY|HMAC_KEY)\s*=\s*"[^"]{8,}"'
        description: "Constant with crypto-related name assigned hardcoded string"
      - type: regex
        pattern: 'private\s+(?:static\s+)?(?:final\s+)?(?:byte\s*\[\s*\]|String)\s+\w*[Kk]ey\w*\s*=\s*(?:new\s+byte\s*\[\s*\]|"[^"]{8,}")'
        description: "Private key field with hardcoded value"
      - type: regex
        pattern: 'SecretKeySpec\s*\(\s*(?:Hex|Base64)\.decode(?:Hex)?\s*\(\s*"[^"]{16,}"'
        description: "SecretKeySpec from hardcoded hex/base64 decoded string"
      - type: regex
        pattern: 'new\s+IvParameterSpec\s*\(\s*"[^"]{8,}"\.getBytes'
        description: "Hardcoded IV in IvParameterSpec (also indicates poor key management)"
      - type: regex
        pattern: 'DatatypeConverter\.parseHexBinary\s*\(\s*"[0-9a-fA-F]{16,}"\s*\)[\s\S]{0,80}SecretKeySpec'
        description: "Hardcoded hex key parsed for SecretKeySpec"
      - type: regex
        pattern: 'final\s+String\s+\w*(?:secret|key|password|passphrase)\w*\s*=\s*"[^"]{8,}"'
        description: "Final String field with hardcoded secret value"
    anti_patterns:
      - 'Test\.java$'
      - 'Tests\.java$'
      - 'test/'
      - 'src/test/'
      - '@Test'
      - '//\s*NOSONAR'
      - '//\s*nosec'
      - 'System\.getenv'
      - 'System\.getProperty'
      - 'vault'
      - 'KeyVault'
      - 'KMS'
      - 'CHANGEME'
      - 'placeholder'
      - 'TODO.*replace'
    bypass_variants:
      - description: "Key characters split across multiple string concatenations"
        pattern: '(?:key|secret)\s*=\s*"[^"]+"\s*\+\s*"[^"]+"'
      - description: "Key loaded from properties with hardcoded fallback"
        pattern: '\.getProperty\s*\(\s*"[^"]*key[^"]*"\s*,\s*"[^"]{8,}"\s*\)'
      - description: "Key encoded as char array and converted"
        pattern: 'new\s+String\s*\(\s*new\s+char\s*\[\s*\]\s*\{[^}]+\}\s*\)'
    evasion_indicators:
      - "Key split across multiple concatenated strings"
      - "Key stored as char array instead of String"
      - "Key loaded from resource bundle with hardcoded values"
      - "Key embedded in base64 string constant"
    encoding_variants:
      - type: "base64_encoded"
        pattern: 'Base64\.getDecoder\(\)\.decode\s*\(\s*"[A-Za-z0-9+/=]{16,}"'
      - type: "hex_encoded"
        pattern: 'DatatypeConverter\.parseHexBinary\s*\(\s*"[0-9a-fA-F]{16,}"'
      - type: "char_array"
        pattern: 'new\s+char\s*\[\s*\]\s*\{\s*(?:''[^'']''\s*,\s*){7,}'
    multi_function_chain_patterns:
      - "Hardcoded string -> getBytes -> SecretKeySpec -> Cipher.init"
      - "Base64.decode(literal) -> SecretKeySpec -> Mac.init"
      - "Constant key field -> KeyGenerator seed -> encryption operation"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Hardcoded keys in Java .class files are trivially extractable via decompilation, compromising all encrypted data across deployments"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "string_literal"
        sink: "SecretKeySpec_constructor"
        through: "getBytes()"
      - source: "byte_array_literal"
        sink: "Cipher_init"
        through: "SecretKeySpec"
      - source: "constant_field"
        sink: "Mac_init"
        through: "field_reference"
    impact: |
      Hardcoded keys in Java applications create catastrophic vulnerabilities:
      - Java .class and .jar files are trivially decompilable (JD-GUI, CFR, Procyon)
      - Keys embedded in Docker images are extractable from image layers
      - Keys in version control persist forever in commit history
      - All environments share the same key, so dev/staging compromise affects production
      - Key rotation requires code changes, rebuild, and redeployment
      - Violates PCI-DSS 3.5, NIST SP 800-57, SOC2 CC6.1, HIPAA technical safeguards
    remediation: |
      Use secure key management services:

      ```java
      // VULNERABLE: Hardcoded key
      SecretKeySpec key = new SecretKeySpec(
          "MySecretKey12345".getBytes(), "AES");

      // SECURE: Load from environment variable
      String keyHex = System.getenv("ENCRYPTION_KEY");
      byte[] keyBytes = DatatypeConverter.parseHexBinary(keyHex);
      SecretKeySpec key = new SecretKeySpec(keyBytes, "AES");

      // SECURE: Use Java KeyStore
      KeyStore ks = KeyStore.getInstance("JCEKS");
      ks.load(new FileInputStream(keystorePath), keystorePassword);
      SecretKey key = (SecretKey) ks.getKey("mykey", keyPassword);

      // SECURE: Use AWS KMS
      AWSKMS kmsClient = AWSKMSClientBuilder.defaultClient();
      DecryptRequest req = new DecryptRequest()
          .withCiphertextBlob(ByteBuffer.wrap(encryptedKey));
      byte[] key = kmsClient.decrypt(req).getPlaintext().array();

      // SECURE: Use HashiCorp Vault
      VaultTemplate vault = new VaultTemplate(vaultEndpoint, tokenAuth);
      String key = vault.read("secret/data/encryption")
          .getData().get("key").toString();
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html"
      - "https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final"
      - "https://docs.oracle.com/en/java/javase/17/security/java-cryptography-architecture-jca-reference-guide.html"
    context_awareness:
      surrounding_context_patterns:
        - 'SecretKeySpec'
        - 'Cipher'
        - 'encrypt'
        - 'decrypt'
        - 'Mac'
        - 'HMAC'
        - 'KeyGenerator'
      taint_source_indicators:
        - 'String\s+\w*key'
        - 'byte\[\]\s+\w*key'
        - 'final.*KEY'
        - 'static.*SECRET'
      taint_sink_indicators:
        - 'Cipher\.init'
        - 'Mac\.init'
        - 'KeyAgreement'
        - 'Signature\.init'
      sanitization_patterns:
        - 'System\.getenv'
        - 'System\.getProperty'
        - 'KeyStore'
        - 'vault'
        - 'KMS'
        - 'SecureRandom'
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + exposure_surface_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker decompiles a Java Spring Boot application:
        1. Attacker downloads the .jar file from an exposed Actuator endpoint or Docker registry
        2. Using JD-GUI decompiler, attacker extracts all .class files to readable Java source
        3. Searching for SecretKeySpec reveals AES key hardcoded in EncryptionService.class
        4. Attacker uses the key to decrypt sensitive database fields (SSN, credit cards)
        5. Attacker also discovers JWT signing key enabling admin token forgery
        6. Attacker accesses all application endpoints with forged admin JWT
      example_payload: "new SecretKeySpec(\"ThisIsMySecretKey\".getBytes(\"UTF-8\"), \"AES\")"
      attacker_objective: "Extract hardcoded encryption keys from compiled Java bytecode to decrypt all protected data"
