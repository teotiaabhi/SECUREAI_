rules:
  - rule_id: "CRYPTO-PHP-001"
    title: "md5/sha1 Used for Password Hashing"
    description: >
      Detects usage of PHP's md5() and sha1() functions for password hashing or security-sensitive
      operations. PHP's built-in md5() and sha1() functions return fast, unsalted hashes that
      are trivially crackable. PHP provides password_hash() with bcrypt/argon2 specifically
      for password storage. Despite being deprecated for security use, md5() and sha1() remain
      extremely common in legacy PHP applications and WordPress plugins.
    language: php
    category: crypto
    severity: High
    confidence: 0.92
    cwe: CWE-328
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-hash
      - md5
      - sha1
      - password-hashing
      - php
    detection_layer: 1
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'md5\s*\(\s*\$(?:pass(?:word)?|passwd|secret|token|key|pin)'
        description: "md5() applied to password/secret variable"
      - type: regex
        pattern: 'sha1\s*\(\s*\$(?:pass(?:word)?|passwd|secret|token|key|pin)'
        description: "sha1() applied to password/secret variable"
      - type: regex
        pattern: 'md5\s*\(\s*\$_(?:POST|GET|REQUEST)\s*\[\s*[''"](?:pass(?:word)?|passwd|secret)[''"]'
        description: "md5() on user-supplied password from superglobal"
      - type: regex
        pattern: 'sha1\s*\(\s*\$_(?:POST|GET|REQUEST)\s*\[\s*[''"](?:pass(?:word)?|passwd|secret)[''"]'
        description: "sha1() on user-supplied password from superglobal"
      - type: regex
        pattern: 'hash\s*\(\s*[''"](?:md5|sha1)[''"]'
        description: "hash() function with weak algorithm parameter"
      - type: regex
        pattern: 'hash_hmac\s*\(\s*[''"](?:md5|sha1)[''"]'
        description: "hash_hmac() with weak hash algorithm"
      - type: regex
        pattern: 'crypt\s*\(\s*\$(?:pass(?:word)?|passwd)\s*,\s*[''"][^$]'
        description: "crypt() with non-bcrypt salt (DES/MD5 crypt)"
      - type: regex
        pattern: '(?:WHERE|where)[\s\S]{0,80}(?:md5|sha1)\s*\(\s*\$'
        description: "md5/sha1 hash comparison in SQL query"
    anti_patterns:
      - 'Test\.php$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#\s*nosec'
      - 'checksum'
      - 'etag'
      - 'cache_key'
      - 'file.*integrity'
      - 'legacy'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'password_hash'
    bypass_variants:
      - description: "Hash function name stored in variable"
        pattern: '\$(?:algo|hash_func|method)\s*=\s*[''"](?:md5|sha1)[''"][\s\S]{0,100}\$\w+\s*\(\s*\$'
      - description: "Double hashing to obscure weak algorithm"
        pattern: 'md5\s*\(\s*md5\s*\(\s*\$'
      - description: "Hash algorithm called via variable function"
        pattern: '\$(?:hash_function|algo)\s*\(\s*\$(?:pass|password|secret)'
    evasion_indicators:
      - "Hash function name stored in variable"
      - "Multiple iterations of weak hash (e.g., md5(md5()))"
      - "Variable function call hiding hash algorithm"
      - "Hash function wrapped in utility class method"
    encoding_variants:
      - type: "call_user_func"
        pattern: 'call_user_func\s*\(\s*[''"](?:md5|sha1)[''"]'
      - type: "variable_function"
        pattern: '\$func\s*=\s*[''"](?:md5|sha1)[''"][\s\S]{0,50}\$func\s*\('
      - type: "hash_function"
        pattern: 'hash\s*\(\s*[''"]md5[''"][\s\S]{0,50}password'
    multi_function_chain_patterns:
      - "md5(password) -> SQL INSERT for user registration"
      - "sha1(salt . password) -> database comparison for login"
      - "hash_hmac('md5', token, secret) -> session validation"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "MD5/SHA1 password hashes are crackable in seconds, enabling mass account takeover"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "$_POST['password']"
        sink: "database_insert"
        through: "md5(password)"
      - source: "$_REQUEST['token']"
        sink: "session_comparison"
        through: "sha1(token)"
      - source: "user_input"
        sink: "cookie_value"
        through: "md5(secret.input)"
    impact: |
      Using md5/sha1 for password hashing in PHP applications is critically dangerous:
      - MD5 hashes crackable at 25+ billion/sec on modern GPUs
      - SHA1 hashes crackable at 10+ billion/sec on modern GPUs
      - Rainbow tables for common passwords are freely available
      - No salt protection means identical passwords produce identical hashes
      - WordPress and legacy PHP applications frequently contain this vulnerability
      - Violates OWASP password storage guidelines, PCI-DSS, HIPAA
    remediation: |
      Use password_hash() with PASSWORD_ARGON2ID or PASSWORD_BCRYPT:

      ```php
      // VULNERABLE: MD5 password hashing
      $hash = md5($password);
      $sql = "INSERT INTO users (password) VALUES ('$hash')";

      // SECURE: password_hash with Argon2id (PHP 7.3+)
      $hash = password_hash($password, PASSWORD_ARGON2ID, [
          'memory_cost' => 65536,
          'time_cost' => 4,
          'threads' => 3,
      ]);

      // SECURE: password_hash with bcrypt
      $hash = password_hash($password, PASSWORD_BCRYPT, [
          'cost' => 12,
      ]);

      // SECURE: Verify password
      if (password_verify($password, $storedHash)) {
          // Password is correct
          // Check if rehash is needed
          if (password_needs_rehash($storedHash, PASSWORD_ARGON2ID)) {
              $newHash = password_hash($password, PASSWORD_ARGON2ID);
              // Update hash in database
          }
      }
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/328.html"
      - "https://www.php.net/manual/en/function.password-hash.php"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
      - "https://php.watch/articles/php-password-hashing"
    context_awareness:
      surrounding_context_patterns:
        - 'password'
        - 'login'
        - 'authenticate'
        - 'register'
        - 'token'
        - 'session'
        - 'verify'
      taint_source_indicators:
        - '$_POST'
        - '$_GET'
        - '$_REQUEST'
        - '$_COOKIE'
        - 'file_get_contents'
      taint_sink_indicators:
        - 'mysql_query'
        - 'mysqli_query'
        - '$pdo->prepare'
        - '$stmt->execute'
        - 'setcookie'
      sanitization_patterns:
        - 'password_hash'
        - 'password_verify'
        - 'PASSWORD_BCRYPT'
        - 'PASSWORD_ARGON2'
        - 'sodium_crypto_pwhash'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + password_volume_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits MD5 password hashing in a PHP e-commerce application:
        1. Attacker exploits SQL injection to dump the users table
        2. Password column contains unsalted MD5 hashes
        3. Using hashcat with rockyou.txt, attacker cracks 85% of passwords in minutes
        4. Attacker logs in as admin using recovered credentials
        5. Attacker modifies payment processing to redirect funds
        6. Credential stuffing against other services with recovered passwords
      example_payload: "$hash = md5($_POST['password']); $db->query(\"SELECT * FROM users WHERE password='$hash'\");"
      attacker_objective: "Crack MD5/SHA1 password hashes to recover plaintext credentials for mass account takeover"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PHP-002"
        - "CRYPTO-PHP-003"
        - "CRYPTO-PHP-006"

  - rule_id: "CRYPTO-PHP-002"
    title: "mcrypt Weak Cipher Usage"
    description: >
      Detects usage of PHP's deprecated mcrypt extension with weak cipher algorithms. The
      mcrypt extension was deprecated in PHP 7.1 and removed in PHP 7.2. It supports many
      weak algorithms including DES, 3DES, RC2, RC4, and Blowfish. Even when used with AES
      (Rijndael), mcrypt's API encourages insecure patterns such as ECB mode and zero-padding.
      Applications still using mcrypt are running outdated PHP versions with unpatched
      security vulnerabilities.
    language: php
    category: crypto
    severity: High
    confidence: 0.93
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-cipher
      - mcrypt
      - deprecated
      - des
      - php
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'mcrypt_encrypt\s*\('
        description: "mcrypt_encrypt function call (deprecated)"
      - type: regex
        pattern: 'mcrypt_decrypt\s*\('
        description: "mcrypt_decrypt function call (deprecated)"
      - type: regex
        pattern: 'mcrypt_module_open\s*\('
        description: "mcrypt_module_open function call (deprecated)"
      - type: regex
        pattern: 'MCRYPT_(?:DES|3DES|TRIPLEDES|RC2|RC4|BLOWFISH|CAST_128|CAST_256)'
        description: "mcrypt weak algorithm constant"
      - type: regex
        pattern: 'MCRYPT_MODE_ECB'
        description: "mcrypt ECB mode constant"
      - type: regex
        pattern: 'mcrypt_create_iv\s*\([^,]*,\s*MCRYPT_RAND\s*\)'
        description: "mcrypt IV created with non-cryptographic MCRYPT_RAND"
      - type: regex
        pattern: 'MCRYPT_RIJNDAEL_(?:128|192|256)[\s\S]{0,100}MCRYPT_MODE_ECB'
        description: "AES via mcrypt in ECB mode"
      - type: regex
        pattern: 'mcrypt_(?:generic|generic_init|cbc|cfb|ecb|ofb)\s*\('
        description: "Other mcrypt function calls"
    anti_patterns:
      - 'Test\.php$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#\s*nosec'
      - 'migration'
      - 'legacy.*wrapper'
      - 'decrypt.*only'
      - 'backward.*compat'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - '@deprecated'
      - 'openssl_encrypt'
    bypass_variants:
      - description: "mcrypt function called via variable"
        pattern: '\$func\s*=\s*[''"]mcrypt_encrypt[''"][\s\S]{0,50}\$func\s*\('
      - description: "mcrypt wrapped in compatibility class"
        pattern: 'class\s+\w*[Cc]rypt\w*[\s\S]{0,500}mcrypt_'
      - description: "call_user_func for mcrypt functions"
        pattern: 'call_user_func\s*\(\s*[''"]mcrypt_'
    evasion_indicators:
      - "mcrypt functions called via variable function names"
      - "Wrapper class abstracting mcrypt API"
      - "call_user_func or call_user_func_array for mcrypt"
      - "mcrypt loaded conditionally via extension_loaded check"
    encoding_variants:
      - type: "constant_variable"
        pattern: '\$algo\s*=\s*MCRYPT_(?:DES|BLOWFISH|RC4)'
      - type: "string_algorithm"
        pattern: 'mcrypt_encrypt\s*\(\s*[''"](?:des|blowfish|rc4|3des)[''"]'
      - type: "mode_variable"
        pattern: '\$mode\s*=\s*[''"]ecb[''"]'
    multi_function_chain_patterns:
      - "mcrypt_module_open -> mcrypt_generic_init -> mcrypt_generic"
      - "mcrypt_create_iv(MCRYPT_RAND) -> mcrypt_encrypt(MCRYPT_DES)"
      - "mcrypt_encrypt(MCRYPT_RIJNDAEL_128, key, data, MCRYPT_MODE_ECB)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "mcrypt with weak algorithms and ECB mode enables brute-force key recovery and pattern analysis of encrypted data"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_data"
        sink: "encrypted_storage"
        through: "mcrypt_encrypt(MCRYPT_DES)"
      - source: "sensitive_field"
        sink: "database_column"
        through: "mcrypt_encrypt(ECB)"
      - source: "api_payload"
        sink: "encrypted_response"
        through: "mcrypt_encrypt(MCRYPT_BLOWFISH)"
    impact: |
      mcrypt usage creates multiple security vulnerabilities:
      - Deprecated since PHP 7.1, removed in 7.2 (running on unsupported PHP)
      - DES brute-forceable in hours; 3DES vulnerable to Sweet32
      - RC4 has known keystream biases enabling plaintext recovery
      - ECB mode leaks patterns in plaintext
      - MCRYPT_RAND uses non-cryptographic random for IVs
      - mcrypt zero-pads data instead of using PKCS#7 padding
      - Applications using mcrypt likely have other unpatched vulnerabilities
    remediation: |
      Migrate from mcrypt to openssl_encrypt or sodium:

      ```php
      // VULNERABLE: mcrypt with DES
      $encrypted = mcrypt_encrypt(
          MCRYPT_DES, $key, $data, MCRYPT_MODE_ECB
      );

      // SECURE: openssl_encrypt with AES-256-GCM
      $key = random_bytes(32); // 256-bit key
      $iv = random_bytes(openssl_cipher_iv_length('aes-256-gcm'));
      $encrypted = openssl_encrypt(
          $data, 'aes-256-gcm', $key, OPENSSL_RAW_DATA, $iv, $tag
      );
      // Store: $iv . $tag . $encrypted

      // SECURE: Sodium (libsodium) authenticated encryption
      $key = sodium_crypto_secretbox_keygen();
      $nonce = random_bytes(SODIUM_CRYPTO_SECRETBOX_NONCEBYTES);
      $encrypted = sodium_crypto_secretbox($data, $nonce, $key);
      // Store: $nonce . $encrypted
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://www.php.net/manual/en/migration71.deprecated.php"
      - "https://www.php.net/manual/en/function.openssl-encrypt.php"
      - "https://paragonie.com/blog/2015/05/if-you-re-typing-word-mcrypt-into-your-code-you-re-doing-it-wrong"
    context_awareness:
      surrounding_context_patterns:
        - 'mcrypt'
        - 'encrypt'
        - 'decrypt'
        - 'MCRYPT_'
        - 'cipher'
        - 'secret'
      taint_source_indicators:
        - '$_POST'
        - '$_GET'
        - '$_REQUEST'
        - 'file_get_contents'
      taint_sink_indicators:
        - 'mysql_query'
        - 'file_put_contents'
        - 'echo'
        - 'print'
        - '$stmt'
      sanitization_patterns:
        - 'openssl_encrypt'
        - 'sodium_crypto_secretbox'
        - 'aes-256-gcm'
        - 'sodium_crypto_aead'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + deprecation_risk_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker targets a PHP application using mcrypt with DES:
        1. Application uses mcrypt_encrypt(MCRYPT_DES, key, data, MCRYPT_MODE_ECB)
        2. Attacker intercepts encrypted API tokens from network traffic
        3. DES 56-bit key brute-forced using FPGA in under 24 hours
        4. ECB mode allows pattern analysis even before full key recovery
        5. Attacker decrypts all tokens and extracts user session data
        6. Since PHP version supports mcrypt, it likely has other CVEs to exploit
      example_payload: "mcrypt_encrypt(MCRYPT_DES, $key, $sensitive_data, MCRYPT_MODE_ECB)"
      attacker_objective: "Exploit deprecated mcrypt with weak algorithms to decrypt protected data"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PHP-001"
        - "CRYPTO-PHP-003"
        - "CRYPTO-PHP-005"
        - "CRYPTO-PHP-006"

  - rule_id: "CRYPTO-PHP-003"
    title: "Hardcoded Encryption Keys in PHP Code"
    description: >
      Detects hardcoded cryptographic keys, secrets, and passwords embedded in PHP source code.
      PHP applications frequently contain hardcoded keys in configuration files, class constants,
      and define() statements. These are extractable through source code access, version
      control leaks, LFI vulnerabilities, and PHP source disclosure bugs. PHP's interpreted
      nature means keys exist as plaintext strings in source files, and misconfigured servers
      may serve .php files as plaintext.
    language: php
    category: crypto
    severity: Critical
    confidence: 0.88
    cwe: CWE-798
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - hardcoded-key
      - secret-management
      - credential-exposure
      - php
    detection_layer: 2
    attack_surface_type: "internal"
    patterns:
      - type: regex
        pattern: 'define\s*\(\s*[''"](?:ENCRYPTION_KEY|SECRET_KEY|AES_KEY|CIPHER_KEY|HMAC_KEY|APP_KEY)[''"][\s]*,[\s]*[''"][^''"]{16,}[''"]'
        description: "define() with crypto-related constant name and hardcoded value"
      - type: regex
        pattern: '(?:encryption_key|secret_key|aes_key|cipher_key)\s*[''"]?\s*(?:=>|=)\s*[''"][A-Za-z0-9+/=]{16,}[''"]'
        description: "Array key or variable with crypto name and hardcoded value"
      - type: regex
        pattern: 'openssl_encrypt\s*\([^,]+,\s*[^,]+,\s*[''"][^''"]{16,}[''"]'
        description: "Hardcoded key in openssl_encrypt third parameter"
      - type: regex
        pattern: 'openssl_decrypt\s*\([^,]+,\s*[^,]+,\s*[''"][^''"]{16,}[''"]'
        description: "Hardcoded key in openssl_decrypt third parameter"
      - type: regex
        pattern: 'const\s+(?:ENCRYPTION_KEY|SECRET_KEY|AES_KEY|CIPHER_KEY)\s*=\s*[''"][^''"]{16,}[''"]'
        description: "Class constant with crypto name and hardcoded value"
      - type: regex
        pattern: 'private\s+(?:static\s+)?\$\w*(?:key|secret|password)\w*\s*=\s*[''"][^''"]{16,}[''"]'
        description: "Private property with crypto-related name and hardcoded value"
      - type: regex
        pattern: 'hash_hmac\s*\(\s*[^,]+,\s*[^,]+,\s*[''"][^''"]{16,}[''"]'
        description: "Hardcoded HMAC key in hash_hmac"
      - type: regex
        pattern: 'sodium_crypto_secretbox\s*\([^,]+,\s*[^,]+,\s*[''"][^''"]{16,}[''"]'
        description: "Hardcoded key in sodium_crypto_secretbox"
    anti_patterns:
      - 'Test\.php$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#\s*nosec'
      - 'getenv\s*\('
      - '\$_ENV'
      - '\$_SERVER'
      - 'vault'
      - 'aws.*kms'
      - 'CHANGEME'
      - 'placeholder'
      - 'TODO.*replace'
      - 'example'
      - 'env\s*\('
    bypass_variants:
      - description: "Key loaded from config with hardcoded fallback"
        pattern: '(?:getenv|env)\s*\(\s*[^)]+\)\s*(?:\?\?|:\s*)\s*[''"][^''"]{16,}[''"]'
      - description: "Key split across concatenated strings"
        pattern: '(?:key|secret)\s*=\s*[''"][^''"]+[''"][\s]*\.[\s]*[''"][^''"]+[''"]'
      - description: "Key base64-decoded from hardcoded string"
        pattern: 'base64_decode\s*\(\s*[''"][A-Za-z0-9+/=]{16,}[''"]'
    evasion_indicators:
      - "Key embedded in config.php included at runtime"
      - "Key split across string concatenations"
      - "Key base64-encoded in source and decoded before use"
      - "Key stored in separate constants file"
    encoding_variants:
      - type: "base64_encoded"
        pattern: 'base64_decode\s*\(\s*[''"][A-Za-z0-9+/=]{20,}[''"]'
      - type: "hex_encoded"
        pattern: 'hex2bin\s*\(\s*[''"][0-9a-fA-F]{32,}[''"]'
      - type: "packed_binary"
        pattern: 'pack\s*\(\s*[''"]H\*[''"][\s]*,[\s]*[''"][0-9a-fA-F]{32,}[''"]'
    multi_function_chain_patterns:
      - "define(KEY, 'hardcoded') -> openssl_encrypt(data, algo, KEY)"
      - "const SECRET = 'literal' -> hash_hmac('sha256', data, self::SECRET)"
      - "private $key = 'hardcoded' -> $this->encrypt($data)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Hardcoded PHP keys are exposed through source code leaks, LFI vulnerabilities, and server misconfigurations serving PHP as text"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "define_constant"
        sink: "openssl_encrypt_key"
        through: "constant_reference"
      - source: "class_constant"
        sink: "hash_hmac_key"
        through: "self_reference"
      - source: "property_literal"
        sink: "encryption_operation"
        through: "this_reference"
    impact: |
      Hardcoded keys in PHP are exceptionally dangerous due to PHP's characteristics:
      - PHP source is plaintext on the server, accessible via LFI or server misconfiguration
      - .php.bak, .php~, .php.swp files may contain keys and be served as plaintext
      - Version control (.git) directories exposed on web servers leak source code
      - Shared hosting environments may expose source to other tenants
      - Key rotation requires code changes across all deployment targets
      - Violates PCI-DSS 3.5, NIST SP 800-57, SOC2 CC6.1
    remediation: |
      Use environment variables or secrets management:

      ```php
      // VULNERABLE: Hardcoded key
      define('ENCRYPTION_KEY', 'my-secret-key-1234567890abcdef');
      $encrypted = openssl_encrypt($data, 'aes-256-gcm', ENCRYPTION_KEY);

      // SECURE: Load from environment variable
      $key = getenv('ENCRYPTION_KEY');
      if ($key === false || strlen($key) !== 64) {
          throw new RuntimeException('Invalid encryption key');
      }
      $key = hex2bin($key);

      // SECURE: Use .env file (not committed to VCS)
      $key = $_ENV['ENCRYPTION_KEY'] ?? null;

      // SECURE: Use AWS KMS
      $kmsClient = new KmsClient([...]);
      $result = $kmsClient->decrypt([
          'CiphertextBlob' => $encryptedKey,
      ]);
      $key = $result['Plaintext'];

      // SECURE: Use HashiCorp Vault
      $vault = new VaultClient($vaultAddr, $vaultToken);
      $secret = $vault->read('secret/data/encryption');
      $key = hex2bin($secret['data']['data']['key']);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final"
      - "https://www.php.net/manual/en/function.getenv.php"
    context_awareness:
      surrounding_context_patterns:
        - 'encrypt'
        - 'decrypt'
        - 'openssl_'
        - 'sodium_'
        - 'hash_hmac'
        - 'cipher'
        - 'token'
      taint_source_indicators:
        - 'define\('
        - 'const\s+'
        - 'private.*\$'
        - 'protected.*\$'
      taint_sink_indicators:
        - 'openssl_encrypt'
        - 'openssl_decrypt'
        - 'hash_hmac'
        - 'sodium_crypto'
        - 'mcrypt_encrypt'
      sanitization_patterns:
        - 'getenv'
        - '$_ENV'
        - 'env\('
        - 'vault'
        - 'kms'
        - 'random_bytes'
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + exposure_surface_modifier)"
