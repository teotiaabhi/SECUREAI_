  - rule_id: "CRYPTO-PHP-004"
    title: "rand()/mt_rand() Used for Security Token Generation"
    description: >
      Detects usage of PHP's rand(), mt_rand(), array_rand(), or shuffle() for generating
      security-sensitive values. mt_rand() uses the Mersenne Twister PRNG which is not
      cryptographically secure and its state can be recovered from 624 consecutive outputs.
      rand() may use an even weaker LCG on some platforms. PHP 7+ provides random_bytes()
      and random_int() which use the OS CSPRNG, and PHP 8.3 adds the Random\Randomizer class.
    language: php
    category: crypto
    severity: High
    confidence: 0.90
    cwe: CWE-338
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - weak-random
      - mersenne-twister
      - prng
      - token-generation
      - php
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: '(?:rand|mt_rand)\s*\([^)]*\)[\s\S]{0,80}(?:token|secret|key|password|nonce|salt|session|csrf|otp|pin)'
        description: "rand/mt_rand near security-sensitive variable names"
      - type: regex
        pattern: '(?:token|secret|key|password|nonce|salt|session|csrf|otp|pin)[\s\S]{0,80}(?:rand|mt_rand)\s*\('
        description: "Security-sensitive variable assigned using rand/mt_rand"
      - type: regex
        pattern: 'mt_rand\s*\(\s*\)[\s\S]{0,50}(?:base_convert|dechex|bin2hex|sprintf.*x)'
        description: "mt_rand converted to hex string for token generation"
      - type: regex
        pattern: 'for\s*\([^)]*\)\s*\{[\s\S]{0,100}(?:rand|mt_rand)\s*\([^)]*\)[\s\S]{0,100}(?:token|key|password|secret)'
        description: "Loop building security token from rand/mt_rand"
      - type: regex
        pattern: 'str_shuffle\s*\([^)]*\)[\s\S]{0,80}(?:password|token|key|secret)'
        description: "str_shuffle for password/token generation (not crypto-safe)"
      - type: regex
        pattern: 'array_rand\s*\([^)]*\)[\s\S]{0,80}(?:password|token|key|secret)'
        description: "array_rand for security-sensitive random selection"
      - type: regex
        pattern: 'uniqid\s*\([^)]*\)[\s\S]{0,80}(?:token|session|csrf|secret)'
        description: "uniqid() for security tokens (time-based, predictable)"
      - type: regex
        pattern: 'substr\s*\(\s*md5\s*\(\s*(?:rand|mt_rand|uniqid)\s*\('
        description: "MD5 of random/uniqid for token generation"
    anti_patterns:
      - 'Test\.php$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#\s*nosec'
      - 'display'
      - 'color'
      - 'position'
      - 'delay'
      - 'jitter'
      - 'game'
      - 'shuffle.*display'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'random_bytes'
    bypass_variants:
      - description: "mt_rand aliased or wrapped in function"
        pattern: 'function\s+\w*rand\w*\s*\([^)]*\)\s*\{[\s\S]{0,100}mt_rand'
      - description: "Multiple mt_rand calls combined for 'more randomness'"
        pattern: 'mt_rand\s*\([^)]*\)\s*\.\s*mt_rand\s*\('
      - description: "Seed set from time and used for tokens"
        pattern: 'mt_srand\s*\(\s*(?:time|microtime|hrtime)\s*\([^)]*\)\s*\)'
    evasion_indicators:
      - "mt_rand wrapped in utility function"
      - "Multiple weak random sources combined"
      - "Seed set from predictable time value"
      - "uniqid combined with mt_rand for 'uniqueness'"
    encoding_variants:
      - type: "combined_sources"
        pattern: 'md5\s*\(\s*uniqid\s*\(\s*mt_rand\s*\('
      - type: "string_building"
        pattern: 'chr\s*\(\s*(?:rand|mt_rand)\s*\('
      - type: "base_convert"
        pattern: 'base_convert\s*\(\s*(?:rand|mt_rand)\s*\('
    multi_function_chain_patterns:
      - "mt_rand in loop -> chr() -> concatenated token string"
      - "md5(uniqid(mt_rand(), true)) -> session token"
      - "substr(str_shuffle(chars), 0, length) -> password"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Predictable mt_rand output enables token prediction for session hijacking and CSRF bypass"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "mt_rand()"
        sink: "session_token"
        through: "hex_conversion"
      - source: "rand()"
        sink: "password_reset_link"
        through: "md5_hash"
      - source: "uniqid()"
        sink: "csrf_token"
        through: "concatenation"
    impact: |
      Using rand/mt_rand for security tokens in PHP is exploitable:
      - mt_rand Mersenne Twister state recoverable from 624 outputs
      - After state recovery, all future outputs are predictable
      - rand() on some platforms uses a 32-bit LCG (even weaker)
      - uniqid() is time-based and trivially predictable
      - Password reset tokens become guessable (account takeover)
      - CSRF tokens become predictable (protection bypass)
      - Session tokens can be predicted (session hijacking)
    remediation: |
      Use random_bytes() and random_int() for secure randomness:

      ```php
      // VULNERABLE: mt_rand for token generation
      $token = md5(uniqid(mt_rand(), true));

      // SECURE: random_bytes for tokens (PHP 7+)
      $token = bin2hex(random_bytes(32));

      // SECURE: random_int for OTP (PHP 7+)
      $otp = random_int(100000, 999999);

      // SECURE: Secure random string generation
      function generateSecureToken(int $length = 32): string {
          return bin2hex(random_bytes($length));
      }

      // SECURE: Secure random from character set
      function secureRandomString(int $length, string $chars): string {
          $result = '';
          $maxIndex = strlen($chars) - 1;
          for ($i = 0; $i < $length; $i++) {
              $result .= $chars[random_int(0, $maxIndex)];
          }
          return $result;
      }

      // SECURE: PHP 8.3+ Random\Randomizer
      $randomizer = new Random\Randomizer(new Random\Engine\Secure());
      $token = $randomizer->getBytesFromString(
          'abcdefghijklmnopqrstuvwxyz0123456789', 32
      );
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/338.html"
      - "https://www.php.net/manual/en/function.random-bytes.php"
      - "https://www.php.net/manual/en/function.random-int.php"
      - "https://www.openwall.com/php_mt_seed/"
    context_awareness:
      surrounding_context_patterns:
        - 'token'
        - 'session'
        - 'password'
        - 'key'
        - 'csrf'
        - 'nonce'
        - 'otp'
        - 'secret'
      taint_source_indicators:
        - 'mt_rand'
        - 'rand\('
        - 'array_rand'
        - 'uniqid'
        - 'str_shuffle'
      taint_sink_indicators:
        - 'setcookie'
        - 'session_id'
        - '$_SESSION'
        - 'header\('
        - 'mail\('
      sanitization_patterns:
        - 'random_bytes'
        - 'random_int'
        - 'openssl_random_pseudo_bytes'
        - 'sodium_randombytes'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + token_criticality_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits predictable password reset tokens:
        1. PHP application uses md5(uniqid(mt_rand(), true)) for reset tokens
        2. Attacker requests multiple reset tokens for their own account
        3. Using php_mt_seed tool, attacker recovers the mt_rand seed
        4. Attacker predicts the exact uniqid() value from server clock estimation
        5. Attacker triggers password reset for admin account
        6. Attacker submits the predicted token URL and resets admin password
      example_payload: "$token = md5(uniqid(mt_rand(), true));"
      attacker_objective: "Predict security tokens generated with mt_rand to hijack sessions or bypass authentication"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: false
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PHP-001"
        - "CRYPTO-PHP-003"

  - rule_id: "CRYPTO-PHP-005"
    title: "Weak openssl_encrypt Parameters"
    description: >
      Detects insecure parameter usage in PHP's openssl_encrypt() and openssl_decrypt()
      functions. Common issues include using weak cipher algorithms, missing or static IVs,
      using zero-padding instead of PKCS#7, disabled authentication tags in GCM mode, and
      short key lengths. openssl_encrypt() is PHP's primary encryption API and improper
      parameter selection can completely undermine the security of the encryption.
    language: php
    category: crypto
    severity: High
    confidence: 0.89
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - openssl
      - weak-parameters
      - iv-reuse
      - cipher-mode
      - php
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'openssl_encrypt\s*\([^,]+,\s*[''"](?:des|des-ede|des-ede3|rc4|rc2|bf|cast5)[^''"]'
        description: "openssl_encrypt with weak cipher algorithm"
      - type: regex
        pattern: 'openssl_encrypt\s*\([^,]+,\s*[''"](?:aes-\d+-ecb)[''"]'
        description: "openssl_encrypt with ECB mode"
      - type: regex
        pattern: 'openssl_encrypt\s*\([^,]+,\s*[^,]+,\s*[^,]+,\s*[^,]+,\s*[''"][''"]'
        description: "openssl_encrypt with empty IV string"
      - type: regex
        pattern: 'openssl_encrypt\s*\([^,]+,\s*[^,]+,\s*[^,]+,\s*[^,]+,\s*str_repeat\s*\(\s*[''"]\\0[''"]'
        description: "openssl_encrypt with null-byte IV"
      - type: regex
        pattern: '\$iv\s*=\s*[''"][^''"]{16,}[''"][\s\S]{0,100}openssl_encrypt'
        description: "Static IV variable used in openssl_encrypt"
      - type: regex
        pattern: 'openssl_encrypt\s*\([^,]+,\s*[''"]aes-128-'
        description: "openssl_encrypt with AES-128 (prefer AES-256)"
      - type: regex
        pattern: 'openssl_encrypt\s*\([^)]*\)[\s\S]{0,20}(?:;|$)[\s\S]{0,20}(?!.*\$tag)'
        description: "openssl_encrypt in GCM mode without capturing auth tag"
      - type: regex
        pattern: 'OPENSSL_ZERO_PADDING'
        description: "Zero padding flag (insecure padding scheme)"
    anti_patterns:
      - 'Test\.php$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#\s*nosec'
      - 'aes-256-gcm'
      - 'random_bytes'
      - 'openssl_random_pseudo_bytes'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - '$tag'
      - 'legacy'
      - '$iv\s*=\s*(?:random_bytes|openssl_random)'
    bypass_variants:
      - description: "Cipher method stored in variable from config"
        pattern: '\$method\s*=\s*[^;]*[\s\S]{0,100}openssl_encrypt\s*\([^,]+,\s*\$method'
      - description: "IV derived from predictable source"
        pattern: '\$iv\s*=\s*(?:md5|sha1|substr)\s*\([^)]+\)[\s\S]{0,100}openssl_encrypt'
      - description: "Parameters loaded from config array"
        pattern: '\$config\s*\[\s*[''"]cipher[''"]'
    evasion_indicators:
      - "Cipher method loaded from configuration"
      - "IV derived from hash of known values"
      - "Parameters passed through options array"
      - "Wrapper class hiding openssl_encrypt parameters"
    encoding_variants:
      - type: "variable_method"
        pattern: '\$cipher\s*=\s*[''"](?:des|rc4|aes-128-ecb)[''"]'
      - type: "config_method"
        pattern: 'config\s*\[\s*[''"]method[''"]'
      - type: "strtolower_method"
        pattern: 'strtolower\s*\([^)]+\)[\s\S]{0,50}openssl_encrypt'
    multi_function_chain_patterns:
      - "openssl_encrypt('aes-128-ecb') without IV -> base64_encode -> store"
      - "Static IV -> openssl_encrypt('aes-256-cbc') -> repeated encryption"
      - "openssl_encrypt('des-ecb') -> database storage"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Weak openssl_encrypt parameters enable pattern analysis, brute-force, and ciphertext manipulation attacks"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "user_data"
        sink: "openssl_encrypt"
        through: "weak_cipher_method"
      - source: "static_iv"
        sink: "cbc_encryption"
        through: "iv_parameter"
      - source: "plaintext"
        sink: "ecb_encryption"
        through: "openssl_encrypt_ecb"
    impact: |
      Weak openssl_encrypt parameters compromise encryption security:
      - ECB mode leaks plaintext patterns across blocks
      - DES/3DES/RC4/Blowfish are brute-forceable or have known attacks
      - Static/missing IVs enable chosen-plaintext attacks in CBC mode
      - Missing auth tags in GCM mode lose authentication guarantees
      - AES-128 provides less security margin than AES-256
      - Zero padding can leak padding information
    remediation: |
      Use openssl_encrypt with aes-256-gcm and proper parameters:

      ```php
      // VULNERABLE: ECB mode with DES
      $encrypted = openssl_encrypt($data, 'des-ecb', $key);

      // VULNERABLE: CBC with static IV
      $iv = '0000000000000000';
      $encrypted = openssl_encrypt($data, 'aes-256-cbc', $key, 0, $iv);

      // SECURE: AES-256-GCM with random IV and auth tag
      $key = random_bytes(32);
      $iv = random_bytes(openssl_cipher_iv_length('aes-256-gcm'));
      $tag = '';
      $encrypted = openssl_encrypt(
          $data,
          'aes-256-gcm',
          $key,
          OPENSSL_RAW_DATA,
          $iv,
          $tag,
          '', // AAD (additional authenticated data)
          16  // tag length
      );
      // Store: base64_encode($iv . $tag . $encrypted)

      // SECURE: Decryption with tag verification
      $decrypted = openssl_decrypt(
          $ciphertext,
          'aes-256-gcm',
          $key,
          OPENSSL_RAW_DATA,
          $iv,
          $tag
      );
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://www.php.net/manual/en/function.openssl-encrypt.php"
      - "https://paragonie.com/blog/2015/05/using-encryption-and-authentication-correctly"
      - "https://csrc.nist.gov/publications/detail/sp/800-38d/final"
    context_awareness:
      surrounding_context_patterns:
        - 'openssl_encrypt'
        - 'openssl_decrypt'
        - 'cipher'
        - 'encrypt'
        - 'iv'
        - 'tag'
        - 'aes'
      taint_source_indicators:
        - '$_POST'
        - '$_GET'
        - 'file_get_contents'
        - '$data'
      taint_sink_indicators:
        - 'openssl_encrypt'
        - 'base64_encode'
        - 'file_put_contents'
        - '$stmt'
      sanitization_patterns:
        - 'aes-256-gcm'
        - 'random_bytes'
        - 'openssl_random_pseudo_bytes'
        - '$tag'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + parameter_weakness_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits AES-ECB encryption in a PHP e-commerce site:
        1. Application encrypts credit card numbers with openssl_encrypt('aes-128-ecb')
        2. Attacker obtains encrypted card numbers from a database breach
        3. ECB mode means identical card number prefixes produce identical ciphertext blocks
        4. Attacker performs frequency analysis to identify common card BINs
        5. Attacker uses known-plaintext partial cards to build encryption codebook
        6. Attacker recovers partial or full card numbers without breaking the key
      example_payload: "openssl_encrypt($card_number, 'aes-128-ecb', $key, OPENSSL_RAW_DATA)"
      attacker_objective: "Exploit weak openssl_encrypt parameters to analyze patterns or decrypt sensitive data"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
