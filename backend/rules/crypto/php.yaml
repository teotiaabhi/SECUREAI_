  - rule_id: "CRYPTO-PHP-006"
    title: "ECB Mode Usage in PHP Encryption"
    description: >
      Detects usage of Electronic Codebook (ECB) mode for symmetric encryption in PHP
      applications through openssl_encrypt(), mcrypt, or other encryption functions. ECB
      mode encrypts each block independently, producing identical ciphertext for identical
      plaintext blocks. This leaks data patterns and violates IND-CPA security. PHP makes
      ECB mode easily accessible through cipher method strings like 'aes-256-ecb' and
      mcrypt's MCRYPT_MODE_ECB constant.
    language: php
    category: crypto
    severity: High
    confidence: 0.94
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - ecb-mode
      - block-cipher
      - pattern-leakage
      - aes
      - php
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'openssl_encrypt\s*\([^,]+,\s*[''"](?:aes-(?:128|192|256)-ecb|des-ecb|des-ede3-ecb|bf-ecb|cast5-ecb)[''"]'
        description: "openssl_encrypt with ECB mode cipher"
      - type: regex
        pattern: 'openssl_decrypt\s*\([^,]+,\s*[''"](?:aes-(?:128|192|256)-ecb|des-ecb|des-ede3-ecb|bf-ecb|cast5-ecb)[''"]'
        description: "openssl_decrypt with ECB mode cipher"
      - type: regex
        pattern: 'MCRYPT_MODE_ECB'
        description: "mcrypt ECB mode constant"
      - type: regex
        pattern: '[''"]ecb[''"][\s\S]{0,50}(?:encrypt|decrypt|cipher|openssl)'
        description: "ECB mode string near encryption context"
      - type: regex
        pattern: '(?:encrypt|decrypt|cipher)[\s\S]{0,50}[''"]ecb[''"]'
        description: "Encryption context near ECB mode string"
      - type: regex
        pattern: '\$(?:method|cipher|mode|algorithm)\s*=\s*[''"][^''"]*ecb[^''"]*[''"]'
        description: "ECB mode stored in cipher method variable"
      - type: regex
        pattern: 'mcrypt_encrypt\s*\([^,]+,\s*[^,]+,\s*[^,]+,\s*[''"]ecb[''"]'
        description: "mcrypt_encrypt with ECB mode string"
      - type: regex
        pattern: 'sodium_crypto_(?:stream_xor|aead)[\s\S]{0,50}ecb'
        description: "ECB mode reference near sodium functions (unusual but possible)"
    anti_patterns:
      - 'Test\.php$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#\s*nosec'
      - 'key.*wrap'
      - 'single.*block'
      - 'legacy'
      - '@deprecated'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
      - 'migration'
      - 'backward.*compat'
    bypass_variants:
      - description: "Cipher method built from concatenated strings"
        pattern: '[''"]aes-256-[''"][\s]*\.[\s]*[''"]ecb[''"]'
      - description: "Cipher method from configuration"
        pattern: '\$config\[\s*[''"]cipher_method[''"]'
      - description: "Mode appended to algorithm dynamically"
        pattern: '\$algo\s*\.\s*[''"-]ecb[''"]'
    evasion_indicators:
      - "ECB mode selected through configuration variable"
      - "Cipher method string built from concatenation"
      - "Mode parameter passed as function argument"
      - "Encryption wrapper class hiding mode selection"
    encoding_variants:
      - type: "uppercase"
        pattern: '[''"]AES-256-ECB[''"]'
      - type: "mixed_case"
        pattern: '[''"]aes-256-Ecb[''"]'
      - type: "constant"
        pattern: 'const\s+CIPHER_METHOD\s*=\s*[''"][^''"]*ecb[^''"]*[''"]'
    multi_function_chain_patterns:
      - "openssl_encrypt('aes-256-ecb') -> base64_encode -> database"
      - "mcrypt_encrypt(RIJNDAEL_128, key, data, MCRYPT_MODE_ECB)"
      - "ECB cipher -> loop over data blocks -> concatenated output"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "ECB mode leaks plaintext patterns enabling data analysis and block manipulation attacks"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "plaintext_data"
        sink: "encrypted_column"
        through: "openssl_encrypt_ecb"
      - source: "user_data"
        sink: "file_storage"
        through: "mcrypt_ecb"
      - source: "sensitive_field"
        sink: "api_response"
        through: "ecb_encrypt"
    impact: |
      ECB mode in PHP encryption creates severe pattern leakage:
      - Identical plaintext blocks produce identical ciphertext blocks
      - Encrypted images retain visual structure (ECB penguin)
      - Block rearrangement attacks can modify data without decryption
      - Frequency analysis reveals encrypted data patterns
      - No IND-CPA security (minimum standard for modern encryption)
      - Violates PCI-DSS, HIPAA, NIST SP 800-38A recommendations
    remediation: |
      Replace ECB with GCM or CBC mode:

      ```php
      // VULNERABLE: ECB mode
      $encrypted = openssl_encrypt($data, 'aes-256-ecb', $key);

      // SECURE: AES-256-GCM (authenticated encryption)
      $iv = random_bytes(openssl_cipher_iv_length('aes-256-gcm'));
      $tag = '';
      $encrypted = openssl_encrypt(
          $data, 'aes-256-gcm', $key, OPENSSL_RAW_DATA, $iv, $tag
      );
      $stored = base64_encode($iv . $tag . $encrypted);

      // SECURE: sodium secretbox (XSalsa20-Poly1305)
      $key = sodium_crypto_secretbox_keygen();
      $nonce = random_bytes(SODIUM_CRYPTO_SECRETBOX_NONCEBYTES);
      $encrypted = sodium_crypto_secretbox($data, $nonce, $key);
      $stored = base64_encode($nonce . $encrypted);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
