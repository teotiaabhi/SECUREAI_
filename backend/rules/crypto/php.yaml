  - rule_id: "CRYPTO-PHP-007"
    title: "Permissive SSL verify_peer=false Configuration"
    description: >
      Detects disabled SSL/TLS certificate verification in PHP HTTP clients and stream
      contexts. PHP's stream_context_create() with verify_peer=false, cURL's
      CURLOPT_SSL_VERIFYPEER=false, and Guzzle's verify=false all disable certificate
      validation. This makes HTTPS connections vulnerable to man-in-the-middle attacks.
      PHP applications frequently disable verification when connecting to APIs with
      self-signed certificates, and this insecure setting often persists to production.
    language: php
    category: crypto
    severity: High
    confidence: 0.93
    cwe: CWE-295
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - ssl
      - tls
      - certificate-validation
      - mitm
      - curl
      - guzzle
      - php
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: '[''"]verify_peer[''"][\s]*=>[\s]*false'
        description: "SSL stream context verify_peer disabled"
      - type: regex
        pattern: '[''"]verify_peer_name[''"][\s]*=>[\s]*false'
        description: "SSL stream context verify_peer_name disabled"
      - type: regex
        pattern: 'CURLOPT_SSL_VERIFYPEER[\s]*,[\s]*(?:false|0|FALSE)'
        description: "cURL SSL peer verification disabled"
      - type: regex
        pattern: 'CURLOPT_SSL_VERIFYHOST[\s]*,[\s]*(?:false|0|FALSE)'
        description: "cURL SSL host verification disabled"
      - type: regex
        pattern: '[''"]verify[''"][\s]*=>[\s]*false'
        description: "Guzzle HTTP client verify disabled"
      - type: regex
        pattern: 'GuzzleHttp[\s\S]{0,200}[''"]verify[''"][\s]*=>[\s]*false'
        description: "Guzzle client configuration with disabled SSL"
      - type: regex
        pattern: '[''"]allow_self_signed[''"][\s]*=>[\s]*true'
        description: "SSL context allowing self-signed certificates"
      - type: regex
        pattern: 'stream_context_create\s*\(\s*\[\s*[''"]ssl[''"][\s]*=>[\s\S]{0,200}verify_peer[''"][\s]*=>[\s]*false'
        description: "Stream context creation with disabled SSL verification"
    anti_patterns:
      - 'Test\.php$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#\s*nosec'
      - 'development.*only'
      - 'localhost'
      - 'self.*signed'
      - '// TODO.*remove'
      - '// TEMPORARY'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'if.*APP_DEBUG'
      - 'if.*env.*local'
    bypass_variants:
      - description: "SSL options set via variable from configuration"
        pattern: '\$(?:ssl_options|sslOpts|verifyPeer)\s*=\s*false[\s\S]{0,100}(?:verify_peer|CURLOPT_SSL)'
      - description: "SSL verification disabled in class constructor"
        pattern: 'function\s+__construct[\s\S]{0,300}(?:verify_peer|CURLOPT_SSL_VERIFYPEER)[\s\S]{0,50}false'
      - description: "Middleware or handler disabling SSL globally"
        pattern: '(?:middleware|handler|interceptor)[\s\S]{0,200}verify[\s\S]{0,50}false'
    evasion_indicators:
      - "SSL settings loaded from configuration file"
      - "Verification disabled via environment-conditional code"
      - "Global cURL default overrides"
      - "HTTP client factory hiding verify=false"
    encoding_variants:
      - type: "constant_false"
        pattern: 'const\s+VERIFY_SSL\s*=\s*false'
      - type: "env_fallback"
        pattern: 'getenv\s*\(\s*[''"]VERIFY_SSL[''"].*false'
      - type: "config_array"
        pattern: '\$config\[\s*[''"](?:verify|ssl_verify)[''"]'
    multi_function_chain_patterns:
      - "stream_context_create(ssl=>verify_peer:false) -> file_get_contents(https)"
      - "curl_setopt(CURLOPT_SSL_VERIFYPEER, false) -> curl_exec"
      - "new GuzzleHttp\\Client(['verify' => false]) -> $client->get()"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Disabled SSL verification enables MITM interception of credentials, API keys, and sensitive data"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "ssl_config"
        sink: "https_request"
        through: "verify_peer_false"
      - source: "curl_options"
        sink: "api_call"
        through: "CURLOPT_SSL_VERIFYPEER"
      - source: "guzzle_config"
        sink: "external_api"
        through: "verify_false"
    impact: |
      Disabled SSL verification enables devastating MITM attacks:
      - All HTTPS traffic can be intercepted and read by network-positioned attackers
      - API keys, OAuth tokens, and credentials captured in transit
      - Payment gateway communications compromised (PCI-DSS violation)
      - Self-signed certificate allowance removes all trust chain protection
      - PHP web applications often process sensitive user data over HTTPS
      - Violates PCI-DSS 4.0, HIPAA, GDPR encryption-in-transit requirements
    remediation: |
      Always enforce SSL certificate verification:

      ```php
      // VULNERABLE: Disabled SSL verification (cURL)
      curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);

      // SECURE: Enable SSL verification with CA bundle
      curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);
      curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 2);
      curl_setopt($ch, CURLOPT_CAINFO, '/etc/ssl/certs/ca-certificates.crt');

      // SECURE: Guzzle with verification
      $client = new GuzzleHttp\Client([
          'verify' => true,  // default, use system CA bundle
          // Or specify custom CA:
          // 'verify' => '/path/to/ca-bundle.crt',
      ]);

      // SECURE: Stream context with verification
      $context = stream_context_create([
          'ssl' => [
              'verify_peer' => true,
              'verify_peer_name' => true,
              'allow_self_signed' => false,
              'cafile' => '/etc/ssl/certs/ca-certificates.crt',
          ],
      ]);
      $data = file_get_contents('https://api.example.com', false, $context);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://www.php.net/manual/en/context.ssl.php"
      - "https://curl.se/libcurl/c/CURLOPT_SSL_VERIFYPEER.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns:
        - 'curl'
        - 'ssl'
        - 'https'
        - 'verify'
        - 'Guzzle'
        - 'stream_context'
        - 'file_get_contents'
      taint_source_indicators:
        - 'config\.'
        - 'getenv'
        - '$_ENV'
        - 'APP_DEBUG'
      taint_sink_indicators:
        - 'curl_exec'
        - 'file_get_contents'
        - '$client->get'
        - '$client->post'
        - 'fopen.*https'
      sanitization_patterns:
        - 'verify_peer.*true'
        - 'CURLOPT_SSL_VERIFYPEER.*true'
        - 'verify.*true'
        - 'cafile'
        - 'CURLOPT_CAINFO'
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + network_exposure_modifier)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker exploits disabled SSL in a PHP payment integration:
        1. PHP application sends payment data to gateway with CURLOPT_SSL_VERIFYPEER=false
        2. Attacker performs ARP spoofing on the server's network segment
        3. Attacker intercepts HTTPS connection with a self-generated certificate
        4. Application accepts the fake certificate due to disabled verification
        5. Attacker captures credit card numbers, merchant IDs, and API keys
        6. Attacker uses stolen credentials to make fraudulent transactions
      example_payload: "curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false); curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 0);"
      attacker_objective: "Intercept HTTPS traffic by exploiting disabled certificate verification for credential and payment data theft"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "low"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PHP-003"
        - "CRYPTO-PHP-005"

  - rule_id: "CRYPTO-PHP-008"
    title: "Custom Cryptographic Implementation"
    description: >
      Detects attempts to implement custom cryptographic algorithms or primitives in PHP
      instead of using established libraries. Custom crypto implementations are almost
      universally flawed and vulnerable to side-channel attacks, timing attacks, and
      mathematical weaknesses. This includes custom XOR-based encryption, substitution
      ciphers, home-grown hash functions, and reimplementations of standard algorithms.
      The first rule of cryptography is: don't roll your own crypto.
    language: php
    category: crypto
    severity: High
    confidence: 0.85
    cwe: CWE-327
    owasp: "A02:2021-Cryptographic-Failures"
    tags:
      - cryptography
      - custom-crypto
      - xor-cipher
      - home-rolled
      - substitution-cipher
      - php
    detection_layer: 4
    attack_surface_type: "internal"
    patterns:
      - type: regex
        pattern: 'function\s+(?:encrypt|decrypt|cipher|encipher|decipher)\s*\([^)]*\)\s*\{[\s\S]{0,500}(?:ord|chr|\^)'
        description: "Custom encrypt/decrypt function using character manipulation"
      - type: regex
        pattern: 'for\s*\([^)]*\)\s*\{[\s\S]{0,200}\$\w+\s*\[\s*\$\w+\s*\]\s*\^\s*\$\w+\s*\['
        description: "XOR loop encryption pattern"
      - type: regex
        pattern: 'chr\s*\(\s*ord\s*\(\s*\$\w+\s*\[\s*\$\w+\s*\]\s*\)\s*\^\s*ord'
        description: "Character-by-character XOR encryption"
      - type: regex
        pattern: 'function\s+\w*(?:hash|digest|checksum)\w*\s*\([^)]*\)\s*\{[\s\S]{0,500}(?:ord|&|>>|<<|\^)'
        description: "Custom hash function using bitwise operations"
      - type: regex
        pattern: 'str_rot13\s*\([^)]*\)[\s\S]{0,80}(?:encrypt|secure|protect|password|secret)'
        description: "ROT13 used for 'encryption' (it's not encryption)"
      - type: regex
        pattern: 'strrev\s*\([^)]*\)[\s\S]{0,80}(?:encrypt|secure|protect|password|secret)'
        description: "String reversal used for 'encryption'"
      - type: regex
        pattern: 'base64_encode\s*\([^)]*\)[\s\S]{0,80}(?:encrypt|secure|protect|password|secret)'
        description: "base64 encoding used as 'encryption' (encoding is not encryption)"
      - type: regex
        pattern: 'function\s+\w*[Ee]ncrypt\w*\s*\([^)]*\)\s*\{[\s\S]{0,300}(?:strtr|str_replace|preg_replace)[\s\S]{0,300}return'
        description: "Substitution-based custom encryption function"
    anti_patterns:
      - 'Test\.php$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#\s*nosec'
      - 'openssl_'
      - 'sodium_'
      - 'password_hash'
      - 'mcrypt_'
      - 'hash_hmac'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'CTF'
      - 'educational'
    bypass_variants:
      - description: "Custom crypto in a separate class file"
        pattern: 'class\s+\w*[Cc]rypt(?:o|ography|er)?\w*\s*\{[\s\S]{0,500}(?:\^|ord|chr)'
      - description: "XOR encryption wrapped as a utility function"
        pattern: 'function\s+xor_(?:encrypt|decrypt|cipher)\s*\('
      - description: "Custom cipher using array_map for transformation"
        pattern: 'array_map\s*\(\s*function[\s\S]{0,200}(?:ord|chr|\^)[\s\S]{0,200}(?:encrypt|cipher)'
    evasion_indicators:
      - "Custom crypto in separate utility class"
      - "XOR operation obscured by helper functions"
      - "Encoding operations labeled as encryption"
      - "Multiple transformations combined as 'encryption'"
    encoding_variants:
      - type: "closure_xor"
        pattern: '\$\w+\s*=\s*function\s*\([^)]*\)\s*(?:use\s*\([^)]*\))?\s*\{[\s\S]{0,200}\^'
      - type: "array_processing"
        pattern: 'array_map\s*\(\s*[''"]chr[''"][\s\S]{0,100}\^'
      - type: "string_transform"
        pattern: 'strtr\s*\(\s*\$\w+\s*,\s*[''"][A-Za-z]+[''"][\s]*,[\s]*[''"][A-Za-z]+[''"]'
    multi_function_chain_patterns:
      - "Custom XOR loop -> base64_encode -> store as 'encrypted'"
      - "ROT13 -> base64 -> strrev -> claimed 'strong encryption'"
      - "Custom substitution table -> character mapping -> 'cipher'"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Custom crypto is trivially breakable, exposing all 'encrypted' data to simple cryptanalysis"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "sensitive_data"
        sink: "custom_encrypt_function"
        through: "function_call"
      - source: "password"
        sink: "xor_cipher"
        through: "custom_encryption"
      - source: "user_data"
        sink: "base64_encoding_as_encryption"
        through: "encoding_function"
    impact: |
      Custom cryptographic implementations are fundamentally insecure:
      - XOR encryption with key shorter than plaintext is trivially broken via known-plaintext
      - Repeating-key XOR is breakable via Kasiski examination and frequency analysis
      - ROT13/Caesar ciphers provide zero actual security
      - Base64 encoding is not encryption (trivially reversible)
      - Substitution ciphers are breakable via frequency analysis
      - Custom hash functions lack collision resistance guarantees
      - Side-channel attacks (timing) are virtually guaranteed in custom implementations
      - Gives false sense of security, may cause compliance teams to skip proper encryption
    remediation: |
      Use established cryptographic libraries:

      ```php
      // VULNERABLE: Custom XOR encryption
      function xorEncrypt($data, $key) {
          $result = '';
          for ($i = 0; $i < strlen($data); $i++) {
              $result .= chr(ord($data[$i]) ^ ord($key[$i % strlen($key)]));
          }
          return base64_encode($result);
      }

      // SECURE: Use sodium_crypto_secretbox
      $key = sodium_crypto_secretbox_keygen();
      $nonce = random_bytes(SODIUM_CRYPTO_SECRETBOX_NONCEBYTES);
      $encrypted = sodium_crypto_secretbox($data, $nonce, $key);

      // SECURE: Use openssl_encrypt with AES-256-GCM
      $key = random_bytes(32);
      $iv = random_bytes(12);
      $tag = '';
      $encrypted = openssl_encrypt(
          $data, 'aes-256-gcm', $key, OPENSSL_RAW_DATA, $iv, $tag
      );

      // SECURE: Use defuse/php-encryption library
      use Defuse\Crypto\Crypto;
      use Defuse\Crypto\Key;
      $key = Key::createNewRandomKey();
      $encrypted = Crypto::encrypt($data, $key);
      $decrypted = Crypto::decrypt($encrypted, $key);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://www.schneier.com/blog/archives/2011/04/schneiers_law.html"
      - "https://paragonie.com/blog/2015/05/if-you-re-typing-word-mcrypt-into-your-code-you-re-doing-it-wrong"
      - "https://github.com/defuse/php-encryption"
    context_awareness:
      surrounding_context_patterns:
        - 'encrypt'
        - 'decrypt'
        - 'cipher'
        - 'xor'
        - 'ord'
        - 'chr'
        - 'secret'
        - 'protect'
      taint_source_indicators:
        - '$_POST'
        - '$_GET'
        - '$data'
        - '$plaintext'
        - '$password'
      taint_sink_indicators:
        - 'file_put_contents'
        - '$stmt'
        - 'echo'
        - 'setcookie'
        - 'header'
      sanitization_patterns:
        - 'openssl_encrypt'
        - 'sodium_crypto_secretbox'
        - 'password_hash'
        - 'Crypto::encrypt'
        - 'hash_hmac'
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + algorithm_weakness_severity)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker breaks custom XOR encryption in a PHP CRM:
        1. PHP CRM uses repeating-key XOR to 'encrypt' customer records
        2. Attacker obtains encrypted records from a database breach
        3. Attacker uses Kasiski examination to determine XOR key length
        4. Using frequency analysis on each key-length segment, attacker recovers the key
        5. Attacker decrypts all 'encrypted' customer records (names, addresses, SSNs)
        6. Total time to break: under 1 hour with basic Python script
      example_payload: "for ($i=0; $i<strlen($data); $i++) { $enc .= chr(ord($data[$i]) ^ ord($key[$i % strlen($key)])); }"
      attacker_objective: "Break trivially weak custom encryption to access all 'protected' data"
    confidence_factors:
      pattern_strength: "medium"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "CRYPTO-PHP-001"
        - "CRYPTO-PHP-002"
        - "CRYPTO-PHP-005"
