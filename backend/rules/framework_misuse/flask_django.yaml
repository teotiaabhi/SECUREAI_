- rule_id: FW-DJANGO-004
  title: Missing Security Middleware in Django Settings
  description: 'Detects Django applications that are missing critical security middleware from the MIDDLEWARE setting. Django
    provides built-in middleware for CSRF protection, clickjacking prevention, XSS filtering, HTTPS enforcement, and HSTS.
    Omitting these middleware components leaves the application vulnerable to common web attacks that Django is designed to
    prevent.

    '
  language: python
  category: framework_misuse
  severity: High
  confidence: 0.86
  cwe: CWE-693
  owasp: A05:2021-Security Misconfiguration
  tags:
  - django
  - middleware
  - csrf
  - security-headers
  - misconfiguration
  - python
  detection_layer: 4
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: MIDDLEWARE\s*=\s*\[(?![\s\S]*?SecurityMiddleware)
    description: MIDDLEWARE list missing SecurityMiddleware
  - type: regex
    pattern: MIDDLEWARE\s*=\s*\[(?![\s\S]*?CsrfViewMiddleware)
    description: MIDDLEWARE list missing CsrfViewMiddleware
  - type: regex
    pattern: MIDDLEWARE\s*=\s*\[(?![\s\S]*?XFrameOptionsMiddleware)
    description: MIDDLEWARE list missing XFrameOptionsMiddleware
  - type: regex
    pattern: '@csrf_exempt'
    description: CSRF protection explicitly disabled on a view
  - type: regex
    pattern: CSRF_COOKIE_SECURE\s*=\s*False
    description: CSRF cookie sent over insecure connections
  - type: regex
    pattern: SESSION_COOKIE_SECURE\s*=\s*False
    description: Session cookie sent over insecure connections
  - type: regex
    pattern: SECURE_SSL_REDIRECT\s*=\s*False
    description: HTTPS redirect disabled
  - type: regex
    pattern: SECURE_HSTS_SECONDS\s*=\s*0
    description: HSTS disabled
  anti_patterns:
  - django\.middleware\.security\.SecurityMiddleware
  - django\.middleware\.csrf\.CsrfViewMiddleware
  - django\.middleware\.clickjacking\.XFrameOptionsMiddleware
  - CSRF_COOKIE_SECURE\s*=\s*True
  - SESSION_COOKIE_SECURE\s*=\s*True
  - SECURE_SSL_REDIRECT\s*=\s*True
  - SECURE_HSTS_SECONDS\s*=\s*31536000
  - SECURE_CONTENT_TYPE_NOSNIFF\s*=\s*True
  - SECURE_BROWSER_XSS_FILTER\s*=\s*True
  - X_FRAME_OPTIONS\s*=\s*["\x27]DENY["\x27]
  - SECURE_REFERRER_POLICY
  - CSP_DEFAULT_SRC
  - django-csp
  - SECURE_HSTS_INCLUDE_SUBDOMAINS\s*=\s*True
  - SESSION_COOKIE_HTTPONLY\s*=\s*True
  bypass_variants:
  - description: CSRF middleware present but @csrf_exempt used extensively
    pattern: '@csrf_exempt[\s\S]*?def\s+\w+\s*\(\s*request'
  - description: SecurityMiddleware present but all features disabled
    pattern: SecurityMiddleware[\s\S]*?SECURE_SSL_REDIRECT\s*=\s*False[\s\S]*?SECURE_HSTS_SECONDS\s*=\s*0
  - description: Middleware present but order is incorrect
    pattern: CsrfViewMiddleware[\s\S]*?SessionMiddleware
  evasion_indicators:
  - Security middleware conditionally included based on environment
  - Custom middleware replacing Django security middleware without full coverage
  - MIDDLEWARE setting dynamically modified at runtime
  encoding_variants:
  - type: dynamic_middleware
    pattern: MIDDLEWARE\s*=\s*\[\s*\][\s\S]*?MIDDLEWARE\.\w+\s*\(
  - type: conditional_removal
    pattern: MIDDLEWARE\.remove\s*\(\s*["\x27]django\.middleware\.(csrf|security)
  multi_function_chain_patterns:
  - Missing CsrfViewMiddleware -> CSRF attack on state-changing endpoints
  - Missing SecurityMiddleware -> no HSTS -> protocol downgrade attack
  - Missing XFrameOptionsMiddleware -> clickjacking on sensitive pages
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Missing security middleware exposes all users to CSRF, clickjacking, and downgrade attacks
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: Cross-origin form submission (CSRF)
    sink: State-changing Django view
    through: Missing CsrfViewMiddleware
  impact: 'Missing Django security middleware exposes the application to multiple

    attack vectors. Without CsrfViewMiddleware, all POST endpoints are

    vulnerable to cross-site request forgery. Without SecurityMiddleware,

    HSTS and HTTPS redirect are disabled. Without XFrameOptionsMiddleware,

    pages can be embedded in iframes for clickjacking attacks. These are

    foundational protections that Django provides by default.

    '
  remediation: "Ensure all security middleware is properly configured:\n\n```python\nMIDDLEWARE = [\n    'django.middleware.security.SecurityMiddleware',\n\
    \    'django.contrib.sessions.middleware.SessionMiddleware',\n    'django.middleware.common.CommonMiddleware',\n    'django.middleware.csrf.CsrfViewMiddleware',\n\
    \    'django.contrib.auth.middleware.AuthenticationMiddleware',\n    'django.contrib.messages.middleware.MessageMiddleware',\n\
    \    'django.middleware.clickjacking.XFrameOptionsMiddleware',\n]\n\n# Security settings\nSECURE_SSL_REDIRECT = True\n\
    SECURE_HSTS_SECONDS = 31536000\nSECURE_HSTS_INCLUDE_SUBDOMAINS = True\nSECURE_HSTS_PRELOAD = True\nSECURE_CONTENT_TYPE_NOSNIFF\
    \ = True\nSESSION_COOKIE_SECURE = True\nCSRF_COOKIE_SECURE = True\nSESSION_COOKIE_HTTPONLY = True\nX_FRAME_OPTIONS = 'DENY'\n\
    ```\n"
  references:
  - https://docs.djangoproject.com/en/stable/ref/middleware/#module-django.middleware.security
  - https://docs.djangoproject.com/en/stable/howto/deployment/checklist/
  - https://cwe.mitre.org/data/definitions/693.html
  - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
  context_awareness:
    surrounding_context_patterns:
    - MIDDLEWARE\s*=
    - INSTALLED_APPS
    - TEMPLATES
    - DATABASES
    taint_source_indicators:
    - request\.POST
    - request\.body
    taint_sink_indicators:
    - \.save\s*\(
    - \.delete\s*\(
    - \.update\s*\(
    sanitization_patterns:
    - CsrfViewMiddleware
    - SecurityMiddleware
    - XFrameOptionsMiddleware
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: 'severity_weight * confidence * (missing_csrf ? 1.5 : 1.0)'
    exploitability_score: Medium
  exploit_scenario:
    attack_example: 'A Django application is missing CsrfViewMiddleware. An attacker creates

      a malicious page with a hidden form that submits a POST request to the

      Django app''s /account/transfer/ endpoint. When an authenticated user

      visits the malicious page, the form auto-submits, transferring funds

      from the victim''s account. Without CSRF protection, the request

      succeeds because the browser includes the session cookie automatically.

      '
    example_payload: <form action="https://target.com/account/transfer/" method="POST"><input type="hidden" name="to" value="attacker"/><input
      type="hidden" name="amount" value="10000"/></form><script>document.forms[0].submit()</script>
    attacker_objective: Exploit missing security middleware for CSRF, clickjacking, and protocol downgrade attacks
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: medium
    sanitization_absence: high
