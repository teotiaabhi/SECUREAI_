rules:
- rule_id: GROOVY-INJ-001
  title: SQL Injection via GString
  description: 'Detects SQL injection via Groovy GString interpolation.

    '
  language: groovy
  category: injection
  severity: Critical
  confidence: 0.92
  cwe: CWE-89
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - sql-injection
  - gstring
  patterns:
  - type: regex
    pattern: (?:execute|executeQuery|executeUpdate|rows|firstRow)\s*\(\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*\$\{?(?:params|request|input|user)\b
  - type: regex
    pattern: \.execute\s*\(\s*"[^"]*\$\{[^}]*(?:params|request|input|user)\b
  - type: regex
    pattern: Sql\s*\.(?:execute|rows|firstRow|eachRow)\s*\(\s*"[^"]*\$\{
  anti_patterns:
  - execute(.*,.*[
  - execute(.*,.*\[
  - Sql.expand
  - :param
  impact: 'GString interpolation in SQL queries leads to SQL injection.

    '
  remediation: "Use Groovy's parameterized SQL:\n  sql.execute(\"SELECT * FROM users WHERE id = ?\", [userId])\n  sql.rows(\"SELECT * FROM users WHERE name = :name\", [name: userName])\n"
- rule_id: GROOVY-INJ-002
  title: Command Injection via Execute
  description: 'Detects OS command injection in Groovy.

    '
  language: groovy
  category: injection
  severity: Critical
  confidence: 0.9
  cwe: CWE-78
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - command-injection
  - groovy-execute
  patterns:
  - type: regex
    pattern: '"[^"]*\$\{?(?:params|request|input|user)\b[^"]*"\.execute\s*\('
  - type: regex
    pattern: (?:Runtime|ProcessBuilder).*(?:params|request|input|user)\b
  - type: regex
    pattern: \["(?:sh|bash|cmd|powershell)",\s*"-c",.*(?:params|request|input|user)\b
  - type: regex
    pattern: (?:command|cmd)\s*\.execute\s*\(\s*\)
  anti_patterns:
  - ProcessBuilder([
  - sanitize
  - whitelist
  impact: Injection attacks can lead to data breach, unauthorized access, or system compromise
  remediation: Use parameterized queries, input validation, and output encoding
- rule_id: GROOVY-INJ-003
  title: Groovy Script Injection (eval/GroovyShell)
  description: 'Detects dynamic Groovy code execution with user input.

    '
  language: groovy
  category: injection
  severity: Critical
  confidence: 0.92
  cwe: CWE-94
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - code-injection
  - groovy-shell
  patterns:
  - type: regex
    pattern: GroovyShell\s*\(\s*\)\.evaluate\s*\(\s*(?:params|request|input|user)\b
  - type: regex
    pattern: new\s+GroovyShell\s*\(.*\)\.(?:evaluate|parse|run)\s*\(\s*(?:params|request|input|user)\b
  - type: regex
    pattern: Eval\.(?:me|x|xy)\s*\(\s*(?:params|request|input|user)\b
  - type: regex
    pattern: GroovyClassLoader.*parseClass\s*\(\s*(?:params|request|input|user)\b
  - type: regex
    pattern: GroovyScriptEngine.*run\s*\(\s*(?:params|request|input|user)\b
  anti_patterns:
  - SecureASTCustomizer
  - CompilerConfiguration
  - sandbox
  impact: 'Groovy script injection enables arbitrary code execution on the server.

    '
  remediation: "Use SecureASTCustomizer to restrict Groovy code execution:\n  def config = new CompilerConfiguration()\n  def customizer = new SecureASTCustomizer()\n  customizer.with { importsBlacklist\
    \ = ['java.lang.Runtime'] }\n  config.addCompilationCustomizers(customizer)\n"
- rule_id: GROOVY-INJ-004
  title: XXE in Groovy XML Parsing
  description: 'Detects XML parsing without disabling external entities.

    '
  language: groovy
  category: injection
  severity: High
  confidence: 0.85
  cwe: CWE-611
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 1
  tags:
  - xxe
  - xml-parsing
  patterns:
  - type: regex
    pattern: new\s+XmlSlurper\s*\(\s*\)
  - type: regex
    pattern: new\s+XmlParser\s*\(\s*\)
  - type: regex
    pattern: XmlUtil\.serialize\s*\(
  anti_patterns:
  - setFeature
  - FEATURE_EXTERNAL
  - disallow-doctype-decl
  impact: Injection attacks can lead to data breach, unauthorized access, or system compromise
  remediation: Use parameterized queries, input validation, and output encoding
- rule_id: GROOVY-XAUTH-001
  title: Hardcoded Credentials in Groovy
  description: 'Detects hardcoded passwords and secrets in Groovy code.

    '
  language: groovy
  category: auth
  severity: High
  confidence: 0.9
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - hardcoded-credentials
  patterns:
  - type: regex
    pattern: (?:def|String|final)\s+(?:password|passwd|secret|apiKey|api_key|token)\s*=\s*['"][^'"]{4,}['"]
  - type: regex
    pattern: (?:password|passwd|secret|apiKey|token)\s*:\s*['"][^'"]{4,}['"]
  anti_patterns:
  - System.getenv
  - System.getProperty
  - credentials(
  - placeholder
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: GROOVY-XCRYPTO-001
  title: Weak Cryptography in Groovy
  description: 'Detects weak cryptographic algorithms.

    '
  language: groovy
  category: crypto
  severity: High
  confidence: 0.9
  cwe: CWE-327
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - weak-crypto
  patterns:
  - type: regex
    pattern: MessageDigest\.getInstance\s*\(\s*['"](?:MD5|SHA-1|SHA1)['"]
  - type: regex
    pattern: Cipher\.getInstance\s*\(\s*['"](?:DES|DESede|RC4|Blowfish)(?:/|\s*['"])
  - type: regex
    pattern: \.md5\s*\(\s*\)
  - type: regex
    pattern: \.digest\s*\(\s*['"](?:MD5|SHA-1)['"]
  anti_patterns:
  - SHA-256
  - AES
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: GROOVY-DESER-001
  title: Unsafe Deserialization in Groovy
  description: 'Detects unsafe Java deserialization in Groovy.

    '
  language: groovy
  category: deserialization
  severity: Critical
  confidence: 0.92
  cwe: CWE-502
  owasp: A08:2021-Software-and-Data-Integrity-Failures
  detection_layer: 1
  tags:
  - deserialization
  patterns:
  - type: regex
    pattern: ObjectInputStream.*readObject\s*\(
  - type: regex
    pattern: new\s+ObjectInputStream\s*\(\s*(?:request|input|socket|stream)\b
  anti_patterns:
  - ObjectInputFilter
  - lookAheadObjectInputStream
  impact: Unsafe deserialization can lead to remote code execution via gadget chains
  remediation: Use safe serialization formats (JSON), implement type filtering, avoid deserializing untrusted data
- rule_id: GROOVY-PATH-001
  title: Path Traversal in Groovy
  description: 'Detects file access with user-controlled paths.

    '
  language: groovy
  category: path_traversal
  severity: High
  confidence: 0.85
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 1
  tags:
  - path-traversal
  patterns:
  - type: regex
    pattern: new\s+File\s*\(\s*(?:params|request|input|user)\b
  - type: regex
    pattern: (?:getText|readLines|newReader|withReader)\s*\(\s*\)\s*.*(?:params|request|input|user)\b
  anti_patterns:
  - canonicalPath
  - normalize
  - startsWith
  impact: Path traversal enables reading or writing arbitrary files on the server
  remediation: Canonicalize paths and verify they remain within expected base directories
- rule_id: GROOVY-XSS-001
  title: XSS in Grails/Groovy Templates
  description: 'Detects XSS in Grails GSP templates.

    '
  language: groovy
  category: xss
  severity: High
  confidence: 0.85
  cwe: CWE-79
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - xss
  - grails
  - gsp
  patterns:
  - type: regex
    pattern: \$\{raw\s*\(\s*(?:params|request|input|user)\b
  - type: regex
    pattern: render\s+text\s*:\s*(?:params|request|input|user)\b
  - type: regex
    pattern: <%=\s*(?:params|request|input|user)\b.*%>
  anti_patterns:
  - encodeAsHTML
  - encodeAsJavaScript
  - escapeHtml
  impact: Cross-site scripting enables session hijacking, credential theft, and website defacement
  remediation: Apply context-aware output encoding and use Content Security Policy headers
- rule_id: GROOVY-SSRF-001
  title: Server-Side Request Forgery
  description: 'Detects HTTP requests with user-controlled URLs.

    '
  language: groovy
  category: ssrf
  severity: High
  confidence: 0.85
  cwe: CWE-918
  owasp: A10:2021-Server-Side-Request-Forgery
  detection_layer: 1
  tags:
  - ssrf
  patterns:
  - type: regex
    pattern: new\s+URL\s*\(\s*(?:params|request|input|user)\b.*(?:openConnection|text|openStream)
  - type: regex
    pattern: '"[^"]*\$\{?(?:params|request|input|user)\b[^"]*"\.toURL\s*\('
  anti_patterns:
  - allowedHosts
  - whitelist
  impact: Server-side request forgery enables access to internal resources and cloud metadata
  remediation: Validate and allowlist URLs, block private IP ranges and cloud metadata endpoints
- rule_id: GROOVY-XSEC-001
  title: Jenkins Pipeline Credential Exposure
  description: 'Detects credential exposure in Jenkins pipeline Groovy scripts.

    '
  language: groovy
  category: secrets
  severity: High
  confidence: 0.88
  cwe: CWE-532
  owasp: A09:2021-Security-Logging-and-Monitoring-Failures
  detection_layer: 1
  tags:
  - jenkins
  - credentials
  - pipeline
  patterns:
  - type: regex
    pattern: echo\s+.*(?:PASSWORD|SECRET|TOKEN|API_KEY|CREDENTIALS)\b
  - type: regex
    pattern: println\s+.*(?:password|secret|token|credentials)\b
  - type: regex
    pattern: sh\s+['"].*(?:\$PASSWORD|\$SECRET|\$TOKEN|\$API_KEY)\b
  anti_patterns:
  - credentials(
  - withCredentials
  - '****'
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: GROOVY-XSEC-002
  title: Jenkins Insecure Script Approval
  description: 'Detects Jenkins pipeline scripts using unsafe methods.

    '
  language: groovy
  category: framework_misuse
  severity: High
  confidence: 0.82
  cwe: CWE-94
  owasp: A03:2021-Injection
  detection_layer: 2
  tags:
  - jenkins
  - script-security
  patterns:
  - type: regex
    pattern: '@Grab\s*\(\s*[''"]'
  - type: regex
    pattern: GroovyShell\s*\(.*\)\.evaluate\b
  - type: regex
    pattern: this\.class\.classLoader\b
  anti_patterns:
  - '@NonCPS'
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
