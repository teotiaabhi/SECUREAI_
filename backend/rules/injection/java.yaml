- rule_id: JAVA-INJ-014
  title: MyBatis ${} SQL Injection
  description: 'Detects MyBatis mapper XML or annotation queries using ${} interpolation instead of #{} parameterization,
    enabling SQL injection.

    '
  language: java
  category: injection
  severity: High
  confidence: 0.94
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - sql-injection
  - mybatis
  - orm
  - dollar-interpolation
  - java
  detection_layer: 1
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: \\$\\{\\w*(?:param|input|user|arg|order|sort|table|column|where|id)\\w*\\}
    description: MyBatis ${} with tainted variable name
  - type: regex
    pattern: <(?:select|insert|update|delete)\b[^>]*>[\s\S]*?\\$\\{[^}]+\\}
    description: MyBatis mapper XML with ${} interpolation
  - type: regex
    pattern: '@(?:Select|Insert|Update|Delete)\s*\(\s*"[^"]*\\$\\{[^}]+\\}[^"]*"'
    description: MyBatis annotation with ${} interpolation
  - type: regex
    pattern: ORDER\\s+BY\\s+\\$\\{[^}]*(?:sort|order|column|field)\\}
    description: Dynamic ORDER BY via MyBatis ${}
  - type: regex
    pattern: WHERE\\s+\\$\\{[^}]*(?:condition|filter|where|clause)\\}
    description: Dynamic WHERE clause via MyBatis ${}
  anti_patterns:
  - '#{param}'
  - '#{id}'
  - '#{name}'
  - MappedStatement
  - TypeHandler
  - ParameterMap
  bypass_variants:
  - description: ORDER BY injection via ${}
    pattern: ORDER\\s+BY\\s+\\$\\{\\w+\\}
  - description: Table name injection
    pattern: FROM\\s+\\$\\{\\w+\\}
  evasion_indicators:
  - Dynamic ORDER BY
  - Dynamic table names
  - Dynamic WHERE
  encoding_variants:
  - type: unicode
    pattern: \\u0024\\u007b
  multi_function_chain_patterns:
  - request.getParameter('sort') -> MyBatis ${sort} -> SQL ORDER BY
  - request.getParameter('table') -> MyBatis ${table} -> SQL FROM
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: SQL injection via ORM interpolation bypass
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: '@RequestParam, @PathVariable'
    sink: MyBatis ${} interpolation
    through: Mapper parameter mapping
  impact: 'MyBatis ${} performs raw string interpolation into SQL enabling full SQL

    injection including UNION attacks, data exfiltration, and RCE via DB features.

    '
  remediation: 'Always use #{} for parameterized values. For dynamic ORDER BY or table names,

    use MyBatis <choose>/<when> with allowlisted values or a Java-side allowlist map.

    '
  references:
  - https://mybatis.org/mybatis-3/sqlmap-xml.html#Parameters
  - https://cwe.mitre.org/data/definitions/89.html
  context_awareness:
    surrounding_context_patterns:
    - import org.apache.ibatis
    - mybatis-config
    - <mapper
    - '@Select'
    - '@Mapper'
    taint_source_indicators:
    - '@RequestParam'
    - '@PathVariable'
    - '@RequestBody'
    taint_sink_indicators:
    - ${
    - '@Select("'
    - '@Insert("'
    - '@Update("'
    - '@Delete("'
    sanitization_patterns:
    - '#{'
    - <choose>
    - <when>
    - allowlist
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - parameterization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'MyBatis mapper uses <select>SELECT * FROM users ORDER BY ${sortColumn}</select>.

      Attacker sends sortColumn=id; DROP TABLE users-- to inject SQL.

