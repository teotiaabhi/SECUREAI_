  exploit_scenario:
    attack_example: 'A Django REST Framework application accepts XML-formatted API requests for

      data import. The endpoint parses the uploaded XML using:

      tree = ElementTree.fromstring(request.body)

      An attacker crafts a malicious XML document with an external entity definition:

      <?xml version="1.0"?>

      <!DOCTYPE data [<!ENTITY xxe SYSTEM "file:///etc/passwd">]>

      <data><user>&xxe;</user></data>

      The XML parser resolves the external entity, reading /etc/passwd and embedding

      its contents into the parsed data. The attacker then reads the application

      secrets by targeting file:///app/settings.py. Next, the attacker uses SSRF

      via: <!ENTITY xxe SYSTEM "http://169.254.169.254/latest/meta-data/iam/security-credentials/">

      to steal AWS IAM credentials from the metadata service. With these credentials,

      the attacker can access S3 buckets, RDS databases, or other AWS resources.

