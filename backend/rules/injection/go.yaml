  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Object instantiation and DoS via YAML processing
  business_logic_indicator:
    financial_impact: false
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: r.Body, uploaded file
    sink: yaml.Unmarshal()
    through: Direct unmarshaling of user data
  impact: 'YAML deserialization can cause DoS via anchor expansion. Custom

    unmarshalers may enable object instantiation attacks.

    '
  remediation: 'Prefer JSON over YAML for API input. Use yaml.v3 with KnownFields(true)

    to reject unexpected fields. Validate and size-limit input before parsing.

