  exploit_scenario:
    attack_example: 'A Go web application provides a plugin system where administrators can load extensions. The plugin path
      is partially derived from user input: plugin.Open(filepath.Join(pluginDir, userInput + ".so")). An attacker supplies
      "../malicious" to load a crafted shared object from an unexpected directory, achieving arbitrary code execution. Alternatively,
      a reflect-based API dispatcher uses MethodByName with user input, allowing invocation of unintended internal methods.

      '
    example_payload: ../../../tmp/malicious
    attacker_objective: 'Execute arbitrary code by loading malicious plugins, invoke unintended methods via reflection to
      bypass authorization, or access private struct fields to leak sensitive data.

      '
