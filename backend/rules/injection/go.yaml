- rule_id: GO-INJ-013
  title: Unsafe YAML Deserialization
  description: 'Detects YAML unmarshaling of user-controlled data that may enable object instantiation attacks in Go applications
    using gopkg.in/yaml.v2 or gopkg.in/yaml.v3 with custom unmarshalers.

    '
  language: go
  category: injection
  severity: Medium
