    false_negative_likelihood: Medium for filters constructed in separate utility functions
  impact: 'LDAP injection enables authentication bypass, unauthorized data access,

    and information disclosure from directory services. Attackers can

    enumerate users, extract email addresses and organizational data,

    bypass access controls based on group membership, and in some cases

    modify directory entries.

    '
  remediation: "Use ldap.EscapeFilter() to escape user input in LDAP filters:\n\n  // SAFE: Properly escaped filter\n  filter\
    \ := fmt.Sprintf(\"(uid=%s)\", ldap.EscapeFilter(userInput))\n\n  // SAFE: Escaped DN\n  dn := fmt.Sprintf(\"uid=%s,ou=users,dc=example,dc=com\"\
    , ldap.EscapeDN(userInput))\n\n  // SAFE: Validate input against expected character classes\n  if !regexp.MustCompile(`^[a-zA-Z0-9._-]+$`).MatchString(username)\
    \ {\n      return fmt.Errorf(\"invalid username format\")\n  }\n\n  // With gin framework\n  func loginHandler(c *gin.Context)\
    \ {\n      username := c.PostForm(\"username\")\n      if !isValidUsername(username) {\n          c.JSON(400, gin.H{\"\
    error\": \"invalid username\"})\n          return\n      }\n      filter := fmt.Sprintf(\"(sAMAccountName=%s)\", ldap.EscapeFilter(username))\n\
    \  }\n\n  // With echo framework\n  func loginHandler(c echo.Context) error {\n      username := c.FormValue(\"username\"\
    )\n      escapedUser := ldap.EscapeFilter(username)\n      filter := fmt.Sprintf(\"(uid=%s)\", escapedUser)\n  }\n\nValidate\
    \ input against expected character classes before filter insertion.\nUse parameterized search functions when available.\n"
  references:
