- rule_id: GO-INJ-015
  title: ReDoS via User-Controlled Regex Pattern
  description: 'Detects regex compilation or matching with user-controlled patterns that may cause catastrophic backtracking.
    Go''s regexp uses RE2 which is safe from backtracking, but regexp/syntax and third-party PCRE bindings are vulnerable.

    '
  language: go
  category: injection
  severity: Medium
  confidence: 0.83
  cwe: CWE-1333
  owasp: A03:2021-Injection
  tags:
  - redos
  - regex-injection
  - dos
  - go
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: regexp\.(?:Compile|MustCompile|Match)\s*\(\s*(?:r\.FormValue|c\.Param|c\.QueryParam|param|input|user|pattern|search)\b
    description: regexp.Compile with user-controlled pattern
  - type: regex
    pattern: regexp\.(?:Compile|MustCompile)\s*\(\s*fmt\.Sprintf\s*\([^)]*(?:r\.FormValue|param|input|user)\b
    description: regexp.Compile with Sprintf user input
  - type: regex
    pattern: pcre\.(?:Compile|MustCompile)\s*\(\s*(?:param|input|user|pattern|search)\b
    description: PCRE compile with user-controlled pattern (vulnerable to backtracking)
  - type: regex
    pattern: (?:go-pcre|pcre2)\.Compile\s*\(\s*(?:r\.FormValue|param|input|user|pattern)\b
    description: Third-party PCRE bindings with user pattern
  anti_patterns:
  - regexp.QuoteMeta
  - regexp/syntax
  - timeout
  - context.WithTimeout
  - allowedPatterns
  bypass_variants:
  - description: Catastrophic backtracking pattern
    pattern: \\(a\\+\\)\\+
  - description: Nested quantifiers
    pattern: \\([^)]*[+*]\\)[+*]
  evasion_indicators:
  - User-controlled regex with nested quantifiers
  - PCRE-specific features
  encoding_variants:
  - type: unicode
    pattern: \\u005b.*\\u005d
  multi_function_chain_patterns:
  - r.FormValue('pattern') -> regexp.Compile(pattern) -> pattern.FindAll()
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: CPU exhaustion via regex backtracking
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: false
    compliance_relevant: true
  probable_taint_paths:
  - source: r.FormValue(), c.QueryParam()
    sink: regexp.Compile(), pcre.Compile()
    through: Direct parameter to regex compilation
  impact: 'ReDoS causes CPU exhaustion making the service unresponsive. Go''s stdlib

    regexp (RE2) is immune to backtracking but PCRE bindings are vulnerable.

    '
  remediation: 'Use Go''s stdlib regexp (RE2-based, immune to backtracking). Escape user

    input with regexp.QuoteMeta(). If PCRE is needed, use context.WithTimeout.

    '
  references:
  - https://cwe.mitre.org/data/definitions/1333.html
  - https://pkg.go.dev/regexp
  context_awareness:
    surrounding_context_patterns:
    - import "regexp"
    - import pcre
    - go-pcre
    taint_source_indicators:
    - r.FormValue(
    - c.QueryParam(
    - c.Param(
    taint_sink_indicators:
    - regexp.Compile(
    - regexp.MustCompile(
    - pcre.Compile(
    sanitization_patterns:
    - regexp.QuoteMeta(
    - context.WithTimeout
    - allowedPatterns
  severity_scoring:
    severity_weight: 5
    risk_score_formula_hint: severity_weight * confidence * pcre_usage_factor
    exploitability_score: Medium
  exploit_scenario:
    attack_example: 'Search API compiles user pattern: regexp.Compile(r.FormValue("q")).

      With Go stdlib this is safe (RE2), but with PCRE bindings attacker

      sends q=(a+)+$ to cause catastrophic backtracking.

      '
    example_payload: (a+)+$
    attacker_objective: Cause DoS via regex CPU exhaustion
  confidence_factors:
    pattern_strength: medium
    context_match: medium
    proximity_to_user_input: high
    sanitization_absence: high
