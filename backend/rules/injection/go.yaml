    - libxml2
    taint_source_indicators:
    - r.Body
    - req.Body
    - request.Body
    - c.Request().Body
    taint_sink_indicators:
    - xml.Unmarshal(
    - xml.NewDecoder(
    - etree.ReadFrom(
    - xmlquery.Parse(
    sanitization_patterns:
    - encoding/xml
    - json.Unmarshal
    - DisallowEntities
