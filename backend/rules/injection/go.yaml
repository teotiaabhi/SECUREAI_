  - introspection
  - go
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: fmt\.Sprintf\s*\(\s*"[^"]*(?:query|mutation)\s*\{[^"]*%s[^"]*"[^)]*(?:r\.FormValue|c\.Param|param|input|user)\b
    description: GraphQL query built via Sprintf with user input
