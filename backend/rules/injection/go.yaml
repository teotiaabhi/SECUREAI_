  - type: regex
    pattern: graphql\.Do\s*\([^)]*Params\s*\{[^}]*Query:\s*(?:r\.FormValue|param|query|input)\b
    description: graphql-go Do with user-controlled query
  - type: regex
    pattern: \.Query\s*\(\s*ctx\s*,\s*(?:r\.FormValue|param|input|query|user)\b
    description: GraphQL query execution with user-controlled string
  anti_patterns:
