    name\": name})\n\n  // With echo framework\n  e.Renderer = &TemplateRenderer{\n      templates: template.Must(template.ParseGlob(\"\
    templates/*.html\")),\n  }\n\nValidate and sanitize all data passed to template execution.\nUse bluemonday for HTML sanitization\
    \ of user-provided content.\n"
