- rule_id: GO-INJ-006
  title: XML External Entity (XXE) Injection
  description: 'Detects XML parsing in Go using encoding/xml or third-party XML libraries where external entity processing
    may lead to file disclosure or SSRF. Go''s encoding/xml does not support external entities by default but third-party
    parsers (libxml2 bindings, etree) may be vulnerable.

    '
  language: go
  category: injection
  severity: High
  confidence: 0.85
  cwe: CWE-611
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - xxe
  - xml-injection
  - file-disclosure
  - ssrf
  - go
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: xml\.NewDecoder\s*\(\s*(?:r\.Body|req\.Body|request\.Body|body|reader)\b
    description: xml.NewDecoder from HTTP request body
  - type: regex
    pattern: xml\.Unmarshal\s*\(\s*(?:body|data|input|content|payload)\b
    description: xml.Unmarshal with user-controlled bytes
  - type: regex
    pattern: etree\.ReadFrom\s*\(\s*(?:r\.Body|req\.Body|body|reader)\b
    description: etree XML parser from user input
  - type: regex
    pattern: xmlquery\.Parse\s*\(\s*(?:r\.Body|req\.Body|body|reader)\b
    description: xmlquery parser with user-controlled reader
  - type: regex
    pattern: libxml2\.(?:Parse|Read)\w*\s*\([^)]*(?:r\.Body|body|input|data)\b
    description: libxml2 Go bindings with user data
  anti_patterns:
  - encoding/xml
  - xml.NewDecoder.*DisallowEntities
  - sanitize
  - json.Unmarshal
  bypass_variants:
  - description: DTD-based entity expansion
    pattern: <!DOCTYPE.*<!ENTITY
  - description: Parameter entity injection
    pattern: <!ENTITY.*%.*SYSTEM
  evasion_indicators:
  - External entity via DTD
  - Parameter entities
  encoding_variants:
  - type: utf16
    pattern: \\xff\\xfe.*DOCTYPE
  multi_function_chain_patterns:
  - r.Body -> ioutil.ReadAll(r.Body) -> xml.Unmarshal(body)
  - r.Body -> xml.NewDecoder(r.Body).Decode(&obj)
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: File disclosure and SSRF via XML entities
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: r.Body, io.ReadAll(r.Body)
    sink: xml.Unmarshal(), xml.NewDecoder().Decode()
    through: Direct XML parsing of request body
  impact: 'XXE enables reading local files, SSRF to internal services, and DoS

    via entity expansion. Go''s stdlib is safe by default but third-party

    XML libraries may be vulnerable.

    '
  remediation: 'Use Go''s encoding/xml which is safe by default. For third-party XML

    libraries, disable external entity resolution. Prefer JSON over XML.

    '
  references:
  - https://cwe.mitre.org/data/definitions/611.html
