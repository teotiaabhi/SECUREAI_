  - type: regex
    pattern: yaml\.NewDecoder\s*\(\s*(?:r\.Body|req\.Body|body|reader)\b
    description: yaml.NewDecoder from user-controlled reader
  - type: regex
    pattern: yaml\.Unmarshal\s*\(\s*(?:\[\]byte\s*\()?(?:r\.FormValue|c\.Param|input|user)\b
    description: yaml.Unmarshal from request parameter
  anti_patterns:
  - json.Unmarshal
  - validate
