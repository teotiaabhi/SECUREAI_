rules:
- rule_id: GO-INJ-001
  title: SQL Injection via String Concatenation
  description: 'Detects SQL query construction using fmt.Sprintf or string concatenation with user-controlled input instead
    of parameterized queries. This includes detection across database/sql, GORM, sqlx, ent, and other Go ORM/query builder
    libraries.

    '
  language: go
  category: injection
  severity: Critical
  confidence: 0.93
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - sql-injection
  - database-sql
  - gorm
  - sqlx
  - ent
  - pgx
  patterns:
  - type: regex
    pattern: db\.(?:Query|QueryRow|Exec|QueryContext|ExecContext)\s*\([^,)]*fmt\.Sprintf\s*\(\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b
  - type: regex
    pattern: db\.(?:Query|QueryRow|Exec)\s*\(\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*"\s*\+\s*\w+
  - type: regex
    pattern: fmt\.Sprintf\s*\(\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*%s[^"]*"[^)]*(?:r\.(?:URL|Form|PostForm)|request|param|input|user)
  - type: regex
    pattern: \.(?:Raw|Where|Having|Group|Order)\s*\(\s*fmt\.Sprintf\s*\(
  - type: regex
    pattern: \.(?:Raw|Where)\s*\(\s*"[^"]*"\s*\+\s*(?:r\.|c\.|ctx\.|gin\.|req\.|param|input)
  - type: regex
    pattern: strings\.Join\s*\([^)]*\)\s*.*(?:Query|Exec|Raw)\s*\(
    description: SQL built via strings.Join then passed to a query function
  - type: regex
    pattern: (?:tx|conn)\.(?:Query|QueryRow|Exec|ExecContext|QueryContext)\s*\([^,)]*fmt\.Sprintf
    description: SQL injection via transaction or connection objects
  - type: regex
    pattern: sqlx\.(?:Get|Select|MustExec|NamedExec)\s*\([^,)]*fmt\.Sprintf
    description: SQL injection through sqlx convenience functions with Sprintf
  - type: regex
    pattern: (?:pgx|pgxpool)\.(?:Query|QueryRow|Exec|SendBatch)\s*\([^,)]*fmt\.Sprintf
    description: SQL injection via pgx/pgxpool PostgreSQL driver
  - type: regex
    pattern: \.(?:Clauses|Table|Select|Joins)\s*\(\s*"[^"]*"\s*\+\s*(?:r\.|c\.|ctx\.)
    description: GORM clause injection via string concatenation with request context
  - type: regex
    pattern: \.Exec\s*\(\s*`[^`]*\$\{[^}]*\}[^`]*`
    description: Template literal with variable interpolation passed to Exec
  - type: regex
    pattern: query\s*(?:\+|=\s*.*\+)\s*(?:r\.(?:URL|Form|PostForm|Header)|c\.(?:Query|Param|PostForm)|ctx\.(?:Query|Param))
    description: Query string variable built by concatenating user input from HTTP frameworks
  - type: regex
    pattern: \.(?:Raw|Where|Having|Order)\s*\(\s*(?:query|sql|stmt|sqlStr|sqlQuery)\s*[,)]
    description: GORM method receiving a variable that may contain unsanitized SQL
  anti_patterns:
  - db.Query(.*,$
  - db.QueryRow(.*,$
  - Prepare(
  - Placeholder
  - squirrel
  - sqlx.Named
  - db.Where(".*\?",
  - .Where(".*\?",
  - .Where(".*=\s*\?"
  - gorm.io/gorm
  - .Create(&
  - .Save(&
  - .First(&
  - .Find(&
  - .Model(&
  - .Updates(map
  - .Pluck(
  - sqlx.Rebind
  - sqlx.In(
  - sq.Select
  - sq.Insert
  - sq.Eq{
  - squirrel.Select
  - squirrel.Eq{
  - ent.Client
  - .Querier
  - chi.URLParam
  - gin.Context
  - echo.Context
  - middleware.Logger
  - middleware.Recover
  context_awareness:
    surrounding_context_patterns:
    - import\s+"database/sql"
    - import\s+"github\.com/jmoiron/sqlx"
    - import\s+"gorm\.io/gorm"
    - import\s+"github\.com/jackc/pgx"
    - import\s+"github\.com/go-sql-driver/mysql"
    - sql\.Open\s*\(
    - gorm\.Open\s*\(
    - sqlx\.Connect\s*\(
    taint_source_indicators:
    - r\.URL\.Query\(\)
    - r\.FormValue\s*\(
    - r\.PostFormValue\s*\(
    - r\.Header\.Get\s*\(
    - r\.Body
    - c\.Query\s*\(
    - c\.Param\s*\(
    - c\.PostForm\s*\(
    - c\.Bind\s*\(
    - c\.BindJSON\s*\(
    - ctx\.QueryParam\s*\(
    - ctx\.Param\s*\(
    - ctx\.FormValue\s*\(
    - chi\.URLParam\s*\(
    - json\.NewDecoder\s*\(r\.Body\)
    - io\.ReadAll\s*\(r\.Body\)
    - mux\.Vars\s*\(
    taint_sink_indicators:
    - db\.Query\s*\(
    - db\.QueryRow\s*\(
    - db\.Exec\s*\(
    - tx\.Query\s*\(
    - tx\.Exec\s*\(
    - \.Raw\s*\(
    - \.Where\s*\(
    - \.Having\s*\(
    - \.Order\s*\(
    - sqlx\.Get\s*\(
    - sqlx\.Select\s*\(
    sanitization_patterns:
    - db\.Prepare\s*\(
    - sqlx\.Named\s*\(
    - sqlx\.Rebind\s*\(
    - squirrel\.
    - sq\.Eq\{
    - sq\.And\{
    - \.Where\s*\(\s*"[^"]*\\?"
    - \.Where\s*\(\s*"[^"]*\\$\\d+"
    - strconv\.Atoi\s*\(
    - strconv\.ParseInt\s*\(
    - regexp\.MustCompile\s*\(
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_probability)
    exploitability_score: 9.5
    base_risk: Critical
    environmental_modifier: Increases if database holds PII or financial data
  exploit_scenario:
    attack_example: 'A Go HTTP handler accepts a username from query parameters and constructs a SQL query via fmt.Sprintf.
      An attacker supplies a crafted username like '' OR ''1''=''1'' -- to bypass authentication or extract all rows.

      '
    example_payload: admin' OR '1'='1' --
    attacker_objective: 'Bypass authentication, extract sensitive data from the database, modify or delete records, or escalate
      to OS command execution via features like xp_cmdshell (SQL Server) or COPY TO PROGRAM (PostgreSQL).

      '
    attack_vector: Network / HTTP request parameters
    exploit_complexity: Low
  confidence_factors:
    pattern_strength: 0.9
    context_match: 0.85
    proximity_to_user_input: 0.95
    sanitization_absence: 0.92
    false_positive_likelihood: Low when fmt.Sprintf with %s is directly inside a query call
    false_negative_likelihood: Medium for multi-step query construction across functions
  impact: 'SQL injection enabling unauthorized data access, modification, deletion,

    and potential command execution through database-specific features. May

    lead to complete database compromise, data exfiltration, and lateral

    movement within the infrastructure.

    '
  remediation: "Use parameterized queries with placeholder syntax:\n\n  // database/sql - PostgreSQL style\n  db.Query(\"\
    SELECT * FROM users WHERE id = $1\", userID)\n\n  // database/sql - MySQL style\n  db.Query(\"SELECT * FROM users WHERE\
    \ id = ?\", userID)\n\n  // Prepared statements\n  stmt, err := db.Prepare(\"SELECT * FROM users WHERE name = $1\")\n\
    \  row := stmt.QueryRow(userName)\n\n  // GORM safe usage\n  db.Where(\"name = ?\", userName).First(&user)\n  db.Where(&User{Name:\
    \ userName}).First(&user)\n  db.Find(&users, \"id IN ?\", []int{1, 2, 3})\n\n  // sqlx named queries\n  sqlx.NamedExec(db,\
    \ \"INSERT INTO users (name) VALUES (:name)\", map[string]interface{}{\"name\": userName})\n\n  // squirrel query builder\n\
    \  sq.Select(\"*\").From(\"users\").Where(sq.Eq{\"id\": userID}).RunWith(db).Query()\n\nNever use fmt.Sprintf or string\
    \ concatenation for SQL queries.\nUse ORM methods that accept structured inputs (maps, structs).\n"
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://pkg.go.dev/database/sql
  - https://gorm.io/docs/security.html
  - https://jmoiron.github.io/sqlx/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
    original_author: security-rules-team
    min_go_version: '1.13'
    applicable_frameworks:
    - database/sql
    - GORM
    - sqlx
    - pgx
    - ent
    - squirrel
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - GO-INJ-002
    - GO-INJ-004
    - GO-AUTH-001
    - GO-CRYPTO-003
    escalation_chain: 'SQL injection may chain with GO-INJ-002 (command injection) if the database supports OS command execution,
      and with GO-AUTH-001 if authentication bypass is the objective.

      '
    data_flow_dependencies:
    - HTTP handler input parsing
    - Middleware authentication checks
    - Database connection pool configuration
  detection_layer: 1
- rule_id: GO-INJ-002
  title: Command Injection via os/exec with User Input
  description: 'Detects os/exec.Command with user-controlled input passed to shell interpreters or directly as command arguments.
    Covers exec.Command, exec.CommandContext, syscall.Exec, and os.StartProcess patterns across common Go web frameworks (net/http,
    gin, echo, chi, fiber).

    '
  language: go
  category: injection
  severity: Critical
  confidence: 0.91
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - os-exec
  - rce
  - syscall
  - process-spawn
  patterns:
  - type: regex
    pattern: exec\.Command\s*\(\s*"(?:sh|bash|cmd|powershell|/bin/sh|/bin/bash)"[^)]*(?:r\.|c\.|ctx\.|request|param|input|user)
  - type: regex
    pattern: exec\.Command\s*\(\s*"(?:sh|bash)"[^)]*"-c"[^)]*(?:r\.|request|param|input|user|fmt\.Sprintf)
  - type: regex
    pattern: exec\.Command\s*\(\s*(?:r\.|c\.|ctx\.|request|param|input|user|cmd|command)\b
  - type: regex
    pattern: exec\.CommandContext\s*\([^,]*,\s*"(?:sh|bash)"[^)]*(?:r\.|request|param|input)
  - type: regex
    pattern: exec\.Command\s*\(\s*"(?:sh|bash|cmd|powershell|/bin/sh|/bin/bash)"[^)]*"-c"[^)]*\+\s*\w+
    description: Shell command with argument built via string concatenation
  - type: regex
    pattern: exec\.Command\s*\(\s*fmt\.Sprintf\s*\(
    description: Command name or arguments built with fmt.Sprintf
  - type: regex
    pattern: syscall\.Exec\s*\(\s*(?:r\.|c\.|ctx\.|request|param|input|user|cmd|command|path|file)\b
    description: Direct syscall.Exec with user-controlled binary path
  - type: regex
    pattern: os\.StartProcess\s*\(\s*(?:r\.|c\.|ctx\.|request|param|input|user|cmd|command|path|file)\b
    description: os.StartProcess with user-controlled process path
  - type: regex
    pattern: exec\.Command\s*\(\s*(?:filepath\.Join|path\.Join)\s*\([^)]*(?:r\.|c\.|ctx\.|request|param|input|user)
    description: Command path built from user-controlled path segments
  - type: regex
    pattern: exec\.(?:Command|CommandContext)\s*\([^)]*(?:os\.Args|flag\.Arg)\s*\(
    description: Command injection through CLI arguments that may be user-controlled
  - type: regex
    pattern: (?:cmd|command)\s*:?=\s*(?:r\.|c\.|ctx\.|request|param|input)[^;]*\n[^;]*exec\.Command\s*\(
    description: Variable assigned from user input then passed to exec.Command
  - type: regex
    pattern: exec\.Command\s*\(\s*"(?:curl|wget|ping|nslookup|dig|traceroute|nmap)"[^)]*(?:r\.|c\.|ctx\.|request|param|input|user)
    description: Network utility command with user-controlled arguments
  anti_patterns:
  - filepath.Clean
  - regexp.MustCompile
  - allowlist
  - whitelist
  - filepath.Base(
  - filepath.Ext(
  - path.Clean(
  - shellescape.Quote
  - shlex.Split
  - strings.ContainsAny
  - strings.ContainsRune
  - validCommands[
  - allowedCommands[
  - commandMap[
  - switch cmd {
  - switch command {
  - chi.URLParam
  - gin.H{
  - echo.Map{
  - middleware.RateLimiter
  - middleware.BasicAuth
  context_awareness:
    surrounding_context_patterns:
    - import\s+"os/exec"
    - import\s+"syscall"
    - import\s+"os"
    - exec\.Command\s*\(
    - exec\.CommandContext\s*\(
    - syscall\.Exec\s*\(
    - os\.StartProcess\s*\(
    taint_source_indicators:
    - r\.URL\.Query\(\)
    - r\.FormValue\s*\(
    - r\.PostFormValue\s*\(
    - r\.Header\.Get\s*\(
    - c\.Query\s*\(
    - c\.Param\s*\(
    - c\.PostForm\s*\(
    - ctx\.QueryParam\s*\(
    - ctx\.Param\s*\(
    - chi\.URLParam\s*\(
    - json\.NewDecoder\s*\(r\.Body\)
    - io\.ReadAll\s*\(r\.Body\)
    - os\.Getenv\s*\(
    - os\.Args\b
    - flag\.String\s*\(
    taint_sink_indicators:
    - exec\.Command\s*\(
    - exec\.CommandContext\s*\(
    - syscall\.Exec\s*\(
    - os\.StartProcess\s*\(
    - \.Run\s*\(\)
    - \.Output\s*\(\)
    - \.CombinedOutput\s*\(\)
    - \.Start\s*\(\)
    sanitization_patterns:
    - filepath\.Clean\s*\(
    - filepath\.Base\s*\(
    - regexp\.MustCompile\s*\(
    - regexp\.MatchString\s*\(
    - shellescape\.Quote\s*\(
    - strconv\.Atoi\s*\(
    - strconv\.ParseInt\s*\(
    - strings\.ContainsAny\s*\(
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * exploitability_score / 10
    exploitability_score: 9.8
    base_risk: Critical
    environmental_modifier: Maximum risk if application runs with elevated privileges
  exploit_scenario:
    attack_example: 'A Go web handler accepts a hostname from the user and passes it to exec.Command("ping", "-c", "4", hostname).
      An attacker supplies "8.8.8.8; cat /etc/passwd" or "8.8.8.8$(whoami)" as the hostname to execute arbitrary commands
      on the server.

      '
    example_payload: 8.8.8.8; cat /etc/passwd
    attacker_objective: 'Achieve remote code execution on the server to install backdoors, exfiltrate data, pivot to internal
      networks, or establish persistent access via reverse shells.

      '
    attack_vector: Network / HTTP request parameters, headers, or body
    exploit_complexity: Low
  confidence_factors:
    pattern_strength: 0.92
    context_match: 0.88
    proximity_to_user_input: 0.94
    sanitization_absence: 0.9
    false_positive_likelihood: Low when shell invocation with -c flag is present
    false_negative_likelihood: Medium for indirect command construction via helper functions
  impact: 'Remote code execution on the server. An attacker can inject shell

    metacharacters to execute arbitrary OS commands, potentially leading

    to complete system compromise, data exfiltration, ransomware deployment,

    or lateral movement within the network.

    '
  remediation: "Pass command and arguments separately to exec.Command (never via shell -c):\n\n  // SAFE: Arguments are separate\
    \ parameters\n  exec.Command(\"ls\", \"-la\", safeDir)\n\n  // UNSAFE: User input passed to shell\n  exec.Command(\"sh\"\
    , \"-c\", userInput)\n\n  // SAFE: Validate input against strict allowlists\n  allowedCmds := map[string]bool{\"status\"\
    : true, \"info\": true}\n  if !allowedCmds[userInput] {\n      return fmt.Errorf(\"command not allowed\")\n  }\n\n  //\
    \ SAFE: Use Go standard library instead of shell commands\n  entries, err := os.ReadDir(dir)  // instead of exec.Command(\"\
    ls\", dir)\n\n  // With gin framework - validate before use\n  func handler(c *gin.Context) {\n      hostname := c.Query(\"\
    host\")\n      if !isValidHostname(hostname) {\n          c.JSON(400, gin.H{\"error\": \"invalid hostname\"})\n      \
    \    return\n      }\n      cmd := exec.Command(\"ping\", \"-c\", \"4\", hostname)\n  }\n\n  // With echo framework\n\
    \  func handler(c echo.Context) error {\n      name := c.Param(\"name\")\n      if !regexp.MustCompile(`^[a-zA-Z0-9_-]+$`).MatchString(name)\
    \ {\n          return c.JSON(400, echo.Map{\"error\": \"invalid input\"})\n      }\n  }\n\nUse filepath.Clean and filepath.Base\
    \ to sanitize path inputs.\nUse Go standard library functions instead of shell commands whenever possible.\n"
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://pkg.go.dev/os/exec
  - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
    original_author: security-rules-team
    min_go_version: '1.13'
    applicable_frameworks:
    - os/exec
    - syscall
    - net/http
    - gin
    - echo
    - chi
    - fiber
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - GO-INJ-001
    - GO-INJ-005
    - GO-PATH-001
    escalation_chain: 'Command injection is often the final stage of an exploit chain. It may be reached via SQL injection
      (GO-INJ-001) through database command execution features, or via path traversal (GO-PATH-001) that allows overwriting
      executable scripts.

      '
    data_flow_dependencies:
    - HTTP handler input parsing
    - Middleware authentication and authorization
    - Input validation functions
  detection_layer: 1
- rule_id: GO-INJ-003
  title: Template Injection via html/template or text/template
  description: 'Detects Go template parsing with user-controlled template strings using text/template (which lacks auto-escaping)
    or html/template with user-controlled template definitions. Covers direct Parse calls, template composition abuse, and
    custom function map injection.

    '
  language: go
  category: injection
  severity: High
  confidence: 0.86
  cwe: CWE-94
  owasp: A03:2021-Injection
  tags:
  - template-injection
  - ssti
  - text-template
  - html-template
  - xss
  patterns:
  - type: regex
    pattern: template\.New\s*\([^)]*\)\.Parse\s*\(\s*(?:r\.|c\.|request|param|input|user|data|body)\b
  - type: regex
    pattern: template\.Must\s*\(\s*template\.New\s*\([^)]*\)\.Parse\s*\(\s*(?:r\.|c\.|request|param|input|user)\b
  - type: regex
    pattern: '"text/template"'
  - type: regex
    pattern: template\.New\s*\([^)]*\)\.Parse\s*\(\s*fmt\.Sprintf\s*\(
  - type: regex
    pattern: template\.New\s*\([^)]*\)\.Funcs\s*\([^)]*\)\.Parse\s*\(\s*(?:r\.|c\.|request|param|input|user|data|body)\b
    description: Template with custom FuncMap parsing user-controlled string
  - type: regex
    pattern: template\.New\s*\([^)]*\)\.Parse\s*\(\s*string\s*\([^)]*\)\s*\)
    description: Template parsing a byte slice converted to string (possible user input)
  - type: regex
    pattern: \.Execute\s*\([^,]*,\s*(?:r\.|c\.|request|param|input|user|data|body)\b
    description: Template execution with user-controlled data context
  - type: regex
    pattern: \.ExecuteTemplate\s*\([^,]*,\s*(?:r\.|c\.|request|param|input|user)\b
    description: ExecuteTemplate with user-controlled template name selection
  - type: regex
    pattern: template\.(?:New|Must)\s*\([^)]*\)\.Parse\s*\(\s*(?:buf|buffer|content|tmpl|tpl|templateStr|templateString|templateBody)\b
    description: Template parsing a variable that may hold user-controlled content
  - type: regex
    pattern: template\.HTML\s*\(\s*(?:r\.|c\.|request|param|input|user|data|body)\b
    description: Unsafe template.HTML cast of user-controlled input bypassing escaping
  - type: regex
    pattern: template\.(?:JS|JSStr|CSS|URL)\s*\(\s*(?:r\.|c\.|request|param|input|user)\b
    description: Unsafe template type cast (JS/CSS/URL) with user-controlled input
  anti_patterns:
  - '"html/template"'
  - template.HTMLEscapeString
  - ParseFiles
  - ParseGlob
  - template.HTMLEscaper
  - template.JSEscaper
  - template.URLQueryEscaper
  - html.EscapeString
  - url.QueryEscape
  - url.PathEscape
  - bluemonday
  - sanitize
  - .ParseFS(
  - embed.FS
  - gin.H{
  - c.HTML(
  - echo.Renderer
  - chi.URLParam
  - middleware.Logger
  context_awareness:
    surrounding_context_patterns:
    - import\s+"text/template"
    - import\s+"html/template"
    - template\.New\s*\(
    - template\.Must\s*\(
    - template\.ParseFiles\s*\(
    - \.Execute\s*\(
    - \.ExecuteTemplate\s*\(
    taint_source_indicators:
    - r\.FormValue\s*\(
    - r\.URL\.Query\(\)
    - r\.PostFormValue\s*\(
    - io\.ReadAll\s*\(r\.Body\)
    - c\.Query\s*\(
    - c\.Param\s*\(
    - c\.PostForm\s*\(
    - ctx\.QueryParam\s*\(
    - ctx\.FormValue\s*\(
    - json\.NewDecoder\s*\(r\.Body\)
    - chi\.URLParam\s*\(
    taint_sink_indicators:
    - \.Parse\s*\(
    - \.Execute\s*\(
    - \.ExecuteTemplate\s*\(
    - template\.HTML\s*\(
    - template\.JS\s*\(
    - template\.CSS\s*\(
    - template\.URL\s*\(
    sanitization_patterns:
    - template\.HTMLEscapeString\s*\(
    - html\.EscapeString\s*\(
    - url\.QueryEscape\s*\(
    - url\.PathEscape\s*\(
    - bluemonday\.UGCPolicy
    - bluemonday\.StrictPolicy
    - template\.ParseFiles\s*\(
    - template\.ParseGlob\s*\(
    - template\.ParseFS\s*\(
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * context_match
    exploitability_score: 7.5
    base_risk: High
    environmental_modifier: Critical if text/template is used for web-facing output
  exploit_scenario:
    attack_example: 'A Go web application accepts a user-provided template string to customize an email or page layout. The
      attacker injects {{.Password}} or Go template actions like {{printf "%s" .SecretKey}} to extract sensitive data from
      the template execution context, or uses text/template to call arbitrary methods on passed objects.

      '
    example_payload: '{{printf "%s" .SecretKey}}'
    attacker_objective: 'Extract sensitive data from template execution context, execute arbitrary methods on objects passed
      to the template, or achieve cross-site scripting (XSS) when text/template is used for HTML.

      '
    attack_vector: Network / HTTP request parameters or stored user content
    exploit_complexity: Medium
  confidence_factors:
    pattern_strength: 0.85
    context_match: 0.8
    proximity_to_user_input: 0.88
    sanitization_absence: 0.85
    false_positive_likelihood: Medium - text/template import alone does not confirm vulnerability
    false_negative_likelihood: Medium for template strings built across multiple functions
  impact: 'Server-side template injection in Go''s text/template package allows

    arbitrary function calls and data access through template actions.

    Using text/template instead of html/template also enables XSS.

    In severe cases, template injection can lead to information disclosure

    of internal application state, secrets, and configuration.

    '
  remediation: "Use html/template instead of text/template for web output:\n\n  // SAFE: html/template auto-escapes output\n\
    \  import \"html/template\"\n  tmpl := template.Must(template.ParseFiles(\"page.html\"))\n  tmpl.Execute(w, data)\n\n\
    \  // SAFE: Use ParseFiles/ParseGlob with pre-defined templates\n  tmpl := template.Must(template.ParseGlob(\"templates/*.html\"\
    ))\n  tmpl.ExecuteTemplate(w, \"page.html\", data)\n\n  // SAFE: Embedded filesystem templates (Go 1.16+)\n  //go:embed\
    \ templates/*\n  var templateFS embed.FS\n  tmpl := template.Must(template.ParseFS(templateFS, \"templates/*.html\"))\n\
    \n  // UNSAFE: Never parse user-controlled strings as templates\n  tmpl := template.New(\"x\").Parse(userInput)  // VULNERABLE\n\
    \n  // UNSAFE: template.HTML bypasses escaping\n  template.HTML(userInput)  // VULNERABLE to XSS\n\n  // With gin framework\n\
