    context_match: 0.78
    proximity_to_user_input: 0.85
    sanitization_absence: 0.8
    false_positive_likelihood: Medium - plugin.Open with hardcoded paths is safe
    false_negative_likelihood: High for indirect assignment chains from user input to reflect calls
  impact: 'Dynamic plugin loading or reflection with user-controlled names can

    execute arbitrary code or access unintended struct fields and methods.

    Plugin injection leads to full remote code execution. Reflect-based

    dispatch can bypass authorization by invoking admin-only methods,

    and unsafe pointer manipulation can cause memory corruption or

    information disclosure.

    '
  remediation: "Never load plugins based on user input:\n\n  // UNSAFE: User-controlled plugin path\n  p, err := plugin.Open(userInput)\
    \  // VULNERABLE\n\n  // SAFE: Use a strict allowlist for permitted plugin paths\n  allowedPlugins := map[string]string{\n\
    \      \"auth\":    \"/opt/plugins/auth.so\",\n      \"logging\": \"/opt/plugins/logging.so\",\n  }\n  pluginPath, ok\
    \ := allowedPlugins[userInput]\n  if !ok {\n      return fmt.Errorf(\"unknown plugin: %s\", userInput)\n  }\n  p, err\
    \ := plugin.Open(pluginPath)\n\n  // UNSAFE: Reflect dispatch with user input\n  reflect.ValueOf(svc).MethodByName(userInput).Call(nil)\
    \  // VULNERABLE\n\n  // SAFE: Use explicit function dispatch maps instead of reflection\n  handlers := map[string]func()\
    \ error{\n      \"create\": svc.Create,\n      \"delete\": svc.Delete,\n      \"list\":   svc.List,\n  }\n  handler, ok\
    \ := handlers[userInput]\n  if !ok {\n      return fmt.Errorf(\"unknown action: %s\", userInput)\n  }\n  return handler()\n\
    \n  // With gin framework\n  func pluginHandler(c *gin.Context) {\n      name := c.Param(\"plugin\")\n      if _, ok :=\
    \ allowedPlugins[name]; !ok {\n          c.JSON(403, gin.H{\"error\": \"plugin not allowed\"})\n          return\n   \
    \   }\n  }\n\n  // With echo framework\n  func actionHandler(c echo.Context) error {\n      action := c.Param(\"action\"\
    )\n      handler, ok := actionMap[action]\n      if !ok {\n          return c.JSON(400, echo.Map{\"error\": \"invalid\
    \ action\"})\n      }\n      return handler(c)\n  }\n\nAvoid reflect.MethodByName/FieldByName with user-controlled strings.\n\
    Use filepath.Clean and filepath.Base to sanitize path inputs before any file operation.\nNever use unsafe.Pointer with\
    \ data derived from user input.\n"
