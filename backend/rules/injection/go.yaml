  exploit_scenario:
    attack_example: 'A Go application authenticates users against Active Directory by searching for their account with an
      LDAP filter built via fmt.Sprintf: fmt.Sprintf("(sAMAccountName=%s)", username). An attacker submits the username "admin)(|(cn=*"
      to modify the filter logic and bypass authentication checks.

      '
    example_payload: admin)(|(cn=*)
    attacker_objective: 'Bypass authentication, enumerate directory users and groups, extract sensitive attributes (email,
