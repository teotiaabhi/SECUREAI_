  exploit_scenario:
    attack_example: 'A C++ web server serves static files by concatenating a document root with the request URI: fopen((docroot
      + request_path).c_str(), "r"). An attacker sends GET /../../../../etc/shadow HTTP/1.1 to traverse out of the document
      root and read the system password shadow file. If the server also supports PUT requests for file upload, the attacker
      can write a cron job or SSH authorized_keys entry to gain persistent shell access.

      '
    example_payload: GET /static/../../../../../../../etc/passwd HTTP/1.1
    attacker_objective: Escape the intended file serving directory to read sensitive system files (credential theft, source
      code access) or write arbitrary files (web shell upload, cron job injection, SSH key injection).
