  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + vtable_presence_factor + polymorphism_depth_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A C++ game server receives player action messages over the network. Each message contains a type_id byte
      followed by message data. The server uses static_cast<ActionMove*>(base_msg) when type_id == 1 and static_cast<ActionAttack*>(base_msg)
      when type_id == 2. An attacker sends a message with type_id=1 but crafts the payload with the layout of ActionAttack,
      which has a function pointer at a different offset. When the server calls base_msg->execute() after casting to ActionMove,
      the vtable lookup dereferences attacker-controlled bytes as a function pointer, redirecting execution to shellcode embedded
      in the message payload.

      '
    example_payload: type_id=0x01 + 48 bytes padding + 0xdeadbeef (fake vtable ptr) + shellcode
    attacker_objective: Exploit type confusion to corrupt vtable pointers or access fields at wrong offsets, achieving arbitrary
      code execution or sensitive data leakage through confused object interpretation.
