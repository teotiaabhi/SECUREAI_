- rule_id: CPP-INJ-005
  title: Integer Overflow in Memory Allocation
  description: 'Detects integer overflow or wraparound vulnerabilities in size calculations used for memory allocation. When
    an arithmetic operation on user-controlled values overflows before being passed to malloc, calloc, new, or similar allocators,
    the resulting buffer is undersized. Subsequent writes into this buffer using the original (pre-overflow) size cause heap
    buffer overflows, enabling heap corruption, arbitrary code execution, and denial of service.

    '
  language: cpp
  category: injection
  severity: High
  confidence: 0.89
  cwe: CWE-190
  owasp: A03:2021-Injection
  tags:
  - integer-overflow
  - memory-allocation
  - heap-overflow
  - wraparound
  - size-calculation
  - denial-of-service
  - arbitrary-write
  detection_layer: 2
  attack_surface_type: arithmetic-memory-boundary
  patterns:
  - type: regex
    description: malloc with arithmetic expression on user-controlled size
    pattern: \bmalloc\s*\(\s*(?:argv|user_input|input|param|size|len|count|num|n)\s*\*\s*(?:sizeof|size|len|\d+)\s*\)
  - type: regex
    description: calloc with user-controlled count and size parameters
    pattern: \bcalloc\s*\(\s*(?:argv|user_input|input|param|count|num|n)\s*,\s*(?:sizeof|size|len|\d+)\s*\)
  - type: regex
    description: new[] operator with unchecked multiplication in size expression
    pattern: \bnew\s+\w+\s*\[\s*(?:argv|user_input|input|param|count|num|n)\s*\*
  - type: regex
    description: realloc with arithmetic on sizes without overflow check
    pattern: \brealloc\s*\(\s*\w+\s*,\s*\w+\s*\*\s*(?:sizeof|\d+|size|len)\s*\)
  - type: regex
    description: Addition-based size calculation without overflow check before allocation
    pattern: \b(?:malloc|calloc|realloc)\s*\(\s*\w+\s*\+\s*\w+\s*\)
  - type: regex
    description: Shift-based size calculation risking overflow
    pattern: \b(?:malloc|new\s+\w+\s*\[)\s*(?:\w+\s*<<\s*\d+)
  - type: regex
    description: VirtualAlloc/HeapAlloc with unchecked user-controlled size on Windows
    pattern: \b(?:VirtualAlloc|HeapAlloc|GlobalAlloc|LocalAlloc)\s*\([^)]*(?:argv|user_input|input|param|size|count)\s*\*
  - type: regex
    description: mmap with user-influenced length parameter
    pattern: \bmmap\s*\([^)]*(?:argv|user_input|input|param|size|count)\s*\*
  anti_patterns:
  - SafeInt
  - safe_mul
  - checked_mul
  - __builtin_mul_overflow
  - __builtin_add_overflow
  - std::numeric_limits
  - UINT_MAX
  - SIZE_MAX
  - if.*> SIZE_MAX
  - if.*overflow
  - safemath
  - CheckedNumeric
  bypass_variants:
  - description: Overflow in intermediate variable before passing to allocator
    pattern: \w+\s*=\s*\w+\s*\*\s*(?:sizeof|\d+)\s*;[^}]*\b(?:malloc|new)\s*[\(\[]\s*\w+
  - description: Truncation via implicit narrowing cast before allocation
    pattern: \b(?:unsigned\s+short|uint16_t|unsigned\s+char)\s+\w+\s*=\s*\w+\s*\*\s*\w+\s*;[^}]*\b(?:malloc|new)
  evasion_indicators:
  - Size calculation split across multiple statements to hide overflow
  - Intermediate cast to smaller integer type truncating the result
  - Multiplication result stored in 32-bit variable on 64-bit platform
  - Size parameter read from untrusted file header or network packet field
  encoding_variants:
  - type: macro_hidden_arithmetic
    pattern: \b(?:ALLOC_ARRAY|ARRAY_SIZE|CALC_SIZE)\s*\(\s*\w+\s*,\s*\w+\s*\)
  - type: template_arithmetic
    pattern: \b(?:alloc|allocate|create_buffer)\s*<[^>]+>\s*\(\s*\w+\s*\*\s*\w+\s*\)
  multi_function_chain_patterns:
  - read_size_from_input -> multiply_by_element_size -> malloc(undersized) -> memcpy(original_size)
  - parse_header(count) -> count * sizeof(element) -> new[overflowed_size] -> fill_array(count)
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Undersized heap allocation from integer overflow enables controlled heap buffer overflow, which can
      corrupt adjacent heap metadata or objects for arbitrary write primitives.
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: User-supplied size/count field from network packet, file header, or API parameter
    sink: malloc/calloc/new[] allocation size argument
    through: Unchecked arithmetic multiplication or addition that wraps around, producing a small allocation for a large logical
      size
  - source: Parsed integer from untrusted serialized data (protobuf, JSON, binary)
    sink: Buffer allocation followed by memcpy/loop fill using original pre-overflow count
    through: Implicit truncation or unsigned wraparound in size computation
  impact: "Integer overflow in allocation sizes is a high-severity vulnerability class\nthat directly leads to heap buffer\
    \ overflows. The undersized buffer is\nfilled using the original (non-overflowed) size, corrupting adjacent heap\nchunks.\
    \ This enables:\n  - Heap metadata corruption for arbitrary write primitives\n  - Overwriting adjacent heap-allocated\
    \ objects (vtable pointers, function pointers)\n  - Reliable exploitation via heap grooming/feng shui techniques\n  -\
    \ Denial of service through heap corruption and crashes\nThis vulnerability class has been exploited extensively in image\
    \ parsers,\nmedia codecs, network protocol implementations, and file format handlers.\n"
  remediation: "Framework-specific fixes:\n  - GCC/Clang: use __builtin_mul_overflow() and __builtin_add_overflow() for checked\
    \ arithmetic\n  - MSVC: use SafeInt<T> or IntSafe.h (UIntMult, SizeTMult) from the Windows SDK\n  - Chromium: use base::CheckedNumeric<T>\
    \ or base::StrictNumeric<T>\n  - Rust FFI: perform size calculations in Rust with checked arithmetic before calling C\
    \ allocators\nSecure libraries:\n  - SafeInt library (Microsoft) for overflow-safe integer arithmetic\n  - Boost.SafeNumerics\
    \ for compile-time and runtime overflow detection\n  - Google Abseil safe integer utilities (absl::uint128)\n  - GCC/Clang\
    \ __builtin_*_overflow family of builtins\n  - CERT INT32-C compliant arithmetic wrappers\nPrevention strategies:\n  -\
    \ Always validate that size * count and size + offset cannot overflow before allocation\n  - Use calloc(count, size) which\
    \ internally checks for overflow (on conforming implementations)\n  - Prefer size_t for all size computations and check\
    \ against SIZE_MAX / element_size\n  - Set maximum allocation limits based on application context\n  - Use AddressSanitizer\
    \ to detect heap overflows from undersized allocations\n  - Enable UBSan (-fsanitize=undefined) to trap signed integer\
    \ overflow\n  - Enable -ftrapv for signed overflow trapping in debug/test builds\n  - Use static analysis tools (Coverity,\
    \ PVS-Studio) to detect unchecked arithmetic\n  - Fuzz allocation paths with AFL/libFuzzer to discover overflow-triggered\
    \ crashes\n"
  references:
  - https://cwe.mitre.org/data/definitions/190.html
  - https://wiki.sei.cmu.edu/confluence/display/c/INT32-C.+Ensure+that+operations+on+signed+integers+do+not+result+in+overflow
  - https://cheatsheetseries.owasp.org/cheatsheets/C-Based_Toolchain_Hardening_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - '#include <stdlib.h>'
    - '#include <cstdlib>'
    - '#include <new>'
    - '#include <cstdint>'
    - '#include <limits>'
    - '#include <climits>'
    - size_t
    - uint32_t
    - unsigned int
    taint_source_indicators:
    - argv[
    - std::cin
    - scanf(
    - fgets(
    - recv(
    - read(
    - fread(
    - getline(
    - atoi(
    - strtoul(
    - strtol(
    - sscanf(
    - ntohl(
    - ntohs(
    taint_sink_indicators:
    - malloc(
    - calloc(
    - realloc(
    - 'new '
    - new[]
    - VirtualAlloc(
    - HeapAlloc(
    - mmap(
    - operator new(
    - aligned_alloc(
    sanitization_patterns:
    - __builtin_mul_overflow
    - __builtin_add_overflow
    - SafeInt
    - CheckedNumeric
    - numeric_limits
    - SIZE_MAX
    - UINT_MAX
    - if.*overflow
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 + user_controlled_size_factor + adjacent_object_sensitivity_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'An image parser reads width and height from a BMP file header as 32-bit unsigned integers. It computes
      buffer_size = width * height * 4 (bytes per pixel). An attacker crafts a BMP with width=65536 and height=65537, causing
      the multiplication to overflow to a small value on 32-bit builds. The parser allocates a tiny buffer but writes width*height*4
      bytes of pixel data, overflowing the heap and overwriting adjacent allocations. The attacker grooms the heap to place
      a C++ object with a virtual method table next to the image buffer, hijacking the vtable pointer to gain code execution.

      '
    example_payload: 'BMP header: width=0x10000, height=0x10001, bpp=32 -> size overflows to 0x40000 on 32-bit'
    attacker_objective: Cause an undersized heap allocation via integer overflow in size computation, then exploit the resulting
      heap buffer overflow for arbitrary code execution or information disclosure.
  confidence_factors:
    pattern_strength: medium
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - CPP-INJ-003
    - CPP-INJ-004
    - CPP-INJ-006
- rule_id: CPP-INJ-006
  title: Unvalidated Array Index
  description: 'Detects array or buffer access using user-controlled indices without proper bounds validation. When an attacker
    controls the index used to read from or write to an array, they can achieve out-of-bounds read (information disclosure,
    ASLR bypass) or out-of-bounds write (arbitrary memory corruption, code execution). This is a prevalent vulnerability class
    in C/C++ due to the absence of automatic bounds checking on raw arrays and pointer arithmetic.

    '
  language: cpp
  category: injection
  severity: High
  confidence: 0.88
  cwe: CWE-129
  owasp: A03:2021-Injection
  tags:
  - array-index
  - out-of-bounds
  - bounds-check
  - memory-read
  - memory-write
  - information-disclosure
  - arbitrary-write
  detection_layer: 2
  attack_surface_type: array-boundary
  patterns:
  - type: regex
    description: Array indexed by user-controlled variable without bounds check
    pattern: \b\w+\s*\[\s*(?:argv|user_input|input|param|index|idx|offset|pos|i)\s*\]
  - type: regex
    description: Pointer arithmetic with user-controlled offset for array access
    pattern: \*\s*\(\s*\w+\s*\+\s*(?:argv|user_input|input|param|index|idx|offset)\s*\)
  - type: regex
    description: Write to array element using user-controlled index
    pattern: \b\w+\s*\[\s*(?:argv|user_input|input|index|idx|offset)\s*\]\s*=
  - type: regex
    description: atoi/strtol result used directly as array index
    pattern: \b(?:atoi|atol|strtol|strtoul|strtoimax)\s*\([^)]+\)[^;]*\w+\s*\[
  - type: regex
    description: Network-received integer used as array index without validation
    pattern: \b(?:ntohl|ntohs|recv|read)\s*\([^)]*\)[^;]*\w+\s*\[
  - type: regex
    description: Vector or array accessed with unchecked index from external source
    pattern: \b\w+\s*\.\s*(?:at|operator\[\])\s*\(\s*(?:argv|user_input|input|param|index|idx)\s*\)
  - type: regex
    description: Computed index from parsed data used in buffer access
    pattern: \b(?:sscanf|fscanf|scanf)\s*\([^)]*(?:&\s*(?:index|idx|offset|pos))\s*\)[^}]*\w+\s*\[\s*(?:index|idx|offset|pos)\s*\]
  - type: regex
    description: Negative index possible with signed integer type
    pattern: \bint\s+(?:index|idx|offset|pos)\s*=[^;]*;[^}]*\w+\s*\[\s*(?:index|idx|offset|pos)\s*\]
  anti_patterns:
  - if.*index.*<.*size
  - if.*idx.*<.*length
  - if.*<.*capacity
  - assert(
  - bounds_check
  - .at(
  - std::clamp
  - gsl::at
  - if.*>= 0 &&
  - if.*index.*>=.*0
  - std::span
  - gsl::span
  bypass_variants:
  - description: Signed integer index allowing negative values to bypass upper-bound-only check
    pattern: \bif\s*\(\s*\w+\s*<\s*\w+\s*\)[^}]*\w+\s*\[\s*\w+\s*\]
  - description: Index validated in one code path but not in another (conditional bypass)
    pattern: \bif\s*\([^)]*\)\s*\{[^}]*\}\s*else\s*\{[^}]*\w+\s*\[\s*(?:index|idx|offset)\s*\]
  - description: 'TOCTOU: index validated then modified before use'
    pattern: \bif\s*\(\s*(\w+)\s*<[^}]*\1\s*(?:\+\+|\+=|--)[\s;][^}]*\w+\s*\[\s*\1\s*\]
  evasion_indicators:
  - Index computed through multiple intermediate arithmetic operations
  - Bounds check on a different variable than the one actually used as index
  - Signed/unsigned conversion allowing negative index bypass
  - Index modified by callback or concurrent thread between validation and use
  encoding_variants:
  - type: indirect_index
    pattern: \b\w+\s*\[\s*\w+\s*\[\s*(?:argv|user_input|input|param)\s*\]\s*\]
  - type: computed_offset
    pattern: \b\w+\s*\[\s*(?:argv|user_input|input|param)\s*\*\s*\d+\s*\+\s*\d+\s*\]
  - type: function_return_index
    pattern: \b\w+\s*\[\s*(?:get_index|parse_offset|compute_idx)\s*\([^)]*\)\s*\]
  multi_function_chain_patterns:
  - read_integer_from_network -> use_as_array_index -> out_of_bounds_access
  - parse_user_field(offset) -> table[offset] -> return sensitive data (OOB read)
  - atoi(argv[1]) -> buffer[index] = value -> arbitrary write primitive
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Out-of-bounds write via controlled index enables overwriting function pointers, vtable entries, or
      return addresses in adjacent memory for privilege escalation.
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: User-supplied integer from command-line argument, form field, network packet, or file
    sink: Array subscript operator [] or pointer arithmetic dereference
    through: Parsed integer value used directly as index without bounds validation against array size
  - source: Deserialized index field from binary protocol or file format
    sink: Lookup table or configuration array access
    through: Index passed through conversion functions (atoi, ntohl) to array access without range check
  impact: "Unvalidated array indices enable two critical attack classes:\n  - Out-of-bounds read: leaking sensitive data from\
    \ adjacent memory,\n    including cryptographic keys, session tokens, ASLR base addresses,\n    and stack canary values.\
    \ This can be chained with other exploits.\n  - Out-of-bounds write: corrupting adjacent heap/stack objects including\n\
    \    function pointers, vtable pointers, return addresses, and security-\n    critical flags. This directly enables arbitrary\
    \ code execution.\nThe Heartbleed vulnerability (CVE-2014-0160) is a canonical example of\nOOB read via missing bounds\
    \ check. Array index bugs in kernel drivers\nfrequently lead to local privilege escalation.\n"
  remediation: "Framework-specific fixes:\n  - Modern C++: use std::vector::at() or std::array::at() for bounds-checked access\n\
    \  - C++ GSL: use gsl::at() for bounds-checked array/span access\n  - C: always validate index >= 0 && index < array_size\
    \ before access\n  - Qt: use QVector::value() with default return for safe out-of-range access\nSecure libraries:\n  -\
    \ C++ Standard Library containers with .at() method (throws std::out_of_range)\n  - gsl::span and gsl::at from Guideline\
    \ Support Library\n  - Boost.MultiArray with bounds-checked access modes\n  - SafeInt for safe index arithmetic\nPrevention\
    \ strategies:\n  - Always validate both lower bound (>= 0) and upper bound (< size) for indices\n  - Use unsigned types\
    \ (size_t) for indices and sizes to eliminate negative index attacks\n  - Prefer range-based for loops over manual indexing\n\
    \  - Use std::span (C++20) to carry size information with pointers\n  - Enable UBSan (-fsanitize=undefined) for runtime\
    \ out-of-bounds detection\n  - Use ASan (-fsanitize=address) for heap/stack buffer overflow detection\n  - Apply compiler\
    \ hardening: -fbounds-checking (GCC), -fsanitize=bounds (Clang)\n  - Use static analysis (Coverity, PVS-Studio, Polyspace)\
    \ to detect missing bounds checks\n  - Fuzz array access paths with AFL/libFuzzer to discover edge cases\n"
  references:
  - https://cwe.mitre.org/data/definitions/129.html
  - https://wiki.sei.cmu.edu/confluence/display/c/ARR30-C.+Do+not+form+or+use+out-of-bounds+pointers+or+array+subscripts
  - https://cwe.mitre.org/data/definitions/787.html
  context_awareness:
    surrounding_context_patterns:
    - '#include <stdlib.h>'
    - '#include <cstdlib>'
    - '#include <vector>'
    - '#include <array>'
    - '#include <cstring>'
    - int main(
    - char.*\[.*\]
    - int.*\[.*\]
    taint_source_indicators:
    - argv[
    - std::cin
    - scanf(
    - fgets(
    - recv(
    - read(
    - fread(
    - atoi(
    - atol(
    - strtol(
    - strtoul(
    - sscanf(
    - ntohl(
    - ntohs(
    taint_sink_indicators:
    - array[
    - buffer[
    - table[
    - data[
    - ptr[
    - '*(ptr +'
    - '*(base +'
    - .operator[](
    - vector[
    sanitization_patterns:
    - if.*< size
    - if.*< length
    - if.*< capacity
    - if.*>= 0
    - assert(
    - .at(
    - gsl::at
    - std::clamp
    - bounds_check
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 + write_vs_read_factor + adjacent_object_criticality)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A network protocol parser reads a message type field as a uint8_t from the wire, then uses it to index
      into a function pointer dispatch table: handler_table[msg_type](payload). The table has 16 entries but msg_type can
      be 0-255. An attacker sends msg_type=200, causing an out-of-bounds read of the handler_table. If the memory at that
      offset happens to contain an attacker-influenced value (via heap spraying or adjacent data control), the indirect call
      jumps to attacker-controlled code. Even without write access, the OOB read leaks function pointers that defeat ASLR.

      '
    example_payload: msg_type=0xFF to read function pointer 240 entries past the table boundary
    attacker_objective: Use an out-of-bounds array index to read sensitive memory (ASLR bypass, credential theft) or write
      to arbitrary memory locations (function pointer hijacking, privilege escalation).
  confidence_factors:
    pattern_strength: medium
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - CPP-INJ-003
    - CPP-INJ-005
    - CPP-INJ-004
- rule_id: CPP-INJ-007
  title: Path Traversal via File Operations
  description: 'Detects path traversal vulnerabilities in C++ file operations where user-controlled input is passed to fopen,
    ifstream, ofstream, or other file I/O functions without proper path validation. Attackers can use directory traversal
    sequences (../ or ..\) to escape intended directories, reading sensitive files such as /etc/passwd, /etc/shadow, configuration
    files, private keys, or writing to arbitrary filesystem locations to overwrite executables, cron jobs, or configuration
    files.

    '
  language: cpp
  category: injection
  severity: High
  confidence: 0.9
  cwe: CWE-22
  owasp: A01:2021-Broken Access Control
  tags:
  - path-traversal
  - directory-traversal
  - file-access
  - lfi
  - arbitrary-read
  - arbitrary-write
  - fopen
  - ifstream
  detection_layer: 2
  attack_surface_type: filesystem-boundary
  patterns:
  - type: regex
    description: fopen with user-controlled filename parameter
    pattern: \bfopen\s*\(\s*(?:argv|user_input|input|param|filename|filepath|path|name|url|request)\b
  - type: regex
    description: C++ ifstream/ofstream constructed with user-controlled path
    pattern: \b(?:std::)?(?:ifstream|ofstream|fstream)\s+\w+\s*\(\s*(?:argv|user_input|input|param|filename|filepath|path|name)\b
  - type: regex
    description: ifstream/ofstream open() with user-controlled path
    pattern: \b\w+\s*\.\s*open\s*\(\s*(?:argv|user_input|input|param|filename|filepath|path|name)\b
  - type: regex
    description: String concatenation building file path from user input
    pattern: \b(?:fopen|ifstream|ofstream|fstream)\s*[\(\s]\s*\(\s*(?:std::)?string\s*\([^)]*\)\s*\+\s*(?:argv|user_input|input|param|filename|path)\b
  - type: regex
    description: C-style file operations with user-controlled path (stat, access, unlink)
    pattern: \b(?:stat|lstat|access|unlink|remove|rename|chmod|chown|mkdir|rmdir)\s*\(\s*(?:argv|user_input|input|param|filename|filepath|path)\b
  - type: regex
    description: Path built via sprintf/snprintf with user-controlled component
    pattern: \b(?:sprintf|snprintf)\s*\(\s*\w+\s*,\s*[^,]*,\s*"[^"]*%s[^"]*"\s*,\s*(?:argv|user_input|input|param|filename|path)\b
  - type: regex
    description: Windows-specific file operations with user input
    pattern: \b(?:CreateFile[AW]?|_wfopen|_tfopen|DeleteFile[AW]?|CopyFile[AW]?|MoveFile[AW]?)\s*\(\s*(?:argv|user_input|input|param|filename|filepath|path)\b
  - type: regex
    description: Boost filesystem operations with user-controlled path
    pattern: \b(?:boost::filesystem|std::filesystem)\s*::\s*(?:path|exists|remove|copy|rename|create_directory)\s*\(\s*(?:argv|user_input|input|param|filename|filepath|path)\b
  anti_patterns:
  - realpath(
  - canonical(
  - std::filesystem::canonical
  - boost::filesystem::canonical
  - std::filesystem::weakly_canonical
  - basename(
  - if.*\.\.
  - if.*find.*".."
  - sanitize_path
  - chroot(
  - jail
  - allowlist
  bypass_variants:
  - description: URL-encoded traversal sequences (%2e%2e%2f) decoded before file access
    pattern: \b(?:url_decode|urldecode|percent_decode)\s*\([^)]*\)[^;]*\b(?:fopen|ifstream|open)\b
  - description: Double-encoding or null byte injection to bypass path filters
    pattern: \b(?:fopen|ifstream)\s*[\(\s].*(?:\\x00|\\0|%00)
  - description: Symlink-based traversal bypassing path prefix validation
    pattern: \b(?:symlink|link)\s*\([^)]*\)[^}]*\b(?:fopen|open|ifstream)\s*\(
  evasion_indicators:
  - Path validation on one variable but file opened with a different variable
  - Path check for '..' but not for absolute paths starting with /
  - Null byte injection truncating validated suffix
  - Symlink race condition (TOCTOU) between path check and file open
  - Windows alternate data streams (filename:stream) bypassing extension checks
  encoding_variants:
  - type: url_encoded_traversal
    pattern: (?:%2e%2e%2f|%2e%2e/|\.\.%2f|%2e%2e%5c)
  - type: unicode_normalization
    pattern: (?:\\u002e\\u002e\\u002f|\\xc0\\xae\\xc0\\xae)
  - type: windows_alt_separator
    pattern: (?:\\\\\\.\\.\\\\|/\\.\\./)
  multi_function_chain_patterns:
  - recv(user_path) -> string_concat(base_dir + user_path) -> fopen(result) -> fread -> send_to_client
  - getline(cin, filename) -> ifstream(directory + filename) -> read_contents -> display
  - parse_http_request(url_path) -> serve_static_file(docroot + url_path) -> send_response
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Reading sensitive configuration files (/etc/shadow, private keys) or overwriting executables and cron
      jobs enables privilege escalation from web service user to root.
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: HTTP request path, query parameter, filename field, or uploaded file name
    sink: fopen(), ifstream constructor, ofstream constructor, or filesystem API
    through: String concatenation of base directory with user-controlled path component without canonicalization or traversal
      filtering
  - source: Command-line argument or configuration file entry specifying file path
    sink: stat(), open(), unlink(), or other filesystem syscall wrappers
    through: Path parameter passed through without realpath() canonicalization or chroot confinement
  impact: "Path traversal in C++ applications enables:\n  - Arbitrary file read: accessing /etc/passwd, /etc/shadow, SSH private\
    \ keys,\n    application source code, database credentials, and API secrets\n  - Arbitrary file write: overwriting application\
    \ binaries, cron jobs,\n    authorized_keys files, web shells, or configuration files\n  - Information disclosure: leaking\
    \ source code, build artifacts, and internal\n    data structures that aid further exploitation\n  - Denial of service:\
    \ deleting or corrupting critical system or application files\nC++ applications frequently run as system services with\
    \ elevated filesystem\npermissions, making path traversal especially impactful. Combined with\nfile write capabilities,\
    \ this can achieve remote code execution.\n"
  remediation: "Framework-specific fixes:\n  - POSIX: use realpath() to canonicalize paths and verify they start with the\
    \ allowed base directory\n  - C++17: use std::filesystem::canonical() or weakly_canonical() for path normalization\n \
    \ - Boost: use boost::filesystem::canonical() for path resolution\n  - Windows: use GetFullPathNameW() and verify the\
    \ canonical path is within the allowed directory\n  - chroot jails: confine the process filesystem view to the intended\
    \ directory tree\nSecure libraries:\n  - std::filesystem (C++17) for path manipulation with canonical()\n  - boost::filesystem\
    \ for cross-platform path canonicalization\n  - libseccomp for restricting filesystem syscalls via seccomp-bpf\n  - AppArmor/SELinux\
    \ profiles for mandatory access control on file paths\nPrevention strategies:\n  - Canonicalize all user-provided paths\
    \ with realpath()/std::filesystem::canonical()\n  - Verify canonical path starts with the intended base directory prefix\n\
    \  - Reject paths containing \"..\" components, absolute path prefixes, or null bytes\n  - Use an allowlist of permitted\
    \ filenames or path patterns\n  - Strip or reject non-ASCII characters and control characters in filenames\n  - Use chroot,\
    \ containers, or namespace isolation to limit filesystem access\n  - Apply principle of least privilege: run file-serving\
    \ processes as unprivileged users\n  - Use O_NOFOLLOW and O_NOTRAVERSE flags to prevent symlink-based traversal\n  - Log\
    \ and monitor file access patterns for anomalous traversal attempts\n"
  references:
  - https://cwe.mitre.org/data/definitions/22.html
  - https://owasp.org/www-community/attacks/Path_Traversal
  - https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
