- rule_id: CPP-INJ-008
  title: Unsafe Deserialization and Type Confusion
  description: 'Detects type confusion and unsafe deserialization vulnerabilities in C++ where untrusted data is used to determine
    object types, drive unsafe casts, or reconstruct objects without proper type validation. Attackers can craft serialized
    input to instantiate unexpected types, corrupt vtable pointers via reinterpret_cast or C-style casts on untrusted data,
    or inject objects whose destructors or virtual methods execute attacker-controlled code. Type confusion is a critical
    vulnerability class in polymorphic C++ codebases, browser engines, and any application deserializing complex object graphs
    from untrusted sources.

    '
  language: cpp
  category: injection
  severity: High
  confidence: 0.87
  cwe: CWE-843
  owasp: A08:2021-Software and Data Integrity Failures
  tags:
  - type-confusion
  - deserialization
  - unsafe-cast
  - vtable-corruption
  - reinterpret_cast
  - object-injection
  - polymorphism-abuse
  detection_layer: 4
  attack_surface_type: type-system-boundary
  patterns:
  - type: regex
    description: reinterpret_cast from buffer or untrusted data pointer
    pattern: \breinterpret_cast\s*<[^>]+>\s*\(\s*(?:buf|buffer|data|input|payload|packet|recv_buf|raw|bytes)\b
  - type: regex
    description: C-style cast from void pointer or raw buffer to complex type
    pattern: \(\s*(?:struct\s+)?\w+\s*\*\s*\)\s*(?:buf|buffer|data|input|payload|packet|recv_buf|raw|bytes)\b
  - type: regex
    description: static_cast from base to derived using untrusted type discriminator
    pattern: \bstatic_cast\s*<\s*\w+\s*\*\s*>\s*\(\s*\w+\s*\)[^;]*(?:type_id|type_code|msg_type|kind|tag|discriminator)\b
  - type: regex
    description: Object constructed by placement new on untrusted data buffer
    pattern: \bnew\s*\(\s*(?:buf|buffer|data|input|payload|raw|bytes)\s*\)\s*\w+
  - type: regex
    description: memcpy into object or struct from network/file data
    pattern: \bmemcpy\s*\(\s*(?:&\s*)?\w+\s*,\s*(?:buf|buffer|data|input|payload|packet|recv_buf)\s*,\s*sizeof\s*\(
  - type: regex
    description: Union-based type punning with untrusted selector
    pattern: \bunion\s+\w*\s*\{[^}]*\}\s*\w+\s*;[^}]*(?:type|kind|tag|selector)\b
  - type: regex
    description: Variant or any type accessed with unchecked type assumption
    pattern: \b(?:std::get|std::any_cast|boost::any_cast|boost::get)\s*<[^>]+>\s*\(\s*(?:input|data|payload|param|received|parsed)\b
  - type: regex
    description: Dynamic dispatch on type field from deserialized data to instantiate objects
    pattern: \bswitch\s*\(\s*(?:type_id|type_code|msg_type|object_type|class_id)\s*\)\s*\{[^}]*\bnew\s+\w+
  anti_patterns:
  - dynamic_cast
  - typeid(
  - std::holds_alternative
  - std::get_if
  - std::any::type()
  - boost::any::type()
  - protobuf
  - flatbuffers
  - capnproto
  - 'cereal::'
  - boost::serialization
  - nlohmann::json
  bypass_variants:
  - description: Type discriminator forged in serialized data to trigger wrong static_cast branch
    pattern: \breadline\s*\([^)]*\)[^}]*switch\s*\(\s*(?:type|kind)\s*\)[^}]*static_cast
  - description: Polymorphic downcast without dynamic_cast based on untrusted runtime type information
    pattern: \bstatic_cast\s*<\s*\w+Derived\s*\*\s*>\s*\(\s*base_ptr\s*\)
  - description: Void pointer from deserialized data cast to function pointer and invoked
    pattern: \(\s*(?:void\s*\(\s*\*\s*\)\s*\([^)]*\)|func_ptr_t)\s*\)\s*(?:buf|data|input|payload)\b
  evasion_indicators:
  - Type discriminator in data controls which cast branch is taken
  - Custom serialization format without schema validation
  - reinterpret_cast or C-style cast applied to data from recv/fread
  - Object reconstruction from raw bytes without constructor invocation
  - Virtual method called on object reconstructed from untrusted buffer
  encoding_variants:
  - type: serialized_type_tag
    pattern: \b(?:read|recv|fread)\s*\([^)]*\)[^}]*(?:type_id|class_id|object_type)\s*=\s*(?:\*|static_cast)
  - type: binary_protocol_cast
    pattern: \breinterpret_cast\s*<\s*(?:struct\s+)?\w+Header\s*\*\s*>\s*\(\s*(?:packet|frame|message)_(?:buf|data)\b
  - type: custom_vtable_injection
    pattern: \bmemcpy\s*\(\s*(?:&\s*)?\w+\s*,\s*(?:data|input|buf)\s*,[^)]*\)[^}]*\w+\s*->\s*\w+\s*\(
  multi_function_chain_patterns:
  - recv(data) -> read_type_field(data) -> reinterpret_cast<DerivedType*>(data) -> call_virtual_method()
  - deserialize(stream) -> create_object_by_type_id(id) -> static_cast<Derived*>(base) -> invoke()
  - fread(buffer) -> memcpy(&object, buffer, sizeof) -> object.virtual_method() (vtable from untrusted data)
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Type confusion allows attacker to treat one object type as another, accessing fields at wrong offsets.
      When the confused type has a vtable, attacker-controlled data at the vtable pointer offset enables arbitrary code execution.
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: Serialized object data from network socket, file, IPC, or shared memory
    sink: reinterpret_cast, static_cast, C-style cast, or placement new on the received buffer
    through: Raw byte buffer received and cast to a typed pointer without schema validation or dynamic_cast type checking
  - source: Type discriminator field in untrusted protocol message or file format
    sink: Switch/dispatch table selecting which derived class to static_cast to
    through: Forged type ID causes incorrect downcast, accessing derived class fields/vtable from a different base object
      layout
  impact: "Type confusion and unsafe deserialization in C++ enables:\n  - Vtable hijacking: attacker-controlled data at the\
    \ vtable pointer offset\n    causes virtual method calls to jump to arbitrary addresses\n  - Arbitrary read/write: accessing\
    \ fields at wrong offsets reads or writes\n    unintended memory locations\n  - Remote code execution: the most common\
    \ exploitation outcome, particularly\n    in browser engines, media parsers, and network protocol handlers\n  - Object\
    \ injection: instantiating attacker-chosen types whose constructors\n    or destructors have dangerous side effects\n\
    \  - Information disclosure: reading fields at wrong offsets leaks pointers,\n    keys, and other sensitive data from\
    \ adjacent object fields\nType confusion bugs have been central to numerous high-profile exploits\nincluding browser JIT\
    \ engine attacks, PDF parser exploits, and kernel\ndriver vulnerabilities. They frequently bypass CFI when the confused\
    \ types\nshare compatible call signatures.\n"
  remediation: "Framework-specific fixes:\n  - C++: use dynamic_cast<Derived*>(base) for safe runtime-checked downcasts (returns\
    \ nullptr on failure)\n  - C++17: use std::variant with std::visit for type-safe discriminated unions\n  - C++17: use\
    \ std::any with std::any_cast which throws std::bad_any_cast on type mismatch\n  - Protobuf/FlatBuffers/Cap'n Proto: use\
    \ schema-validated deserialization instead of raw casts\nSecure libraries:\n  - Protocol Buffers (protobuf) for schema-validated\
    \ serialization\n  - FlatBuffers for zero-copy schema-validated deserialization\n  - Cap'n Proto for capability-based\
    \ serialization with type safety\n  - cereal library for type-safe C++ serialization with class registration\n  - Boost.Serialization\
    \ with registered types and version control\n  - nlohmann::json for structured text-based serialization\nPrevention strategies:\n\
    \  - Never use reinterpret_cast on untrusted data buffers\n  - Always use dynamic_cast for polymorphic downcasts and check\
    \ for nullptr\n  - Validate type discriminators against an allowlist before casting\n  - Use std::variant instead of unions\
    \ for type-safe tagged unions\n  - Implement schema validation before deserialization (validate before parse)\n  - Use\
    \ RTTI (typeid) or custom type registries for runtime type verification\n  - Enable Clang CFI (-fsanitize=cfi) to detect\
    \ type confusion at runtime\n  - Use -fsanitize=undefined with -fsanitize=vptr for virtual call validation\n  - Avoid\
    \ placement new on untrusted buffers; copy data into constructed objects field by field\n  - Use fuzzing with structure-aware\
    \ mutators (libprotobuf-mutator) to test deserialization\n"
  references:
  - https://cwe.mitre.org/data/definitions/843.html
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/16-Testing_for_HTTP_Incoming_Requests
  - https://cwe.mitre.org/data/definitions/502.html
