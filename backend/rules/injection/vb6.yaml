rules:
- rule_id: VB6-INJ-001
  title: SQL Injection via String Concatenation
  description: 'Detects SQL queries built with string concatenation in VB6/VBScript.

    '
  language: vb6
  category: injection
  severity: Critical
  confidence: 0.92
  cwe: CWE-89
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - sql-injection
  - vb6
  patterns:
  - type: regex
    pattern: \.Execute\s*\(\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*"\s*&\s*(?:Request|txtUser|param|input|user)\b
  - type: regex
    pattern: \.CommandText\s*=\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*"\s*&\s*(?:Request|txtUser|param|input|user)\b
  - type: regex
    pattern: (?:rs|recordset|cmd)\.Open\s*\(\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*"\s*&\s*(?:Request|txtUser|param|input|user)\b
  - type: regex
    pattern: \.Source\s*=\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*"\s*&\s*(?:Request|txtUser|param|input|user)\b
  anti_patterns:
  - Parameters.Append
  - CreateParameter
  - adParamInput
  impact: 'SQL injection in classic ASP/VB6 can escalate to OS command execution

    via xp_cmdshell on SQL Server.

    '
  remediation: "Use ADODB.Command with parameters:\n  Set cmd = Server.CreateObject(\"ADODB.Command\")\n  cmd.Parameters.Append cmd.CreateParameter(\"@id\", adInteger, adParamInput, , userId)\n"
- rule_id: VB6-INJ-002
  title: Command Injection via Shell Function
  description: 'Detects OS command execution in VB6/VBScript.

    '
  language: vb6
  category: injection
  severity: Critical
  confidence: 0.9
  cwe: CWE-78
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - command-injection
  - shell
  patterns:
  - type: regex
    pattern: Shell\s*\(\s*(?:Request|param|input|user|txt\w+)\b
  - type: regex
    pattern: WScript\.Shell.*(?:Run|Exec)\s*\(\s*(?:Request|param|input|user)\b
  - type: regex
    pattern: CreateObject\s*\(\s*"WScript\.Shell"\s*\)\.(?:Run|Exec)\s*\(
  - type: regex
    pattern: CreateObject\s*\(\s*"Shell\.Application"\s*\)\.(?:ShellExecute|Open)\s*\(
  anti_patterns:
  - sanitize
  - validate
  impact: Injection attacks can lead to data breach, unauthorized access, or system compromise
  remediation: Use parameterized queries, input validation, and output encoding
- rule_id: VB6-INJ-003
  title: File System Object Injection
  description: 'Detects file operations with user-controlled paths via FSO.

    '
  language: vb6
  category: path_traversal
  severity: High
  confidence: 0.85
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 1
  tags:
  - path-traversal
  - fso
  patterns:
  - type: regex
    pattern: FileSystemObject.*(?:OpenTextFile|CreateTextFile|DeleteFile|CopyFile|MoveFile)\s*\(\s*(?:Request|param|input|user)\b
  - type: regex
    pattern: (?:fso|objFSO)\.(?:OpenTextFile|CreateTextFile|DeleteFile|CopyFile)\s*\(\s*(?:Request|param|input|user)\b
  anti_patterns:
  - Server.MapPath
  - validate
  impact: Path traversal enables reading or writing arbitrary files on the server
  remediation: Canonicalize paths and verify they remain within expected base directories
- rule_id: VB6-AUTH-001
  title: Hardcoded Credentials in VB6
  description: 'Detects hardcoded passwords and connection strings.

    '
  language: vb6
  category: auth
  severity: High
  confidence: 0.9
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - hardcoded-credentials
  patterns:
  - type: regex
    pattern: (?:Dim|Private|Public)\s+(?:sPassword|strPassword|sSecret|strToken)\s+As\s+String\s*$
  - type: regex
    pattern: (?:password|passwd|secret|apiKey|token)\s*=\s*"[^"]{4,}"
  - type: regex
    pattern: (?:ConnectionString|Provider)\s*=\s*"[^"]*(?:Password|pwd)\s*=\s*[^;"]{4,}
  anti_patterns:
  - environ
  - registry
  - placeholder
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: VB6-CRYPTO-001
  title: Weak Cryptography in VB6
  description: 'Detects custom or weak encryption in VB6.

    '
  language: vb6
  category: crypto
  severity: High
  confidence: 0.82
  cwe: CWE-327
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 2
  tags:
  - weak-crypto
  - custom-encryption
  patterns:
  - type: regex
    pattern: (?:Xor|XOR)\s+(?:Asc|CByte)\s*\(
  - type: regex
    pattern: For\s+\w+\s*=.*(?:Len|LenB)\s*\(.*(?:Xor|XOR)\b
  - type: regex
    pattern: CryptEncrypt|CryptDecrypt|CALG_DES\b
  anti_patterns:
  - AES
  - CALG_AES
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: VB6-XSS-001
  title: XSS in Classic ASP
  description: 'Detects XSS via Response.Write without encoding in classic ASP.

    '
  language: vb6
  category: xss
  severity: High
  confidence: 0.88
  cwe: CWE-79
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - xss
  - classic-asp
  patterns:
  - type: regex
    pattern: Response\.Write\s*\(\s*Request(?:\.QueryString|\.Form|\.ServerVariables|\()\b
  - type: regex
    pattern: <%\s*=\s*Request(?:\.QueryString|\.Form|\()\b
  anti_patterns:
  - Server.HtmlEncode
  - HTMLEncode
  impact: Cross-site scripting enables session hijacking, credential theft, and website defacement
  remediation: Apply context-aware output encoding and use Content Security Policy headers
- rule_id: VB6-SEC-001
  title: Error Information Disclosure
  description: 'Detects detailed error messages exposed to users.

    '
  language: vb6
  category: framework_misuse
  severity: Medium
  confidence: 0.8
  cwe: CWE-209
  owasp: A04:2021-Insecure-Design
  detection_layer: 1
  tags:
  - error-disclosure
  patterns:
  - type: regex
    pattern: Response\.Write\s*\(\s*Err\.Description\b
  - type: regex
    pattern: Response\.Write\s*\(\s*Err\.Number\b
  - type: regex
    pattern: On\s+Error\s+Resume\s+Next
  anti_patterns:
  - custom error
  - generic error
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
