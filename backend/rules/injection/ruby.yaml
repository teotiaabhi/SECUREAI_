  impact: 'Open redirects enable attackers to construct URLs on a trusted domain that

    redirect victims to attacker-controlled sites. This is particularly dangerous

    in authentication flows (OAuth callbacks, post-login redirects, SSO return URLs)

    where users expect to remain on the trusted site. Attackers can harvest

    credentials via convincing phishing pages, steal OAuth authorization codes,

    distribute malware under the appearance of a trusted domain, and bypass URL-based

    security controls such as CSP or domain allowlists. While classified as medium

    severity in isolation, open redirects frequently serve as a critical component

    in chained attacks.

    '
  remediation: "Framework-specific fixes:\n  - Rails: use only_path option to force relative redirects\n      redirect_to\
    \ params[:return_to], only_path: true\n  - Rails: validate the host of the redirect URL against an allowlist\n      uri\
    \ = URI.parse(params[:return_to])\n      if ALLOWED_HOSTS.include?(uri.host)\n        redirect_to params[:return_to]\n\
    \      else\n        redirect_to root_path\n      end\n  - Rails: use named route helpers instead of dynamic URLs\n  \
    \    redirect_to dashboard_path\n  - Devise/OmniAuth: configure allowed redirect origins in initializer\n      config.navigational_formats\
    \ = []\nSecure libraries:\n  - Rails url_for with only_path: true\n  - Devise Omniauthable with strict callback validation\n\
    \  - rack-protection gem for redirect safety\n  - addressable gem for robust URL parsing and host validation\nPrevention\
