    description: LibXML parser invoked on user-controlled input
  - type: regex
    pattern: Nokogiri::(?:XML|HTML)\.parse\s*\(\s*(?:params|request|input|user|data)\b
    description: Nokogiri parse method with user-controlled input
  - type: regex
    pattern: REXML::Document\.new\s*\(\s*(?:File\.read|IO\.read|open)\s*\(\s*(?:params|request|input)\b
    description: REXML parsing a file at a user-controlled path
  anti_patterns:
