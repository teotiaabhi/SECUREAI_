  - source: File upload (multipart form data)
    sink: YAML.load(File.read(uploaded_file.path))
    through: File upload handler that reads and parses uploaded YAML files
  impact: 'YAML deserialization in Ruby (via Psych engine) can instantiate arbitrary Ruby

    objects by processing YAML tags like !ruby/object:ClassName. Attackers can craft

    YAML payloads that chain gadget objects (such as Gem::Installer, Gem::Requirement,

    ERB, or Gem::StubSpecification) to achieve remote code execution. Known exploit

    chains exist for every major Ruby version. A single YAML.load call on untrusted

    input can lead to complete server compromise, including arbitrary file read/write,

    command execution, reverse shells, and denial of service. This vulnerability class

    has been exploited in major real-world breaches against Ruby on Rails applications.

    '
  remediation: "Framework-specific fixes:\n  - Ruby 3.1+: YAML.load now requires permitted_classes by default\n      YAML.safe_load(yaml_string)\n\
    \      YAML.safe_load(yaml_string, permitted_classes: [Date, Time, Symbol])\n  - Ruby < 3.1: replace all YAML.load with\
    \ YAML.safe_load\n      YAML.safe_load(params[:data])\n  - Rails: use ActiveSupport JSON serialization instead of YAML\
    \ for user data\n      config = JSON.parse(params[:config])\n  - Psych: use Psych.safe_load with strict class restrictions\n\
    \      Psych.safe_load(data, permitted_classes: [Date, Time])\nSecure libraries:\n  - YAML.safe_load (built-in, restricts\
    \ object instantiation)\n  - SafeYAML gem (monkey-patches YAML.load for safety)\n  - Psych.safe_load with permitted_classes\
    \ whitelist\n  - JSON as a safer serialization alternative for user data\nPrevention strategies:\n  - Replace every YAML.load\
    \ call with YAML.safe_load globally\n  - Use SafeYAML gem to make YAML.load safe by default across the application\n \
    \ - Never accept YAML input from untrusted sources; prefer JSON for APIs\n  - If YAML is required, use permitted_classes\
    \ with the minimal set of safe types\n  - Audit gems and dependencies for internal YAML.load usage on user-controlled\
    \ data\n  - Add Brakeman deserialization checks to CI/CD pipeline\n  - Monitor for YAML payloads containing !ruby/object\
    \ tags in WAF rules\n"
