      without disabling entity processing. An attacker sends a crafted XML document containing an external entity definition
      that references file:///etc/passwd and includes the entity in a data field, causing the server to read the local passwd
      file and include its contents in the parsed XML output or error response. On AWS, the attacker targets http://169.254.169.254/latest/meta-data/iam/security-credentials/
      to steal IAM role credentials.

      '
    example_payload: <?xml version='1.0'?><!DOCTYPE foo [<!ENTITY xxe SYSTEM 'file:///etc/passwd'>]><data>&xxe;</data>
    attacker_objective: Read arbitrary server files, access cloud metadata endpoints to steal IAM credentials, perform SSRF
      against internal services, or cause denial of service via entity expansion bombs.
