  - https://cwe.mitre.org/data/definitions/502.html
  - https://blog.rubygems.org/2013/01/31/data-verification.html
  - https://ruby-doc.org/stdlib/libdoc/yaml/rdoc/YAML.html
  context_awareness:
    surrounding_context_patterns:
