    description: Direct YAML.load call with user-controlled input enabling arbitrary object deserialization
  - type: regex
    pattern: Psych\.load\s*\(\s*(?:params|request|input|user|data|body)\b
    description: Psych.load (underlying YAML engine) with user data, equivalent risk to YAML.load
  - type: regex
    pattern: YAML\.load\s*\(\s*(?:File\.read|IO\.read|open)\s*\(\s*(?:params|request|input|user)\b
    description: YAML.load reading from a user-controlled file path, combining path traversal with deserialization
  - type: regex
    pattern: YAML\.load\s*\(\s*(?:request\.body|request\.raw_post)\b
    description: YAML.load directly parsing the raw HTTP request body
  - type: regex
    pattern: YAML\.load\s*\(\s*(?:Base64\.decode64|CGI\.unescape|URI\.decode)\s*\(\s*(?:params|request)\b
    description: YAML.load with encoded user input, indicating potential evasion of input filters
  - type: regex
    pattern: Psych\.unsafe_load\s*\(\s*(?:params|request|input|user|data)\b
    description: Psych.unsafe_load explicitly opts into dangerous deserialization with user data
  - type: regex
    pattern: YAML\.load_stream\s*\(\s*(?:params|request|input|user|data)\b
    description: YAML.load_stream processes multiple YAML documents from user input
  - type: regex
    pattern: YAML\.(?:load|parse)\s*\(\s*[a-z_]+\b(?!.*(?:safe_load|permitted_classes))
    description: YAML.load with a variable argument without safe_load guard in surrounding context
  anti_patterns:
