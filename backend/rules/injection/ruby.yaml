    pattern: Nokogiri::XML\s*\(\s*(?:params|request|input|user|data|body)\b
    description: Nokogiri XML parsing of user-controlled input with default entity processing
  - type: regex
    pattern: Nokogiri::XML\s*\(\s*(?:request\.body|request\.raw_post)\b
    description: Nokogiri parsing the raw HTTP request body as XML
  - type: regex
    pattern: REXML::Document\.new\s*\(\s*(?:params|request|input|user|data|body)\b
    description: REXML document construction from user input with default XXE-vulnerable settings
  - type: regex
    pattern: Nokogiri::XML\s*\(.*\)\s*(?:do|\{)(?:(?!nonet|NONET|NOENT).)*$
    description: Nokogiri XML parsing without NONET or NOENT flags in the block configuration
  - type: regex
