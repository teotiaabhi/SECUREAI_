  impact: 'XML External Entity injection allows attackers to define external entities in

    XML documents that reference local files (file:///etc/passwd), internal network

    services (http://169.254.169.254/latest/meta-data/), or remote DTDs for out-of-band

    data exfiltration. In Ruby applications using Nokogiri (libxml2 backend) or REXML,

    the impact includes: arbitrary file read from the server filesystem, server-side

    request forgery (SSRF) to internal services and cloud metadata endpoints, denial

    of service via recursive entity expansion (Billion Laughs), and port scanning of

    internal networks. On cloud-hosted applications, XXE can access instance metadata

    services to steal IAM credentials, leading to full cloud account compromise.

    '
  remediation: "Framework-specific fixes:\n  - Nokogiri: disable external entity loading with NONET and NOENT flags\n    \
    \  doc = Nokogiri::XML(xml_string) { |config|\n        config.nonet.noent.noblanks\n      }\n  - Nokogiri: use parse options\
    \ constant\n      doc = Nokogiri::XML(xml_string, nil, nil,\n        Nokogiri::XML::ParseOptions::NONET |\n        Nokogiri::XML::ParseOptions::NOENT)\n\
    \  - REXML: set entity expansion limits\n      REXML::Security.entity_expansion_limit = 0\n      REXML::Security.entity_expansion_text_limit\
    \ = 0\n      doc = REXML::Document.new(xml_string)\n  - Rails: configure global XML parsing in application.rb\n      config.middleware.delete\
    \ ActionDispatch::ParamsParser\nSecure libraries:\n  - Nokogiri with NONET | NOENT parse options (default safe in Nokogiri\
    \ >= 1.13.2)\n  - Oga gem (pure Ruby XML parser without external entity support)\n  - ox gem with default safe parsing\
    \ configuration\n  - JSON as alternative format where XML is not strictly required\nPrevention strategies:\n  - Always\
    \ disable external entity processing in XML parsers\n  - Set Nokogiri parse options to NONET | NOENT for all XML parsing\n\
    \  - Set REXML::Security.entity_expansion_limit = 0 globally\n  - Prefer JSON over XML for API communication where possible\n\
    \  - Validate XML content-type headers and reject unexpected XML input\n  - Use Web Application Firewall rules to detect\
    \ XXE payloads (<!ENTITY, SYSTEM)\n  - Audit all XML parsing code paths including those in gem dependencies\n  - On cloud\
