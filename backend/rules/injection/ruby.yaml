- rule_id: RUBY-INJ-006
  title: YAML Deserialization via Psych.load / YAML.load
  description: 'Detects use of YAML.load or Psych.load with user-controlled input, which enables arbitrary object instantiation
    and remote code execution through crafted YAML payloads that exploit Ruby''s object deserialization mechanism. YAML.load
    in Ruby deserializes arbitrary Ruby objects including those with dangerous side effects in their initialize or === methods.

    '
  language: ruby
  category: injection
  severity: High
  confidence: 0.92
  cwe: CWE-502
  owasp: A08:2021-Software and Data Integrity Failures
  tags:
