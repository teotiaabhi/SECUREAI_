- rule_id: RUBY-INJ-007
  title: XML External Entity Injection via Nokogiri/REXML
  description: 'Detects XML parsing in Ruby applications using Nokogiri or REXML with external entity processing enabled,
    allowing attackers to read arbitrary files from the server, perform server-side request forgery, exfiltrate data via out-of-band
    channels, or cause denial of service through recursive entity expansion (Billion Laughs attack).

    '
  language: ruby
  category: injection
  severity: High
  confidence: 0.87
  cwe: CWE-611
  owasp: A05:2021-Security Misconfiguration
  tags:
  - xxe
  - xml-injection
  - nokogiri
  - rexml
  - ssrf
  - file-disclosure
  - entity-expansion
  detection_layer: 3
  attack_surface_type: XML parsing endpoint
  patterns:
