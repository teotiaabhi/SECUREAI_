    taint_sink_indicators:
    - 'source '
    - '. '
    sanitization_patterns:
    - realpath
    - readlink -f
    - allowlist
    - case statement
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A plugin system sources user-specified configuration files:

      source "$PLUGIN_DIR/$plugin_name/config.sh". An attacker uses

      path traversal: plugin_name="../../tmp/evil" to source malicious code.

