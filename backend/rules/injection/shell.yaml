    - SHELL-INJ-006
- rule_id: SHELL-INJ-010
  title: Environment Variable Injection
  description: 'Detects patterns where user-controlled input is used to set or modify environment variables that influence command behavior. Attackers can inject malicious values into PATH, LD_PRELOAD,
    LD_LIBRARY_PATH, IFS, BASH_ENV, or ENV to hijack command resolution, load malicious libraries, or alter shell parsing behavior for arbitrary code execution.

    '
  language: shell
  category: injection
  severity: High
  confidence: 0.91
  cwe: CWE-426
  owasp: A03:2021-Injection
  tags:
  - environment-injection
  - path-hijacking
  - ld-preload
  - ifs-manipulation
  - library-injection
  detection_layer: 1
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: export\s+(?:PATH|LD_PRELOAD|LD_LIBRARY_PATH|BASH_ENV|ENV)\s*=\s*[^"']*\$\{?\w+\}?
    description: Export sensitive env var with user input
  - type: regex
    pattern: (?:PATH|LD_PRELOAD|LD_LIBRARY_PATH)\s*=\s*\$\{?\w+\}?
    description: Set sensitive env var from user input
  - type: regex
    pattern: IFS\s*=\s*\$\{?\w+\}?
    description: IFS set from user-controlled input
  - type: regex
    pattern: export\s+\$\{?\w+\}?\s*=\s*
    description: Dynamic export with variable name from user input
  - type: regex
    pattern: env\s+\w+=\$\{?\w+\}?\s+\w+
    description: env command setting variable from user input
  - type: regex
    pattern: BASH_ENV\s*=\s*\$\{?\w+\}?
    description: BASH_ENV set from user-controlled path
  anti_patterns:
  - export PATH=/usr/
  - export PATH=$HOME
  - 'export PATH=$PATH:'
  - 'readonly '
  - declare -r
  - '# default value'
  - sanitize
  - validate
  - whitelist
  - allowlist
  - set -u
  - set -euo
  - '# safe: constant'
  - ${var:-default}
  - shellcheck
  bypass_variants:
  - description: PATH hijacking via prepending user directory
    pattern: PATH=\$\w+:\$PATH
  - description: LD_PRELOAD injection via env command
    pattern: env\s+LD_PRELOAD=\$\w+\s+
  - description: BASH_ENV injection for startup code execution
    pattern: BASH_ENV=\$\w+\s+bash
  evasion_indicators:
  - PATH prepending
  - LD_PRELOAD injection
  - BASH_ENV manipulation
  - dynamic export name
  encoding_variants:
  - type: path_separator
    pattern: PATH=.*:.*\$\w+
  - type: null_byte
    pattern: export\s+.*\\x00
  multi_function_chain_patterns:
  - user_path=$1; export PATH=$user_path:$PATH
  - lib=$1; export LD_PRELOAD=$lib
  - read env_name; export $env_name=value
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: true
    escalation_vector: Privilege escalation via PATH hijacking, LD_PRELOAD, or BASH_ENV injection
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-supplied path
    sink: PATH environment variable
    through: export command
  - source: user-supplied library path
    sink: LD_PRELOAD
    through: environment variable assignment
  - source: user-supplied script path
    sink: BASH_ENV
    through: direct assignment
  impact: 'Environment variable injection allows attackers to hijack command

    resolution (PATH), load malicious shared libraries (LD_PRELOAD),

    execute code on shell startup (BASH_ENV), or alter parsing behavior

    (IFS). This can lead to arbitrary code execution with elevated privileges.

    '
  remediation: '- Never set sensitive environment variables from user input.

    - Use absolute paths for commands instead of relying on PATH.

    - Clear dangerous environment variables at script startup.

    - Set PATH to a known-safe value at the start of scripts.

    - Use env -i to start with a clean environment.

    '
  references:
  - https://cwe.mitre.org/data/definitions/426.html
  - https://cwe.mitre.org/data/definitions/427.html
  - https://www.gnu.org/software/bash/manual/html_node/Bash-Variables.html
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
    - 'export '
    - 'function '
    - 'sudo '
    taint_source_indicators:
    - $1
    - 'read '
    - QUERY_STRING
    - HTTP_
    taint_sink_indicators:
    - export PATH
    - export LD_PRELOAD
    - BASH_ENV=
    - IFS=
    sanitization_patterns:
    - unset LD_PRELOAD
    - env -i
    - PATH=/usr/bin:/bin
    - readonly PATH
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A deployment script adds a user-specified tool directory to PATH:

      export PATH=$TOOL_DIR:$PATH. An attacker sets TOOL_DIR to a

      directory containing a malicious ls binary.

      '
    example_payload: TOOL_DIR='/tmp/evil_bin'
    attacker_objective: Hijack command resolution or inject malicious libraries for privilege escalation
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - SHELL-INJ-003
    - SHELL-INJ-006
