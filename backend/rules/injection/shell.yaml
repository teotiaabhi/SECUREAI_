- rule_id: SHELL-INJ-007
  title: Awk/Sed with User-Controlled Pattern
  description: 'Detects awk and sed commands where the pattern or expression is derived from user-controlled input. Awk supports system() and pipe operators for command execution, while sed supports the
    e flag for evaluating pattern space as a command. Both can be weaponized for arbitrary RCE.

    '
  language: shell
  category: injection
  severity: High
  confidence: 0.89
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - awk-injection
  - sed-injection
  - command-injection
  - pattern-injection
  - text-processing
  detection_layer: 2
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: awk\s+[^|;]*\$\{?\w+\}?
    description: awk with variable in program or arguments
  - type: regex
    pattern: sed\s+[^|;]*\$\{?\w+\}?
    description: sed with variable in expression
  - type: regex
    pattern: awk\s+-v\s+\w+=\$\{?\w+\}?
    description: awk variable assignment from user input
  - type: regex
    pattern: awk\s+.*system\s*\(
    description: awk using system() function
  - type: regex
    pattern: sed\s+.*e\s*[;/]
    description: sed with e flag for command evaluation
  - type: regex
    pattern: awk\s+.*\|.*getline
    description: awk pipe with getline for command execution
  - type: regex
    pattern: gawk\s+[^|;]*\$\{?\w+\}?
    description: gawk with user-controlled arguments
  anti_patterns:
  - awk '{print $
  - awk -F
  - sed -i 's/
  - sed 's/^/
  - awk 'NR==
  - awk '/pattern/
  - 'readonly '
  - declare -r
  - sanitize
  - validate
  - whitelist
  - allowlist
  - '# constant pattern'
  - '# fixed expression'
  - shellcheck
  bypass_variants:
  - description: Awk system() call injection
    pattern: awk\s+.*system\s*\(\s*[^)]*\$\w+
  - description: Sed e flag command execution
    pattern: sed\s+.*s/.*/.*/e
  - description: Awk pipe to shell via printf
    pattern: awk\s+.*printf.*\|.*sh
  evasion_indicators:
  - awk system() injection
  - sed e-flag execution
  - awk pipe to shell
  - gawk network features
  encoding_variants:
  - type: octal_escape
    pattern: awk\s+.*\\[0-7]{3}
  - type: hex_escape
    pattern: awk\s+.*\\x[0-9a-fA-F]{2}
  multi_function_chain_patterns:
  - pattern=$1; awk "/$pattern/" file
  - expr=$1; sed "s/$expr//g" file
  - field=$1; awk -v f=$field '{print $f}' file
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Command execution via awk system() or sed e-flag
  business_logic_indicator:
    financial_impact: false
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-supplied search pattern
    sink: awk/sed program argument
    through: unvalidated variable interpolation
  - source: API parameter
    sink: text processing command
    through: string concatenation
  impact: 'Awk and sed with user-controlled patterns enable command injection

    via awk system(), pipe operators, or sed e flag. Attackers can

    execute arbitrary commands, read sensitive files, or establish shells.

    '
  remediation: '- Use awk -v to pass variables safely instead of string interpolation.

    - Validate user patterns against a strict character allowlist.

    - Avoid sed e flag which evaluates pattern space as commands.

    - Prefer fixed awk/sed programs with parameterized input.

    '
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://www.gnu.org/software/gawk/manual/gawk.html
  - https://www.gnu.org/software/sed/manual/sed.html
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
    - 'function '
    - '| awk'
    - '| sed'
    taint_source_indicators:
    - $1
    - read pattern
    - QUERY_STRING
    taint_sink_indicators:
    - 'awk '
    - 'sed '
    - 'gawk '
    - system(
    sanitization_patterns:
    - awk -v var=
    - '[[ =~ ^[a-zA-Z0-9]+$ ]]'
    - sanitize
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A log search script uses awk with user-supplied pattern:

      awk "/$search_term/" /var/log/app.log. An attacker provides

      search_term=''/{}; system("id > /tmp/pwned"); /''

      '
    example_payload: search_term='/{}; system("cat /etc/shadow"); /'
    attacker_objective: Execute commands via awk system() or sed e-flag
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
