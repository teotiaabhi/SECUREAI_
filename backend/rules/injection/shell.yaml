- rule_id: SHELL-INJ-008
  title: SQL Injection via Shell Database Clients
  description: 'Detects SQL injection where user-controlled input is interpolated into SQL statements executed via shell database clients such as mysql, psql, sqlite3, sqlcmd, or mongosh. Shell scripts
    constructing SQL queries via variable interpolation are highly vulnerable because no parameterized query mechanism exists in shell context.

    '
  language: shell
  category: injection
  severity: High
  confidence: 0.94
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - sql-injection
  - mysql-cli
  - psql
  - sqlite3
  - database
  - shell-sql
  detection_layer: 2
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: mysql\s+.*-e\s+[^"']*\$\{?\w+\}?
    description: mysql -e with unquoted variable in query
  - type: regex
    pattern: mysql\s+.*-e\s+"[^"]*\$\{?\w+\}?[^"]*"
    description: mysql -e with variable interpolation in query
  - type: regex
    pattern: psql\s+.*-c\s+[^"']*\$\{?\w+\}?
    description: psql -c with variable in SQL
  - type: regex
    pattern: sqlite3\s+\S+\s+"[^"]*\$\{?\w+\}?[^"]*"
    description: sqlite3 with variable in SQL query
  - type: regex
    pattern: echo\s+.*\$\w+.*\|\s*(?:mysql|psql|sqlite3)
    description: echo with variable piped to database client
  - type: regex
    pattern: sqlcmd\s+.*-[Qq]\s+"[^"]*\$\{?\w+\}?[^"]*"
    description: sqlcmd with variable in query
  - type: regex
    pattern: mongosh?\s+.*--eval\s+"[^"]*\$\{?\w+\}?[^"]*"
    description: mongo/mongosh --eval with variable
  anti_patterns:
  - '# parameterized'
  - prepared statement
  - mysql_real_escape
  - 'readonly '
  - declare -r
  - -- migration
  - -- schema
  - CREATE TABLE
  - ALTER TABLE
  - sanitize
  - validate
  - whitelist
  - allowlist
  - escaped
  - '# test database'
  bypass_variants:
  - description: SQL injection via heredoc to database client
    pattern: (?:mysql|psql)\s+.*<<.*\n.*\$\w+
  - description: Hex-encoded SQL payload in variable
    pattern: echo\s+-e\s+.*\\x.*\|\s*(?:mysql|psql)
  - description: SQL injection via file redirect
    pattern: (?:mysql|psql)\s+.*<\s*\$\w+
  evasion_indicators:
  - hex-encoded SQL
  - heredoc SQL injection
  - file-based SQL injection
  - double encoding
  encoding_variants:
  - type: hex_encoding
    pattern: 0x[0-9a-fA-F]+.*(?:mysql|psql)
  - type: unicode_encoding
    pattern: N'\\u[0-9a-fA-F]{4}
  multi_function_chain_patterns:
  - id=$1; mysql -e "SELECT * FROM users WHERE id='$id'"
  - name=$1; echo "SELECT * FROM t WHERE name='$name'" | psql
  - input=$1; sqlite3 db.sqlite "SELECT * FROM data WHERE key='$input'"
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: SQL injection to read/modify database or execute OS commands via UDF
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-supplied ID or name
    sink: mysql/psql -e query
    through: string interpolation in SQL
  - source: script parameter
    sink: database client stdin
    through: echo piped to client
  impact: 'SQL injection via shell database clients can lead to complete database

    compromise, including data theft, modification, deletion, and potentially

    OS-level command execution via UDFs or COPY PROGRAM.

    '
  remediation: '- Never interpolate variables directly into SQL strings in shell scripts.

    - Use parameterized queries through application-level database drivers.

    - Restrict database user privileges to minimum required operations.

    - Move database logic to application code with ORM/query builders.

    '
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
    - 'mysql '
    - 'psql '
    - 'sqlite3 '
    taint_source_indicators:
    - $1
    - 'read '
    - QUERY_STRING
    - HTTP_
    taint_sink_indicators:
    - mysql -e
    - psql -c
    - sqlite3
    - '| mysql'
    - '| psql'
    sanitization_patterns:
    - mysql_real_escape
    - parameterized
    - prepared
    - escape_string
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A shell script looks up user records via:

      mysql -e "SELECT * FROM users WHERE username=''$username''".

      An attacker provides username="''; DROP TABLE users; --".

      '
    example_payload: username="' UNION SELECT password FROM admin_users -- "
    attacker_objective: Extract sensitive data or modify database records via SQL injection
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - SHELL-INJ-001
    - SHELL-INJ-003
- rule_id: SHELL-INJ-009
  title: Find -exec with User-Controlled Input
  description: 'Detects use of the find command with -exec, -execdir, or -delete actions where user-controlled input influences the path, name pattern, or executed command. The find -exec action runs a
    command for each matched file, and when combined with user input can be weaponized for arbitrary command execution or destructive file operations.

    '
  language: shell
  category: injection
  severity: High
  confidence: 0.9
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - find-injection
  - exec-injection
  - command-injection
  - file-operation
  - path-traversal
  detection_layer: 2
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: find\s+\$\{?\w+\}?\s+
    description: find with user-controlled search path
  - type: regex
    pattern: find\s+\S+\s+-name\s+[^"']*\$\{?\w+\}?
    description: find -name with user-controlled pattern
  - type: regex
    pattern: find\s+.*-exec\s+.*\$\{?\w+\}?
    description: find -exec with user-controlled command arguments
  - type: regex
    pattern: find\s+.*-execdir\s+.*\$\{?\w+\}?
    description: find -execdir with user-controlled arguments
  - type: regex
    pattern: find\s+\$\{?\w+\}?\s+.*-delete
    description: find -delete with user-controlled path
  - type: regex
    pattern: find\s+\$\{?\w+\}?\s+.*-exec\s+rm\s+
    description: find -exec rm with user-controlled path
  anti_patterns:
  - find . -name
  - find /tmp -name
  - find /var/log
  - 'readonly '
  - declare -r
  - -maxdepth 1
  - -maxdepth 2
  - sanitize
  - validate
  - whitelist
  - allowlist
  - realpath
  - readlink
  - '# cleanup temp'
  - shellcheck
  bypass_variants:
  - description: Path traversal in find search directory
    pattern: find\s+.*\.\./.*\$\w+
  - description: Find with -exec sh -c and injection
    pattern: find\s+.*-exec\s+sh\s+-c\s+[^;]*\$\w+
  - description: Symlink following in find
    pattern: find\s+-L\s+\$\w+
  evasion_indicators:
  - path traversal in search directory
  - symlink following
  - -exec sh -c injection
  - wildcard expansion in name
  encoding_variants:
  - type: path_traversal
    pattern: find\s+.*\.\.\/
  - type: null_byte
    pattern: find\s+.*\\x00
  multi_function_chain_patterns:
  - dir=$1; find $dir -exec rm {} \;
  - pattern=$1; find /data -name $pattern -delete
  - path=$1; find $path -type f -exec chmod 777 {} \;
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: File deletion, permission modification, or command execution via find -exec
  business_logic_indicator:
    financial_impact: false
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-supplied directory path
    sink: find command search path
    through: unvalidated variable
  - source: user-supplied filename pattern
    sink: find -name argument
    through: unquoted variable expansion
  impact: 'Find with user-controlled paths or commands can lead to arbitrary

    file deletion, permission changes, or command execution across

    the filesystem. Path traversal can expand scope to the entire filesystem.

    '
  remediation: '- Validate and canonicalize paths with realpath before passing to find.

    - Use -maxdepth to restrict find scope.

    - Quote all variables in find arguments.

    - Avoid -exec sh -c with user input; use -exec directly.

    - Restrict find to specific safe directories.

    '
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://www.gnu.org/software/findutils/manual/html_node/find_html/
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
    - 'function '
    - 'read '
    - cleanup
    taint_source_indicators:
    - $1
    - 'read '
    - DIRECTORY
    - PATH
    taint_sink_indicators:
    - 'find '
    - -exec
    - -delete
    - -execdir
    sanitization_patterns:
    - realpath
    - readlink -f
    - -maxdepth
    - case statement
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A cleanup script uses find $user_dir -name "*.tmp" -delete.

      An attacker provides user_dir="/ -name ''*.conf''" to delete

      all configuration files starting from root.

      '
    example_payload: user_dir='/ -name *.conf'
    attacker_objective: Delete or modify files across the filesystem via path injection in find
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
