- rule_id: SHELL-INJ-006
  title: Source/Dot Command with User-Controlled Path
  description: 'Detects use of the source or dot (.) built-in with a path derived from user-controlled input. The source command executes a file in the current shell context, meaning any code in the sourced
    file runs with the current shell privileges and can modify environment variables.

    '
  language: shell
  category: injection
  severity: High
  confidence: 0.93
  cwe: CWE-829
  owasp: A03:2021-Injection
  tags:
  - source-injection
  - dot-command
  - file-inclusion
  - rce
  - environment-manipulation
  detection_layer: 1
  attack_surface_type: cli
  patterns:
  - type: regex
    pattern: source\s+\$\{?\w+\}?
    description: source command with variable path
  - type: regex
    pattern: \.\s+\$\{?\w+\}?
    description: dot command with variable path
  - type: regex
    pattern: source\s+"[^"]*\$\{?\w+\}?[^"]*"
    description: source with variable inside quoted path
  - type: regex
    pattern: \.\s+"[^"]*\$\{?\w+\}?[^"]*"
    description: dot with variable inside quoted path
  - type: regex
    pattern: source\s+\$\(.*\)
    description: source with command substitution as path
  - type: regex
    pattern: source\s+/[^/]*\$\w+
    description: source with partial path containing variable
  anti_patterns:
  - source /etc/
  - source ~/.bashrc
  - source ~/.profile
  - source ./venv/
  - . /etc/os-release
  - source /usr/share/
  - source $(brew
  - 'readonly '
  - declare -r
  - '# fixed path'
  - sanitize
  - validate
  - whitelist
  - realpath
  - readlink -f
  bypass_variants:
  - description: Path traversal in source path variable
    pattern: source\s+.*\.\./.*\$\w+
  - description: Symlink injection for source path
    pattern: ln\s+-s.*;\s*source\s+
  - description: Race condition in source path
    pattern: source\s+/tmp/.*\$\w+
  evasion_indicators:
  - path traversal in source
  - symlink manipulation
  - TOCTOU race condition
  - /tmp or /var/tmp paths
  encoding_variants:
  - type: path_traversal
    pattern: source\s+.*\.\./
  - type: null_byte
    pattern: source\s+.*\\x00
  multi_function_chain_patterns:
  - config=$1; source $config
  - read path; . $path
  - plugin_dir=$1; source $plugin_dir/init.sh
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Execute arbitrary code in current shell context via file inclusion
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: user-supplied config path
    sink: source/dot built-in
    through: unvalidated path variable
  - source: plugin directory parameter
    sink: source command
    through: path concatenation
  impact: 'Source with user-controlled paths allows execution of arbitrary shell

    code in the current process context, with full access to all environment

    variables, functions, and the calling shell privileges.

    '
  remediation: '- Never use user input directly in source/dot paths.

    - Validate source paths against a strict allowlist of directories.

    - Use realpath to canonicalize paths and prevent traversal.

    - Set file permissions to prevent modification of sourceable files.

    - Verify file integrity with checksums before sourcing.

    '
  references:
  - https://cwe.mitre.org/data/definitions/829.html
  - https://www.gnu.org/software/bash/manual/html_node/Bash-Builtins.html
  context_awareness:
    surrounding_context_patterns:
    - '#!/bin/bash'
