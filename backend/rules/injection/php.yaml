    attack_example: 'An application authenticates users against an XML file: $xpath->query("//user[username/text()=''" . $_POST[''user''] . "'' and password/text()=''" . $_POST[''pass''] . "'']"). An attacker
      submits user='' or ''1''=''1&pass='' or ''1''=''1 producing the XPath query: //user[username/text()='''' or ''1''=''1'' and password/text()='''' or ''1''=''1''] which matches all users and bypasses
