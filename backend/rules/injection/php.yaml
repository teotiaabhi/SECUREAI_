- rule_id: PHP-INJ-011
  title: HTTP Header / CRLF Injection
  description: 'Detects CRLF injection where user-controlled values are passed to header(), setcookie(), or framework response header methods without stripping newline characters. Enables HTTP response
    splitting, session fixation, and XSS.

    '
  language: php
  category: injection
  severity: High
  confidence: 0.87
  cwe: CWE-113
  owasp: A03:2021-Injection
  tags:
  - crlf-injection
  - header-injection
  - response-splitting
  - php
  detection_layer: 2
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: header\s*\(\s*["'](?:Location|Content-Type|Content-Disposition|Set-Cookie)["']?\s*\.\s*[^)]*\$(?:_(?:GET|POST|REQUEST)|input|param|url|redirect|file)\b
    description: header() with user-controlled value via concatenation
  - type: regex
    pattern: header\s*\(\s*["']Location:\s*["']?\s*\.\s*\$(?:_(?:GET|POST|REQUEST)|url|redirect|next|return|target)\b
    description: Location header redirect with user-controlled URL
  - type: regex
    pattern: header\s*\(\s*sprintf\s*\(\s*["'][^"]*%s[^"]*["'][^)]*\$(?:_(?:GET|POST|REQUEST)|input|param|user)\b
    description: header() with sprintf-constructed value from user input
  - type: regex
    pattern: setcookie\s*\(\s*[^,]*,\s*\$(?:_(?:GET|POST|REQUEST)|input|param|value|user)\b
    description: setcookie with user-controlled cookie value
  - type: regex
    pattern: ->header\s*\(\s*["'][^"]*["']\s*,\s*\$(?:_(?:GET|POST|REQUEST)|input|param|value)\b
    description: Framework response header with user-controlled value
  anti_patterns:
  - str_replace.*\r
  - str_replace.*\n
  - preg_replace.*\r\n
  - urlencode(
  - rawurlencode(
  - filter_var.*FILTER_SANITIZE_URL
  bypass_variants:
  - description: URL-encoded CRLF
    pattern: '%0[dD]%0[aA]'
  - description: Double-encoded CRLF
    pattern: '%250[dD]%250[aA]'
  evasion_indicators:
  - URL-encoded CRLF
  - Unicode newlines
  - HTTP/2 header injection
  encoding_variants:
  - type: url_encoding
    pattern: '%0[dD]%0[aA]'
  - type: double_encoding
    pattern: '%250[dD]%250[aA]'
  multi_function_chain_patterns:
  - '$_GET[''file''] -> header(''Content-Disposition: attachment; filename='' . $file)'
  - '$_GET[''url''] -> header(''Location: '' . $url)'
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Response splitting for XSS and session fixation
  business_logic_indicator:
    financial_impact: false
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: $_GET, $_POST, $_REQUEST
    sink: header(), setcookie()
    through: Direct value in header function
  impact: 'CRLF injection enables HTTP response splitting, XSS injection via

    injected response body, cache poisoning, and session fixation via

    injected Set-Cookie headers.

    '
  remediation: "Strip CR/LF characters from header values:\n\n  // SAFE: Remove newlines\n  $value = str_replace([\"\\r\", \"\\n\", \"%0d\", \"%0a\"], '', $input);\n  header('Location: ' . $value);\n\n\
    \  // SAFE: URL-encode redirect URLs\n  header('Location: ' . filter_var($url, FILTER_SANITIZE_URL));\n\n  // PHP 8.0+: header() rejects values with newlines by default\n\nLaravel: Use redirect()->to()\
    \ which handles sanitization.\n"
  references:
  - https://cwe.mitre.org/data/definitions/113.html
  - https://owasp.org/www-community/attacks/HTTP_Response_Splitting
  context_awareness:
    surrounding_context_patterns:
    - header(
    - setcookie(
    - ->header(
    - ->withHeader(
    taint_source_indicators:
    - $_GET
    - $_POST
    - $_REQUEST
    - $request->input(
    taint_sink_indicators:
    - header(
    - setcookie(
    - ->header(
    - ->withHeader(
    sanitization_patterns:
    - str_replace.*\\r
    - str_replace.*\\n
    - urlencode(
    - FILTER_SANITIZE_URL
  severity_scoring:
    severity_weight: 7
    risk_score_formula_hint: severity_weight * confidence * php_version_factor
    exploitability_score: Medium
  exploit_scenario:
    attack_example: 'Download endpoint: header(''Content-Disposition: attachment; filename='' . $_GET[''name'']).

      Attacker sends name=file%0d%0aSet-Cookie:%20admin=true to inject cookie.

