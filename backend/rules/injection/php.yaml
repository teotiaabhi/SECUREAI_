  - type: regex
    pattern: xml_parse\s*\(\s*\$\w+\s*,\s*\$(?:_(?:GET|POST|REQUEST)|input|data|body|xml)\b
    description: xml_parse with user-controlled XML data
  - type: regex
    pattern: \$\w+->load\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|input|file|path|url)\b
    description: DOMDocument::load with user-controlled file
  - type: regex
    pattern: new\s+XMLReader\s*\(\s*\)[^;]*open\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|input|file|path)\b
    description: XMLReader::open with user-controlled source
  anti_patterns:
  - libxml_disable_entity_loader(true)
  - LIBXML_NOENT
  - LIBXML_NONET
  - LIBXML_DTDLOAD
  - json_decode
  - htmlspecialchars
  - strip_tags
  bypass_variants:
  - description: DTD-based entity expansion
    pattern: <!DOCTYPE.*<!ENTITY
  - description: Parameter entity for out-of-band exfiltration
    pattern: <!ENTITY\s+%\s+\w+\s+SYSTEM
  evasion_indicators:
  - External entity via DTD
  - Parameter entities for OOB
  - PHP stream wrappers
  encoding_variants:
  - type: utf16
    pattern: \\xff\\xfe.*DOCTYPE
  - type: php_stream
    pattern: php://filter.*convert
  multi_function_chain_patterns:
  - file_get_contents('php://input') -> simplexml_load_string($xml)
  - $_POST['xml'] -> new DOMDocument() -> loadXML($xml)
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: File disclosure via file:// and SSRF via http:// entities
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: php://input, $_POST, $_FILES
    sink: simplexml_load_string(), DOMDocument::loadXML()
    through: Direct XML parsing of request body
  impact: 'XXE enables reading local files (e.g., /etc/passwd, wp-config.php),

    SSRF to internal services, and DoS via entity expansion. PHP stream

    wrappers (php://filter) allow base64-encoded file exfiltration.

    '
  remediation: "Disable external entity loading before parsing XML:\n\n  // PHP < 8.0: Disable entities explicitly\n  libxml_disable_entity_loader(true);\n  $dom = new DOMDocument();\n  $dom->loadXML($xml,\
    \ LIBXML_NONET | LIBXML_NOENT);\n\n  // PHP 8.0+: External entities disabled by default\n  $xml = simplexml_load_string($data);\n\n  // Prefer JSON over XML for API input\n  $data = json_decode(file_get_contents('php://input'),\
