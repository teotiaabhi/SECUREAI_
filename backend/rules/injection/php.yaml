  - type: regex
    pattern: twig->render\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|input|template|content)\b
    description: Twig render with user template string
  - type: regex
    pattern: \$(?:smarty|tpl)->(?:fetch|display)\s*\(\s*["']string:\s*["']?\s*\.\s*\$(?:_(?:GET|POST|REQUEST)|input|template|content)\b
