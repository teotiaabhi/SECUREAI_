    and complete server compromise through template engine features.

    Twig: {{_self.env.registerUndefinedFilterCallback(''exec'')}}

    Smarty: {php}system(''id''){/php}

    '
  remediation: "Never use user input as template source. Pass data as variables:\n\n  // UNSAFE: User input as template\n  echo $twig->createTemplate($_POST['content'])->render([]);\n\n  // SAFE: User input\
    \ as data\n  echo $twig->render('page.html.twig', ['content' => $userInput]);\n\n  // SAFE: Twig sandbox mode for user content\n  $sandbox = new \\Twig\\Extension\\SandboxExtension($policy);\n  $twig->addExtension($sandbox);\n\
