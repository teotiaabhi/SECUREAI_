    pattern: \$(?:where|regex|gt|gte|lt|lte|ne|in|nin|or|and|not)\b.*\$(?:_(?:GET|POST|REQUEST)|input|param|user)\b
    description: MongoDB operator with user-controlled value
  - type: regex
    pattern: json_decode\s*\([^)]*\$(?:_(?:GET|POST|REQUEST)|body|input)\b[^)]*\)[^;]*->find
    description: JSON-decoded user input used as MongoDB filter
  - type: regex
    pattern: ->(?:updateOne|deleteOne|aggregate)\s*\(\s*(?:\$(?:_(?:GET|POST|REQUEST)|filter|query)|\[.*\$(?:_(?:GET|POST|REQUEST)|input))\b
    description: MongoDB mutation with user-derived filter
  anti_patterns:
  - new ObjectId(
  - MongoDB\BSON\ObjectId
  - filter_var
  - is_string
  - intval(
  - validate
  - allowlist
  bypass_variants:
  - description: Operator injection via JSON body
