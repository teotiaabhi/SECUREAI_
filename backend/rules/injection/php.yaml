    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: $_POST, json_decode(php://input)
    sink: $collection->findOne(), $collection->find()
    through: Array parameter injection or JSON body as filter
  impact: 'NoSQL injection enables authentication bypass, data exfiltration,

    and server-side JavaScript execution via $where operator. PHP''s

    array parameter handling makes operator injection straightforward.

    '
  remediation: "Validate input types strictly. Never pass raw arrays as filters:\n\n  // UNSAFE: Direct user input as filter value\n  $collection->findOne(['username' => $_POST['user'], 'password' => $_POST['pass']]);\n\
    \  // Bypassed with: password[$ne]=x\n\n  // SAFE: Type-cast and validate\n  $user = (string)$_POST['user'];\n  $pass = (string)$_POST['pass'];\n  if (!is_string($user) || !is_string($pass)) { throw\
    \ new Exception('Invalid'); }\n  $collection->findOne(['username' => $user, 'password' => password_hash($pass)]);\n\nLaravel/Jenssegers: Use Eloquent model methods with validated input.\n"
  references:
  - https://cwe.mitre.org/data/definitions/943.html
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection
  context_awareness:
    surrounding_context_patterns:
    - MongoDB\\Collection
    - MongoDB\\Client
    - MongoCollection
    - $collection->
    taint_source_indicators:
    - $_GET
    - $_POST
    - $_REQUEST
    - json_decode(
    - $request->input(
    taint_sink_indicators:
    - ->findOne(
    - ->find(
    - ->aggregate(
    - ->updateOne(
    - ->deleteOne(
    sanitization_patterns:
    - new ObjectId(
    - is_string(
    - intval(
    - filter_var(
    - validate
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 - validation_factor)
    exploitability_score: High
  exploit_scenario:
    attack_example: 'Login: $collection->findOne([''user'' => $_POST[''user''], ''pass'' => $_POST[''pass'']]).

      Attacker sends pass[$ne]=x to bypass authentication via operator injection.

      '
    example_payload: username=admin&password[$ne]=anything
    attacker_objective: Bypass authentication via MongoDB operator injection
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
