    \ with caution\n- Implement a custom xpath_quote() function for proper escaping\n\nCustom XPath escaping function:\n  function xpath_quote(string $value): string {\n      if (strpos($value, \"'\") ===\
    \ false) {\n          return \"'\" . $value . \"'\";\n      }\n      if (strpos($value, '\"') === false) {\n          return '\"' . $value . '\"';\n      }\n      return \"concat('\" . str_replace(\"\
    '\", \"',\\\"'\\\",'\", $value) . \"')\";\n  }\n\nFramework-specific fixes:\n\nLaravel:\n  // Validate input strictly before XPath use\n  $validated = $request->validate([\n      'username' => 'required|alpha_num|max:50',\n\
    \      'search'   => 'required|regex:/^[a-zA-Z0-9\\s]+$/',\n  ]);\n  // Use Eloquent/database instead of XML data stores when possible\n\nSymfony:\n  // Use DomCrawler component with proper filtering\n\
    \  use Symfony\\Component\\DomCrawler\\Crawler;\n  $crawler = new Crawler($xml);\n  $results = $crawler->filterXPath('//user[username[text()=' .\n      xpath_quote($validatedUsername) . ']]');\n  //\
    \ Prefer database storage over XML for user data\n\nWordPress:\n  // Sanitize before XML operations\n  $safe_input = sanitize_text_field($input);\n  if (!preg_match('/^[a-zA-Z0-9_]+$/', $safe_input))\
    \ { wp_die('Invalid input'); }\n  // Use WP database APIs (wpdb) instead of XML when possible\n\nCodeIgniter:\n  // Validate input format\n  $this->form_validation->set_rules('search', 'Search', 'required|alpha_numeric');\n\
    \  // Use database queries instead of XPath when possible\n  // If XPath is required, always escape with xpath_quote()\n"
  references:
  - https://cwe.mitre.org/data/definitions/643.html
