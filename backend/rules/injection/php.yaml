- rule_id: PHP-INJ-006
  title: XML External Entity (XXE) Injection
  description: 'Detects XXE vulnerabilities where XML parsers (simplexml_load_string, DOMDocument::loadXML, xml_parse) process user-controlled XML without disabling external entity loading. PHP''s libxml
    is vulnerable by default in versions prior to PHP 8.0. Covers simplexml, DOM, XMLReader, and XMLParser extensions.

    '
  language: php
  category: injection
  severity: High
  confidence: 0.9
  cwe: CWE-611
  owasp: A05:2021-Security-Misconfiguration
  tags:
