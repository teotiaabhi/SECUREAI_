    - PHP-INJ-007
- rule_id: PHP-INJ-014
  title: Mail Header Injection via mail()/PHPMailer
  description: 'Detects email header injection where user-controlled input is passed to mail() headers, PHPMailer, or SwiftMailer recipients without proper validation, enabling spam relay, BCC injection,
    and content manipulation.

    '
  language: php
  category: injection
  severity: Medium
  confidence: 0.86
  cwe: CWE-93
  owasp: A03:2021-Injection
  tags:
  - mail-injection
  - header-injection
  - spam-relay
  - php
  detection_layer: 2
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: mail\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|to|email|recipient|input)\b
    description: mail() with user-controlled recipient
  - type: regex
    pattern: mail\s*\(\s*[^,]*,\s*[^,]*,\s*[^,]*,\s*[^)]*\$(?:_(?:GET|POST|REQUEST)|input|from|subject|headers)\b
    description: mail() with user-controlled additional headers
  - type: regex
    pattern: (?:From|Cc|Bcc|Reply-To):\s*["']?\s*\.\s*\$(?:_(?:GET|POST|REQUEST)|input|email|from|user)\b
    description: Email header built with concatenated user input
  - type: regex
    pattern: ->(?:setFrom|addAddress|addCC|addBCC|addReplyTo)\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|input|email|from|user)\b
    description: PHPMailer method with user-controlled email address
  - type: regex
    pattern: sprintf\s*\(\s*["'](?:From|Cc|Bcc|Reply-To):\s*%s["'][^)]*\$(?:_(?:GET|POST|REQUEST)|input|email|from|user)\b
    description: Email header via sprintf with user input
  anti_patterns:
  - filter_var.*FILTER_VALIDATE_EMAIL
  - FILTER_SANITIZE_EMAIL
  - idn_to_ascii
  - preg_match.*@
  - PHPMailer::validateAddress
  - SwiftMailer
  bypass_variants:
  - description: Newline injection in headers
    pattern: '%0[aAdD]|\\\\r|\\\\n'
  - description: Header injection via To field
    pattern: 'user@example\\.com%0aBcc:'
  evasion_indicators:
  - Newline injection in email fields
  - BCC header injection
  - Subject header injection
  encoding_variants:
  - type: url_encoding
    pattern: '%0[aAdD]'
  multi_function_chain_patterns:
  - $_POST['email'] -> mail($email, $subject, $body)
  - '$_POST[''from''] -> ''From: '' . $from -> mail($to, $subj, $body, $headers)'
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Spam relay and phishing via injected headers
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: false
    compliance_relevant: true
  probable_taint_paths:
  - source: $_POST['email'], $_POST['from']
    sink: mail(), PHPMailer::addAddress()
    through: Direct or header-concatenated user input
  impact: 'Mail header injection enables spam relay (sending to arbitrary

    recipients via BCC injection), phishing via spoofed From headers,

    and content manipulation via injected Subject/Content-Type headers.

    '
  remediation: "Validate email addresses and strip newlines:\n\n  // SAFE: Validate email format\n  $email = filter_var($_POST['email'], FILTER_VALIDATE_EMAIL);\n  if ($email === false) { throw new Exception('Invalid\
    \ email'); }\n\n  // SAFE: Strip CRLF from all header values\n  $from = str_replace([\"\\r\", \"\\n\"], '', $_POST['from']);\n\n  // SAFE: Use PHPMailer with validation\n  $mail = new PHPMailer(true);\n\
    \  $mail->setFrom($validated_email); // PHPMailer validates\n\nLaravel: Use Mail facade which handles validation internally.\n"
  references:
  - https://cwe.mitre.org/data/definitions/93.html
  - https://owasp.org/www-community/attacks/Email_Header_Injection
  context_awareness:
    surrounding_context_patterns:
    - mail(
    - PHPMailer
    - SwiftMailer
    - setFrom(
    - addAddress(
    taint_source_indicators:
    - $_GET
    - $_POST
    - $_REQUEST
    - $request->input(
    taint_sink_indicators:
    - mail(
    - ->setFrom(
    - ->addAddress(
    - ->addCC(
    - ->addBCC(
    sanitization_patterns:
    - FILTER_VALIDATE_EMAIL
    - FILTER_SANITIZE_EMAIL
    - PHPMailer::validateAddress
  severity_scoring:
    severity_weight: 6
    risk_score_formula_hint: severity_weight * confidence * spam_relay_risk
    exploitability_score: Medium
  exploit_scenario:
    attack_example: 'Contact form: mail($_POST[''to''], $subj, $body, "From: " . $_POST[''email'']).

      Attacker sends email=attacker@evil.com%0aBcc:victim1@x.com,victim2@x.com.

      '
    example_payload: 'attacker@evil.com\r\nBcc: victim@target.com'
    attacker_objective: Use server as spam relay via BCC header injection
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: simple
  cross_rule_intelligence:
    cross_file_risk_flag: false
    requires_ai_validation: false
    high_impact_flag: false
    related_rules:
    - PHP-INJ-011
    - PHP-INJ-002
- rule_id: PHP-INJ-015
  title: Second-Order SQL Injection via Stored Data
  description: 'Detects second-order SQL injection where previously stored data (database records, session values, file contents) is used in SQL queries without parameterization. The initial storage may
    be safe but subsequent use in queries creates injection opportunities.

    '
  language: php
  category: injection
  severity: High
  confidence: 0.8
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - sql-injection
  - second-order
  - stored-data
  - php
  detection_layer: 3
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: (?:query|exec|prepare)\s*\(\s*["'](?:SELECT|INSERT|UPDATE|DELETE)\b[^"']*["']?\s*\.\s*\$(?:row|result|record|data|user|profile|settings)\b\[
    description: SQL query with concatenated database result column
  - type: regex
    pattern: (?:query|exec)\s*\(\s*["'](?:SELECT|INSERT|UPDATE|DELETE)\b[^"']*["']?\s*\.\s*\$_SESSION\b\[
    description: SQL query with concatenated session value
  - type: regex
    pattern: sprintf\s*\(\s*["'](?:SELECT|INSERT|UPDATE|DELETE)\b[^"']*%s[^"']*["']\s*,\s*\$(?:row|result|record|data)\b\[
    description: SQL via sprintf with stored data column
  - type: regex
    pattern: \$(?:username|name|email|title|value)\s*=\s*\$(?:row|result|record)\b\[["'][^"']*["']\][^;]*\n[^;]*(?:query|exec)\s*\(\s*["'][^"']*["']?\s*\.\s*\$(?:username|name|email|title|value)\b
    description: Variable from DB result used in subsequent query concatenation
  - type: regex
    pattern: ->(?:where|whereRaw|havingRaw|orderByRaw)\s*\(\s*[^)]*\$(?:row|result|record|data|stored)\b\[
    description: Laravel raw query method with stored data
  anti_patterns:
  - ->where(
  - PDO::prepare
  - bindParam
  - bindValue
  - parameterized
  - prepared statement
  - Eloquent
  bypass_variants:
  - description: Stored XSS escalating to SQLi
    pattern: htmlspecialchars.*query
  - description: Cache-based injection
    pattern: cache.*get.*query
  evasion_indicators:
  - Data stored safely then used unsafely
  - Cross-request injection
  - Cache-based payload delivery
  encoding_variants:
  - type: stored_payload
    pattern: admin''--
  multi_function_chain_patterns:
  - INSERT (parameterized) -> SELECT row -> query('...' . $row['name'])
  - $_SESSION['user'] = $input -> query('...' . $_SESSION['user'])
  privilege_context_flags:
    requires_auth_context: true
    admin_only_risk: false
    escalation_vector: SQLi via previously stored malicious data
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: Database query results, $_SESSION, cache values
    sink: mysqli_query(), PDO::exec(), ->whereRaw()
    through: Stored data treated as trusted in subsequent queries
  impact: 'Second-order SQL injection is particularly dangerous because it

    bypasses input validation at the storage point. The payload persists

    in the database and triggers when the stored data is used in

    subsequent queries, potentially across different application components.

    '
  remediation: "Always use parameterized queries, even for stored data:\n\n  // UNSAFE: Stored data in query concatenation\n  $name = $row['username'];\n  $db->query(\"SELECT * FROM orders WHERE customer\
    \ = '$name'\");\n\n  // SAFE: Parameterized even for stored data\n  $stmt = $db->prepare(\"SELECT * FROM orders WHERE customer = ?\");\n  $stmt->execute([$row['username']]);\n\n  // SAFE: Laravel Eloquent\
    \ (auto-parameterized)\n  Order::where('customer', $row['username'])->get();\n\n  // UNSAFE: Laravel raw query with stored data\n  DB::select(\"SELECT * FROM orders WHERE customer = '{$row['username']}'\"\
    );\n\nTreat ALL data as untrusted, regardless of source.\nUse parameterized queries everywhere, not just at input boundaries.\n"
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://owasp.org/www-community/attacks/SQL_Injection
  context_awareness:
    surrounding_context_patterns:
    - mysqli_query(
    - PDO::exec(
    - ->query(
    - ->whereRaw(
    taint_source_indicators:
    - $row[
    - $result[
    - $record[
    - $_SESSION[
    - $data[
    taint_sink_indicators:
    - query(
    - exec(
    - ->whereRaw(
    - ->havingRaw(
    - ->orderByRaw(
    sanitization_patterns:
    - prepare(
    - bindParam(
    - bindValue(
    - ->where(
    - Eloquent
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * stored_data_trust_factor
    exploitability_score: Medium
  exploit_scenario:
    attack_example: 'User registers with username: admin''-- (safely stored via prepared statement).

      Admin panel displays user list: query("SELECT * FROM logs WHERE user = ''$username''").

      The stored payload triggers SQL injection in the admin context.

      '
    example_payload: admin' UNION SELECT password FROM users--
    attacker_objective: Inject SQL via stored malicious data in privileged context
  confidence_factors:
    pattern_strength: medium
    context_match: high
    proximity_to_user_input: medium
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: complex
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PHP-INJ-001
    - PHP-INJ-003
