- rule_id: PHP-INJ-012
  title: PHP Type Juggling in Security Comparisons
  description: 'Detects loose comparison (== instead of ===) of user input against security-sensitive values (passwords, tokens, hashes), enabling authentication bypass through PHP''s type coercion. Includes
    strcmp() bypass and hash comparison vulnerabilities.

    '
  language: php
  category: injection
  severity: High
  confidence: 0.85
  cwe: CWE-843
  owasp: A02:2021-Cryptographic-Failures
  tags:
  - type-juggling
  - loose-comparison
  - authentication-bypass
  - php
  detection_layer: 2
  attack_surface_type: web
  patterns:
  - type: regex
    pattern: \$(?:_(?:GET|POST|REQUEST|COOKIE)|input|password|token|key|secret|hash|api_key)\b\s*==\s*(?:\$(?:stored|expected|hash|password|token|db|correct|valid)|[a-zA-Z_]\w{0,30}\()
    description: Loose comparison of user input with security value
  - type: regex
    pattern: (?:\$(?:stored|expected|hash|password|token|db|correct|valid)|[a-zA-Z_]\w{0,30}\()\s*==\s*\$(?:_(?:GET|POST|REQUEST|COOKIE)|input|password|token|key|secret)\b
    description: Loose comparison of security value with user input (reversed)
  - type: regex
    pattern: strcmp\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|input|password|token)\b[^)]*\)\s*==\s*0
    description: strcmp bypass via array injection (returns NULL == 0)
  - type: regex
    pattern: md5\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|input|password)\b[^)]*\)\s*==\s*["']0e\d+
    description: MD5 magic hash comparison (0e... == 0)
  - type: regex
    pattern: hash\s*\(\s*["'](?:md5|sha1|sha256)["'][^)]*\$(?:_(?:GET|POST|REQUEST)|input|password)\b[^)]*\)\s*==\s*
    description: Hash comparison with loose equality
  anti_patterns:
  - ===
  - '!=='
  - hash_equals(
  - password_verify(
  - sodium_crypto
  - strict comparison
  bypass_variants:
  - description: Magic hash 0e462097431906509019562988736854
    pattern: 0e\\d{30}
  - description: Array vs string comparison
    pattern: \\[\\]
  evasion_indicators:
  - PHP magic hashes (0e...)
  - Array parameter injection for strcmp
  - Integer string coercion
  encoding_variants:
  - type: php_type_coercion
    pattern: 0e\\d+
  multi_function_chain_patterns:
  - $_POST['password'] -> md5($password) == $stored_hash
  - $_POST['token'] -> strcmp($token, $valid_token) == 0
  privilege_context_flags:
    requires_auth_context: true
    admin_only_risk: false
    escalation_vector: Authentication bypass via type coercion
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: $_POST['password'], $_POST['token']
    sink: == comparison, strcmp()
    through: Loose comparison operator
  impact: 'Type juggling enables authentication bypass, HMAC verification bypass,

    and API key comparison bypass. Magic hashes (0e...) compare as equal

    to 0 with loose comparison. Array injection causes strcmp() to return

    NULL which equals 0 with loose comparison.

    '
  remediation: "Always use strict comparison (===) for security values:\n\n  // UNSAFE: Loose comparison\n  if (md5($input) == $stored_hash) { /* bypassed */ }\n\n  // SAFE: Strict comparison\n  if (md5($input)\
    \ === $stored_hash) { /* secure */ }\n\n  // SAFE: Use hash_equals for timing-safe comparison\n  if (hash_equals($stored_hash, md5($input))) { /* secure */ }\n\n  // SAFE: Use password_verify for passwords\n\
    \  if (password_verify($input, $stored_hash)) { /* secure */ }\n\n  // UNSAFE: strcmp with array injection\n  if (strcmp($_POST['token'], $secret) == 0) { /* bypassed via ?token[]=x */ }\n\n  // SAFE:\
    \ Type-check first\n  if (is_string($_POST['token']) && hash_equals($secret, $_POST['token'])) { /* secure */ }\n"
  references:
  - https://cwe.mitre.org/data/definitions/843.html
  - https://owasp.org/www-community/vulnerabilities/PHP_Magic_Tricks_Type_Juggling
  context_awareness:
    surrounding_context_patterns:
    - md5(
    - sha1(
    - hash(
    - strcmp(
    - password
    - token
    - api_key
    taint_source_indicators:
    - $_GET
    - $_POST
    - $_REQUEST
    - $_COOKIE
    - $request->input(
    taint_sink_indicators:
    - == $
    - == '
    - strcmp(
    - == 0
    sanitization_patterns:
    - ===
    - hash_equals(
    - password_verify(
    - is_string(
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * auth_context_factor
    exploitability_score: High
  exploit_scenario:
    attack_example: 'Login compares: if (md5($_POST[''password'']) == $db_hash).

      Attacker sends password=240610708 which produces md5 hash starting

      with 0e... matching another 0e... hash via loose comparison.

      '
    example_payload: '240610708'
    attacker_objective: Bypass password authentication via PHP magic hash collision
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: false
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - PHP-INJ-001
    - PHP-INJ-003
- rule_id: PHP-INJ-013
