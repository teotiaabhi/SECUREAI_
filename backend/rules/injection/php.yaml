- rule_id: PHP-INJ-009
  title: Server-Side Request Forgery (SSRF) via curl/file_get_contents
  description: 'Detects SSRF where user-controlled URLs are passed to curl_exec, file_get_contents, or Guzzle HTTP client, enabling access to internal services, cloud metadata endpoints, and port scanning.

    '
  language: php
  category: injection
  severity: High
  confidence: 0.89
  cwe: CWE-918
  owasp: A10:2021-Server-Side-Request-Forgery
  tags:
  - ssrf
  - url-injection
  - internal-access
  - php
  - curl
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: file_get_contents\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|url|target|endpoint|input|param)\b
    description: file_get_contents with user-controlled URL
  - type: regex
    pattern: curl_setopt\s*\(\s*\$\w+\s*,\s*CURLOPT_URL\s*,\s*\$(?:_(?:GET|POST|REQUEST)|url|target|endpoint|input|param)\b
    description: curl_setopt CURLOPT_URL with user-controlled URL
  - type: regex
    pattern: curl_init\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|url|target|endpoint|input|param)\b
    description: curl_init with user-controlled URL
  - type: regex
    pattern: (?:new\s+)?(?:GuzzleHttp\\\\)?Client\s*\)\s*->(?:get|post|request)\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|url|target|input)\b
    description: Guzzle HTTP client with user-controlled URL
  - type: regex
    pattern: fopen\s*\(\s*\$(?:_(?:GET|POST|REQUEST)|url|target|input|param)\b\s*,\s*["']r
    description: fopen with user-controlled URL for reading
  anti_patterns:
  - parse_url
  - filter_var.*FILTER_VALIDATE_URL
  - CURLOPT_PROTOCOLS
  - allowedHosts
  - isPrivateIP
  - gethostbyname
  - allowlist
  bypass_variants:
  - description: DNS rebinding
    pattern: gethostbyname.*\$(?:url|host)
  - description: Decimal IP encoding
    pattern: 2130706433|0x7f000001
  evasion_indicators:
  - DNS rebinding
  - Decimal/octal IP encoding
  - URL parser differentials
  encoding_variants:
  - type: decimal_ip
    pattern: '2130706433'
  - type: url_encoding
    pattern: '%31%36%39%2e%32%35%34'
  multi_function_chain_patterns:
  - $_GET['url'] -> file_get_contents($url)
  - $request->input('target') -> curl_init($target) -> curl_exec()
  privilege_context_flags:
    requires_auth_context: false
    admin_only_risk: false
    escalation_vector: Access internal services and cloud metadata (169.254.169.254)
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  probable_taint_paths:
  - source: $_GET, $_POST, $request->input()
    sink: file_get_contents(), curl_exec(), Guzzle->get()
    through: Direct URL from user input
  impact: 'SSRF enables access to internal services, cloud metadata endpoints

    (AWS/GCP/Azure), port scanning of internal networks, and credential

    theft from cloud IAM roles.

    '
  remediation: "Validate URLs against an allowlist. Block private IP ranges:\n\n  // SAFE: Validate URL and block internal IPs\n  $url = filter_var($input, FILTER_VALIDATE_URL);\n  $host = parse_url($url,\
    \ PHP_URL_HOST);\n  $ip = gethostbyname($host);\n  if (filter_var($ip, FILTER_VALIDATE_IP, FILTER_FLAG_NO_PRIV_RANGE | FILTER_FLAG_NO_RES_RANGE) === false) {\n      throw new Exception('Access to internal\
    \ IPs blocked');\n  }\n\n  // SAFE: Restrict curl protocols\n  curl_setopt($ch, CURLOPT_PROTOCOLS, CURLPROTO_HTTPS);\n\nLaravel: Use Http::withOptions(['protocols' => CURLPROTO_HTTPS]).\n"
  references:
  - https://cwe.mitre.org/data/definitions/918.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - curl_init(
    - file_get_contents(
    - GuzzleHttp
    - fopen(
    taint_source_indicators:
    - $_GET
    - $_POST
    - $_REQUEST
    - $request->input(
    taint_sink_indicators:
    - file_get_contents(
    - curl_exec(
    - curl_init(
    - fopen(
    sanitization_patterns:
    - parse_url(
    - FILTER_VALIDATE_URL
    - CURLOPT_PROTOCOLS
    - allowedHosts
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 - url_validation_factor)
