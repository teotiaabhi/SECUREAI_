  exploit_scenario:
    attack_example: 'An application receives serialized user session data via a cookie or API endpoint and deserializes it
      with BinaryFormatter. An attacker crafts a payload using ysoserial.net with the TypeConfuseDelegate gadget chain. When
      deserialized, the payload executes "cmd /c powershell -enc <base64_reverse_shell>" on the server, granting the attacker
      a remote shell.

      '
    example_payload: ysoserial.net -g TypeConfuseDelegate -f BinaryFormatter -c 'calc.exe'
    attacker_objective: 'Achieve remote code execution on the server by exploiting unsafe deserialization to instantiate arbitrary
      .NET types via gadget chains (TypeConfuseDelegate, PSObject, TextFormattingRunProperties, etc.).

      '
  confidence_factors:
    pattern_strength: 0.98
    context_match: 0.95
    proximity_to_user_input: 0.85
    sanitization_absence: 0.92
  impact: 'BinaryFormatter deserialization of untrusted data enables remote code

    execution through .NET gadget chains (ysoserial.net). This is considered

    one of the most severe vulnerability classes in .NET applications.

    Full server compromise is typically achievable with known gadget chains.

    '
  remediation: "**Remove BinaryFormatter Entirely (.NET 8 Required):**\n  // BinaryFormatter is OBSOLETE in .NET 8+ (SYSLIB0011)\n\
    \  // It throws PlatformNotSupportedException by default in .NET 9+\n  // Remove all BinaryFormatter usage immediately\n\
    \n**Use System.Text.Json (ASP.NET Core / .NET 8):**\n  using System.Text.Json;\n\n  // Serialization\n  var json = JsonSerializer.Serialize(myObject);\n\
    \n  // Deserialization with strong typing\n  var obj = JsonSerializer.Deserialize<MyKnownType>(json);\n\n  // Configure\
    \ in ASP.NET Core\n  builder.Services.AddControllers()\n      .AddJsonOptions(options =>\n      {\n          options.JsonSerializerOptions.PropertyNamingPolicy\
    \ = JsonNamingPolicy.CamelCase;\n          // .NET 8: source generation for AOT safety\n      });\n\n**Newtonsoft.Json\
    \ (If Required) - Safe Configuration:**\n  var settings = new JsonSerializerSettings\n  {\n      TypeNameHandling = TypeNameHandling.None,\
    \  // CRITICAL: Never use All/Auto\n      MaxDepth = 32\n  };\n  var obj = JsonConvert.DeserializeObject<MyKnownType>(json,\
    \ settings);\n\n**Entity Framework Core (Data Persistence Alternative):**\n  // Store structured data in database instead\
    \ of serialized blobs\n  public class UserSession\n  {\n      public int Id { get; set; }\n      public string UserId\
    \ { get; set; }\n      public string Data { get; set; }  // JSON string, not binary\n  }\n  await _context.Sessions.AddAsync(session);\n\
    \n**DataContractSerializer (For WCF/SOAP Scenarios):**\n  var serializer = new DataContractSerializer(typeof(MyKnownType));\n\
    \  // Only deserialize known, expected types\n"
