- rule_id: CS-INJ-005
  title: XSS via Unencoded Response Output
  description: 'Detects direct writing of user input to HTTP response without encoding in ASP.NET applications. Covers Response.Write,
    Html.Raw, Content() results, and ViewData/ViewBag rendering patterns where user-controlled data is reflected or stored
    without proper HTML encoding, enabling cross-site scripting attacks.

    '
