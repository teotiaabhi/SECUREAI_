    - rule_id: CS-INJ-004
      relationship: Deserialized data rendered in views without encoding enables XSS
    compound_risk_note: 'XSS vulnerabilities compound with all other injection types. SQL injection (CS-INJ-001) that stores
      attacker-controlled data creates stored XSS when that data is rendered via CS-INJ-005 sinks. Always check if data from
      injection-vulnerable sources flows into response rendering without encoding. Presence of Content-Security-Policy headers
      reduces but does not eliminate risk.

      '
