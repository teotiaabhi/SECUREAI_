- rule_id: SQL-INJ-008
  title: LIKE Injection with Wildcard Abuse
  description: 'Detects SQL injection through LIKE clause manipulation where user input containing wildcard characters (%,
    _) is not properly escaped. Attackers can inject % to match all records (data exfiltration), craft expensive LIKE patterns
    for ReDoS-style denial-of-service, or combine LIKE with SQL injection techniques to bypass authentication filters.

    '
  language: sql
  category: injection
  severity: Medium
  confidence: 0.82
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - like-injection
  - wildcard-abuse
  - data-exfiltration
  - dos
  - search-bypass
  - pattern-matching
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: (?i)LIKE\s+['"]%['"]
  - type: regex
    pattern: (?i)LIKE\s+['"]%%['"]
  - type: regex
    pattern: (?i)WHERE\s+\w+\s+LIKE\s+['"]%\s*\{\{.*\}\}\s*%['"]
  - type: regex
    pattern: (?i)LIKE\s+CONCAT\s*\(\s*['"]%['"].*\$
  - type: regex
    pattern: (?i)WHERE\s+\w+\s+LIKE\s+['"](?:%_){5,}['"]
  - type: regex
    pattern: (?i)OR\s+\w+\s+LIKE\s+['"]%['"]
  - type: regex
    pattern: (?i)LIKE\s+['"]%(?:admin|root|password|secret)%['"]
  anti_patterns:
  - ESCAPE\s+['"]\\\\['"]
  - ESCAPE clause
  - sanitize_like
  - escape_wildcards
  - -- full text search
  - MATCH.*AGAINST
  - to_tsvector
  - parameterized
  - PreparedStatement
  - -- search feature
  - LIKE\s+CONCAT\s*\(\s*['"]%['"].*\?\s*,
  - -- migration
  - -- test data
  - legitimate search
  bypass_variants:
  - pattern: (?i)LIKE\s+CHAR\s*\(\s*37\s*\)
    description: Using CHAR(37) to inject % wildcard, bypassing literal percent sign filters
  - pattern: (?i)LIKE\s+['"]_____['"]
    description: Using underscore wildcards to match specific-length values for enumeration
  - pattern: (?i)LIKE\s+['"]%['"](?:\s+ESCAPE\s+['"][^\\\\]['"])
    description: Custom ESCAPE character that does not actually escape wildcards
  evasion_indicators:
  - CHAR() function for wildcard injection
  - underscore patterns for length-based enumeration
  - custom ESCAPE clause that does not neutralize wildcards
  - Unicode-encoded wildcard characters
  - combining LIKE with OR for tautology
  - nested LIKE in subquery
  encoding_variants:
  - CHAR(37) for %
  - CHAR(95) for _
  - '%25 (URL-encoded %)'
  multi_function_chain_patterns:
  - LIKE '%' (match all) -> LIKE '%admin%' (target search)
  - LIKE '____' (enumerate 4-char values) -> LIKE 'adm_' (narrow down)
  - WHERE x LIKE '%' OR 1=1 (LIKE as authentication bypass vector)
  privilege_context_flags:
  - SELECT privilege on searchable tables
  - No elevated privileges needed
  - Full table scan impact on large tables
  business_logic_indicator:
  - Search endpoints with text input
  - Autocomplete/typeahead APIs
  - Filter endpoints with pattern matching
  - Admin panel user search functionality
  probable_taint_paths:
  - source: request.query.search
    through: CONCAT('%', input, '%') without wildcard escaping
    sink: cursor.execute()
  - source: request.body.filter
    through: template interpolation into LIKE clause
    sink: db.query()
  - source: search bar input
    through: string concatenation
    sink: Statement.executeQuery()
  context_awareness:
    surrounding_context_patterns:
    - WHERE\s+\w+\s+LIKE\s+
    - LIKE\s+CONCAT\s*\(
    - search.*query.*LIKE
    - filter.*LIKE
    taint_source_indicators:
    - request\.query\.(?:search|q|query|filter)
    - \$_GET\[.(?:search|q|query).\]
    - params\.get\(.(?:search|q).\)
    - searchInput
    taint_sink_indicators:
    - LIKE\s+CONCAT
    - LIKE\s+['"]%
    - cursor\.execute\(
    - connection\.query\(
    sanitization_patterns:
    - ESCAPE\s+['"]\\\\['"]
    - escape_wildcards\(
    - replace.*%
    - sanitize_like\(
    - MATCH AGAINST
  severity_scoring:
    severity_weight: 5
    risk_score_formula_hint: severity_weight * confidence * data_exposure_factor
    exploitability_score: Medium
  exploit_scenario:
    attack_example: 'An attacker discovers a user search endpoint at /api/users?q=john that constructs: SELECT * FROM users
      WHERE name LIKE ''%'' + input + ''%''. Submitting q=% returns all users. Submitting q=%admin% reveals admin accounts.
      Submitting q=%'' OR ''1''=''1 bypasses the LIKE and returns all records. Repeated requests with q=a%, q=b%, etc. enumerate
      all usernames character by character.

      '
    example_payload: '%'' OR ''1''=''1'
    attacker_objective: Exfiltrate data by manipulating LIKE wildcards, enumerate values through prefix/suffix searching,
      or cause DoS through expensive pattern matching.
  confidence_factors:
    pattern_strength: medium
    context_match: medium
    proximity_to_user_input: high
    sanitization_absence: medium
  impact: 'LIKE injection enables data enumeration through wildcard manipulation,

    authentication bypass via tautology construction, and denial-of-service

    through expensive pattern matching on large tables. While less severe than

    full SQL injection, it can expose significant amounts of data through

    iterative searching.

    '
  remediation: "Parameterized Query with ESCAPE:\n\n  PostgreSQL:\n    cursor.execute(\"SELECT * FROM users WHERE name LIKE\
    \ '%' || $1 || '%' ESCAPE '\\\\'\", [escaped_input])\n    -- Pre-processing: escaped_input = input.replace('%', '\\\\\
    %').replace('_', '\\\\_')\n\n  MySQL:\n    cursor.execute(\"SELECT * FROM users WHERE name LIKE CONCAT('%', %s, '%') ESCAPE\
    \ '\\\\\\\\'\", [escaped_input])\n\nPrevention:\n  - Always escape % and _ in user input before LIKE clauses\n  - Use\
    \ ESCAPE clause to define escape character\n  - Use full-text search (MATCH AGAINST, to_tsvector) instead of LIKE for\
    \ search features\n  - Implement result set limits (LIMIT, TOP) on search queries\n  - Rate-limit search endpoints to\
    \ prevent enumeration\n"
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://owasp.org/www-community/attacks/SQL_Injection
  - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: false
    requires_ai_validation: true
    high_impact_flag: false
    related_rules:
    - SQL-INJ-001
    - SQL-INJ-002
    - SQL-INJ-009
- rule_id: SQL-INJ-009
  title: ORDER BY Injection
  description: 'Detects SQL injection through ORDER BY clauses where user-supplied column names, sort directions, or numeric
    indices are incorporated without validation. Since column identifiers cannot be parameterized, ORDER BY clauses are a
    common injection vector. Attackers leverage this for column count enumeration, boolean-based data inference via conditional
    ordering, and full SQL injection through subquery or CASE WHEN constructs.

    '
  language: sql
  category: injection
  severity: High
  confidence: 0.85
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - order-by-injection
  - column-enumeration
  - sort-parameter
  - dynamic-ordering
  - data-inference
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: (?i)ORDER\s+BY\s+\d{2,}\s*(?:--|#|\/\*)
  - type: regex
    pattern: (?i)ORDER\s+BY\s+(?:CASE\s+WHEN|IF\s*\()
  - type: regex
    pattern: (?i)ORDER\s+BY\s+\(SELECT\s+
  - type: regex
    pattern: (?i)ORDER\s+BY\s+\w+\s*(?:--|#|\/\*)
  - type: regex
    pattern: (?i)ORDER\s+BY\s+RAND\s*\(\s*(?:SELECT|IF|CASE)
  - type: regex
    pattern: (?i)(?:sort|order|sortby|orderby)\s*=\s*[^&]*(?:--|#|\/\*|CASE\s+WHEN|SELECT)
  - type: regex
    pattern: (?i)ORDER\s+BY\s+\w+\s*,\s*\(SELECT
  anti_patterns:
  - ORDER BY created_at
  - ORDER BY id
  - ORDER BY name
  - QUOTENAME
  - whitelist
  - allowedColumns
  - sortableColumns
  - PreparedStatement
  - parameterized
  - -- pagination
  - ORDER\s+BY\s+\?\s+
  - validSortColumns
  - -- default sort
  - legitimate ordering
  - -- migration
  bypass_variants:
  - pattern: (?i)ORDER\s+BY\s+\(SELECT\s+CASE\s+WHEN\s+\(SELECT\s+SUBSTRING.*\)\s*=\s*.*THEN\s+\w+\s+ELSE\s+\w+\s+END\)
    description: Conditional ORDER BY with subquery for boolean-based blind data extraction via sort order
  - pattern: (?i)ORDER\s+BY\s+IF\s*\(\s*\(SELECT.*\)\s*,\s*\w+\s*,\s*\w+\s*\)
    description: MySQL IF() in ORDER BY for conditional sorting based on extracted data
  - pattern: (?i)ORDER\s+BY\s+UPDATEXML\s*\(
    description: Error-based injection within ORDER BY via UPDATEXML for direct data extraction
  evasion_indicators:
  - numeric column index instead of column name
  - CASE WHEN in ORDER BY for conditional sorting
  - subquery in ORDER BY clause
  - RAND() with conditional seed for boolean inference
  - error-producing functions in ORDER BY
  - multiple chained ORDER BY values
  encoding_variants:
  - URL-encoded sort parameters
  - CHAR() for column name construction
  - hex-encoded values in CASE expressions
  multi_function_chain_patterns:
  - ORDER BY 1 -> ORDER BY 2 -> ... (column count discovery)
  - ORDER BY CASE WHEN condition THEN col1 ELSE col2 END (boolean inference)
  - ORDER BY (SELECT ...) (subquery-based extraction)
  privilege_context_flags:
  - SELECT privilege on target tables
  - No special privileges needed
  - Subquery execution privilege for nested SELECT
  business_logic_indicator:
  - Data listing with sort parameter in URL
  - Table view with sortable columns
  - API endpoint accepting sort/order query parameters
  - Admin panel listing with configurable sorting
  probable_taint_paths:
  - source: request.query.sort
    through: direct concatenation into ORDER BY clause
    sink: cursor.execute()
  - source: request.query.orderBy
    through: string interpolation
    sink: db.query()
  - source: URL sort parameter
    through: format string in SQL
    sink: Statement.executeQuery()
  context_awareness:
    surrounding_context_patterns:
    - ORDER\s+BY\s+.*\+.*(?:req|request|params|input)
    - sort\w*\s*=\s*(?:req|request|params)\.
    - ORDER\s+BY\s+['"]?\s*\+\s*\w+\s*\+\s*['"]?
    - QUOTENAME
    taint_source_indicators:
    - request\.query\.(?:sort|order|sortBy|orderBy)
    - \$_GET\[.(?:sort|order).\]
    - params\.get\(.(?:sort|order).\)
    - req\.query\.sort
    taint_sink_indicators:
    - ORDER\s+BY
    - cursor\.execute\(
    - connection\.query\(
    - Statement\.executeQuery\(
    sanitization_patterns:
    - QUOTENAME
    - whitelist validation
    - allowedColumns check
    - enum validation
    - switch/case for column mapping
  severity_scoring:
    severity_weight: 7
    risk_score_formula_hint: severity_weight * confidence * injection_depth_factor
    exploitability_score: Medium
  exploit_scenario:
    attack_example: 'A product listing at /api/products?sort=price&dir=ASC constructs: SELECT * FROM products ORDER BY price
      ASC. The attacker submits sort=(CASE WHEN (SELECT SUBSTRING(password,1,1) FROM users WHERE username=''admin'')=''a''
      THEN price ELSE name END) -- The sort order changes based on whether the first character of the admin password is ''a'',
      enabling boolean-based blind extraction through sort behavior.

      '
    example_payload: (CASE WHEN (SELECT SUBSTRING(password,1,1) FROM users WHERE username='admin')='a' THEN price ELSE name
      END)--
    attacker_objective: Exploit ORDER BY clause to enumerate columns, infer data through conditional sorting, or achieve full
      SQL injection via subqueries.
  confidence_factors:
    pattern_strength: medium
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: high
  impact: 'ORDER BY injection enables column count enumeration (prerequisite for UNION

    attacks), boolean-based data inference through conditional sort behavior,

    and in some cases full SQL injection through subqueries or error-based

    techniques within the ORDER BY clause. It is a common vector because

    column identifiers cannot be parameterized.

    '
  remediation: "Whitelist Validation:\n\n  Node.js:\n    const allowedColumns = ['price', 'name', 'created_at'];\n    const\
    \ sort = allowedColumns.includes(req.query.sort) ? req.query.sort : 'id';\n\n  SQL Server (QUOTENAME):\n    SET @sql =\
    \ N'SELECT * FROM products ORDER BY ' + QUOTENAME(@sortColumn);\n    -- Plus: validate @sortColumn against a whitelist\n\
    \n  Python:\n    ALLOWED_SORTS = {'price', 'name', 'created_at'}\n    sort_col = sort_input if sort_input in ALLOWED_SORTS\
    \ else 'id'\n    cursor.execute(f\"SELECT * FROM products ORDER BY {sort_col}\")\n\nPrevention:\n  - Never directly concatenate\
    \ user input into ORDER BY\n  - Maintain a strict whitelist of allowed sort columns\n  - Map user-provided sort keys to\
    \ safe column names via a dictionary/enum\n  - Use QUOTENAME() (SQL Server) as defense-in-depth\n  - Validate sort direction\
    \ is only ASC or DESC\n"
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://portswigger.net/web-security/sql-injection
  - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - SQL-INJ-001
    - SQL-INJ-002
    - SQL-INJ-008
- rule_id: SQL-INJ-010
  title: Comment-Based SQL Filter Bypass
  description: 'Detects SQL injection techniques that use SQL comments to bypass input filters, WAFs, and keyword detection.
    Covers inline comments (/* */), MySQL version comments (/*!...*/), single-line comments (-- and #), and comment insertion
    between SQL keywords to evade tokenization-based detection. These techniques are commonly used to bypass basic SQL injection
    filters that match on keyword adjacency.

    '
  language: sql
  category: injection
  severity: High
  confidence: 0.87
  cwe: CWE-89
  owasp: A03:2021-Injection
  tags:
  - comment-bypass
  - waf-evasion
  - filter-bypass
  - inline-comment
  - version-comment
  - obfuscation
  detection_layer: 2
  attack_surface_type: api
  patterns:
  - type: regex
    pattern: (?i)\/\*.*\*\/\s*(?:UNION|SELECT|INSERT|UPDATE|DELETE|DROP|OR|AND)
  - type: regex
    pattern: (?i)(?:UNION|SELECT|INSERT|UPDATE|DELETE|DROP)\s*\/\*.*\*\/\s*(?:UNION|SELECT|INSERT|UPDATE|DELETE|DROP|ALL|FROM)
  - type: regex
    pattern: (?i)\/\*![0-9]*\s*(?:SELECT|UNION|INSERT|UPDATE|DELETE|DROP)
  - type: regex
    pattern: (?i)(?:UNION|SELECT|OR|AND)\s*--\s*\n\s*(?:SELECT|FROM|WHERE)
  - type: regex
    pattern: (?i)#\s*\n\s*(?:SELECT|UNION|INSERT|UPDATE|DELETE|DROP|OR|AND)
  - type: regex
    pattern: (?i)UN\/\*\*\/ION\s+SE\/\*\*\/LECT
  - type: regex
    pattern: (?i)\/\*\*\/(?:OR|AND|UNION|SELECT)\/\*\*\/
  anti_patterns:
  - -- migration
  - -- legitimate comment
  - /* copyright */
  - /* eslint */
  - /* jshint */
  - /* istanbul */
  - PreparedStatement
  - parameterized
  - \/\*\s*TODO
  - \/\*\s*FIXME
  - \/\*\s*NOTE
  - -- flyway
  - -- liquibase
  - -- alembic
  - legitimate SQL comment
  bypass_variants:
  - pattern: (?i)UNI%4FN%20SE%4CECT
    description: Partial URL encoding of keywords combined with comment insertion
  - pattern: (?i)\/\*!50000\s*UNION\s*\*\/\s*\/\*!50000\s*SELECT\s*\*\/
    description: MySQL version-conditional comments to execute SQL only on specific MySQL versions
  - pattern: (?i)0x554e494f4e0x53454c454354
    description: Full hex encoding of UNION SELECT keywords to bypass text-based filters
  evasion_indicators:
  - comment insertion between SQL keyword characters
  - MySQL version comments with version numbers
  - alternating inline comments and keywords
  - newline after single-line comment to continue injection
  - nested comments on databases that support them
  - combining URL encoding with comment injection
  encoding_variants:
  - /**/ between every keyword
  - /*!50000 ... */ MySQL version comment
  - -- \n continuation
  - '# \n continuation'
  multi_function_chain_patterns:
  - /**/UNION/**/SELECT (keyword splitting for WAF bypass)
  - /*!UNION*/ /*!SELECT*/ (MySQL version comments for selective execution)
  - --\nUNION\n--\nSELECT (line comment interleaving)
  privilege_context_flags:
  - No special privileges needed
  - Technique is WAF/filter bypass, not privilege-dependent
  - Underlying injection determines required privileges
  business_logic_indicator:
  - Any endpoint with WAF or input filter protecting against SQL injection
  - Endpoints that strip or reject known SQL keywords
  - Applications with custom SQL injection filters
  probable_taint_paths:
  - source: request.query parameter
    through: custom SQL keyword filter (incomplete)
    sink: cursor.execute()
  - source: request.body field
    through: WAF bypass
    sink: db.query()
  - source: URL parameter
    through: regex-based SQL filter (evaded by comments)
    sink: Statement.executeQuery()
  context_awareness:
    surrounding_context_patterns:
    - WHERE\s+\w+\s*=\s*['"]?\{\{.*\}\}['"]?
    - \/\*.*\*\/.*(?:SELECT|UNION|OR|AND)
    - str\.replace.*(?:UNION|SELECT|DROP)
    - blacklist.*(?:UNION|SELECT|DROP)
    taint_source_indicators:
    - request\.(?:params|query|body)\[
    - \$_(?:GET|POST|REQUEST)\[
    - HttpServletRequest\.getParameter\(
    - req\.(?:body|query|params)
    taint_sink_indicators:
    - cursor\.execute\(
    - connection\.query\(
    - Statement\.executeQuery\(
    - PDO::query\(
    - db\.rawQuery\(
    sanitization_patterns:
    - prepared_statement
    - parameterized query
    - ORM query builder
    - whitelist validation only
    - strict type checking
  severity_scoring:
    severity_weight: 7
    risk_score_formula_hint: severity_weight * confidence * filter_bypass_success_rate
    exploitability_score: High
  exploit_scenario:
    attack_example: 'A web application has a custom filter that blocks requests containing "UNION SELECT" as adjacent words.
      The attacker bypasses this by submitting: /products?id=1 UN/**/ION SE/**/LECT username,password,3 FROM users-- The inline
      comments split the keywords, bypassing the filter, but the database ignores the comments and executes the UNION SELECT
      normally.

      '
    example_payload: 1 UN/**/ION SE/**/LECT username,password,3 FROM users--
    attacker_objective: Bypass SQL injection filters, WAFs, and keyword blacklists using SQL comment syntax to execute otherwise
      blocked injection payloads.
  confidence_factors:
    pattern_strength: high
    context_match: high
    proximity_to_user_input: high
    sanitization_absence: medium
  impact: 'Comment-based bypasses render keyword-based SQL injection filters ineffective.

    Once the filter is bypassed, the attacker can execute any SQL injection

    technique (UNION, stacked queries, blind injection) with full impact. This

    technique is commonly used against WAFs and custom input filters, making

    defense-in-depth critical.

    '
  remediation: "Parameterized Queries (primary defense):\n  - Use parameterized queries/prepared statements exclusively\n\
    \  - Comments bypass keyword filters but NOT parameterized queries\n  - Never rely solely on input filtering for SQL injection\
    \ prevention\n\nWAF Configuration:\n  - Configure WAF to detect comment patterns within SQL contexts\n  - Enable comment\
    \ normalization (strip comments before analysis)\n  - Use semantic SQL parsing instead of regex-based detection\n  - Block\
    \ requests containing /**/ or /*!...*/ in query parameters\n\nFilter Hardening (defense-in-depth only):\n  - Normalize\
    \ input by stripping comments before keyword matching\n  - Use SQL tokenizer instead of regex for keyword detection\n\
    \  - Implement whitelist validation instead of blacklist filtering\n  - Detect hex encoding, URL encoding, and mixed-case\
    \ evasion\n"
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://portswigger.net/web-security/sql-injection/bypassing-filters
  - https://owasp.org/www-community/attacks/SQL_Injection_Bypassing_WAF
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: contextual
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - SQL-INJ-001
    - SQL-INJ-004
    - SQL-INJ-002
