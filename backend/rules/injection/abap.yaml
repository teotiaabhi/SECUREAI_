rules:
- rule_id: ABAP-INJ-001
  title: SQL Injection via Dynamic WHERE Clause
  description: 'Detects SQL injection via dynamic WHERE clause construction in ABAP.

    '
  language: abap
  category: injection
  severity: Critical
  confidence: 0.92
  cwe: CWE-89
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - sql-injection
  - open-sql
  - dynamic-where
  patterns:
  - type: regex
    pattern: SELECT\s+.*\s+FROM\s+.*\s+WHERE\s+\(\s*(?:lv_|gv_|iv_|ev_|cv_)\w+\s*\)
  - type: regex
    pattern: SELECT\s+.*\s+WHERE\s+\(\s*(?:sy-|iv_|lv_)\w+\s*\)
  - type: regex
    pattern: CONCATENATE\s+.*INTO\s+(?:lv_|gv_)where_clause
  - type: regex
    pattern: cl_abap_dyn_prg=>(?:check_whitelist|escape_quotes).*(?:BYPASSED|IGNORE)
  anti_patterns:
  - cl_abap_dyn_prg=>check_whitelist
  - cl_abap_dyn_prg=>escape_quotes
  - quote
  impact: 'Dynamic WHERE clauses allow SQL injection in SAP systems,

    potentially compromising business-critical data.

    '
  remediation: "Use static WHERE clauses or cl_abap_dyn_prg=>check_whitelist_str:\n  DATA(lv_safe) = cl_abap_dyn_prg=>check_whitelist_str(\n    val = lv_input allowed_chars = '0123456789ABCDEF' ).\n"
- rule_id: ABAP-INJ-002
  title: OS Command Injection
  description: 'Detects OS command execution with user-controlled input in ABAP.

    '
  language: abap
  category: injection
  severity: Critical
  confidence: 0.9
  cwe: CWE-78
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - command-injection
  - os-command
  patterns:
  - type: regex
    pattern: CALL\s+'SXPG_COMMAND_EXECUTE'\b
  - type: regex
    pattern: CALL\s+FUNCTION\s+'SXPG_CALL_SYSTEM'\b
  - type: regex
    pattern: CALL\s+'SYSTEM'\b
  - type: regex
    pattern: cl_gui_frontend_services=>execute\b
  anti_patterns:
  - AUTHORITY-CHECK
  - SM69
  - allowed_commands
  impact: 'OS command injection on SAP application servers can compromise

    the entire SAP landscape.

    '
  remediation: 'Use SM69 to define allowed external commands.

    Always perform AUTHORITY-CHECK before executing commands.

    '
- rule_id: ABAP-INJ-003
  title: ABAP Code Injection via Dynamic Programming
  description: 'Detects dynamic ABAP code generation and execution.

    '
  language: abap
  category: injection
  severity: Critical
  confidence: 0.88
  cwe: CWE-94
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - code-injection
  - dynamic-programming
  patterns:
  - type: regex
    pattern: GENERATE\s+SUBROUTINE\s+POOL\b
  - type: regex
    pattern: INSERT\s+REPORT\s+FROM\b
  - type: regex
    pattern: READ\s+REPORT\s+.*INTO\b.*GENERATE
  - type: regex
    pattern: EDITOR-CALL\s+FOR\s+REPORT\b
  anti_patterns:
  - AUTHORITY-CHECK
  - S_DEVELOP
  impact: 'Dynamic ABAP code injection allows execution of arbitrary ABAP on the system.

    '
  remediation: 'Avoid GENERATE SUBROUTINE POOL with user input.

    Use AUTHORITY-CHECK OBJECT ''S_DEVELOP'' for development-related operations.

    '
- rule_id: ABAP-INJ-004
  title: RFC/BAPI Injection
  description: 'Detects dynamic RFC/BAPI calls with user-controlled function names.

    '
  language: abap
  category: injection
  severity: High
  confidence: 0.85
  cwe: CWE-78
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - rfc
  - bapi
  - dynamic-call
  patterns:
  - type: regex
    pattern: CALL\s+FUNCTION\s+(?:lv_|gv_|iv_|ev_)\w+\b
  - type: regex
    pattern: CALL\s+FUNCTION\s+(?:sy-|p_|pa_)\w+\b
  anti_patterns:
  - AUTHORITY-CHECK
  - whitelist
  - allowed_functions
  - CONSTANTS
  impact: Injection attacks can lead to data breach, unauthorized access, or system compromise
  remediation: Use parameterized queries, input validation, and output encoding
- rule_id: ABAP-XAUTH-001
  title: Missing Authority Check
  description: 'Detects sensitive operations without AUTHORITY-CHECK.

    '
  language: abap
  category: auth
  severity: High
  confidence: 0.78
  cwe: CWE-862
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - authorization
  - authority-check
  patterns:
  - type: regex
    pattern: CALL\s+TRANSACTION\s+(?:lv_|gv_|iv_|sy-)\w+\b
  - type: regex
    pattern: SUBMIT\s+(?:lv_|gv_|iv_|sy-)\w+\b
  - type: regex
    pattern: (?:DELETE|MODIFY|UPDATE)\s+(?:dbtab|ztab|z\w+)\s+FROM\b
  anti_patterns:
  - AUTHORITY-CHECK
  - cl_auth
  - PERMISSION
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: ABAP-XAUTH-002
  title: Hardcoded SAP Credentials
  description: 'Detects hardcoded SAP user credentials in ABAP code.

    '
  language: abap
  category: auth
  severity: Critical
  confidence: 0.92
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - hardcoded-credentials
  - sap
  patterns:
  - type: regex
    pattern: (?:lv_|gv_)(?:password|passwd)\s*=\s*'[^']{4,}'
  - type: regex
    pattern: CALL\s+FUNCTION\s+'(?:RFC_LOGON|BAPI_USER_CHANGE)'.*EXPORTING.*password\s*=\s*'[^']{4,}'
  - type: regex
    pattern: cl_http_client.*set_credentials.*(?:password|passwd)\s*=\s*'[^']{4,}'
  anti_patterns:
  - placeholder
  - initial
  - space
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: ABAP-XAUTH-003
  title: Bypassed Authority Check
  description: 'Detects authority checks that are bypassed with SY-SUBRC check avoidance.

    '
  language: abap
  category: auth
  severity: Critical
  confidence: 0.85
  cwe: CWE-863
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - authorization-bypass
  patterns:
  - type: regex
    pattern: AUTHORITY-CHECK\s+OBJECT\b.*\.\s*(?:CLEAR|MOVE\s+0\s+TO)\s+SY-SUBRC
  - type: regex
    pattern: AUTHORITY-CHECK\s+OBJECT\b.*\.\s*".*(?:IGNORE|BYPASS|SKIP)
  anti_patterns:
  - IF SY-SUBRC <> 0
  - IF SY-SUBRC NE 0
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: ABAP-XCRYPTO-001
  title: Weak Hashing in ABAP
  description: 'Detects use of weak hashing algorithms in ABAP.

    '
  language: abap
  category: crypto
  severity: High
  confidence: 0.88
  cwe: CWE-327
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - weak-hash
  - md5
  - sha1
  patterns:
  - type: regex
    pattern: cl_abap_message_digest=>(?:calculate_hash_for_char|calculate_hash_for_raw).*algorithm\s*=\s*'(?:MD5|SHA1|SHA-1)'
  - type: regex
    pattern: CALL\s+FUNCTION\s+'CALCULATE_HASH_FOR_RAW'.*EXPORTING.*alg\s*=\s*'(?:MD5|SHA1)'
  anti_patterns:
  - SHA256
  - SHA512
  - SHA-256
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: ABAP-XSS-001
  title: Cross-Site Scripting in BSP/Web Dynpro
  description: 'Detects XSS vulnerabilities in BSP or Web Dynpro ABAP applications.

    '
  language: abap
  category: xss
  severity: High
  confidence: 0.85
  cwe: CWE-79
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - xss
  - bsp
  - web-dynpro
  patterns:
  - type: regex
    pattern: cl_http_utility=>if_http_utility~escape_html.*BYPASSED
  - type: regex
    pattern: response->set_data\s*\(\s*(?:lv_|gv_|iv_)\w+\s*\)
  - type: regex
    pattern: <%=\s*(?:lv_|gv_|iv_|request->)\w+
  anti_patterns:
  - cl_http_utility=>escape_html
  - cl_abap_dyn_prg=>escape_xss
  - encode
  impact: Cross-site scripting enables session hijacking, credential theft, and website defacement
  remediation: Apply context-aware output encoding and use Content Security Policy headers
- rule_id: ABAP-PATH-001
  title: Directory Traversal in File Operations
  description: 'Detects file operations with user-controlled paths in ABAP.

    '
  language: abap
  category: path_traversal
  severity: High
  confidence: 0.85
  cwe: CWE-22
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 1
  tags:
  - path-traversal
  - file-access
  patterns:
  - type: regex
    pattern: OPEN\s+DATASET\s+(?:lv_|gv_|iv_|pa_)\w+\s+FOR\s+(?:INPUT|OUTPUT|APPENDING)\b
  - type: regex
    pattern: cl_gui_frontend_services=>(?:gui_download|gui_upload).*filename\s*=\s*(?:lv_|gv_|iv_|pa_)\w+
  anti_patterns:
  - AUTHORITY-CHECK
  - FILE_VALIDATE_NAME
  - cl_abap_dyn_prg=>check_whitelist
  impact: Path traversal enables reading or writing arbitrary files on the server
  remediation: Canonicalize paths and verify they remain within expected base directories
- rule_id: ABAP-SSRF-001
  title: Server-Side Request Forgery
  description: 'Detects HTTP client calls with user-controlled URLs in ABAP.

    '
  language: abap
  category: ssrf
  severity: High
  confidence: 0.85
  cwe: CWE-918
  owasp: A10:2021-Server-Side-Request-Forgery
  detection_layer: 1
  tags:
  - ssrf
  - http-client
  patterns:
  - type: regex
    pattern: cl_http_client=>create_by_url.*url\s*=\s*(?:lv_|gv_|iv_|pa_)\w+
  - type: regex
    pattern: cl_http_client=>create_by_destination.*destination\s*=\s*(?:lv_|gv_|iv_|pa_)\w+
  anti_patterns:
  - validate_url
  - allowed_hosts
  - whitelist
  impact: Server-side request forgery enables access to internal resources and cloud metadata
  remediation: Validate and allowlist URLs, block private IP ranges and cloud metadata endpoints
- rule_id: ABAP-XSEC-001
  title: Sensitive Data in Application Log
  description: 'Detects logging of sensitive data in ABAP application logs.

    '
  language: abap
  category: secrets
  severity: Medium
  confidence: 0.8
  cwe: CWE-532
  owasp: A09:2021-Security-Logging-and-Monitoring-Failures
  detection_layer: 1
  tags:
  - logging
  - data-exposure
  patterns:
  - type: regex
    pattern: (?:WRITE|MESSAGE)\s+.*(?:lv_|gv_)?(?:password|passwd|secret|token|ssn|credit_card)\b
  - type: regex
    pattern: BAL_LOG_MSG_ADD.*(?:password|passwd|secret|token|ssn)\b
  anti_patterns:
  - mask
  - redact
  - '****'
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: ABAP-FW-001
  title: Cross-Client Data Access
  description: 'Detects attempts to access data across SAP clients.

    '
  language: abap
  category: framework_misuse
  severity: High
  confidence: 0.82
  cwe: CWE-284
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - cross-client
  - sap
  patterns:
  - type: regex
    pattern: SELECT\s+.*\s+CLIENT\s+SPECIFIED\b
  - type: regex
    pattern: SELECT\s+.*\s+USING\s+CLIENT\b
  anti_patterns:
  - AUTHORITY-CHECK
  - S_TABU_CLI
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
