rules:
- rule_id: ABAP-AUTH-001
  title: Missing Authority Check Before Data Access
  description: 'Detects database operations without AUTHORITY-CHECK.

    '
  language: abap
  category: auth
  severity: High
  confidence: 0.82
  cwe: CWE-862
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - abap
  - authority-check
  - access-control
  patterns:
  - type: regex
    pattern: SELECT\s+.*FROM\s+\w+\b(?!\s*WHERE\s+.*AUTHORITY)
  anti_patterns:
  - AUTHORITY-CHECK
  - PERFORM.*AUTH
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: ABAP-AUTH-002
  title: Improper SY-SUBRC Check After Auth
  description: 'Detects AUTHORITY-CHECK without verifying SY-SUBRC.

    '
  language: abap
  category: auth
  severity: High
  confidence: 0.85
  cwe: CWE-862
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - abap
  - authority-check
  - sy-subrc
  patterns:
  - type: regex
    pattern: AUTHORITY-CHECK\s+OBJECT\b
  anti_patterns:
  - IF SY-SUBRC
  - IF sy-subrc
  - CHECK SY-SUBRC
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: ABAP-CRYPTO-001
  title: Insecure Hash Algorithm
  description: 'Detects usage of MD5 or SHA1 for password hashing.

    '
  language: abap
  category: crypto
  severity: High
  confidence: 0.88
  cwe: CWE-327
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - abap
  - hash
  - weak-algorithm
  patterns:
  - type: regex
    pattern: CALL\s+FUNCTION\s+["\x27]CALCULATE_HASH_FOR_CHAR["\x27]
  - type: regex
    pattern: cl_abap_message_digest=>calculate_hash_for_char.*algorithm\s*=\s*["\x27](?:MD5|SHA1)["\x27]
  anti_patterns:
  - SHA256
  - SHA512
  - PBKDF2
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: ABAP-CRYPTO-002
  title: Hardcoded SAP Client Password
  description: 'Detects hardcoded client passwords in ABAP code.

    '
  language: abap
  category: secrets
  severity: Critical
  confidence: 0.9
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - abap
  - hardcoded
  - password
  patterns:
  - type: regex
    pattern: (?:BAPI_USER_CHANGE|BAPI_USER_CREATE).*PASSWORD\s*=\s*["\x27]
  - type: regex
    pattern: DATA.*password.*TYPE\s+c\s+VALUE\s+["\x27][^"\x27]{4,}
  anti_patterns:
  - INITIAL
  - SPACE
  - parameter
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: ABAP-RCE-001
  title: Dynamic ABAP Generation
  description: 'Detects dynamic generation of ABAP code from user input.

    '
  language: abap
  category: rce
  severity: Critical
  confidence: 0.9
  cwe: CWE-94
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - abap
  - generate-subroutine
  - code-injection
  patterns:
  - type: regex
    pattern: GENERATE\s+SUBROUTINE\s+POOL
  - type: regex
    pattern: INSERT\s+REPORT\s+FROM
  anti_patterns:
  - STATIC
  - HARDCODED
  impact: Remote code execution enables complete system compromise and lateral movement
  remediation: Avoid dynamic code execution, sandbox untrusted input, use allowlists
- rule_id: ABAP-RCE-002
  title: RFC Destination with Stored Logon Data
  description: 'Detects RFC destinations with stored credentials.

    '
  language: abap
  category: rce
  severity: High
  confidence: 0.82
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 2
  tags:
  - abap
  - rfc
  - stored-credentials
  patterns:
  - type: regex
    pattern: CALL\s+FUNCTION.*DESTINATION\s+["\x27]\w+["\x27]
  - type: regex
    pattern: RFCDES.*RFCUSER
  anti_patterns:
  - SNC_MODE
  - SSO
  impact: Remote code execution enables complete system compromise and lateral movement
  remediation: Avoid dynamic code execution, sandbox untrusted input, use allowlists
- rule_id: ABAP-SEC-001
  title: Debug Breakpoint in Production Code
  description: 'Detects BREAK-POINT statements left in code.

    '
  language: abap
  category: framework_misuse
  severity: Medium
  confidence: 0.9
  cwe: CWE-489
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 1
  tags:
  - abap
  - debug
  - breakpoint
  patterns:
  - type: regex
    pattern: BREAK-POINT\b
  - type: regex
    pattern: BREAK\s+\w+\.
  anti_patterns:
  - '* BREAK'
  - '" BREAK'
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
- rule_id: ABAP-SEC-002
  title: Unvalidated File Upload
  description: 'Detects file upload processing without type validation.

    '
  language: abap
  category: path_traversal
  severity: Medium
  confidence: 0.77
  cwe: CWE-434
  owasp: A04:2021-Insecure-Design
  detection_layer: 2
  tags:
  - abap
  - upload
  - file-type
  patterns:
  - type: regex
    pattern: CALL\s+FUNCTION\s+["\x27]GUI_UPLOAD["\x27]
  - type: regex
    pattern: cl_gui_frontend_services=>gui_upload
  anti_patterns:
  - FILETYPE
  - extension_check
  impact: Path traversal enables reading or writing arbitrary files on the server
  remediation: Canonicalize paths and verify they remain within expected base directories
- rule_id: ABAP-SEC-003
  title: Sensitive Data in System Log
  description: 'Detects logging of sensitive information.

    '
  language: abap
  category: secrets
  severity: Medium
  confidence: 0.78
  cwe: CWE-532
  owasp: A09:2021-Security-Logging-and-Monitoring-Failures
  detection_layer: 1
  tags:
  - abap
  - logging
  - sensitive-data
  patterns:
  - type: regex
    pattern: MESSAGE.*(?:password|secret|token|key|credential)
  - type: regex
    pattern: WRITE.*(?:password|user_pw|logon_data)
  anti_patterns:
  - MASK
  - '****'
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: ABAP-SEC-004
  title: Transport Request Security
  description: 'Detects direct table modifications bypassing transport system.

    '
  language: abap
  category: framework_misuse
  severity: High
  confidence: 0.8
  cwe: CWE-284
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - abap
  - transport
  - direct-modification
  patterns:
  - type: regex
    pattern: MODIFY\s+(?:USR02|USR04|AGR_USERS|AGR_1251)\b
  - type: regex
    pattern: DELETE\s+FROM\s+(?:USR02|USR04|AGR_USERS)\b
  anti_patterns:
  - BAPI_
  - AUTHORITY-CHECK
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
