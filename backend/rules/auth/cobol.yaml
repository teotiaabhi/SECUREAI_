rules:
- rule_id: COBOL-AUTH-001
  title: Default Credentials in Source
  description: 'Detects hardcoded default credentials in COBOL programs.

    '
  language: cobol
  category: auth
  severity: Critical
  confidence: 0.88
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - cobol
  - hardcoded
  - credentials
  patterns:
  - type: regex
    pattern: MOVE\s+["\x27](?:admin|password|root|default|guest)["\x27]\s+TO\s+\w*(?:PASS|USER|CRED)
  - type: regex
    pattern: (?:VALUE|PIC\s+X).*["\x27](?:admin|password|root|guest)["\x27]
  anti_patterns:
  - ACCEPT
  - CALL
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: COBOL-AUTH-002
  title: Missing Access Control Check
  description: 'Detects transaction processing without authorization verification.

    '
  language: cobol
  category: auth
  severity: High
  confidence: 0.78
  cwe: CWE-862
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - cobol
  - access-control
  - authorization
  patterns:
  - type: regex
    pattern: EXEC\s+CICS\s+(?:SEND|WRITE|DELETE|REWRITE)\b
  anti_patterns:
  - EXEC CICS VERIFY
  - PERFORM.*AUTH
  - CALL.*RACF
  - CALL.*ACF2
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: COBOL-CRYPTO-001
  title: Clear Text Password Transmission
  description: 'Detects passwords stored or transmitted in clear text.

    '
  language: cobol
  category: crypto
  severity: High
  confidence: 0.85
  cwe: CWE-319
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - cobol
  - cleartext
  - password
  patterns:
  - type: regex
    pattern: MOVE\s+\w*PASS\w*\s+TO\s+\w*(?:SEND|OUT|MSG|DISPLAY|WRITE)\w*
  - type: regex
    pattern: DISPLAY\s+\w*PASS\w*
  anti_patterns:
  - ENCRYPT
  - HASH
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: COBOL-CRYPTO-002
  title: Insecure Random Number Generation
  description: 'Detects predictable random number generation.

    '
  language: cobol
  category: crypto
  severity: Medium
  confidence: 0.8
  cwe: CWE-330
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - cobol
  - random
  - predictable
  patterns:
  - type: regex
    pattern: FUNCTION\s+RANDOM\b
  - type: regex
    pattern: COMPUTE\s+\w+\s*=\s*FUNCTION\s+RANDOM
  anti_patterns:
  - ENTROPY
  - ICSF
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: COBOL-SEC-001
  title: Unprotected Debug Display
  description: 'Detects DISPLAY statements that may leak sensitive data.

    '
  language: cobol
  category: secrets
  severity: Medium
  confidence: 0.75
  cwe: CWE-532
  owasp: A09:2021-Security-Logging-and-Monitoring-Failures
  detection_layer: 1
  tags:
  - cobol
  - debug
  - display
  patterns:
  - type: regex
    pattern: DISPLAY\s+(?:WS-|W-|WORK-).*(?:KEY|PASSWORD|SECRET|TOKEN|SSN|SOCIAL|CREDIT)
  anti_patterns:
  - UPON CONSOLE
  - D DISPLAY
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: COBOL-SEC-002
  title: File Open Without Error Handling
  description: 'Detects OPEN statements without FILE STATUS checking.

    '
  language: cobol
  category: framework_misuse
  severity: Medium
  confidence: 0.8
  cwe: CWE-252
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 2
  tags:
  - cobol
  - file
  - error-handling
  patterns:
  - type: regex
    pattern: OPEN\s+(?:INPUT|OUTPUT|I-O|EXTEND)\s+\w+
  anti_patterns:
  - FILE STATUS
  - IF WS-FILE-STATUS
  - EVALUATE FILE-STATUS
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
- rule_id: COBOL-SEC-003
  title: Unchecked Program Call
  description: 'Detects dynamic CALL without return code checking.

    '
  language: cobol
  category: framework_misuse
  severity: Medium
  confidence: 0.78
  cwe: CWE-252
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 2
  tags:
  - cobol
  - call
  - error-handling
  patterns:
  - type: regex
    pattern: CALL\s+\w+\s+USING
  anti_patterns:
  - ON EXCEPTION
  - RETURN-CODE
  - IF RETURN-CODE
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
- rule_id: COBOL-SEC-004
  title: Sensitive Data in VSAM Record
  description: 'Detects sensitive data written to VSAM without encryption.

    '
  language: cobol
  category: crypto
  severity: High
  confidence: 0.75
  cwe: CWE-312
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 2
  tags:
  - cobol
  - vsam
  - encryption
  patterns:
  - type: regex
    pattern: WRITE\s+\w+-RECORD\s+FROM\s+\w*(?:SSN|CREDIT|CARD|ACCOUNT)\w*
  anti_patterns:
  - ENCRYPT
  - PERFORM.*ENCRYPT
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
