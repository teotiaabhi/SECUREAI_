rules:
- rule_id: GROOVY-AUTH-001
  title: Hardcoded Credentials in Groovy
  description: 'Detects hardcoded passwords and tokens in Groovy source.

    '
  language: groovy
  category: auth
  severity: Critical
  confidence: 0.9
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - groovy
  - hardcoded
  - credentials
  patterns:
  - type: regex
    pattern: (?:password|passwd|pwd|secret|token|apiKey)\s*=\s*["\x27][^$"\x27]{6,}["\x27]
  anti_patterns:
  - System.getenv
  - getProperty
  - placeholder
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: GROOVY-AUTH-002
  title: Jenkins Plaintext Credentials
  description: 'Detects credentials used in Jenkins Pipeline without credentials binding.

    '
  language: groovy
  category: secrets
  severity: Critical
  confidence: 0.9
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - groovy
  - jenkins
  - credentials
  patterns:
  - type: regex
    pattern: sh\s+["\x27].*(?:--password|--token|-p)\s+\$?\w+
  - type: regex
    pattern: env\.\w*(?:PASSWORD|SECRET|TOKEN|KEY)\s*=\s*["\x27]
  anti_patterns:
  - credentials(
  - withCredentials
  - usernamePassword
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: GROOVY-CRYPTO-001
  title: Weak Cipher Algorithm
  description: 'Detects usage of weak encryption algorithms.

    '
  language: groovy
  category: crypto
  severity: High
  confidence: 0.9
  cwe: CWE-327
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - groovy
  - crypto
  - weak-cipher
  patterns:
  - type: regex
    pattern: Cipher\.getInstance\s*\(\s*["\x27](?:DES|DESede|RC[24]|Blowfish)[\s/]
  - type: regex
    pattern: Cipher\.getInstance\s*\(\s*["\x27]\w+/ECB/
  anti_patterns:
  - AES/GCM
  - AES/CBC
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: GROOVY-CRYPTO-002
  title: Insecure Random for Security
  description: 'Detects java.util.Random usage for security-sensitive operations.

    '
  language: groovy
  category: crypto
  severity: High
  confidence: 0.85
  cwe: CWE-330
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - groovy
  - random
  - predictable
  patterns:
  - type: regex
    pattern: new\s+Random\s*\(
  - type: regex
    pattern: Math\.random\s*\(
  anti_patterns:
  - SecureRandom
  - RandomUtils
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: GROOVY-RCE-001
  title: Script Engine Evaluation
  description: 'Detects script engine evaluation of user input.

    '
  language: groovy
  category: rce
  severity: Critical
  confidence: 0.9
  cwe: CWE-94
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - groovy
  - script-engine
  - code-injection
  patterns:
  - type: regex
    pattern: ScriptEngine.*eval\s*\(
  - type: regex
    pattern: GroovyShell.*evaluate\s*\(
  - type: regex
    pattern: GroovyClassLoader.*parseClass\s*\(
  anti_patterns:
  - CompilerConfiguration
  - SecureASTCustomizer
  impact: Remote code execution enables complete system compromise and lateral movement
  remediation: Avoid dynamic code execution, sandbox untrusted input, use allowlists
- rule_id: GROOVY-RCE-002
  title: ProcessBuilder Command Execution
  description: 'Detects command execution via ProcessBuilder or Runtime.

    '
  language: groovy
  category: rce
  severity: High
  confidence: 0.88
  cwe: CWE-78
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - groovy
  - command-execution
  - processbuilder
  patterns:
  - type: regex
    pattern: \.execute\s*\(\)
  - type: regex
    pattern: Runtime\.getRuntime\(\)\.exec\s*\(
  - type: regex
    pattern: ProcessBuilder\s*\(
  anti_patterns:
  - whitelist
  - allowedCommands
  impact: Remote code execution enables complete system compromise and lateral movement
  remediation: Avoid dynamic code execution, sandbox untrusted input, use allowlists
- rule_id: GROOVY-SEC-001
  title: Jenkins Pipeline Shared Library Trust
  description: 'Detects loading of untrusted shared libraries.

    '
  language: groovy
  category: devops
  severity: High
  confidence: 0.82
  cwe: CWE-829
  owasp: A08:2021-Software-and-Data-Integrity-Failures
  detection_layer: 1
  tags:
  - groovy
  - jenkins
  - shared-library
  patterns:
  - type: regex
    pattern: '@Library\s*\(\s*["\x27]\w+'
  - type: regex
    pattern: library\s*\(\s*["\x27]\w+
  anti_patterns:
  - trusted
  - approved
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: GROOVY-SEC-002
  title: Unsafe Serialization
  description: 'Detects native Java/Groovy serialization.

    '
  language: groovy
  category: rce
  severity: High
  confidence: 0.88
  cwe: CWE-502
  owasp: A08:2021-Software-and-Data-Integrity-Failures
  detection_layer: 1
  tags:
  - groovy
  - serialization
  - deserialization
  patterns:
  - type: regex
    pattern: ObjectInputStream\s*\(
  - type: regex
    pattern: \.readObject\s*\(
  anti_patterns:
  - ObjectInputFilter
  - ValidatingObjectInputStream
  impact: Remote code execution enables complete system compromise and lateral movement
  remediation: Avoid dynamic code execution, sandbox untrusted input, use allowlists
- rule_id: GROOVY-SEC-003
  title: Gradle Build Script Injection
  description: 'Detects potential injection in Gradle build scripts.

    '
  language: groovy
  category: devops
  severity: High
  confidence: 0.82
  cwe: CWE-94
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - groovy
  - gradle
  - build-injection
  patterns:
  - type: regex
    pattern: exec\s*\{.*commandLine.*\$
  - type: regex
    pattern: ant\.\w+.*\$\{.*\}
  anti_patterns:
  - project.property
  - findProperty
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: GROOVY-SEC-004
  title: Jenkins Groovy Sandbox Bypass
  description: 'Detects attempts to bypass Jenkins Groovy sandbox.

    '
  language: groovy
  category: rce
  severity: Critical
  confidence: 0.88
  cwe: CWE-94
  owasp: A03:2021-Injection
  detection_layer: 1
  tags:
  - groovy
  - jenkins
  - sandbox-bypass
  patterns:
  - type: regex
    pattern: '@Grab\s*\(.*group\s*='
  - type: regex
    pattern: Class\.forName\s*\(
  - type: regex
    pattern: \.metaClass\.\w+\s*=
  - type: regex
    pattern: MethodHandle\b
  anti_patterns:
  - // approved
  - '@NonCPS'
  impact: Remote code execution enables complete system compromise and lateral movement
  remediation: Avoid dynamic code execution, sandbox untrusted input, use allowlists
