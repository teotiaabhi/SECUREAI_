rules:
- rule_id: VBNET-AUTH-001
  title: Weak Password Validation
  description: 'Detects password validation without complexity requirements.

    '
  language: vbnet
  category: auth
  severity: Medium
  confidence: 0.78
  cwe: CWE-521
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 2
  tags:
  - vbnet
  - password
  - validation
  patterns:
  - type: regex
    pattern: If\s+\w*[Pp]ass\w*\.Length\s*[<>]=?\s*\d\s+Then
  - type: regex
    pattern: (?:password|pass)\s*=\s*\w+\s*$
  anti_patterns:
  - Regex.IsMatch
  - PasswordValidator
  - complexity
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: VBNET-AUTH-002
  title: Forms Authentication Without SSL
  description: 'Detects Forms Authentication without requiring HTTPS.

    '
  language: vbnet
  category: auth
  severity: High
  confidence: 0.85
  cwe: CWE-319
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - vbnet
  - forms-auth
  - ssl
  patterns:
  - type: regex
    pattern: FormsAuthentication\.\w+\s*\(
  - type: regex
    pattern: requireSSL\s*=\s*["\x27]false["\x27]
  anti_patterns:
  - requireSSL="true"
  - RequireHttps
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: VBNET-AUTH-003
  title: ViewState Without MAC Validation
  description: 'Detects ViewState configuration without MAC validation.

    '
  language: vbnet
  category: auth
  severity: High
  confidence: 0.88
  cwe: CWE-642
  owasp: A04:2021-Insecure-Design
  detection_layer: 1
  tags:
  - vbnet
  - viewstate
  - mac
  patterns:
  - type: regex
    pattern: EnableViewStateMac\s*=\s*[Ff]alse
  - type: regex
    pattern: ViewStateEncryptionMode\s*=\s*["\x27]?Never
  anti_patterns:
  - EnableViewStateMac = True
  - ViewStateEncryptionMode.Always
  impact: Authentication and authorization flaws can lead to unauthorized access and privilege escalation
  remediation: Implement strong authentication, proper session management, and principle of least privilege
- rule_id: VBNET-CRYPTO-001
  title: Weak Hashing Algorithm
  description: 'Detects MD5 or SHA1 usage for security-sensitive operations.

    '
  language: vbnet
  category: crypto
  severity: High
  confidence: 0.9
  cwe: CWE-327
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - vbnet
  - crypto
  - hash
  patterns:
  - type: regex
    pattern: MD5\.Create\s*\(
  - type: regex
    pattern: SHA1\.Create\s*\(
  - type: regex
    pattern: New\s+MD5CryptoServiceProvider
  - type: regex
    pattern: New\s+SHA1CryptoServiceProvider
  anti_patterns:
  - SHA256
  - SHA512
  - HMAC
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: VBNET-CRYPTO-002
  title: Insecure Symmetric Encryption
  description: 'Detects DES or RC2 encryption usage.

    '
  language: vbnet
  category: crypto
  severity: High
  confidence: 0.9
  cwe: CWE-327
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - vbnet
  - crypto
  - des
  - symmetric
  patterns:
  - type: regex
    pattern: New\s+DESCryptoServiceProvider
  - type: regex
    pattern: New\s+RC2CryptoServiceProvider
  - type: regex
    pattern: New\s+TripleDESCryptoServiceProvider
  anti_patterns:
  - Aes.Create
  - AesCryptoServiceProvider
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: VBNET-CRYPTO-003
  title: Hardcoded Cryptographic Key
  description: 'Detects hardcoded encryption keys in VB.NET source.

    '
  language: vbnet
  category: crypto
  severity: Critical
  confidence: 0.88
  cwe: CWE-321
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - vbnet
  - crypto
  - hardcoded-key
  patterns:
  - type: regex
    pattern: \.Key\s*=\s*(?:New\s+Byte\(\)\s*\{|System\.Text\.Encoding\.\w+\.GetBytes\(["\x27])
  - type: regex
    pattern: \.IV\s*=\s*(?:New\s+Byte\(\)\s*\{|System\.Text\.Encoding\.\w+\.GetBytes\(["\x27])
  anti_patterns:
  - GenerateKey()
  - ProtectedData
  - DPAPI
  impact: Weak cryptography can be broken, compromising data confidentiality and integrity
  remediation: Use industry-standard algorithms (AES-256-GCM, SHA-256+, Argon2) and proper key management
- rule_id: VBNET-RCE-001
  title: Unsafe XML Processing
  description: 'Detects XML processing vulnerable to XXE attacks.

    '
  language: vbnet
  category: rce
  severity: High
  confidence: 0.88
  cwe: CWE-611
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 1
  tags:
  - vbnet
  - xxe
  - xml
  patterns:
  - type: regex
    pattern: New\s+XmlDocument\s*\(
  - type: regex
    pattern: XmlReader\.Create\s*\(
  - type: regex
    pattern: \.XmlResolver\s*=\s*New\s+XmlUrlResolver
  anti_patterns:
  - XmlResolver = Nothing
  - DtdProcessing.Prohibit
  - ProhibitDtd = True
  impact: Remote code execution enables complete system compromise and lateral movement
  remediation: Avoid dynamic code execution, sandbox untrusted input, use allowlists
- rule_id: VBNET-RCE-002
  title: Unsafe Reflection
  description: 'Detects dynamic type loading from user input.

    '
  language: vbnet
  category: rce
  severity: High
  confidence: 0.85
  cwe: CWE-470
  owasp: A08:2021-Software-and-Data-Integrity-Failures
  detection_layer: 1
  tags:
  - vbnet
  - reflection
  - dynamic-type
  patterns:
  - type: regex
    pattern: Type\.GetType\s*\(\s*\w{1,40}\s*\)
  - type: regex
    pattern: Activator\.CreateInstance\s*\(\s*Type\.GetType
  - type: regex
    pattern: Assembly\.Load\s*\(
  anti_patterns:
  - GetType("System.
  - whitelist
  impact: Remote code execution enables complete system compromise and lateral movement
  remediation: Avoid dynamic code execution, sandbox untrusted input, use allowlists
- rule_id: VBNET-SEC-001
  title: Sensitive Data in Query String
  description: 'Detects sensitive data passed via URL query parameters.

    '
  language: vbnet
  category: secrets
  severity: Medium
  confidence: 0.8
  cwe: CWE-598
  owasp: A04:2021-Insecure-Design
  detection_layer: 1
  tags:
  - vbnet
  - querystring
  - sensitive-data
  patterns:
  - type: regex
    pattern: Request\.QueryString\s*\(\s*["\x27](?:password|token|secret|key|auth)["\x27]\s*\)
  - type: regex
    pattern: Response\.Redirect\s*\(.*(?:password|token|key)=
  anti_patterns:
  - POST
  - Session
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: VBNET-SEC-002
  title: Insecure Cookie Configuration
  description: 'Detects cookies without security flags.

    '
  language: vbnet
  category: framework_misuse
  severity: Medium
  confidence: 0.85
  cwe: CWE-614
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 1
  tags:
  - vbnet
  - cookie
  - security-flags
  patterns:
  - type: regex
    pattern: New\s+HttpCookie\s*\(
  - type: regex
    pattern: \.Secure\s*=\s*False
  - type: regex
    pattern: \.HttpOnly\s*=\s*False
  anti_patterns:
  - .Secure = True
  - .HttpOnly = True
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
- rule_id: VBNET-SEC-003
  title: Directory Listing Enabled
  description: 'Detects directory browsing configuration.

    '
  language: vbnet
  category: framework_misuse
  severity: Medium
  confidence: 0.85
  cwe: CWE-548
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 1
  tags:
  - vbnet
  - directory
  - listing
  patterns:
  - type: regex
    pattern: directoryBrowse\s+enabled\s*=\s*["\x27]true["\x27]
  anti_patterns:
  - enabled="false"
  impact: Framework misconfiguration can disable security controls and expose sensitive functionality
  remediation: Follow framework security best practices, enable security features, review configuration
