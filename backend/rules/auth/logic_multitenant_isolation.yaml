- rule_id: LOGIC-MT-008
  title: Raw SQL Without Tenant-Scoped WHERE Clause
  description: 'Detects raw SQL execution (db.session.execute, cursor.execute, db.engine.execute, connection.execute) with SELECT/DELETE/UPDATE statements that lack a tenant_id or org_id parameter. Raw
    SQL bypasses ORM-level scoping abstractions and is frequently written without tenant awareness.

    '
  language: python
  category: auth
  severity: High
  confidence: 0.6
  cwe: CWE-284
  owasp: A01:2021 — Broken Access Control
  tags:
  - multi-tenant
  - raw-sql
  - unscoped-query
  - sqlalchemy
  - psycopg2
  detection_layer: 1
  vulnerability_family: multi_tenant_isolation
  attack_surface_type: api
  patterns:
  - pattern: (?:db\.session|session|connection|conn|cursor)\.execute\s*\(\s*(?:text\s*\(\s*)?['"]\s*(?:SELECT|DELETE|UPDATE)\s
    description: Raw SQL execution — verify tenant_id in WHERE clause
  - pattern: (?:db\.engine|engine)\.execute\s*\(\s*['"]\s*(?:SELECT|DELETE|UPDATE)\s
    description: Engine-level raw SQL execution — verify tenant scope
  - pattern: pd\.read_sql(?:_query)?\s*\(\s*['"]\s*(?:SELECT|DELETE|UPDATE)\s
    description: Pandas read_sql with raw query — verify tenant scope
  anti_patterns:
  - BaseCommand
  - management.base
  - celery.task
  - class Migration
  - alembic
  - conftest
  - create_all
  - drop_all
  bypass_variants:
  - variant: 'f-string SQL: db.session.execute(f''SELECT ... WHERE id = {id}'')'
    description: f-string interpolation also has SQL injection risk
  - variant: 'String concatenation: ''SELECT ... '' + where_clause'
    description: Dynamic WHERE may or may not include tenant filter
  - variant: 'Stored procedure: db.session.execute(text(''CALL proc(:id)''))'
    description: Stored procedure may not enforce tenant scope internally
  context_awareness:
    surrounding_context_patterns:
    - from sqlalchemy import text
    - import psycopg2
    - '@app.route'
    tenant_indicators:
    - tenant_id
    - org_id
    - organization_id
    sanitization_patterns:
    - tenant_id
    - org_id
    - WHERE.*tenant
  privilege_context_flags:
    requires_auth_context: true
    admin_only_risk: false
    escalation_vector: Raw SQL bypasses ORM tenant scoping abstractions
  probable_taint_paths:
  - source: raw_sql_string
    sink: database_execution
    through: db.session.execute(text(sql)) without tenant WHERE
  business_logic_indicator:
    financial_impact: true
    data_exposure_risk: true
    compliance_relevant: true
  severity_scoring:
    severity_weight: 9
    exploitability_score: High
  impact: 'Raw SQL queries bypass all ORM-level tenant isolation. Missing tenant_id in WHERE clause returns or modifies data across all tenants. Combined with SQL injection risk from string interpolation.

    '
  remediation: "Include tenant_id in all raw SQL queries:\n# WRONG: db.session.execute(text(\"SELECT * FROM users WHERE status = :status\"),\n                   {\"status\": \"active\"})\n\n# RIGHT: db.session.execute(text(\n\
    \    \"SELECT * FROM users WHERE tenant_id = :tid AND status = :status\"\n), {\"tid\": g.tenant_id, \"status\": \"active\"})\nPrefer ORM queries with automatic tenant scoping over raw SQL.\n"
  cross_rule_intelligence:
    requires_ai_validation: false
    related_rules:
    - LOGIC-MT-001
    - LOGIC-MT-002
    - LOGIC-MT-004
