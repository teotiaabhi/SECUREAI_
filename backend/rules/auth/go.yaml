rules:
- rule_id: AUTH-GO-001
  title: Hardcoded API Keys in Go Source
  description: 'Detects hardcoded API keys, tokens, and secrets in Go source code including constant declarations, variable
    assignments, and inline authentication values used in HTTP clients and service configurations.

    '
  language: go
  category: auth
  severity: High
  confidence: 0.85
  cwe: CWE-798
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - hardcoded-credentials
  - api-keys
  - secrets
  - go
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: (?:apiKey|api_key|API_KEY|ApiKey)\s*(?:=|:=)\s*"[^"]{8,}"
    description: Hardcoded API key assignment
  - pattern: (?:secret|SECRET|Secret)\s*(?:=|:=)\s*"[^"]{8,}"
    description: Hardcoded secret assignment
  - pattern: (?:token|TOKEN|Token)\s*(?:=|:=)\s*"[^"]{8,}"
    description: Hardcoded token assignment
  - pattern: const\s+(?:\w*(?:Key|Secret|Token|Password)\w*)\s*=\s*"[^"]{8,}"
    description: Constant with hardcoded credential
  anti_patterns:
  - pattern: os\.Getenv\(
    description: Environment variable usage
  - pattern: viper\.Get|viper\.GetString
    description: Viper config library
  - pattern: _test\.go|TestMain|func Test
    description: Test file context
  - pattern: \bplaceholder\b|\bexample\b|\bchangeme\b
    description: Placeholder values
  - pattern: vault\.Read|secretmanager
    description: Secrets manager usage
  - pattern: flag\.String|pflag\.String
    description: Command-line flag for configuration
  bypass_variants:
  - variant: API key in struct literal or map literal
    description: Credential embedded in composite literal
  - variant: Base64-encoded credential in const block
    description: Obfuscated constant credential
  evasion_indicators:
  - Credential in const block
  - API key in init() function
  - Token concatenation to avoid detection
  encoding_variants:
  - String literal assignment
  - Const block declaration
  multi_function_chain_patterns:
  - const apiKey = 'hardcoded' -> http.NewRequest -> Header.Set('Authorization')
  - secret := 'hardcoded' -> hmac.New -> token signing
  privilege_context_flags:
  - API authentication
  - Service account credentials
  business_logic_indicator:
  - HTTP client configuration
  - Service initialization
  probable_taint_paths:
  - source: Hardcoded string literal
    sink: HTTP Authorization header or API call
    through: Direct credential usage
  impact: 'Hardcoded API keys in Go binaries can be extracted through reverse engineering or source code access. This provides
    direct access to external APIs, cloud services, and authenticated endpoints.

    '
  remediation: 'Use os.Getenv() for environment variables, Viper for configuration files, or a secrets manager like HashiCorp
    Vault. Never commit credentials to source control.

    '
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - package main
    - func init()
    - http.Client
    taint_source_indicators:
    - String literal
    - Const declaration
    taint_sink_indicators:
    - http.NewRequest
    - Header.Set
    - grpc.Dial
    sanitization_patterns:
    - os.Getenv
    - viper.Get
    - vault.Read
  severity_scoring:
    base_score: 9.0
    exploitability: high
    impact_score: 8.5
    adjustments:
    - condition: production API key
      modifier: '+0.5'
    - condition: test context
      modifier: '-4.0'
  exploit_scenario: '1. Attacker accesses Go source code or decompiles binary. 2. Finds const ApiKey = "sk-prod-abc123..."
    in source. 3. Uses extracted API key to access production cloud services. 4. Full access to external service with application
    privileges.

    '
  confidence_factors:
    increases:
    - Long string in credential variable
    - Const with Key/Secret/Token name
    decreases:
    - Test file
    - Placeholder value
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-002
    - AUTH-GO-009
    dependency_chain: Hardcoded credentials provide direct authentication bypass
    combined_risk_increase: Critical when combined with exposed endpoints
- rule_id: AUTH-GO-002
  title: JWT Validation Skip in Go
  description: 'Detects insecure JWT handling in Go applications including skipped signature verification, missing claims
    validation, acceptance of none algorithm, and improper use of jwt-go or golang-jwt libraries.

    '
  language: go
  category: auth
  severity: Critical
  confidence: 0.85
  cwe: CWE-347
  owasp: A02:2021 - Cryptographic Failures
  tags:
  - jwt
  - verification-bypass
  - golang-jwt
  - authentication
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: jwt\.Parse\(.*,\s*func.*\{[^}]*return\s+key.*\}\)(?!.*Valid)
    description: JWT parsed without validation check
  - pattern: jwt\.ParseUnverified
    description: Explicitly unverified JWT parsing
  - pattern: token\.Claims\..*(?!.*token\.Valid)
    description: Claims accessed without checking Valid
  - pattern: SigningMethodNone|alg.*none|UnsafeAllowNoneSignatureType
    description: None algorithm allowed
  anti_patterns:
  - pattern: jwt\.SigningMethodRS256|jwt\.SigningMethodES256
    description: Strong signing method specified
  - pattern: token\.Valid
    description: Token validity check
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: jwt\.NewWithClaims.*SignedString
    description: Token creation, not validation
  - pattern: VerifyExpiresAt|VerifyIssuedAt
    description: Claims verification
  - pattern: jwt\.StandardClaims|jwt\.RegisteredClaims
    description: Standard claims with validation
  bypass_variants:
  - variant: Algorithm confusion attack using HMAC with RSA public key
    description: RSA public key used as HMAC secret
  - variant: Custom key function returning static key without algorithm check
    description: KeyFunc not validating algorithm
  evasion_indicators:
  - ParseUnverified used in production
  - Claims accessed before validity check
  - Algorithm not pinned in KeyFunc
  encoding_variants:
  - jwt-go library syntax
  - golang-jwt/jwt/v5 syntax
  multi_function_chain_patterns:
  - jwt.ParseUnverified -> claims extraction -> auth decision
  - jwt.Parse with weak KeyFunc -> claims trusted -> privilege granted
  privilege_context_flags:
  - Authentication token validation
  - API authorization middleware
  business_logic_indicator:
  - JWT middleware
  - Authentication handler
  probable_taint_paths:
  - source: Authorization header
    sink: Claims used for access control
    through: Missing signature verification
  impact: 'Attackers can forge JWT tokens with arbitrary claims, bypass authentication, and impersonate any user including
    administrators when verification is skipped.

    '
  remediation: 'Always verify JWT signatures using jwt.Parse with a proper KeyFunc that validates the algorithm. Check token.Valid
    before accessing claims. Pin algorithms to RS256 or ES256.

    '
  references:
  - https://cwe.mitre.org/data/definitions/347.html
  - https://github.com/golang-jwt/jwt
  - https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/
  context_awareness:
    surrounding_context_patterns:
    - import "github.com/golang-jwt/jwt"
    - jwt.Parse
    - jwt.Token
    taint_source_indicators:
    - Authorization header
    - r.Header.Get("Authorization")
    taint_sink_indicators:
    - Claims map
    - user ID from token
    - role from claims
    sanitization_patterns:
    - token.Valid
    - SigningMethodRS256
    - VerifyExpiresAt
  severity_scoring:
    base_score: 9.5
    exploitability: high
    impact_score: 9.0
    adjustments:
    - condition: ParseUnverified in handler
      modifier: '+0.5'
    - condition: test file
      modifier: '-5.0'
  exploit_scenario: '1. Go API uses jwt.ParseUnverified to extract claims. 2. Attacker crafts JWT with admin role claim and
    no signature. 3. Server extracts claims without verification. 4. Attacker gains admin access with forged token.

    '
  confidence_factors:
    increases:
    - ParseUnverified in production code
    - Claims accessed without Valid check
    decreases:
    - Test context
    - Strong signing method enforced
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-001
    - AUTH-GO-003
    dependency_chain: JWT bypass enables complete authentication circumvention
    combined_risk_increase: Maximum when combined with missing auth middleware
- rule_id: AUTH-GO-003
  title: Missing Authentication Middleware in Go
  description: 'Detects HTTP routes in Go web frameworks (Gin, Echo, Chi, net/http) that handle sensitive operations without
    authentication middleware, leaving endpoints accessible to unauthenticated users.

    '
  language: go
  category: auth
  severity: High
  confidence: 0.75
  cwe: CWE-306
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - missing-auth
  - middleware
  - gin
  - echo
  - chi
  - net-http
  detection_layer: 2
  attack_surface_type: authentication
  patterns:
  - pattern: r\.(?:POST|PUT|DELETE|PATCH)\("(?:/api)?/(?:admin|user|account|payment).*",\s*\w+\)
    description: Sensitive route without middleware in Gin/Chi
  - pattern: e\.(?:POST|PUT|DELETE)\("(?:/api)?/(?:admin|user|account).*",\s*\w+\)
    description: Sensitive route without middleware in Echo
  - pattern: http\.HandleFunc\("(?:/api)?/(?:admin|user|account).*",\s*\w+\)
    description: Sensitive net/http handler without auth
  - pattern: mux\.Handle(?:Func)?\("(?:DELETE|PUT|POST)".*(?:admin|user|account)
    description: Gorilla mux sensitive route without auth
  anti_patterns:
  - pattern: Use\(.*(?:auth|Auth|jwt|JWT|middleware|Middleware).*\)
    description: Auth middleware applied
  - pattern: Group\(.*,\s*.*(?:auth|Auth|jwt).*\)
    description: Route group with auth middleware
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: (?:login|register|signup|health|public|static)
    description: Public endpoint
  - pattern: authMiddleware|requireAuth|AuthRequired
    description: Auth middleware reference
  - pattern: r\.With\(.*auth.*\)
    description: Chi middleware chain with auth
  bypass_variants:
  - variant: Auth middleware applied to group but specific route excluded
    description: Route-level middleware exclusion
  - variant: Middleware order placing auth after handler
    description: Incorrect middleware ordering
  evasion_indicators:
  - Sensitive route registered without middleware
  - Auth middleware applied to wrong route group
  encoding_variants:
  - Gin router syntax
  - Echo router syntax
  - Chi router syntax
  - net/http mux syntax
  multi_function_chain_patterns:
  - http.HandleFunc('/admin/delete', handler) -> no auth check -> admin action
  - r.POST('/api/users', createUser) -> no auth -> unauthorized user creation
  privilege_context_flags:
  - Admin operations
  - User data modification
  - Financial operations
  business_logic_indicator:
  - Router setup
  - Route registration
  probable_taint_paths:
  - source: Unauthenticated HTTP request
    sink: Handler performing privileged operation
    through: Missing auth middleware
  impact: 'Missing authentication middleware allows unauthenticated users to access admin panels, modify user data, and perform
    privileged operations without any credentials.

    '
  remediation: 'Apply authentication middleware to all sensitive routes. Use route groups with auth middleware in Gin/Echo/Chi.
    Implement middleware chains that verify authentication before handler execution.

    '
  references:
  - https://cwe.mitre.org/data/definitions/306.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - gin.Default()
    - echo.New()
    - chi.NewRouter()
    - http.NewServeMux()
    taint_source_indicators:
    - http.Request
    - gin.Context
    - echo.Context
    taint_sink_indicators:
    - database query
    - service call
    - data modification
    sanitization_patterns:
    - Use(authMiddleware)
    - Group with auth
    - r.With(auth)
  severity_scoring:
    base_score: 9.0
    exploitability: high
    impact_score: 8.5
    adjustments:
    - condition: admin endpoint unprotected
      modifier: '+0.5'
    - condition: public-facing endpoint
      modifier: '-3.0'
  exploit_scenario: '1. Go API registers DELETE /api/admin/users/:id without auth middleware. 2. Attacker discovers endpoint
    through API enumeration. 3. Sends DELETE request without any authentication. 4. User account deleted without credentials.

    '
  confidence_factors:
    increases:
    - Sensitive route without middleware reference
    - Admin path without auth
    decreases:
    - Auth middleware applied at group level
    - Public endpoint
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-002
    - AUTH-GO-006
    dependency_chain: Missing auth middleware makes all endpoints publicly accessible
    combined_risk_increase: Maximum when combined with JWT bypass
- rule_id: AUTH-GO-004
  title: BCrypt Cost Factor Too Low in Go
  description: 'Detects bcrypt password hashing in Go with a cost factor below the recommended minimum of 10, making brute-force
    attacks significantly faster after a database breach.

    '
  language: go
  category: auth
  severity: Medium
  confidence: 0.85
  cwe: CWE-916
  owasp: A02:2021 - Cryptographic Failures
  tags:
  - bcrypt
  - password-hashing
  - cost-factor
  - brute-force
  - go
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: bcrypt\.GenerateFromPassword\(.*,\s*[1-9]\)
    description: BCrypt with cost below 10
  - pattern: bcrypt\.GenerateFromPassword\(.*,\s*bcrypt\.MinCost\)
    description: BCrypt with MinCost (4)
  - pattern: cost\s*(?:=|:=)\s*[1-9]\b.*bcrypt
    description: Low cost variable used with bcrypt
  - pattern: bcrypt\.GenerateFromPassword\(.*,\s*4\)
    description: BCrypt with minimum cost of 4
  anti_patterns:
  - pattern: bcrypt\.DefaultCost
    description: Default cost (10)
  - pattern: bcrypt\.GenerateFromPassword\(.*,\s*1[0-9]\)
    description: Adequate cost factor (10+)
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: argon2\.IDKey|argon2\.Key
    description: Argon2 password hashing
  - pattern: scrypt\.Key
    description: Scrypt password hashing
  - pattern: \bbenchmark\b|\bBenchmark\b
    description: Benchmark context
  bypass_variants:
  - variant: Cost factor from config defaulting to low value
    description: Configurable cost with weak default
  - variant: Custom wrapper hiding low cost parameter
    description: Wrapper function with hardcoded low cost
  evasion_indicators:
  - MinCost used in production
  - Cost factor below 10
  encoding_variants:
  - bcrypt.GenerateFromPassword direct
  - Cost variable indirection
  multi_function_chain_patterns:
  - bcrypt.GenerateFromPassword(pw, 4) -> db.Store -> weak hash persisted
  - MinCost -> password hash -> database breach -> fast cracking
  privilege_context_flags:
  - Password hashing
  - User registration
  business_logic_indicator:
  - User service
  - Authentication handler
  probable_taint_paths:
  - source: User password
    sink: Database password column
    through: Low-cost bcrypt hash
  impact: 'Low bcrypt cost factor significantly reduces brute-force time. With MinCost (4), cracking is approximately 64x
    faster than with DefaultCost (10).

    '
  remediation: 'Use bcrypt.DefaultCost (10) or higher. Consider cost factor 12-14 for production. For stronger protection,
    use argon2.IDKey with recommended parameters.

    '
  references:
  - https://cwe.mitre.org/data/definitions/916.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
  - https://pkg.go.dev/golang.org/x/crypto/bcrypt
  context_awareness:
    surrounding_context_patterns:
    - import "golang.org/x/crypto/bcrypt"
    - bcrypt.GenerateFromPassword
    taint_source_indicators:
    - User password input
    - r.FormValue("password")
    taint_sink_indicators:
    - Database insert
    - User record storage
    sanitization_patterns:
    - bcrypt.DefaultCost
    - bcrypt.GenerateFromPassword(pw, 12)
  severity_scoring:
    base_score: 5.5
    exploitability: medium
    impact_score: 6.0
    adjustments:
    - condition: MinCost used
      modifier: '+2.0'
    - condition: test or benchmark context
      modifier: '-3.0'
  exploit_scenario: '1. Application uses bcrypt.MinCost (4) for password hashing. 2. Database breach exposes bcrypt hashes.
    3. Attacker uses GPU-based cracking tool. 4. With cost 4, passwords crack 64x faster than cost 10.

    '
  confidence_factors:
    increases:
    - MinCost in production code
    - Single-digit cost literal
    decreases:
    - Test or benchmark file
    - DefaultCost used
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-001
    - AUTH-GO-007
    dependency_chain: Weak hashing with credential exposure enables fast password cracking
    combined_risk_increase: High when database is exposed
- rule_id: AUTH-GO-005
  title: Insecure Session Cookie Flags in Go
  description: 'Detects session cookies in Go applications set without Secure, HttpOnly, or SameSite flags, exposing session
    tokens to interception, XSS theft, or CSRF attacks.

    '
  language: go
  category: auth
  severity: Medium
  confidence: 0.8
  cwe: CWE-614
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - session
  - cookie
  - httponly
  - secure-flag
  - samesite
  - go
  detection_layer: 1
  attack_surface_type: authentication
  patterns:
  - pattern: http\.Cookie\{[^}]*(?:Secure:\s*false|HttpOnly:\s*false)
    description: Cookie with Secure or HttpOnly explicitly false
  - pattern: http\.SetCookie\(.*&http\.Cookie\{[^}]*\}\)(?!.*Secure.*true)
    description: SetCookie without Secure flag
  - pattern: sessions\.Options\{[^}]*HttpOnly:\s*false
    description: Gorilla sessions with HttpOnly disabled
  - pattern: http\.Cookie\{[^}]*Name:\s*"(?:session|token|sid|auth)"[^}]*(?!.*SameSite)
    description: Session cookie without SameSite
  anti_patterns:
  - pattern: Secure:\s*true
    description: Secure flag enabled
  - pattern: HttpOnly:\s*true
    description: HttpOnly flag enabled
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: SameSite:\s*http\.SameSiteStrictMode
    description: SameSite strict mode
  - pattern: SameSite:\s*http\.SameSiteLaxMode
    description: SameSite lax mode
  - pattern: __Host-|__Secure-
    description: Cookie prefix for secure cookies
  bypass_variants:
  - variant: Secure flag set but SameSite missing
    description: Partial cookie protection
  - variant: HttpOnly set but Secure missing with HTTP fallback
    description: Cookie transmitted over HTTP
  evasion_indicators:
  - Session cookie without Secure flag
  - HttpOnly explicitly set to false
  encoding_variants:
  - http.Cookie struct literal
  - Gorilla sessions Options
  multi_function_chain_patterns:
  - 'http.Cookie{HttpOnly: false} -> XSS -> session theft'
  - Cookie without Secure -> HTTP transmission -> session hijacking
  privilege_context_flags:
  - Session management
  - Authentication persistence
  business_logic_indicator:
  - Authentication handler
  - Login endpoint
  probable_taint_paths:
  - source: Session token
    sink: HTTP response Set-Cookie header
    through: Insecure cookie configuration
  impact: 'Insecure session cookies can be stolen via XSS (missing HttpOnly), intercepted over HTTP (missing Secure), or used
    in CSRF attacks (missing SameSite).

    '
  remediation: 'Set Secure: true, HttpOnly: true, and SameSite: http.SameSiteStrictMode on all session cookies. Use __Host-
    prefix for additional protection.

    '
  references:
  - https://cwe.mitre.org/data/definitions/614.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - http.Cookie
    - http.SetCookie
    - sessions.NewCookieStore
    taint_source_indicators:
    - Session token
    - Authentication result
    taint_sink_indicators:
    - Set-Cookie header
    - HTTP response
    sanitization_patterns:
    - 'Secure: true'
    - 'HttpOnly: true'
    - SameSiteStrictMode
  severity_scoring:
    base_score: 7.0
    exploitability: medium
    impact_score: 7.0
    adjustments:
    - condition: HttpOnly false on session cookie
      modifier: '+1.5'
    - condition: internal application
      modifier: '-1.5'
  exploit_scenario: '1. Go app sets session cookie with HttpOnly: false. 2. XSS vulnerability exists in the application. 3.
    Attacker injects script that reads document.cookie. 4. Session token exfiltrated; attacker hijacks user session.

    '
  confidence_factors:
    increases:
    - HttpOnly explicitly false
    - Session cookie without Secure
    decreases:
    - Test file context
    - All secure flags present
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-006
    - AUTH-GO-003
    dependency_chain: Insecure cookies amplify XSS and CSRF impacts
    combined_risk_increase: High when combined with CORS misconfiguration
- rule_id: AUTH-GO-006
  title: CORS Wildcard with Credentials in Go
  description: 'Detects CORS configurations in Go applications that allow wildcard origins with credentials, or reflect arbitrary
    origins with Access-Control-Allow-Credentials, enabling cross-origin credential theft.

    '
  language: go
  category: auth
  severity: High
  confidence: 0.85
  cwe: CWE-346
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - cors
  - credentials
  - cross-origin
  - wildcard
  - go
  detection_layer: 1
  attack_surface_type: authentication
  patterns:
  - pattern: Access-Control-Allow-Origin.*\*.*Access-Control-Allow-Credentials.*true
    description: Wildcard origin with credentials
  - pattern: AllowOrigins.*\*.*AllowCredentials.*true
    description: CORS config with wildcard and credentials
  - pattern: w\.Header\(\)\.Set\("Access-Control-Allow-Origin",\s*r\.Header\.Get\("Origin"\)\)
    description: Origin reflection without validation
  - pattern: AllowAllOrigins:\s*true.*AllowCredentials:\s*true
    description: All origins allowed with credentials
  anti_patterns:
  - pattern: AllowOrigins:\s*\["https://.*"
    description: Specific allowed origins
  - pattern: AllowCredentials:\s*false
    description: Credentials not allowed
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: isAllowedOrigin|validateOrigin
    description: Origin validation function
  - pattern: AllowOriginFunc
    description: Custom origin validation function
  - pattern: \blocalhost\b.*\bonly\b
    description: Localhost-only CORS
  bypass_variants:
  - variant: AllowOriginFunc that returns true for all origins
    description: Permissive custom origin validator
  - variant: Origin header reflected directly without whitelist
    description: Dynamic origin reflection
  evasion_indicators:
  - Wildcard origin with credentials
  - Origin header reflection without validation
  encoding_variants:
  - net/http header setting
  - Gin CORS middleware config
  - Echo CORS middleware config
  multi_function_chain_patterns:
  - AllowAllOrigins + AllowCredentials -> cross-origin credential theft
  - Origin reflection -> credentials allowed -> session hijacking
  privilege_context_flags:
  - Cross-origin API access
  - Credential forwarding
  business_logic_indicator:
  - CORS middleware configuration
  - API gateway setup
  probable_taint_paths:
  - source: Malicious cross-origin request
    sink: Authenticated API response with credentials
    through: Permissive CORS configuration
  impact: 'Wildcard CORS with credentials allows any malicious website to make authenticated requests to the API and read
    responses, enabling session hijacking and data theft.

    '
  remediation: 'Never use wildcard origins with credentials. Maintain a whitelist of allowed origins. Use AllowOriginFunc
    with proper validation. Set AllowCredentials to false for public APIs.

    '
  references:
  - https://cwe.mitre.org/data/definitions/346.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
  context_awareness:
    surrounding_context_patterns:
    - cors.Config
    - cors.New
    - Access-Control-Allow
    taint_source_indicators:
    - Origin header
    - Cross-origin request
    taint_sink_indicators:
    - Access-Control-Allow-Origin
    - Access-Control-Allow-Credentials
    sanitization_patterns:
    - AllowOrigins whitelist
    - AllowOriginFunc
    - validateOrigin
