- rule_id: AUTH-GO-007
  title: Password Comparison Timing Attack in Go
  description: 'Detects password or token comparisons in Go using == or bytes.Equal instead of constant-time comparison functions,
    enabling timing-based side-channel attacks to extract secrets.

    '
  language: go
  category: auth
  severity: High
  confidence: 0.75
  cwe: CWE-208
  owasp: A02:2021 - Cryptographic Failures
  tags:
  - timing-attack
  - constant-time
  - password-comparison
  - side-channel
  - go
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: (?:password|token|secret|key|hash)\s*==\s*(?:password|token|secret|key|hash)
    description: Direct string comparison for credentials
  - pattern: bytes\.Equal\(.*(?:password|token|secret|hash)
    description: bytes.Equal for credential comparison
  - pattern: strings\.Compare\(.*(?:password|token|secret)
    description: strings.Compare for credential comparison
  - pattern: if\s+.*(?:apiKey|api_key)\s*==\s*
    description: Direct API key comparison
  anti_patterns:
  - pattern: subtle\.ConstantTimeCompare
    description: Constant-time comparison
  - pattern: hmac\.Equal
    description: HMAC-based constant-time comparison
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: bcrypt\.CompareHashAndPassword
    description: BCrypt comparison (inherently constant-time)
  - pattern: crypto/subtle
    description: Subtle crypto package imported
  - pattern: argon2\.IDKey|scrypt\.Key
    description: Memory-hard KDF comparison
  bypass_variants:
  - variant: Constant-time comparison on hash but direct comparison on token
    description: Inconsistent comparison methods
  - variant: Short-circuit evaluation before constant-time check
    description: Length check before comparison
  evasion_indicators:
  - Direct == comparison on secrets
  - bytes.Equal on credential data
  encoding_variants:
  - String == operator
  - bytes.Equal function
  - strings.Compare function
  multi_function_chain_patterns:
  - r.Header.Get('X-API-Key') == storedKey -> timing leak
  - password == hash -> timing-based password extraction
  privilege_context_flags:
  - Password verification
  - API key validation
  - Token comparison
  business_logic_indicator:
  - Authentication handler
  - API key middleware
  probable_taint_paths:
  - source: User-provided credential
    sink: Comparison with stored secret
    through: Non-constant-time comparison
  impact: 'Timing attacks allow attackers to extract secrets byte-by-byte by measuring response times. This can reveal API
    keys, tokens, and password hashes.

    '
  remediation: 'Use subtle.ConstantTimeCompare for all credential comparisons. Use bcrypt.CompareHashAndPassword for password
    verification. Never use == or bytes.Equal for secret comparison.

    '
  references:
  - https://cwe.mitre.org/data/definitions/208.html
  - https://pkg.go.dev/crypto/subtle#ConstantTimeCompare
  - https://codahale.com/a-lesson-in-timing-attacks/
  context_awareness:
    surrounding_context_patterns:
    - func authenticate
    - func verify
    - func validate
    taint_source_indicators:
    - User input
    - HTTP header
    - Request body
    taint_sink_indicators:
    - Comparison operator
    - Equality check
    sanitization_patterns:
    - subtle.ConstantTimeCompare
    - hmac.Equal
    - bcrypt.CompareHashAndPassword
  severity_scoring:
    base_score: 6.5
    exploitability: medium
    impact_score: 7.0
    adjustments:
    - condition: password comparison with ==
      modifier: '+1.5'
    - condition: test context
      modifier: '-3.0'
  exploit_scenario: '1. Go API validates API key with if apiKey == storedKey. 2. Attacker sends requests with varying key
    prefixes. 3. Measures response time differences as correct bytes are found. 4. Extracts full API key byte-by-byte through
    timing analysis.

    '
  confidence_factors:
    increases:
    - Direct == on credential variable
    - bytes.Equal on secret
    decreases:
    - subtle.ConstantTimeCompare in scope
    - bcrypt.CompareHashAndPassword used
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-001
    - AUTH-GO-004
    dependency_chain: Timing attack combined with weak hashing allows credential extraction
    combined_risk_increase: High when API keys are exposed to timing analysis
- rule_id: AUTH-GO-008
  title: OAuth2 Token Reuse and Replay in Go
  description: 'Detects OAuth2 implementations in Go that fail to properly validate token freshness, allow token reuse across
    sessions, or do not verify audience and issuer claims, enabling token replay attacks.

    '
  language: go
  category: auth
  severity: High
  confidence: 0.75
  cwe: CWE-294
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - oauth2
  - token-replay
  - token-reuse
  - go
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: oauth2\.Token\{.*AccessToken:.*\}(?!.*Expiry)
    description: OAuth2 token without expiry check
  - pattern: token\.AccessToken(?!.*token\.Valid\(\))
    description: Access token used without validity check
  - pattern: oauth2\.StaticTokenSource\(.*\)
    description: Static token source (never refreshes)
  - pattern: idToken\.Claims\(&claims\)(?!.*Audience|Issuer)
    description: ID token claims without audience/issuer validation
  anti_patterns:
  - pattern: token\.Valid\(\)
    description: Token validity check
  - pattern: TokenSource.*ReuseTokenSource
    description: Token source with refresh
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: Verifier.*Verify
    description: Token verification
  - pattern: oidc\.NewVerifier
    description: OIDC verification
  - pattern: token\.Expiry|ExpiresIn
    description: Expiry handling
  bypass_variants:
  - variant: Refresh token stored insecurely and reused indefinitely
    description: Persistent refresh token without rotation
  - variant: Access token cached without expiry check
    description: Stale token reuse
  evasion_indicators:
  - Static token source in production
  - Token claims extracted without verification
  encoding_variants:
  - golang.org/x/oauth2 library
  - coreos/go-oidc library
  multi_function_chain_patterns:
  - StaticTokenSource -> stale token -> API call with expired credentials
  - idToken.Claims without audience check -> token from other app accepted
  privilege_context_flags:
  - OAuth2 authentication
  - API authorization
  business_logic_indicator:
  - OAuth2 configuration
  - Token handling
  probable_taint_paths:
  - source: OAuth2 access token
    sink: API authorization decision
    through: Missing token freshness validation
  impact: 'Token replay attacks allow attackers to reuse stolen or expired tokens to maintain unauthorized access. Missing
    audience validation allows tokens from one application to be used in another.

    '
  remediation: 'Always check token.Valid() before use. Use oauth2.ReuseTokenSource for automatic refresh. Validate audience,
    issuer, and expiry claims on ID tokens. Implement token rotation for refresh tokens.

    '
  references:
  - https://cwe.mitre.org/data/definitions/294.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://pkg.go.dev/golang.org/x/oauth2
  context_awareness:
    surrounding_context_patterns:
    - oauth2.Config
    - oauth2.Token
    - oidc.Verifier
    taint_source_indicators:
    - OAuth2 callback
    - Token endpoint response
    taint_sink_indicators:
    - API client
    - Resource access
    - Authentication decision
    sanitization_patterns:
    - token.Valid()
    - Verifier.Verify
    - audience check
  severity_scoring:
    base_score: 7.5
    exploitability: medium
    impact_score: 7.5
    adjustments:
    - condition: static token source in production
      modifier: '+1.0'
    - condition: proper token refresh configured
      modifier: '-3.0'
  exploit_scenario: '1. Go app uses StaticTokenSource with a long-lived access token. 2. Token is leaked through logs or network
    interception. 3. Attacker replays the static token months later. 4. Token never expires; attacker maintains persistent
    access.

    '
  confidence_factors:
    increases:
    - StaticTokenSource in production
    - Token used without Valid()
    decreases:
    - ReuseTokenSource configured
    - OIDC verification present
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-002
    - AUTH-GO-001
    dependency_chain: Token replay with missing auth enables persistent unauthorized access
    combined_risk_increase: High when combined with credential exposure
- rule_id: AUTH-GO-009
  title: API Key in URL Parameter in Go
  description: 'Detects API keys and authentication tokens passed as URL query parameters in Go applications, exposing credentials
    in server logs, browser history, referrer headers, and proxy logs.

    '
  language: go
  category: auth
  severity: High
  confidence: 0.85
  cwe: CWE-598
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - api-key
  - url-parameter
  - query-string
  - credential-exposure
  - go
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: r\.URL\.Query\(\)\.Get\("(?:api_key|apiKey|token|access_token|secret)"
    description: Auth credential read from URL query
  - pattern: r\.FormValue\("(?:api_key|apiKey|token|access_token|secret)"\)
    description: Credential from form value (may be query)
  - pattern: \?(?:api_key|apiKey|token|access_token)=%s
    description: API key in URL format string
  - pattern: url\.Values.*(?:api_key|token|secret).*Encode\(\)
    description: Credential added to URL query params
  anti_patterns:
  - pattern: r\.Header\.Get\("Authorization"\)
    description: Header-based authentication
  - pattern: r\.Header\.Get\("X-API-Key"\)
    description: Custom header for API key
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: Bearer\s
    description: Bearer token in header
  - pattern: \bredact\b|\bmask\b
    description: Credential redaction
  - pattern: oauth2\.Token
    description: OAuth2 token handling
  bypass_variants:
  - variant: API key in URL path segment instead of query parameter
    description: Path-based credential passing
  - variant: Token in URL fragment (still visible in some logs)
    description: Fragment-based credential
  evasion_indicators:
  - API key in query string
  - Token in URL format string
  encoding_variants:
  - r.URL.Query().Get() pattern
  - fmt.Sprintf URL construction
  multi_function_chain_patterns:
  - r.URL.Query().Get('api_key') -> auth check -> credential in access log
  - Sprintf('url?token=%s') -> HTTP request -> token in proxy log
  privilege_context_flags:
  - API authentication
  - Token transmission
  business_logic_indicator:
  - API middleware
  - HTTP client
  probable_taint_paths:
  - source: API key/token
    sink: URL query parameter
    through: Query string inclusion
  impact: 'API keys in URLs are logged by web servers, proxies, CDNs, and stored in browser history. This exposes credentials
    to log file access, referrer header leaks, and shoulder surfing.

    '
  remediation: 'Pass API keys in HTTP headers (Authorization or X-API-Key). Never include secrets in URL query parameters.
    Use POST body for sensitive data transmission.

    '
  references:
  - https://cwe.mitre.org/data/definitions/598.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
  context_awareness:
    surrounding_context_patterns:
    - http.HandleFunc
    - gin.Context
    - echo.Context
    taint_source_indicators:
    - URL query parameter
    - r.URL.Query()
    taint_sink_indicators:
    - Access log
    - Referrer header
    - Proxy log
    sanitization_patterns:
    - r.Header.Get
    - Authorization header
    - X-API-Key header
  severity_scoring:
    base_score: 7.0
    exploitability: high
    impact_score: 6.5
    adjustments:
    - condition: production API key in URL
      modifier: '+1.0'
    - condition: internal service only
      modifier: '-2.0'
  exploit_scenario: '1. Go API accepts api_key as URL query parameter. 2. Access logs contain full URL with API key: GET /api/data?api_key=secret123.
    3. Attacker gains access to log files through log aggregation service. 4. Extracts API keys and uses them for unauthorized
    API access.

    '
  confidence_factors:
    increases:
    - URL query parameter named api_key/token/secret
    - URL format string with credential
    decreases:
    - Header-based authentication present
    - Test context
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-001
    - AUTH-GO-003
    dependency_chain: URL credential exposure with log access enables credential theft
    combined_risk_increase: High when combined with log exposure
- rule_id: AUTH-GO-010
  title: Insecure TLS Configuration in Go
  description: 'Detects insecure TLS configurations in Go applications including disabled certificate verification, weak TLS
    versions, insecure cipher suites, and skipped hostname verification enabling man-in-the-middle attacks.

    '
  language: go
  category: auth
  severity: High
  confidence: 0.85
  cwe: CWE-295
  owasp: A02:2021 - Cryptographic Failures
  tags:
  - tls
  - certificate-verification
  - mitm
  - transport-security
  - go
  detection_layer: 1
  attack_surface_type: authentication
  patterns:
  - pattern: InsecureSkipVerify:\s*true
    description: TLS certificate verification disabled
  - pattern: MinVersion:\s*tls\.VersionTLS10
    description: TLS 1.0 allowed (insecure)
  - pattern: MinVersion:\s*tls\.VersionSSL30
    description: SSL 3.0 allowed (insecure)
  - pattern: tls\.Config\{\s*InsecureSkipVerify:\s*true
    description: TLS config with skip verify
  anti_patterns:
  - pattern: MinVersion:\s*tls\.VersionTLS12
    description: TLS 1.2 minimum
  - pattern: MinVersion:\s*tls\.VersionTLS13
    description: TLS 1.3 minimum
  - pattern: _test\.go|func Test
    description: Test file context
  - pattern: InsecureSkipVerify:\s*false
    description: Verification enabled
  - pattern: \bdev\b|\bdevelopment\b|\blocal\b
    description: Development context
  - pattern: 'RootCAs:|ClientCAs:'
    description: Custom CA configuration
  bypass_variants:
  - variant: InsecureSkipVerify with custom VerifyPeerCertificate that always returns nil
    description: Custom verify function that does not validate
  - variant: TLS 1.2 configured but weak cipher suites allowed
    description: Strong version but weak ciphers
  evasion_indicators:
  - InsecureSkipVerify in production
  - TLS 1.0 or SSL 3.0 allowed
  encoding_variants:
  - tls.Config struct literal
  - http.Transport TLSClientConfig
  multi_function_chain_patterns:
  - 'InsecureSkipVerify: true -> HTTPS client -> MITM interception'
  - TLS 1.0 -> POODLE/BEAST -> credential interception
  privilege_context_flags:
  - HTTPS client configuration
  - Service-to-service communication
  business_logic_indicator:
  - HTTP client setup
  - gRPC dial options
  probable_taint_paths:
  - source: Application credentials
    sink: HTTPS connection to server
    through: Disabled certificate verification
  impact: 'Disabled TLS verification allows man-in-the-middle attackers to intercept all HTTPS traffic including authentication
    credentials, API keys, and sensitive data transmitted between services.

    '
  remediation: 'Never set InsecureSkipVerify to true in production. Use MinVersion: tls.VersionTLS12 or tls.VersionTLS13.
    Configure proper CA certificates. Use certificate pinning for critical connections.

    '
  references:
  - https://cwe.mitre.org/data/definitions/295.html
  - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
  - https://pkg.go.dev/crypto/tls#Config
  context_awareness:
    surrounding_context_patterns:
    - tls.Config
    - http.Transport
    - grpc.Dial
    taint_source_indicators:
    - Application secrets
    - Auth credentials
    taint_sink_indicators:
    - HTTPS connection
    - TLS handshake
    sanitization_patterns:
    - 'InsecureSkipVerify: false'
    - 'MinVersion: tls.VersionTLS12'
  severity_scoring:
    base_score: 9.0
    exploitability: high
    impact_score: 8.5
    adjustments:
    - condition: InsecureSkipVerify in production code
      modifier: '+0.5'
    - condition: test or development context
      modifier: '-4.0'
  exploit_scenario: '1. Go microservice uses InsecureSkipVerify: true for HTTPS client. 2. Attacker performs ARP spoofing
    on internal network. 3. Intercepts HTTPS traffic with self-signed certificate. 4. Reads all API keys and credentials in
    transit.

    '
  confidence_factors:
    increases:
    - 'InsecureSkipVerify: true in non-test code'
    - TLS 1.0 MinVersion
    decreases:
    - Test file
    - Development-only config
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-GO-001
    - AUTH-GO-002
    dependency_chain: Insecure TLS with credential transmission enables full interception
    combined_risk_increase: Critical when combined with hardcoded credentials
