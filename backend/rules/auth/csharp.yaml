- rule_id: AUTH-CS-008
  title: Weak Session Management in ASP.NET
  description: 'Detects weak session configuration including in-memory session storage in production, missing session timeout,
    predictable session IDs, and session fixation vulnerabilities.

    '
  language: csharp
  category: auth
  severity: Medium
  confidence: 0.75
  cwe: CWE-384
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - session-management
  - session-fixation
  - aspnet-core
  - csharp
  detection_layer: 3
  attack_surface_type: web
  patterns:
  - pattern: AddDistributedMemoryCache\s*\(\s*\)[^;]*AddSession
    description: In-memory session cache (not distributed) with sessions
  - pattern: IdleTimeout\s*=\s*TimeSpan\.From(?:Hours|Days)\s*\(\s*(?:[2-9]\d|\d{2,})
    description: Excessively long session idle timeout
  - pattern: options\.Cookie\.Name\s*=\s*"(?:ASP\.NET_SessionId|JSESSIONID)"
    description: Default or predictable session cookie name
  - pattern: Session\[.*\]\s*=\s*.*(?:password|Password|credential|secret)
    description: Sensitive data stored in session
  anti_patterns:
  - pattern: AddStackExchangeRedisCache|AddSqlServerCache|AddNCache
    description: Distributed cache for sessions
  - pattern: options\.Cookie\.IsEssential\s*=\s*true.*Secure\s*=\s*true
    description: Secure session cookie configuration
  bypass_variants:
  - variant: Session fixation via URL rewriting
    description: Session ID in URL
  evasion_indicators:
  - In-memory cache for production sessions
  - Long session timeouts
  encoding_variants:
  - Session middleware configuration
  multi_function_chain_patterns:
  - AddDistributedMemoryCache() -> AddSession() -> UseSession()
  privilege_context_flags:
  - User session persistence
  business_logic_indicator:
  - Authentication state management
  probable_taint_paths:
  - source: Session cookie
    sink: Session state
    through: Weak session configuration
  impact: 'Weak session management enables session hijacking, fixation attacks, and data loss when in-memory cache resets.

    '
  remediation: 'Use distributed cache (Redis, SQL Server) for production sessions. Set reasonable timeouts. Regenerate session
    ID after login.

    '
  references:
  - https://cwe.mitre.org/data/definitions/384.html
  - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/app-state
  context_awareness:
    surrounding_context_patterns:
    - AddSession
    - UseSession
    - HttpContext.Session
    taint_source_indicators:
    - Session cookie
    taint_sink_indicators:
    - Session[
    - HttpContext.Session
    sanitization_patterns:
    - AddStackExchangeRedisCache
    - IdleTimeout reasonable
  severity_scoring:
    base_score: 6.0
    exploitability: medium
    impact_score: 5.5
    adjustments:
    - condition: sensitive data in session
      modifier: '+2.0'
    - condition: read-only session
      modifier: '-1.0'
  exploit_scenario: '1. Application uses in-memory session cache in production. 2. App restart loses all sessions; users logged
    out unexpectedly. 3. Long idle timeout allows stolen sessions to remain valid for days.

    '
  confidence_factors:
    increases:
    - In-memory cache in production
    - Long timeout
    decreases:
    - Development environment
    - Distributed cache
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-CS-005
    - AUTH-CS-003
    dependency_chain: Weak sessions enable hijacking
    combined_risk_increase: High with insecure cookie settings
- rule_id: AUTH-CS-009
  title: OAuth/OIDC Misconfiguration in ASP.NET Core
  description: 'Detects insecure OAuth 2.0 and OpenID Connect configurations including disabled HTTPS, missing state/nonce
    validation, weak redirect URI validation, and insecure token storage.

    '
  language: csharp
  category: auth
  severity: High
  confidence: 0.85
  cwe: CWE-287
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - oauth
  - oidc
  - misconfiguration
  - aspnet-core
  - csharp
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: RequireHttpsMetadata\s*=\s*false
    description: HTTPS metadata requirement disabled for OIDC
  - pattern: SaveTokens\s*=\s*true(?:(?!DataProtection|Encryption).)*$
    description: Tokens saved without encryption configuration
  - pattern: options\.(?:ClientSecret|ClientId)\s*=\s*"[^"]{6,}"
    description: Hardcoded OAuth client credentials
  - pattern: BackchannelHttpHandler\s*=\s*new\s+HttpClientHandler\s*\{[^}]*ServerCertificateCustomValidationCallback\s*=\s*\([^)]*\)\s*=>\s*true
    description: SSL certificate validation disabled for OAuth
  - pattern: options\.Events\.OnRedirectToIdentityProvider\s*=\s*[^;]*(?:state|nonce)\s*=\s*(?:null|"")
    description: State or nonce parameter cleared
  anti_patterns:
  - pattern: RequireHttpsMetadata\s*=\s*true
    description: HTTPS metadata required
  - pattern: DataProtectionProvider
    description: Data protection for token encryption
  - pattern: options\.Scope\.Add
    description: Explicit scope configuration
  bypass_variants:
  - variant: OAuth state parameter forgery
    description: CSRF via missing state validation
  evasion_indicators:
  - HTTPS disabled for OIDC discovery
  - Certificate validation bypassed
  encoding_variants:
  - AddOpenIdConnect configuration
  - AddOAuth configuration
  multi_function_chain_patterns:
  - AddOpenIdConnect -> RequireHttpsMetadata = false -> production deployment
  privilege_context_flags:
  - OAuth/OIDC authentication
  - SSO integration
  business_logic_indicator:
  - Identity provider integration
  - Social login configuration
  probable_taint_paths:
  - source: OAuth authorization response
    sink: Authentication middleware
    through: Misconfigured validation
  impact: 'OAuth/OIDC misconfiguration enables token theft via MITM, CSRF via missing state parameter, and impersonation through
    redirect URI manipulation.

    '
  remediation: 'Always enable RequireHttpsMetadata=true in production. Validate state and nonce parameters. Use Configuration
    for client credentials.

    '
  references:
  - https://cwe.mitre.org/data/definitions/287.html
  - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/social/
  context_awareness:
    surrounding_context_patterns:
    - AddOpenIdConnect
    - AddOAuth
    - AddGoogle
    - AddMicrosoftAccount
    taint_source_indicators:
    - OAuth callback
    - Authorization code
    taint_sink_indicators:
    - Token validation
    - Claims mapping
    sanitization_patterns:
    - RequireHttpsMetadata = true
    - DataProtectionProvider
  severity_scoring:
    base_score: 8.0
    exploitability: high
    impact_score: 7.5
    adjustments:
    - condition: HTTPS disabled in production
      modifier: '+1.0'
    - condition: development environment
      modifier: '-3.0'
  exploit_scenario: '1. ASP.NET app has RequireHttpsMetadata=false in production. 2. Attacker performs MITM on OIDC discovery
    endpoint. 3. Attacker substitutes their own signing keys to forge tokens.

    '
  confidence_factors:
    increases:
    - HTTPS disabled
    - Hardcoded client secret
    decreases:
    - Development configuration
    - Conditional check
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-CS-002
    - AUTH-CS-001
    dependency_chain: OAuth misconfig enables authentication bypass
    combined_risk_increase: Critical with JWT validation failures
- rule_id: AUTH-CS-010
  title: ASP.NET Identity Misconfiguration
  description: 'Detects weak ASP.NET Core Identity configuration including disabled password requirements, disabled lockout,
    weak password policies, and insecure token provider settings.

    '
  language: csharp
  category: auth
  severity: Medium
  confidence: 0.85
  cwe: CWE-521
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - identity
  - password-policy
  - lockout
  - aspnet-core
  - csharp
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: RequiredLength\s*=\s*[1-5]\b
    description: Password minimum length too short (< 6)
  - pattern: RequireDigit\s*=\s*false
    description: Digit requirement disabled
  - pattern: RequireLowercase\s*=\s*false
    description: Lowercase requirement disabled
  - pattern: RequireUppercase\s*=\s*false
    description: Uppercase requirement disabled
  - pattern: RequireNonAlphanumeric\s*=\s*false
    description: Special character requirement disabled
  - pattern: MaxFailedAccessAttempts\s*=\s*(?:0|[5-9]\d|\d{3,})
    description: Account lockout disabled or too permissive
  - pattern: DefaultLockoutTimeSpan\s*=\s*TimeSpan\.From(?:Seconds|Minutes)\s*\(\s*[0-2]\b
    description: Lockout duration too short
  anti_patterns:
  - pattern: RequiredLength\s*=\s*(?:8|9|[1-9]\d{1,})
    description: Adequate password length
  - pattern: MaxFailedAccessAttempts\s*=\s*[3-5]\b
    description: Reasonable lockout threshold
  - pattern: RequiredUniqueChars\s*=\s*[2-9]
    description: Unique character requirement
  bypass_variants:
  - variant: Credential stuffing with no lockout
    description: Brute force without restriction
  evasion_indicators:
  - All password requirements disabled
  - Lockout disabled or extremely permissive
  encoding_variants:
  - IdentityOptions configuration
  multi_function_chain_patterns:
  - AddIdentity -> options.Password -> all requirements false
  privilege_context_flags:
  - User registration
  - Password management
  business_logic_indicator:
  - Identity configuration
  - User account management
  probable_taint_paths:
  - source: User registration form
    sink: Identity password validation
    through: Weak IdentityOptions
  impact: 'Weak identity configuration allows users to set trivially guessable passwords and enables credential stuffing without
    lockout protection.

    '
  remediation: 'Configure strong password policies and lockout: options.Password.RequiredLength = 12; options.Password.RequireDigit
    = true; options.Lockout.MaxFailedAccessAttempts = 5; options.Lockout.DefaultLockoutTimeSpan = TimeSpan.FromMinutes(15);

    '
  references:
  - https://cwe.mitre.org/data/definitions/521.html
  - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/identity-configuration
  context_awareness:
    surrounding_context_patterns:
    - AddIdentity
    - IdentityOptions
    - Password.RequiredLength
    taint_source_indicators:
    - User password input
    taint_sink_indicators:
    - Password validation
    - UserManager.CreateAsync
    sanitization_patterns:
    - RequiredLength >= 8
    - MaxFailedAccessAttempts <= 5
  severity_scoring:
    base_score: 6.5
    exploitability: high
    impact_score: 6.0
    adjustments:
    - condition: all requirements disabled
      modifier: '+2.0'
    - condition: lockout enabled
      modifier: '-1.0'
  exploit_scenario: '1. Identity configured with RequiredLength=1, all requirements false. 2. Users create passwords like
    "a" or "1234". 3. No lockout allows unlimited brute force attempts. 4. Attacker compromises accounts with dictionary attack.

    '
  confidence_factors:
    increases:
    - Multiple requirements disabled
    - Lockout disabled
    decreases:
    - Strong password requirements
    - Lockout enabled
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: simple
  cross_rule_intelligence:
    related_rules:
    - AUTH-CS-003
    - AUTH-CS-008
    dependency_chain: Weak identity enables credential compromise
    combined_risk_increase: High with weak password hashing
