- rule_id: AUTH-PHP-007
  title: strcmp/strcasecmp Bypass for Authentication in PHP
  description: 'Detects use of strcmp or strcasecmp for password or token comparison in PHP. These functions return 0 (equal)
    when comparing a string to an array, enabling authentication bypass through type juggling.

    '
  language: php
  category: auth
  severity: Critical
  confidence: 0.85
  cwe: CWE-287
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - strcmp-bypass
  - type-juggling
  - authentication-bypass
  - php
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: strcmp\(\s*\$(?:password|passwd|pwd|pass|token)\s*,
    description: strcmp on password comparison
  - pattern: strcasecmp\(\s*\$(?:password|passwd|pwd|token)\s*,
    description: strcasecmp on credential comparison
  - pattern: if\s*\(\s*strcmp\(.*\$_(?:POST|GET|REQUEST).*\)\s*==\s*0\s*\)
    description: strcmp with user input checking equality
  - pattern: strcmp\(.*,\s*\$(?:stored|expected|db).*\)\s*==\s*0
    description: strcmp for credential verification
  anti_patterns:
  - pattern: password_verify\(
    description: Proper password verification
  - pattern: hash_equals\(
    description: Constant-time comparison
  - pattern: \btest\b|\bTest\b|@test
    description: Test context
  - pattern: ===\s*0
    description: Strict comparison (mitigates type juggling)
  - pattern: is_string\(.*\$_(?:POST|GET)
    description: Type validation before comparison
  - pattern: strcmp.*!==.*0|strcmp.*===.*0
    description: Strict identity comparison
  bypass_variants:
  - variant: Password sent as array parameter (password[]=)
    description: Array input causes strcmp to return 0
  - variant: NULL input causing strcmp to return 0
    description: NULL parameter bypass
  evasion_indicators:
  - strcmp for password verification
  - Loose comparison (==) on strcmp result
  encoding_variants:
  - strcmp() direct call
  - strcasecmp() direct call
  multi_function_chain_patterns:
  - $_POST['password'] as array -> strcmp returns NULL -> == 0 is true -> auth bypass
  - strcasecmp($input, $stored) == 0 -> NULL == 0 -> true -> bypass
  privilege_context_flags:
  - Password verification
  - Token validation
  business_logic_indicator:
  - Authentication handler
  - Credential comparison
  probable_taint_paths:
  - source: $_POST['password'] as array
    sink: strcmp comparison result
    through: Type juggling with loose comparison
  impact: 'strcmp returns NULL when given an array instead of string. In PHP, NULL == 0 is true with loose comparison, bypassing
    password checks entirely. Any user can authenticate without valid credentials.

    '
  remediation: 'Use password_verify() for password comparison. Use hash_equals() for token comparison. If using strcmp, always
    use strict comparison (===). Validate input types before comparison.

    '
  references:
  - https://cwe.mitre.org/data/definitions/287.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://www.php.net/manual/en/function.strcmp.php
  context_awareness:
    surrounding_context_patterns:
    - function login
    - function authenticate
    - if (strcmp
    taint_source_indicators:
    - $_POST['password']
    - $_GET['token']
    taint_sink_indicators:
    - strcmp comparison
    - Authentication decision
    sanitization_patterns:
    - password_verify()
    - hash_equals()
    - === 0
  severity_scoring:
    base_score: 9.5
    exploitability: high
    impact_score: 9.0
    adjustments:
    - condition: loose comparison on strcmp result
      modifier: '+0.5'
    - condition: strict comparison used
      modifier: '-5.0'
  exploit_scenario: '1. PHP login uses: if(strcmp($_POST[''password''], $stored_hash) == 0). 2. Attacker sends POST with password[]=anything.
    3. strcmp(array, string) returns NULL in PHP. 4. NULL == 0 evaluates to true; authentication bypassed.

    '
  confidence_factors:
    increases:
    - strcmp with loose == 0 comparison
    - User input in strcmp
    decreases:
    - Strict === comparison
    - Type validation present
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-PHP-008
    - AUTH-PHP-003
    dependency_chain: strcmp bypass enables complete authentication circumvention
    combined_risk_increase: Maximum as it provides direct auth bypass
- rule_id: AUTH-PHP-008
  title: Type Juggling in Password Comparison
  description: 'Detects PHP authentication code using loose comparison (==) for password hash verification, which is vulnerable
    to type juggling attacks where specially crafted strings compare as equal to numeric values.

    '
  language: php
  category: auth
  severity: Critical
  confidence: 0.85
  cwe: CWE-287
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - type-juggling
  - loose-comparison
  - password
  - authentication-bypass
  - php
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: \$(?:password|passwd|pwd|hash).*==\s*\$(?:stored|expected|db|hash)
    description: Loose comparison of password hashes
  - pattern: md5\(.*\)\s*==\s*['"]0e\d+
    description: MD5 magic hash comparison
  - pattern: if\s*\(.*hash.*==.*hash.*\)
    description: Loose hash comparison
  - pattern: \$_(?:POST|GET)\[.*password.*\]\s*==\s*\$
    description: Loose comparison of user password input
  anti_patterns:
  - pattern: password_verify\(
    description: Proper password verification
  - pattern: ===
    description: Strict comparison operator
  - pattern: \btest\b|\bTest\b|@test
    description: Test context
  - pattern: hash_equals\(
    description: Constant-time comparison
  - pattern: is_string\(|is_int\(
    description: Type checking
  - pattern: \(string\)\s*\$|strval\(
    description: Type casting
  bypass_variants:
  - variant: 'Magic hash: md5(''240610708'') starts with 0e and equals 0 in loose comparison'
    description: Magic hash equality bypass
  - variant: 'Integer comparison: ''0'' == false == null in PHP'
    description: Falsy value comparison bypass
  evasion_indicators:
  - Loose == on hash values
  - MD5 hash compared with ==
  encoding_variants:
  - Direct == operator
  - Ternary with loose comparison
  multi_function_chain_patterns:
  - md5($input) == md5($stored) -> magic hash collision -> auth bypass
  - $_POST['pass'] == $db_hash -> type juggling -> unauthorized access
  privilege_context_flags:
  - Password verification
  - Hash comparison
  business_logic_indicator:
  - Login function
  - Authentication check
  probable_taint_paths:
  - source: User-provided password
    sink: Loose comparison with stored hash
    through: PHP type juggling
  impact: 'PHP type juggling with loose comparison allows authentication bypass. MD5 hashes starting with 0e are treated as
    zero in scientific notation. Multiple known strings produce 0e-prefixed MD5 hashes.

    '
  remediation: 'Always use password_verify() for password comparison. Use strict comparison (===) for all hash comparisons.
    Use hash_equals() for constant-time string comparison.

    '
  references:
  - https://cwe.mitre.org/data/definitions/287.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://www.php.net/manual/en/language.operators.comparison.php
  context_awareness:
    surrounding_context_patterns:
    - function login
    - md5(
    - sha1(
    - password
    taint_source_indicators:
    - User password input
    - Hash function output
    taint_sink_indicators:
    - Comparison operator
    - if condition
    sanitization_patterns:
    - password_verify()
    - ===
    - hash_equals()
  severity_scoring:
    base_score: 9.0
    exploitability: high
    impact_score: 8.5
    adjustments:
    - condition: MD5 with loose comparison
      modifier: '+1.0'
    - condition: strict comparison used
      modifier: '-5.0'
  exploit_scenario: '1. PHP app: if(md5($input_password) == $stored_hash). 2. Stored hash starts with 0e (e.g., 0e462097431906509019562988).
    3. Attacker finds password that also produces 0e-prefixed MD5 (e.g., 240610708). 4. PHP treats both as 0 (scientific notation);
    comparison returns true.

    '
  confidence_factors:
    increases:
    - Loose == on hash values
    - md5() with == comparison
    decreases:
    - Strict === used
    - password_verify() present
  metadata:
