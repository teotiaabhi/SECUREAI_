- rule_id: AUTH-PHP-010
  title: Insecure PHP Session Configuration
  description: 'Detects insecure PHP session configuration settings including disabled cookie_httponly, cookie_secure, use_strict_mode,
    and use of file-based sessions with world-readable permissions.

    '
  language: php
  category: auth
  severity: High
  confidence: 0.85
  cwe: CWE-614
  owasp: A07:2021 - Identification and Authentication Failures
  tags:
  - session-config
  - cookie-security
  - php-ini
  - session-management
  - php
  detection_layer: 1
  attack_surface_type: authentication
  patterns:
  - pattern: session\.cookie_httponly\s*=\s*(?:0|false|off)
    description: Session cookie HttpOnly disabled
  - pattern: session\.cookie_secure\s*=\s*(?:0|false|off)
    description: Session cookie Secure flag disabled
  - pattern: session\.use_strict_mode\s*=\s*(?:0|false|off)
    description: Session strict mode disabled
  - pattern: ini_set\(\s*['"]session\.cookie_httponly['"]\s*,\s*(?:0|false|'0')[\s)]
    description: HttpOnly disabled via ini_set
  anti_patterns:
  - pattern: session\.cookie_httponly\s*=\s*(?:1|true|on)
    description: HttpOnly enabled
  - pattern: session\.cookie_secure\s*=\s*(?:1|true|on)
    description: Secure flag enabled
  - pattern: \btest\b|\bTest\b|@test
    description: Test context
  - pattern: session\.use_strict_mode\s*=\s*(?:1|true|on)
    description: Strict mode enabled
  - pattern: session\.cookie_samesite\s*=\s*(?:Strict|Lax)
    description: SameSite set
  - pattern: Redis|Memcached|session_set_save_handler
    description: Custom session handler
  bypass_variants:
  - variant: Secure flags set in php.ini but overridden by ini_set in code
    description: Runtime override of secure defaults
  - variant: Session config secure but session ID in URL
    description: session.use_only_cookies = 0
  evasion_indicators:
  - HttpOnly disabled on session cookie
  - Secure flag disabled
  - Strict mode disabled
  encoding_variants:
  - php.ini configuration
  - ini_set() in PHP code
  - .htaccess php_value directives
  multi_function_chain_patterns:
  - cookie_httponly=0 -> XSS -> document.cookie -> session hijacking
  - cookie_secure=0 -> HTTP transmission -> session sniffing
  privilege_context_flags:
  - Session management
  - Authentication persistence
  business_logic_indicator:
  - PHP session configuration
  - Application initialization
  probable_taint_paths:
  - source: Session cookie
    sink: HTTP response without secure flags
    through: Insecure session configuration
  impact: 'Insecure session configuration exposes session cookies to XSS theft (missing HttpOnly), network interception (missing
    Secure), and session fixation attacks (missing strict mode).

    '
  remediation: 'Set session.cookie_httponly=1, session.cookie_secure=1, session.use_strict_mode=1, session.use_only_cookies=1,
    and session.cookie_samesite=Strict in php.ini or via ini_set().

    '
  references:
  - https://cwe.mitre.org/data/definitions/614.html
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  - https://www.php.net/manual/en/session.security.ini.php
  context_awareness:
    surrounding_context_patterns:
    - ini_set
    - session.cookie
    - php.ini
    - session_start
    taint_source_indicators:
    - Session cookie
    - PHPSESSID
    taint_sink_indicators:
    - HTTP response
    - Set-Cookie header
    sanitization_patterns:
    - cookie_httponly=1
    - cookie_secure=1
    - use_strict_mode=1
  severity_scoring:
    base_score: 7.0
    exploitability: medium
    impact_score: 7.0
    adjustments:
    - condition: HttpOnly and Secure both disabled
      modifier: '+1.5'
    - condition: custom session handler with encryption
      modifier: '-2.0'
  exploit_scenario: '1. PHP app has session.cookie_httponly=0. 2. XSS vulnerability exists on the application. 3. Attacker
    injects script: document.cookie sends to evil.com. 4. PHPSESSID stolen; attacker hijacks user session.

    '
  confidence_factors:
    increases:
    - HttpOnly explicitly disabled
    - Secure flag disabled in production
    decreases:
    - Secure settings in php.ini
    - Custom secure session handler
