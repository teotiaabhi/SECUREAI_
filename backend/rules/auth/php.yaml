    last_reviewed: '2025-01-15'
    rule_maturity_level: hardened
    detection_complexity: contextual
  cross_rule_intelligence:
    related_rules:
    - AUTH-PHP-007
    - AUTH-PHP-002
    dependency_chain: Type juggling with weak hashing enables authentication bypass
    combined_risk_increase: Critical when combined with MD5 password hashing
- rule_id: AUTH-PHP-009
  title: extract() and register_globals Abuse in Authentication
  description: 'Detects use of extract() on user input or patterns mimicking register_globals in PHP authentication code,
    allowing attackers to overwrite authentication variables with arbitrary values.

    '
  language: php
  category: auth
  severity: Critical
  confidence: 0.85
  cwe: CWE-621
  owasp: A03:2021 - Injection
  tags:
  - extract
  - register-globals
  - variable-overwrite
  - authentication-bypass
  - php
  detection_layer: 3
  attack_surface_type: authentication
  patterns:
  - pattern: extract\(\s*\$_(?:POST|GET|REQUEST|COOKIE)
    description: extract() on user input superglobals
  - pattern: extract\(\s*\$_SERVER\[
    description: extract() on server variables
  - pattern: foreach\s*\(\s*\$_(?:POST|GET|REQUEST)\s*as.*\$\$
    description: Variable variables from user input (register_globals emulation)
  - pattern: import_request_variables\(
    description: Deprecated import_request_variables function
  anti_patterns:
  - pattern: extract\(.*EXTR_SKIP\)
    description: extract with EXTR_SKIP (does not overwrite)
  - pattern: extract\(.*EXTR_PREFIX
    description: extract with prefix (safe namespace)
  - pattern: \btest\b|\bTest\b|@test
    description: Test context
  - pattern: extract\(.*compact\(
    description: extract of compact (safe pattern)
  - pattern: filter_input|filter_var
    description: Input filtering
  - pattern: whitelist|allowlist|array_intersect_key
    description: Input whitelisting
  bypass_variants:
  - variant: extract() after initializing auth variables
    description: User input overwrites initialized auth variables
  - variant: Variable variables ($$key) in foreach on $_POST
    description: Manual register_globals emulation
  evasion_indicators:
  - extract() on POST/GET data
  - Variable variables from user input
  encoding_variants:
  - extract() function call
  - foreach with $$ variable variables
  multi_function_chain_patterns:
  - extract($_POST) -> $is_admin overwritten -> admin access granted
  - foreach $_GET as $$key -> $authenticated = true -> auth bypass
  privilege_context_flags:
  - Authentication variable manipulation
  - Authorization flag overwrite
  business_logic_indicator:
  - Authentication handler
  - Request processing
  probable_taint_paths:
  - source: $_POST/$_GET with attacker-controlled keys
    sink: Authentication/authorization variables
    through: extract() variable injection
  impact: 'extract() on user input allows attackers to overwrite any PHP variable in the current scope. Sending is_admin=1
    or authenticated=true in POST data directly sets those variables, bypassing all authentication.

    '
  remediation: 'Never use extract() on user input. Access $_POST, $_GET directly by key. If extract is necessary, use EXTR_SKIP
    or EXTR_PREFIX_ALL. Whitelist expected input keys.

    '
  references:
  - https://cwe.mitre.org/data/definitions/621.html
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://www.php.net/manual/en/function.extract.php
  context_awareness:
    surrounding_context_patterns:
    - extract(
    - $_POST
    - $_GET
    - function login
    taint_source_indicators:
    - $_POST
    - $_GET
    - $_REQUEST
    taint_sink_indicators:
    - $is_admin
    - $authenticated
    - $role
    sanitization_patterns:
    - EXTR_SKIP
    - EXTR_PREFIX_ALL
    - array_intersect_key
  severity_scoring:
    base_score: 9.5
    exploitability: high
    impact_score: 9.0
    adjustments:
    - condition: extract on $_POST in auth context
      modifier: '+0.5'
    - condition: EXTR_SKIP flag used
      modifier: '-5.0'
  exploit_scenario: '1. PHP code: extract($_POST); if($is_admin) { grant_admin(); }. 2. Attacker sends POST request with is_admin=1.
    3. extract() creates $is_admin = "1" in current scope. 4. if($is_admin) evaluates to true; admin access granted.

    '
  confidence_factors:
    increases:
    - extract on $_POST/$_GET
    - Variable variables from user input
    decreases:
    - EXTR_SKIP or EXTR_PREFIX used
