      taint_source_indicators: ['r.FormValue(', 'c.Query(', 'r.URL.Query()']
      taint_sink_indicators: ['http.Get(', 'os.Open(', 'os.ReadFile(']
      sanitization_patterns: ['Scheme == "https"', 'allowedSchemes', 'HTTPS_ONLY']
    severity_scoring:
