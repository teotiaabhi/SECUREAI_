  # --------------------------------------------------------------------------
  # SSRF-JAVA-004: URL.openStream with user-controlled input
  # --------------------------------------------------------------------------
  - rule_id: "SSRF-JAVA-004"
    title: "URL.openStream() with User-Controlled Input"
    description: >
      Detects usage of Java's URL.openStream() method where the URL is
      constructed from user-controlled input. URL.openStream() is a
      convenience method equivalent to openConnection().getInputStream()
      and is often used for simple content fetching without explicit
      connection management. It follows redirects by default and supports
      multiple protocols (http, https, file, ftp, jar), making it a
      high-risk SSRF vector.
    language: java
    category: ssrf
    severity: High
    confidence: 0.91
    cwe: CWE-918
    owasp: "A10:2021-Server-Side Request Forgery"
    tags:
      - ssrf
      - java
      - url-openstream
      - user-input
      - file-protocol
      - multi-protocol
      - stream
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+URL\s*\(\s*(?:url|uri|endpoint|target|request\.getParameter|req\.getParameter)\s*[\.\)][\s\S]{0,50}\.openStream\s*\(\s*\)'
        description: "URL.openStream() with user-controlled URL"
      - type: regex
        pattern: 'new\s+URL\s*\(\s*(?:request\.getParameter|req\.getParameter)\s*\([^)]+\)\s*\)\s*\.\s*openStream\s*\('
        description: "URL from servlet request parameter directly opening stream"
      - type: regex
        pattern: '(?:InputStream|BufferedReader|InputStreamReader)\s+\w+\s*=\s*(?:new\s+\w+\s*\(\s*)?new\s+URL\s*\(\s*(?:url|uri|endpoint|target|request\.)\s*[\.\)]'
        description: "Stream reader wrapping URL with user input"
      - type: regex
        pattern: 'IOUtils\s*\.\s*(?:toString|toByteArray|copy)\s*\(\s*new\s+URL\s*\(\s*(?:url|uri|endpoint|target|request\.)'
        description: "Apache IOUtils reading from user-controlled URL"
      - type: regex
        pattern: 'Resources\s*\.\s*(?:toString|toByteArray|asCharSource)\s*\(\s*new\s+URL\s*\(\s*(?:url|uri|endpoint|target|request\.)'
        description: "Guava Resources reading from user-controlled URL"
      - type: regex
        pattern: 'Scanner\s*\(\s*new\s+URL\s*\(\s*(?:url|uri|endpoint|target|request\.getParameter)\s*[\.\)][\s\S]{0,50}\.openStream\s*\(\s*\)\s*\)'
        description: "Scanner wrapping URL.openStream with user input"
      - type: regex
        pattern: 'String\s+\w+\s*=\s*request\.getParameter\s*\([^)]+\)\s*;[\s\S]{0,200}new\s+URL\s*\(\s*\w+\s*\)\s*\.\s*openStream'
        description: "Parameter stored in variable then used for openStream"
      - type: regex
        pattern: 'new\s+URL\s*\(\s*(?:url|uri|endpoint|target)\s*\)\s*\.\s*(?:openStream|getContent|openConnection\s*\(\s*\)\s*\.\s*getInputStream)\s*\('
        description: "URL.openStream, getContent, or getInputStream with user URL"
    anti_patterns:
      - 'new\s+URL\s*\(\s*"https?://(?:api\.|www\.)[a-zA-Z0-9]+'
      - 'new\s+URL\s*\(\s*"file:/'
      - 'new\s+URL\s*\(\s*"jar:'
      - 'new\s+URL\s*\(\s*(?:Constants\.|API_|BASE_|SERVICE_)'
      - 'getClass\s*\(\s*\)\s*\.\s*getResource\s*\('
      - 'ClassLoader\s*\.\s*getResource\s*\('
      - '@Test'
      - 'class\s+\w+Test\s'
      - 'import\s+org\.(?:junit|mockito)'
      - 'Mockito\.\w+'
      - '@SpringBootTest'
      - '@MockBean'
      - 'Thread\.currentThread\s*\(\s*\)\s*\.\s*getContextClassLoader'
      - 'getResourceAsStream\s*\('
      - 'ClassPathResource\s*\('
    bypass_variants:
      - description: "file:// protocol for local file reading"
        pattern: 'new\s+URL\s*\(\s*"file:///'
      - description: "jar:// protocol for remote JAR loading"
        pattern: 'new\s+URL\s*\(\s*"jar:https?://'
      - description: "Redirect chain following by default"
        pattern: 'new\s+URL\s*\(\s*(?:url|uri|endpoint|target)\s*\)\s*\.\s*openStream'
      - description: "FTP protocol for data exfiltration"
        pattern: 'new\s+URL\s*\(\s*"ftp://'
      - description: "Custom URLStreamHandler for protocol extension"
        pattern: 'new\s+URL\s*\(\s*null\s*,\s*(?:url|uri)\s*,\s*new\s+\w+Handler'
    evasion_indicators:
      - "Multi-protocol support (file, ftp, jar, http, https)"
      - "Default redirect following"
      - "JAR URL protocol for remote code loading"
      - "Classpath resource confusion"
      - "Custom URLStreamHandler registration"
    encoding_variants:
      - type: "url_encoding"
        pattern: 'new\s+URL\s*\(.*?URLEncoder\.encode'
      - type: "decimal_ip"
        pattern: 'new\s+URL\s*\(\s*"https?://\d{8,10}'
      - type: "file_protocol"
        pattern: 'new\s+URL\s*\(\s*"file://(?:%2[fF]){2}'
    multi_function_chain_patterns:
      - "request.getParameter('url') -> new URL(url).openStream() -> BufferedReader"
      - "@RequestParam url -> new URL(url).openStream() -> IOUtils.toString()"
      - "servlet -> getParameter -> URL construction -> openStream -> response"
      - "user input -> URL -> openStream -> Scanner -> string processing"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "URL.openStream() multi-protocol support enables file read and network SSRF"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "request.getParameter('url')"
        sink: "new URL(url).openStream()"
        through: "direct parameter to URL.openStream"
      - source: "@RequestParam String imageUrl"
        sink: "IOUtils.toByteArray(new URL(imageUrl).openStream())"
        through: "image URL parameter to stream reading"
      - source: "request.getHeader('X-Fetch-Url')"
        sink: "new URL(fetchUrl).openStream()"
        through: "HTTP header to URL stream"
    impact: |
      - Local file reading via file:// protocol (e.g., /etc/passwd, application.properties).
      - Remote JAR loading via jar:// protocol potentially leading to RCE.
      - Cloud metadata credential theft via http:// to 169.254.169.254.
      - Internal service access and data exfiltration.
      - FTP-based data exfiltration to attacker-controlled servers.
    remediation: |
      1. Validate protocol and IP before calling openStream:
         ```java
         public static InputStream safeOpenStream(String userUrl) throws IOException {
             URL url = new URL(userUrl);

             // Restrict to HTTP/HTTPS only
             if (!"http".equals(url.getProtocol()) && !"https".equals(url.getProtocol())) {
                 throw new SecurityException("Protocol not allowed: " + url.getProtocol());
             }

             // Resolve and validate IP
             InetAddress addr = InetAddress.getByName(url.getHost());
             if (addr.isLoopbackAddress() || addr.isLinkLocalAddress()
                     || addr.isSiteLocalAddress()) {
                 throw new SecurityException("Internal address blocked");
             }

             HttpURLConnection conn = (HttpURLConnection) url.openConnection();
             conn.setInstanceFollowRedirects(false);
             conn.setConnectTimeout(5000);
             conn.setReadTimeout(5000);
             return conn.getInputStream();
         }
         ```
      2. Block file://, jar://, ftp://, and other non-HTTP protocols.
      3. Use HttpURLConnection instead for explicit connection control.
      4. Validate resolved IP addresses against internal ranges.
      5. Disable redirect following.
    references:
      - "https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/net/URL.html#openStream()"
      - "https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      - "https://cwe.mitre.org/data/definitions/918.html"
      - "https://portswigger.net/web-security/ssrf"
    context_awareness:
      surrounding_context_patterns:
        - 'class\s+\w+(?:Servlet|Controller|Handler|Service)\s'
        - 'protected\s+void\s+do(?:Get|Post)\s*\('
        - '@(?:GetMapping|PostMapping|RequestMapping)'
        - 'import\s+java\.net\.URL'
      taint_source_indicators:
        - 'request\.getParameter\s*\('
        - '@RequestParam\s+'
        - '@RequestBody\s+'
        - 'request\.getHeader\s*\('
      taint_sink_indicators:
        - '\.openStream\s*\('
        - '\.getContent\s*\('
        - '\.openConnection\s*\(\s*\)\s*\.\s*getInputStream'
        - 'new\s+URL\s*\('
      sanitization_patterns:
        - 'validateUrl\s*\('
        - 'isAllowedProtocol\s*\('
        - 'ALLOWED_PROTOCOLS'
        - 'isSiteLocalAddress\s*\('
        - 'isLoopbackAddress\s*\('
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (1 + multi_protocol_risk)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Java service reads remote content for processing:

        @GetMapping("/api/import")
        public String importData(@RequestParam String url) throws Exception {
            InputStream is = new URL(url).openStream();
            return IOUtils.toString(is, StandardCharsets.UTF_8);
        }

        An attacker reads local files:
        GET /api/import?url=file:///etc/passwd

        Or accesses cloud metadata:
        GET /api/import?url=http://169.254.169.254/latest/user-data
      example_payload: "file:///etc/passwd"
      attacker_objective: "Read local files or access internal services via URL.openStream()"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "SSRF-JAVA-001"
        - "SSRF-JAVA-005"
        - "SSRF-JAVA-006"

  # --------------------------------------------------------------------------
  # SSRF-JAVA-005: ImageIO.read URL SSRF
  # --------------------------------------------------------------------------
  - rule_id: "SSRF-JAVA-005"
    title: "ImageIO.read with User-Controlled URL"
    description: >
      Detects usage of Java's ImageIO.read(URL) where the URL is derived
      from user-controlled input. ImageIO.read() accepts a URL parameter
      and fetches the resource before attempting to decode it as an image.
      Even if the resource is not a valid image, the HTTP request is still
      made, making this a viable SSRF vector. This pattern commonly appears
      in image processing, thumbnail generation, and avatar upload features.
    language: java
    category: ssrf
    severity: High
    confidence: 0.89
    cwe: CWE-918
    owasp: "A10:2021-Server-Side Request Forgery"
    tags:
      - ssrf
      - java
      - imageio
      - image-processing
      - user-input
      - media
      - thumbnail
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'ImageIO\s*\.\s*read\s*\(\s*new\s+URL\s*\(\s*(?:url|uri|imageUrl|imgUrl|src|source|request\.getParameter|req\.getParameter)'
        description: "ImageIO.read with URL constructed from user input"
      - type: regex
        pattern: 'ImageIO\s*\.\s*read\s*\(\s*(?:url|uri|imageUrl|imgUrl|source)\s*\)'
        description: "ImageIO.read with user-controlled URL variable"
      - type: regex
        pattern: 'BufferedImage\s+\w+\s*=\s*ImageIO\s*\.\s*read\s*\(\s*new\s+URL\s*\(\s*(?:url|uri|imageUrl|request\.)'
        description: "BufferedImage loaded from user-controlled URL"
      - type: regex
        pattern: '(?:Thumbnails|Thumbnailator)\s*\.\s*of\s*\(\s*new\s+URL\s*\(\s*(?:url|uri|imageUrl|request\.)'
        description: "Thumbnailator library with user-controlled URL"
      - type: regex
        pattern: 'ImageIO\s*\.\s*(?:read|createImageInputStream)\s*\(\s*new\s+URL\s*\(\s*request\s*\.\s*getParameter'
        description: "ImageIO reading from servlet request parameter URL"
      - type: regex
        pattern: 'String\s+(?:imageUrl|imgUrl|avatarUrl|photoUrl)\s*=\s*request\s*\.\s*getParameter\s*\([^)]+\)\s*;[\s\S]{0,200}ImageIO\s*\.\s*read'
        description: "Image URL from request parameter used shortly after in ImageIO"
      - type: regex
        pattern: '(?:Graphics2D|BufferedImage|Image)\s*[\s\S]{0,300}ImageIO\s*\.\s*read\s*\(\s*new\s+URL\s*\(\s*(?:url|uri|imageUrl|request\.)'
        description: "Image processing context with user-controlled URL source"
      - type: regex
        pattern: '(?:PDFBox|iText|JasperReports|POI)\s*[\s\S]{0,500}new\s+URL\s*\(\s*(?:url|uri|imageUrl|request\.)'
        description: "Document processing library loading image from user URL"
    anti_patterns:
      - 'ImageIO\s*\.\s*read\s*\(\s*new\s+File\s*\('
      - 'ImageIO\s*\.\s*read\s*\(\s*(?:getClass|ClassLoader)\s*\.\s*getResource'
      - 'ImageIO\s*\.\s*read\s*\(\s*new\s+URL\s*\(\s*"https?://(?:static\.|cdn\.|assets\.)'
      - 'ImageIO\s*\.\s*read\s*\(\s*new\s+ByteArrayInputStream'
      - 'ImageIO\s*\.\s*read\s*\(\s*(?:inputStream|is|stream)\s*\)'
      - '@Test'
      - 'class\s+\w+Test\s'
      - 'import\s+org\.(?:junit|mockito)'
      - 'Mockito\.\w+'
      - '@SpringBootTest'
      - '@MockBean'
      - 'ImageIO\s*\.\s*read\s*\(\s*(?:RESOURCE|CLASSPATH|CONFIG)'
      - 'getResourceAsStream\s*\('
      - 'ClassPathResource\s*\('
      - 'ImageIO\s*\.\s*write\s*\('
    bypass_variants:
      - description: "Redirect to internal URL via 302 (ImageIO follows redirects)"
        pattern: 'ImageIO\s*\.\s*read\s*\(\s*new\s+URL\s*\(\s*(?:url|imageUrl|request)'
      - description: "SVG with external entity reference (XXE via image)"
        pattern: '(?:svg|image/svg)[\s\S]{0,200}(?:url|uri|imageUrl|request\.)'
      - description: "ImageIO plugin loading remote resources"
        pattern: 'ImageIO\s*\.\s*(?:getImageReadersByFormatName|createImageInputStream)\s*\('
      - description: "EXIF data containing URLs for secondary fetches"
        pattern: '(?:Metadata|EXIF|IPTC|XMP)[\s\S]{0,200}(?:url|uri|source|reference)'
    evasion_indicators:
      - "302 redirect from image URL to internal resource"
      - "SVG with embedded external references"
      - "Image format exploits (ImageTragick-style)"
      - "EXIF metadata with embedded URLs"
      - "Progressive image loading fetching additional resources"
    encoding_variants:
      - type: "url_encoding"
        pattern: 'ImageIO\.read\s*\(\s*new\s+URL\s*\(.*?%(?:25)?(?:30|31|32)'
      - type: "data_uri"
        pattern: 'ImageIO\.read\s*\(.*?"data:image/'
      - type: "base64_url"
        pattern: 'ImageIO\.read\s*\(.*?(?:Base64|decode)\s*\('
    multi_function_chain_patterns:
      - "request.getParameter('imageUrl') -> new URL(imageUrl) -> ImageIO.read(url)"
      - "@RequestParam imageUrl -> ImageIO.read(new URL(imageUrl)) -> resize -> save"
      - "user input -> avatar URL -> ImageIO.read(url) -> thumbnail generation"
      - "webhook payload -> image URL -> ImageIO.read -> processing pipeline"
    privilege_context_flags:
      requires_auth_context: true
      admin_only_risk: false
      escalation_vector: "Image processing SSRF enables blind requests to internal services"
    business_logic_indicator:
      financial_impact: false
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "request.getParameter('imageUrl')"
        sink: "ImageIO.read(new URL(imageUrl))"
        through: "direct parameter to ImageIO.read"
      - source: "@RequestParam String avatarUrl"
        sink: "ImageIO.read(new URL(avatarUrl))"
        through: "avatar upload URL to image processing"
      - source: "profileDto.getPhotoUrl()"
        sink: "ImageIO.read(new URL(photoUrl))"
        through: "profile update DTO to image loading"
    impact: |
      - Blind SSRF via image loading to internal services.
      - Cloud metadata access through image URL pointing to metadata endpoint.
      - Internal port scanning via response timing analysis.
      - Potential for ImageTragick-style exploits if ImageMagick is used.
      - Information leakage via error messages about failed image parsing.
    remediation: |
      1. Download the image content separately with URL validation, then pass bytes to ImageIO:
         ```java
         public static BufferedImage safeImageRead(String imageUrl) throws IOException {
             URL url = new URL(imageUrl);

             if (!"https".equals(url.getProtocol())) {
                 throw new SecurityException("Only HTTPS allowed");
             }

             InetAddress addr = InetAddress.getByName(url.getHost());
             if (addr.isSiteLocalAddress() || addr.isLoopbackAddress()
                     || addr.isLinkLocalAddress()) {
                 throw new SecurityException("Internal address blocked");
             }

             HttpURLConnection conn = (HttpURLConnection) url.openConnection();
             conn.setInstanceFollowRedirects(false);
             conn.setConnectTimeout(5000);
             conn.setReadTimeout(5000);

             String contentType = conn.getContentType();
             if (!contentType.startsWith("image/")) {
                 throw new SecurityException("Not an image content type");
             }

             byte[] data = conn.getInputStream().readAllBytes();
             return ImageIO.read(new ByteArrayInputStream(data));
         }
         ```
      2. Validate content type before processing.
      3. Use ByteArrayInputStream instead of URL for ImageIO.read().
      4. Set size limits on downloaded images.
      5. Disable SVG processing or sanitize SVG content.
    references:
      - "https://docs.oracle.com/en/java/javase/17/docs/api/java.desktop/javax/imageio/ImageIO.html"
      - "https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      - "https://cwe.mitre.org/data/definitions/918.html"
      - "https://imagetragick.com/"
    context_awareness:
      surrounding_context_patterns:
        - 'import\s+javax\.imageio\.ImageIO'
        - 'class\s+\w+(?:Image|Media|Avatar|Photo|Thumbnail)'
        - '@(?:PostMapping|PutMapping|RequestMapping)'
        - 'BufferedImage\s+'
      taint_source_indicators:
        - 'request\.getParameter\s*\(\s*"(?:image|img|avatar|photo|media)(?:Url|URL|Uri|URI)?"'
        - '@RequestParam\s+String\s+(?:image|img|avatar|photo)(?:Url)?'
        - 'dto\.get(?:Image|Avatar|Photo)Url\s*\('
        - 'request\.getHeader\s*\('
      taint_sink_indicators:
        - 'ImageIO\.read\s*\(\s*new\s+URL'
        - 'ImageIO\.createImageInputStream\s*\('
        - 'Thumbnails\.of\s*\(\s*new\s+URL'
        - 'new\s+URL\s*\(.*\)\.openStream'
      sanitization_patterns:
        - 'validateImageUrl\s*\('
        - 'isAllowedImageHost\s*\('
        - 'contentType\.startsWith\s*\(\s*"image/'
        - 'IMAGE_ALLOWED_HOSTS'
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 + blind_ssrf_factor)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A profile service allows users to set avatars via URL:

        @PostMapping("/api/profile/avatar")
        public void updateAvatar(@RequestParam String imageUrl) {
            BufferedImage image = ImageIO.read(new URL(imageUrl));
            // ... resize and save avatar
        }

        An attacker sets their avatar URL to:
        POST /api/profile/avatar?imageUrl=http://169.254.169.254/latest/meta-data/

        Even though the response is not a valid image, the HTTP request is made
        and the response is received. Error messages may leak information.
      example_payload: "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
      attacker_objective: "Perform blind SSRF via image processing endpoint"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: false
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "SSRF-JAVA-001"
        - "SSRF-JAVA-004"
        - "SSRF-JAVA-006"

  # --------------------------------------------------------------------------
  # SSRF-JAVA-006: Cloud Metadata Endpoint Access
  # --------------------------------------------------------------------------
  - rule_id: "SSRF-JAVA-006"
    title: "Cloud Metadata Endpoint Access in Java"
    description: >
      Detects Java code patterns that access cloud provider metadata endpoints,
      either directly or through user-controlled URL parameters. Cloud metadata
      services at 169.254.169.254 (AWS, GCP), 169.254.170.2 (ECS), and
      100.100.100.200 (Alibaba) expose temporary IAM credentials, instance
      identity, and configuration data. This is the highest-impact SSRF
      target in cloud-hosted Java applications.
    language: java
    category: ssrf
    severity: Critical
    confidence: 0.95
    cwe: CWE-918
    owasp: "A10:2021-Server-Side Request Forgery"
    tags:
      - ssrf
      - java
      - cloud-metadata
      - aws
      - gcp
      - azure
      - iam
      - credential-theft
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+URL\s*\(\s*"https?://169\.254\.169\.254'
        description: "URL object constructed with metadata IP"
      - type: regex
        pattern: 'new\s+(?:HttpGet|HttpPost)\s*\(\s*"https?://169\.254\.169\.254'
        description: "Apache HttpClient request to metadata IP"
      - type: regex
        pattern: '(?:restTemplate|webClient)\s*\.?\s*\w+\s*\(\s*"https?://169\.254\.169\.254'
        description: "Spring HTTP client accessing metadata endpoint"
      - type: regex
        pattern: 'URI\s*\.\s*create\s*\(\s*"https?://169\.254\.169\.254'
        description: "URI.create with metadata IP"
      - type: regex
        pattern: '"https?://metadata\.google\.internal/computeMetadata/'
        description: "GCP metadata endpoint URL in code"
      - type: regex
        pattern: '"Metadata-Flavor"\s*,\s*"Google"'
        description: "GCP metadata request header value"
      - type: regex
        pattern: '(?:169\.254\.169\.254|metadata\.google\.internal|169\.254\.170\.2|100\.100\.100\.200)(?:/latest/|/computeMetadata/|/metadata/)'
        description: "Cloud metadata path patterns"
      - type: regex
        pattern: '"X-aws-ec2-metadata-token"'
        description: "AWS IMDSv2 token header in Java code"
    anti_patterns:
      - '@Test'
      - 'class\s+\w+Test\s'
      - 'import\s+org\.(?:junit|mockito)'
      - '(?:mock|stub|when|verify|Mockito)\s*[\.\(]'
      - '@SpringBootTest'
      - '@MockBean'
      - 'WireMock\.'
      - '(?://|/\*)\s*(?:TODO|FIXME|test|mock|example)'
      - 'BLOCKED.*169\.254'
      - 'DENY.*169\.254'
      - 'import\s+(?:com\.amazonaws|software\.amazon\.awssdk)'
      - 'AmazonEC2Client'
      - 'Ec2MetadataClient'
      - 'com\.google\.cloud\.'
      - 'com\.azure\.'
    bypass_variants:
      - description: "Decimal IP encoding (2852039166 = 169.254.169.254)"
        pattern: 'new\s+URL\s*\(\s*"https?://2852039166'
      - description: "Hex IP encoding (0xa9fea9fe)"
        pattern: 'new\s+URL\s*\(\s*"https?://0xa9fea9fe'
      - description: "Octal IP encoding"
        pattern: 'new\s+URL\s*\(\s*"https?://0251\.0376\.0251\.0376'
      - description: "IPv6 mapped address"
        pattern: 'new\s+URL\s*\(\s*"https?://\[::ffff:169\.254\.169\.254\]'
      - description: "Redirect to metadata via 302 response"
        pattern: '\.setInstanceFollowRedirects\s*\(\s*true\s*\)[\s\S]{0,500}169\.254'
    evasion_indicators:
      - "Decimal/octal/hex IP encoding"
      - "IPv6 mapped IPv4 address"
      - "HTTP redirect chain to metadata"
      - "DNS CNAME to metadata IP"
      - "URL shortener redirect"
      - "Server-side PDF/image rendering to metadata"
    encoding_variants:
      - type: "decimal_ip"
        pattern: '(?:new\s+URL|URI\.create)\s*\(\s*"https?://285203916[0-9]'
      - type: "hex_ip"
        pattern: '(?:new\s+URL|URI\.create)\s*\(\s*"https?://0x[aA]9[fF][eE][aA]9[fF][eE]'
      - type: "octal_ip"
        pattern: '(?:new\s+URL|URI\.create)\s*\(\s*"https?://0+251\.0+376'
      - type: "ipv6_mapped"
        pattern: '(?:new\s+URL|URI\.create)\s*\(\s*"https?://\[::ffff:(?:169\.254|a9fe)'
    multi_function_chain_patterns:
      - "user URL -> SSRF -> metadata credential extraction -> AWS API calls"
      - "image URL -> ImageIO.read -> redirect to metadata -> credential leak"
      - "webhook URL -> HttpClient -> redirect to metadata -> token theft"
      - "PDF generation -> URL reference -> metadata access -> credential exposure"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Cloud metadata access yields IAM credentials for full cloud infrastructure compromise"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "request.getParameter('url')"
        sink: "new URL('http://169.254.169.254/...').openStream()"
        through: "URL validation bypass allowing metadata IP"
      - source: "@RequestParam String imageUrl"
        sink: "ImageIO.read(new URL(imageUrl))"
        through: "image URL redirect to metadata endpoint"
      - source: "requestBody.getWebhookUrl()"
        sink: "httpClient.execute(new HttpGet(webhookUrl))"
        through: "webhook URL redirect to metadata"
    impact: |
      - Theft of AWS IAM temporary security credentials.
      - Theft of GCP service account OAuth2 tokens.
      - Theft of Azure Managed Identity tokens.
      - Access to instance user-data containing application secrets.
      - Full cloud account compromise through stolen credentials.
      - Lateral movement to databases, storage, and compute services.
    remediation: |
      1. Block metadata endpoints at application and network level:
         ```java
         import java.net.*;
         import java.util.Set;

         public class MetadataBlocker {
             private static final Set<String> METADATA_IPS = Set.of(
                 "169.254.169.254", "169.254.170.2",
                 "100.100.100.200", "fd00:ec2::254"
             );
             private static final Set<String> METADATA_HOSTS = Set.of(
                 "metadata.google.internal", "metadata.azure.com"
             );

             public static void blockMetadata(String urlString) throws Exception {
                 URL url = new URL(urlString);
                 String host = url.getHost();

                 if (METADATA_IPS.contains(host) || METADATA_HOSTS.contains(host)) {
                     throw new SecurityException("Metadata endpoint blocked");
                 }

                 InetAddress addr = InetAddress.getByName(host);
                 if (METADATA_IPS.contains(addr.getHostAddress())) {
                     throw new SecurityException("DNS resolves to metadata IP");
                 }
                 if (addr.isLinkLocalAddress()) {
                     throw new SecurityException("Link-local address blocked");
                 }
             }
         }
         ```
      2. Enable IMDSv2 on all AWS EC2 instances.
      3. Deploy iptables/nftables rules blocking metadata access from containers.
      4. Use Kubernetes network policies to restrict egress to metadata.
      5. Implement VPC firewall rules blocking link-local access.
    references:
      - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html"
      - "https://cloud.google.com/compute/docs/metadata/overview"
      - "https://docs.microsoft.com/en-us/azure/virtual-machines/instance-metadata-service"
      - "https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
    context_awareness:
      surrounding_context_patterns:
        - 'class\s+\w+(?:Controller|Service|Handler)\s'
        - '@(?:RestController|Controller|Service)'
        - 'import\s+java\.net\.'
        - 'import\s+org\.apache\.http'
      taint_source_indicators:
        - 'request\.getParameter\s*\('
        - '@RequestParam\s+'
        - '@RequestBody\s+'
        - 'request\.getHeader\s*\('
      taint_sink_indicators:
        - 'new\s+URL\s*\('
        - 'URI\.create\s*\('
        - 'new\s+HttpGet\s*\('
        - 'restTemplate\.\w+\s*\('
        - 'webClient\.\w+\s*\('
      sanitization_patterns:
        - 'blockMetadata\s*\('
        - 'METADATA.*(?:BLOCK|DENY)'
        - 'isMetadataIP\s*\('
        - 'isLinkLocalAddress\s*\('
        - 'BLOCKED_IPS.*169\.254'
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * cloud_exposure_multiplier"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Spring Boot application accepts a URL for content fetching:

        @GetMapping("/api/fetch")
        public String fetchUrl(@RequestParam String url) {
            return restTemplate.getForObject(url, String.class);
        }

        Attacker requests:
        GET /api/fetch?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/

        Server returns IAM role name. Attacker then fetches:
        GET /api/fetch?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/EC2-Admin

        Returns JSON with AccessKeyId, SecretAccessKey, and Token.
      example_payload: "http://169.254.169.254/latest/meta-data/iam/security-credentials/EC2-Admin"
      attacker_objective: "Steal cloud IAM credentials for full infrastructure compromise"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "SSRF-JAVA-001"
        - "SSRF-JAVA-002"
        - "SSRF-JAVA-003"
        - "SSRF-JAVA-004"
        - "SSRF-JAVA-005"
