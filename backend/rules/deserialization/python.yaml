        database by setting a key's value to a pickle payload containing a
        __reduce__ method that spawns a reverse shell. When the application
        opens the uploaded file and reads the key, pickle deserialization
        executes the attacker's code on the server.
      example_payload: "Crafted .db file with shelve value containing pickle __reduce__ -> os.system('reverse shell')"
      attacker_objective: "Execute arbitrary code by uploading a crafted shelve database file that triggers pickle deserialization"
