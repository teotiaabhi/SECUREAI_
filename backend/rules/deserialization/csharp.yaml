      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-CS-001"
        - "DESER-CS-004"
        - "DESER-CS-008"

  # --------------------------------------------------------------------------
  # DESER-CS-006: LosFormatter Deserialization
  # --------------------------------------------------------------------------
  - rule_id: "DESER-CS-006"
    title: "LosFormatter Deserialization of Untrusted Data"
    description: >
      Detects usage of LosFormatter (Limited Object Serialization) which is used
      internally by ASP.NET for ViewState serialization. LosFormatter uses
      BinaryFormatter internally, making it vulnerable to the same deserialization
      attacks. Custom usage of LosFormatter to deserialize user-controlled data
      enables RCE. While ASP.NET ViewState has MAC protection by default,
      developers sometimes use LosFormatter directly without MAC validation.
    language: csharp
    category: deserialization
    severity: High
    confidence: 0.93
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - rce
      - LosFormatter
      - viewstate
      - asp.net
      - dotnet
      - csharp
      - critical
    detection_layer: 1
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'new\s+LosFormatter\s*\(\s*\)'
        description: "LosFormatter default constructor"
      - type: regex
        pattern: 'new\s+LosFormatter\s*\(\s*false\s*,'
        description: "LosFormatter with MAC validation disabled"
      - type: regex
        pattern: 'LosFormatter[\s\S]{0,300}\.Deserialize\s*\('
        description: "LosFormatter.Deserialize call"
      - type: regex
        pattern: 'LosFormatter\s+\w+\s*=\s*new\s+LosFormatter'
        description: "LosFormatter variable assignment"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '\.Serialize\s*\('
      - 'mock'
      - 'fixture'
      - 'example'
      - 'ViewStateEncryptionMode'
    bypass_variants:
      - description: "LosFormatter with disabled MAC"
        pattern: 'new\s+LosFormatter\s*\(\s*false\s*,\s*(?:""|\(byte\[\]\)\s*null)'
      - description: "LosFormatter from Base64 ViewState"
        pattern: 'LosFormatter[\s\S]{0,200}Deserialize[\s\S]{0,100}__VIEWSTATE'
      - description: "ViewState deserialization with no MAC key"
        pattern: 'enableViewStateMac\s*=\s*"?false'
    evasion_indicators:
      - "LosFormatter used outside ASP.NET pipeline"
      - "ViewState MAC validation disabled"
      - "Custom LosFormatter usage for data serialization"
      - "Base64 data passed directly to LosFormatter.Deserialize"
    encoding_variants:
      - type: "base64_viewstate"
        pattern: 'Convert\.FromBase64String[\s\S]{0,200}LosFormatter'
      - type: "viewstate_field"
        pattern: '__VIEWSTATE[\s\S]{0,200}LosFormatter'
      - type: "stream_input"
        pattern: 'new\s+StringReader[\s\S]{0,200}LosFormatter[\s\S]{0,100}Deserialize'
    multi_function_chain_patterns:
      - "Request[\"__VIEWSTATE\"] -> LosFormatter.Deserialize -> BinaryFormatter internally -> RCE"
      - "Base64 input -> LosFormatter.Deserialize -> object instantiation"
      - "Hidden field -> LosFormatter(false, null).Deserialize -> gadget chain"
      - "Cookie value -> LosFormatter.Deserialize -> type resolution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "LosFormatter uses BinaryFormatter internally, enabling same RCE gadget chains"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "ViewState_field"
        sink: "LosFormatter.Deserialize(viewstate)"
        through: "hidden form field to LosFormatter"
      - source: "request_parameter"
        sink: "LosFormatter.Deserialize(input)"
        through: "user input to direct deserialization"
      - source: "cookie_value"
        sink: "LosFormatter.Deserialize(cookie)"
        through: "cookie to LosFormatter deserialization"
    impact: |
      LosFormatter deserialization is equivalent to BinaryFormatter:
      - Uses BinaryFormatter internally for object serialization
      - Same gadget chains achieve RCE
      - Commonly used in ASP.NET ViewState (usually MAC-protected)
      - Direct usage without MAC enables trivial exploitation
      - Full system compromise with web application privileges
    remediation: |
      Never use LosFormatter to deserialize untrusted data:

      ```csharp
      // VULNERABLE: LosFormatter without MAC
      var formatter = new LosFormatter(false, (byte[])null);
      object obj = formatter.Deserialize(input);

      // SECURE: Use System.Text.Json instead
      var obj = JsonSerializer.Deserialize<MyType>(json);

      // For ViewState: Ensure MAC validation is enabled
      // In web.config: <pages enableViewStateMac="true" />
      // In .NET 4.5.2+: MAC is always enforced
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://learn.microsoft.com/en-us/dotnet/api/system.web.ui.losformatter"
      - "https://github.com/pwntester/ysoserial.net"
    context_awareness:
      surrounding_context_patterns:
        - 'LosFormatter'
        - 'Deserialize'
        - 'ViewState'
        - '__VIEWSTATE'
        - 'ASP\.NET'
      taint_source_indicators:
        - 'Request\['
        - '__VIEWSTATE'
        - 'HttpContext'
        - 'hidden.*field'
      taint_sink_indicators:
        - '\.Deserialize\s*\('
        - 'LosFormatter'
      sanitization_patterns:
        - 'enableViewStateMac.*true'
        - 'ViewStateEncryptionMode'
        - 'JsonSerializer'
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 + viewstate_exposure)"
      exploitability_score: "Critical"
    exploit_scenario:
      attack_example: |
        Attacker exploits direct LosFormatter usage in an ASP.NET application:
        1. Developer uses LosFormatter to serialize/deserialize custom state data
        2. LosFormatter(false, null) disables MAC validation
        3. Attacker generates ysoserial.net payload and Base64-encodes it
        4. Attacker sends the payload as the serialized state parameter
        5. LosFormatter.Deserialize triggers BinaryFormatter internally
        6. Gadget chain executes arbitrary commands on the server
      example_payload: "new LosFormatter(false, (byte[])null).Deserialize(userInput)"
      attacker_objective: "Achieve RCE via LosFormatter which internally uses BinaryFormatter"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2026-02-28"
      rule_maturity_level: "hardened"
      detection_complexity: "low"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-CS-001"
        - "DESER-CS-007"

