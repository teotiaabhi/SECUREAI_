      - source: "file_upload"
        sink: "SoapFormatter.Deserialize(fileStream)"
        through: "uploaded SOAP XML file"
      - source: "network_stream"
        sink: "SoapFormatter.Deserialize(networkStream)"
        through: ".NET Remoting channel"
    impact: |
      SoapFormatter deserialization is as dangerous as BinaryFormatter:
      - Same gadget chains (ysoserial.net) apply to SoapFormatter
      - Arbitrary type instantiation from SOAP XML payloads
      - Commonly found in legacy .NET Remoting and SOAP services
      - Full remote code execution with process privileges
      - Deprecated alongside BinaryFormatter in .NET 5+
    remediation: |
      Replace SoapFormatter with safe serializers:

      ```csharp
      // VULNERABLE: SoapFormatter
      var formatter = new SoapFormatter();
      object obj = formatter.Deserialize(stream);

      // SECURE: DataContractSerializer
      var serializer = new DataContractSerializer(typeof(MyType));
      var obj = (MyType)serializer.ReadObject(stream);

      // SECURE: System.Text.Json
      var obj = JsonSerializer.Deserialize<MyType>(json);
      ```
