      - type: "base64_soap"
        pattern: 'Convert\.FromBase64String[\s\S]{0,200}SoapFormatter'
      - type: "stream_wrap"
        pattern: 'new\s+MemoryStream[\s\S]{0,200}SoapFormatter[\s\S]{0,100}Deserialize'
    multi_function_chain_patterns:
      - "Request.InputStream -> SoapFormatter.Deserialize -> type instantiation"
      - "SOAP message -> MemoryStream -> SoapFormatter.Deserialize -> RCE"
      - "File.OpenRead -> SoapFormatter.Deserialize -> object cast"
      - "NetworkStream -> SoapFormatter.Deserialize -> command execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
