# ============================================================================
# Deserialization Vulnerability Detection Rules - C#
# Ruleset Version: 3.0.0
# Last Updated: 2026-02-28
# Category: Insecure Deserialization (CWE-502)
# Language: C#
# ============================================================================

rules:
  # --------------------------------------------------------------------------
  # DESER-CS-001: BinaryFormatter Deserialization
  # --------------------------------------------------------------------------
  - rule_id: "DESER-CS-001"
    title: "BinaryFormatter Deserialization of Untrusted Data"
    description: >
      Detects usage of BinaryFormatter.Deserialize() which is inherently unsafe
      and cannot be made secure regardless of configuration. BinaryFormatter
      resolves types during deserialization, allowing attackers to instantiate
      arbitrary classes with controlled constructor and property values. This
      enables Remote Code Execution via gadget chains such as
      TypeConfuseDelegate, ObjectDataProvider, and WindowsIdentity. Microsoft
      has officially deprecated BinaryFormatter and it is disabled by default
      in .NET 8+. SYSLIB0011 warning was introduced in .NET 5.
    language: csharp
    category: deserialization
    severity: Critical
    confidence: 0.96
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - rce
      - BinaryFormatter
      - dotnet
      - csharp
      - gadget-chain
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'BinaryFormatter\s*\(\s*\)[\s\S]{0,300}\.Deserialize\s*\('
        description: "BinaryFormatter instantiation followed by Deserialize call"
      - type: regex
        pattern: 'new\s+BinaryFormatter\s*\(\s*\)'
        description: "BinaryFormatter constructor instantiation"
      - type: regex
        pattern: '\.Deserialize\s*\(\s*(?:stream|memStream|networkStream|request|fileStream|ms|data)'
        description: "Deserialize with stream from potentially untrusted source"
      - type: regex
        pattern: 'BinaryFormatter\s+\w+\s*=\s*new\s+BinaryFormatter'
        description: "BinaryFormatter variable assignment"
      - type: regex
        pattern: 'IFormatter\s+\w+\s*=\s*new\s+BinaryFormatter'
        description: "BinaryFormatter assigned to IFormatter interface"
      - type: regex
        pattern: 'typeof\s*\(\s*BinaryFormatter\s*\)'
        description: "BinaryFormatter type reference (potential reflection usage)"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '#pragma\s+warning\s+disable\s+SYSLIB0011'
      - 'Serialize\s*\('
      - '\.Serialize\s*\(\s*stream\s*,\s*(?:data|obj)'
      - 'mock'
      - 'fixture'
      - '\[Obsolete\]'
    bypass_variants:
      - description: "BinaryFormatter via IFormatter interface"
        pattern: 'IFormatter\s+\w+[\s\S]{0,100}Deserialize\s*\('
      - description: "BinaryFormatter created via Activator.CreateInstance"
        pattern: 'Activator\.CreateInstance\s*\([^)]*BinaryFormatter'
      - description: "BinaryFormatter with custom SerializationBinder (still unsafe)"
        pattern: 'BinaryFormatter[\s\S]{0,200}Binder\s*=[\s\S]{0,100}Deserialize'
    evasion_indicators:
      - "BinaryFormatter accessed via IFormatter interface"
      - "Activator.CreateInstance for dynamic instantiation"
      - "Custom SerializationBinder (does not make BinaryFormatter safe)"
      - "BinaryFormatter loaded via reflection"
    encoding_variants:
      - type: "base64_payload"
        pattern: 'Convert\.FromBase64String[\s\S]{0,200}BinaryFormatter[\s\S]{0,100}Deserialize'
      - type: "memory_stream"
        pattern: 'new\s+MemoryStream\s*\([^)]+\)[\s\S]{0,200}BinaryFormatter'
      - type: "network_stream"
        pattern: 'NetworkStream[\s\S]{0,200}BinaryFormatter[\s\S]{0,100}Deserialize'
    multi_function_chain_patterns:
      - "Request.InputStream -> MemoryStream -> BinaryFormatter.Deserialize -> RCE"
      - "Convert.FromBase64String -> MemoryStream -> BinaryFormatter.Deserialize"
      - "File.OpenRead -> BinaryFormatter.Deserialize -> object cast"
      - "TcpClient.GetStream -> BinaryFormatter.Deserialize -> command execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "BinaryFormatter deserialization enables arbitrary type instantiation and RCE via gadget chains"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP_request_body"
        sink: "BinaryFormatter.Deserialize(stream)"
        through: "MemoryStream wrapping request data"
      - source: "file_upload"
        sink: "BinaryFormatter.Deserialize(fileStream)"
        through: "FileStream from uploaded file"
      - source: "network_socket"
        sink: "BinaryFormatter.Deserialize(networkStream)"
        through: "TcpClient.GetStream()"
    impact: |
      BinaryFormatter deserialization is the most dangerous .NET deserialization vector:
      - Arbitrary type instantiation during deserialization
      - Well-known gadget chains (ysoserial.net) for immediate RCE
      - Cannot be secured even with SerializationBinder
      - Microsoft officially deprecated and disabled in .NET 8+
      - Full system compromise with process privileges
    remediation: |
      Replace BinaryFormatter with safe serializers:

      ```csharp
      // VULNERABLE: BinaryFormatter
      var formatter = new BinaryFormatter();
      object obj = formatter.Deserialize(stream);

      // SECURE: System.Text.Json (.NET Core 3.0+)
      var obj = JsonSerializer.Deserialize<MyType>(jsonString);

      // SECURE: DataContractSerializer with known types only
      var serializer = new DataContractSerializer(typeof(MyType));
      var obj = (MyType)serializer.ReadObject(stream);

      // SECURE: MessagePack with security options
      var options = MessagePackSerializerOptions.Standard
          .WithSecurity(MessagePackSecurity.UntrustedData);
      var obj = MessagePackSerializer.Deserialize<MyType>(data, options);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://learn.microsoft.com/en-us/dotnet/standard/serialization/binaryformatter-security-guide"
      - "https://github.com/pwntester/ysoserial.net"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - 'BinaryFormatter'
        - 'Deserialize'
        - 'IFormatter'
        - 'MemoryStream'
        - 'Stream'
      taint_source_indicators:
        - 'Request\.'
        - 'HttpContext'
        - 'NetworkStream'
        - 'TcpClient'
        - 'File\.Open'
      taint_sink_indicators:
        - '\.Deserialize\s*\('
        - 'BinaryFormatter'
      sanitization_patterns:
        - 'JsonSerializer'
        - 'DataContractSerializer'
        - 'System\.Text\.Json'
        - 'XmlSerializer'
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 + gadget_chain_availability)"
      exploitability_score: "Critical"
    exploit_scenario:
      attack_example: |
        An attacker exploits BinaryFormatter in an ASP.NET application:
        1. Application deserializes session state from cookies using BinaryFormatter
        2. Attacker generates a malicious payload using ysoserial.net with TypeConfuseDelegate gadget
        3. Attacker Base64-encodes the payload and sends it as the session cookie
        4. BinaryFormatter.Deserialize instantiates the gadget chain objects
        5. Delegate invocation triggers Process.Start("cmd.exe", "/c whoami")
        6. Attacker achieves remote code execution with web application privileges
      example_payload: "new BinaryFormatter().Deserialize(new MemoryStream(Convert.FromBase64String(cookie)))"
      attacker_objective: "Achieve remote code execution via BinaryFormatter gadget chain deserialization"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2026-02-28"
      rule_maturity_level: "hardened"
      detection_complexity: "low"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-CS-002"
        - "DESER-CS-004"
        - "DESER-CS-005"

  # --------------------------------------------------------------------------
  # DESER-CS-002: JavaScriptSerializer with Type Resolver
  # --------------------------------------------------------------------------
  - rule_id: "DESER-CS-002"
    title: "JavaScriptSerializer with SimpleTypeResolver"
    description: >
      Detects usage of JavaScriptSerializer configured with SimpleTypeResolver or
      any custom JavaScriptTypeResolver. When a type resolver is configured,
      JavaScriptSerializer processes __type metadata in JSON payloads, enabling
      arbitrary type instantiation. SimpleTypeResolver resolves any type by its
      assembly-qualified name, making it equivalent to BinaryFormatter in terms
      of exploitability. Without a type resolver, JavaScriptSerializer is safe
      but limited in functionality.
    language: csharp
    category: deserialization
    severity: Critical
    confidence: 0.94
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - rce
      - JavaScriptSerializer
      - SimpleTypeResolver
      - json
      - dotnet
      - csharp
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+JavaScriptSerializer\s*\(\s*new\s+SimpleTypeResolver\s*\(\s*\)\s*\)'
        description: "JavaScriptSerializer with SimpleTypeResolver"
      - type: regex
        pattern: 'JavaScriptSerializer\s*\(\s*(?:new\s+\w*TypeResolver|resolver|typeResolver)\s*\)'
        description: "JavaScriptSerializer with custom type resolver"
      - type: regex
        pattern: 'new\s+SimpleTypeResolver\s*\(\s*\)'
        description: "SimpleTypeResolver instantiation"
      - type: regex
        pattern: 'JavaScriptSerializer[\s\S]{0,200}\.Deserialize\s*\(\s*(?:request|input|json|data|body|payload)'
        description: "JavaScriptSerializer deserializing potentially untrusted input"
      - type: regex
        pattern: 'JavaScriptSerializer[\s\S]{0,200}\.DeserializeObject\s*\('
        description: "JavaScriptSerializer.DeserializeObject (untyped deserialization)"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - 'new\s+JavaScriptSerializer\s*\(\s*\)'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'documentation'
    bypass_variants:
      - description: "Custom type resolver that resolves unsafe types"
        pattern: 'class\s+\w*TypeResolver\w*\s*:\s*JavaScriptTypeResolver[\s\S]{0,500}ResolveType'
      - description: "Type resolver registered indirectly"
        pattern: 'JavaScriptSerializer\s*\(\s*(?:config|settings|options)\.'
      - description: "Resolver passed as variable"
        pattern: 'JavaScriptSerializer\s*\(\s*\w+Resolver\s*\)'
    evasion_indicators:
      - "Custom JavaScriptTypeResolver subclass"
      - "Type resolver loaded from configuration"
      - "Resolver passed as constructor parameter variable"
      - "Dynamic resolver selection at runtime"
    encoding_variants:
      - type: "type_metadata"
        pattern: '__type.*JavaScriptSerializer'
      - type: "variable_resolver"
        pattern: 'JavaScriptTypeResolver\s+\w+[\s\S]{0,200}JavaScriptSerializer'
      - type: "dynamic_type"
        pattern: 'Type\.GetType[\s\S]{0,200}JavaScriptTypeResolver'
    multi_function_chain_patterns:
      - "Request.Body -> ReadAsString -> JavaScriptSerializer(SimpleTypeResolver).Deserialize"
      - "HTTP POST body -> json string -> JavaScriptSerializer.DeserializeObject -> type instantiation"
      - "Cookie value -> Base64 decode -> JavaScriptSerializer(resolver).Deserialize"
      - "WebSocket message -> JavaScriptSerializer(SimpleTypeResolver).Deserialize"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "SimpleTypeResolver enables arbitrary type instantiation from JSON __type metadata"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP_request_body"
        sink: "JavaScriptSerializer.Deserialize(json)"
        through: "request body to JSON string"
      - source: "query_parameter"
        sink: "JavaScriptSerializer.DeserializeObject(input)"
        through: "URL parameter to deserialization"
      - source: "cookie_value"
        sink: "JavaScriptSerializer(resolver).Deserialize(cookie)"
        through: "cookie to JSON deserialization"
    impact: |
      JavaScriptSerializer with SimpleTypeResolver enables full RCE:
      - __type metadata controls type instantiation
      - SimpleTypeResolver resolves any assembly-qualified type name
      - Equivalent to BinaryFormatter in exploitability
      - ObjectDataProvider gadget chain achieves arbitrary code execution
      - Full system compromise with process privileges
    remediation: |
      Never use JavaScriptSerializer with a type resolver for untrusted data:

      ```csharp
      // VULNERABLE: JavaScriptSerializer with SimpleTypeResolver
      var serializer = new JavaScriptSerializer(new SimpleTypeResolver());
      var obj = serializer.Deserialize<MyType>(json);

      // SECURE: System.Text.Json (no type metadata processing)
      var obj = JsonSerializer.Deserialize<MyType>(json);

      // SECURE: JavaScriptSerializer without resolver (limited but safe)
      var serializer = new JavaScriptSerializer();
      var obj = serializer.Deserialize<MyType>(json);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://learn.microsoft.com/en-us/dotnet/api/system.web.script.serialization.javascriptserializer"
      - "https://github.com/pwntester/ysoserial.net"
      - "https://www.blackhat.com/docs/us-17/thursday/us-17-Munoz-Friday-The-13th-JSON-Attacks-wp.pdf"
    context_awareness:
      surrounding_context_patterns:
        - 'JavaScriptSerializer'
        - 'SimpleTypeResolver'
        - 'JavaScriptTypeResolver'
        - 'Deserialize'
        - '__type'
      taint_source_indicators:
        - 'Request\.'
        - 'HttpContext'
        - 'Controller'
        - 'WebSocket'
      taint_sink_indicators:
        - '\.Deserialize\s*\('
        - '\.DeserializeObject\s*\('
        - 'JavaScriptSerializer'
      sanitization_patterns:
        - 'JsonSerializer'
        - 'System\.Text\.Json'
        - 'Newtonsoft.*TypeNameHandling\.None'
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 + type_resolver_present)"
      exploitability_score: "Critical"
    exploit_scenario:
      attack_example: |
        An attacker exploits JavaScriptSerializer with SimpleTypeResolver:
        1. ASP.NET API endpoint deserializes JSON using JavaScriptSerializer(new SimpleTypeResolver())
        2. Attacker crafts JSON with __type pointing to ObjectDataProvider
        3. ObjectDataProvider's ObjectInstance set to Process, MethodName to Start
        4. JSON payload triggers Process.Start with attacker-controlled arguments
        5. Remote code execution achieved, reverse shell established
      example_payload: '{"__type":"System.Windows.Data.ObjectDataProvider,...","ObjectInstance":{"__type":"System.Diagnostics.Process,..."}}'
      attacker_objective: "Execute arbitrary code via JavaScriptSerializer type confusion with SimpleTypeResolver"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2026-02-28"
      rule_maturity_level: "hardened"
      detection_complexity: "low"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-CS-001"
        - "DESER-CS-003"

  # --------------------------------------------------------------------------
  # DESER-CS-003: Newtonsoft Json.NET TypeNameHandling
  # --------------------------------------------------------------------------
  - rule_id: "DESER-CS-003"
    title: "Newtonsoft Json.NET with Unsafe TypeNameHandling"
    description: >
      Detects Newtonsoft Json.NET (Json.NET) configured with TypeNameHandling set
      to anything other than None. TypeNameHandling.Auto, Objects, Arrays, or All
      causes Json.NET to read $type metadata from JSON payloads and instantiate
      the specified types. This enables deserialization attacks using gadget chains
      via ysoserial.net payloads. Even TypeNameHandling.Auto is unsafe because
      it processes $type for object, dynamic, and interface-typed properties.
      The default is TypeNameHandling.None which is safe.
    language: csharp
    category: deserialization
    severity: Critical
    confidence: 0.95
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - rce
      - json.net
      - newtonsoft
      - TypeNameHandling
      - json
      - dotnet
      - csharp
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'TypeNameHandling\s*=\s*TypeNameHandling\.(?:All|Auto|Objects|Arrays)'
        description: "TypeNameHandling set to unsafe value"
      - type: regex
        pattern: 'TypeNameHandling\.(?:All|Auto|Objects|Arrays)'
        description: "Unsafe TypeNameHandling enum reference"
      - type: regex
        pattern: 'JsonSerializerSettings[\s\S]{0,300}TypeNameHandling\s*=\s*TypeNameHandling\.(?:All|Auto|Objects|Arrays)'
        description: "JsonSerializerSettings with unsafe TypeNameHandling"
      - type: regex
        pattern: 'JsonConvert\.DeserializeObject[\s\S]{0,200}TypeNameHandling'
        description: "JsonConvert.DeserializeObject with TypeNameHandling in settings"
      - type: regex
        pattern: '\[JsonProperty\s*\([^)]*TypeNameHandling\s*=\s*TypeNameHandling\.(?:All|Auto|Objects|Arrays)'
        description: "JsonProperty attribute with unsafe TypeNameHandling"
      - type: regex
        pattern: 'GlobalConfiguration[\s\S]{0,300}TypeNameHandling\s*=\s*TypeNameHandling\.(?:All|Auto)'
        description: "Global ASP.NET configuration with unsafe TypeNameHandling"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - 'TypeNameHandling\.None'
      - 'TypeNameHandling\s*=\s*TypeNameHandling\.None'
      - 'mock'
      - 'fixture'
      - 'example'
      - 'SerializationBinder'
      - 'ISerializationBinder'
    bypass_variants:
      - description: "TypeNameHandling set via integer enum value"
        pattern: 'TypeNameHandling\s*=\s*\(TypeNameHandling\)\s*[1-4]'
      - description: "TypeNameHandling in global JSON settings"
        pattern: 'JsonConvert\.DefaultSettings[\s\S]{0,300}TypeNameHandling'
      - description: "Custom ContractResolver with type handling"
        pattern: 'ContractResolver[\s\S]{0,300}TypeNameHandling'
      - description: "TypeNameHandling from configuration"
        pattern: 'Configuration\[\s*"[^"]*TypeNameHandling[^"]*"\s*\]'
    evasion_indicators:
      - "TypeNameHandling set via integer cast instead of enum"
      - "Global default settings affecting all serialization"
      - "TypeNameHandling configured in Startup.cs or Program.cs"
      - "Custom SerializationBinder may not fully prevent exploitation"
    encoding_variants:
      - type: "dollar_type"
        pattern: '\$type.*Newtonsoft'
      - type: "integer_enum"
        pattern: 'TypeNameHandling\s*=\s*\(TypeNameHandling\)\s*\d+'
      - type: "string_config"
        pattern: '"TypeNameHandling"\s*:\s*"(?:All|Auto|Objects|Arrays)"'
    multi_function_chain_patterns:
      - "Request.Body -> JsonConvert.DeserializeObject(body, settings{TypeNameHandling.All})"
      - "API endpoint -> JSON body with $type -> JsonConvert.DeserializeObject -> gadget chain"
      - "WebSocket message -> JsonSerializer.Deserialize(reader, settings) -> type instantiation"
      - "SignalR message -> Newtonsoft serializer with TypeNameHandling.Auto -> RCE"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "TypeNameHandling enables $type metadata processing for arbitrary type instantiation"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP_request_body"
        sink: "JsonConvert.DeserializeObject with TypeNameHandling"
        through: "JSON string with $type metadata"
      - source: "API_endpoint"
        sink: "JsonSerializer.Deserialize with unsafe settings"
        through: "request body deserialization"
      - source: "SignalR_message"
        sink: "Newtonsoft JsonSerializer with TypeNameHandling.Auto"
        through: "SignalR payload deserialization"
    impact: |
      Newtonsoft Json.NET with unsafe TypeNameHandling enables full RCE:
      - $type metadata in JSON controls type instantiation
      - Mature gadget chains available via ysoserial.net
      - TypeNameHandling.Auto still processes $type for object/dynamic properties
      - Global settings affect all deserialization in the application
      - Full system compromise with process privileges
    remediation: |
      Set TypeNameHandling to None (default) or use System.Text.Json:

      ```csharp
      // VULNERABLE: TypeNameHandling.All
      var settings = new JsonSerializerSettings
      {
          TypeNameHandling = TypeNameHandling.All
      };
      var obj = JsonConvert.DeserializeObject<MyType>(json, settings);

      // SECURE: TypeNameHandling.None (default)
      var obj = JsonConvert.DeserializeObject<MyType>(json);

      // SECURE: System.Text.Json (no $type support by default)
      var obj = System.Text.Json.JsonSerializer.Deserialize<MyType>(json);

      // If TypeNameHandling is needed, use strict SerializationBinder:
      var settings = new JsonSerializerSettings
      {
          TypeNameHandling = TypeNameHandling.Auto,
          SerializationBinder = new KnownTypesBinder(allowedTypes)
      };
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://www.newtonsoft.com/json/help/html/T_Newtonsoft_Json_TypeNameHandling.htm"
      - "https://github.com/pwntester/ysoserial.net"
      - "https://www.blackhat.com/docs/us-17/thursday/us-17-Munoz-Friday-The-13th-JSON-Attacks-wp.pdf"
    context_awareness:
      surrounding_context_patterns:
        - 'Newtonsoft'
        - 'Json\.NET'
        - 'JsonConvert'
        - 'JsonSerializer'
        - 'TypeNameHandling'
        - 'JsonSerializerSettings'
      taint_source_indicators:
        - 'Request\.'
        - 'HttpContext'
        - '@RequestBody'
        - 'SignalR'
      taint_sink_indicators:
        - 'DeserializeObject'
        - 'Deserialize'
        - 'JsonConvert'
        - 'JsonSerializer'
      sanitization_patterns:
        - 'TypeNameHandling\.None'
        - 'SerializationBinder'
        - 'ISerializationBinder'
        - 'System\.Text\.Json'
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 + type_handling_risk)"
      exploitability_score: "Critical"
    exploit_scenario:
      attack_example: |
        An attacker exploits TypeNameHandling.All in an ASP.NET Web API:
        1. API controller deserializes JSON with TypeNameHandling.All in global settings
        2. Attacker sends JSON with $type pointing to ObjectDataProvider
        3. $type metadata triggers instantiation of arbitrary .NET types
        4. Gadget chain (e.g., ObjectDataProvider -> Process.Start) executes
        5. Attacker achieves RCE and establishes reverse shell
      example_payload: '{"$type":"System.Windows.Data.ObjectDataProvider, ...","MethodName":"Start","ObjectInstance":{"$type":"System.Diagnostics.Process, ..."}}'
      attacker_objective: "Achieve RCE via Newtonsoft Json.NET $type metadata processing"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2026-02-28"
      rule_maturity_level: "hardened"
      detection_complexity: "low"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-CS-001"
        - "DESER-CS-002"

  # --------------------------------------------------------------------------
  # DESER-CS-004: SoapFormatter Deserialization
  # --------------------------------------------------------------------------
  - rule_id: "DESER-CS-004"
    title: "SoapFormatter Deserialization of Untrusted Data"
    description: >
      Detects usage of SoapFormatter.Deserialize() which, like BinaryFormatter,
      resolves arbitrary types during deserialization. SoapFormatter serializes
      objects as SOAP XML and is vulnerable to the same gadget chain attacks.
      It is commonly found in legacy .NET Framework applications using SOAP-based
      web services, remoting, or XML-based inter-process communication. SoapFormatter
      has been deprecated alongside BinaryFormatter.
    language: csharp
    category: deserialization
    severity: High
    confidence: 0.95
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - rce
      - SoapFormatter
      - soap
      - xml
      - dotnet
      - csharp
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+SoapFormatter\s*\(\s*\)'
        description: "SoapFormatter constructor instantiation"
      - type: regex
        pattern: 'SoapFormatter\s*\(\s*\)[\s\S]{0,300}\.Deserialize\s*\('
        description: "SoapFormatter followed by Deserialize call"
      - type: regex
        pattern: 'SoapFormatter\s+\w+\s*=\s*new\s+SoapFormatter'
        description: "SoapFormatter variable assignment"
      - type: regex
        pattern: 'IFormatter\s+\w+\s*=\s*new\s+SoapFormatter'
        description: "SoapFormatter assigned to IFormatter interface"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '\.Serialize\s*\('
      - 'mock'
      - 'fixture'
      - 'example'
      - '\[Obsolete\]'
    bypass_variants:
      - description: "SoapFormatter via IFormatter interface"
