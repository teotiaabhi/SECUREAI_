  # --------------------------------------------------------------------------
  # DESER-CS-005: NetDataContractSerializer
  # --------------------------------------------------------------------------
  - rule_id: "DESER-CS-005"
    title: "NetDataContractSerializer Deserialization of Untrusted Data"
    description: >
      Detects usage of NetDataContractSerializer which embeds .NET type information
      in the serialized XML output. Unlike DataContractSerializer which uses known
      types, NetDataContractSerializer resolves types from the serialized data,
      making it vulnerable to the same deserialization attacks as BinaryFormatter.
      Attackers can craft XML payloads with malicious type references to trigger
      RCE via ysoserial.net gadget chains.
    language: csharp
    category: deserialization
    severity: High
    confidence: 0.94
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - rce
      - NetDataContractSerializer
      - xml
      - wcf
      - dotnet
      - csharp
      - critical
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+NetDataContractSerializer\s*\(\s*\)'
        description: "NetDataContractSerializer constructor"
      - type: regex
        pattern: 'NetDataContractSerializer[\s\S]{0,300}\.(?:ReadObject|Deserialize)\s*\('
        description: "NetDataContractSerializer ReadObject or Deserialize"
      - type: regex
        pattern: 'NetDataContractSerializer\s+\w+\s*=\s*new\s+NetDataContractSerializer'
        description: "NetDataContractSerializer variable assignment"
      - type: regex
        pattern: 'IFormatter\s+\w+\s*=\s*new\s+NetDataContractSerializer'
        description: "NetDataContractSerializer as IFormatter"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - '\.WriteObject\s*\('
      - 'mock'
      - 'fixture'
      - 'example'
      - 'DataContractSerializer(?!.*Net)'
    bypass_variants:
      - description: "NetDataContractSerializer via interface"
        pattern: 'IFormatter[\s\S]{0,100}NetDataContractSerializer'
      - description: "Used in WCF service configuration"
        pattern: 'DataContractFormat[\s\S]{0,200}NetDataContractSerializer'
      - description: "Custom DataContractResolver enabling type resolution"
        pattern: 'DataContractResolver[\s\S]{0,300}NetDataContractSerializer'
    evasion_indicators:
      - "NetDataContractSerializer accessed via IFormatter"
      - "Used in WCF service bindings"
      - "Custom DataContractResolver for type resolution"
      - "Loaded dynamically via reflection"
    encoding_variants:
      - type: "xml_payload"
        pattern: 'z:Type=.*z:Assembly=.*NetDataContractSerializer'
      - type: "base64_xml"
        pattern: 'Convert\.FromBase64String[\s\S]{0,200}NetDataContractSerializer'
      - type: "stream_wrap"
        pattern: 'XmlReader[\s\S]{0,200}NetDataContractSerializer[\s\S]{0,100}ReadObject'
    multi_function_chain_patterns:
      - "WCF request -> XmlReader -> NetDataContractSerializer.ReadObject -> type instantiation"
      - "Request body -> MemoryStream -> NetDataContractSerializer.Deserialize -> RCE"
      - "XML file -> XmlReader -> NetDataContractSerializer.ReadObject -> gadget chain"
      - "Message body -> NetDataContractSerializer.ReadObject -> command execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "NetDataContractSerializer embeds full .NET type info enabling arbitrary type instantiation"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "WCF_request"
        sink: "NetDataContractSerializer.ReadObject(reader)"
        through: "WCF message to XML reader"
      - source: "request_body"
        sink: "NetDataContractSerializer.Deserialize(stream)"
        through: "HTTP body to memory stream"
      - source: "xml_file"
        sink: "NetDataContractSerializer.ReadObject(xmlReader)"
        through: "file to XmlReader"
    impact: |
      NetDataContractSerializer is as dangerous as BinaryFormatter for deserialization:
      - Embeds full .NET type information (assembly-qualified names) in XML
      - Same ysoserial.net gadget chains achieve RCE
      - Found in WCF services and inter-process communication
      - Full system compromise with process privileges
    remediation: |
      Replace with DataContractSerializer (known types only):

      ```csharp
      // VULNERABLE: NetDataContractSerializer
      var serializer = new NetDataContractSerializer();
      var obj = serializer.ReadObject(xmlReader);

      // SECURE: DataContractSerializer with known types
      var serializer = new DataContractSerializer(typeof(MyType),
          new DataContractSerializerSettings
          {
              KnownTypes = new[] { typeof(AllowedType1), typeof(AllowedType2) }
          });
      var obj = (MyType)serializer.ReadObject(xmlReader);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://learn.microsoft.com/en-us/dotnet/api/system.runtime.serialization.netdatacontractserializer"
      - "https://github.com/pwntester/ysoserial.net"
    context_awareness:
      surrounding_context_patterns:
        - 'NetDataContractSerializer'
        - 'ReadObject'
        - 'WCF'
        - 'IFormatter'
        - 'DataContract'
      taint_source_indicators:
        - 'Request\.'
        - 'XmlReader'
        - 'WCF'
        - 'Message'
      taint_sink_indicators:
        - '\.ReadObject\s*\('
        - '\.Deserialize\s*\('
        - 'NetDataContractSerializer'
      sanitization_patterns:
        - 'DataContractSerializer'
        - 'known.*types'
        - 'KnownTypes'
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 + wcf_exposure)"
      exploitability_score: "Critical"
    exploit_scenario:
      attack_example: |
        Attacker exploits NetDataContractSerializer in a WCF service:
        1. WCF service uses NetDataContractSerializer for message deserialization
        2. Attacker crafts XML payload with z:Type and z:Assembly pointing to gadget chain types
        3. NetDataContractSerializer resolves types from the XML and instantiates them
        4. Gadget chain triggers Process.Start for arbitrary command execution
        5. Attacker achieves RCE on the WCF service host
      example_payload: "new NetDataContractSerializer().ReadObject(xmlReader)"
      attacker_objective: "Achieve RCE via NetDataContractSerializer type resolution from malicious XML"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
