    description: >
      Detects DataContractJsonSerializer configured with known types that include
      dangerous base types like System.Object, System.IO.FileInfo, or types from
      System.Diagnostics. While DataContractJsonSerializer is safer than
      BinaryFormatter because it requires known types, overly permissive known type
      lists (especially including System.Object) can enable type confusion attacks.
      The __type metadata in JSON controls which known type is instantiated, and
      dangerous types in the list can be exploited for information disclosure or
      limited code execution.
    language: csharp
    category: deserialization
    severity: High
    confidence: 0.82
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - DataContractJsonSerializer
      - known-types
      - json
      - type-confusion
      - dotnet
      - csharp
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+DataContractJsonSerializer\s*\(\s*typeof\s*\(\s*object\s*\)'
        description: "DataContractJsonSerializer with System.Object as root type"
      - type: regex
        pattern: 'DataContractJsonSerializer[\s\S]{0,300}typeof\s*\(\s*(?:object|Object|System\.Object)\s*\)'
        description: "DataContractJsonSerializer with Object known type"
      - type: regex
        pattern: '\[KnownType\s*\(\s*typeof\s*\(\s*(?:object|Object|System\.Object)\s*\)\s*\)\]'
        description: "KnownType attribute with System.Object"
      - type: regex
        pattern: 'DataContractJsonSerializer[\s\S]{0,300}\.ReadObject\s*\(\s*(?:stream|request|input|body|data)'
        description: "DataContractJsonSerializer.ReadObject with potentially untrusted input"
      - type: regex
        pattern: 'DataContractJsonSerializerSettings[\s\S]{0,200}KnownTypes\s*=[\s\S]{0,200}typeof\s*\(\s*object\s*\)'
        description: "DataContractJsonSerializerSettings with Object known type"
    anti_patterns:
      - 'Test\.cs$'
      - 'Tests\.cs$'
      - 'test/'
      - 'tests/'
      - '//\s*nosec'
      - 'WriteObject'
      - 'mock'
      - 'fixture'
      - 'typeof\s*\(\s*(?!object|Object)[A-Z][a-zA-Z]+\s*\)'
    bypass_variants:
      - description: "Known types list built dynamically"
        pattern: 'DataContractJsonSerializer[\s\S]{0,200}knownTypes[\s\S]{0,200}Assembly\.GetTypes'
      - description: "Known types from configuration"
        pattern: 'Configuration[\s\S]{0,200}KnownTypes[\s\S]{0,200}DataContractJsonSerializer'
      - description: "Reflection-based known type discovery"
        pattern: 'AppDomain\.CurrentDomain\.GetAssemblies[\s\S]{0,300}DataContractJsonSerializer'
    evasion_indicators:
      - "Known types built from assembly scanning"
      - "Configuration-driven known type lists"
      - "Overly broad known type declarations"
      - "System.Object or interface types as root type"
    encoding_variants:
      - type: "type_hint"
        pattern: '__type.*DataContractJsonSerializer'
      - type: "assembly_scan"
        pattern: 'GetTypes[\s\S]{0,200}DataContractJsonSerializer'
      - type: "config_types"
        pattern: 'Configuration[\s\S]{0,200}Type\.GetType[\s\S]{0,200}DataContractJsonSerializer'
    multi_function_chain_patterns:
      - "Request.Body -> DataContractJsonSerializer(typeof(object)).ReadObject -> type confusion"
      - "API endpoint -> JSON body with __type -> DataContractJsonSerializer.ReadObject"
      - "Assembly.GetTypes -> known types list -> DataContractJsonSerializer -> ReadObject"
      - "Configuration -> known types -> DataContractJsonSerializer -> deserialization"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Overly permissive known types enables type confusion and potential code execution"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP_request_body"
        sink: "DataContractJsonSerializer.ReadObject(stream)"
        through: "JSON with __type metadata"
      - source: "API_endpoint"
        sink: "DataContractJsonSerializer(typeof(object)).ReadObject"
        through: "request body with type hint"
      - source: "message_body"
        sink: "DataContractJsonSerializer.ReadObject(reader)"
        through: "message to XML reader"
    impact: |
      DataContractJsonSerializer with dangerous known types:
      - typeof(object) as root type allows any known type instantiation
      - __type metadata controls type selection among known types
      - Overly broad known type lists may include exploitable types
      - Type confusion can lead to information disclosure
      - In specific configurations, limited code execution is possible
    remediation: |
      Use strict known type lists with DataContractJsonSerializer:

      ```csharp
      // VULNERABLE: System.Object as root type
      var serializer = new DataContractJsonSerializer(typeof(object));

      // SECURE: Specific concrete type
      var serializer = new DataContractJsonSerializer(typeof(MyType));

      // SECURE: Limited known types list
      var serializer = new DataContractJsonSerializer(typeof(MyType),
          new DataContractJsonSerializerSettings
          {
              KnownTypes = new[] { typeof(AllowedType1), typeof(AllowedType2) }
          });

      // BETTER: Use System.Text.Json
      var obj = JsonSerializer.Deserialize<MyType>(json);
      ```
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://learn.microsoft.com/en-us/dotnet/api/system.runtime.serialization.json.datacontractjsonserializer"
      - "https://learn.microsoft.com/en-us/dotnet/framework/wcf/feature-details/stand-alone-json-serialization"
    context_awareness:
      surrounding_context_patterns:
        - 'DataContractJsonSerializer'
        - 'ReadObject'
        - 'KnownType'
        - 'typeof'
        - '__type'
      taint_source_indicators:
        - 'Request\.'
        - 'HttpContext'
        - 'Stream'
        - 'XmlReader'
      taint_sink_indicators:
        - '\.ReadObject\s*\('
        - 'DataContractJsonSerializer'
      sanitization_patterns:
        - 'typeof\s*\(\s*(?!object)[A-Z]'
        - 'System\.Text\.Json'
        - 'JsonSerializer'
    severity_scoring:
      severity_weight: 7
      risk_score_formula_hint: "severity_weight * confidence * (1 + known_type_breadth)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        Attacker exploits overly permissive DataContractJsonSerializer:
        1. WCF API uses DataContractJsonSerializer(typeof(object)) for polymorphic deserialization
        2. Known types include System.Object and various framework types
        3. Attacker sends JSON with __type pointing to a dangerous known type
        4. DataContractJsonSerializer instantiates the type and populates properties
        5. Depending on available known types, attacker achieves info disclosure or DoS
      example_payload: '{"__type":"SomeType:#Namespace","Property":"malicious_value"}'
      attacker_objective: "Exploit overly permissive known types for type confusion attacks"
    confidence_factors:
      pattern_strength: "medium"
      context_match: "high"
      proximity_to_user_input: "medium"
      sanitization_absence: "high"
