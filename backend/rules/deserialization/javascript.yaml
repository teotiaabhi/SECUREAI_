  # ============================================================================
  # DESER-JS-007: Express body-parser Type Confusion
  # ============================================================================
  - rule_id: "DESER-JS-007"
    title: "Express body-parser Type Confusion via Content-Type Manipulation"
    description: >
      Detects misconfigurations in Express.js body-parser middleware that
      allow type confusion attacks. When body-parser is configured to handle
      multiple content types without strict type checking, an attacker can
      send a request with a manipulated Content-Type header to have the body
      parsed differently than expected. This can lead to prototype pollution
      when the JSON parser processes a body the application expects to be
      URL-encoded, or bypass input validation when an object structure is
      injected where a flat key-value pair was expected.
    language: javascript
    category: deserialization
    severity: High
    confidence: 0.85
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - express
      - body-parser
      - type-confusion
      - content-type
      - middleware
      - node
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'app\.use\s*\(\s*bodyParser\.json\s*\(\s*\{[^}]*type\s*:\s*["\x27]\*'
        description: "body-parser JSON middleware accepting all content types"
      - type: regex
        pattern: 'express\.json\s*\(\s*\{[^}]*strict\s*:\s*false'
        description: "Express JSON parser with strict mode disabled allowing primitives"
      - type: regex
        pattern: 'bodyParser\.(json|urlencoded|raw|text)\s*\(\s*\{[^}]*type\s*:\s*["\x27]\*\/\*["\x27]'
        description: "body-parser accepting wildcard content type"
      - type: regex
        pattern: 'app\.use\s*\(\s*bodyParser\.json\s*\(\s*\)\s*\)\s*;\s*app\.use\s*\(\s*bodyParser\.urlencoded'
        description: "Both JSON and URL-encoded parsers enabled without type restriction"
      - type: regex
        pattern: 'bodyParser\.json\s*\(\s*\{[^}]*reviver\s*:'
        description: "Custom JSON reviver function that may introduce unsafe transformations"
      - type: regex
        pattern: 'app\.use\s*\(\s*express\.json\s*\(\s*\{[^}]*type\s*:\s*function'
        description: "Custom type detection function for JSON parsing"
      - type: regex
        pattern: 'bodyParser\.raw\s*\(\s*\{[^}]*type\s*:\s*["\x27]application\/json["\x27]'
        description: "Raw parser configured for JSON type leading to manual parsing"
      - type: regex
        pattern: 'JSON\.parse\s*\(\s*req\.body\s*\).*bodyParser\.text'
        description: "Manual JSON.parse on text-parsed body without type safety"
    anti_patterns:
      - 'bodyParser\.json\s*\(\s*\{[^}]*type\s*:\s*["\x27]application\/json["\x27]'
      - 'express\.json\s*\(\s*\{[^}]*strict\s*:\s*true'
      - 'bodyParser\.json\s*\(\s*\{[^}]*type\s*:\s*["\x27]application\/[^*]'
      - '\/\/\s*test'
      - 'app\.use\s*\(\s*bodyParser\.json\s*\(\s*\)\s*\)\s*$'
      - 'helmet\s*\(\s*\)'
      - 'express-validator'
      - 'joi\.validate'
      - 'celebrate\s*\('
      - 'ajv\.validate'
      - 'zod\.parse'
      - 'yup\.validate'
      - 'class-validator'
      - 'content-type.*check'
      - 'req\.is\s*\(\s*["\x27]json["\x27]\s*\)'
    bypass_variants:
      - description: "Send JSON body with application/x-www-form-urlencoded Content-Type"
        pattern: 'Content-Type\s*:\s*application\/x-www-form-urlencoded.*\{"__proto__"'
      - description: "Use charset parameter to influence parsing behavior"
        pattern: 'Content-Type\s*:.*charset\s*=\s*(utf-7|utf7|unicode-1-1-utf-7)'
      - description: "Exploit body-parser limit difference between parsers"
        pattern: 'bodyParser\.json\s*\(\s*\{[^}]*limit\s*:\s*["\x27]\d+mb["\x27].*bodyParser\.urlencoded\s*\(\s*\{[^}]*limit\s*:\s*["\x27]\d+kb["\x27]'
    evasion_indicators:
      - "Content-Type header manipulation to force different parser"
      - "Charset encoding tricks to bypass JSON validation"
      - "Multiple body-parser instances with overlapping type handling"
      - "Custom type function with permissive matching"
      - "Transfer-Encoding chunked with mixed content types"
    encoding_variants:
      - type: "charset_confusion"
        pattern: 'Content-Type\s*:.*charset\s*=\s*(utf-7|utf-16|utf-32)'
      - type: "multipart_bypass"
        pattern: 'Content-Type\s*:\s*multipart\/form-data.*boundary'
      - type: "content_type_params"
        pattern: 'Content-Type\s*:\s*application\/json\s*;\s*\w+='
    multi_function_chain_patterns:
      - "Content-Type manipulation -> JSON parser -> prototype pollution -> auth bypass"
      - "URL-encoded body -> JSON reparse -> type confusion -> SQL injection"
      - "Raw body -> manual parse -> missing validation -> business logic bypass"
      - "Text body -> JSON.parse -> schema bypass -> data corruption"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Type confusion through Content-Type manipulation can bypass input validation to inject object structures where scalar values are expected"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP request with manipulated Content-Type"
        sink: "body-parser middleware"
        through: "Express middleware chain"
      - source: "JSON body with form Content-Type"
        sink: "URL-encoded parser -> req.body"
        through: "Content-Type mismatch"
      - source: "Nested object in URL-encoded body"
        sink: "Application logic expecting flat object"
        through: "qs parser extended mode"
    impact: |
      Body-parser type confusion can lead to:
      - Prototype pollution through Content-Type manipulation
      - Input validation bypass via unexpected object structures
      - SQL injection through type confusion in query builders
      - Authentication bypass by injecting object where string expected
      - Mass assignment vulnerabilities through nested object injection
    remediation: |
      1. Explicitly set content type for each parser:
         ```javascript
         app.use(express.json({ type: 'application/json', strict: true }));
         app.use(express.urlencoded({ extended: false, type: 'application/x-www-form-urlencoded' }));
         ```
      2. Validate Content-Type in route handlers:
         ```javascript
         app.post('/api/data', (req, res) => {
           if (!req.is('application/json')) {
             return res.status(415).json({ error: 'Unsupported Media Type' });
           }
           // Process request
         });
         ```
      3. Use schema validation (Joi, Zod, Ajv) on parsed body.
      4. Disable extended URL-encoded parsing: `extended: false`.
      5. Set appropriate body size limits per parser.
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://expressjs.com/en/resources/middleware/body-parser.html"
      - "https://github.com/expressjs/body-parser/issues/347"
    context_awareness:
      surrounding_context_patterns:
        - "Multiple body-parser middleware registrations"
        - "No Content-Type validation in route handlers"
        - "Wildcard or function-based type configuration"
        - "Missing input schema validation"
      taint_source_indicators:
        - "req.body"
        - "req.query"
        - "Content-Type header"
        - "req.headers['content-type']"
      taint_sink_indicators:
        - "Database query with req.body values"
        - "Object.assign with req.body"
        - "Spread operator on req.body"
        - "Direct property access on req.body without type check"
      sanitization_patterns:
        - "req.is('json') check"
        - "Schema validation with Joi/Zod/Ajv"
        - "Type checking on req.body properties"
        - "express-validator middleware"
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (wildcard_type ? 1.3 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        An Express application uses both bodyParser.json() and
        bodyParser.urlencoded({ extended: true }) without restricting
        content types. A login endpoint expects URL-encoded username and
        password fields. An attacker sends a request with Content-Type:
        application/json and body {"username": {"$gt": ""}, "password":
        {"$gt": ""}}. The JSON parser processes this into objects instead
        of strings. When these objects are passed to a MongoDB query, they
        become NoSQL injection operators, bypassing authentication.
      example_payload: '{"username": {"$gt": ""}, "password": {"$gt": ""}}'
      attacker_objective: "Exploit type confusion between parsers to inject object structures that bypass input validation"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-JS-001"
        - "DESER-JS-008"

  # ============================================================================
  # DESER-JS-008: GraphQL Custom Scalar Deserialization
  # ============================================================================
  - rule_id: "DESER-JS-008"
    title: "GraphQL Custom Scalar Deserialization Enabling Injection Attacks"
    description: >
      Detects unsafe custom scalar type implementations in GraphQL schemas
      where the parseValue or parseLiteral functions deserialize user input
      without proper validation. Custom scalars in GraphQL (such as JSON,
      DateTime, Upload, or custom domain types) use parseValue to process
      variable values and parseLiteral to process inline values. If these
      functions perform unsafe operations like JSON.parse without schema
      validation, eval, or dynamic type instantiation, an attacker can
      inject malicious payloads through GraphQL variables or inline values.
    language: javascript
    category: deserialization
    severity: High
    confidence: 0.82
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - graphql
      - custom-scalar
      - type-coercion
      - injection
      - schema
      - api
    detection_layer: 3
    attack_surface_type: "api"
    patterns:
      - type: regex
        pattern: 'new\s+GraphQLScalarType\s*\(\s*\{[^}]*parseValue\s*:'
        description: "Custom GraphQL scalar type with parseValue implementation"
      - type: regex
        pattern: 'parseValue\s*:\s*\(?[^)]*\)?\s*=>\s*JSON\.parse\s*\('
        description: "parseValue using JSON.parse on user input"
      - type: regex
        pattern: 'parseLiteral\s*:\s*\(?[^)]*\)?\s*=>\s*(eval|Function)\s*\('
        description: "parseLiteral using eval or Function constructor"
      - type: regex
        pattern: 'parseValue\s*:\s*\(?[^)]*\)?\s*=>\s*\w+\.deserialize\s*\('
        description: "parseValue delegating to a deserialization function"
      - type: regex
        pattern: 'GraphQLJSON|graphql-type-json'
        description: "Usage of GraphQL JSON scalar type allowing arbitrary JSON"
      - type: regex
        pattern: 'parseValue\s*:\s*\(?[^)]*\)?\s*=>\s*yaml\.load\s*\('
        description: "parseValue using yaml.load on variable input"
      - type: regex
        pattern: 'parseValue\s*:\s*\(?[^)]*\)?\s*=>\s*new\s+\w+\s*\('
        description: "parseValue constructing objects from user-controlled input"
      - type: regex
        pattern: 'parseLiteral\s*:\s*(function|.+=>\s*)\s*\{[^}]*JSON\.parse\s*\('
        description: "parseLiteral performing JSON.parse on AST value"
    anti_patterns:
      - 'parseValue\s*:.*typeof\s+\w+\s*[!=]==\s*["\x27]string["\x27]'
      - 'parseValue\s*:.*validate\s*\('
      - 'parseValue\s*:.*schema\.'
      - 'parseValue\s*:.*Number\s*\('
      - 'parseValue\s*:.*parseInt\s*\('
      - 'parseValue\s*:.*new\s+Date\s*\('
      - 'parseValue\s*:.*moment\s*\('
      - '\/\/\s*test'
      - 'parseValue\s*:.*sanitize'
      - 'parseValue\s*:.*isValid'
      - 'parseValue\s*:.*assert'
      - 'parseLiteral\s*:.*Kind\.(INT|FLOAT|STRING|BOOLEAN)'
      - 'graphql-scalars'
    bypass_variants:
      - description: "JSON scalar allowing prototype pollution via GraphQL variables"
        pattern: 'GraphQLJSON.*parseValue\s*:\s*\(?value\)?\s*=>\s*value'
      - description: "Custom scalar with permissive parseLiteral accepting any AST node"
        pattern: 'parseLiteral\s*:\s*\(?ast\)?\s*=>\s*ast\.value'
      - description: "Scalar coercion chain through multiple custom types"
        pattern: 'serialize\s*:\s*\(?[^)]*\)?\s*=>\s*[^,}]+,\s*parseValue\s*:\s*\(?[^)]*\)?\s*=>\s*JSON\.parse'
    evasion_indicators:
      - "Custom scalar accepting arbitrary JSON objects as values"
      - "parseLiteral accepting ObjectValue AST nodes without field validation"
      - "Scalar type used in mutation input without deeper validation"
      - "Custom directive modifying scalar coercion behavior"
    encoding_variants:
      - type: "graphql_variable"
        pattern: 'variables\s*:\s*\{[^}]*"\w+"\s*:\s*\{.*__proto__'
      - type: "inline_value"
        pattern: 'mutation\s*\{[^}]*\(\s*input\s*:\s*\{.*__proto__'
      - type: "base64_in_scalar"
        pattern: 'parseValue\s*:.*Buffer\.from\s*\([^)]+,\s*["\x27]base64["\x27]\s*\)'
    multi_function_chain_patterns:
      - "GraphQL query -> custom scalar parseValue -> JSON.parse -> prototype pollution"
      - "Mutation variable -> scalar coercion -> object construction -> database insert"
      - "Subscription payload -> scalar deserialization -> event processing"
      - "Federation subgraph -> custom scalar -> cross-service type confusion"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Custom scalar deserialization can inject malicious objects into GraphQL resolver context, bypassing field-level authorization directives"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "GraphQL query variables"
        sink: "Custom scalar parseValue function"
        through: "GraphQL execution engine type coercion"
      - source: "GraphQL mutation inline arguments"
        sink: "Custom scalar parseLiteral function"
        through: "AST value extraction"
      - source: "GraphQL subscription payload"
        sink: "Custom scalar serialize function"
        through: "PubSub message deserialization"
    impact: |
      Unsafe GraphQL scalar deserialization can lead to:
      - Prototype pollution through JSON scalar types accepting arbitrary objects
      - Injection attacks via unvalidated scalar values reaching resolvers
      - Type confusion in downstream data processing
      - Authorization bypass through crafted scalar values
      - Cross-service attacks in federated GraphQL architectures
    remediation: |
      1. Validate all inputs in custom scalar parseValue:
         ```javascript
         const SafeJSONScalar = new GraphQLScalarType({
           name: 'SafeJSON',
           parseValue(value) {
             if (typeof value !== 'object' || value === null) {
               throw new TypeError('Expected object value');
             }
             // Strip dangerous keys
             const clean = JSON.parse(JSON.stringify(value));
             delete clean.__proto__;
             delete clean.constructor;
             return clean;
           },
           parseLiteral(ast) {
             if (ast.kind !== Kind.OBJECT_VALUE) {
               throw new TypeError('Expected object literal');
             }
             return parseLiteralSafe(ast);
           }
         });
         ```
      2. Use graphql-scalars library for standard scalar types.
      3. Implement input validation in resolvers as defense-in-depth.
      4. Use GraphQL schema directives for input constraints.
      5. Avoid using the generic JSON scalar for typed data.
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://graphql.org/learn/schema/#scalar-types"
      - "https://the-guild.dev/graphql/scalars"
    context_awareness:
      surrounding_context_patterns:
        - "GraphQLScalarType definition in schema file"
        - "parseValue without validation logic"
        - "JSON.parse in scalar type processing"
        - "Scalar used in mutation input types"
      taint_source_indicators:
        - "GraphQL variables object"
        - "Inline GraphQL argument values"
        - "Subscription event payload"
        - "Apollo Server context"
      taint_sink_indicators:
        - "parseValue return value used in resolver"
        - "Database query with scalar-parsed value"
        - "Object spread from scalar result"
        - "Event emission with scalar-parsed data"
      sanitization_patterns:
        - "Type checking in parseValue"
        - "Schema validation on parsed result"
        - "Whitelist-based key filtering"
        - "AST kind checking in parseLiteral"
    severity_scoring:
      severity_weight: 7
      risk_score_formula_hint: "severity_weight * confidence * (json_scalar_used ? 1.3 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A GraphQL API uses a custom JSON scalar type for flexible input in
        a mutation that updates user preferences. The parseValue function
        simply returns the input value without validation:
        parseValue: (value) => value
        An attacker sends a mutation with a variable containing:
        {"preferences": {"__proto__": {"isAdmin": true}}}
        The scalar passes this through to the resolver, which spreads it
        into the user object. Object.prototype is polluted, and all
        subsequent authorization checks that look for user.isAdmin find
        true, granting admin access to the attacker.
      example_payload: '{"__proto__": {"isAdmin": true, "role": "admin"}}'
      attacker_objective: "Inject malicious objects through GraphQL custom scalar deserialization to achieve privilege escalation"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-JS-001"
        - "DESER-JS-007"
        - "DESER-JS-005"
