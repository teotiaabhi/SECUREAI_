  # ============================================================================
  # DESER-PHP-004: session_decode with Untrusted Data
  # ============================================================================
  - rule_id: "DESER-PHP-004"
    title: "session_decode with Untrusted Data Enabling Object Injection"
    description: >
      Detects usage of PHP's session_decode() function on untrusted data.
      session_decode() parses a session-encoded string (using PHP's session
      serialization format) and populates the $_SESSION superglobal. This
      function uses PHP's internal session serializer which handles object
      deserialization, meaning that crafted session data can instantiate
      arbitrary PHP objects with attacker-controlled properties. If an
      application calls session_decode on data from external sources,
      it creates an object injection vulnerability similar to unserialize.
    language: php
    category: deserialization
    severity: High
    confidence: 0.88
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - php
      - session
      - object-injection
      - session-decode
      - critical
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'session_decode\s*\(\s*\$_(GET|POST|REQUEST|COOKIE|SERVER)'
        description: "session_decode on superglobal data"
      - type: regex
        pattern: 'session_decode\s*\(\s*\$(data|input|payload|body|content|session_data|raw)'
        description: "session_decode on user-controlled variable"
      - type: regex
        pattern: 'session_decode\s*\(\s*base64_decode\s*\('
        description: "session_decode on base64-decoded data"
      - type: regex
        pattern: 'session_decode\s*\(\s*file_get_contents\s*\(\s*\$'
        description: "session_decode on file content with variable path"
      - type: regex
        pattern: 'session_decode\s*\(\s*hex2bin\s*\('
        description: "session_decode on hex-decoded data"
      - type: regex
        pattern: 'session\.serialize_handler\s*=\s*php_serialize'
        description: "PHP serialize session handler enabling injection via pipe character"
    anti_patterns:
      - 'session_decode\s*\(\s*session_encode\s*\('
      - 'session_decode\s*\(\s*["\x27]'
      - '\/\/\s*test'
      - 'mock.*session'
      - 'session_decode\s*\(\s*\$this->'
      - 'session_decode\s*\(\s*\$internal'
      - 'session_decode\s*\(\s*\$trusted'
      - 'session_decode.*hmac|hmac.*session_decode'
      - 'session_decode\s*\(\s*\$fixture'
      - 'session_decode\s*\(\s*\$config'
      - 'session_decode\s*\(\s*\$cached'
    bypass_variants:
      - description: "Session handler inconsistency between serialize and deserialize"
        pattern: 'session\.serialize_handler.*php_serialize.*session_decode'
      - description: "Session fixation combined with session_decode injection"
        pattern: 'session_id\s*\(\s*\$.*session_decode'
      - description: "Custom session save handler with deserialization"
        pattern: 'session_set_save_handler\s*\(.*read.*unserialize'
    evasion_indicators:
      - "Session serialization handler mismatch (php vs php_serialize)"
      - "Session data from external storage without validation"
      - "Base64 or hex-encoded session payload"
      - "Session fixation combined with crafted session data"
    encoding_variants:
      - type: "base64"
        pattern: 'session_decode\s*\(\s*base64_decode\s*\(\s*\$'
      - type: "hex"
        pattern: 'session_decode\s*\(\s*hex2bin\s*\(\s*\$'
      - type: "url_decoded"
        pattern: 'session_decode\s*\(\s*urldecode\s*\(\s*\$'
    multi_function_chain_patterns:
      - "Cookie value -> base64_decode -> session_decode -> $_SESSION pollution -> object injection"
      - "Database stored session -> session_decode -> object instantiation"
      - "Redis session data -> session_decode -> __wakeup trigger -> RCE"
      - "Session import feature -> session_decode -> arbitrary object creation"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "session_decode populates $_SESSION with deserialized objects, which may include gadget chain objects that execute code when their magic methods are called"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "HTTP request parameter / cookie"
        sink: "session_decode()"
        through: "Direct or decoded parameter"
      - source: "External session storage (Redis/Memcached/DB)"
        sink: "session_decode()"
        through: "Session read from compromised store"
      - source: "Session import/migration feature"
        sink: "session_decode()"
        through: "User-provided session data string"
    impact: |
      session_decode on untrusted data can lead to:
      - PHP object injection via session deserialization
      - Remote Code Execution through gadget chains in $_SESSION
      - Session hijacking and privilege escalation
      - Authentication bypass by injecting admin session data
      - Cross-user data leakage through session pollution
    remediation: |
      1. Never use session_decode on untrusted data:
         ```php
         // Bad: session_decode on user input
         session_decode($_POST['session_data']);

         // Good: use json_decode for data import
         $data = json_decode($_POST['session_data'], true);
         if (is_array($data)) {
             $_SESSION['imported'] = $data;
         }
         ```
      2. Use consistent session.serialize_handler across application.
      3. Implement session data validation in custom save handlers.
      4. Sign session data with HMAC before storage.
      5. Use PHP 7.0+ with allowed_classes for any deserialization.
    references:
      - "https://www.php.net/manual/en/function.session-decode.php"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - "session_decode call with variable argument"
        - "No HMAC verification before session_decode"
        - "Session serializer handler configuration"
        - "User input flowing into session_decode"
      taint_source_indicators:
        - "$_GET"
        - "$_POST"
        - "$_COOKIE"
        - "Database query result"
        - "Redis/Memcached get"
      taint_sink_indicators:
        - "session_decode()"
        - "$_SESSION population"
        - "session_set_save_handler read callback"
      sanitization_patterns:
        - "HMAC verification before decode"
        - "JSON-based session data handling"
        - "Input validation before session_decode"
        - "Consistent serialize_handler"
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (external_session_source ? 1.3 : 0.8)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A session migration tool accepts base64-encoded session data via a
        POST endpoint and calls session_decode(base64_decode($_POST['data']))
        to restore the session. An attacker crafts a session-encoded string
        containing a serialized object with a __wakeup method that executes
        shell commands. The session handler uses php_serialize format, so the
        attacker encodes: user|O:8:"Exploit":1:{s:3:"cmd";s:9:"id > /tmp/x";}
        When session_decode processes this, it instantiates the Exploit object
        and triggers __wakeup, executing the command.
      example_payload: "user|O:8:\"Exploit\":1:{s:3:\"cmd\";s:9:\"id > /tmp/x\";}"
      attacker_objective: "Inject malicious objects into PHP session through session_decode to achieve code execution via magic methods"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-PHP-001"
        - "DESER-PHP-006"

  # ============================================================================
  # DESER-PHP-005: Composer Autoloader Gadget Chains
  # ============================================================================
  - rule_id: "DESER-PHP-005"
    title: "Composer Autoloader Exploitation via Deserialization Gadget Chains"
    description: >
      Detects conditions where PHP deserialization occurs in applications
      using Composer autoloading, which dramatically expands the attack
      surface for gadget chain exploitation. When Composer autoloading is
      active (require 'vendor/autoload.php'), any class from any installed
      package can be instantiated during deserialization. This means gadget
      chains from popular packages like Monolog, Guzzle, Symfony, Doctrine,
      Laravel, and PHPUnit become available. The presence of both
      deserialization and Composer autoloading creates a high-risk
      combination for PHP object injection attacks.
    language: php
    category: deserialization
    severity: High
    confidence: 0.86
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - php
      - composer
      - autoloader
      - gadget-chain
      - supply-chain
      - monolog
      - guzzle
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'require.*vendor/autoload\.php.*unserialize'
        description: "Composer autoload combined with unserialize in same file"
      - type: regex
        pattern: 'unserialize\s*\([^)]*\)(?=.*require.*vendor/autoload)'
        description: "unserialize call in file that loads Composer autoloader"
      - type: regex
        pattern: '(monolog|guzzlehttp|symfony|doctrine|laravel).*unserialize'
        description: "Gadget chain library name near unserialize usage"
      - type: regex
        pattern: 'unserialize\s*\(\s*\$.*(?!allowed_classes)'
        description: "unserialize without allowed_classes in Composer project"
      - type: regex
        pattern: '"(monolog/monolog|guzzlehttp/guzzle|symfony/symfony|doctrine/orm)"'
        description: "Known gadget chain packages in composer.json"
      - type: regex
        pattern: '__wakeup|__destruct|__toString|__call'
        description: "Magic method definitions that may be gadget chain entry points"
    anti_patterns:
      - 'unserialize\s*\([^)]*allowed_classes["\x27]\s*=>\s*false'
      - 'unserialize\s*\([^)]*allowed_classes["\x27]\s*=>\s*\[\s*\]'
      - '\/\/\s*test'
      - 'mock.*unserialize'
      - 'json_decode.*instead.*unserialize'
      - 'unserialize.*deprecated'
      - 'unserialize.*internal.*only'
      - 'unserialize.*trusted'
      - 'unserialize.*signed'
      - 'unserialize.*hmac'
      - 'unserialize.*fixture'
      - 'unserialize.*test_data'
      - 'composer.*dev-only.*unserialize'
    bypass_variants:
      - description: "Monolog gadget chain through SyslogUdpHandler"
        pattern: 'Monolog\\\\Handler\\\\(SyslogUdpHandler|BufferHandler|StreamHandler)'
      - description: "Guzzle gadget chain through FnStream"
        pattern: 'GuzzleHttp\\\\Psr7\\\\(FnStream|AppendStream)'
      - description: "Symfony gadget chain through Process component"
        pattern: 'Symfony\\\\Component\\\\Process\\\\Process'
    evasion_indicators:
      - "Large vendor directory with many potential gadget libraries"
      - "Autoloader making all installed packages available for instantiation"
      - "No allowed_classes restriction on unserialize"
      - "Development dependencies accessible in production"
      - "PHPGGC-cataloged gadget chains in dependencies"
    encoding_variants:
      - type: "base64_gadget"
        pattern: 'base64_decode.*O:\d+:"(Monolog|Guzzle|Symfony|Doctrine)'
      - type: "hex_gadget"
        pattern: 'hex2bin.*4f3a\d+3a22(4d6f6e6f6c6f67|477a7a6c65)'
      - type: "serialized_chain"
        pattern: 'O:\d+:"[A-Z][a-zA-Z\\\\]+":\d+:\{.*O:\d+:"[A-Z]'
    multi_function_chain_patterns:
      - 'unserialize -> Monolog\Handler\BufferHandler.__destruct -> StreamHandler.write -> file write'
      - 'unserialize -> Guzzle\FnStream.__destruct -> call_user_func -> system()'
      - 'unserialize -> Symfony\Process.__destruct -> shell_exec -> RCE'
      - 'unserialize -> Doctrine\DBAL\Connection.__destruct -> query execution'
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Composer autoloading makes all installed package classes available for gadget chain exploitation, dramatically expanding the deserialization attack surface"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "User input (any source)"
        sink: "unserialize() with Composer autoloading active"
        through: "Any decode/parse function"
      - source: "HTTP request data"
        sink: "Object magic method (__destruct/__wakeup/__toString)"
        through: "unserialize -> Composer autoloaded class instantiation"
      - source: "Cookie/session data"
        sink: "Gadget chain entry point"
        through: "unserialize with vendor classes available"
    impact: |
      Composer autoloader exploitation through deserialization can lead to:
      - Remote Code Execution through dozens of known gadget chains
      - File system manipulation (read/write/delete)
      - SQL injection through ORM gadget chains
      - SSRF through HTTP client gadget chains
      - Complete server compromise via any of the 100+ PHPGGC chains
    remediation: |
      1. Use json_decode instead of unserialize for all user data.
      2. If unserialize is required, use strict allowed_classes:
         ```php
         $data = unserialize($input, ['allowed_classes' => false]);
         ```
      3. Remove development dependencies in production:
         ```bash
         composer install --no-dev --optimize-autoloader
         ```
      4. Use PHPGGC for security audit of installed packages:
         ```bash
         phpggc -l  # List available chains for installed packages
         ```
      5. Implement runtime deserialization monitoring.
    references:
      - "https://github.com/ambionics/phpggc"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://www.ambionics.io/blog/php-generic-gadget-chains"
    context_awareness:
      surrounding_context_patterns:
        - "Composer autoload.php require in bootstrap"
        - "unserialize call in application code"
        - "Known gadget chain packages in composer.json"
        - "No allowed_classes restriction"
      taint_source_indicators:
        - "Any user-controlled input"
        - "HTTP request data"
        - "Cookie values"
        - "Session data"
        - "File upload content"
      taint_sink_indicators:
        - "unserialize()"
        - "session_decode()"
        - "phar:// metadata deserialization"
        - "Magic method trigger"
      sanitization_patterns:
        - "allowed_classes => false"
        - "json_decode replacement"
        - "HMAC signed serialized data"
        - "composer install --no-dev"
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (gadget_chain_count * 0.1)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A PHP application using Composer has Monolog, Guzzle, and Symfony
        installed. An API endpoint calls unserialize($_POST['data']) without
        allowed_classes restriction. An attacker uses PHPGGC to generate a
        Monolog RCE chain:
        phpggc Monolog/RCE1 system 'id' -s
        This produces a serialized string that chains
        BufferHandler.__destruct -> StreamHandler.write -> system('id').
        The attacker sends the payload as POST data, achieving RCE.
      example_payload: "phpggc Monolog/RCE1 system 'id > /tmp/pwned' --base64"
      attacker_objective: "Exploit PHP object injection with Composer autoloader to leverage framework gadget chains for remote code execution"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-PHP-001"
        - "DESER-PHP-008"

  # ============================================================================
  # DESER-PHP-006: Laravel Queue Deserialization
  # ============================================================================
  - rule_id: "DESER-PHP-006"
    title: "Laravel Queue Job Deserialization Enabling Remote Code Execution"
    description: >
      Detects vulnerabilities in Laravel queue job deserialization where
      serialized job payloads from queue backends (Redis, SQS, Beanstalkd,
      database) are deserialized using PHP's unserialize. Laravel queue
      workers deserialize job payloads to reconstruct Eloquent models and
      job classes. If the queue backend is compromised (e.g., exposed Redis)
      or if job payloads can be tampered with, an attacker can inject
      malicious serialized objects that exploit gadget chains in Laravel's
      framework classes. CVE-2022-31279 demonstrated RCE through crafted
      queue payloads in Laravel.
    language: php
    category: deserialization
    severity: Critical
    confidence: 0.87
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - php
      - laravel
      - queue
      - redis
      - job
      - rce
      - framework
      - critical
    detection_layer: 2
    attack_surface_type: "internal"
    patterns:
      - type: regex
        pattern: 'Queue::push\s*\(\s*unserialize\s*\('
        description: "Queue push with unserialize in same call"
      - type: regex
        pattern: 'unserialize\s*\(\s*\$this->job->getRawBody'
        description: "Job body deserialization in queue worker"
      - type: regex
        pattern: 'QUEUE_CONNECTION\s*=\s*["\x27]redis["\x27]|QUEUE_DRIVER\s*=\s*["\x27]redis["\x27]'
        description: "Redis queue connection (commonly exposed)"
      - type: regex
        pattern: 'CallQueuedHandler|HandleQueuedCommand|Queue\\SerializesModels'
        description: "Laravel queue handling classes that use serialization"
      - type: regex
        pattern: 'SerializesModels|SerializesAndRestoresModelIdentifiers'
        description: "Laravel trait enabling model serialization in queue jobs"
      - type: regex
        pattern: 'dispatch\s*\(\s*unserialize\s*\('
        description: "Dispatching a deserialized job object"
      - type: regex
        pattern: 'Queue::(later|pushOn|bulk)\s*\('
        description: "Queue operations that serialize job payloads"
    anti_patterns:
      - 'QUEUE_CONNECTION\s*=\s*["\x27]sync["\x27]'
      - 'REDIS_PASSWORD\s*=\s*["\x27][^\x27"]{16,}'
      - '\/\/\s*test'
      - 'mock.*Queue'
      - 'Queue.*test'
      - 'Queue.*internal'
      - 'REDIS_HOST\s*=\s*["\x27](localhost|127\.0\.0\.1)["\x27]'
      - 'Queue.*signed'
      - 'Queue.*encrypted'
      - 'Queue.*hmac'
      - 'Queue.*validated'
    bypass_variants:
      - description: "Tampered Redis queue payload with gadget chain"
        pattern: 'redis-cli.*LPUSH.*queues.*O:\d+'
      - description: "Queue payload injection through exposed Redis"
        pattern: 'REDIS_HOST\s*=\s*["\x27]0\.0\.0\.0["\x27]|REDIS_HOST.*\$_ENV'
      - description: "Database queue with SQL injection for payload tampering"
        pattern: 'QUEUE_CONNECTION\s*=\s*["\x27]database["\x27].*jobs.*payload'
    evasion_indicators:
      - "Exposed Redis instance used for queue backend"
      - "Queue job payloads contain serialized PHP objects"
      - "No authentication on Redis queue connection"
      - "Database queue with injectable payload column"
      - "SQS queue with tampered message body"
    encoding_variants:
      - type: "json_wrapped_serialized"
        pattern: '"data"\s*:\s*\{[^}]*"command"\s*:\s*"O:\d+'
      - type: "base64_queue"
        pattern: '"command"\s*:\s*"[A-Za-z0-9+/=]+".*base64'
      - type: "compressed_queue"
        pattern: 'gzuncompress.*queue.*payload'
    multi_function_chain_patterns:
      - "Exposed Redis -> LPUSH queue payload -> queue worker -> unserialize -> RCE"
      - "SQL injection -> jobs table -> payload column -> queue worker -> deserialization"
      - "SQS message tampering -> queue worker -> unserialize -> gadget chain"
      - "Queue job serialization -> Redis pub/sub -> worker deserialization -> exploit"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Compromised queue backend (e.g., exposed Redis) allows injection of malicious serialized jobs that execute with the queue worker's privileges"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "Redis queue (if exposed)"
        sink: "Queue worker unserialize"
        through: "LPUSH to queue key"
      - source: "Database jobs table (if injectable)"
        sink: "Queue worker deserialization"
        through: "Payload column modification"
      - source: "SQS message"
        sink: "Laravel queue worker"
        through: "Message body with serialized command"
    impact: |
      Laravel queue deserialization exploitation can lead to:
      - Remote Code Execution on queue worker processes
      - Background job manipulation and injection
      - Data corruption through tampered job payloads
      - Privilege escalation via crafted job objects
      - Persistent backdoor through recurring malicious queue jobs
    remediation: |
      1. Secure Redis with authentication and network restrictions:
         ```env
         REDIS_PASSWORD=strong_random_password_here
         REDIS_HOST=127.0.0.1
         ```
      2. Use encrypted and signed queue payloads (Laravel 8+):
         ```php
         // In queue job class
         class ProcessPayment implements ShouldQueue, ShouldBeEncrypted
         {
             use SerializesModels;
         }
         ```
      3. Restrict network access to queue backends.
      4. Use database queue with parameterized queries.
      5. Implement queue job HMAC verification at the worker level.
    references:
      - "https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2022-31279"
      - "https://laravel.com/docs/queues"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - "Laravel queue configuration"
        - "Redis connection without authentication"
        - "SerializesModels trait usage"
        - "Queue worker processing serialized jobs"
      taint_source_indicators:
        - "Redis queue payload"
        - "Database jobs.payload column"
        - "SQS message body"
        - "Beanstalkd job data"
      taint_sink_indicators:
        - "Queue worker unserialize"
        - "CallQueuedHandler.call()"
        - "Job::dispatch()"
        - "SerializesModels restoration"
      sanitization_patterns:
        - "Redis authentication (requirepass)"
        - "ShouldBeEncrypted interface"
        - "Network segmentation for queue backend"
        - "Queue payload HMAC signing"
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (redis_exposed ? 1.5 : 0.7)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Laravel application uses Redis for queue processing. The Redis
        instance is accessible on the network without authentication. An
        attacker connects to Redis and pushes a crafted job payload to the
        queue:
        LPUSH queues:default '{"job":"Illuminate\\Queue\\CallQueuedHandler@call",
        "data":{"command":"O:40:\"Illuminate\\Broadcasting\\PendingBroadcast\":...
        [PHPGGC Laravel/RCE chain]..."}}'
        When the queue worker picks up this job, it deserializes the command
        property, triggering the Laravel gadget chain for RCE with the
        queue worker's system privileges.
      example_payload: "LPUSH queues:default '{\"job\":\"CallQueuedHandler@call\",\"data\":{\"command\":\"[PHPGGC Laravel/RCE1 payload]\"}}'"
      attacker_objective: "Inject malicious serialized PHP objects into Laravel queue to achieve RCE when the queue worker deserializes the job"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
