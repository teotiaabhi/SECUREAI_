rules:
  # ============================================================================
  # DESER-PHP-001: unserialize with User Input
  # ============================================================================
  - rule_id: "DESER-PHP-001"
    title: "PHP unserialize on User-Controlled Input Leading to Object Injection"
    description: >
      Detects usage of PHP's unserialize() function on data originating from
      user-controlled sources such as request parameters, cookies, headers,
      or external input. PHP object injection via unserialize is one of the
      most critical vulnerability classes in PHP applications. When untrusted
      data is passed to unserialize(), an attacker can instantiate arbitrary
      PHP objects whose __wakeup(), __destruct(), __toString(), or other
      magic methods execute during or after deserialization. Combined with
      gadget chains in the application or its frameworks, this leads to
      remote code execution, file operations, or SQL injection.
    language: php
    category: deserialization
    severity: Critical
    confidence: 0.95
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - php
      - unserialize
      - rce
      - object-injection
      - critical
      - magic-methods
    detection_layer: 1
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'unserialize\s*\(\s*\$_(GET|POST|REQUEST|COOKIE|SERVER|FILES|SESSION)\s*\['
        description: "unserialize on PHP superglobal array element"
      - type: regex
        pattern: 'unserialize\s*\(\s*\$(data|input|payload|body|content|value|param|raw|user_input)'
        description: "unserialize on common user-controlled variable names"
      - type: regex
        pattern: 'unserialize\s*\(\s*base64_decode\s*\('
        description: "unserialize on base64-decoded data"
      - type: regex
        pattern: 'unserialize\s*\(\s*file_get_contents\s*\(\s*\$'
        description: "unserialize on file contents with user-controlled path"
      - type: regex
        pattern: 'unserialize\s*\(\s*\$request->(input|get|post|cookie|header)\s*\('
        description: "unserialize on Laravel/framework request method"
      - type: regex
        pattern: 'unserialize\s*\(\s*(gzuncompress|gzinflate|bzdecompress)\s*\('
        description: "unserialize on decompressed data"
      - type: regex
        pattern: 'unserialize\s*\(\s*hex2bin\s*\('
        description: "unserialize on hex-decoded data"
      - type: regex
        pattern: 'unserialize\s*\(\s*\$_SERVER\s*\[\s*["\x27]HTTP_'
        description: "unserialize on HTTP header value from SERVER superglobal"
    anti_patterns:
      - 'unserialize\s*\(\s*serialize\s*\('
      - 'unserialize\s*\(\s*["\x27](a:|s:|i:|b:|O:0:)'
      - 'unserialize\s*\([^)]*\[\s*["\x27]allowed_classes["\x27]\s*=>\s*(false|\[\s*\]|\[.*\\\\)'
      - 'unserialize\s*\(\s*\$this->'
      - 'unserialize\s*\(\s*\$config'
      - 'unserialize\s*\(\s*file_get_contents\s*\(\s*["\x27]'
      - '\/\/\s*@nosec'
      - '\/\/\s*test'
      - 'unserialize\s*\(\s*\$internal'
      - 'unserialize\s*\(\s*\$trusted'
      - 'unserialize\s*\(\s*\$cache'
      - 'hash_hmac.*unserialize|unserialize.*hash_hmac'
      - 'unserialize\s*\(\s*\$fixture'
      - 'unserialize\s*\(\s*\$mock'
      - 'unserialize\s*\(\s*\$default'
    bypass_variants:
      - description: "Using allowed_classes with overly permissive list"
        pattern: 'unserialize\s*\([^)]*allowed_classes["\x27]\s*=>\s*true'
      - description: "Indirect unserialize via variable function call"
        pattern: '\$func\s*=\s*["\x27]unserialize["\x27]\s*;\s*\$func\s*\('
      - description: "unserialize through call_user_func"
        pattern: 'call_user_func\s*\(\s*["\x27]unserialize["\x27]'
    evasion_indicators:
      - "Variable function call to hide unserialize"
      - "call_user_func or call_user_func_array with unserialize"
      - "Base64 or hex-encoded serialized payload"
      - "Compressed serialized data (gzip/bzip2)"
      - "Serialized data in cookie or hidden form field"
    encoding_variants:
      - type: "base64"
        pattern: 'unserialize\s*\(\s*base64_decode\s*\(\s*\$(data|input|payload|cookie)'
      - type: "hex"
        pattern: 'unserialize\s*\(\s*hex2bin\s*\(\s*\$'
      - type: "gzip"
        pattern: 'unserialize\s*\(\s*gzuncompress\s*\(\s*\$'
    multi_function_chain_patterns:
      - "Cookie value -> base64_decode -> unserialize -> __wakeup -> code execution"
      - "POST parameter -> unserialize -> __destruct -> file write -> webshell"
      - "Session data -> unserialize -> __toString -> SQL injection"
      - "Hidden form field -> base64_decode -> unserialize -> __call -> RCE"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "PHP object injection through unserialize triggers magic methods (__wakeup, __destruct, __toString) that can chain to RCE through framework gadget chains"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "$_GET / $_POST / $_COOKIE / $_REQUEST"
        sink: "unserialize()"
        through: "Direct or base64-decoded parameter"
      - source: "HTTP request body"
        sink: "unserialize()"
        through: "Framework input method"
      - source: "File upload content"
        sink: "unserialize()"
        through: "file_get_contents()"
    impact: |
      PHP unserialize object injection can lead to:
      - Remote Code Execution through magic method gadget chains
      - Arbitrary file read/write via __destruct or __wakeup
      - SQL injection through __toString and database operations
      - Server-Side Request Forgery via object property manipulation
      - Authentication bypass through session manipulation
      - Denial of Service through resource-intensive object construction
    remediation: |
      1. Never pass user input to unserialize. Use json_decode instead:
         ```php
         // Bad: unserialize on user input
         $data = unserialize($_POST['data']);

         // Good: use JSON
         $data = json_decode($_POST['data'], true);
         ```
      2. If unserialize is required, use allowed_classes restriction (PHP 7.0+):
         ```php
         $data = unserialize($input, ['allowed_classes' => false]);
         // Or whitelist specific classes:
         $data = unserialize($input, ['allowed_classes' => ['SafeClass']]);
         ```
      3. Sign serialized data with HMAC before storing and verify before loading:
         ```php
         // Signing
         $signed = hash_hmac('sha256', $serialized, $secret) . '|' . $serialized;
         // Verification
         [$hash, $data] = explode('|', $signed, 2);
         if (!hash_equals(hash_hmac('sha256', $data, $secret), $hash)) {
             throw new Exception('Invalid signature');
         }
         ```
      4. Use typed serialization libraries like Symfony Serializer with normalization.
      5. Implement Content Security Policy and input validation.
    references:
      - "https://owasp.org/www-community/vulnerabilities/PHP_Object_Injection"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://www.php.net/manual/en/function.unserialize.php"
    context_awareness:
      surrounding_context_patterns:
        - "unserialize call on variable populated from user input"
        - "No allowed_classes parameter in unserialize call"
        - "No HMAC verification before unserialize"
        - "User input flows through decode functions to unserialize"
      taint_source_indicators:
        - "$_GET"
        - "$_POST"
        - "$_COOKIE"
        - "$_REQUEST"
        - "$_SERVER['HTTP_*']"
        - "$request->input()"
      taint_sink_indicators:
        - "unserialize()"
        - "call_user_func('unserialize')"
        - "call_user_func_array('unserialize')"
      sanitization_patterns:
        - "allowed_classes => false"
        - "allowed_classes => [specific classes]"
        - "HMAC verification before unserialize"
        - "json_decode instead of unserialize"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (1 - allowed_classes_present)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A PHP application stores user preferences in a cookie using
        base64_encode(serialize($prefs)). The application retrieves
        preferences with unserialize(base64_decode($_COOKIE['prefs'])).
        An attacker crafts a serialized PHP object exploiting a gadget
        chain in the Monolog library:
        O:32:"Monolog\Handler\SyslogUdpHandler":1:{s:9:"\0*\0socket";
        O:29:"Monolog\Handler\BufferHandler":7:...}
        This chains through __destruct -> write -> exec, achieving RCE.
      example_payload: 'O:32:"Monolog\\Handler\\SyslogUdpHandler":1:{s:9:"*socket";O:29:"Monolog\\Handler\\BufferHandler":7:{...exec_payload...}}'
      attacker_objective: "Achieve remote code execution through PHP object injection by crafting serialized objects that trigger gadget chains via magic methods"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: false
      high_impact_flag: true
      related_rules:
        - "DESER-PHP-002"
        - "DESER-PHP-003"
        - "DESER-PHP-005"
        - "DESER-PHP-008"

  # ============================================================================
  # DESER-PHP-002: phar:// Deserialization (Phar Polyglot)
  # ============================================================================
  - rule_id: "DESER-PHP-002"
    title: "Phar Stream Wrapper Deserialization via phar:// Polyglot Files"
    description: >
      Detects code paths where file operation functions (file_exists,
      is_file, fopen, file_get_contents, etc.) can be called with a
      user-controlled path that could include the phar:// stream wrapper.
      When PHP processes a phar:// URL, it automatically deserializes the
      phar archive's metadata using unserialize, regardless of what file
      function is called. An attacker can upload a polyglot file (a file
      that is simultaneously a valid image and a valid phar archive) and
      then trigger metadata deserialization by making any file function
      access it via phar://. This bypasses file upload filters and provides
      a powerful deserialization primitive.
    language: php
    category: deserialization
    severity: Critical
    confidence: 0.91
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - php
      - phar
      - polyglot
      - file-operation
      - stream-wrapper
      - rce
      - critical
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: '(file_exists|is_file|is_dir|is_link|file_get_contents|fopen|readfile|include|require)\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)'
        description: "File operation with user-controlled path from superglobal"
      - type: regex
        pattern: '(file_exists|is_file|is_dir|file_get_contents|fopen|stat|lstat|filetype)\s*\(\s*\$(path|file|filename|url|uri|input|param)'
        description: "File operation with user-controlled variable"
      - type: regex
        pattern: '(getimagesize|exif_read_data|imagecreatefrom\w+)\s*\(\s*\$(path|file|filename|url|upload)'
        description: "Image processing function with user-controlled path"
      - type: regex
        pattern: '(copy|rename|unlink)\s*\(\s*\$(path|file|filename|source|src)'
        description: "File manipulation function with user-controlled path"
      - type: regex
        pattern: '(simplexml_load_file|DOMDocument.*load)\s*\(\s*\$(path|file|filename|url)'
        description: "XML loading function with user-controlled path"
      - type: regex
        pattern: 'new\s+SplFileInfo\s*\(\s*\$(path|file|filename)'
        description: "SplFileInfo creation with user-controlled path"
      - type: regex
        pattern: 'md5_file\s*\(\s*\$(path|file|filename|upload)'
        description: "md5_file with user-controlled path enabling phar deserialization"
      - type: regex
        pattern: 'sha1_file\s*\(\s*\$(path|file|filename|upload)'
        description: "sha1_file with user-controlled path enabling phar deserialization"
    anti_patterns:
      - 'phar\.readonly\s*=\s*On|phar\.readonly\s*=\s*1'
      - 'stream_wrapper_unregister\s*\(\s*["\x27]phar["\x27]\s*\)'
      - 'basename\s*\(\s*\$.*\)\s*\).*file_(exists|get_contents)'
      - 'realpath\s*\(.*phar'
      - 'preg_match\s*\(\s*["\x27].*phar.*["\x27]\s*,\s*\$'
      - 'strpos\s*\(\s*\$\w+\s*,\s*["\x27]phar["\x27]\s*\)'
      - 'str_starts_with\s*\(\s*\$\w+\s*,\s*["\x27]phar["\x27]\s*\)'
      - '\/\/\s*test'
      - 'mock.*file'
      - 'file_exists\s*\(\s*["\x27]/'
      - 'file_exists\s*\(\s*__DIR__'
      - 'file_exists\s*\(\s*dirname'
      - 'file_exists\s*\(\s*\$this->'
      - 'UPLOADS_DIR.*file_exists'
    bypass_variants:
      - description: "Polyglot JPEG-PHAR file bypassing image validation"
        pattern: '(getimagesize|imagecreatefrom\w+|exif_read_data).*\$.*upload'
      - description: "Path manipulation to inject phar:// wrapper"
        pattern: 'phar://|PHAR://|Phar://'
      - description: "Using compress.zlib wrapper to bypass phar:// filtering"
        pattern: 'compress\.(zlib|bzip2)://phar://'
    evasion_indicators:
      - "File upload followed by file operation with controllable path"
      - "Polyglot file (JPEG/GIF header + phar archive data)"
      - "URL path manipulation to inject phar:// stream wrapper"
      - "compress.zlib://phar:// or compress.bzip2://phar:// wrapper chain"
      - "Phar archive with crafted metadata containing gadget chains"
    encoding_variants:
      - type: "compress_zlib"
        pattern: 'compress\.zlib://phar://'
      - type: "compress_bzip2"
        pattern: 'compress\.bzip2://phar://'
      - type: "uppercase_bypass"
        pattern: '[Pp][Hh][Aa][Rr]://'
    multi_function_chain_patterns:
      - "File upload -> store on disk -> file_exists with phar:// -> metadata deserialization -> RCE"
      - "Image upload -> getimagesize validation -> phar:// access -> __wakeup gadget"
      - "Path traversal -> phar:// injection in file_get_contents -> deserialization"
      - "Avatar upload -> polyglot JPEG-PHAR -> thumbnail generation -> phar deserialization"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Any file operation function with user-controlled path can trigger phar metadata deserialization, converting file access into object injection"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "File upload + path parameter"
        sink: "file_exists / file_get_contents / getimagesize"
        through: "phar:// stream wrapper triggering metadata deserialization"
      - source: "$_GET['path'] / $_POST['file']"
        sink: "Any file operation function"
        through: "phar:// wrapper injection in path"
      - source: "User avatar upload"
        sink: "Image processing function"
        through: "Polyglot JPEG-PHAR file"
    impact: |
      Phar deserialization exploitation can lead to:
      - Remote Code Execution through PHP object injection via phar metadata
      - File upload filter bypass through polyglot file techniques
      - Bypasses read-only operations (even file_exists triggers deserialization)
      - Server compromise via framework gadget chains
      - Escalation from file read vulnerability to full RCE
    remediation: |
      1. Disable phar stream wrapper if not needed:
         ```php
         // In php.ini
         phar.readonly = On
         // Or at runtime
         stream_wrapper_unregister('phar');
         ```
      2. Validate and sanitize file paths before use:
         ```php
         function safePath($path) {
             $path = realpath($path);
             if ($path === false || !str_starts_with($path, '/var/www/uploads/')) {
                 throw new \InvalidArgumentException('Invalid path');
             }
             if (stripos($path, 'phar://') !== false) {
                 throw new \InvalidArgumentException('Phar wrapper not allowed');
             }
             return $path;
         }
         ```
      3. Filter out phar:// and other dangerous stream wrappers from user input.
      4. Use pathinfo() and basename() to restrict path components.
      5. Validate uploaded files using content-based detection, not extension.
    references:
      - "https://blog.sonarsource.com/new-php-exploitation-technique"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://i.blackhat.com/us-18/Thu-August-9/us-18-Thomas-Its-A-PHP-Unserialization-Vulnerability-Jim-But-Not-As-We-Know-It.pdf"
    context_awareness:
      surrounding_context_patterns:
        - "File operation with user-controlled path variable"
        - "No phar:// wrapper filtering on path"
        - "File upload functionality in same application"
        - "No stream_wrapper_unregister for phar"
      taint_source_indicators:
        - "$_GET['path']"
        - "$_POST['file']"
        - "$_FILES"
        - "$request->file()"
        - "User-controlled URL parameter"
      taint_sink_indicators:
        - "file_exists()"
        - "file_get_contents()"
        - "fopen()"
        - "getimagesize()"
        - "is_file()"
        - "stat()"
      sanitization_patterns:
        - "stream_wrapper_unregister('phar')"
        - "stripos check for 'phar://'"
        - "realpath() canonicalization"
        - "basename() path restriction"
    severity_scoring:
      severity_weight: 10
      risk_score_formula_hint: "severity_weight * confidence * (file_upload_present ? 1.4 : 0.8)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A PHP application allows users to upload profile images. The upload
        handler validates the file is a valid JPEG using getimagesize().
        The application also has a feature to check file existence using
        file_exists() with a path constructed from user input. An attacker
        creates a polyglot file that is simultaneously a valid JPEG and a
        phar archive with serialized metadata containing a Monolog gadget
        chain. The attacker uploads this as their avatar, then makes a
        request with path=phar:///var/www/uploads/avatar.jpg. The
        file_exists call triggers phar metadata deserialization, executing
        the gadget chain for RCE.
      example_payload: "phar:///var/www/uploads/polyglot_avatar.jpg/anything"
      attacker_objective: "Trigger PHP object injection through phar metadata deserialization by manipulating file paths to use the phar:// stream wrapper"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-PHP-001"
        - "DESER-PHP-008"

  # ============================================================================
  # DESER-PHP-003: SoapClient SSRF via Deserialization
  # ============================================================================
  - rule_id: "DESER-PHP-003"
    title: "SoapClient SSRF via PHP Object Deserialization"
    description: >
      Detects patterns where PHP's SoapClient class can be instantiated
      through deserialization to perform Server-Side Request Forgery (SSRF).
      When a serialized SoapClient object with a controlled _soap_url or
      location property is deserialized, calling any method on the resulting
      object (or triggering __call) causes SoapClient to make an HTTP
      request to the attacker-specified URL. This is a well-known PHP
      deserialization gadget that converts object injection into SSRF,
      enabling internal network scanning, metadata endpoint access in
      cloud environments, and potentially remote code execution through
      SSRF-to-RCE chains.
    language: php
    category: deserialization
    severity: High
    confidence: 0.88
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - php
      - soapclient
      - ssrf
      - gadget
      - internal-network
      - cloud
    detection_layer: 2
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'new\s+SoapClient\s*\(\s*null\s*,\s*\[\s*["\x27]location["\x27]\s*=>\s*\$(url|uri|host|endpoint|target)'
        description: "SoapClient with user-controlled location parameter"
      - type: regex
        pattern: 'new\s+SoapClient\s*\(\s*\$(url|uri|wsdl|endpoint|param|input)'
        description: "SoapClient with user-controlled WSDL URL"
      - type: regex
        pattern: 'O:\d+:"SoapClient"'
        description: "Serialized SoapClient object in data"
      - type: regex
        pattern: 'unserialize.*SoapClient|SoapClient.*unserialize'
        description: "SoapClient referenced near unserialize operations"
      - type: regex
        pattern: 'SoapClient\s*\(\s*null\s*,\s*\[.*uri.*location'
        description: "SoapClient with both uri and location parameters"
      - type: regex
        pattern: '__call\s*\(.*SoapClient'
        description: "Magic __call method interaction with SoapClient"
    anti_patterns:
      - 'new\s+SoapClient\s*\(\s*["\x27]https?://[a-z0-9.-]+\.[a-z]'
      - 'SoapClient\s*\(\s*["\x27][a-zA-Z].*\.wsdl["\x27]'
      - '\/\/\s*test'
      - 'mock.*SoapClient'
      - 'SoapClient.*internal'
      - 'SoapClient.*hardcoded'
      - 'SoapClient.*config\['
      - 'SOAP_WSDL_CACHE'
      - 'SoapClient\s*\(\s*["\x27]file://'
      - 'SoapClient.*\.env'
      - 'SoapClient.*SOAP_1_2'
      - 'SoapClient.*validated'
      - 'SoapClient.*sanitized'
    bypass_variants:
      - description: "SoapClient SSRF via __call magic method triggering HTTP request"
        pattern: 'O:\d+:"SoapClient":\d+:\{.*location.*http'
      - description: "SoapClient targeting cloud metadata endpoint"
        pattern: 'SoapClient.*169\.254\.169\.254|SoapClient.*metadata'
      - description: "SoapClient with CRLF injection in user_agent for response splitting"
        pattern: 'SoapClient.*user_agent.*\$'
    evasion_indicators:
      - "Serialized SoapClient object in cookie or POST parameter"
      - "SoapClient with location pointing to internal services"
      - "CRLF injection via user_agent property for response manipulation"
      - "SoapClient targeting cloud metadata endpoints"
      - "Chained object injection: SoapClient as property of deserialized object"
    encoding_variants:
      - type: "base64_serialized"
        pattern: 'base64_decode.*SoapClient|SoapClient.*base64'
      - type: "url_encoded"
        pattern: 'urldecode.*SoapClient|O%3A\d+%3A%22SoapClient'
      - type: "hex_encoded"
        pattern: 'hex2bin.*SoapClient'
    multi_function_chain_patterns:
      - "unserialize -> SoapClient.__call -> HTTP request to internal service"
      - "Object injection -> SoapClient.__destruct -> SSRF to metadata endpoint"
      - "Cookie deserialization -> SoapClient object -> __toString -> SSRF"
      - "phar:// deserialization -> SoapClient gadget -> cloud SSRF -> credential theft"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "SoapClient SSRF can access cloud metadata endpoints (169.254.169.254) to steal IAM credentials, enabling full cloud infrastructure compromise"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "Serialized data in cookie/POST"
        sink: "unserialize() -> SoapClient instantiation"
        through: "PHP deserialization"
      - source: "User-controlled URL parameter"
        sink: "new SoapClient()"
        through: "Direct parameter passing"
      - source: "Phar metadata"
        sink: "SoapClient.__call()"
        through: "Phar deserialization"
    impact: |
      SoapClient SSRF through deserialization can lead to:
      - Internal network scanning and service discovery
      - Cloud metadata endpoint access (AWS/GCP/Azure credential theft)
      - Access to internal APIs and admin interfaces
      - Remote code execution through SSRF-to-RCE chains
      - Data exfiltration through DNS or HTTP-based out-of-band channels
      - CRLF injection via user_agent leading to response manipulation
    remediation: |
      1. Never deserialize untrusted data (see DESER-PHP-001):
         ```php
         $data = json_decode($input, true);
         ```
      2. If unserialize is required, explicitly deny SoapClient:
         ```php
         $data = unserialize($input, ['allowed_classes' => false]);
         ```
      3. Restrict outbound network access from the web server.
      4. Block access to cloud metadata endpoints:
         ```
         iptables -A OUTPUT -d 169.254.169.254 -j DROP
         ```
      5. Disable SOAP extension if not needed:
         ```ini
         ; php.ini
         ; extension=soap  (comment out)
         ```
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://www.ambionics.io/blog/php-generic-gadget-chains"
      - "https://i.blackhat.com/us-18/Thu-August-9/us-18-Thomas-Its-A-PHP-Unserialization-Vulnerability-Jim-But-Not-As-We-Know-It.pdf"
    context_awareness:
      surrounding_context_patterns:
        - "unserialize call in same file or related controller"
        - "SoapClient instantiation with variable parameters"
        - "No SSRF protection on outbound requests"
        - "Cloud environment (AWS/GCP/Azure)"
      taint_source_indicators:
        - "Deserialized object from user input"
        - "$_GET / $_POST / $_COOKIE"
        - "phar:// metadata"
        - "Session data"
      taint_sink_indicators:
        - "SoapClient->__call()"
        - "SoapClient->__soapCall()"
        - "Any method call on SoapClient"
        - "SoapClient constructor"
      sanitization_patterns:
        - "allowed_classes => false"
        - "URL validation on SoapClient location"
        - "Egress firewall rules"
        - "Cloud metadata endpoint blocking"
    severity_scoring:
      severity_weight: 9
      risk_score_formula_hint: "severity_weight * confidence * (cloud_environment ? 1.4 : 1.0)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A PHP application on AWS deserializes cookie data using unserialize()
        without allowed_classes restriction. An attacker crafts a serialized
        SoapClient object with location set to the AWS metadata endpoint:
        O:10:"SoapClient":4:{s:3:"uri";s:1:"x";s:8:"location";
        s:43:"http://169.254.169.254/latest/meta-data/iam/";
        s:15:"_stream_context";i:0;s:13:"_soap_version";i:1;}
        When the application deserializes this and any code path triggers
        a method call on the object, SoapClient makes an HTTP request to
        the metadata endpoint, exfiltrating AWS IAM credentials.
      example_payload: 'O:10:"SoapClient":4:{s:3:"uri";s:1:"x";s:8:"location";s:62:"http://169.254.169.254/latest/meta-data/iam/security-credentials/";s:15:"_stream_context";i:0;s:13:"_soap_version";i:1;}'
      attacker_objective: "Exploit SoapClient SSRF through deserialization to access cloud metadata endpoints and steal IAM credentials"
