rules:
- rule_id: BBP-SEC-001
  title: Hardcoded Secrets in Pipeline
  description: 'Detects hardcoded credentials in Bitbucket Pipelines configuration.

    '
  language: bitbucket_pipelines
  category: secrets
  severity: Critical
  confidence: 0.92
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - bitbucket-pipelines
  - secrets
  - hardcoded
  patterns:
  - type: regex
    pattern: (?:PASSWORD|SECRET|TOKEN|API_KEY|AWS_SECRET_ACCESS_KEY):\s*["\x27][A-Za-z0-9+/=]{8,}
  - type: regex
    pattern: export\s+(?:PASSWORD|SECRET|API_KEY|TOKEN)=["\x27]?[A-Za-z0-9+/=]{8,}
  anti_patterns:
  - $BITBUCKET_
  - ${BITBUCKET_
  - ${
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: BBP-SEC-002
  title: Docker Run with Privileged Mode
  description: 'Detects running Docker containers in privileged mode.

    '
  language: bitbucket_pipelines
  category: devops
  severity: High
  confidence: 0.9
  cwe: CWE-250
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 1
  tags:
  - bitbucket-pipelines
  - docker
  - privileged
  patterns:
  - type: regex
    pattern: docker\s+run\s+.*--privileged
  - type: regex
    pattern: options:\s*\n\s+docker:\s*true
  anti_patterns:
  - '# required'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: BBP-SEC-003
  title: Insecure Pipe Usage
  description: 'Detects pipes used without version pinning or from untrusted sources.

    '
  language: bitbucket_pipelines
  category: devops
  severity: High
  confidence: 0.83
  cwe: CWE-829
  owasp: A08:2021-Software-and-Data-Integrity-Failures
  detection_layer: 1
  tags:
  - bitbucket-pipelines
  - pipes
  - supply-chain
  patterns:
  - type: regex
    pattern: pipe:\s+(?!atlassian/)[\w-]+/[\w-]+
  - type: regex
    pattern: pipe:\s+\S+:latest
  anti_patterns:
  - atlassian/
  - :v
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: BBP-SEC-004
  title: Deployment Without Manual Trigger
  description: 'Detects production deployments without manual approval.

    '
  language: bitbucket_pipelines
  category: devops
  severity: High
  confidence: 0.8
  cwe: CWE-284
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - bitbucket-pipelines
  - deployment
  - approval
  patterns:
  - type: regex
    pattern: deployment:\s*(?:production|prod|live)\s*$
  anti_patterns:
  - 'trigger: manual'
  - 'step:'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: BBP-SEC-005
  title: SSH Key in Pipeline
  description: 'Detects SSH private keys referenced in pipeline steps.

    '
  language: bitbucket_pipelines
  category: secrets
  severity: Critical
  confidence: 0.9
  cwe: CWE-321
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - bitbucket-pipelines
  - ssh
  - keys
  patterns:
  - type: regex
    pattern: echo\s+.*(?:SSH_KEY|PRIVATE_KEY|RSA_KEY|DEPLOY_KEY).*>\s*.*id_rsa
  - type: regex
    pattern: BEGIN\s+(?:RSA|DSA|EC|OPENSSH)\s+PRIVATE\s+KEY
  anti_patterns:
  - KNOWN_HOSTS
  - .pub
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: BBP-SEC-006
  title: Curl Pipe to Shell
  description: 'Detects downloading and executing scripts in one command.

    '
  language: bitbucket_pipelines
  category: devops
  severity: High
  confidence: 0.9
  cwe: CWE-829
  owasp: A08:2021-Software-and-Data-Integrity-Failures
  detection_layer: 1
  tags:
  - bitbucket-pipelines
  - curl-pipe
  - supply-chain
  patterns:
  - type: regex
    pattern: curl\s+.*\|\s*(?:sh|bash|sudo\s+(?:sh|bash))
  - type: regex
    pattern: wget\s+.*-O\s*-\s*\|\s*(?:sh|bash)
  anti_patterns:
  - gpg --verify
  - sha256sum
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: BBP-SEC-007
  title: Unencrypted Variable in Script
  description: 'Detects sensitive variables used without secured variable feature.

    '
  language: bitbucket_pipelines
  category: devops
  severity: Medium
  confidence: 0.75
  cwe: CWE-312
  owasp: A04:2021-Insecure-Design
  detection_layer: 2
  tags:
  - bitbucket-pipelines
  - variables
  - encryption
  patterns:
  - type: regex
    pattern: script:\s*\n\s+-\s+.*(?:password|secret|token|key)\s*=\s*\S+
  anti_patterns:
  - ${
  - $BITBUCKET
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: BBP-SEC-008
  title: Max-time Not Set
  description: 'Detects pipeline steps without execution time limits.

    '
  language: bitbucket_pipelines
  category: devops
  severity: Low
  confidence: 0.7
  cwe: CWE-400
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 3
  tags:
  - bitbucket-pipelines
  - timeout
  - resource
  patterns:
  - type: regex
    pattern: step:\s*\n(?:(?!\s+max-time:).*\n)+
  anti_patterns:
  - 'max-time:'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: BBP-SEC-009
  title: Artifact Exposure of Sensitive Files
  description: 'Detects sensitive files exposed through artifacts.

    '
  language: bitbucket_pipelines
  category: devops
  severity: Medium
  confidence: 0.8
  cwe: CWE-200
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 1
  tags:
  - bitbucket-pipelines
  - artifacts
  - sensitive
  patterns:
  - type: regex
    pattern: artifacts:\s*\n\s+-\s*.*(?:\.env|\.key|\.pem|credentials|config\.json|\.ssh)
  anti_patterns:
  - '# intentional'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: BBP-SEC-010
  title: Unprotected Branch Deployment
  description: 'Detects deployments triggered from any branch.

    '
  language: bitbucket_pipelines
  category: devops
  severity: Medium
  confidence: 0.78
  cwe: CWE-284
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - bitbucket-pipelines
  - branches
  - deployment
  patterns:
  - type: regex
    pattern: 'branches:\s*\n\s+["\x27]?\*["\x27]?:'
  - type: regex
    pattern: default:\s*\n(?:\s+.*\n){0,20}\s+deployment:\s*production
  anti_patterns:
  - 'branches:'
  - 'tags:'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
