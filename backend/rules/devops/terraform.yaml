- rule_id: TF-SEC-014
  title: Terraform State with Sensitive Data
  description: 'Detects sensitive data in Terraform variables without sensitive flag.

    '
  language: terraform
  category: secrets
  severity: High
  confidence: 0.82
  cwe: CWE-200
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - terraform
  - state
  - sensitive
  patterns:
  - type: regex
    pattern: variable\s+"(?:password|secret|token|api_key|private_key|access_key)\w*"\s*\{
  anti_patterns:
  - sensitive = true
  - sensitive  = true
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
