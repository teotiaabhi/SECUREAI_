- rule_id: TF-SEC-010
  title: Lambda with Overly Permissive Role
  description: 'Detects Lambda functions with wildcard IAM permissions.

    '
  language: terraform
  category: devops
  severity: High
  confidence: 0.82
  cwe: CWE-250
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - terraform
  - aws
  - lambda
  - iam
  patterns:
  - type: regex
    pattern: resource\s+"aws_lambda_function".*(?:role|function_name)
  - type: regex
    pattern: Effect.*Allow.*Action.*\*.*Resource.*\*
  anti_patterns:
  - arn:aws:s3:::specific-bucket
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
