rules:
- rule_id: TF-SEC-001
  title: S3 Bucket Without Encryption
  description: 'Detects AWS S3 buckets without server-side encryption.

    '
  language: terraform
  category: devops
  severity: High
  confidence: 0.9
  cwe: CWE-311
  owasp: A02:2021-Cryptographic-Failures
  detection_layer: 1
  tags:
  - terraform
  - aws
  - s3
  - encryption
  patterns:
  - type: regex
    pattern: resource\s+"aws_s3_bucket"\s+
  anti_patterns:
  - aws_s3_bucket_server_side_encryption
  - server_side_encryption_configuration
  - sse_algorithm
  impact: 'Unencrypted S3 buckets expose data at rest to unauthorized access.

    '
  remediation: "Enable server-side encryption:\n  resource \"aws_s3_bucket_server_side_encryption_configuration\" \"example\" {\n    rule { apply_server_side_encryption_by_default { sse_algorithm = \"aws:kms\"\
    \ } }\n  }\n"
- rule_id: TF-SEC-002
  title: S3 Bucket Public Access
  description: 'Detects S3 buckets with public access configuration.

    '
  language: terraform
  category: devops
  severity: Critical
  confidence: 0.92
  cwe: CWE-284
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 1
  tags:
  - terraform
  - aws
  - s3
  - public-access
  patterns:
  - type: regex
    pattern: acl\s*=\s*"(?:public-read|public-read-write|authenticated-read)"
  - type: regex
    pattern: block_public_acls\s*=\s*false
  - type: regex
    pattern: block_public_policy\s*=\s*false
  - type: regex
    pattern: restrict_public_buckets\s*=\s*false
  anti_patterns:
  - block_public_acls = true
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: TF-SEC-003
  title: Security Group with Open Ingress
  description: 'Detects security groups allowing unrestricted inbound access.

    '
  language: terraform
  category: devops
  severity: Critical
  confidence: 0.92
  cwe: CWE-284
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 1
  tags:
  - terraform
  - aws
  - security-group
  - network
  patterns:
  - type: regex
    pattern: cidr_blocks\s*=\s*\[\s*"0\.0\.0\.0/0"\s*\]
  - type: regex
    pattern: ipv6_cidr_blocks\s*=\s*\[\s*"::/0"\s*\]
  - type: regex
    pattern: ingress\s*\{[^}]*from_port\s*=\s*0[^}]*to_port\s*=\s*0
  anti_patterns:
  - from_port = 443
  - from_port = 80
  - egress
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: TF-SEC-004
  title: Hardcoded Secrets in Terraform
  description: 'Detects hardcoded credentials and secrets in Terraform files.

    '
  language: terraform
  category: secrets
  severity: Critical
  confidence: 0.92
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  detection_layer: 1
  tags:
  - terraform
  - secrets
  - credentials
  patterns:
  - type: regex
    pattern: (?:access_key|secret_key|password|api_key|token|private_key)\s*=\s*"(?!var\.|data\.|local\.|module\.)[^"$]{8,}"
  - type: regex
    pattern: AKIA[0-9A-Z]{16}
  - type: regex
    pattern: (?:password|secret)\s*=\s*"[A-Za-z0-9+/=]{16,}"
  anti_patterns:
  - var.
  - data.
  - local.
  - module.
  - ${}
  - sensitive
  impact: Exposed secrets enable unauthorized access to systems, APIs, and sensitive data
  remediation: Use secret management systems, environment variables, and rotate exposed credentials immediately
- rule_id: TF-SEC-005
  title: IAM Policy Too Permissive
  description: 'Detects overly permissive IAM policies (Action:*, Resource:*).

    '
  language: terraform
  category: devops
  severity: Critical
  confidence: 0.9
  cwe: CWE-250
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 1
  tags:
  - terraform
  - aws
  - iam
  - least-privilege
  patterns:
  - type: regex
    pattern: '"Action"\s*:\s*(?:\[\s*)?"(?:\*|iam:\*|s3:\*|ec2:\*|lambda:\*)"'
  - type: regex
    pattern: actions\s*=\s*\[\s*"\*"\s*\]
  - type: regex
    pattern: '"Resource"\s*:\s*(?:\[\s*)?"(?:\*)"'
  - type: regex
    pattern: resources\s*=\s*\[\s*"\*"\s*\]
  anti_patterns:
  - Deny
  - Condition
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
