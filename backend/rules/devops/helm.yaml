  - 'secretName:'
  - cert-manager
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: HELM-SEC-011
  title: Host Path Volume in Chart
  description: 'Detects hostPath volumes configured in Helm chart templates.

    '
  language: helm
  category: devops
  severity: High
  confidence: 0.88
  cwe: CWE-552
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 1
  tags:
  - helm
  - hostpath
  - volume
  patterns:
  - type: regex
    pattern: hostPath:\s*\n\s+path:\s*/
  anti_patterns:
  - /var/log
  - '{{- if .Values'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: HELM-SEC-012
  title: Unquoted toYaml Output
  description: 'Detects toYaml output not properly indented or piped.

    '
  language: helm
  category: devops
  severity: Medium
  confidence: 0.78
  cwe: CWE-94
  owasp: A03:2021-Injection
  detection_layer: 2
  tags:
  - helm
  - toYaml
  - formatting
  patterns:
  - type: regex
    pattern: \{\{\s*toYaml\s+\.Values\.\w+\s*\}\}
  anti_patterns:
  - '| nindent'
  - '| indent'
  - '| trim'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
