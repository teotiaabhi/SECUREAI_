rules:
- rule_id: DEVOPS-YAML-001
  title: Privileged Container Configuration
  description: 'Detects Kubernetes pod or container configurations running with privileged mode enabled, granting full host access. Privileged containers bypass nearly all kernel-level isolation and gain
    direct access to host devices, filesystems, and kernel modules. This is one of the most dangerous misconfigurations in Kubernetes environments.

    '
  language: yaml
  category: devops
  severity: Critical
  confidence: 0.96
  cwe: CWE-250
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - privileged-container
  - container-security
  - pod-security
  - cis-benchmark
  - container-escape
  - pss-restricted
  patterns:
  - type: regex
    pattern: privileged\s*:\s*true
  - type: regex
    pattern: securityContext\s*:\s*\n\s+privileged\s*:\s*true
  - type: regex
    pattern: securityContext\s*:\s*\{[^}]*privileged\s*:\s*true[^}]*\}
  - type: regex
    pattern: spec\s*:\s*\n(?:\s+.*\n){0,20}?\s+privileged\s*:\s*true
  - type: regex
    pattern: (?:containers|initContainers)\s*:\s*\n(?:\s+.*\n){0,20}?\s+privileged\s*:\s*true
  - type: regex
    pattern: helm\.sh/chart.*\n(?:.*\n){0,20}?privileged\s*:\s*true
  anti_patterns:
  - 'privileged: false'
  - '# required for'
  - initContainer
  - 'pod-security.kubernetes.io/enforce: restricted'
  - 'pod-security.kubernetes.io/enforce: baseline'
  - constraints/K8sPSPPrivilegedContainer
  - ConstraintTemplate
  - kube-bench
  - policy/v1beta1
  - calico.org/v3
  - security.istio.io
  - gatekeeper.sh/constraint
  - "securityContext:\n            privileged: false"
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Pod'
    - 'kind: Deployment'
    - 'kind: DaemonSet'
    - 'kind: StatefulSet'
    - 'kind: Job'
    - 'kind: CronJob'
    - 'kind: ReplicaSet'
    - 'securityContext:'
    - 'containers:'
    taint_source_indicators:
    - values.yaml
    - helm template
    - '{{ .Values.securityContext'
    - 'env:'
    - configMapKeyRef
    taint_sink_indicators:
    - 'privileged: true'
    - 'securityContext:'
    - /dev mount
    - 'hostPath:'
    sanitization_patterns:
    - 'privileged: false'
    - PodSecurityPolicy
    - pod-security.kubernetes.io/enforce
    - OPA Gatekeeper constraint
    - Kyverno policy
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.98
  exploit_scenario:
    attack_example: 'Container Escape via Privileged Mode: An attacker who gains code execution in a privileged container can mount the host filesystem using `mount /dev/sda1 /mnt`, chroot into the host,
      and gain full root access to the underlying node. From the node, they can access the kubelet credentials, steal secrets from all pods on the node, and pivot to other nodes in the cluster.

      '
    example_payload: '# From within a privileged container:

      mkdir /host-root

      mount /dev/sda1 /host-root

      chroot /host-root

      cat /var/lib/kubelet/kubeconfig

      kubectl --kubeconfig=/var/lib/kubelet/kubeconfig get secrets --all-namespaces

      '
    attacker_objective: 'Escape container isolation, gain root access to the host node, steal cluster credentials, and achieve lateral movement across the Kubernetes cluster.

      '
  confidence_factors:
    pattern_strength: 0.98
    context_match: 0.95
    proximity_to_user_input: 0.3
    sanitization_absence: 0.97
  impact: 'Privileged containers have full access to the host''s devices, kernel

    modules, and filesystem. An attacker who compromises a privileged container

    effectively gains root access to the underlying host node. This is

    categorized as a critical finding by CIS Kubernetes Benchmark 5.2.1.

    '
  remediation: "## Kubernetes Pod Security Standards\n- Set privileged: false (default) in all container securityContext blocks\n- Apply the PSS restricted profile: pod-security.kubernetes.io/enforce: restricted\n\
    \n## CIS Benchmark References\n- CIS Kubernetes Benchmark 5.2.1: Minimize the admission of privileged containers\n- CIS Docker Benchmark 5.4: Ensure privileged containers are not used\n\n## Helm Chart\
    \ Hardening\n- Override values.yaml: securityContext.privileged=false\n- Use helm-values security scanning (e.g., checkov, kubesec)\n- Template validation: helm template . | kubesec scan -\n\n## OPA\
    \ Rego Policy\n```rego\npackage kubernetes.admission\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  container := input.request.object.spec.containers[_]\n  container.securityContext.privileged\
    \ == true\n  msg := sprintf(\"Privileged container not allowed: %v\", [container.name])\n}\n```\n\n## Additional Remediation\n- Use specific capabilities instead of full privilege escalation\n- Apply\
    \ seccomp and AppArmor profiles for fine-grained access control\n- Deploy Kyverno or OPA Gatekeeper to enforce at admission time\n- Use Pod Security Admission controller in enforce mode\n"
  references:
  - https://cwe.mitre.org/data/definitions/250.html
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html
  - https://attack.mitre.org/techniques/T1611/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-002
    - DEVOPS-YAML-006
    - DEVOPS-YAML-009
    - DEVOPS-YAML-003
  detection_layer: 1
- rule_id: DEVOPS-YAML-002
  title: Privilege Escalation Allowed
  description: 'Detects containers with allowPrivilegeEscalation set to true, enabling processes to gain more privileges than their parent. This allows setuid binaries and other privilege escalation vectors
    within the container, potentially allowing a non-root process to gain root-level access through SUID/SGID binaries, kernel exploits, or capability manipulation.

    '
  language: yaml
  category: devops
  severity: High
  confidence: 0.95
  cwe: CWE-269
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - privilege-escalation
  - security-context
  - setuid
  - cis-benchmark
  - pss-restricted
  patterns:
  - type: regex
    pattern: allowPrivilegeEscalation\s*:\s*true
  - type: regex
    pattern: securityContext\s*:\s*\n(?:\s+.*\n){0,20}?\s+allowPrivilegeEscalation\s*:\s*true
  - type: regex
    pattern: securityContext\s*:\s*\{[^}]*allowPrivilegeEscalation\s*:\s*true[^}]*\}
  - type: regex
    pattern: containers\s*:\s*\n(?:\s+.*\n){0,20}?\s+allowPrivilegeEscalation\s*:\s*true
  - type: regex
    pattern: (?:initContainers|ephemeralContainers)\s*:\s*\n(?:\s+.*\n){0,20}?\s+allowPrivilegeEscalation\s*:\s*true
  anti_patterns:
  - 'allowPrivilegeEscalation: false'
  - 'pod-security.kubernetes.io/enforce: restricted'
  - 'pod-security.kubernetes.io/enforce: baseline'
  - constraints/K8sPSPAllowPrivilegeEscalation
  - gatekeeper.sh/constraint
  - kyverno.io/policy
  - calico.org/v3
  - security.istio.io
  - kube-bench
  - '# kube-system required'
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Pod'
    - 'kind: Deployment'
    - 'kind: DaemonSet'
    - 'kind: StatefulSet'
    - 'kind: Job'
    - 'kind: CronJob'
    - 'securityContext:'
    - 'containers:'
    taint_source_indicators:
    - values.yaml
    - helm template
    - '{{ .Values.'
    - setuid binary
    - SUID
    taint_sink_indicators:
    - 'allowPrivilegeEscalation: true'
    - 'securityContext:'
    - 'capabilities:'
    - 'add:'
    sanitization_patterns:
    - 'allowPrivilegeEscalation: false'
    - 'drop: ["ALL"]'
    - PodSecurityPolicy
    - pod-security.kubernetes.io/enforce
    - 'runAsNonRoot: true'
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.85
  exploit_scenario:
    attack_example: 'SUID-based Privilege Escalation: An attacker with shell access in a container where allowPrivilegeEscalation is true can exploit setuid binaries (e.g., /usr/bin/passwd, /usr/bin/newgrp)
      or plant a crafted SUID binary to escalate from an unprivileged user to root within the container. Combined with other misconfigurations such as writable root filesystem or dangerous capabilities,
      this can lead to a container breakout.

      '
    example_payload: '# Find and exploit SUID binaries

      find / -perm -4000 -type f 2>/dev/null

      # Exploit a known SUID binary for root shell

      /usr/bin/find . -exec /bin/sh -p \;

      # Or copy bash with SUID

      cp /bin/bash /tmp/rootbash && chmod +s /tmp/rootbash

      /tmp/rootbash -p

      '
    attacker_objective: 'Escalate from an unprivileged container process to root within the container, then leverage additional misconfigurations for container escape and cluster-wide compromise.

      '
  confidence_factors:
    pattern_strength: 0.96
    context_match: 0.93
    proximity_to_user_input: 0.25
    sanitization_absence: 0.95
  impact: 'Allows container processes to escalate privileges via setuid binaries,

    capabilities, or other kernel mechanisms, potentially gaining root.

    This violates the Kubernetes Pod Security Standards restricted profile

    and CIS Benchmark 5.2.5.

    '
  remediation: "## Kubernetes Pod Security Standards\n- Set allowPrivilegeEscalation: false in securityContext\n- Apply the PSS restricted profile which requires this by default\n\n## CIS Benchmark References\n\
    - CIS Kubernetes Benchmark 5.2.5: Minimize the admission of containers with allowPrivilegeEscalation\n- Ensure no-new-privileges is set at the container runtime level\n\n## Helm Chart Hardening\n- Default\
    \ securityContext in values.yaml:\n  securityContext:\n    allowPrivilegeEscalation: false\n    capabilities:\n      drop: [\"ALL\"]\n\n## OPA Rego Policy\n```rego\npackage kubernetes.admission\ndeny[msg]\
    \ {\n  input.request.kind.kind == \"Pod\"\n  container := input.request.object.spec.containers[_]\n  container.securityContext.allowPrivilegeEscalation == true\n  msg := sprintf(\"Privilege escalation\
    \ not allowed for container: %v\", [container.name])\n}\n```\n\n## Additional Remediation\n- Drop all capabilities: capabilities: { drop: [\"ALL\"] }\n- Set runAsNonRoot: true\n- Remove all SUID/SGID\
    \ binaries from container images\n"
  references:
  - https://cwe.mitre.org/data/definitions/269.html
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1548/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-001
    - DEVOPS-YAML-006
    - DEVOPS-YAML-009
  detection_layer: 1
- rule_id: DEVOPS-YAML-003
  title: Host Network Namespace Sharing
  description: 'Detects pods configured to use the host''s network namespace, PID namespace, or IPC namespace, enabling access to host network interfaces, processes, and inter-process communication. This
    breaks container isolation boundaries and allows the pod to interact directly with host-level services, sniff traffic, and access host process information.

    '
  language: yaml
  category: devops
  severity: High
  confidence: 0.94
  cwe: CWE-284
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - host-network
  - network-isolation
  - host-pid
  - host-ipc
  - lateral-movement
  - cis-benchmark
  - pss-baseline
  patterns:
  - type: regex
    pattern: hostNetwork\s*:\s*true
  - type: regex
    pattern: hostPID\s*:\s*true
  - type: regex
    pattern: hostIPC\s*:\s*true
  - type: regex
    pattern: spec\s*:\s*\n(?:\s+.*\n){0,20}?\s+hostNetwork\s*:\s*true
  - type: regex
    pattern: spec\s*:\s*\n(?:\s+.*\n){0,20}?\s+hostPID\s*:\s*true
  - type: regex
    pattern: spec\s*:\s*\n(?:\s+.*\n){0,20}?\s+hostIPC\s*:\s*true
  - type: regex
    pattern: hostPort\s*:\s*\d+
  - type: regex
    pattern: dnsPolicy\s*:\s*ClusterFirstWithHostNet
  anti_patterns:
  - 'hostNetwork: false'
  - '# kube-system'
  - '# CNI'
  - 'pod-security.kubernetes.io/enforce: restricted'
  - 'pod-security.kubernetes.io/enforce: baseline'
  - constraints/K8sPSPHostNamespace
  - constraints/K8sPSPHostNetworkingPorts
  - gatekeeper.sh/constraint
  - NetworkPolicy
  - calico.org/v3
  - security.istio.io/v1
  - PeerAuthentication
  - AuthorizationPolicy
  - kube-bench
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Pod'
    - 'kind: Deployment'
    - 'kind: DaemonSet'
    - 'kind: StatefulSet'
    - 'spec:'
    - 'template:'
    - 'metadata:'
    taint_source_indicators:
    - values.yaml
    - helm template
    - '{{ .Values.hostNetwork'
    - nodeSelector
    - tolerations
    taint_sink_indicators:
    - 'hostNetwork: true'
    - 'hostPID: true'
    - 'hostIPC: true'
    - 'hostPort:'
    - 'dnsPolicy: ClusterFirstWithHostNet'
    sanitization_patterns:
    - 'hostNetwork: false'
    - 'hostPID: false'
    - 'hostIPC: false'
    - NetworkPolicy
    - calico GlobalNetworkPolicy
    - istio PeerAuthentication
    - pod-security.kubernetes.io/enforce
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.82
  exploit_scenario:
    attack_example: 'Lateral Movement via Host Network: An attacker in a pod with hostNetwork enabled can bind to any port on the host, intercept traffic intended for other services, access the kubelet
      API on 10250, reach the metadata service (169.254.169.254), and communicate with all other pods on the node bypassing Kubernetes NetworkPolicies. With hostPID, they can also inspect and ptrace host
      processes to steal credentials.

      '
    example_payload: '# With hostNetwork: scan for kubelet API

      curl -sk https://localhost:10250/pods

      # Access cloud metadata service

      curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/

      # With hostPID: inspect host processes

      ps aux

      cat /proc/1/environ

      # Sniff network traffic on the host

      tcpdump -i eth0 -w /tmp/capture.pcap

      '
    attacker_objective: 'Bypass network isolation, access the node''s network stack for lateral movement, steal cloud provider instance credentials from the metadata service, and intercept inter-pod communication.

      '
  confidence_factors:
    pattern_strength: 0.95
    context_match: 0.92
    proximity_to_user_input: 0.2
    sanitization_absence: 0.94
  impact: 'Pods sharing host namespaces can access host-level network services,

    processes, and IPC mechanisms, bypassing network policies and enabling

    lateral movement within the cluster. This violates CIS Kubernetes

    Benchmark 5.2.4 (hostNetwork), 5.2.2 (hostPID), and 5.2.3 (hostIPC).

    '
  remediation: "## Kubernetes Pod Security Standards\n- Set hostNetwork: false (default)\n- Set hostPID: false and hostIPC: false\n- Apply the PSS baseline profile which prohibits host namespaces\n\n##\
    \ CIS Benchmark References\n- CIS Kubernetes Benchmark 5.2.4: Minimize the admission of containers wishing to share the host network namespace\n- CIS Kubernetes Benchmark 5.2.2: Minimize the admission\
    \ of containers wishing to share the host process ID namespace\n- CIS Kubernetes Benchmark 5.2.3: Minimize the admission of containers wishing to share the host IPC namespace\n\n## Helm Chart Hardening\n\
    - Set hostNetwork: false as default in values.yaml\n- Add conditional checks: {{- if not .Values.hostNetwork }}\n- Validate templates: helm template . | conftest test -\n\n## OPA Rego Policy\n```rego\n\
    package kubernetes.admission\ndeny[msg] {\n  input.request.kind.kind == \"Pod\"\n  input.request.object.spec.hostNetwork == true\n  msg := \"Pods with host network access are not allowed\"\n}\ndeny[msg]\
    \ {\n  input.request.kind.kind == \"Pod\"\n  input.request.object.spec.hostPID == true\n  msg := \"Pods with host PID namespace are not allowed\"\n}\n```\n\n## Network Policy Enforcement\n- Use Kubernetes\
    \ NetworkPolicies for pod-to-pod communication\n- Deploy Calico or Cilium for advanced network policy enforcement\n- Use Istio AuthorizationPolicy for service mesh mTLS\n- Only use host networking for\
    \ system-level DaemonSets when required\n"
  references:
  - https://cwe.mitre.org/data/definitions/284.html
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1599/
  metadata:
    rule_version: 2.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-001
    - DEVOPS-YAML-009
    - DEVOPS-YAML-006
  detection_layer: 1
- rule_id: DEVOPS-YAML-004
  title: Hardcoded Secrets in YAML Configuration
  description: 'Detects hardcoded passwords, tokens, keys, and credentials in Kubernetes manifests, Docker Compose files, and CI/CD configuration. Secrets committed to version control persist in git history
    even after removal and can be harvested by anyone with repository access, including through leaked backups, forks, and CI/CD logs.

    '
  language: yaml
  category: devops
  severity: Critical
  confidence: 0.9
  cwe: CWE-798
  owasp: A07:2021-Identification-and-Authentication-Failures
  tags:
  - hardcoded-secrets
  - kubernetes
  - docker-compose
  - ci-cd
  - credential-exposure
  - cis-benchmark
  - secret-management
  - git-security
  patterns:
  - type: regex
    pattern: (?:password|passwd|secret|token|api_key|apikey|access_key|private_key)\s*:\s*['"]?[a-zA-Z0-9_/+=\-]{8,}['"]?
  - type: regex
    pattern: DATABASE_URL\s*:\s*['"]?(?:postgres|mysql|mongodb)://[^:]+:[^@]+@
  - type: regex
    pattern: (?:AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID)\s*:\s*['"]?[A-Za-z0-9/+=]{20,}['"]?
  - type: regex
    pattern: (?:GITHUB_TOKEN|GH_TOKEN|GITLAB_TOKEN|NPM_TOKEN)\s*:\s*['"]?[a-zA-Z0-9_\-]{20,}['"]?
  - type: regex
    pattern: data:\s*\n(?:\s+\w+:\s*[A-Za-z0-9+/=]{20,}\s*\n)+
  - type: regex
    pattern: (?:AZURE_CLIENT_SECRET|AZURE_TENANT_ID|AZURE_SUBSCRIPTION_ID)\s*:\s*['"]?[a-zA-Z0-9\-]{20,}['"]?
  - type: regex
    pattern: (?:GCP_SERVICE_ACCOUNT_KEY|GOOGLE_APPLICATION_CREDENTIALS)\s*:\s*['"]?[a-zA-Z0-9_/+=\-]{20,}['"]?
  - type: regex
    pattern: stringData\s*:\s*\n(?:\s+\w+:\s*\S{8,}\s*\n)+
  - type: regex
    pattern: (?:REDIS_PASSWORD|MONGO_PASSWORD|MYSQL_ROOT_PASSWORD|POSTGRES_PASSWORD)\s*:\s*['"]?[^\s$\{]{8,}['"]?
  - type: regex
    pattern: (?:smtp_password|mail_password|email_password)\s*:\s*['"]?[^\s$\{]{6,}['"]?
  - type: regex
    pattern: (?:SLACK_TOKEN|SLACK_WEBHOOK|DISCORD_TOKEN|TWILIO_AUTH)\s*:\s*['"]?[a-zA-Z0-9\-_/]{20,}['"]?
  - type: regex
    pattern: ssh-rsa\s+AAAA[0-9A-Za-z+/=]{100,}
  - type: regex
    pattern: '-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'
  anti_patterns:
  - secretKeyRef
  - valueFrom
  - ${{secrets.
  - ${{ secrets.
  - ${{
  - changeme
  - placeholder
  - example
  - TODO
  - vault.hashicorp
  - external-secrets.io
  - sealed-secrets
  - ExternalSecret
  - 'kind: SealedSecret'
  - 'sops:'
  - 'enc: '
  - ENC[
  - CHANGE_ME
  - your-password-here
  - password-goes-here
  - <REDACTED>
  - arn:aws:secretsmanager
  - gatekeeper.sh/constraint
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Secret'
    - 'kind: ConfigMap'
    - 'kind: Deployment'
    - docker-compose
    - 'env:'
    - 'environment:'
    - 'data:'
    - 'stringData:'
    - .github/workflows
    - .gitlab-ci.yml
    taint_source_indicators:
    - values.yaml
    - 'env:'
    - 'environment:'
    - 'data:'
    - 'stringData:'
    - configMapKeyRef
    - .env
    - docker-compose.yml
    taint_sink_indicators:
    - 'password:'
    - 'secret:'
    - 'token:'
    - 'api_key:'
    - 'connection_string:'
    - 'DATABASE_URL:'
    - 'credentials:'
    sanitization_patterns:
    - secretKeyRef
    - valueFrom
    - ExternalSecret
    - SealedSecret
    - vault.hashicorp.com
    - external-secrets.io
    - ${{ secrets.
    - sops encrypted
    - aws secretsmanager
    - Azure Key Vault
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.95
  exploit_scenario:
    attack_example: 'Secret Theft via Repository Access: An attacker gains read access to a repository (e.g., through a leaked token, insider threat, or public repo) containing hardcoded database credentials
      in a Kubernetes Secret manifest. They use the credentials to access the production database directly, exfiltrate customer data, or inject malicious records. Even if the secret is later removed from
      the file, it persists in git history.

      '
    example_payload: '# Extract secrets from git history

      git log --all --full-history -- "**/secrets.yaml" "**/configmap.yaml"

      git show <commit-hash>:k8s/secrets.yaml

      # Decode base64 Kubernetes secrets

      echo "cGFzc3dvcmQxMjM=" | base64 -d

      # Connect to exposed database

      psql "postgresql://admin:password123@db.example.com:5432/production"

      '
    attacker_objective: 'Harvest credentials from version control history, CI/CD logs, or artifact caches to gain unauthorized access to databases, cloud services, APIs, and internal systems.

      '
  confidence_factors:
    pattern_strength: 0.88
    context_match: 0.92
    proximity_to_user_input: 0.7
    sanitization_absence: 0.9
  impact: 'Hardcoded secrets in YAML configurations are committed to version control,

    exposing credentials to anyone with repository access, including in CI/CD logs.

    This violates CIS Benchmark 5.4.1 and can lead to full system compromise

    through credential reuse attacks.

    '
  remediation: "## Kubernetes Pod Security Standards\n- Use Kubernetes Secrets with encryption at rest (EncryptionConfiguration)\n- Never store secrets in ConfigMaps or plain YAML manifests\n\n## CIS Benchmark\
    \ References\n- CIS Kubernetes Benchmark 5.4.1: Prefer using secrets as files over secrets as environment variables\n- CIS Kubernetes Benchmark 5.4.2: Consider external secret storage\n\n## Helm Chart\
    \ Hardening\n- Use external-secrets operator with Helm charts\n- Reference secrets via secretKeyRef in values.yaml\n- Use sealed-secrets for GitOps: kubeseal --format yaml < secret.yaml > sealed-secret.yaml\n\
    - Never commit values files with actual secrets\n\n## OPA Rego Policy\n```rego\npackage kubernetes.admission\ndeny[msg] {\n  input.request.kind.kind == \"ConfigMap\"\n  value := input.request.object.data[key]\n\
    \  re_match(\"(?i)(password|secret|token|api.?key)\", key)\n  msg := sprintf(\"ConfigMap contains potential secret key: %v\", [key])\n}\n```\n\n## Additional Remediation\n- Use sealed-secrets for GitOps\
    \ workflows\n- Use HashiCorp Vault, AWS Secrets Manager, or Azure Key Vault\n- Use SOPS for encrypting secrets in git\n- Implement git pre-commit hooks (detect-secrets, gitleaks)\n- Rotate all exposed\
    \ credentials immediately\n- Scan git history: gitleaks detect --source=.\n"
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  - https://kubernetes.io/docs/concepts/configuration/secret/
