- rule_id: DEVOPS-YAML-012
  title: Missing Pod Disruption Budget
  description: 'Detects Kubernetes Deployments, StatefulSets, and ReplicaSets without corresponding PodDisruptionBudget (PDB) resources. Without a PDB, voluntary disruptions such as node drains, cluster
    upgrades, and autoscaler scale-downs can simultaneously terminate all replicas of a workload, causing application downtime. In adversarial scenarios, an attacker with node-level access can trigger mass
    pod evictions to cause denial of service.

    '
  language: yaml
  category: devops
  severity: Medium
  confidence: 0.8
  cwe: CWE-400
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - pod-disruption-budget
  - availability
  - denial-of-service
  - cluster-stability
  - high-availability
  - resilience
  detection_layer: 1
  attack_surface_type: availability
  patterns:
  - type: regex
    pattern: kind\s*:\s*Deployment\s*\n(?:(?!PodDisruptionBudget).){0,500}
  - type: regex
    pattern: kind\s*:\s*StatefulSet\s*\n(?:(?!PodDisruptionBudget).){0,500}
  - type: regex
    pattern: replicas\s*:\s*[2-9]\d*\s*\n(?:(?!PodDisruptionBudget).){0,500}
  - type: regex
    pattern: kind\s*:\s*(?:Deployment|StatefulSet)\s*\n(?:\s+.*\n){0,20}?\s+replicas\s*:\s*[2-9]
  - type: regex
    pattern: apiVersion\s*:\s*apps/v1\s*\nkind\s*:\s*(?:Deployment|StatefulSet)\s*\n(?:(?!minAvailable|maxUnavailable).){0,500}
  anti_patterns:
  - 'kind: PodDisruptionBudget'
  - policy/v1
  - minAvailable
  - maxUnavailable
  - 'replicas: 1'
  - gatekeeper.sh/constraint
  - kyverno.io/policy
  - '# single replica intended'
  - 'kind: Job'
  - 'kind: CronJob'
  bypass_variants:
  - description: PDB with minAvailable set to 0 offering no protection
    pattern: minAvailable\s*:\s*0
  - description: PDB with maxUnavailable matching total replicas
    pattern: maxUnavailable\s*:\s*100%
  - description: PDB selector not matching deployment labels
    pattern: PodDisruptionBudget(?:.*\n)*?selector(?:.*\n)*?matchLabels(?:.*\n)*?(?!app)
  evasion_indicators:
  - 'minAvailable: 0'
  - 'maxUnavailable: 100%'
  - mismatched selector labels
  - PDB in different namespace
  encoding_variants:
  - description: Helm conditional disabling PDB
    pattern: '{{-\s*if\s+\.Values\.pdb\.enabled\s*}}'
  - description: Kustomize patch removing PDB
    pattern: \$patch\s*:\s*delete.*PodDisruptionBudget
  multi_function_chain_patterns:
  - description: Multi-replica deployment without matching PDB
    chain:
    - 'kind: Deployment'
    - 'replicas: [2-9]'
    - no PodDisruptionBudget with matching selector
  privilege_context_flags:
    requires_cluster_admin: false
    requires_namespace_admin: true
    network_exposure: internal
  business_logic_indicator:
    data_sensitivity: medium
    compliance_relevant: true
    regulatory_frameworks:
    - SOC2
    - SLA-compliance
  probable_taint_paths:
  - source: Node drain or cluster upgrade event
    sink: All pod replicas terminated simultaneously
    propagation: Voluntary disruption without availability guarantee
  impact: 'Without PodDisruptionBudgets, cluster operations like node drains,

    upgrades, and autoscaler events can terminate all replicas of a

    workload simultaneously, causing application downtime. For

    stateful workloads, this can result in data loss or corruption.

    This is critical for meeting SLA and uptime requirements.

    '
  remediation: "## PodDisruptionBudget Configuration\n- Create a PDB for every production Deployment and StatefulSet with > 1 replica\n- Use minAvailable or maxUnavailable to guarantee minimum availability\n\
    \n## PDB Template\n```yaml\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: my-app-pdb\nspec:\n  minAvailable: 1\n  selector:\n    matchLabels:\n      app: my-app\n```\n\n## Best\
    \ Practices\n- Set minAvailable to at least 1 for critical workloads\n- Use percentage-based values for dynamic scaling: minAvailable: \"50%\"\n- Ensure PDB selector labels match the Deployment/StatefulSet\
    \ pod template labels\n- Test PDB effectiveness: kubectl drain node --dry-run\n\n## Additional Remediation\n- Use Helm chart helpers to auto-generate PDBs alongside Deployments\n- Enforce PDB creation\
    \ via OPA Gatekeeper or Kyverno policies\n- Monitor PDB violations in cluster events\n- Set appropriate terminationGracePeriodSeconds for graceful shutdown\n"
  references:
  - https://cwe.mitre.org/data/definitions/400.html
  - https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  - https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
  - https://attack.mitre.org/techniques/T1499/
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Deployment'
    - 'kind: StatefulSet'
    - 'kind: ReplicaSet'
    - 'replicas:'
    - 'spec:'
    - 'template:'
    - 'selector:'
    taint_source_indicators:
    - kubectl drain
    - cluster-autoscaler
    - node upgrade
    - spot instance termination
    taint_sink_indicators:
    - all replicas evicted
    - no PDB defined
    - missing minAvailable
    sanitization_patterns:
    - 'kind: PodDisruptionBudget'
    - minAvailable
    - maxUnavailable
    - policy/v1
    - topologySpreadConstraints
    - podAntiAffinity
  severity_scoring:
    severity_weight: 5
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.6
  exploit_scenario:
    attack_example: 'DoS via Node Drain Abuse: An attacker with RBAC permissions to drain nodes (e.g., through a compromised CI/CD service account or misconfigured RBAC) drains multiple nodes simultaneously.
      Without PDBs, all replicas of critical services are evicted at once, causing complete application downtime until the pods are rescheduled on remaining healthy nodes.

      '
    example_payload: '# Attacker with node drain permissions

      kubectl drain node-1 --ignore-daemonsets --delete-emptydir-data --force

      kubectl drain node-2 --ignore-daemonsets --delete-emptydir-data --force

      kubectl drain node-3 --ignore-daemonsets --delete-emptydir-data --force

      # All replicas evicted simultaneously - application offline

      kubectl get pods -l app=critical-service

      # No pods running

      '
    attacker_objective: 'Cause application-wide denial of service by triggering mass pod evictions through node drains or other voluntary disruption mechanisms, exploiting the absence of PodDisruptionBudgets.

      '
  confidence_factors:
    pattern_strength: 0.78
    context_match: 0.82
    proximity_to_user_input: 0.15
    sanitization_absence: 0.8
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: false
    requires_ai_validation: true
    high_impact_flag: false
    related_rules:
    - DEVOPS-YAML-007
    - DEVOPS-YAML-010
- rule_id: DEVOPS-YAML-013
  title: Insecure Service Account Token Auto-Mount
  description: 'Detects pods and service accounts with automountServiceAccountToken set to true (or not explicitly disabled), which automatically mounts the Kubernetes API token inside every pod. This token
    grants API access corresponding to the service account''s RBAC permissions and can be stolen by an attacker who compromises the pod to escalate privileges, enumerate cluster resources, and move laterally
    within the cluster.

    '
  language: yaml
  category: devops
  severity: High
  confidence: 0.9
  cwe: CWE-269
  owasp: A05:2021-Security-Misconfiguration
  tags:
  - kubernetes
  - service-account
  - token-mount
  - rbac
  - least-privilege
  - cis-benchmark
  - credential-exposure
  - lateral-movement
  detection_layer: 1
  attack_surface_type: identity
  patterns:
  - type: regex
    pattern: automountServiceAccountToken\s*:\s*true
  - type: regex
    pattern: kind\s*:\s*ServiceAccount\s*\n(?:(?!automountServiceAccountToken\s*:\s*false).){0,500}
  - type: regex
    pattern: kind\s*:\s*Pod\s*\n(?:(?!automountServiceAccountToken).){0,500}
  - type: regex
    pattern: serviceAccountName\s*:\s*\S+\s*\n(?:(?!automountServiceAccountToken\s*:\s*false).){0,500}
  - type: regex
    pattern: spec\s*:\s*\n(?:[ \t]+.{0,500}\n){0,20}?serviceAccountName\s*:\s*\w+\s*\n(?:(?!automountServiceAccountToken).){0,500}
  anti_patterns:
  - 'automountServiceAccountToken: false'
  - '# token not needed'
  - 'pod-security.kubernetes.io/enforce: restricted'
  - gatekeeper.sh/constraint
  - kyverno.io/policy
  - projected volume for token
  - TokenRequest API
  - audience-bound token
  - expirationSeconds
  bypass_variants:
  - description: Token mounted but with overly permissive RBAC role
    pattern: ClusterRoleBinding(?:.*\n)*?serviceAccount(?:.*\n)*?cluster-admin
  - description: Default service account with custom role bindings
    pattern: serviceAccountName\s*:\s*default(?:.*\n)*?RoleBinding
  - description: Token auto-mounted via namespace default SA
    pattern: kind\s*:\s*ServiceAccount\s*\n(?:.*\n)*?name\s*:\s*default
  evasion_indicators:
  - 'automountServiceAccountToken: true'
  - using default service account
  - no RBAC restrictions on SA
  - cluster-wide role binding
  encoding_variants:
  - description: Helm template defaulting to auto-mount
    pattern: '{{-\s*default\s+true\s+\.Values\.serviceAccount\.automount'
  - description: Kustomize patch enabling auto-mount
    pattern: automountServiceAccountToken\s*:\s*true
  multi_function_chain_patterns:
  - description: Pod with auto-mounted token and network access to API server
    chain:
    - 'automountServiceAccountToken: true'
    - serviceAccountName
    - no NetworkPolicy restricting API server access
  - description: Service account with cluster-admin and auto-mount
    chain:
    - 'kind: ServiceAccount'
    - ClusterRoleBinding
    - cluster-admin
  privilege_context_flags:
    requires_cluster_admin: false
    requires_namespace_admin: false
    network_exposure: internal
  business_logic_indicator:
    data_sensitivity: high
    compliance_relevant: true
    regulatory_frameworks:
    - PCI-DSS
    - SOC2
    - NIST-800-53
  probable_taint_paths:
  - source: Auto-mounted service account token at /var/run/secrets/kubernetes.io/serviceaccount/token
    sink: Kubernetes API server
    propagation: Token theft from compromised pod to API server authentication
  impact: 'Auto-mounted service account tokens provide every pod with API

    credentials that can be used to query the Kubernetes API, list

    secrets, create workloads, and escalate privileges depending on

    the service account''s RBAC bindings. This violates the principle

    of least privilege and CIS Kubernetes Benchmark 5.1.6.

    '
  remediation: "## Kubernetes Service Account Security\n- Set automountServiceAccountToken: false on all pods that do not need API access\n- Set automountServiceAccountToken: false on service accounts by\
    \ default\n- Use projected volume tokens with audience and expiration constraints\n\n## CIS Benchmark References\n- CIS Kubernetes Benchmark 5.1.5: Ensure that default service accounts are not actively\
    \ used\n- CIS Kubernetes Benchmark 5.1.6: Ensure that Service Account Tokens are only mounted where necessary\n\n## Pod-Level Disable Template\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
    \ my-pod\nspec:\n  automountServiceAccountToken: false\n  containers:\n    - name: app\n      image: my-app:latest\n```\n\n## OPA Rego Policy\n```rego\npackage kubernetes.admission\ndeny[msg] {\n  input.request.kind.kind\
    \ == \"Pod\"\n  not input.request.object.spec.automountServiceAccountToken == false\n  msg := \"Pods must set automountServiceAccountToken: false\"\n}\n```\n\n## Additional Remediation\n- Use bound\
    \ service account tokens (TokenRequest API) with short TTL\n- Apply least-privilege RBAC roles to service accounts\n- Block API server access with NetworkPolicies where possible\n- Use Workload Identity\
    \ (GKE) or IAM Roles for Service Accounts (EKS) instead\n"
  references:
  - https://cwe.mitre.org/data/definitions/269.html
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1528/
  - https://attack.mitre.org/techniques/T1550/001/
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Pod'
    - 'kind: Deployment'
    - 'kind: ServiceAccount'
    - 'serviceAccountName:'
    - 'automountServiceAccountToken:'
    - 'spec:'
    - 'template:'
    taint_source_indicators:
    - /var/run/secrets/kubernetes.io/serviceaccount/token
    - 'serviceAccountName:'
    - 'automountServiceAccountToken: true'
    - default service account
    taint_sink_indicators:
    - Kubernetes API server
    - kubectl commands from within pod
    - curl https://kubernetes.default.svc
    - API server on 443
    sanitization_patterns:
    - 'automountServiceAccountToken: false'
    - projected volume with audience
    - expirationSeconds
    - TokenRequest API
    - Workload Identity
    - IAM Roles for Service Accounts
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.88
  exploit_scenario:
    attack_example: 'Token Theft for Cluster Enumeration: An attacker exploits an SSRF or RCE vulnerability in a web application running in Kubernetes. They read the auto-mounted service account token from
      /var/run/secrets/kubernetes.io/serviceaccount/token and use it to query the Kubernetes API. If the service account has broad RBAC permissions, they enumerate all secrets, deploy a reverse shell DaemonSet,
      or create a new cluster-admin service account.

      '
    example_payload: "# Read the auto-mounted service account token\nTOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\nAPISERVER=https://kubernetes.default.svc\n# Enumerate cluster resources\n\
      curl -sk -H \"Authorization: Bearer $TOKEN\" $APISERVER/api/v1/namespaces\ncurl -sk -H \"Authorization: Bearer $TOKEN\" $APISERVER/api/v1/secrets\n# If SA has escalated permissions: create backdoor\n\
      curl -sk -H \"Authorization: Bearer $TOKEN\" -X POST \\\n  $APISERVER/api/v1/namespaces/default/serviceaccounts \\\n  -d '{\"metadata\":{\"name\":\"backdoor\"}}'\n"
    attacker_objective: 'Steal the auto-mounted Kubernetes API token to enumerate cluster resources, read secrets, escalate privileges via RBAC, and establish persistent access through new service accounts
      or backdoor deployments.

      '
  confidence_factors:
    pattern_strength: 0.9
    context_match: 0.9
    proximity_to_user_input: 0.35
    sanitization_absence: 0.92
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-002
    - DEVOPS-YAML-011
    - DEVOPS-YAML-010
- rule_id: DEVOPS-YAML-014
  title: Missing Ingress TLS Configuration
  description: 'Detects Kubernetes Ingress resources without TLS configuration, exposing web traffic in cleartext over HTTP. Without TLS termination at the ingress level, all traffic between clients and
    the cluster is transmitted unencrypted, enabling man-in-the-middle attacks, credential interception, session hijacking, and data exfiltration. This applies to both external and internal ingress endpoints.

    '
  language: yaml
  category: devops
  severity: High
  confidence: 0.89
  cwe: CWE-319
  owasp: A02:2021-Cryptographic-Failures
  tags:
  - kubernetes
  - ingress
  - tls
  - encryption
  - transport-security
  - cis-benchmark
  - cleartext
  - https
  detection_layer: 1
  attack_surface_type: network
  patterns:
  - type: regex
    pattern: kind\s*:\s*Ingress\s*\n(?:(?!tls\s*:).){0,500}
  - type: regex
    pattern: 'kind\s*:\s*Ingress\s*\n(?:.{0,500}\n){0,20}?spec\s*:\s*\n(?:(?!tls\s*:).){0,500}rules\s*:'
  - type: regex
    pattern: 'kind\s*:\s*Ingress\s*\n(?:.{0,500}\n){0,20}?annotations\s*:\s*\n(?:(?!ssl-redirect|force-ssl).){0,500}\n\s+spec\s*:'
  - type: regex
    pattern: nginx\.ingress\.kubernetes\.io/ssl-redirect\s*:\s*['"]?false['"]?
  - type: regex
    pattern: kind\s*:\s*Ingress\s*\n(?:.{0,500}\n){0,20}?rules\s*:\s*\n\s+-\s+host\s*:\s*\S+\s*\n(?:(?!tls).){0,500}
  anti_patterns:
  - 'tls:'
  - 'secretName:'
  - 'ssl-redirect: "true"'
  - 'force-ssl-redirect: "true"'
  - cert-manager.io
  - letsencrypt
  - acme
  - nginx.ingress.kubernetes.io/ssl-redirect
  - 'traefik.ingress.kubernetes.io/redirect-entry-point: https'
  - gatekeeper.sh/constraint
  bypass_variants:
  - description: TLS configured but ssl-redirect disabled allowing HTTP fallback
    pattern: tls\s*:(?:.*\n)*?ssl-redirect\s*:\s*['"]?false
  - description: Ingress with TLS but wildcard certificate for all domains
    pattern: tls\s*:\s*\n\s+-\s+hosts\s*:\s*\n\s+-\s*['"]?\*
  - description: TLS termination at LB but unencrypted backend
    pattern: backend-protocol\s*:\s*['"]?HTTP['"]?
  evasion_indicators:
  - 'ssl-redirect: false'
  - no tls block in spec
  - HTTP backend protocol
  - insecure port 80 only
  encoding_variants:
  - description: Helm template conditionally disabling TLS
    pattern: '{{-\s*if\s+\.Values\.ingress\.tls\.enabled\s*}}'
  - description: Kustomize overlay removing TLS section
    pattern: \$patch\s*:\s*delete.*tls
  multi_function_chain_patterns:
  - description: Ingress without TLS serving external traffic
    chain:
    - 'kind: Ingress'
    - 'host: *.example.com'
    - no tls block
  - description: Ingress with HTTP backend and no redirect
    chain:
    - 'kind: Ingress'
    - 'backend-protocol: HTTP'
    - 'ssl-redirect: false'
  privilege_context_flags:
    requires_cluster_admin: false
    requires_namespace_admin: true
    network_exposure: external
  business_logic_indicator:
    data_sensitivity: high
    compliance_relevant: true
    regulatory_frameworks:
    - PCI-DSS
    - HIPAA
    - SOC2
    - GDPR
  probable_taint_paths:
  - source: Client HTTP request to ingress endpoint
    sink: Backend service receiving cleartext traffic
    propagation: Unencrypted network path from client through ingress to pod
  impact: 'Ingress resources without TLS expose all web traffic in cleartext,

    enabling interception of authentication credentials, session tokens,

    API keys, and sensitive data. This violates PCI-DSS Requirement 4.1

    (encrypt transmission of cardholder data), HIPAA security rules, and

    general security best practices for transport encryption.

    '
  remediation: "## Kubernetes Ingress TLS Configuration\n- Add TLS section to every Ingress resource\n- Enable SSL redirect annotations to force HTTPS\n- Use cert-manager for automated certificate management\n\
    \n## TLS Ingress Template\n```yaml\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: my-ingress\n  annotations:\n    nginx.ingress.kubernetes.io/ssl-redirect: \"true\"\n    cert-manager.io/cluster-issuer:\
    \ letsencrypt-prod\nspec:\n  tls:\n    - hosts:\n        - app.example.com\n      secretName: app-tls-cert\n  rules:\n    - host: app.example.com\n      http:\n        paths:\n          - path: /\n\
    \            pathType: Prefix\n            backend:\n              service:\n                name: my-service\n                port:\n                  number: 443\n```\n\n## CIS Benchmark References\n\
    - Ensure all externally facing services use TLS 1.2+\n- Configure HSTS headers for web applications\n- Use end-to-end encryption from ingress to backend pods\n\n## Additional Remediation\n- Deploy cert-manager\
    \ with Let's Encrypt for auto-renewal\n- Use HSTS preloading for critical domains\n- Enforce TLS via OPA/Kyverno admission policies\n- Monitor certificate expiration with cert-manager alerts\n"
  references:
  - https://cwe.mitre.org/data/definitions/319.html
  - https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  - https://cert-manager.io/docs/
  - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
  - https://attack.mitre.org/techniques/T1557/
  context_awareness:
    surrounding_context_patterns:
    - 'kind: Ingress'
    - networking.k8s.io/v1
    - 'spec:'
    - 'rules:'
    - 'host:'
    - 'annotations:'
    - 'tls:'
    taint_source_indicators:
    - values.yaml
    - '{{ .Values.ingress'
    - 'host:'
    - 'rules:'
    - 'paths:'
    taint_sink_indicators:
    - no tls block
    - 'ssl-redirect: false'
    - HTTP backend
    - 'port: 80'
    sanitization_patterns:
    - 'tls:'
    - 'secretName:'
    - cert-manager.io
    - 'ssl-redirect: true'
    - 'force-ssl-redirect: true'
    - HSTS
  severity_scoring:
    severity_weight: 8
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.82
  exploit_scenario:
    attack_example: 'Credential Interception via HTTP Downgrade: An attacker performs a man-in-the-middle attack on the network path between users and a Kubernetes Ingress endpoint that lacks TLS. They
      intercept login credentials, session cookies, and API tokens transmitted in cleartext. With the stolen credentials, they authenticate as legitimate users and access sensitive application data.

      '
    example_payload: '# Network sniffing on the path to unprotected ingress

      tcpdump -i eth0 -A ''port 80 and host app.example.com''

      # Extract credentials from captured HTTP traffic

      strings capture.pcap | grep -i "password\|token\|session"

      # Use stolen session cookie

      curl -H "Cookie: session=stolen_token_value" https://app.example.com/admin

      # ARP spoofing for MITM position

      arpspoof -i eth0 -t victim_ip gateway_ip

      '
    attacker_objective: 'Intercept cleartext HTTP traffic containing authentication credentials, session tokens, and sensitive data by exploiting the absence of TLS encryption on Kubernetes Ingress endpoints.

      '
  confidence_factors:
    pattern_strength: 0.88
    context_match: 0.9
    proximity_to_user_input: 0.5
    sanitization_absence: 0.89
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: low
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: false
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-010
    - DEVOPS-YAML-015
    - DEVOPS-YAML-004
- rule_id: DEVOPS-YAML-015
  title: Unencrypted etcd Data at Rest
  description: 'Detects Kubernetes API server and etcd configurations that lack encryption at rest for stored data. By default, Kubernetes stores all data (including Secrets, ConfigMaps, and custom resources)
    in etcd as base64-encoded plaintext. Without an EncryptionConfiguration specifying AES-CBC, AES-GCM, or KMS-based encryption, anyone with direct etcd access or etcd backup access can read all cluster
    secrets in cleartext.

    '
  language: yaml
  category: devops
  severity: Critical
  confidence: 0.91
  cwe: CWE-311
  owasp: A02:2021-Cryptographic-Failures
  tags:
  - kubernetes
  - etcd
  - encryption-at-rest
  - secrets
  - data-protection
  - cis-benchmark
  - kms
  - compliance
  detection_layer: 1
  attack_surface_type: storage
  patterns:
  - type: regex
    pattern: resources\s*:\s*\n\s+-\s+resources\s*:\s*\n\s+-\s+secrets\s*\n\s+providers\s*:\s*\n\s+-\s+identity\s*:\s*\{\}
  - type: regex
    pattern: --encryption-provider-config\s*=\s*$
  - type: regex
    pattern: kind\s*:\s*EncryptionConfiguration\s*\n(?:.*\n){0,20}?providers\s*:\s*\n\s+-\s+identity\s*:\s*\{\}
  - type: regex
    pattern: apiVersion\s*:\s*apiserver\.config\.k8s\.io/v1\s*\nkind\s*:\s*EncryptionConfiguration\s*\n(?:.*\n){0,20}?identity\s*:\s*\{\}
  - type: regex
    pattern: command\s*:\s*\n(?:\s+-\s+.*\n){0,15}?(?!.*--encryption-provider-config)\s+-\s+kube-apiserver
  anti_patterns:
  - 'aescbc:'
  - 'aesgcm:'
  - 'secretbox:'
  - 'kms:'
  - --encryption-provider-config=/etc/kubernetes
  - "providers:\n      - aescbc:"
  - "providers:\n      - kms:"
  - EncryptionConfiguration
  - gatekeeper.sh/constraint
  - vault.hashicorp.com
  bypass_variants:
  - description: Identity provider listed first making encryption ineffective
    pattern: providers\s*:\s*\n\s+-\s+identity\s*:\s*\{\}\s*\n\s+-\s+aescbc
  - description: Encryption config present but not referenced by API server
    pattern: EncryptionConfiguration(?:.*\n)*?(?!--encryption-provider-config)
  - description: Weak encryption key hardcoded in config
    pattern: secret\s*:\s*[A-Za-z0-9+/=]{16,}\s*\n
  evasion_indicators:
  - 'identity: {}'
  - no --encryption-provider-config
  - identity provider first in list
  - hardcoded encryption key
  encoding_variants:
  - description: Base64 encoded etcd data without encryption layer
    pattern: stringData converted to data with base64 only
  - description: Helm template skipping encryption configuration
    pattern: '{{-\s*if\s+\.Values\.etcd\.encryption\.enabled\s*}}'
  multi_function_chain_patterns:
  - description: API server without encryption config plus etcd without TLS
    chain:
    - kube-apiserver
    - no --encryption-provider-config
    - etcd without --cert-file
  - description: Encryption config with identity first then real provider
    chain:
    - EncryptionConfiguration
    - 'identity: {}'
    - 'aescbc: or kms:'
  privilege_context_flags:
    requires_cluster_admin: true
    requires_namespace_admin: false
    network_exposure: internal
  business_logic_indicator:
    data_sensitivity: critical
    compliance_relevant: true
    regulatory_frameworks:
    - PCI-DSS
    - HIPAA
    - SOC2
    - GDPR
    - FedRAMP
  probable_taint_paths:
  - source: Kubernetes Secrets stored in etcd
    sink: etcd data directory or backup files
    propagation: Plaintext base64 data accessible via etcd API or filesystem access
  impact: 'Without encryption at rest, all Kubernetes Secrets (database passwords,

    TLS certificates, API keys, service account tokens) are stored as

    base64-encoded plaintext in etcd. Anyone with direct etcd access,

    etcd backup access, or host filesystem access to etcd data directories

    can decode and steal all cluster secrets. This violates CIS Kubernetes

    Benchmark 1.2.29 and compliance frameworks requiring data-at-rest

    encryption (PCI-DSS 3.4, HIPAA 164.312(a)(2)(iv)).

    '
  remediation: "## Kubernetes Encryption at Rest\n- Create an EncryptionConfiguration with aescbc, aesgcm, or kms provider\n- Pass --encryption-provider-config to kube-apiserver\n- Ensure the encryption\
    \ provider is listed BEFORE identity in the providers list\n\n## EncryptionConfiguration Template\n```yaml\napiVersion: apiserver.config.k8s.io/v1\nkind: EncryptionConfiguration\nresources:\n  - resources:\n\
    \      - secrets\n    providers:\n      - aescbc:\n          keys:\n            - name: key1\n              secret: <base64-encoded-32-byte-key>\n      - identity: {}\n```\n\n## CIS Benchmark References\n\
    - CIS Kubernetes Benchmark 1.2.29: Ensure that the --encryption-provider-config argument is set as appropriate\n- CIS Kubernetes Benchmark 1.2.30: Ensure that encryption providers are appropriately\
    \ configured\n\n## KMS-Based Encryption (Recommended for Production)\n- Use AWS KMS, GCP Cloud KMS, or Azure Key Vault for key management\n- Configure KMS provider plugin for automatic key rotation\n\
    - Ensure etcd data directory has restrictive file permissions (700)\n\n## Additional Remediation\n- Encrypt existing secrets: kubectl get secrets --all-namespaces -o json | kubectl replace -f -\n- Rotate\
    \ encryption keys periodically\n- Enable etcd TLS for transport encryption\n- Restrict etcd access to API server nodes only\n- Monitor etcd access logs for unauthorized reads\n"
  references:
  - https://cwe.mitre.org/data/definitions/311.html
  - https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
  - https://www.cisecurity.org/benchmark/kubernetes
  - https://attack.mitre.org/techniques/T1552/
  - https://etcd.io/docs/v3.5/op-guide/security/
  context_awareness:
    surrounding_context_patterns:
    - 'kind: EncryptionConfiguration'
    - apiserver.config.k8s.io
    - kube-apiserver
    - etcd
    - 'providers:'
    - --encryption-provider-config
    - 'resources:'
    taint_source_indicators:
    - etcd data directory
    - etcd backup
    - /var/lib/etcd
    - ETCDCTL_API=3
    - etcdctl get
    taint_sink_indicators:
    - 'identity: {}'
    - base64 encoded secrets
    - no encryption provider
    - plaintext etcd data
    sanitization_patterns:
    - 'aescbc:'
    - 'aesgcm:'
    - 'secretbox:'
    - 'kms:'
    - --encryption-provider-config
    - EncryptionConfiguration
    - KMS plugin
  severity_scoring:
    severity_weight: 10
    risk_score_formula_hint: severity_weight * confidence * (1 + exploitability_score) / 2
    exploitability_score: 0.9
  exploit_scenario:
    attack_example: 'Secret Theft via etcd Backup Exfiltration: An attacker gains access to an etcd backup file (e.g., through a misconfigured S3 bucket, compromised backup system, or host filesystem access).
      Without encryption at rest, they extract all Kubernetes Secrets by parsing the etcd data. They decode every base64-encoded Secret to recover database passwords, TLS private keys, cloud provider credentials,
      and service account tokens, achieving full cluster and infrastructure compromise.

      '
    example_payload: "# Access etcd backup or live etcd\nETCDCTL_API=3 etcdctl --endpoints=https://etcd:2379 \\\n  --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\n  --cert=/etc/kubernetes/pki/etcd/server.crt\
      \ \\\n  --key=/etc/kubernetes/pki/etcd/server.key \\\n  get /registry/secrets --prefix --keys-only\n# Read specific secret in plaintext\nETCDCTL_API=3 etcdctl get /registry/secrets/default/database-credentials\n\
      # Base64 decode the value\necho \"cGFzc3dvcmQxMjM=\" | base64 -d\n# Result: password123\n"
    attacker_objective: 'Access etcd data directly or through backups to extract all Kubernetes Secrets in plaintext, gaining credentials for databases, cloud services, TLS certificates, and API tokens
      for full infrastructure compromise.

      '
  confidence_factors:
    pattern_strength: 0.92
    context_match: 0.91
    proximity_to_user_input: 0.15
    sanitization_absence: 0.93
  metadata:
    rule_version: 3.0.0
    last_reviewed: '2025-01-15'
    rule_maturity_level: stable
    detection_complexity: medium
  cross_rule_intelligence:
    cross_file_risk_flag: true
    requires_ai_validation: true
    high_impact_flag: true
    related_rules:
    - DEVOPS-YAML-004
    - DEVOPS-YAML-014
    - DEVOPS-YAML-013
