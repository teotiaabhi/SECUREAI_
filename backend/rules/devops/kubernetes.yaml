  severity: Medium
  confidence: 0.8
  cwe: CWE-200
  owasp: A01:2021-Broken-Access-Control
  detection_layer: 2
  tags:
  - kubernetes
  - service-account
  - token
  patterns:
  - type: regex
    pattern: automountServiceAccountToken:\s*true
  anti_patterns:
  - 'automountServiceAccountToken: false'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: K8S-SEC-013
  title: Dangerous Capabilities Added
  description: 'Detects containers with dangerous Linux capabilities.

    '
  language: kubernetes
  category: devops
  severity: High
  confidence: 0.9
  cwe: CWE-250
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 1
  tags:
  - kubernetes
  - capabilities
  - security-context
  patterns:
  - type: regex
    pattern: add:\s*\[.*(?:SYS_ADMIN|SYS_PTRACE|NET_RAW|ALL)\b
  - type: regex
    pattern: add:\s*\n\s+-\s*(?:SYS_ADMIN|SYS_PTRACE|NET_RAW|ALL)\b
  anti_patterns:
  - 'drop:'
  - '# required'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
