- rule_id: K8S-SEC-010
  title: Missing Resource Limits
  description: 'Detects containers without CPU or memory resource limits.

    '
  language: kubernetes
  category: devops
  severity: Medium
  confidence: 0.78
  cwe: CWE-770
  owasp: A05:2021-Security-Misconfiguration
  detection_layer: 2
  tags:
  - kubernetes
  - resources
  - limits
  patterns:
  - type: regex
    pattern: containers:\s*\n(?:(?!\s+resources:).*\n)+
  anti_patterns:
  - 'resources:'
  - 'limits:'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: K8S-SEC-011
  title: Latest Image Tag
  description: 'Detects container images using ''latest'' or no tag.

    '
  language: kubernetes
  category: devops
  severity: Medium
  confidence: 0.85
  cwe: CWE-829
  owasp: A08:2021-Software-and-Data-Integrity-Failures
  detection_layer: 1
  tags:
  - kubernetes
  - image
  - tag
  patterns:
  - type: regex
    pattern: image:\s*[\w./:-]+:latest\b
  - type: regex
    pattern: image:\s*[\w./]+\s*$
  anti_patterns:
  - 'sha256:'
  - '@sha256'
  impact: Infrastructure misconfigurations can expose systems to attack and data breaches
  remediation: Follow security hardening guides, implement least privilege, enable audit logging
- rule_id: K8S-SEC-012
  title: Service Account Token Auto-Mount
  description: 'Detects pods with auto-mounted service account tokens.

    '
