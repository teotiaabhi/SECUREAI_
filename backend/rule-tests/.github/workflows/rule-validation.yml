name: Rule Engine Validation

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/rules/**'
      - 'backend/rule-tests/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/rules/**'
      - 'backend/rule-tests/**'
  workflow_dispatch:
    inputs:
      save_baseline:
        description: 'Save baseline with this tag (leave empty to skip)'
        required: false
        type: string

jobs:
  validate-rules:
    name: Validate Security Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/rule-tests/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/rule-tests/requirements.txt

      - name: Run rule validation suite
        working-directory: backend/rule-tests
        run: |
          python run_tests.py \
            --report console,json,markdown \
            --workers 4 \
            --verbose
        env:
          RULE_TEST_RULES_DIR: ${{ github.workspace }}/backend/rules
          RULE_TEST_TESTS_DIR: ${{ github.workspace }}/backend/rule-tests

      - name: Run pytest integration tests
        working-directory: backend/rule-tests
        run: |
          pytest conftest.py \
            -v \
            --tb=short \
            --junitxml=reports/junit-results.xml \
            -x
        env:
          RULE_TEST_RULES_DIR: ${{ github.workspace }}/backend/rules
          RULE_TEST_TESTS_DIR: ${{ github.workspace }}/backend/rule-tests

      - name: Check for regressions
        if: github.event_name == 'pull_request'
        working-directory: backend/rule-tests
        run: |
          python run_tests.py \
            --check-regression \
            --fail-on-regression \
            --report json
        continue-on-error: true

      - name: Save baseline (manual trigger)
        if: github.event.inputs.save_baseline != ''
        working-directory: backend/rule-tests
        run: |
          python run_tests.py \
            --save-baseline "${{ github.event.inputs.save_baseline }}" \
            --report json

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-validation-reports
          path: |
            backend/rule-tests/reports/*.json
            backend/rule-tests/reports/*.md
            backend/rule-tests/reports/junit-results.xml
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const glob = require('glob');
            const reportDir = 'backend/rule-tests/reports';

            // Find the latest markdown report.
            const mdFiles = fs.readdirSync(reportDir)
              .filter(f => f.endsWith('.md') && f.startsWith('report_'))
              .sort()
              .reverse();

            if (mdFiles.length === 0) {
              console.log('No markdown report found; skipping PR comment.');
              return;
            }

            const reportContent = fs.readFileSync(
              `${reportDir}/${mdFiles[0]}`, 'utf8'
            );

            // Truncate if too long for a PR comment.
            const maxLen = 60000;
            const body = reportContent.length > maxLen
              ? reportContent.substring(0, maxLen) + '\n\n... (truncated)'
              : reportContent;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Rule Validation Results\n\n${body}`,
            });
