# ==============================================================================
# Test:     negative_02_sealed_secret
# Expected: Must NOT trigger rule DEVOPS-YAML-004 (no hardcoded secrets)
# Category: DevOps
# Language: YAML (Kubernetes)
# ==============================================================================
# Description: Uses Bitnami SealedSecret with encrypted values instead of
# plaintext secrets. SealedSecrets are encrypted client-side and can only be
# decrypted by the controller running in the target cluster.
# ==============================================================================

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-database-credentials
  namespace: backend
  labels:
    app: payment-service
    component: database
    managed-by: sealed-secrets
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    DB_USERNAME: AgBY8z...encrypted-base64-blob...Qk3xR==
    DB_PASSWORD: AgCW4f...encrypted-base64-blob...Mn9pL==
    DB_HOST: AgDR7j...encrypted-base64-blob...Xv2wK==
    REDIS_AUTH_TOKEN: AgEP3m...encrypted-base64-blob...Hy6tN==
  template:
    metadata:
      name: app-database-credentials
      namespace: backend
      labels:
        app: payment-service
        component: database
    type: Opaque

---

# Deployment referencing secrets via secretKeyRef (safe pattern)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: app
          image: registry.internal.io/payments/service:2.0.0
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:              # SAFE: references K8s Secret object
                  name: app-database-credentials
                  key: DB_PASSWORD
            - name: REDIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-database-credentials
                  key: REDIS_AUTH_TOKEN
