{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secureai.fullname" . }}-secrets
  labels:
    {{- include "secureai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- else if .Values.postgresql.existingSecret }}
  # DATABASE_URL sourced from existing secret {{ .Values.postgresql.existingSecret }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.pplxApiKey }}
  PPLX_API_KEY: {{ .Values.secrets.pplxApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppPrivateKey }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secrets.githubAppPrivateKey | quote }}
  {{- end }}
{{- end }}
