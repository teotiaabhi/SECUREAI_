apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "secureai.fullname" . }}-api
  labels:
    {{- include "secureai.apiLabels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "secureai.apiSelectorLabels" . | nindent 6 }}
---
{{- if .Values.worker.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "secureai.fullname" . }}-worker
  labels:
    {{- include "secureai.workerLabels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "secureai.workerSelectorLabels" . | nindent 6 }}
{{- end }}
