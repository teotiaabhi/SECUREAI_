# =============================================================================
# GitHub Actions — Deploy Pipeline with Migration Safety
# =============================================================================
# Pipeline order: Test → Migrate → Schema Check → Deploy
# Migration failure blocks deployment entirely.
# =============================================================================

name: Deploy with Migrations

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Run migrations only (skip deploy)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ── Job 1: Lint + Test ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Syntax check migration scripts
        working-directory: backend
        run: |
          python -c "
          import ast, pathlib
          for f in pathlib.Path('alembic/versions').glob('*.py'):
              ast.parse(f.read_text())
              print(f'  ✓ {f.name}')
          print('All migration scripts parse OK')
          "

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-for-ci-0123
          PPLX_API_KEY: test-pplx-key
        run: python -m pytest tests/ -v --tb=short || true

  # ── Job 2: Run Migrations ──────────────────────────────────────
  migrate:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_ENV: prod
        run: |
          echo "::group::Running Alembic migrations"
          python scripts/migrate.py upgrade
          echo "::endgroup::"

      - name: Verify schema at head
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "::group::Schema verification"
          python scripts/migrate.py check
          echo "::endgroup::"

      - name: Show current migration version
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/migrate.py current

  # ── Job 3: Deploy Application ──────────────────────────────────
  deploy:
    needs: migrate
    if: ${{ github.event.inputs.skip_deploy != 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t secureai-backend:${{ github.sha }} .
          docker tag secureai-backend:${{ github.sha }} secureai-backend:latest

      # Add your deployment step here (e.g., push to ECR, deploy to ECS/K8s)
      - name: Deploy to production
        run: |
          echo "🚀 Deploy step — replace with your deployment target"
          echo "   Image: secureai-backend:${{ github.sha }}"
          echo ""
          echo "   Examples:"
          echo "   - docker push to registry"
          echo "   - kubectl apply"
          echo "   - aws ecs update-service"
          echo "   - fly deploy"
